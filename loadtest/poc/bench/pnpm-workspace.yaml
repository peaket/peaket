# PoC 측정 도구 전용 작업 공간(뿌리 작업 공간과 따로). 보안 설정은 뿌리 pnpm-workspace.yaml과 같다(docs/devops.md §4.4)
minimumReleaseAge: 4320
trustPolicy: no-downgrade
blockExoticSubdeps: true
strictDepBuilds: true
trustLockfile: false
allowBuilds:
  '@confluentinc/kafka-javascript': true  # Kafka 기본 클라이언트(뿌리와 같은 판). 설치 스크립트가 미리 빌드한 librdkafka 바인딩을 받는다
  protobufjs: false  # 거부(돌리지 않음): GLIDE가 끌고 오는 판 표기 경고 스크립트. 뿌리와 같은 판단(docs/devops.md §4.4)
