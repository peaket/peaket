# 연결 설정. 값은 모두 환경 변수에서 읽는다(비밀을 파일에 두지 않는다). 운영 사용자는 an_transform(analytics §11).
analytics:
  target: "{{ env_var('PEAKET_DBT_TARGET', 'local') }}"
  outputs:
    local:
      type: clickhouse
      host: "{{ env_var('PEAKET_ANALYTICS_CLICKHOUSE_HOST', '127.0.0.1') }}"
      port: "{{ env_var('PEAKET_ANALYTICS_CLICKHOUSE_PORT', '8123') | int }}"
      user: "{{ env_var('PEAKET_ANALYTICS_CLICKHOUSE_USER', 'an_transform') }}"
      password: "{{ env_var('PEAKET_ANALYTICS_CLICKHOUSE_PASSWORD', '') }}"
      schema: default
      secure: false
      threads: 1
      connect_timeout: 10
      send_receive_timeout: 1200
