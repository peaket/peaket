# PEAKET 분석 변환(docs/features/analytics.md §4·§5, ADR-0052 결정 4, F-04-4).
# 층: staging(stg_, 브론즈 JSON → 칸) → silver(slv_, eventKey 중복 제거, 회차 단위 delete+insert) → gold(fct_·dim_, run_id 판 + gold.current_run).
# 재실행 단위는 회차다: --vars '{event_id: <UUID>, run_id: <UUID>, stage: R0|R1|R2|R3}'. 변수는 macros/guards.sql이 형식을 본 뒤에만 SQL에 넣는다(§4.1 'SQL 규칙').
name: analytics
version: "0.1.0"
config-version: 2
profile: analytics

# 사용 통계를 바깥으로 보내지 않는다(개인정보·외부 전송 금지, 이 저장소 규칙)
flags:
  send_anonymous_usage_stats: false
  use_colors: false

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
target-path: target
clean-targets: [target, dbt_packages]

# 지표 뷰(mtr_*)가 읽는 현재 판 표와 골드 데이터베이스가 먼저 있어야 뷰를 만들 수 있다(F-04-5)
on-run-start:
  - "CREATE DATABASE IF NOT EXISTS gold"
  - "{{ ensure_current_run() }}"

vars:
  event_id: null
  run_id: null
  stage: R0
  # 작은 칸 합치기 기준(analytics §5.2 끝 줄, §11) [가정]
  small_cell_min: 5
  # 마감 실행기(F-04-6)가 넘기는 바깥 품질 검사 실패(커버리지·실시간 대비·정확성, analytics §7): 걸린 지표 코드 목록. 그 지표의 규칙은 '판정 보류(데이터 품질 실패)'
  quality_failed: []
  # 판 잇기(마감 실행기 F-04-6, macros/close.sql): R2 판 ID(온세일 동결), 앞 현재 판 ID와 그보다 앞선 날을 옮길 기준 날짜
  onsale_run: null
  carry_run: null
  carry_before: null
  # KST 공휴일(마감 실행기가 PEAKET_HOLIDAY_CALENDAR_FILE에서 읽어 넘긴다). dim_date의 영업일·공휴일 칸에 쓴다
  holidays: []

models:
  analytics:
    staging:
      +schema: staging
      +materialized: view
    silver:
      +schema: silver
      +materialized: incremental
      +incremental_strategy: delete+insert
      +unique_key: event_id
    gold:
      +schema: gold
      +materialized: incremental
      +incremental_strategy: append
    # 지표 사전·규칙 판정(analytics §6, F-04-5): 판마다 쌓는 표(metric_value·quality_check·fct_rule_check)와 현재 판만 읽는 지표 뷰(mtr_*)
    metrics:
      +schema: gold
      +materialized: incremental
      +incremental_strategy: append

seeds:
  analytics:
    # 고정 차원(analytics §5.3 '고정'): 결제사·결제 수단·결과·봇 범주·배정 방식
    +schema: gold
