# Trivy 이미지 비밀 검사의 규칙 설정(docs/devops.md §4.4 '외부 보안 검사 게이트'·'리뷰 뒤 더한 규칙' ④, ADR-0263 결정 7·13, BUILD_ORDER BAS-011 ②).
# tools/ci/scan-tools.mjs trivy-image가 --secret-config로 준다(실제 묶음 전에 미끼 묶음도 같은 설정으로 본다). 내장 검사 규칙은 그대로 쓰고
# (규칙 끄기·내장 규칙 고르기를 두지 않는다), Trivy 0.76.1의 내장 허용 규칙(시험·예시·벤더·usr 폴더 등의 경로를 건너뜀)은 모두 끈다.
# 오탐은 allow-rules에만 둔다: 줄마다 id, 까닭(description), 좁은 경로(path)나 꼴(regex). Trivy는 node_modules를 늘 건너뛰므로 그 안의
# 우리 코드의 비밀은 저장소 gitleaks 검사가 맡는다(남는 한계).
disable-allow-rules:
  - dist-info
  - tests
  - examples
  - vendor
  - usr-dirs
  - locale-dir
  - markdown
  - node.js
  - golang
  - python
  - rubygems
  - wordpress
  - anaconda-log
allow-rules: []
