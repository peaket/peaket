# 로컬 kind 클러스터 시험(docs/devops.md §3.1 ci-kind, docs/infra.md §3 'CI 시험 환경도 같은 구성', openspec 변경
# add-local-cluster-and-relay-deployment). ci.yml이 바뀐 범위에 kind가 있거나 develop에 푸시했을 때 부른다.
# 로컬과 같은 스크립트(tools/local)로 kind 클러스터(Strimzi Kafka 3.9.1, PostgreSQL 18, 계정 없는 AWS 흉내 서버)를 띄운다.
# 도구와 이미지는 판·해시·다이제스트로 고정했다. 비밀이 필요 없어 포크 PR에서도 돈다(비밀이 필요한 단계는 tools/ci/fork-guard.mjs를 거친다).
# 구간 5(인프라 구축, ADR-0332) 전까지는 ci.yml이 부르지 않고(저장소 변수 PEAKET_KIND_IN_CI가 'true'일 때만, ADR-0331 결정 9)
# 예약 실행도 하지 않는다. 클러스터가 필요하면 수동 실행으로 돌린다(소유자 결정 2026-11-21, ADR-0332 결정 1).
# 클러스터 없이 도는 tools/local/*.test.mjs는 tools-check.yml로 옮겼다
name: ci-kind

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kind:
    runs-on: ubuntu-24.04
    # BAT-075 e2e 둘(각 시험 상한 15분)을 더해 70분에서 늘렸다
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 실행기 기본 여유 공간(약 14GB)이 kind 노드 이미지·이미지 빌드·pnpm 저장소에 모자라 'No space left on device'로 실패했다
      # (2026-11-03 첫 원격 CI). 이 잡이 쓰지 않는 기본 도구를 지워 자리를 낸다
      - run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # 클러스터 도구가 YAML 해석기(뿌리 개발 의존성 yaml)를 쓴다. 잠금 파일대로만 설치한다(§4.4)
      - run: |
          pm=$(node -p "require('./package.json').packageManager")
          case "$pm" in pnpm@[0-9]*) ;; *) echo "::error::packageManager가 pnpm@<판>이 아니다: $pm"; exit 1 ;; esac
          npm install --global "$pm"
      - run: pnpm install --frozen-lockfile
      # 도구 받기(판·해시)·Strimzi 설치 파일 고치기·공용 차트 렌더 시험(tools/local/*.test.mjs)은 클러스터가 필요 없어 tools-check.yml이 돈다(ADR-0331 결정 9)
      - run: node tools/local/cluster.mjs up
      - run: node tools/local/cluster.mjs image
      # 계정 없는 AWS 흉내 서버의 기능 확인과 V-T28 ①의 kind 부분(실제 Lease API로 리더 이어받기)
      - run: node --test tools/local/e2e/aws-emulator.e2e.mjs tools/local/e2e/relay-takeover.e2e.mjs
      # 로컬 관측 최소(Prometheus·Grafana·템플릿 대시보드). relay-takeover가 올린 example-svc를 긁으므로 그 뒤에 따로 돈다
      - run: node --test tools/local/e2e/observability.e2e.mjs
      # 준비 프로브와 이벤트 루프 막기 비교(D-T19 ③④)와 진단 수집(D-T18 ①, RB-31)(BUILD_ORDER BAS-080, BAT-075 계획 '시험 이의' TO-2). 앞 단계가 만든
      # example-svc 이미지·PostgreSQL·AWS 흉내 서버(peaket-local/svc/aws)와 실행기의 AWS CLI를 쓰고 이름공간 probes-e2e·diagnose-e2e를 따로 쓴다.
      # 증거 버킷은 diagnose 시험이 만든다. 결과 줄(docs/review/measurements 폴더의 BAT-075-probes.md·BAT-075-diagnose.md)은 커밋하지 않고 산출물로 올린다
      - run: node --test --test-timeout=900000 tools/local/e2e/probes.e2e.mjs
      # 진단 수집 e2e 둘(heap·report 주석 → moto 증거 객체, D-T18 ①, docs/infra.md RB-31, BAT-080 G1). 앞 단계가 만든 example-svc 이미지·moto를 쓰고
      # 이름공간 diagnose-e2e와 버킷 peaket-diag-e2e를 스스로 만든다. 실패하면 아래 수집 단계가 파드 전·현재 로그·/diag 목록·버킷 전체·moto 로그를 남긴다
      - run: node --test --test-timeout=900000 tools/local/e2e/diagnose.e2e.mjs
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kind-bat075-measurements
          path: |
            docs/review/measurements/BAT-075-probes.md
            docs/review/measurements/BAT-075-diagnose.md
          if-no-files-found: ignore
          retention-days: 7
      # v0 앞에서 앞 시험의 작업 부하(예제 서비스·Kafka)를 내린다. v0는 둘을 쓰지 않는다. 저장소가 비공개이던 때 표준 실행기(CPU 2개)에서
      # 다 남겨 두면 v0 파드가 CPU 부족으로 배치되지 못했다(2026-11-03). 공개 저장소의 실행기는 CPU 4개지만, v0 시험이 HPA로 v0-monolith를
      # 최대 4개(요청 500m씩)까지 늘릴 자리를 남기려고 그대로 둔다. 관측 도구는 v0 시험이 쓰므로 남긴다
      - run: |
          k=$(node tools/local/tools.mjs kubectl | cut -d' ' -f2)
          "$k" --kubeconfig .cache/peaket-tools/kubeconfig-peaket delete namespace example kafka --ignore-not-found --wait=false
      # v0 배포(docs/infra.md §3 'v0 배포'): 이미지 둘·입구·CPU HPA를 올리고, 입구를 거친 v0 흐름·막기·레이트 리밋·확장을 본다
      - run: node tools/local/cluster.mjs v0
      - run: node --test tools/local/e2e/v0-deploy.e2e.mjs
      # 게이트웨이 다섯(docs/infra.md §4.1 'Envoy 게이트웨이의 첫 구현', BUILD_ORDER HOT-400): v0를 내려 자리를 낸 뒤 Envoy Gateway·대역 백엔드·
      # 정의(로컬 덧씌우기)를 올리고 kind 시험과 브라우저 셋(Q-T41) 시험을 돈다. 시험은 kubectl 포트 전달 없이 kind 포트 매핑(up이 건다)과
      # 로컬 전용 NodePort Service로 이은 127.0.0.1:18441~18445에 붙는다. 포트 전달은 Envoy가 연결 하나를 RST로 끊으면 통째로 끝나 그 뒤 시험이
      # 모두 연결 거절로 실패했다(2026-11-16, docs/infra.md §4.1 '로컬 kind에서 이 PC로 잇는 법'). gateways가 다섯 포트의 TLS 응답까지 기다린다
      - run: |
          k=$(node tools/local/tools.mjs kubectl | cut -d' ' -f2)
          "$k" --kubeconfig .cache/peaket-tools/kubeconfig-peaket delete namespace v0 --ignore-not-found --wait=false
      - run: node tools/local/cluster.mjs gateways
      - run: pnpm install --frozen-lockfile
        working-directory: tools/web-checks
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
        working-directory: tools/web-checks
      - run: |
          node --test --test-timeout=300000 tools/local/e2e/gateways.e2e.mjs
          node --test --test-timeout=300000 tools/local/e2e/queue-cors.e2e.mjs
          # 경로별 메서드·전역 한도·웹훅 IP 한도·게이트웨이 오류(BUILD_ORDER HOT-410, D-T42·D-T43·D-T50). 레이트 리밋 서비스 복제를 0으로 줄였다 되돌리는
          # 시험(D-T50 ③)이 맨 끝이라 같은 클러스터의 다른 시험 뒤에 돈다
          node --test --test-timeout=300000 tools/local/e2e/gateway-limits.e2e.mjs
          # 생성 라우트의 인증 종류·백엔드·시간 상한·게이트웨이 오류 403·405(BAT-060 계획 15절, BAT-055 웨이브 끝 리뷰 지적의 K 재현). 시간 상한 시험이 요청 하나에 20~28초다
          node --test --test-timeout=300000 tools/local/e2e/gateway-routes.e2e.mjs
          # gw-fan 구매 경로의 입장 토큰 확인(공통 Lua, S-T28 ①·Q-T69 ②·ASVS 9.1.3·9.2.x, docs/infra.md §4.1 '입장 토큰 확인', 묶음 BAT-057). 키 목록을 비우고 지웠다 되돌리는
          # 복구 경로 장애 주입(gateways-admission empty·remove·restore, Q-T69 ②)은 gw-fan 프록시를 다시 띄우므로 같은 클러스터의 게이트웨이 시험 맨 끝에 돈다
          node --test --test-timeout=300000 tools/local/e2e/gateway-admission.e2e.mjs
          node --test --test-timeout=600000 tools/local/e2e/gateway-admission-fault.e2e.mjs
      # 메시 없는 실행의 포트별 허용 NetworkPolicy(D-T36 ①~⑦ kind, ADR-0285 결정 13, BUILD_ORDER HOT-420): 원천의 워크로드마다 받는 쪽 대역과 생성 NetworkPolicy
      # (deploy/platform/mesh/meshless-networkpolicies.yaml, kindnet이 지킨다)를 올리고 부르는 쪽 시험 파드로 연결·거부를 본다. 게이트웨이 시험 뒤에 돈다
      # (게이트웨이 라벨을 단 시험 파드가 로컬 전용 NodePort Service의 끝점이 될 수 있어서다. 실제 프록시 파드의 서비스 계정도 본다)
      - run: node tools/local/cluster.mjs mesh-netpol
      - run: node --test --test-timeout=300000 tools/local/e2e/mesh-netpol.e2e.mjs
      # Kyverno CEL 입장 정책(docs/devops.md §4.3, D-T11·D-T18 ②·D-T33, BUILD_ORDER BAS-150·BAT-085, ADR-0318): 차트 3.10.0을
      # 관제 풀 값(복제 3·PDB 2·이미지 다이제스트)으로 설치하고 데모 정책(감사)을 적용한다. 입장 시험 파일은 시험 담당이 더하면 돈다.
      # 이 워크플로를 먼저 develop에 넣는 분리 커밋에서는 정책·도구가 아직 없으므로 건너뛴다(branch-policy, ADR-0169)
      - run: |
          set -euo pipefail
          if [ -f deploy/policies/kyverno/policy-values.yaml ] && [ -f tools/local/cluster.mjs ]; then
            node tools/local/cluster.mjs kyverno --env demo
          else
            echo "Kyverno 정책·도구가 아직 없다(워크플로 분리 커밋). 설치·정책 적용을 건너뛴다"
          fi
      - name: Kyverno 입장 시험
        run: |
          set -euo pipefail
          if [ -f tools/local/e2e/kyverno.e2e.mjs ]; then
            node --test --test-timeout=900000 tools/local/e2e/kyverno.e2e.mjs
          else
            echo "Kyverno 입장 e2e 시험 파일이 아직 없다(시험 담당 몫). 설치·정책 적용까지만 확인했다"
          fi
      - if: ${{ failure() }}
        run: |
          node tools/local/cluster.mjs status || true
          k=$(node tools/local/tools.mjs kubectl | cut -d' ' -f2)
          "$k" --kubeconfig .cache/peaket-tools/kubeconfig-peaket -n example logs -l app.kubernetes.io/component=outbox-relay --tail=200 --prefix || true
          "$k" --kubeconfig .cache/peaket-tools/kubeconfig-peaket -n v0 get pods,hpa,jobs,events -o wide || true
          "$k" --kubeconfig .cache/peaket-tools/kubeconfig-peaket -n v0 logs -l app.kubernetes.io/part-of=peaket --tail=200 --prefix || true
          # 배치되지 못한 파드의 까닭과 노드의 자원 배정(요청 합계)
          "$k" --kubeconfig .cache/peaket-tools/kubeconfig-peaket get events -A --field-selector reason=FailedScheduling || true
          "$k" --kubeconfig .cache/peaket-tools/kubeconfig-peaket describe nodes | sed -n '/Allocatable/,/Events/p' || true
          # 게이트웨이: 정의의 조건, 컨트롤러·프록시 로그, 로컬 전용 NodePort Service와 kind 노드의 이 PC 포트 공개
          "$k" --kubeconfig .cache/peaket-tools/kubeconfig-peaket -n envoy-gateway-system get gateways,httproutes,securitypolicies,clienttrafficpolicies,backendtrafficpolicies,envoyextensionpolicies,pods -o wide || true
          "$k" --kubeconfig .cache/peaket-tools/kubeconfig-peaket -n envoy-gateway-system logs deploy/envoy-gateway --tail=200 || true
          "$k" --kubeconfig .cache/peaket-tools/kubeconfig-peaket -n envoy-gateway-system logs deploy/envoy-ratelimit --tail=100 || true
          "$k" --kubeconfig .cache/peaket-tools/kubeconfig-peaket -n envoy-gateway-system get svc -o wide || true
          docker port peaket-control-plane || true
          # 메시 없는 NetworkPolicy 무대: 생성 NetworkPolicy와 받는 쪽 대역·시험 파드(원천의 워크로드·부르는 쪽 네임스페이스)
          for ns in core purchase queue ticket trust web ops-breakglass observability envoy-gateway-system; do
            "$k" --kubeconfig .cache/peaket-tools/kubeconfig-peaket -n "$ns" get networkpolicies,pods -o wide || true
          done
          # Kyverno 입장 정책(BAT-085): 정책 상태·입장 로그·이벤트를 남긴다
          "$k" --kubeconfig .cache/peaket-tools/kubeconfig-peaket get imagevalidatingpolicies,validatingpolicies -o wide || true
          "$k" --kubeconfig .cache/peaket-tools/kubeconfig-peaket -n kyverno logs deploy/kyverno-admission-controller --tail=300 || true
          "$k" --kubeconfig .cache/peaket-tools/kubeconfig-peaket get events -A --field-selector reason=PolicyViolation || true
          # 진단 수집 e2e(BAT-080 G1): 실패한 시험은 릴리스·파드를 지우지 않는다. 파드가 남아 있으면 전·현재 컨테이너 로그, 이벤트, 설명,
          # /diag 목록(표시 파일·남은 보고서·스냅샷)을 남긴다. 첫 실행의 원인(예: moto 업로드 실패)을 이 로그로 가른다
          "$k" --kubeconfig .cache/peaket-tools/kubeconfig-peaket -n diagnose-e2e get pods,events -o wide || true
          "$k" --kubeconfig .cache/peaket-tools/kubeconfig-peaket -n diagnose-e2e describe pods || true
          "$k" --kubeconfig .cache/peaket-tools/kubeconfig-peaket -n diagnose-e2e logs -l app.kubernetes.io/component=service --all-containers --tail=500 --prefix || true
          "$k" --kubeconfig .cache/peaket-tools/kubeconfig-peaket -n diagnose-e2e logs -l app.kubernetes.io/component=service --all-containers --previous --tail=500 --prefix || true
          for p in $("$k" --kubeconfig .cache/peaket-tools/kubeconfig-peaket -n diagnose-e2e get pods -l app.kubernetes.io/component=service -o name); do
            "$k" --kubeconfig .cache/peaket-tools/kubeconfig-peaket -n diagnose-e2e exec "$p" -- sh -c 'ls -la /diag; for f in /diag/*; do [ -f "$f" ] && { echo "== $f"; head -c 4000 "$f"; echo; }; done' || true
          done
          # helm 값·상태(릴리스 diag). 파드가 지워졌어도 어떤 값으로 떴는지 남긴다
          h=$(node tools/local/tools.mjs helm | cut -d' ' -f2)
          "$h" --kubeconfig .cache/peaket-tools/kubeconfig-peaket -n diagnose-e2e status diag || true
          "$h" --kubeconfig .cache/peaket-tools/kubeconfig-peaket -n diagnose-e2e get values diag -a || true
          "$h" --kubeconfig .cache/peaket-tools/kubeconfig-peaket -n diagnose-e2e get manifest diag || true
          # 증거 버킷 전체 객체(moto). 흉내 서버 컨테이너 안에서 같은 서버에 물어 나열한다(포트 전달을 쓰지 않는다).
          # 목록을 못 읽으면 그 사실만 남긴다
          "$k" --kubeconfig .cache/peaket-tools/kubeconfig-peaket -n peaket-local exec deploy/aws -- \
            python3 -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:5000/peaket-diag-e2e?list-type=2').read().decode())" || true
          # moto 로그(AWS 흉내 서버). S3 업로드 거절의 원인을 가른다
          "$k" --kubeconfig .cache/peaket-tools/kubeconfig-peaket -n peaket-local logs deploy/aws --tail=500 --prefix || true
      - if: ${{ always() }}
        run: node tools/local/cluster.mjs down || true
