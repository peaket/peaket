# 규칙 모델 검사(docs/verification.md §2.2, wbs 0.9.1). 판단은 tools/spec-check/spec-check.mjs가 하고 여기서는 부르기만 한다.
# - pr: 명세(specs/)·검사 도구(tools/spec-check/)·이 워크플로가 바뀌는 PR마다 형식 검사와 검사마다 시뮬레이션 1만 회(고정 시드)
# - full: TLC 전수 검사. 주 1회(월요일 03:00 KST)와, 명세 목록(specs/specs.json)이 적은 관련 ADR이 바뀔 때(ci.yml의 specs_full)
#   결과 파일은 spec-out/에 묶음마다 따로(<명세>.<묶음>.json과 반례) 내려받을 묶음으로 남긴다. 저장소의 결과 파일(specs/results/)은 사람이 로컬에서 `full --write`로 고쳐 커밋한다
# 검사 도구(Quint, Apalache 묶음 안의 TLC, Quint 평가기)는 고정 판·고정 해시로 받는다(tools/spec-check/fetch-tools.mjs). 외부 계정은 필요 없다
# 잡은 명세마다 하나이고, 전수 검사(full)는 검사 목록의 shard가 다른 검사를 따로 한 잡씩 돈다(잡 목록은 `spec-check.mjs matrix`가 specs/specs.json에서 만든다).
# 대기열 명세의 전수 검사가 길어져(2026-11-04 PRF-120, 로컬 8코어 30분 남짓) 세 명세를 한 잡에 넣으면 러너(4코어)에서 90분을 넘을 수 있어 명세별로 나눴고,
# 그래도 대기열 한 잡이 러너에서 약 130분 [추정]이라 가장 큰 검사(진입 범위)를 따로 둔다. 전체 시간은 가장 긴 잡이 정한다(ADR-0187)
# GitHub는 워크플로 파일이 바뀐 푸시에서 그 워크플로를 등록한다. 첫 푸시(2026-11-03)에 함께 올라간 이 파일은 등록되지 않아 수동·예약 실행이 돌지 않았다(FND-160에서 찾음).
name: spec-check

on:
  workflow_call:
    inputs:
      mode:
        description: pr(형식 검사·시뮬레이션) 또는 full(TLC 전수 검사)
        type: string
        required: true
  schedule:
    - cron: '0 18 * * 0'
  workflow_dispatch:
    inputs:
      only:
        description: "한 묶음만 다시 돌릴 때 '명세' 또는 '명세:묶음'(예: queue:proposed). 비우면 전부"
        type: string
        required: false
      tlc_jvm_args:
        description: 'TLC를 띄우는 JVM에만 더할 인자(설정 실험용, 예: -XX:+UseParallelGC). 비우면 기본. Apalache의 JVM에는 주지 않는다(G1을 직접 골라 GC 인자가 겹치면 시작하지 못한다)'
        type: string
        required: false

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # 잡 목록(명세, 전수 검사는 묶음별)은 도구가 specs/specs.json에서 만든다. only는 수동 실행으로 한 묶음만 다시 돌릴 때다
      - id: list
        env:
          MODE: ${{ inputs.mode || 'full' }}
          ONLY: ${{ inputs.only }}
        run: |
          case "$MODE" in pr|full) ;; *) echo "::error::mode는 pr 또는 full이다: $MODE"; exit 1 ;; esac
          echo "matrix=$(node tools/spec-check/spec-check.mjs matrix --mode "$MODE" ${ONLY:+--only "$ONLY"})" >> "$GITHUB_OUTPUT"

  spec:
    name: spec (${{ matrix.spec }}${{ matrix.shard && format(', {0}', matrix.shard) || '' }})
    needs: list
    # 큰 러너가 필요한 묶음(검사 목록의 large, 대기열의 진입 범위 검사)은 조직에 만든 큰 러너에서 돈다. 러너 이름은 저장소 변수 PEAKET_LARGE_RUNNER에 둔다
    # (변수가 없으면 표준 러너라 아무것도 막히지 않고, 변수를 지우면 되돌아간다). 큰 러너는 분당 과금이라 전수 검사(full)에서만 쓰고,
    # 포크에서 온 PR은 표준 러너로 돌려 외부 사람이 큰 러너 시간을 쓰지 못하게 한다(ADR-0187)
    runs-on: ${{ (matrix.large && vars.PEAKET_LARGE_RUNNER && (inputs.mode || 'full') == 'full' && github.event.pull_request.head.repo.fork != true) && vars.PEAKET_LARGE_RUNNER || 'ubuntu-24.04' }}
    # 대기열 명세의 전수 검사가 러너(4코어)에서 88.7분 걸렸다(2026-11-04 첫 실행, 로컬 8코어 31분). RB-05 복제 확인(ADR-0186)으로 로컬이 47분, 러너는 약 135분 [추정]이 돼
    # 가장 큰 검사(진입 범위, 로컬 35분)를 따로 한 잡으로 뒀다. 그 잡이 러너에서 약 100분 [추정]이다(ADR-0187). 한도에 붙지 않게 두 배 가까이를 둔다(호스트 러너 잡 상한 360분)
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.list.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Apalache 0.62.x(TLC 포함)는 Java 17 이상. 로컬 컨테이너(tools/spec-check/Dockerfile)와 같은 Temurin 21
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      # pnpm은 검사 도구 작업 공간의 packageManager 판으로 받고, 잠금 파일대로만 설치한다(docs/devops.md §4.4)
      - run: |
          pm=$(node -p "require('./tools/spec-check/package.json').packageManager")
          case "$pm" in pnpm@[0-9]*) ;; *) echo "::error::packageManager가 pnpm@<판>이 아니다: $pm"; exit 1 ;; esac
          npm install --global "$pm"
      - run: pnpm install --frozen-lockfile --dir tools/spec-check
      # 받은 묶음은 고정표가 같으면 다시 쓴다. 다시 쓸 때도 fetch-tools.mjs가 핵심 파일 해시를 다시 본다
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.quint
          key: quint-tools-${{ hashFiles('tools/spec-check/fetch-tools.mjs') }}
      - run: node tools/spec-check/fetch-tools.mjs
      # 어느 기계에서 돌았는지 로그에 남긴다(코어 수에 따른 시간을 견줄 때 쓴다)
      - run: echo "러너 ${RUNNER_NAME}, 코어 $(nproc), 메모리 $(free -g | awk '/Mem:/ {print $2}')GB"
      - run: node --test "tools/spec-check/*.test.mjs"
      # 결과는 spec-out/에 쓴다(저장소의 specs/results를 일부만 덮지 않게, 묶음마다 파일이 따로다). JVM 설정 실험은 수동 실행의 tlc_jvm_args로 준다
      - env:
          MODE: ${{ inputs.mode || 'full' }}
          SPEC: ${{ matrix.spec }}
          SHARD: ${{ matrix.shard }}
          JVM_OPTS: ${{ inputs.tlc_jvm_args }}
        run: |
          case "$MODE" in pr|full) ;; *) echo "::error::mode는 pr 또는 full이다: $MODE"; exit 1 ;; esac
          if printf '%s' "$JVM_OPTS" | grep -qE '[^-A-Za-z0-9=:+., _]'; then echo "::error::tlc_jvm_args에 쓸 수 없는 글자가 있다"; exit 1; fi
          # JAVA_TOOL_OPTIONS는 Apalache의 JVM에도 걸려 GC 인자가 겹친다(2026-11-04 첫 시도: 'Multiple garbage collectors selected'). Quint가 `java`로 TLC(tlc2.TLC)를 띄울 때만 더하는 껍데기를 앞에 둔다
          if [ -n "$JVM_OPTS" ]; then
            real=$(command -v java)
            mkdir -p "$RUNNER_TEMP/jbin"
            cat > "$RUNNER_TEMP/jbin/java" <<EOF
          #!/usr/bin/env bash
          for a in "\$@"; do
            if [ "\$a" = "tlc2.TLC" ]; then exec "$real" $JVM_OPTS "\$@"; fi
          done
          exec "$real" "\$@"
          EOF
            chmod +x "$RUNNER_TEMP/jbin/java"
            export PATH="$RUNNER_TEMP/jbin:$PATH"
          fi
          if [ "$MODE" = full ]; then
            node tools/spec-check/spec-check.mjs full --spec "$SPEC" ${SHARD:+--shard "$SHARD"} --out spec-out
          else
            node tools/spec-check/spec-check.mjs pr --spec "$SPEC"
          fi
      - if: ${{ always() && (inputs.mode || 'full') == 'full' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spec-results-${{ matrix.spec }}${{ matrix.shard && format('-{0}', matrix.shard) || '' }}
          path: spec-out/
          if-no-files-found: ignore
