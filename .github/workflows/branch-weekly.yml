# develop 병합 방식 주간 점검(docs/devops.md §2.2.6, D-T49, FND-160). 들어온 가지가 release/*·hotfix/*·merge/*가 아닌 병합 커밋을 경고한다.
# 경고가 있어도 실패시키지 않는다. 이력을 읽지 못해 점검 자체가 돌지 못하면 실패한다(예약 실행 실패 알림은 이 파일의 cron 줄을 마지막으로 고친 사용자에게 간다).
# 필수 검사 branch-policy와 다른 파일이다. 같은 파일에 두면 수동 실행이 PR 머리 커밋에 '건너뜀' branch-policy를 붙일 수 있다.
name: branch-weekly

on:
  schedule:
    # 매주 월요일 00:00 UTC = 09:00 KST [가정](릴리스 자르기 1시간 전)
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: branch-weekly
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # 병합 커밋에 연결된 PR을 읽는다. 쓰기 권한은 없다
    permissions:
      contents: read
      pull-requests: read
    steps:
      # develop의 첫 부모 이력과 병합 커밋을 읽으려고 이력을 모두 받는다
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node tools/ci/branch-watch.mjs weekly
        env:
          GITHUB_TOKEN: ${{ github.token }}
