# 점검 스크립트 시험과 저장소 규칙 검사(docs/devops.md §3.1·§4.4·§4.5). ci.yml이 바뀐 범위에
# tools·ci·infra·js 가운데 하나가 있을 때 부른다(워크플로, CODEOWNERS와 팀 목록, package.json의 규칙).
name: tools-check

on:
  workflow_call:

permissions:
  contents: read

jobs:
  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # 실제 워크플로를 YAML로 읽는 시험(D-T32·D-T40·BSL-050)이 뿌리 개발 의존성 yaml을 쓴다. 설치는 잠금 파일대로만 한다(§4.4)
      # pnpm은 package.json의 packageManager 판으로 받는다(ci-node.yml과 같다)
      - run: |
          pm=$(node -p "require('./package.json').packageManager")
          case "$pm" in pnpm@[0-9]*) ;; *) echo "::error::packageManager가 pnpm@<판>이 아니다: $pm"; exit 1 ;; esac
          npm install --global "$pm"
      - run: pnpm install --frozen-lockfile
      - run: node --test "tools/ci/*.test.mjs"
      # 게이트웨이 다섯의 정의 정적 시험(docs/infra.md §4.1 'Envoy 게이트웨이의 첫 구현', BUILD_ORDER HOT-400)
      - run: node --test "deploy/gateways/test/*.test.mjs"
      # 게이트웨이 라우트 생성 대조(D-T42 ①②, docs/infra.md §4.1 '생성 대조', BUILD_ORDER HOT-410): openapi·라우트 원천으로 다시 만든 결과가 생성 파일과 다르면 실패.
      # gitops-check(docs/devops.md §3, BAS-150)가 생기기 전에는 이 잡이 돈다
      - run: node tools/ci/gateway-routes.mjs --check
      # 메시 포트별 허용 정책의 정적 시험(D-T36 ①~⑦ 정적, ADR-0285, BUILD_ORDER HOT-420): 생성 정책·NetworkPolicy를 정본 표와 견주고 STRICT·최소 TLS 1.3·cacerts를 본다
      - run: node --test "deploy/platform/mesh/test/*.test.mjs"
      # 메시 정책 생성 대조(D-T36, ADR-0285 결정 2): 원천 deploy/platform/mesh/port-allow.yaml·게이트웨이 라우트·proto로 다시 만든 결과가 생성 파일과 다르거나
      # 원천과 라우트·proto·배포 값이 어긋나면 실패. gitops-check(docs/devops.md §3, BAS-150)가 생기기 전에는 이 잡이 돈다
      - run: node tools/ci/mesh-policies.mjs --check
      # 배포 단위 값의 정적 시험(queue-svc·purchase-svc 포트·시작 명령·비밀은 secretEnvFrom·입장 토큰 발급자 셋이 같음, BUILD_ORDER PRF-050·PRF-137, 묶음 BAT-057, ADR-0288 결정 8)
      - run: node --test "deploy/workloads/test/*.test.mjs"
      # Kyverno CEL 정책의 정적 시험과 생성 대조(docs/devops.md §4.3, D-T11·D-T18 ②·D-T33, BUILD_ORDER BAS-150·BAT-085, ADR-0318).
      # 시험 파일은 시험 담당이 더한다. 있으면 돌리고, 생성기는 늘 원천과 견준다
      - run: |
          set -euo pipefail
          if ls deploy/policies/test/*.test.mjs >/dev/null 2>&1; then node --test "deploy/policies/test/*.test.mjs"; else echo "deploy/policies/test 시험 파일이 아직 없다(시험 담당 몫)"; fi
          if [ -f tools/ci/kyverno-policies.mjs ]; then node tools/ci/kyverno-policies.mjs --check; else echo "Kyverno 정책 생성기가 아직 없다(이 워크플로 분리 커밋)"; fi
      # 엣지 저장소 맞추기 도구(ADR-0223 결정 10)
      - run: node --test "tools/edge/*.test.mjs"
      # 결제사 스모크 도구(BUILD_ORDER HOT-145. 실제 결제사를 부르지 않는다)
      - run: node --test "tools/pg-smoke/*.test.mjs"
      # 성능 장부 도구: 명령줄 시험(점검 판정·지연 대조·증거 수준·야간 비교 D-T40)과 자체 시험(docs/perf-ledger.md)
      - run: node --test "tools/perf-ledger/*.test.mjs"
      - run: python3 -I -X utf8 tools/perf-ledger/collect.py --selftest
      - run: node tools/ci/check-workflows.mjs
      - run: node tools/ci/check-codeowners.mjs
      - run: node tools/ci/check-workspace-protocol.mjs
      # 신뢰 정책 예외는 이름@정확한 판만, devops §4.4 예외 표에 적은 것만(ADR-0191)
      - run: node tools/ci/check-trust-exceptions.mjs
      # Kafka 클라이언트 필수 설정 정적 검사(D-T45, ADR-0142 결정 3)
      - run: node tools/ci/check-kafka-settings.mjs
      # 시험 파일의 Docker 호출마다 시간 제한(timeout 300_000ms 이하 정수)이 있는지 본다(ADR-0283 결정 4)
      - run: node tools/ci/check-docker-timeouts.mjs
