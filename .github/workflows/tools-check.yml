# 점검 스크립트 시험과 저장소 규칙 검사(docs/devops.md §3.1·§4.4·§4.5). ci.yml이 바뀐 범위에
# tools·ci·infra·js 가운데 하나가 있을 때 부른다(워크플로, CODEOWNERS와 팀 목록, package.json의 규칙).
name: tools-check

on:
  workflow_call:

permissions:
  contents: read

jobs:
  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # 실제 워크플로를 YAML로 읽는 시험(D-T32·D-T40·BSL-050)이 뿌리 개발 의존성 yaml을 쓴다. 설치는 잠금 파일대로만 한다(§4.4)
      # pnpm은 package.json의 packageManager 판으로 받는다(ci-node.yml과 같다)
      - run: |
          pm=$(node -p "require('./package.json').packageManager")
          case "$pm" in pnpm@[0-9]*) ;; *) echo "::error::packageManager가 pnpm@<판>이 아니다: $pm"; exit 1 ;; esac
          npm install --global "$pm"
      - run: pnpm install --frozen-lockfile
      - run: node --test "tools/ci/*.test.mjs"
      # 성능 장부 도구: 명령줄 시험(점검 판정·지연 대조·증거 수준·야간 비교 D-T40)과 자체 시험(docs/perf-ledger.md)
      - run: node --test "tools/perf-ledger/*.test.mjs"
      - run: python3 -I -X utf8 tools/perf-ledger/collect.py --selftest
      - run: node tools/ci/check-workflows.mjs
      - run: node tools/ci/check-codeowners.mjs
      - run: node tools/ci/check-workspace-protocol.mjs
      # 신뢰 정책 예외는 이름@정확한 판만, devops §4.4 예외 표에 적은 것만(ADR-0191)
      - run: node tools/ci/check-trust-exceptions.mjs
      # Kafka 클라이언트 필수 설정 정적 검사(D-T45, ADR-0142 결정 3)
      - run: node tools/ci/check-kafka-settings.mjs
