# 이미지 빌드(docs/devops.md §3.1 build-image.yml, 추천 적용 2026-11-03, BUILD_ORDER BSL-050). ci.yml의 잡 image가 부른다.
# 지금은 ① 빌드 잡만 있다: 플랫폼마다 그 아키텍처의 GitHub 호스트 러너에서(에뮬레이션 없이) OCI 묶음과 다이제스트를 만들고,
# 같은 러너에서 네트워크 없이 스모크한다(tools/ci/image-build.mjs). 운영 노드는 Graviton(arm64), 로컬 kind·데모는 amd64라 둘 다 만든다.
# 스모크는 이미지 안 소스 관리 폴더(.git·.svn·.hg)도 막고(ASVS 13.4.1), 이어서 OCI 묶음을 다이제스트 고정 Trivy로 네트워크 없이 비밀 검사만 해
# 하나라도 찾으면 묶음을 올리지 않고 실패한다(ASVS 13.3.1, ADR-0263 결정 7·9, tools/ci/scan-tools.mjs·scan-gate.mjs).
# 빌드 잡은 레지스트리·서명·출처 증명 권한이 없다(잡 권한은 contents: read뿐, D-T32 ①, tools/ci/check-workflows.mjs가 지킨다).
# ② 게시 잡은 저장소 코드를 체크아웃·실행하지 않고, 빌드 잡이 넘긴 OCI 묶음만 받아 다이제스트를 확인한 뒤 이미지 인덱스·SBOM·푸시·cosign 서명·SLSA 출처 증명을 한다(BUILD_ORDER BAS-020).
name: build-image

on:
  workflow_call:
    inputs:
      dockerfile:
        description: Dockerfile 경로(빌드 맥락은 저장소 뿌리)
        type: string
        required: true
      image:
        description: 이미지 이름(소문자·숫자·.·_·-, 산출물 이름에 쓴다)
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # 빌더(BuildKit, 다이제스트 고정)를 만들고 OCI 묶음·다이제스트를 낸 뒤 그 이미지를 스모크한다. 입력은 환경 변수로 넘긴다(식 삽입을 피한다)
      - env:
          DOCKERFILE: ${{ inputs.dockerfile }}
          IMAGE: ${{ inputs.image }}
          PLATFORM: ${{ matrix.platform }}
        run: node tools/ci/image-build.mjs --dockerfile "$DOCKERFILE" --image "$IMAGE" --platform "$PLATFORM" --out image-out
      # 이미지 비밀 검사: 실행 때 조립한 가짜 비밀 묶음(미끼)을 같은 설정으로 먼저 찾게 한 뒤 실제 묶음을 본다. 둘 다 OCI 묶음 tar를 OCI 레이아웃 폴더로
      # 풀어 그 폴더를 Trivy --input에 준다(Trivy 0.76.1은 OCI 묶음 tar를 열지 못한다, 첫 CI 42826751275). 비밀 규칙 설정(tools/ci/trivy-secret.yaml)은
      # Trivy 내장 허용 규칙을 끄고 그 파일의 허용 규칙만 오탐으로 받는다. 취약점 자료·검사 규칙을 받지 않는다(ADR-0263 결정 7·13)
      - name: 이미지 비밀 검사(Trivy)
        env:
          IMAGE: ${{ inputs.image }}
          ARCH: ${{ matrix.arch }}
        run: node tools/ci/scan-tools.mjs trivy-image --input "image-out/$IMAGE-$ARCH.oci.tar" --sarif "$RUNNER_TEMP/trivy-secret.sarif" --work "$RUNNER_TEMP/trivy-image-decoy"
      - name: 이미지 비밀 판정
        if: ${{ !cancelled() }}
        run: node tools/ci/scan-gate.mjs --tool trivy-secret --sarif "$RUNNER_TEMP/trivy-secret.sarif" --report "$RUNNER_TEMP/image-secret-gate.json"
      # 판정 보고서(규칙·파일·줄만)는 묶음과 같이 7일 둔다. 도구 원본 보고서는 올리지 않는다
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-secret-gate-${{ inputs.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/image-secret-gate.json
          if-no-files-found: ignore
          retention-days: 7
      # OCI 묶음과 다이제스트는 게시 잡(wbs 0.1.5)이 다이제스트를 다시 계산해 맞춘 뒤 쓴다
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ inputs.image }}-${{ matrix.arch }}
          path: image-out/
          if-no-files-found: error
          retention-days: 7

  # 게시 잡(BAS-020, D-T32 ①): 저장소 코드를 체크아웃하지 않고 빌드 산출물만 쓴다. 서명 신원·레지스트리 쓰기·출처 증명 권한은 이 잡만 받는다.
  publish:
    needs: build
    # 출시·핫픽스 가지의 후보 빌드만 게시·서명한다(develop·PR 빌드는 푸시 없이 빌드만, docs/devops.md §3.2·§4.2).
    # release 환경의 보호 규칙(필수 검토자)이 한 번 더 막는다: ci.yml이 부르는 쪽 권한을 덮어도 PR에서는 이 잡이 승인 없이 돌지 않는다
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/hotfix/')) }}
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: image-${{ inputs.image }}-*
          merge-multiple: true
          path: image-in
      # 빌드 잡이 남긴 플랫폼 이미지 두 개와 다이제스트 파일이 모두 있는지 먼저 본다
      - name: 빌드 산출물 확인
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail
          test "$(ls image-in/$IMAGE-amd64.oci.tar image-in/$IMAGE-arm64.oci.tar | wc -l)" -eq 2
          test "$(ls image-in/$IMAGE-amd64.digest image-in/$IMAGE-arm64.digest | wc -l)" -eq 2
          for arch in amd64 arm64; do
            test "$(wc -l < "image-in/$IMAGE-$arch.digest")" -eq 1
            grep -Eq '^sha256:[0-9a-f]{64}$' "image-in/$IMAGE-$arch.digest"
          done
      # 플랫폼 이미지를 레지스트리에 올리고 인덱스를 만든다. 태그는 커밋 SHA다(승격은 인덱스 다이제스트로 한다)
      - name: 이미지 인덱스 게시
        id: index
        env:
          IMAGE: ${{ inputs.image }}
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for arch in amd64 arm64; do
            docker run --rm -v "$PWD/image-in:/in:ro" quay.io/skopeo/stable@sha256:c4c8a9d6fc95e331fa92fc31de3f6c9b5fe4761c82f0acb99669eef067fb7c33 \
              copy --all "oci-archive:/in/$IMAGE-$arch.oci.tar" "docker://ghcr.io/$OWNER/$IMAGE:$TAG-$arch"
          done
          docker buildx imagetools create -t "ghcr.io/$OWNER/$IMAGE:$TAG" "ghcr.io/$OWNER/$IMAGE:$TAG-amd64" "ghcr.io/$OWNER/$IMAGE:$TAG-arm64"
          digest=$(docker buildx imagetools inspect "ghcr.io/$OWNER/$IMAGE:$TAG" --format '{{.Manifest.Digest}}')
          echo "$digest" > "image-in/$IMAGE.index.digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # 플랫폼 이미지마다 CycloneDX SBOM을 만든다(다이제스트 고정 Syft 이미지, OCI 묶음을 직접 읽고 네트워크를 쓰지 않는다)
      - name: SBOM 만들기
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail
          mkdir -p sbom
          for arch in amd64 arm64; do
            docker run --rm --network none --tmpfs /tmp -v "$PWD/image-in:/in:ro" -v "$PWD/sbom:/out" \
              anchore/syft@sha256:825cad3a952c87676a6d07e9a3bb05ac9c401d598360070e970aa46d54c1727e \
              "oci-archive:/in/$IMAGE-$arch.oci.tar" -o "cyclonedx-json=/out/$IMAGE-$arch.cdx.json"
          done
      # cosign 키 없는 서명(인덱스와 플랫폼 이미지 모두, --recursive)과 SLSA 출처 증명, SBOM 증명.
      # sigstore/cosign-installer는 저장소의 허용 액션 정책(제3자 액션)에 걸려 CI가 시작하지 못하므로,
      # 다이제스트 대신 판·체크섬을 고정한 cosign 바이너리를 받아 쓴다(제3자 액션을 늘리지 않는다).
      - name: cosign 받기
        env:
          COSIGN_VERSION: v2.4.1
        run: |
          set -euo pipefail
          base="https://github.com/sigstore/cosign/releases/download/$COSIGN_VERSION"
          curl -fsSL -o "$RUNNER_TEMP/cosign-linux-amd64" "$base/cosign-linux-amd64"
          curl -fsSL -o "$RUNNER_TEMP/cosign_checksums.txt" "$base/cosign_checksums.txt"
          (cd "$RUNNER_TEMP" && grep " cosign-linux-amd64$" cosign_checksums.txt | sha256sum -c -)
          mv "$RUNNER_TEMP/cosign-linux-amd64" "$RUNNER_TEMP/cosign"
          chmod +x "$RUNNER_TEMP/cosign"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: cosign 서명
        env:
          IMAGE: ${{ inputs.image }}
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          cosign sign --yes --recursive "ghcr.io/$OWNER/$IMAGE:$TAG"
      - uses: actions/attest-build-provenance@e4d4f7c39adfa4c260fb5c147f0622000aa14b99 # v4.0.0
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest@4cd38b497a0123730d9f9f4349bf29fd520207c5 # v2.0.0
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}
          subject-digest: ${{ steps.index.outputs.digest }}
          predicate-type: https://cyclonedx.org/bom
          predicate-path: sbom/${{ inputs.image }}-amd64.cdx.json
          push-to-registry: true
      - uses: actions/attest@4cd38b497a0123730d9f9f4349bf29fd520207c5 # v2.0.0
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}
          subject-digest: ${{ steps.index.outputs.digest }}
          predicate-type: https://cyclonedx.org/bom
          predicate-path: sbom/${{ inputs.image }}-arm64.cdx.json
          push-to-registry: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-sbom-${{ inputs.image }}
          path: |
            sbom/
            image-in/*.digest
          if-no-files-found: error
          retention-days: 7
