# 자바스크립트 작업 공간 검사(docs/devops.md §3.1 ci-node, wbs 0.1.2·0.3.1 ①). ci.yml이 바뀐 범위에 js가 있을 때 부른다.
# 잠금 파일대로 설치하고 Turborepo로 타입 검사·단위 시험·빌드를 돈다. 넓게 쓰이는 것(packages/platform·packages/contracts,
# docs/api, 잠금 파일·작업 공간 설정)이 바뀌었거나 범위를 고르지 못했으면 전체, 아니면 바뀐 패키지와 그것에 기대는 패키지만 돈다.
# 린트(서비스 안 구조의 층 의존 방향)와 서비스 템플릿의 컨테이너 통합 시험(실제 PostgreSQL)은 늘 돈다(openspec 변경
# add-service-structure-and-request-checks). 시험은 보고서(vitest JSON test-report.json, node --test JUnit test-report.xml)를 남기고,
# 끝에 ASVS 태그 리포트(tools/ci/asvs-report.mjs)가 그것을 모아 작업 요약에 쓴다(BOT-162).
name: ci-node

on:
  workflow_call:
    inputs:
      all:
        description: 전체를 돈다(넓게 쓰이는 것이 바뀌었거나 범위를 고르지 못함)
        type: boolean
        required: true
      base:
        description: 견줄 기준 커밋(PR은 대상 가지의 기준, 푸시는 앞 커밋). 비었거나 0이면 전체
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # --affected는 기준과 머리 사이 이력이 모두 있어야 한다(얕으면 모두 바뀐 것으로 본다, Turborepo 문서 2026-11-01 확인)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # pnpm은 package.json의 packageManager 판으로 받는다(contract-check.yml과 같다). 의존성 설치는 잠금 파일대로만 한다(§4.4)
      - run: |
          pm=$(node -p "require('./package.json').packageManager")
          case "$pm" in pnpm@[0-9]*) ;; *) echo "::error::packageManager가 pnpm@<판>이 아니다: $pm"; exit 1 ;; esac
          npm install --global "$pm"
      - run: pnpm install --frozen-lockfile
      # Turborepo 캐시(docs/frontend.md §5.18 'Turborepo 원격 캐시', BUILD_ORDER BAS-220): 외부 원격 캐시 계정 대신 GitHub Actions 캐시에
      # .turbo/cache를 둔다(토큰이 없다). PR이 쓴 캐시는 그 PR 가지에만 남아 develop 캐시를 덮지 못한다
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - env:
          ALL: ${{ inputs.all }}
          BASE: ${{ inputs.base }}
          # 시험 보고서(ASVS 태그 리포트, BOT-162): vitest는 packages/config/vitest/report.mjs가, node --test는 아래 리포터가 패키지 폴더에 남긴다
          PEAKET_TEST_REPORT: test-report.json
          NODE_OPTIONS: --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=test-report.xml
        run: |
          if [ "$ALL" != "true" ] && [ -n "$BASE" ] && printf '%s' "$BASE" | grep -q '[^0]' && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "기준 $BASE 뒤 바뀐 패키지와 그것에 기대는 패키지만 돈다"
            TURBO_SCM_BASE="$BASE" TURBO_SCM_HEAD=HEAD pnpm exec turbo run typecheck test build --affected
            # 서비스 템플릿 시험은 늘 돈다. 패키지 밖 정본(docs/observability.md 지연 칸 목록, docs/api 계약)과 견주는 시험이 있어
            # 문서만 바뀐 경우를 --affected가 패키지 변경으로 보지 않는다(코드 리뷰, add-service-template)
            pnpm exec turbo run test --filter=@peaket/platform
          else
            echo "전체를 돈다(넓게 쓰이는 것이 바뀌었거나 기준이 없다)"
            pnpm exec turbo run typecheck test build
          fi
      # 층 의존 방향 린트(docs/architecture.md §3.1, 기술 검토 낮음-008)는 서비스와 서비스 뼈대(template/)를, 브라우저 지원 린트
      # (docs/frontend.md §1.5, NFR-019)는 화면 앱과 화면 패키지(ds·api-client·telemetry·validation·console-contract)를 본다
      - run: pnpm lint
      # 모든 vitest 설정이 시험 보고서 도움(packages/config/vitest/report.mjs)을 쓰는지 늘 본다: 새 설정이 빠뜨리면 그 패키지 태그가 요약에서 조용히 '미실행'이 된다(BOT-162)
      - run: node --test packages/config/vitest/report.test.mjs
      # 서비스 템플릿의 통합 시험: 실제 PostgreSQL 18 컨테이너를 docker로 띄운다(러너에 Docker가 있다). Drizzle 설정·풀 대기 429·행 보안
      - run: pnpm --filter @peaket/platform test:integration
        env:
          PEAKET_TEST_REPORT: test-report-int.json
      # identity-svc의 PostgreSQL 저장소 시험: 같은 멱등 키의 세션 생성이 겹쳐 와도 세션이 하나인지(I-T50 ①, BUILD_ORDER PRF-020)
      - run: pnpm --filter @peaket/identity-svc test:integration
        env:
          PEAKET_TEST_REPORT: test-report-int.json
      # core-svc의 catalog 표를 실제 PostgreSQL 18로: 마이그레이션, 회차 → 공연 → 판매자 읽기, 표 제약, 회차 공개 요약 경로(BUILD_ORDER HOT-170 ①)
      - run: pnpm --filter @peaket/core-svc test:integration
        env:
          PEAKET_TEST_REPORT: test-report-int.json
      # queue-svc의 진입 Lua를 실제 Valkey로: 1인 1순번(Q-T4), 선점 뒤 멈춤과 재시도(Q-T53), 입장 키 확인(FND-130) (BUILD_ORDER PRF-050), 동시 도착 묶음(Q-T24·Q-T52, PRF-060), 입장 확정 Lua(Q-T9·Q-T10·Q-T31, PRF-110)
      - run: pnpm --filter @peaket/queue-svc test:integration
        env:
          PEAKET_TEST_REPORT: test-report-int.json
      # admission-ctrl의 묶음 결과 게시를 실제 Valkey로: 닫힘 표시·참가자를 읽고 사람별 결과·결과 파일·게시 표시를 쓰며, 잃은 결과 키를 같은 값으로 다시 쓴다(BUILD_ORDER PRF-060)
      - run: pnpm --filter @peaket/admission-ctrl test:integration
        env:
          PEAKET_TEST_REPORT: test-report-int.json
      # purchase-svc의 좌석 Lua(홀드·만료·묶기·실패 해제·다시 만들기)를 실제 Valkey로, 판매 확정 SQL·구매 세션·홀드 원장을 실제 PostgreSQL 18로,
      # 원장 릴레이를 실제 Kafka(KRaft 한 대)로 본다(BUILD_ORDER PRF-130~143). 좌석 모델 기반 시험의 명세 이름 대조와 재생 기록 해시(V-T40, PRF-150 ①)도 여기서 돈다
      - run: pnpm --filter @peaket/purchase-svc test:integration
        env:
          PEAKET_TEST_REPORT: test-report-int.json
      # ASVS 추적 시험 태그 리포트(tools/ci/asvs-report.mjs, docs/architecture.md §8.2 4번, BOT-162): 위 시험들이 남긴 보고서를 모아
      # ASVS 추적 표의 행마다 결과를 작업 요약에 쓴다. 판정은 시험 자체가 하므로 이 단계는 막지 않는다
      - if: always()
        continue-on-error: true
        run: |
          set -- $(find services packages apps tools -path '*/node_modules' -prune -o \( -name 'test-report*.json' -o -name 'test-report*.xml' \) -print | sed 's/^/--report /')
          node tools/ci/asvs-report.mjs "$@" --scan services --scan packages --scan apps --scan tools --scan loadtest --summary "$GITHUB_STEP_SUMMARY"
      # Turborepo 로컬 캐시는 오래된 것을 지우지 않는다. 캐시를 저장하기 전에 7일 [가정] 넘은 항목을 지워 캐시 묶음이 끝없이 자라지 않게 한다
      - if: always()
        run: find .turbo/cache -type f -mtime +7 -delete 2>/dev/null || true
