# realtime-gw의 로컬 데모 값(BAT-087). PEAKET_ENV는 local이다(demo가 아니다: 합본·identity·웹의 local 전제).
# 출처·호스트는 정본 이름에 이 PC 포트(18441~18445)를 붙인다. 비밀은 Secret으로만 받는다.
name: realtime-gw

image:
  repository: peaket/realtime-gw
  tag: demo
  pullPolicy: Never

secretEnvFrom: demo-realtime

env:
  PEAKET_ENV: local

service:
  replicas: 1
  # 워크로드 기본 값의 service.env(포트 없는 출처)를 같은 칸에서 덮는다
  env:
    PEAKET_WEB_ORIGIN: https://www.peaket.example:18441
    PEAKET_ADMISSION_ISSUER: https://queue.peaket.example:18442
    PEAKET_SEATMAP_DIR: /etc/peaket/seatmaps
  # 단일 노드 kind에는 karpenter 온디맨드 노드 라벨이 없다. null로 차트 기본값을 지운다
  nodeSelector: null
  tolerations: []
  volumes:
    - { name: seatmaps, emptyDir: {} }
  volumeMounts:
    - { name: seatmaps, mountPath: /etc/peaket/seatmaps, readOnly: true }
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }
