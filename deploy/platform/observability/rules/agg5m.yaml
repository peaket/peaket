# 5분 집계 기록 규칙(ADR-0356 결정 3, docs/observability.md §4 '그 밖의 규칙 평가 간격'의 agg5m 행·§9 보존 표).
# 이름이 agg5m:으로 시작하는 기록 규칙은 평가 간격 5분인 이 묶음에만 둔다. 원격 쓰기 agg5m은 그 앞머리 하나로 골라 보낸다
# (deploy/platform/observability/prometheus/remote-write.yaml). 첫 묶음은 서비스별 네 신호 요약(요청 비율·5xx 비율·성공 p99)이다.
# 둘째 묶음은 28일 남은 예산의 입력인 여정별 실패 수·전체 수의 5분 증가량이다(OPS-090, F-01-5에서 더했다. docs/observability.md §4 '28일 남은 예산').
# 그 합을 Mimir 규칙 평가기(deploy/platform/observability/mimir/rules/slo-budget28d.yaml)가 28일 창으로 더한다. 원천은 rules/slo-onsale.yaml의 1층과 같다(ADR-0382 결정 1).
# 검사: node tools/ci/observability-config.mjs --check(앞머리를 단 규칙이 모두 5분 묶음 안에 있는지)
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: agg5m
  namespace: observability
  labels:
    app.kubernetes.io/part-of: peaket
spec:
  groups:
    - name: agg5m-service-signals
      interval: 5m
      rules:
        - record: agg5m:http_server_requests:rate5m
          expr: sum by (service) (rate(http_server_request_duration_seconds_count[5m]))
        - record: agg5m:http_server_errors:ratio_rate5m
          expr: (sum by (service) (rate(http_server_errors_total[5m])) or 0 * sum by (service) (rate(http_server_request_duration_seconds_count[5m]))) / sum by (service) (rate(http_server_request_duration_seconds_count[5m]))
        - record: agg5m:http_server_request_duration_seconds:p99_success_5m
          expr: histogram_quantile(0.99, sum by (service, le) (rate(http_server_request_duration_seconds_bucket{status_class!="5xx"}[5m])))
    - name: agg5m-slo-budget
      interval: 5m
      rules:
        # 실패 수·전체 수의 5분 증가량(1층과 같은 원천). 요청이 없으면 0, 원천이 긁히지 않으면 값 없음
        - record: agg5m:slo_errors:increase5m
          expr: |
            (
              sum(increase(http_server_request_duration_seconds_count{service="purchase-svc",route="/v1/events/{eventId}/holds",method="POST",status_class="5xx"}[5m]))
              or vector(0)
            )
            and on() (max(up{app="purchase-svc"}) == 1)
          labels:
            journey: hold
        - record: agg5m:slo_requests:increase5m
          expr: |
            (
              sum(increase(http_server_request_duration_seconds_count{service="purchase-svc",route="/v1/events/{eventId}/holds",method="POST"}[5m]))
              or vector(0)
            )
            and on() (max(up{app="purchase-svc"}) == 1)
          labels:
            journey: hold
        - record: agg5m:slo_errors:increase5m
          expr: |
            (
              sum(increase(http_server_request_duration_seconds_count{service="purchase-svc",route="/v1/orders/{orderId}/payment-acceptance",method="POST",status_class="5xx"}[5m]))
              or vector(0)
            )
            and on() (max(up{app="purchase-svc"}) == 1)
          labels:
            journey: payment_accept
        - record: agg5m:slo_requests:increase5m
          expr: |
            (
              sum(increase(http_server_request_duration_seconds_count{service="purchase-svc",route="/v1/orders/{orderId}/payment-acceptance",method="POST"}[5m]))
              or vector(0)
            )
            and on() (max(up{app="purchase-svc"}) == 1)
          labels:
            journey: payment_accept
        - record: agg5m:slo_errors:increase5m
          expr: |
            (
              (sum(increase(payment_confirm_resolution_seconds_count[5m])) - sum(increase(payment_confirm_resolution_seconds_bucket{le="3"}[5m])))
              or vector(0)
            )
            and on() (max(up{app="payment-svc"}) == 1)
          labels:
            journey: payment_confirm
        - record: agg5m:slo_requests:increase5m
          expr: |
            (
              sum(increase(payment_confirm_resolution_seconds_count[5m]))
              or vector(0)
            )
            and on() (max(up{app="payment-svc"}) == 1)
          labels:
            journey: payment_confirm
        - record: agg5m:slo_errors:increase5m
          expr: |
            (
              (sum(increase(realtime_gw_batch_wait_ms_count[5m])) - sum(increase(realtime_gw_batch_wait_ms_bucket{le="300"}[5m])))
              or vector(0)
            )
            and on() (max(up{app="realtime-gw"}) == 1)
          labels:
            journey: seat_status
        - record: agg5m:slo_requests:increase5m
          expr: |
            (
              sum(increase(realtime_gw_batch_wait_ms_count[5m]))
              or vector(0)
            )
            and on() (max(up{app="realtime-gw"}) == 1)
          labels:
            journey: seat_status
        - record: agg5m:slo_errors:increase5m
          expr: |
            (
              sum(increase(http_server_request_duration_seconds_count{service="queue-svc",route="/v1/queues/{eventId}/entries",method="POST",status_class="5xx"}[5m]))
              or vector(0)
            )
            and on() (max(up{app="queue-svc"}) == 1)
          labels:
            journey: queue_entry
        - record: agg5m:slo_requests:increase5m
          expr: |
            (
              sum(increase(http_server_request_duration_seconds_count{service="queue-svc",route="/v1/queues/{eventId}/entries",method="POST"}[5m]))
              or vector(0)
            )
            and on() (max(up{app="queue-svc"}) == 1)
          labels:
            journey: queue_entry
