              and
              (peaket:slo_error_ratio:rate25s{journey="queue_entry"} > 3 * peaket:slo_error_budget:ratio{journey="queue_entry"})
            )
          labels:
            severity: sev2
            kind: slo
            journey: queue_entry
          annotations:
            summary: '대기열 진입(queue_entry) 실패가 온세일 예산을 3배 속도로 쓴다(회차 {{ $labels.event_id }})'
            description: '5m 창과 25s 창의 실패 비율이 모두 허용 실패 비율(1 − 목표 0.999)의 3배를 넘는다. 임시 원천(ADR-0382 결정 1): queue-svc POST /v1/queues/{eventId}/entries, 실패는 5xx. 1층에 회차 라벨이 없어 진행 중인 회차마다 같은 값으로 낸다(ADR-0382 결정 2). 배포 직후면 RB-23, 결제사 원인이면 RB-07.'
            runbook_url: 'https://github.com/peaket/peaket/blob/develop/docs/infra.md#10-런북-목차-예정-runbooks-작성-대상'
            dashboard_url: '/explore?orgId=1&left=%7B%22datasource%22%3A%22prometheus%22%2C%22queries%22%3A%5B%7B%22refId%22%3A%22A%22%2C%22expr%22%3A%22peaket%3Aslo_error_ratio%3Arate5m%7Bjourney%3D%5C%22queue_entry%5C%22%7D%20%2F%20peaket%3Aslo_error_budget%3Aratio%7Bjourney%3D%5C%22queue_entry%5C%22%7D%20or%20peaket%3Aslo_error_ratio%3Arate25s%7Bjourney%3D%5C%22queue_entry%5C%22%7D%20%2F%20peaket%3Aslo_error_budget%3Aratio%7Bjourney%3D%5C%22queue_entry%5C%22%7D%22%7D%5D%2C%22range%22%3A%7B%22from%22%3A%22now-1h%22%2C%22to%22%3A%22now%22%7D%7D'
            explore_url: '/explore?orgId=1&left=%7B%22datasource%22%3A%22prometheus%22%2C%22queries%22%3A%5B%7B%22refId%22%3A%22A%22%2C%22expr%22%3A%22sum%20by%20(route%2C%20status_class)%20(rate(http_server_request_duration_seconds_count%7Bservice%3D%5C%22queue-svc%5C%22%2Croute%3D%5C%22%2Fv1%2Fqueues%2F%7BeventId%7D%2Fentries%5C%22%2Cmethod%3D%5C%22POST%5C%22%2Cstatus_class%3D%5C%225xx%5C%22%7D%5B1m%5D))%22%7D%5D%2C%22range%22%3A%7B%22from%22%3A%22now-1h%22%2C%22to%22%3A%22now%22%7D%7D'
        # SEV2 결제 확정 원인(결제사마다, 회차와 상관없이 낸다)
        - alert: payment_confirm_pg_cause
          expr: |
            group by (pg) (
              (
                (
                    sum by (pg) (rate(payment_confirm_seconds_count[1m]))
                  - sum by (pg) (rate(payment_confirm_seconds_bucket{le="2"}[1m]))
                ) / sum by (pg) (rate(payment_confirm_seconds_count[1m])) >= 0.01
              )
              or
              (
                max by (pg) (payment_pg_circuit_open) == 1
              )
              or
              (
                sum by (pg) (rate(payment_confirm_declined_total{category="PG_ERROR"}[1m])) / sum by (pg) (rate(payment_confirm_seconds_count[1m])) >= 0.01
              )
              or
              (
                sum by (pg) (increase(pg_throttled_total{first="true"}[1m])) > 0
              )
            )
          labels:
            severity: sev2
            kind: cause
            dependency: payment-gateway
          annotations:
            summary: '결제사 {{ $labels.pg }} 쪽에 결제 확정을 늦추는 원인이 있다'
            description: '1분 창에서 승인 호출의 1% 이상이 2초를 넘었거나, 서킷이 열린 파드가 있거나, 결제사 오류(PG_ERROR)가 승인 호출의 1% 이상이거나, 첫 승인 호출이 한도 초과(429)를 받았다(docs/observability.md §4 결제 확정 원인 넷). 전환 검토는 RB-07(확정 소요 p99 5초 또는 서킷 열림).'
            runbook_url: 'https://github.com/peaket/peaket/blob/develop/docs/infra.md#10-런북-목차-예정-runbooks-작성-대상'
            dashboard_url: '/explore?orgId=1&left=%7B%22datasource%22%3A%22prometheus%22%2C%22queries%22%3A%5B%7B%22refId%22%3A%22A%22%2C%22expr%22%3A%22max%20by%20(pg)%20(payment_pg_circuit_open)%20or%20sum%20by%20(pg)%20(rate(payment_confirm_declined_total%7Bcategory%3D%5C%22PG_ERROR%5C%22%7D%5B1m%5D))%20%2F%20sum%20by%20(pg)%20(rate(payment_confirm_seconds_count%5B1m%5D))%22%7D%5D%2C%22range%22%3A%7B%22from%22%3A%22now-1h%22%2C%22to%22%3A%22now%22%7D%7D'
