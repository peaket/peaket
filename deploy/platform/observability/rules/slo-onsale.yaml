        - alert: slo_onsale_slow_burn
          expr: |
            group by (event_id) (admission_target)
            * on() group_left()
            (
              (peaket:slo_error_ratio:rate5m{journey="seat_status"} > 3 * peaket:slo_error_budget:ratio{journey="seat_status"})
              and
              (peaket:slo_error_ratio:rate25s{journey="seat_status"} > 3 * peaket:slo_error_budget:ratio{journey="seat_status"})
            )
          labels:
            severity: sev2
            kind: slo
            journey: seat_status
          annotations:
            summary: '좌석 상태 전파(seat_status) 실패가 온세일 예산을 3배 속도로 쓴다(회차 {{ $labels.event_id }})'
            description: '5m 창과 25s 창의 실패 비율이 모두 허용 실패 비율(1 − 목표 0.99)의 3배를 넘는다. 임시 원천(ADR-0382 결정 1): realtime-gw realtime_gw_batch_wait_ms, 실패는 300ms 넘김. 1층에 회차 라벨이 없어 진행 중인 회차마다 같은 값으로 낸다(ADR-0382 결정 2). 배포 직후면 RB-23, 결제사 원인이면 RB-07.'
            runbook_url: 'https://github.com/peaket/peaket/blob/develop/docs/infra.md#10-런북-목차-예정-runbooks-작성-대상'
            dashboard_url: '/explore?orgId=1&left=%7B%22datasource%22%3A%22prometheus%22%2C%22queries%22%3A%5B%7B%22refId%22%3A%22A%22%2C%22expr%22%3A%22peaket%3Aslo_error_ratio%3Arate5m%7Bjourney%3D%5C%22seat_status%5C%22%7D%20%2F%20peaket%3Aslo_error_budget%3Aratio%7Bjourney%3D%5C%22seat_status%5C%22%7D%20or%20peaket%3Aslo_error_ratio%3Arate25s%7Bjourney%3D%5C%22seat_status%5C%22%7D%20%2F%20peaket%3Aslo_error_budget%3Aratio%7Bjourney%3D%5C%22seat_status%5C%22%7D%22%7D%5D%2C%22range%22%3A%7B%22from%22%3A%22now-1h%22%2C%22to%22%3A%22now%22%7D%7D'
            explore_url: '/explore?orgId=1&left=%7B%22datasource%22%3A%22prometheus%22%2C%22queries%22%3A%5B%7B%22refId%22%3A%22A%22%2C%22expr%22%3A%22sum(rate(realtime_gw_batch_wait_ms_count%5B1m%5D))%20-%20sum(rate(realtime_gw_batch_wait_ms_bucket%7Ble%3D%5C%22300%5C%22%7D%5B1m%5D))%22%7D%5D%2C%22range%22%3A%7B%22from%22%3A%22now-1h%22%2C%22to%22%3A%22now%22%7D%7D'
        - alert: slo_onsale_slow_burn
          expr: |
            group by (event_id) (admission_target)
            * on() group_left()
            (
