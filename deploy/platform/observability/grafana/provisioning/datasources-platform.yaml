# Grafana 데이터 소스 프로비저닝 중 운영 관측 스택에만 있는 것(ADR-0356 결정 2, docs/observability.md §9 'Grafana 권한').
# 로컬에는 Mimir·Loki·Tempo·Pyroscope·ClickHouse가 없어 로컬 ConfigMap에 싣지 않는다(tools/local/cluster.mjs는 datasources.yaml만 읽는다).
# 주소는 구간 5(INF-020·INF-040)에서 실제 배치에 맞춰 확정한다 [가정].
# 데이터 소스 사이 연결(observability §1 '관측 저장소 설정 원천과 로컬 확인'의 Grafana 신호 연결, §2 '신호 연결'): Mimir 원본의 exemplar traceId → Tempo,
# Tempo의 서비스 지도 → Mimir 원본과 노드 그래프, Tempo → Pyroscope, Loki의 traceId 파생 필드 → Tempo, Tempo의 tracesToLogsV2 → Loki(V-T50 ⑨).
# 검사: node tools/ci/observability-config.mjs --check, node tools/ci/observability-stores.mjs --check(연결이 같은 조직의 데이터 소스를 가리키는지)
apiVersion: 1
datasources:
  # Mimir 테넌트 둘(원본 raw, 5분 집계 agg5m, observability §9 보존 표). 같은 Mimir에 테넌트 머리만 다르다
  - name: Mimir 원본
    uid: mimir-raw
    orgId: 1
    type: prometheus
    access: proxy
    url: http://mimir.observability.svc:8080/prometheus
    jsonData:
      httpHeaderName1: X-Scope-OrgID
      exemplarTraceIdDestinations:
        - name: traceId
          datasourceUid: tempo
    secureJsonData:
      httpHeaderValue1: raw
    editable: false
  - name: Mimir 5분 집계
    uid: mimir-agg5m
    orgId: 1
    type: prometheus
    access: proxy
    url: http://mimir.observability.svc:8080/prometheus
    jsonData:
      httpHeaderName1: X-Scope-OrgID
    secureJsonData:
      httpHeaderValue1: agg5m
    editable: false
  # Loki(정형 로그와 온세일 공용 대시보드의 주석, uid loki). 로그 줄의 traceId를 Tempo로 잇는다(§1 'Grafana 신호 연결', V-T50 ⑨)
  - name: Loki
    uid: loki
    orgId: 1
    type: loki
    access: proxy
    url: http://loki.observability.svc:3100
    jsonData:
      derivedFields:
        - name: traceId
          matcherRegex: '"traceId":"([0-9a-f]{32})"'
          datasourceUid: tempo
    editable: false
  - name: Tempo
    uid: tempo
    orgId: 1
    type: tempo
    access: proxy
    url: http://tempo.observability.svc:3200
    jsonData:
      # 서비스 지도: metrics-generator가 Mimir 원본(raw)에 쓴 traces_service_graph_* (§6 '내부 서비스 지도')
      serviceMap:
        datasourceUid: mimir-raw
      nodeGraph:
        enabled: true
      # 같은 서비스·시간대의 프로파일(§2 '신호 연결')
      tracesToProfiles:
        datasourceUid: pyroscope
        tags:
          - key: service.name
            value: service_name
        profileTypeId: process_cpu:cpu:nanoseconds:cpu:nanoseconds
      # 같은 traceId의 로그를 Loki에서 찾는다(§2 '신호 연결', V-T50 ⑨). 태그는 Loki 라벨 이름과 짝이다
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true
        tags:
          - key: service.name
            value: service
          - key: k8s.namespace.name
            value: namespace
    editable: false
  - name: Pyroscope
    uid: pyroscope
    orgId: 1
    type: grafana-pyroscope-datasource
    access: proxy
    url: http://pyroscope.observability.svc:4040
    editable: false
  # ClickHouse 골드(비교 대시보드, 골드 읽기 전용 사용자 an_grafana_reader). 비밀번호는 운영 비밀에서 넣는다
  - name: ClickHouse 골드
    uid: clickhouse-gold
    orgId: 1
    type: grafana-clickhouse-datasource
    jsonData:
      host: clickhouse.analytics.svc
      port: 9440
      protocol: native
      secure: true
      username: an_grafana_reader
    secureJsonData:
      password: $__env{PEAKET_GRAFANA_CLICKHOUSE_PASSWORD}
    editable: false
