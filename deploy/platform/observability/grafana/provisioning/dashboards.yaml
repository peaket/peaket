# Grafana 대시보드 공급자(ADR-0356 결정 1·2, docs/observability.md §3 '대상·폴더·조직').
# 폴더마다 공급자 하나: 조직(orgId)·폴더 제목·uid는 deploy/platform/observability/grafana/access.yaml의 folders와 같고,
# 경로는 /var/lib/grafana/dashboards/<폴더 uid>(저장소의 deploy/local/dashboards/<폴더 uid>/, tools/local/dashboards.mjs가 만든다).
# 화면에서 고친 것은 저장하지 않는다(allowUiUpdates false, observability §9). 지운 파일의 대시보드도 화면에서 지우지 못한다.
# 로컬: node tools/local/cluster.mjs observability가 이 파일로 Grafana 설정 ConfigMap을 만든다.
# 검사: node tools/ci/observability-config.mjs --check
apiVersion: 1
providers:
  - name: queue
    orgId: 1
    folder: 대기열 팀
    folderUid: queue
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards/queue
  - name: purchase
    orgId: 1
    folder: 구매 팀(예매·결제)
    folderUid: purchase
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards/purchase
  - name: ticketing
    orgId: 1
    folder: 발권 팀
    folderUid: ticketing
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards/ticketing
  - name: bot-detection
    orgId: 1
    folder: 봇 탐지 팀
    folderUid: bot-detection
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards/bot-detection
  - name: platform
    orgId: 1
    folder: 플랫폼 팀
    folderUid: platform
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards/platform
  - name: onsale
    orgId: 1
    folder: 온세일 공용
    folderUid: onsale
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards/onsale
