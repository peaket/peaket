# 법정 접속기록 대조·일 해시 앵커·하루 사본 작업 설정(BUILD_ORDER F-01-8 OPS-070).
# 정본: docs/observability.md §7 '법정 사본은 잃지 않는 갈래' ④⑤와 §5 '법정 접속기록 갈래 신호', docs/infra.md §6 'ClickHouse 접속기록 DB'.
# 배포(CronJob·역할·버킷·KMS)는 INF-020이 한다. 로컬 실행기는 tools/local/access-log-jobs.mjs다.
reconcile:
  # 5분마다 15분 전의 5분 칸을 본다(§7 ④)
  schedule: "*/5 * * * *"
  windowOffsetMinutes: 15
  windowMinutes: 5
  # 모자란 비율이 0.1%를 넘으면 SEV2(kind legal). 원천이 0이면 '확인할 수 없음'이고 통과가 아니다
  shortfallThreshold: 0.001
  shortfallMetric: access_log_shortfall_ratio
  seqGapMetric: access_log_seq_gaps_total
anchor:
  # 다음 날 03:30에 전날 하루를 같은 방법으로 대조하고 일 해시 앵커를 남긴다
  schedule: "30 3 * * *"
  format: JSON
copy:
  # 매일 04:00에 전날 파티션을 Parquet 파일 하나로 접속기록 사본 버킷에 둔다
  schedule: "0 4 * * *"
  format: Parquet
  bucket: peaket-access-log-copy
  objectLock: COMPLIANCE
  # 그 날짜의 3개월 보존 + 7일 [가정]
  retention: P3M7D
  # 전날 사본 성공 표시가 06:00까지 없으면 SEV2
  missingBy: "06:00"
  lastSuccessMetric: access_log_export_last_success_timestamp
  writeRole: access-log-export
  restoreRole: access-log-restore
