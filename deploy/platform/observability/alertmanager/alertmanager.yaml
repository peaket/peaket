# 경보 보내는 길(Alertmanager 설정 원천). 정본: docs/observability.md §5 '경보 보내는 길'·§5 심각도별 채널 표,
# docs/verification.md V-T53 ①③⑤·V-T54 ③④⑥, docs/security/secrets-and-keys.md(주소·토큰은 설정에 적지 않고 파일에서 읽는다).
# 받는 곳 다섯(irm-oncall·slack-ops·github-issues·deadman·evidence-collector)과 비밀 파일 일곱은
# /etc/alertmanager/secrets/ 아래에 있다(INF-020·INF-040이 ExternalSecret으로 넣는다).
# 경로 차례: Watchdog(데드맨) → OpsApprovalPending(온콜) → 증거 수집기(SEV1·SEV2 cause·IncidentDeclared, 이어 감)
#   → SEV1(IRM·Slack) → SEV2(Slack) → SEV3(티켓 중계). 심각도가 없거나 모르는 값은 맨 위 받는 곳(Slack)으로 간다.
# 묶기 기준은 경로마다 다르다(F-01-7, docs/observability.md:433): SEV1·SEV2의 회차 경보는 [event_id, journey, severity],
# 의존성 원인은 [dependency, severity], 그 밖은 [kind, severity]. 경보 이름은 묶기 기준에 넣지 않는다.
# F-01-6이 만든 경로에 F-01-7이 경로별 묶기·억제·OpsApprovalPending 경로를 더했다.
route:
  receiver: slack-ops
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # 1. 데드맨: Watchdog만 Healthchecks로 보내고 여기서 멈춘다(observability.md §5 데드맨, §10).
    - matchers:
        - alertname="Watchdog"
      receiver: deadman
      group_by: [alertname]
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1m
    # 2. 2인 승인 대기: 온콜 호출(IRM)로만 가고 여기서 멈춘다(docs/observability.md:436).
    - matchers:
        - alertname="OpsApprovalPending"
      receiver: irm-oncall
      group_by: [kind, severity]
    # 3. 증거 수집기: SEV1, kind cause인 SEV2, 인시던트 선언 셋. 아래 경로로도 이어 간다(continue).
    - matchers:
        - severity="sev1"
      receiver: evidence-collector
      continue: true
      group_by: [event_id, journey, dependency, kind, severity]
      group_wait: 5s
      group_interval: 1m
    - matchers:
        - severity="sev2"
        - kind="cause"
      receiver: evidence-collector
      continue: true
      group_by: [event_id, journey, dependency, kind, severity]
      group_wait: 5s
      group_interval: 1m
    - matchers:
        - alertname="IncidentDeclared"
      receiver: evidence-collector
      continue: true
      group_by: [kind, severity]
    # 4. SEV1: IRM 온콜 호출. 같은 경보를 Slack에도 보내야 하므로 이어 간다.
    - matchers:
        - severity="sev1"
      receiver: irm-oncall
      continue: true
      group_by: [event_id, journey, dependency, kind, severity]
      group_wait: 5s
      group_interval: 1m
    # 5. SEV1: 운영 채널(Slack). 회차가 있으면 회차·여정으로 묶는다.
    - matchers:
        - severity="sev1"
      receiver: slack-ops
      group_by: [event_id, journey, dependency, kind, severity]
      group_wait: 5s
      group_interval: 1m
    # 6. SEV2: 운영 채널(Slack). 회차 경보·의존성 원인·그 밖을 경로로 갈라 묶는다(observability.md:433).
    - matchers:
        - severity="sev2"
        - event_id=~".+"
      receiver: slack-ops
      group_by: [event_id, journey, severity]
      group_wait: 5s
      group_interval: 1m
    - matchers:
        - severity="sev2"
        - dependency=~".+"
      receiver: slack-ops
      group_by: [dependency, severity]
      group_wait: 5s
      group_interval: 1m
    - matchers:
        - severity="sev2"
      receiver: slack-ops
      group_by: [kind, severity]
      group_wait: 5s
      group_interval: 1m
    # 7. SEV3: GitHub Issues 티켓 중계. 묶음 값은 Alertmanager 기본값을 쓴다(observability.md §4 표).
    - matchers:
        - severity="sev3"
      receiver: github-issues
      group_by: [kind, severity]

# 억제: 예산 SEV1(kind slo, 회차·여정이 있는 경보)이 같은 회차·여정의 SEV2를 누른다.
# 누르는 쪽에 event_id·journey가 비어 있지 않음을 요구해, 라벨 없는 SEV1이 라벨 없는 SEV2를 누르는 함정을 막는다
# (docs/observability.md:434, V-T54 ④).
inhibit_rules:
  - source_matchers:
      - severity="sev1"
      - kind="slo"
      - event_id=~".+"
      - journey=~".+"
    target_matchers:
      - severity="sev2"
    equal: [event_id, journey]

# 받는 곳 다섯. 주소·토큰은 파일에서만 읽는다(글 주소·토큰 키를 쓰지 않는다).
receivers:
  - name: irm-oncall
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/irm-oncall-url
        send_resolved: true
  - name: slack-ops
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack-ops-url
        send_resolved: true
        title: '{{ template "peaket.slack.title" . }}'
        text: '{{ template "peaket.slack.text" . }}'
        # 기본 fallback은 그 묶음의 공통 라벨을 모두 실어 account_id 같은 이용자 식별값이 샐 수 있다. 정한 라벨만 싣는다.
        fallback: '{{ template "peaket.slack.fallback" . }}'
  - name: github-issues
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/alert-issue-relay-url
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/secrets/alert-issue-relay-token
  - name: deadman
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/healthchecks-ping-url
        send_resolved: false
  - name: evidence-collector
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/evidence-collector-url
        send_resolved: false
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/secrets/evidence-collector-token

templates:
  - /etc/alertmanager/templates/*.tmpl

# 해제 알림이 다시 오지 않는 경보의 묶음을 정리하는 시간(Alertmanager 기본값과 같은 5분).
global:
  resolve_timeout: 5m
