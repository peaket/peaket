# 경보 보내는 길(Alertmanager 설정 원천). 정본: docs/observability.md §5 '경보 보내는 길'·§5 심각도별 채널 표,
# docs/verification.md V-T53 ①③⑤, docs/security/secrets-and-keys.md(주소·토큰은 설정에 적지 않고 파일에서 읽는다).
# 받는 곳 다섯(irm-oncall·slack-ops·github-issues·deadman·evidence-collector)과 비밀 파일 일곱은
# /etc/alertmanager/secrets/ 아래에 있다(INF-020·INF-040이 ExternalSecret으로 넣는다).
# 경로 차례: Watchdog(데드맨) → 증거 수집기(SEV1·SEV2 cause·IncidentDeclared, 이어 감) → SEV1(IRM·Slack) → SEV2(Slack) → SEV3(티켓 중계).
# 심각도가 없거나 모르는 값은 맨 위 받는 곳(Slack)으로 간다. 묶기 기준은 지금 여섯 라벨이고, 경로별 묶기·억제는
# F-01-7(OPS-130)이 이 파일을 고쳐 더한다.
route:
  receiver: slack-ops
  group_by: [alertname, severity, kind, event_id, journey, dependency]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # 1. 데드맨: Watchdog만 Healthchecks로 보내고 여기서 멈춘다(observability.md §5 데드맨, §10).
    - matchers:
        - alertname="Watchdog"
      receiver: deadman
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1m
    # 2. 증거 수집기: SEV1, kind cause인 SEV2, 인시던트 선언 셋. 아래 경로로도 이어 간다(continue).
    - matchers:
        - severity="sev1"
      receiver: evidence-collector
      continue: true
      group_wait: 5s
      group_interval: 1m
    - matchers:
        - severity="sev2"
        - kind="cause"
      receiver: evidence-collector
      continue: true
      group_wait: 5s
      group_interval: 1m
    - matchers:
        - alertname="IncidentDeclared"
      receiver: evidence-collector
      continue: true
    # 3. SEV1: IRM 온콜 호출과 운영 채널(Slack). 호출은 같은 경보를 Slack에도 보내야 하므로 이어 간다.
    - matchers:
        - severity="sev1"
      receiver: irm-oncall
      continue: true
      group_wait: 5s
      group_interval: 1m
    - matchers:
        - severity="sev1"
      receiver: slack-ops
      group_wait: 5s
      group_interval: 1m
    # 4. SEV2: 운영 채널(Slack). 묶음 대기 5초·묶음 간격 1분(observability.md §4 표, §5).
    - matchers:
        - severity="sev2"
      receiver: slack-ops
      group_wait: 5s
      group_interval: 1m
    # 5. SEV3: GitHub Issues 티켓 중계. 묶음 값은 Alertmanager 기본값을 쓴다(observability.md §4 표).
    - matchers:
        - severity="sev3"
      receiver: github-issues

# 받는 곳 다섯. 주소·토큰은 파일에서만 읽는다(글 주소·토큰 키를 쓰지 않는다).
receivers:
  - name: irm-oncall
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/irm-oncall-url
        send_resolved: true
  - name: slack-ops
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack-ops-url
        send_resolved: true
        title: '{{ template "peaket.slack.title" . }}'
        text: '{{ template "peaket.slack.text" . }}'
        # 기본 fallback은 그 묶음의 공통 라벨을 모두 실어 account_id 같은 이용자 식별값이 샐 수 있다. 정한 라벨만 싣는다.
        fallback: '{{ template "peaket.slack.fallback" . }}'
  - name: github-issues
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/alert-issue-relay-url
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/secrets/alert-issue-relay-token
  - name: deadman
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/healthchecks-ping-url
        send_resolved: false
  - name: evidence-collector
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/evidence-collector-url
        send_resolved: false
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/secrets/evidence-collector-token

templates:
  - /etc/alertmanager/templates/*.tmpl

# 해제 알림이 다시 오지 않는 경보의 묶음을 정리하는 시간(Alertmanager 기본값과 같은 5분).
global:
  resolve_timeout: 5m
