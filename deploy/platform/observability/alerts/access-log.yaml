# 법정 접속기록 갈래 경보(SEV2 kind legal)와 조사 사본 버림(SEV3 kind hygiene).
# 정본: docs/observability.md §5 '법정 접속기록 갈래 신호', docs/infra.md §10 RB-38, docs/verification.md V-T21~V-T23.
# 수집기 자체 지표는 exporter·receiver 성분 라벨을 쓴다(pipeline 라벨은 없다).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: peaket-access-log
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: peaket-access-log
      interval: 1m
      rules:
        # 버린 조사 사본 줄. 노드 구분은 긁기 대상의 외부 라벨(node)이 붙인다(INF-020).
        - record: inv_copy_dropped_total
          expr: sum(increase(otelcol_exporter_enqueue_failed_log_records{exporter="kafka/investigation"}[5m]))
        - alert: AccessLogIngestFailures
          expr: increase(otelcol_exporter_enqueue_failed_log_records{exporter="clickhouse/access-log"}[5m]) > 0 or increase(otelcol_receiver_refused_log_records{receiver="filelog/envoy-legal"}[5m]) > 0 or increase(otelcol_receiver_refused_log_records{receiver="filelog/identity-legal"}[5m]) > 0
          labels:
            severity: sev2
            kind: legal
          annotations:
            summary: 법정 접속기록 갈래에서 줄을 잃었다(넣기 실패 또는 받기 거절)
            runbook_url: https://runbooks.peaket.example/RB-38
            dashboard_url: /d/peaket-obs-pipeline
        - alert: AccessLogQueueHigh
          expr: (otelcol_exporter_queue_size{exporter="clickhouse/access-log"} / otelcol_exporter_queue_capacity{exporter="clickhouse/access-log"}) > 0.5 or increase(otelcol_exporter_send_failed_log_records{exporter="clickhouse/access-log"}[5m]) > 0
          labels:
            severity: sev2
            kind: legal
          annotations:
            summary: 법정 접속기록 디스크 큐가 50%를 넘거나 보내기가 5분 넘게 실패한다
            runbook_url: https://runbooks.peaket.example/RB-38
            dashboard_url: /d/peaket-obs-pipeline
        - alert: AccessLogShortfall
          expr: access_log_shortfall_ratio > 0.001
          labels:
            severity: sev2
            kind: legal
          annotations:
            summary: 5분 칸 대조에서 게이트웨이 접속기록이 원천 요청 수보다 0.1% 넘게 모자란다
            runbook_url: https://runbooks.peaket.example/RB-38
            dashboard_url: /d/peaket-obs-pipeline
        - alert: AccessLogSeqGaps
          expr: access_log_seq_gaps_total > 0
          labels:
            severity: sev2
            kind: legal
          annotations:
            summary: identity 접속기록 줄에 빈 일련번호가 있다
            runbook_url: https://runbooks.peaket.example/RB-38
            dashboard_url: /d/peaket-obs-pipeline
        # 전날 사본이 06:00(KST)까지 없다. UTC 시각에 9시간을 더해 KST로 비교하고, 지표가 없어도 울린다.
        - alert: AccessLogDailyCopyLate
          expr: absent(access_log_export_last_success_timestamp) or (hour(vector(time()) + 9 * 3600) >= 6 and on() (year(access_log_export_last_success_timestamp + 9 * 3600) < scalar(year(vector(time()) + 9 * 3600)) or month(access_log_export_last_success_timestamp + 9 * 3600) < scalar(month(vector(time()) + 9 * 3600)) or day_of_month(access_log_export_last_success_timestamp + 9 * 3600) < scalar(day_of_month(vector(time()) + 9 * 3600))))
          labels:
            severity: sev2
            kind: legal
          annotations:
            summary: 전날 하루 사본이 06:00까지 없다(마지막 성공이 전날 이전이거나 지표가 없다)
            runbook_url: https://runbooks.peaket.example/RB-38
            dashboard_url: /d/peaket-obs-pipeline
        # F-02-4 보존 만료 파기·관리 계정 2년 복사. 늦으면 개인정보를 보존 기간 넘게 두는 일이라 SEV2 kind legal이다.
        - alert: AccessLogPurgeOverdue
          expr: access_log_overdue_partitions > 0
          for: 24h
          labels:
            severity: sev2
            kind: legal
          annotations:
            summary: 3개월이 지난 접속기록 파티션이 24시간 넘게 남아 있다
            runbook_url: https://runbooks.peaket.example/RB-38
            dashboard_url: /d/peaket-obs-pipeline
        - alert: AccessLogPurgeFailed
          expr: absent(access_log_purge_last_success_timestamp) or time() - access_log_purge_last_success_timestamp > 36 * 3600
          labels:
            severity: sev2
            kind: legal
          annotations:
            summary: 접속기록 보존 만료 파기 잡이 36시간 넘게 성공하지 못했다
            runbook_url: https://runbooks.peaket.example/RB-38
            dashboard_url: /d/peaket-obs-pipeline
        - alert: AccessLogAdminCopyLate
          expr: absent(access_log_admin_copy_last_success_timestamp) or (hour(vector(time()) + 9 * 3600) >= 6 and on() (year(access_log_admin_copy_last_success_timestamp + 9 * 3600) < scalar(year(vector(time()) + 9 * 3600)) or month(access_log_admin_copy_last_success_timestamp + 9 * 3600) < scalar(month(vector(time()) + 9 * 3600)) or day_of_month(access_log_admin_copy_last_success_timestamp + 9 * 3600) < scalar(day_of_month(vector(time()) + 9 * 3600)))) or increase(access_log_admin_copy_rows_total{result="failed"}[5m]) > 0
          labels:
            severity: sev2
            kind: legal
          annotations:
            summary: 전날 관리 계정 접속기록의 2년 감사 저장소 복사가 06:00까지 없다
            runbook_url: https://runbooks.peaket.example/RB-38
            dashboard_url: /d/peaket-obs-pipeline
        - alert: AccessLogPurgeAuditFailed
          expr: increase(access_log_purge_audit_failures_total[5m]) > 0
          labels:
            severity: sev2
            kind: legal
          annotations:
            summary: 접속기록 파기 기록을 남기지 못해 파기를 멈췄다(닫힘 실패)
            runbook_url: https://runbooks.peaket.example/RB-38
            dashboard_url: /d/peaket-obs-pipeline
        - alert: InvCopyDropped
          expr: inv_copy_dropped_total > 0
          labels:
            severity: sev3
            kind: hygiene
          annotations:
            summary: 조사 사본 갈래가 큐가 차서 줄을 버렸다(법정 사본은 멈추지 않는다)
            runbook_url: https://runbooks.peaket.example/RB-38
            dashboard_url: /d/peaket-obs-pipeline
