# 운영 Prometheus의 5초 긁기 작업 slo-fast(F-01-5, OPS-090, 시험 V-T51 ⑧).
# 정본: docs/observability.md §4 '긁기·평가·알림 간격' 표 첫 줄(제어 입력·온세일 SLI 긁기 5초)과 'SLO 기록 규칙과 원천'의 '긁기' 항목.
# 대상: 핫패스 서비스(queue-svc·purchase-svc·payment-svc), admission-ctrl, 좌석 상태 임시 원천 realtime-gw(ADR-0382 결정 1).
# 포트는 공용 서비스 차트의 관리 포트(이름 management, /metrics, deploy/charts/peaket-service/templates/_helpers.tpl)다. 서비스마다 네임스페이스가 달라 이름표로만 고른다.
# 파드 이름표 app.kubernetes.io/name을 app 라벨로 옮긴다. SLO 기록 규칙의 '원천이 긁힘' 조건(up{app="<서비스>"})과 로컬 Prometheus(deploy/local/observability.yaml)가 같은 라벨을 쓴다.
# 같은 파드를 15초 일반 작업이 함께 긁으면 같은 시계열이 두 번 들어와 짧은 창 비율이 흔들린다. 일반 작업에서는 이 다섯을 뺀다(적용은 INF-020).
# 적용(Prometheus Operator가 PodMonitor를 읽는다)은 INF-020이다. 로컬 Prometheus는 이미 모든 대상을 5초로 긁는다.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: slo-fast
  namespace: observability
  labels:
    app.kubernetes.io/part-of: peaket
spec:
  namespaceSelector:
    any: true
  selector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [queue-svc, purchase-svc, payment-svc, admission-ctrl, realtime-gw]
  podMetricsEndpoints:
    - port: management
      path: /metrics
      interval: 5s
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
          targetLabel: app
