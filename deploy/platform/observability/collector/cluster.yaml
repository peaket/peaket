# 클러스터 수집기(복제 2, 리더 하나만 받음) 운영 판. docs/observability.md §1 '수집기 구성'·'설정 원천과 로컬 확인', §9, ADR-0076.
# 쿠버네티스 이벤트(k8s_objects, 감시 방식)를 리더 선출 확장(k8s_leader_elector)에 묶어 리더 복제만 받고, 묶어서 Loki로 보낸다.
# 쿠버네티스가 없으면 뜨지 않으므로 로컬 판은 없고 정적 검사(node tools/ci/collector-config.mjs --check)만 한다.
# 배포(Deployment·임대 권한·NetworkPolicy)는 INF-020이 한다. Loki 주소는 그 배포와 맞춘다 [가정].
receivers:
  k8s_objects:
    auth_type: serviceAccount
    k8s_leader_elector: k8s_leader_elector
    objects:
      - name: events
        group: events.k8s.io
        mode: watch

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  batch:
    send_batch_size: 1024
    timeout: 1s

exporters:
  otlp_http/loki:
    endpoint: http://loki-gateway.observability.svc:3100/otlp

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  k8s_leader_elector:
    auth_type: serviceAccount
    lease_name: otel-cluster-collector
    lease_namespace: observability

service:
  extensions: [health_check, k8s_leader_elector]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    logs:
      receivers: [k8s_objects]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/loki]
