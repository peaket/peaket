# SLO 온세일 기록 규칙·경보의 합성 시계열 시험(F-01-5, OPS-090, 시험 V-T51 ①~⑤·V-T20 ④).
# 정본: docs/observability.md §4 'SLO 기록 규칙과 원천'·'다중 윈도우 멀티 번 레이트 알림 규칙'·'긁기·평가·알림 간격', docs/verification.md §2.7·V-T20·V-T51.
# 값은 정본에서 적는다(목표 표, 배수 10·3, 창 2분·20초·5분·25초·70분·30초, 2초·1%, 0.5). 입력 간격 5초·평가 5초는 운영(slo-fast 긁기, 온세일 묶음 평가)과 같다.
# 경보는 ALERTS 시계열로 본다(이름·상태·라벨 집합을 그대로 대조하고, 주석은 slo-rules.test.mjs가 본다).
# rule_files는 저장소 뿌리 기준이다. 실행: node tools/ci/prom-rules.mjs test(규칙 CRD에서 spec을 꺼내 promtool test rules에 넘긴다).
# 정수가 아닌 기대값은 abs(값 − 기대) ≤ 기대 × 1e-9로 본다(promtool은 부동소수를 끝자리까지 견주어, 1 − 0.9995처럼 계산한 0.0005도 다르다고 본다).
# 그 앞의 (식) * 0 시험이 결과 라벨 집합을 그대로 대조한다(숫자가 아닌 값이면 0이 되지 않아 실패한다). 이 파일은 일회용 생성기로 만들었고 손으로 고쳐도 된다.
rule_files:
  - deploy/platform/observability/rules/slo-onsale.yaml
evaluation_interval: 5s
tests:
  # V-T51 ①(docs/verification.md V-T51, docs/observability.md §4 'SLO 기록 규칙과 원천'·다중 창 표 SEV1 줄).
  # 허용 실패 비율 0.0005(99.95%). 5초마다 4,000건이라 10배 = 5초에 20건. 9.5배 19건, 10.5배 21건(배수를 11로 바꾸면 10.5배가 울리지 않아 V-T9가 이 시험으로 실패한다).
  # hold: 0~3분 19건, 3~6분 21건, 6분~ 16건. 409(4xx)는 정상이라 분모에만 든다. payment_confirm: 0~4분 30초 19건, ~7분 30초 21건, 그 뒤 16건(direct·retry_queue 두 경로 합).
  - name: 'V-T51 ① 온세일 10배 경보는 2분·20초 두 창이 모두 넘을 때만 SEV1이다'
    interval: 5s
    input_series:
      - series: 'up{app="purchase-svc",pod="purchase-svc-0",namespace="peaket",job="kubernetes-pods"}'
        values: '1x96'
      - series: 'up{app="payment-svc",pod="payment-svc-0",namespace="peaket",job="kubernetes-pods"}'
        values: '1x96'
      - series: 'up{app="queue-svc",pod="queue-svc-0",namespace="peaket",job="kubernetes-pods"}'
        values: '1x96'
      - series: 'up{app="realtime-gw",pod="realtime-gw-0",namespace="peaket",job="kubernetes-pods"}'
        values: '1x96'
      - series: 'admission_target{app="admission-ctrl",pod="admission-ctrl-0",namespace="peaket",event_id="E1"}'
        values: '5000x96'
      - series: 'http_server_request_duration_seconds_count{app="purchase-svc",pod="purchase-svc-0",namespace="peaket",service="purchase-svc",route="/v1/events/{eventId}/holds",method="POST",status_class="2xx"}'
        values: '1000000000 1000002981+2981x35 1000110295+2979x35 1000217544+2984x23'
      - series: 'http_server_request_duration_seconds_count{app="purchase-svc",pod="purchase-svc-0",namespace="peaket",service="purchase-svc",route="/v1/events/{eventId}/holds",method="POST",status_class="4xx"}'
        values: '1000000000 1000001000+1000x95'
      - series: 'http_server_request_duration_seconds_count{app="purchase-svc",pod="purchase-svc-0",namespace="peaket",service="purchase-svc",route="/v1/events/{eventId}/holds",method="POST",status_class="5xx"}'
        values: '1000000000 1000000019+19x35 1000000705+21x35 1000001456+16x23'
      - series: 'http_server_errors_total{app="purchase-svc",pod="purchase-svc-0",namespace="peaket",service="purchase-svc",route="/v1/events/{eventId}/holds",method="POST",status_class="5xx"}'
        values: '1000000000 1000000019+19x35 1000000705+21x35 1000001456+16x23'
      - series: 'payment_confirm_resolution_seconds_bucket{app="payment-svc",pod="payment-svc-0",namespace="peaket",pg="TOSS",path="direct",le="3"}'
        values: '1000000000 1000003585+3585x53 1000197173+3583x35 1000326166+3588x5'
      - series: 'payment_confirm_resolution_seconds_bucket{app="payment-svc",pod="payment-svc-0",namespace="peaket",pg="TOSS",path="direct",le="+Inf"}'
        values: '1000000000 1000003600+3600x95'
      - series: 'payment_confirm_resolution_seconds_count{app="payment-svc",pod="payment-svc-0",namespace="peaket",pg="TOSS",path="direct"}'
        values: '1000000000 1000003600+3600x95'
      - series: 'payment_confirm_resolution_seconds_bucket{app="payment-svc",pod="payment-svc-0",namespace="peaket",pg="TOSS",path="retry_queue",le="3"}'
        values: '1000000000 1000000396+396x95'
      - series: 'payment_confirm_resolution_seconds_bucket{app="payment-svc",pod="payment-svc-0",namespace="peaket",pg="TOSS",path="retry_queue",le="+Inf"}'
        values: '1000000000 1000000400+400x95'
      - series: 'payment_confirm_resolution_seconds_count{app="payment-svc",pod="payment-svc-0",namespace="peaket",pg="TOSS",path="retry_queue"}'
        values: '1000000000 1000000400+400x95'
    promql_expr_test:
      # 목표 상수(docs/observability.md §4 여정 표): 허용 실패 비율 = 1 − 목표, 다섯 여정만
      - expr: '(peaket:slo_error_budget:ratio) * 0'
        eval_time: 0s
        exp_samples:
          - labels: '{journey="hold"}'
            value: 0
          - labels: '{journey="payment_accept"}'
            value: 0
          - labels: '{journey="payment_confirm"}'
            value: 0
          - labels: '{journey="queue_entry"}'
            value: 0
          - labels: '{journey="seat_status"}'
            value: 0
      - expr: 'abs(peaket:slo_error_budget:ratio{journey="hold"} - 0.0005) <= bool 5.000e-13'
        eval_time: 0s
        exp_samples:
          - labels: '{journey="hold"}'
            value: 1
      - expr: 'abs(peaket:slo_error_budget:ratio{journey="payment_accept"} - 0.0005) <= bool 5.000e-13'
        eval_time: 0s
        exp_samples:
          - labels: '{journey="payment_accept"}'
            value: 1
      - expr: 'abs(peaket:slo_error_budget:ratio{journey="payment_confirm"} - 0.0005) <= bool 5.000e-13'
        eval_time: 0s
        exp_samples:
          - labels: '{journey="payment_confirm"}'
            value: 1
      - expr: 'abs(peaket:slo_error_budget:ratio{journey="queue_entry"} - 0.001) <= bool 1.000e-12'
        eval_time: 0s
        exp_samples:
          - labels: '{journey="queue_entry"}'
            value: 1
      - expr: 'abs(peaket:slo_error_budget:ratio{journey="seat_status"} - 0.01) <= bool 1.000e-11'
        eval_time: 0s
        exp_samples:
          - labels: '{journey="seat_status"}'
            value: 1
      # 3분: 두 여정 모두 두 창 9.5배 → 경보 없음
      - expr: 'ALERTS{alertname="slo_onsale_fast_burn"}'
        eval_time: 3m
        exp_samples: []
      - expr: 'peaket:slo:budget_alert10x:state{journey=~"hold|payment_confirm"}'
        eval_time: 3m
        exp_samples:
          - labels: 'peaket:slo:budget_alert10x:state{event_id="E1",journey="hold"}'
            value: 0
          - labels: 'peaket:slo:budget_alert10x:state{event_id="E1",journey="payment_confirm"}'
            value: 0
      - expr: '(peaket:slo_error_ratio:rate2m{journey="hold"}) * 0'
        eval_time: 3m
        exp_samples:
          - labels: '{journey="hold"}'
            value: 0
      - expr: 'abs((peaket:slo_error_ratio:rate2m{journey="hold"}) - 0.00475) <= bool 4.750e-12'
        eval_time: 3m
        exp_samples:
          - labels: '{journey="hold"}'
            value: 1
      - expr: '(peaket:slo_error_ratio:rate20s{journey="hold"}) * 0'
        eval_time: 3m
        exp_samples:
          - labels: '{journey="hold"}'
            value: 0
      - expr: 'abs((peaket:slo_error_ratio:rate20s{journey="hold"}) - 0.00475) <= bool 4.750e-12'
        eval_time: 3m
        exp_samples:
          - labels: '{journey="hold"}'
            value: 1
      # 5분: hold 두 창 10.5배 → SEV1. payment_confirm은 20초 창만 10.5배(2분 창 9.76배) → 없음
      - expr: 'ALERTS{alertname="slo_onsale_fast_burn"}'
        eval_time: 5m
        exp_samples:
          - labels: 'ALERTS{alertname="slo_onsale_fast_burn",alertstate="firing",severity="sev1",kind="slo",event_id="E1",journey="hold"}'
            value: 1
      - expr: 'peaket:slo:budget_alert10x:state{journey=~"hold|payment_confirm"}'
        eval_time: 5m
        exp_samples:
          - labels: 'peaket:slo:budget_alert10x:state{event_id="E1",journey="hold"}'
            value: 1
          - labels: 'peaket:slo:budget_alert10x:state{event_id="E1",journey="payment_confirm"}'
            value: 0
      - expr: '(peaket:slo_error_ratio:rate2m{journey="payment_confirm"}) * 0'
        eval_time: 5m
        exp_samples:
          - labels: '{journey="payment_confirm"}'
            value: 0
      - expr: 'abs((peaket:slo_error_ratio:rate2m{journey="payment_confirm"}) - 0.004880434782608695) <= bool 4.880e-12'
        eval_time: 5m
        exp_samples:
          - labels: '{journey="payment_confirm"}'
            value: 1
      # 6분: 두 여정 모두 두 창 10배 넘음(hold 10.5배, payment_confirm 2분 10.28배·20초 10.5배)
      - expr: 'ALERTS{alertname="slo_onsale_fast_burn"}'
        eval_time: 6m
        exp_samples:
          - labels: 'ALERTS{alertname="slo_onsale_fast_burn",alertstate="firing",severity="sev1",kind="slo",event_id="E1",journey="hold"}'
            value: 1
          - labels: 'ALERTS{alertname="slo_onsale_fast_burn",alertstate="firing",severity="sev1",kind="slo",event_id="E1",journey="payment_confirm"}'
            value: 1
      - expr: 'peaket:slo:budget_alert10x:state{journey=~"hold|payment_confirm"}'
        eval_time: 6m
        exp_samples:
          - labels: 'peaket:slo:budget_alert10x:state{event_id="E1",journey="hold"}'
            value: 1
          - labels: 'peaket:slo:budget_alert10x:state{event_id="E1",journey="payment_confirm"}'
            value: 1
      # 6분 15초: hold는 2분 창만 넘음(10.17배, 20초 창 8배) → 없음
      - expr: 'ALERTS{alertname="slo_onsale_fast_burn"}'
        eval_time: 6m15s
        exp_samples:
          - labels: 'ALERTS{alertname="slo_onsale_fast_burn",alertstate="firing",severity="sev1",kind="slo",event_id="E1",journey="payment_confirm"}'
            value: 1
      - expr: 'peaket:slo:budget_alert10x:state{journey=~"hold|payment_confirm"}'
        eval_time: 6m15s
        exp_samples:
          - labels: 'peaket:slo:budget_alert10x:state{event_id="E1",journey="hold"}'
            value: 0
          - labels: 'peaket:slo:budget_alert10x:state{event_id="E1",journey="payment_confirm"}'
            value: 1
      - expr: '(peaket:slo_error_ratio:rate2m{journey="hold"}) * 0'
        eval_time: 6m15s
        exp_samples:
          - labels: '{journey="hold"}'
            value: 0
      - expr: 'abs((peaket:slo_error_ratio:rate2m{journey="hold"}) - 0.005086956521739131) <= bool 5.087e-12'
        eval_time: 6m15s
        exp_samples:
          - labels: '{journey="hold"}'
            value: 1
      - expr: '(peaket:slo_error_ratio:rate20s{journey="hold"}) * 0'
        eval_time: 6m15s
        exp_samples:
          - labels: '{journey="hold"}'
            value: 0
      - expr: 'abs((peaket:slo_error_ratio:rate20s{journey="hold"}) - 0.004) <= bool 4.000e-12'
        eval_time: 6m15s
        exp_samples:
          - labels: '{journey="hold"}'
            value: 1
      # 7분 45초: payment_confirm도 2분 창만 넘음 → 없음
      - expr: 'ALERTS{alertname="slo_onsale_fast_burn"}'
        eval_time: 7m45s
        exp_samples: []
      - expr: 'peaket:slo:budget_alert10x:state{journey=~"hold|payment_confirm"}'
        eval_time: 7m45s
        exp_samples:
          - labels: 'peaket:slo:budget_alert10x:state{event_id="E1",journey="hold"}'
            value: 0
          - labels: 'peaket:slo:budget_alert10x:state{event_id="E1",journey="payment_confirm"}'
            value: 0
  # V-T51 ②(다중 창 표 SEV2 결제 확정을 뺀 여정 줄). 허용 0.0005, 5초마다 20,000건이라 3배 = 30건.
  # hold: 0~6분 29건(2.9배), 6~12분 31건(3.1배), 12분~ 20건(2배). payment_confirm: 내내 50건(5배, 10배 아래).
  - name: 'V-T51 ② 3배 경보는 5분·25초 두 창이 모두 넘을 때만 SEV2이고 결제 확정에는 없다'
    interval: 5s
    input_series:
      - series: 'up{app="purchase-svc",pod="purchase-svc-0",namespace="peaket",job="kubernetes-pods"}'
        values: '1x148'
      - series: 'up{app="payment-svc",pod="payment-svc-0",namespace="peaket",job="kubernetes-pods"}'
        values: '1x148'
      - series: 'up{app="queue-svc",pod="queue-svc-0",namespace="peaket",job="kubernetes-pods"}'
        values: '1x148'
      - series: 'up{app="realtime-gw",pod="realtime-gw-0",namespace="peaket",job="kubernetes-pods"}'
        values: '1x148'
      - series: 'admission_target{app="admission-ctrl",pod="admission-ctrl-0",namespace="peaket",event_id="E1"}'
        values: '5000x148'
      - series: 'http_server_request_duration_seconds_count{app="purchase-svc",pod="purchase-svc-0",namespace="peaket",service="purchase-svc",route="/v1/events/{eventId}/holds",method="POST",status_class="2xx"}'
        values: '1000000000 1000014971+14971x71 1001092881+14969x71 1002170660+14980x3'
      - series: 'http_server_request_duration_seconds_count{app="purchase-svc",pod="purchase-svc-0",namespace="peaket",service="purchase-svc",route="/v1/events/{eventId}/holds",method="POST",status_class="4xx"}'
        values: '1000000000 1000005000+5000x147'
      - series: 'http_server_request_duration_seconds_count{app="purchase-svc",pod="purchase-svc-0",namespace="peaket",service="purchase-svc",route="/v1/events/{eventId}/holds",method="POST",status_class="5xx"}'
        values: '1000000000 1000000029+29x71 1000002119+31x71 1000004340+20x3'
      - series: 'http_server_errors_total{app="purchase-svc",pod="purchase-svc-0",namespace="peaket",service="purchase-svc",route="/v1/events/{eventId}/holds",method="POST",status_class="5xx"}'
        values: '1000000000 1000000029+29x71 1000002119+31x71 1000004340+20x3'
      - series: 'payment_confirm_resolution_seconds_bucket{app="payment-svc",pod="payment-svc-0",namespace="peaket",pg="TOSS",path="direct",le="3"}'
        values: '1000000000 1000017955+17955x147'
      - series: 'payment_confirm_resolution_seconds_bucket{app="payment-svc",pod="payment-svc-0",namespace="peaket",pg="TOSS",path="direct",le="+Inf"}'
        values: '1000000000 1000018000+18000x147'
      - series: 'payment_confirm_resolution_seconds_count{app="payment-svc",pod="payment-svc-0",namespace="peaket",pg="TOSS",path="direct"}'
        values: '1000000000 1000018000+18000x147'
      - series: 'payment_confirm_resolution_seconds_bucket{app="payment-svc",pod="payment-svc-0",namespace="peaket",pg="TOSS",path="retry_queue",le="3"}'
        values: '1000000000 1000001995+1995x147'
      - series: 'payment_confirm_resolution_seconds_bucket{app="payment-svc",pod="payment-svc-0",namespace="peaket",pg="TOSS",path="retry_queue",le="+Inf"}'
        values: '1000000000 1000002000+2000x147'
      - series: 'payment_confirm_resolution_seconds_count{app="payment-svc",pod="payment-svc-0",namespace="peaket",pg="TOSS",path="retry_queue"}'
        values: '1000000000 1000002000+2000x147'
    promql_expr_test:
      # 6분: hold 두 창 2.9배 → 없음. payment_confirm은 두 창 5배지만 3배 경보가 없다
      - expr: 'ALERTS{alertname="slo_onsale_slow_burn"}'
        eval_time: 6m
        exp_samples: []
      - expr: '(peaket:slo_error_ratio:rate5m{journey=~"hold|payment_confirm"}) * 0'
        eval_time: 6m
        exp_samples:
          - labels: '{journey="hold"}'
            value: 0
          - labels: '{journey="payment_confirm"}'
            value: 0
      - expr: 'abs(peaket:slo_error_ratio:rate5m{journey="hold"} - 0.00145) <= bool 1.450e-12'
        eval_time: 6m
        exp_samples:
          - labels: '{journey="hold"}'
            value: 1
      - expr: 'abs(peaket:slo_error_ratio:rate5m{journey="payment_confirm"} - 0.0025) <= bool 2.500e-12'
        eval_time: 6m
        exp_samples:
          - labels: '{journey="payment_confirm"}'
            value: 1
      # 12분: hold 두 창 3.1배 → SEV2 hold 하나. payment_confirm(5배)은 없다
      - expr: 'ALERTS{alertname="slo_onsale_slow_burn"}'
        eval_time: 12m
        exp_samples:
          - labels: 'ALERTS{alertname="slo_onsale_slow_burn",alertstate="firing",severity="sev2",kind="slo",event_id="E1",journey="hold"}'
            value: 1
      - expr: '(peaket:slo_error_ratio:rate25s{journey=~"hold|payment_confirm"}) * 0'
        eval_time: 12m
        exp_samples:
          - labels: '{journey="hold"}'
            value: 0
          - labels: '{journey="payment_confirm"}'
            value: 0
      - expr: 'abs(peaket:slo_error_ratio:rate25s{journey="hold"} - 0.00155) <= bool 1.550e-12'
        eval_time: 12m
        exp_samples:
          - labels: '{journey="hold"}'
            value: 1
      - expr: 'abs(peaket:slo_error_ratio:rate25s{journey="payment_confirm"} - 0.0025) <= bool 2.500e-12'
        eval_time: 12m
        exp_samples:
          - labels: '{journey="payment_confirm"}'
            value: 1
      # 12분 20초: hold는 5분 창만 넘음(3.03배, 25초 창 2배) → 없음
      - expr: 'ALERTS{alertname="slo_onsale_slow_burn"}'
        eval_time: 12m20s
        exp_samples: []
      - expr: '(peaket:slo_error_ratio:rate5m{journey="hold"}) * 0'
        eval_time: 12m20s
        exp_samples:
          - labels: '{journey="hold"}'
            value: 0
      - expr: 'abs((peaket:slo_error_ratio:rate5m{journey="hold"}) - 0.0015127118644067796) <= bool 1.513e-12'
        eval_time: 12m20s
        exp_samples:
          - labels: '{journey="hold"}'
            value: 1
      - expr: '(peaket:slo_error_ratio:rate25s{journey="hold"}) * 0'
        eval_time: 12m20s
        exp_samples:
          - labels: '{journey="hold"}'
            value: 0
      - expr: 'abs((peaket:slo_error_ratio:rate25s{journey="hold"}) - 0.001) <= bool 1.000e-12'
        eval_time: 12m20s
        exp_samples:
          - labels: '{journey="hold"}'
            value: 1
  # V-T51 ③(docs/observability.md §4 '결제 확정 원인 넷', 다중 창 표 SEV2 결제 확정 줄). 결제사 TOSS·PORTONE, 승인 호출 5초마다 1,000건씩.
  # 경계 1%는 같은 값을 피해 0.9%·1.1%로 둔다(결제사 오류 ③도 같다). 원인 ③의 분모는 payment_confirm_seconds_count, CARD_DECLINED는 원인이 아니다.
  # TOSS 2초 넘김 11건: 구간 끝 2분 5초~4분. PORTONE 파드 1 서킷 열림: 5분 30초~6분 30초. TOSS PG_ERROR 11건: 8분 5초~10분. 429: TOSS first="false" 1분, PORTONE first="true" 10분 30초.
  - name: 'V-T51 ③ 결제 확정 원인 넷은 결제사마다 SEV2를 울리고 진행 회차마다 pg_cause 1이다'
    interval: 5s
    input_series:
      - series: 'up{app="purchase-svc",pod="purchase-svc-0",namespace="peaket",job="kubernetes-pods"}'
        values: '1x144'
      - series: 'up{app="payment-svc",pod="payment-svc-0",namespace="peaket",job="kubernetes-pods"}'
        values: '1x144'
      - series: 'up{app="queue-svc",pod="queue-svc-0",namespace="peaket",job="kubernetes-pods"}'
        values: '1x144'
      - series: 'up{app="realtime-gw",pod="realtime-gw-0",namespace="peaket",job="kubernetes-pods"}'
        values: '1x144'
      - series: 'admission_target{app="admission-ctrl",pod="admission-ctrl-0",namespace="peaket",event_id="E1"}'
        values: '5000x144'
