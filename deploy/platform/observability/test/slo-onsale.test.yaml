            value: 1
      # 12분: 그 429가 1분 창 밖 → 없음
      - expr: 'ALERTS{alertname="payment_confirm_pg_cause"}'
        eval_time: 12m
        exp_samples: []
      - expr: 'peaket:payment:pg_cause:state'
        eval_time: 12m
        exp_samples:
          - labels: 'peaket:payment:pg_cause:state{event_id="E1"}'
            value: 0
          - labels: 'peaket:payment:pg_cause:state{event_id="E2"}'
