# Karpenter NodePool 넷(BUILD_ORDER OPS-430, F-09-10). 정본: docs/infra-handover.md §3.1,
# docs/devops.md §8.2·§8.3, docs/infra.md §5. 실제 AWS 설치·노드 기동은 이 동결 트랙에서 하지 않는다(미실행).
# - EC2NodeClass default는 Terraform(BAT-076) 계약이다. 이 저장소에 없으면 Karpenter가 노드를 만들지 못한다.
# - NodePool만으로 워크로드 풀이 갈리지 않는다. 지금 워크로드는 karpenter.sh/capacity-type만 선택한다.
# - 구매 방식은 보수적으로 전부 온디맨드다. Spot 허용(notify 워커·원본 적재 작업자)은 워크로드 toleration 배선 뒤 후속이다.
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: hotpath
  labels:
    peaket.io/pool: hotpath
spec:
  template:
    metadata:
      labels:
        peaket.io/pool: hotpath
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      # 핫패스는 강제 만료를 끄고 drift로만 바꾼다(docs/devops.md §8.2)
      expireAfter: Never
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: kubernetes.io/arch
          operator: In
          values: ["arm64"]
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["c7g"]
        - key: topology.kubernetes.io/zone
          operator: In
          values: ["ap-northeast-2a", "ap-northeast-2b", "ap-northeast-2c"]
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
    # Karpenter 중단 예산은 자발적 중단만 막는다. 06:00 KST(전날 21:00 UTC)부터 22시간 drift를 막는다(docs/devops.md §8.3)
    budgets:
      - nodes: "0"
        schedule: "0 21 * * *"
        duration: 22h
        reasons: ["Drift"]
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: general
  labels:
    peaket.io/pool: general
spec:
  template:
    metadata:
      labels:
        peaket.io/pool: general
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: kubernetes.io/arch
          operator: In
          values: ["arm64"]
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["m7g"]
        - key: topology.kubernetes.io/zone
          operator: In
          values: ["ap-northeast-2a", "ap-northeast-2b", "ap-northeast-2c"]
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
    budgets:
      - nodes: "0"
        schedule: "0 21 * * *"
        duration: 22h
        reasons: ["Drift"]
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: data
  labels:
    peaket.io/pool: data
spec:
  template:
    metadata:
      labels:
        peaket.io/pool: data
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: kubernetes.io/arch
          operator: In
          values: ["arm64"]
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["r7g"]
        - key: topology.kubernetes.io/zone
          operator: In
          values: ["ap-northeast-2a", "ap-northeast-2b", "ap-northeast-2c"]
  # ResourceQuota(data)가 이 한도의 80%다. 32 CPU·128Gi의 125% = 40·160Gi [가정](ADR-0078 결정 8)
  limits:
    cpu: "40"
    memory: 160Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
    budgets:
      - nodes: "0"
        schedule: "0 21 * * *"
        duration: 22h
        reasons: ["Drift"]
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: observability
  labels:
    peaket.io/pool: observability
spec:
  template:
    metadata:
      labels:
        peaket.io/pool: observability
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: kubernetes.io/arch
          operator: In
          values: ["arm64"]
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["r7g"]
        - key: topology.kubernetes.io/zone
          operator: In
          values: ["ap-northeast-2a", "ap-northeast-2b", "ap-northeast-2c"]
  # ResourceQuota(observability)가 이 한도의 80%다. 16 CPU·64Gi의 125% = 20·80Gi [가정](ADR-0078 결정 8)
  limits:
    cpu: "20"
    memory: 80Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
    budgets:
      - nodes: "0"
        schedule: "0 21 * * *"
        duration: 22h
        reasons: ["Drift"]
