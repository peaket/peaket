# KEDA ArgoCD Application(BUILD_ORDER OPS-430, F-09-10, docs/devops.md §5.2).
# 실제 클러스터 동기화는 이 동결 트랙에서 하지 않는다(미실행). values.yaml만 정적으로 시험한다.
# - 차트는 KEDA 공식 차트 2.21.1이다(2026-11-27 차트 색인 확인).
# - 두 번째 source는 이 저장소의 values.yaml을 `$values/...`로 읽기 위한 자리다(ArgoCD 다중 source).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: peaket
    peaket.io/environment: platform
spec:
  project: peaket-platform
  sources:
    - repoURL: https://kedacore.github.io/charts
      chart: keda
      targetRevision: 2.21.1
      helm:
        valueFiles:
          - $values/deploy/platform/keda/values.yaml
    - repoURL: https://github.com/peaket/peaket
      targetRevision: develop
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: keda
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
