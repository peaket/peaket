# 생성 파일이다. 손으로 고치지 않는다(원천 deploy/platform/mesh/port-allow.yaml과 deploy/gateways/*.yaml의 라우트·공개키 묶음 주소, docs/api/proto에서 node tools/ci/mesh-policies.mjs --write가 만든다, ADR-0285 결정 2)
# 메시 없는 로컬·CI·데모 몫: 워크로드마다 Ingress NetworkPolicy <워크로드>-ports(포트마다 부르는 쪽의 네임스페이스와 파드 라벨을 한 출처 칸에 함께).
# 업무 gRPC 포트는 경로로 거르지 못해 그 워크로드의 모든 업무 gRPC 부르는 쪽을 합쳐 받는다(ADR-0285 결정 8). 운영 오버레이에는 넣지 않는다(docs/infra.md §9)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: admission-ctrl-ports
  namespace: queue
  labels:
    peaket.io/generated-by: mesh-policies
    peaket.io/workload: admission-ctrl
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: admission-ctrl
      app.kubernetes.io/component: service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9464
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ops-breakglass
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: core
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ops-svc
              app.kubernetes.io/component: service
      ports:
        - protocol: TCP
          port: 50061
---
