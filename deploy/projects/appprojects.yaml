# ArgoCD AppProject, 가상 팀 아홉(docs/devops.md §5.2, ADR-0169). 이름은 `peaket-<팀>`이다.
# - sourceRepos: 저장소 하나(공개 모노레포 `peaket/peaket`)만. 다른 저장소의 차트·매니페스트는 받지 않는다(ASVS v5.0.0-13.2.5)
# - destinations: 그 팀의 네임스페이스와 애드온 네임스페이스. 네임스페이스 지도(docs/devops.md §5.2)와 같다.
#   platform 프로젝트는 애드온이 쓰는 otel·ops-breakglass·envoy-gateway-system도 맡는다.
# - clusterResourceWhitelist: 필요한 클러스터 범위 종류만. `*`는 쓰지 않는다(팀이 다른 팀의 네임스페이스를 만들지 못하게).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: peaket-queue
  namespace: argocd
spec:
  description: 대기열 팀(queue-svc·admission-ctrl)
  sourceRepos:
    - https://github.com/peaket/peaket
  destinations:
    - { namespace: queue, server: https://kubernetes.default.svc }
    - { namespace: platform, server: https://kubernetes.default.svc }
  clusterResourceWhitelist: []
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: peaket-purchase
  namespace: argocd
spec:
  description: 구매 팀(purchase-svc·realtime-gw·payment-svc)
  sourceRepos:
    - https://github.com/peaket/peaket
  destinations:
    - { namespace: purchase, server: https://kubernetes.default.svc }
    - { namespace: platform, server: https://kubernetes.default.svc }
  clusterResourceWhitelist: []
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: peaket-ticket
  namespace: argocd
spec:
  description: 티켓 팀(ticket-svc)
  sourceRepos:
    - https://github.com/peaket/peaket
  destinations:
    - { namespace: ticket, server: https://kubernetes.default.svc }
    - { namespace: platform, server: https://kubernetes.default.svc }
  clusterResourceWhitelist: []
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: peaket-trust
  namespace: argocd
spec:
  description: 신뢰 팀(trust-svc·trust-reassess·inv-ingest)
  sourceRepos:
    - https://github.com/peaket/peaket
  destinations:
    - { namespace: trust, server: https://kubernetes.default.svc }
    - { namespace: platform, server: https://kubernetes.default.svc }
  clusterResourceWhitelist: []
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: peaket-core
  namespace: argocd
spec:
  description: 코어 팀(identity-svc·core-svc·notify·image-worker·seatmap-worker·ops-svc)
  sourceRepos:
    - https://github.com/peaket/peaket
  destinations:
    - { namespace: core, server: https://kubernetes.default.svc }
    - { namespace: platform, server: https://kubernetes.default.svc }
  clusterResourceWhitelist: []
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: peaket-frontend
  namespace: argocd
spec:
  description: 프론트엔드 팀(웹 앱 서버·파트너 앱 서버, 네임스페이스 web)
  sourceRepos:
    - https://github.com/peaket/peaket
  destinations:
    - { namespace: web, server: https://kubernetes.default.svc }
