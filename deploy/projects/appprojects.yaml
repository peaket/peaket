  clusterResourceWhitelist: []
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: peaket-platform
  namespace: argocd
spec:
  description: 플랫폼 팀(애드온·OTel 수집기·비상 런북 Job·변경 동결 달력·증거 수집기)
  sourceRepos:
    - https://github.com/peaket/peaket
  destinations:
    - { namespace: platform, server: https://kubernetes.default.svc }
    - { namespace: otel, server: https://kubernetes.default.svc }
    - { namespace: ops-breakglass, server: https://kubernetes.default.svc }
    - { namespace: envoy-gateway-system, server: https://kubernetes.default.svc }
  clusterResourceWhitelist:
    - { group: "", kind: Namespace }
    - { group: apiextensions.k8s.io, kind: CustomResourceDefinition }
    - { group: rbac.authorization.k8s.io, kind: ClusterRole }
    - { group: rbac.authorization.k8s.io, kind: ClusterRoleBinding }
    - { group: scheduling.k8s.io, kind: PriorityClass }
