apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: peaket-data
  namespace: argocd
spec:
  description: 데이터 팀(스트림 작업자·ClickHouse·마감 실행기·dbt Job·랭킹 게시 잡)
  sourceRepos:
    - https://github.com/peaket/peaket
  destinations:
