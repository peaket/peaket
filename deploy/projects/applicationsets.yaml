# ArgoCD ApplicationSet, 환경마다 하나(docs/devops.md §5.2, ADR-0169). 이름은 `peaket-<환경>`이다.
# - Git 디렉터리 생성기로 `deploy/envs/<환경>/*`를 읽는다. 가지는 `develop`만 읽는다(`main`의 `deploy/`는 출시 때의 사본이다).
# - `flags/`는 릴리스 플래그 정의라 Application으로 만들지 않는다(exclude).
# - 자동 동기화(prune·selfHeal)를 켠다. 되돌리기는 Git 되돌리기로 한다.
# - Gateway API 트래픽 플러그인이 HTTPRoute에 넣는 규칙은 `ignoreDifferences`로 비교에서 뺀다(플러그인이 넣은 규칙을 ArgoCD가 되돌리지 않게).
# 첫 구현의 한계: 환경 값 파일에는 아직 서비스의 project·namespace 칸이 없어, 모든 Application이 platform 프로젝트·platform 네임스페이스로 간다.
# 서비스별 팀 프로젝트·네임스페이스로 나누는 일은 환경 값 파일에 그 칸을 더하는 묶음에서 한다(계획 BAT-080 범위 밖).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: peaket-local
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/peaket/peaket
        revision: develop
        directories:
          - path: deploy/envs/local/*
          - path: deploy/envs/local/flags
            exclude: true
  template:
    metadata:
      name: '{{ .path.basenameNormalized }}'
      labels:
        app.kubernetes.io/part-of: peaket
        peaket.io/environment: local
    spec:
      project: peaket-platform
      source:
        repoURL: https://github.com/peaket/peaket
        targetRevision: develop
        path: deploy/charts/peaket-service
        helm:
          valueFiles:
            - '{{ .path.path }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: platform
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true]
      ignoreDifferences:
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
          managedFieldsManagers: [argo-rollouts]
---
