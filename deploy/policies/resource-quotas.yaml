# 자원 할당량(ResourceQuota)은 data·observability 두 네임스페이스에만 둔다(docs/devops.md §5.2, ADR-0078 결정 8).
# 핫패스·서비스 네임스페이스와 애드온에는 두지 않는다: 오픈 때 확장을 할당량이 막으면 안 된다.
# 숫자는 [가정]이다. Karpenter NodePool limits가 생기는 BAT-076(또는 BAS-130 묶음)에서 그 한도의 80%로 맞춘다.
# Kyverno가 requests·limits를 필수로 하므로(§4.3) 이 할당량은 그 네임스페이스의 모든 파드에 걸린다.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: peaket-data
  namespace: data
spec:
  hard:
    requests.cpu: "32"
    requests.memory: 128Gi
    limits.cpu: "64"
    limits.memory: 256Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: peaket-observability
  namespace: observability
spec:
  hard:
    requests.cpu: "16"
    requests.memory: 64Gi
    limits.cpu: "32"
    limits.memory: 128Gi
