# F-09-3 데이터 계층 기준(기계가 읽는 원천). 생성 파일은 tools/ci/data-platform.mjs --write로만 만든다.
# 정본: docs/BUILD_ORDER.md:140·:575, docs/devops.md:689~693·:764·:769·:938·:941,
# docs/data.md:18~25·:3091~3108·:3163~3177, docs/infra.md:13·:176·:325~327·:478~483·:550~551,
# docs/security/secrets-and-keys.md:10·:78~80, docs/security/asvs/delivery.md:75·:147.
version: 1

redis:
  engine: valkey
  engineVersion: '8.1'
  clusterMode: true
  multiAz: true
  automaticFailover: true
  transitEncryption: true
  atRestEncryption: true
  auth:
    mode: rbac
    defaultUser: 'off'
  parameterGroup:
    maxmemory-policy: noeviction
    latency-tracking: 'yes'
    slowlog-log-slower-than: '10000'
    slowlog-max-len: '128'
  aclUsers:
    - name: web
      cluster: session-cache
      keys: ['~web:*']
      commands: ['+get', '+set', '+mget']
    - name: core-eligibility
      cluster: queue
      keys: ['~q:{event:*}:elig:*']
      commands: ['+sadd', '+srem', '+del', '+unlink', '+rename', '+expire', '+pexpire']
    - name: ops-reader
      cluster: queue
      keys: ['~q:*']
      commands: ['-@all', '+@read', '+@connection']
  clusters:
    - name: queue
      nodeType: cache.r7g.xlarge
      replicasPerShard: 1
      keys: ['q:*']
    - name: seat
      nodeType: cache.r7g.xlarge
      replicasPerShard: 1
      keys: ['s:*']
    - name: session-cache
      nodeType: cache.r7g.large
      replicasPerShard: 1
      keys: ['id:*', 'rl:*', 'catalog:*', 'web:*', 'shop:*', 'tr:*', 'sup:*', 'scanner:*', 'reauth:*']
  memoryAlerts:
    warnPercent: 70
    criticalPercent: 85
    evictions: 0
  ttl:
    sessionCacheAllKeys: true
    queueSeatPerKey: true

aurora:
  engine: aurora-postgresql
  engineVersion: '18.6.1'
  tls:
    forceSsl: true
    clientSslMode: verify-full
  parameterGroup:
    rds.force_ssl: '1'
    auto_explain.log_min_duration: 500ms
    auto_explain.sample_rate: '0.1'
    log_temp_files: '10240'
    log_parameter_max_length: '0'
  backup:
    retentionDays: 35
    pointInTimeRecovery: true
    crossRegionSnapshot: true
    crossRegionRetentionDays: 7
  deletionProtection: true
  clusters:
    - name: purchase
      databases: [purchase]
    - name: payment
      databases: [payment]
    - name: ticket
      databases: [ticket]
    - name: ops
      databases: [ops]
    - name: shared
      databases: [identity, core]
  pgbouncerReplicas: 3
  pools:
    purchase:
      defaultPoolSize: 20
      minPoolSize: 5
      reservePoolSize: 5
      serverReserve: 50
      serverConnections: 110
      maxConnections80Percent: 2800
      clientBudget:
        source: F-09-10
        relayConnections: 4
        reserve: 50
    payment:
      defaultPoolSize: 32
      minPoolSize: 8
      reservePoolSize: 8
      serverReserve: 50
      serverConnections: 146
      maxConnections80Percent: 1440
      clientBudget:
        source: F-09-10
        relayConnections: 2
        reserve: 20
    ticket:
      defaultPoolSize: 20
      minPoolSize: 5
      reservePoolSize: 5
      serverReserve: 20
      serverConnections: 80
      maxConnections80Percent: 1440
      clientBudget:
        source: F-09-10
        relayConnections: 2
        reserve: 20
    ops:
      defaultPoolSize: 10
      minPoolSize: 2
      reservePoolSize: 3
      serverReserve: 20
      serverConnections: 50
      maxConnections80Percent: 1440
      clientBudget:
        source: F-09-10
        relayConnections: 2
        reserve: 20
    identity:
      defaultPoolSize: 10
      minPoolSize: 2
      reservePoolSize: 3
      serverReserve: 20
      serverConnections: 50
      maxConnections80Percent: 2800
      clientBudget:
        source: F-09-10
        relayConnections: 2
        reserve: 20
    core:
      defaultPoolSize: 20
      minPoolSize: 5
      reservePoolSize: 5
      serverReserve: 20
      serverConnections: 80
      maxConnections80Percent: 2800
      clientBudget:
        source: F-09-10
        relayConnections: 2
        reserve: 20

msk:
  engineVersion: '3.9.x'
  clusters:
    - name: trade-control
      brokers: 6
      replicationFactor: 3
      minInSyncReplicas: 2
      uncleanLeaderElection: false
      autoCreateTopics: false
      acks: all
      retentionMs: 604800000
    - name: telemetry
      brokers: 3
      replicationFactor: 3
      minInSyncReplicas: 2
      uncleanLeaderElection: false
      autoCreateTopics: false
      acks: all
      retentionMs: 604800000
    - name: observability
      brokers: 3
      replicationFactor: 3
      minInSyncReplicas: 2
      uncleanLeaderElection: true
      autoCreateTopics: true
      acks: all
      retentionMs: 604800000
  topicOverrides:
    - name: identity.accounts-withdrawn
      cluster: trade-control
      partitions: 12
      replicationFactor: 3
      retentionMs: 259200000
      segmentMs: 86400000
      cleanupPolicy: delete
    - name: investigation.requests
      cluster: telemetry
      partitions: 12
      replicationFactor: 3
      retentionMs: 259200000
      segmentMs: 86400000
      cleanupPolicy: delete
    - name: _schemas
      cluster: trade-control
      partitions: 3
      replicationFactor: 3
      retentionMs: 604800000
      segmentMs: 86400000
      cleanupPolicy: compact

schemaRegistry:
  replicas: 2
  pdbMinAvailable: 1
  compatibility: BACKWARD_TRANSITIVE
  subjectNameStrategy: TopicRecordNameStrategy
  autoRegisterSchemas: false
  useLatestVersion: false
  kafkastore:
    topic: _schemas
    topicReplicationFactor: 3
    leaderEligibility: true
    securityProtocol: SASL_SSL
    saslMechanism: AWS_MSK_IAM
    callbackHandlerClass: software.amazon.msk.auth.iam.IAMClientCallbackHandler
    roleSessionName: schema-registry-<env>
    addDefaultProviders: false

pgbouncer:
  version: '1.26.1'
  poolMode: transaction
  maxPreparedStatements: 200
  queryWaitTimeoutSeconds: 5
  idleTransactionTimeoutSeconds: 15
  queryTimeoutSeconds: 65
  serverIdleTimeoutSeconds: 600
  serverLifetimeSeconds: 3600
  authType: scram-sha-256
  authFile: /etc/pgbouncer/userlist.txt
  useAuthQuery: false
  clientTls:
    sslMode: require
  serverTls:
    sslMode: verify-full
  rotation:
    strategy: alternating-users
    intervalDays: 30
    maintenanceWindow: '04:00-06:00 Asia/Seoul'
    userlistRefreshSeconds: 60
    appSecretRefreshSeconds: 3600
    reloadOnRotation: true
    reloadCommand: RELOAD
    connectRetrySeconds: 20
    connectRetryAttempts: 3
    restartWithinDays: 30
    authFailureMetric: datastore_auth_failures_total
    severity: SEV2
  pools:
    purchase:
      defaultPoolSize: 20
      minPoolSize: 5
      reservePoolSize: 5
    payment:
      defaultPoolSize: 32
      minPoolSize: 8
      reservePoolSize: 8
    ticket:
      defaultPoolSize: 20
      minPoolSize: 5
      reservePoolSize: 5
    ops:
      defaultPoolSize: 10
      minPoolSize: 2
      reservePoolSize: 3
    identity:
      defaultPoolSize: 10
      minPoolSize: 2
      reservePoolSize: 3
    core:
      defaultPoolSize: 20
      minPoolSize: 5
      reservePoolSize: 5

roles:
  ddl:
    statementTimeoutMs: 30000
    idleInTransactionSessionTimeoutMs: 60000
  appHotpath:
    roles: [purchase_app, payment_app, identity_app]
    statementTimeoutMs: 1000
    idleInTransactionSessionTimeoutMs: 10000
  appGeneral:
    roles: [ticket_app, ops_app, core_app]
    statementTimeoutMs: 5000
    idleInTransactionSessionTimeoutMs: 10000
  maintenance:
    roles: ['<service>_maintenance']
    statementTimeoutMs: 60000
    idleInTransactionSessionTimeoutMs: 60000
    workMem: 64MB
  outboxRelay:
    roles: ['<service>_outbox_relay']
    statementTimeoutMs: 5000
    idleInTransactionSessionTimeoutMs: 30000

mskIam:
  failClosed: true
  sessionNamePattern: '<workload>-<env>'
  workloads:
    - name: purchase-svc-outbox-relay
      kind: relay
      podIdentityRole:
        name: peaket-purchase-svc-outbox-relay
        kafkaActions: []
      mskRole:
        name: peaket-msk-purchase-svc-outbox-relay
        trust:
          principal: peaket-purchase-svc-outbox-relay
          action: sts:AssumeRole
        permissions:
          - actions: [kafka-cluster:Connect, kafka-cluster:DescribeTopic, kafka-cluster:WriteData, kafka-cluster:WriteDataIdempotently]
            resources: [cluster:trade-control, topic:trade.orders, topic:trade.seats, topic:trade.purchase-sessions]
      sessionName: purchase-svc-outbox-relay-<env>
      writeTopics: [trade.orders, trade.seats, trade.purchase-sessions]
      readTopics: []
      consumerGroups: []
    - name: purchase-svc
      kind: api
      podIdentityRole:
        name: peaket-purchase-svc
        kafkaActions: []
      mskRole:
        name: peaket-msk-purchase-svc
        trust:
          principal: peaket-purchase-svc
          action: sts:AssumeRole
        permissions:
          - actions: [kafka-cluster:Connect, kafka-cluster:DescribeTopic, kafka-cluster:ReadData, kafka-cluster:DescribeGroup]
            resources: [cluster:trade-control, topic:trade.payments, topic:trade.seats, group:peaket.purchase-svc-hold-ledger.<env>, group:peaket.purchase-svc-order-saga.<env>]
      sessionName: purchase-svc-<env>
      writeTopics: []
      readTopics: [trade.payments, trade.seats]
      consumerGroups: [peaket.purchase-svc-hold-ledger.<env>, peaket.purchase-svc-order-saga.<env>]
    - name: queue-svc
      kind: api
