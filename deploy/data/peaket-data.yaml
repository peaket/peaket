      sessionName: core-svc-<env>
      writeTopics: []
      readTopics: [identity.accounts-withdrawn, trade.orders, trade.tickets]
      consumerGroups: [peaket.core-svc.<env>]
    - name: ops-svc
      kind: api
      podIdentityRole:
        name: peaket-ops-svc
        kafkaActions: []
      mskRole:
        name: peaket-msk-ops-svc
        trust:
          principal: peaket-ops-svc
