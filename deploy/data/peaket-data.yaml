            resources: [cluster:trade-control, cluster:telemetry, topic:trade.purchase-sessions, topic:identity.accounts-withdrawn, topic:trade.seats, topic:support.cases-requested, topic:telemetry.queue, group:peaket.queue-svc.<env>]
      sessionName: queue-svc-<env>
