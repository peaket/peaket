[databases]
peaket_purchase = host=<aurora-purchase-writer> dbname=peaket_purchase
peaket_payment = host=<aurora-payment-writer> dbname=peaket_payment
peaket_ticket = host=<aurora-ticket-writer> dbname=peaket_ticket
peaket_ops = host=<aurora-ops-writer> dbname=peaket_ops
peaket_identity = host=<aurora-identity-writer> dbname=peaket_identity
