      - GET
    exposeHeaders:
      - Retry-After
    maxAge: 7200s
---
# gw-queue-buy: 교차 출처·출처 확인·토큰 확인·인가(ticket:buy)
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: gw-queue-buy-security
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: gw-queue-buy
  cors:
    allowOrigins:
      - https://www.peaket.example
    allowMethods:
      - GET
      - POST
      - DELETE
    allowHeaders:
      - Content-Type
      - Idempotency-Key
    exposeHeaders:
      - Retry-After
      - Date
      - X-Trace-Id
    maxAge: 7200s
    allowCredentials: true
  csrf:
    additionalOrigins:
      - https://www.peaket.example
  jwt:
    providers:
      - name: fan-fan
        issuer: https://identity.peaket.example
        audiences:
          - fan
        remoteJWKS:
          uri: http://identity-svc.core.svc.cluster.local:8080/internal/jwks/fan.json
          backendRefs:
            - group: ""
              kind: Service
              name: identity-svc
              namespace: core
              port: 8080
          cacheDuration: 300s
        extractFrom:
          headers:
            - name: Authorization
              valuePrefix: "Bearer "
          cookies:
            - __Secure-peaket_at
        claimToHeaders:
          - header: X-User-Id
            claim: sub
          - header: X-Session-Id
            claim: sid
          - header: X-User-Aud
            claim: aud
          - header: X-User-Scope
            claim: scope
          - header: X-User-Pid
            claim: pid
          - header: X-User-Pid-Prev
            claim: pid_prev
  authorization:
    defaultAction: Deny
    rules:
      - name: ticket-buy
        action: Allow
        principal:
          jwt:
            provider: fan-fan
            scopes:
              - ticket:buy
---
