# gw-queue-buy: 대기열 진입·입장 확정(쿠키 토큰, ticket:buy, docs/security/authz-matrix.md §5.1). 게이트웨이는 Content-Type을 막지 않는다(text/plain 수용, 415는 queue-svc). 진입은 __Host-peaket_arr 쿠키와 원본 확인이 맞을 때의 x-peaket-arrival을 넘긴다(ADR-0223)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gw-queue-buy
  namespace: envoy-gateway-system
spec:
  parentRefs:
    - name: gw-queue
      sectionName: queue
  hostnames:
    - queue.peaket.example
  rules:
    - matches:
        - path:
            type: RegularExpression
            value: /v1/queues/[^/]+/entries
          method: POST
        - path:
            type: RegularExpression
            value: /v1/queues/[^/]+/admission
          method: POST
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-peaket-app
                value: web
              - name: x-forwarded-for
                value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
            remove:
              - x-peaket-browser-traceparent
      backendRefs:
        - group: ""
          kind: Service
          name: queue-svc
          namespace: queue
          port: 8080
---
# gw-queue-buy: 교차 출처·출처 확인·토큰 확인·인가(ticket:buy)
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: gw-queue-buy-security
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: gw-queue-buy
  cors:
    allowOrigins:
      - https://www.peaket.example
    allowMethods:
      - GET
      - POST
      - DELETE
    allowHeaders:
      - Content-Type
      - Idempotency-Key
    exposeHeaders:
      - Retry-After
      - Date
      - X-Trace-Id
    maxAge: 7200s
    allowCredentials: true
  csrf:
    additionalOrigins:
      - https://www.peaket.example
  jwt:
    providers:
      - name: fan-fan
        issuer: https://identity.peaket.example
        audiences:
          - fan
        remoteJWKS:
          uri: http://identity-svc.core.svc.cluster.local:8080/internal/jwks/fan.json
          backendRefs:
            - group: ""
              kind: Service
              name: identity-svc
              namespace: core
              port: 8080
          cacheDuration: 300s
        extractFrom:
          headers:
            - name: Authorization
              valuePrefix: "Bearer "
          cookies:
            - __Secure-peaket_at
        claimToHeaders:
          - header: X-User-Id
            claim: sub
          - header: X-Session-Id
            claim: sid
          - header: X-User-Aud
            claim: aud
          - header: X-User-Scope
            claim: scope
          - header: X-User-Pid
            claim: pid
          - header: X-User-Pid-Prev
            claim: pid_prev
  authorization:
    defaultAction: Deny
    rules:
      - name: ticket-buy
        action: Allow
        principal:
          jwt:
            provider: fan-fan
            scopes:
              - ticket:buy
---
# gw-queue-api: 로그인한 팬의 대기열 경로(로비 참가·사전 검증·대기 취소·추가 검증 상태)
