# gw-queue-files: 대기열 파일 원본(구간 상태·셔플·묶음 결과 파일, ADR-0058). 쿠키를 받지 않아 Allow-Credentials가 없다(ADR-0065 결정 7)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gw-queue-files
  namespace: envoy-gateway-system
spec:
  parentRefs:
    - name: gw-queue
      sectionName: queue-files
  hostnames:
    - queue-files.peaket.example
  rules:
    - matches:
        - path:
            type: RegularExpression
            value: /v1/queues/[^/]+/segment-states/[^/]+\.json
          method: GET
        - path:
            type: RegularExpression
            value: /v1/queues/[^/]+/shuffle-results/[^/]+\.json
          method: GET
        - path:
            type: RegularExpression
            value: /v1/queues/[^/]+/batch-results/[^/]+\.json
          method: GET
        - path:
            type: RegularExpression
            value: /v1/queues/[^/]+/segment-states/[^/]+\.json
          method: OPTIONS
        - path:
            type: RegularExpression
            value: /v1/queues/[^/]+/shuffle-results/[^/]+\.json
          method: OPTIONS
        - path:
            type: RegularExpression
            value: /v1/queues/[^/]+/batch-results/[^/]+\.json
          method: OPTIONS
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-peaket-app
                value: web
              - name: x-forwarded-for
                value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
            remove:
              - x-peaket-browser-traceparent
      backendRefs:
        - group: ""
          kind: Service
          name: queue-svc
          namespace: queue
          port: 8080
---
# gw-queue-files: 교차 출처·출처 확인(토큰 확인 없음, 공개 경로)
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: gw-queue-files-security
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: gw-queue-files
  cors:
    allowOrigins:
      - https://www.peaket.example
    allowMethods:
      - GET
    exposeHeaders:
      - Retry-After
    maxAge: 7200s
---
# gw-queue queue: 다른 라우트에 맞지 않는 경로는 404(토큰 확인 없음). 이 라우트에도 공통 Lua가 돌아 접근 로그에 위조 끝단 머리가 남지 않는다(리뷰 RV-01)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gw-queue-not-found
  namespace: envoy-gateway-system
spec:
  parentRefs:
    - name: gw-queue
      sectionName: queue
  hostnames:
    - queue.peaket.example
  rules:
    - matches:
        - path:
            type: RegularExpression
            value: /.*
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-peaket-app
                value: web
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: peaket-api-not-found
---
# gw-queue-not-found: 교차 출처 응답만(토큰 확인 없음)
apiVersion: gateway.envoyproxy.io/v1alpha1
