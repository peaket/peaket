---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gw-queue-trace
  namespace: envoy-gateway-system
  labels:
    peaket.io/route: gw-queue-trace
spec:
  parentRefs:
    - name: gw-queue
      sectionName: queue
  hostnames:
    - queue.peaket.example
  rules:
    - matches:
        - path:
            type: RegularExpression
            value: /v1/queues/[^/]+/admission(/.*)?
          method: TRACE
        - path:
            type: RegularExpression
            value: /v1/queues/[^/]+/entries(/.*)?
          method: TRACE
        - path:
            type: RegularExpression
            value: /v1/queues/[^/]+/entries/me(/.*)?
          method: TRACE
        - path:
            type: RegularExpression
            value: /v1/queues/[^/]+/lobby-participants(/.*)?
          method: TRACE
        - path:
            type: RegularExpression
            value: /v1/queues/[^/]+/pre-verifications(/.*)?
          method: TRACE
        - path:
            type: RegularExpression
            value: /v1/queues/[^/]+/shuffle-proof(/.*)?
          method: TRACE
        - path:
            type: RegularExpression
            value: /v1/queues/[^/]+/verification(/.*)?
          method: TRACE
        - path:
            type: PathPrefix
            value: /
          method: TRACE
        - path:
            type: RegularExpression
            value: /.*
          method: TRACE
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-peaket-app
                value: web
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: peaket-trace-not-allowed
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gw-queue-buy
  namespace: envoy-gateway-system
  labels:
    peaket.io/auth: token-buy
    peaket.io/route: gw-queue-buy
spec:
  parentRefs:
    - name: gw-queue
      sectionName: queue
  hostnames:
    - queue.peaket.example
  rules:
    - matches:
        - path:
            type: RegularExpression
            value: /v1/queues/[^/]+/admission
          method: POST
        - path:
            type: RegularExpression
            value: /v1/queues/[^/]+/admission
          method: OPTIONS
        - path:
            type: RegularExpression
            value: /v1/queues/[^/]+/entries
          method: POST
        - path:
            type: RegularExpression
            value: /v1/queues/[^/]+/entries
          method: OPTIONS
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-peaket-app
                value: web
              - name: x-forwarded-for
                value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
            remove:
              - x-peaket-browser-traceparent
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: X-Trace-Id
                value: "%TRACE_ID%"
      backendRefs:
        - group: ""
          kind: Service
          name: queue-svc
          namespace: queue
          port: 8080
---
