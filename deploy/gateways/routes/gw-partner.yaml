            type: PathPrefix
            value: /v1/partner/events/{eventId}/staff
        - path:
            type: PathPrefix
            value: /v1/partner/events/{eventId}/staff-invitations
        - path:
            type: PathPrefix
            value: /v1/partner/staff
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-peaket-app
                value: partner
              - name: x-forwarded-for
                value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
            remove:
              - x-peaket-browser-traceparent
      backendRefs:
        - group: ""
          kind: Service
          name: identity-svc
          namespace: core
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /v1/partner/events/{eventId}/settlements
        - path:
            type: PathPrefix
            value: /v1/partner/payout-account
        - path:
            type: PathPrefix
            value: /v1/partner/product-settlements
        - path:
            type: PathPrefix
            value: /v1/partner/settlements
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-peaket-app
                value: partner
              - name: x-forwarded-for
                value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
            remove:
              - x-peaket-browser-traceparent
      backendRefs:
        - group: ""
          kind: Service
          name: payment-svc
          namespace: purchase
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /v1/partner/events/{eventId}/device-placements
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-peaket-app
                value: partner
              - name: x-forwarded-for
                value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
            remove:
              - x-peaket-browser-traceparent
      backendRefs:
        - group: ""
          kind: Service
          name: ticket-svc
          namespace: ticket
          port: 8080
    # 회차 취소 요청·상태: BAT-420 처리기가 ops-svc에 있다(docs/features/transfer-refund.md, infra §4.1 '백엔드 대조')
    - matches:
        - path:
            type: PathPrefix
            value: /v1/partner/events/{eventId}/cancellation
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-peaket-app
                value: partner
              - name: x-forwarded-for
                value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
            remove:
              - x-peaket-browser-traceparent
      backendRefs:
        - group: ""
          kind: Service
          name: ops-svc
          namespace: core
          port: 8080
    - matches:
        - path:
            type: Exact
            value: /v1/partner/events/{eventId}
        - path:
            type: PathPrefix
            value: /v1/partner/events/{eventId}/attendee-exports
        - path:
            type: PathPrefix
            value: /v1/partner/events/{eventId}/attendees
        - path:
            type: PathPrefix
            value: /v1/partner/events/{eventId}/entry-policy
        - path:
            type: PathPrefix
            value: /v1/partner/events/{eventId}/flags
        - path:
            type: PathPrefix
            value: /v1/partner/events/{eventId}/fraud-report
        - path:
            type: PathPrefix
            value: /v1/partner/events/{eventId}/gate-status
        - path:
            type: PathPrefix
            value: /v1/partner/events/{eventId}/live-snapshot
        - path:
            type: PathPrefix
            value: /v1/partner/events/{eventId}/report
        - path:
            type: PathPrefix
            value: /v1/partner/events/{eventId}/settlement-exports
        - path:
            type: PathPrefix
            value: /v1/partner/artists
        - path:
            type: PathPrefix
            value: /v1/partner/merch-delivery-exports
        - path:
            type: PathPrefix
            value: /v1/partner/merch-order-items
        - path:
            type: PathPrefix
            value: /v1/partner/merch-order-stats
        - path:
            type: PathPrefix
            value: /v1/partner/merch-orders
        - path:
            type: PathPrefix
            value: /v1/partner/merch-pickups
        - path:
            type: PathPrefix
            value: /v1/partner/merch-shipment-imports
        - path:
            type: PathPrefix
            value: /v1/partner/places
        - path:
            type: PathPrefix
            value: /v1/partner/productions
        - path:
            type: PathPrefix
            value: /v1/partner/products
        - path:
            type: PathPrefix
            value: /v1/partner/seatmap-templates
        - path:
            type: PathPrefix
            value: /v1/partner/seller-profile
        - path:
            type: PathPrefix
            value: /v1/partner/todo-summary
        - path:
            type: PathPrefix
            value: /v1/partner/webhook-deliveries
        - path:
            type: PathPrefix
            value: /v1/partner/webhooks
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-peaket-app
                value: partner
              - name: x-forwarded-for
                value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
            remove:
              - x-peaket-browser-traceparent
      backendRefs:
        - group: ""
          kind: Service
          name: core-svc
          namespace: core
