# gw-partner 라우트 원천(BUILD_ORDER HOT-410, docs/infra.md §4.1 '경로별 메서드 생성기'). 적용 대상이 아니다: node tools/ci/gateway-routes.mjs --write가
# 이 파일과 docs/api/openapi.yaml로 deploy/gateways/gw-partner.routes.yaml을 만든다.
# 규칙의 맞춤에는 '이 경로 아래의 계약 작업을 맡는다'는 경로를 적고, 한 경로의 작업이 인증 종류가 달라 다른 라우트로 갈 때만 method도 적는다. 값은 openapi의 꼴(틀 {이름})이다.
# PathPrefix는 그 경로와 그 아래, Exact는 그 계약 경로 하나다(같은 앞부분 아래를 다른 라우트·백엔드로 나눌 때).
# partner-api.peaket.example의 계약 작업(경로·메서드 짝)은 정확히 한 규칙이 맡아야 한다(맡는 규칙이 없거나 둘이면 생성기가 멈춘다). 계약에 작업을 더하면 여기에 맡을 규칙을 정한다.
# 라우트마다 이름표 peaket.io/auth(public·optional·token·token-buy)를 단다. 맡은 작업의 openapi security·x-peaket-scopes로 정한 인증 종류와 다르면 생성기가 멈춘다
# (docs/infra.md §4.1 '인증 종류 대조'). 백엔드는 그 작업의 처리기가 있는 서비스다('백엔드 대조', 정적 시험 deploy/gateways/test/route-contract.test.mjs).
# 규칙의 timeouts는 생성 규칙에 그대로 옮긴다('경로별 시간 상한').
# 정책(SecurityPolicy·EnvoyExtensionPolicy·BackendTrafficPolicy)은 deploy/gateways/gw-partner.yaml에 손으로 두고 라우트 이름으로 고른다.
# 상한을 넘어 나뉜 생성 라우트(<이름>-2 …)도 정책의 targetRefs에 모두 적는다(--check가 본다).
---
# gw-partner-public: 토큰 없이 부르는 파트너 경로(로그인·토큰 갱신·잠금 해제, 관리 계정 초대 수락 흐름 일곱, W7-WIR-05)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gw-partner-public
  namespace: envoy-gateway-system
  labels:
    peaket.io/auth: public
spec:
  parentRefs:
    - name: gw-partner
      sectionName: partner-api
  hostnames:
    - partner-api.peaket.example
  rules:
    - matches:
        - path:
            type: Exact
            value: /v1/partner/auth/sessions
        - path:
            type: PathPrefix
            value: /v1/partner/auth/access-tokens
        - path:
            type: PathPrefix
            value: /v1/partner/auth/unlock-links
        - path:
            type: PathPrefix
            value: /v1/partner/auth/unlocks
        - path:
            type: PathPrefix
            value: /v1/partner/auth/invitation-acceptances
        - path:
            type: PathPrefix
            value: /v1/partner/auth/invitation-completions
        - path:
            type: PathPrefix
            value: /v1/partner/auth/invitation-passkey-registrations
        - path:
            type: PathPrefix
            value: /v1/partner/auth/invitation-passkeys
        - path:
            type: PathPrefix
            value: /v1/partner/auth/invitation-passwords
        - path:
            type: PathPrefix
            value: /v1/partner/auth/invitation-totp-confirmations
        - path:
            type: PathPrefix
            value: /v1/partner/auth/invitation-totp-enrollments
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-peaket-app
                value: partner
              - name: x-forwarded-for
                value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
            remove:
              - x-peaket-browser-traceparent
      backendRefs:
        - group: ""
          kind: Service
          name: identity-svc
          namespace: core
          port: 8080
---
# gw-partner-webhooks: 결제사 웹훅(토큰·출처 확인·CORS 없음, 출발지 IP 한도와 본문 상한, docs/infra.md §4.1 '웹훅 경로'). IP 한도를 두 경로 합쳐 버킷 하나로 세도록 peaket.io/match: merged(RV-14)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gw-partner-webhooks
  namespace: envoy-gateway-system
  labels:
    peaket.io/auth: public
    peaket.io/match: merged
spec:
  parentRefs:
    - name: gw-partner
      sectionName: partner-api
  hostnames:
    - partner-api.peaket.example
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/webhooks
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-peaket-app
                value: partner
              - name: x-forwarded-for
                value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
            remove:
              - x-peaket-browser-traceparent
      backendRefs:
        - group: ""
          kind: Service
          name: payment-svc
          namespace: purchase
          port: 8080
---
# gw-partner-api: 파트너 콘솔 API(유효한 파트너 토큰, 전역 한도 계정당 600회/분·리포트 조회 30회/분 D-T50 ①)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gw-partner-api
  namespace: envoy-gateway-system
  labels:
    peaket.io/auth: token
spec:
  parentRefs:
    - name: gw-partner
      sectionName: partner-api
  hostnames:
    - partner-api.peaket.example
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/partner/auth/passkey-registrations
        - path:
            type: PathPrefix
            value: /v1/partner/auth/passkeys
        - path:
            type: PathPrefix
            value: /v1/partner/auth/password-changes
        - path:
            type: PathPrefix
            value: /v1/partner/auth/reauthentications
        - path:
            type: PathPrefix
            value: /v1/partner/auth/sessions/me
        - path:
            type: PathPrefix
            value: /v1/partner/team-accounts
        # 현장 스태프 초대·명단·해제·재발송: BAT-450B가 core-svc에서 identity-svc로 옮겼다(ADR-0353, identity §6.1)
