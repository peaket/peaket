# gw-ops 라우트 원천(BUILD_ORDER HOT-410, docs/infra.md §4.1 '경로별 메서드 생성기'). 적용 대상이 아니다: node tools/ci/gateway-routes.mjs --write가
# 이 파일과 docs/api/openapi.yaml로 deploy/gateways/gw-ops.routes.yaml을 만든다.
# 규칙의 맞춤에는 '이 경로 아래의 계약 작업을 맡는다'는 경로를 적고, 한 경로의 작업이 인증 종류가 달라 다른 라우트로 갈 때만 method도 적는다. 값은 openapi의 꼴(틀 {이름})이다.
# PathPrefix는 그 경로와 그 아래, Exact는 그 계약 경로 하나다(같은 앞부분 아래를 다른 라우트·백엔드로 나눌 때).
# ops-api.peaket.example의 계약 작업(경로·메서드 짝)은 정확히 한 규칙이 맡아야 한다(맡는 규칙이 없거나 둘이면 생성기가 멈춘다). 계약에 작업을 더하면 여기에 맡을 규칙을 정한다.
# 라우트마다 이름표 peaket.io/auth(public·optional·token·token-buy)를 단다. 맡은 작업의 openapi security·x-peaket-scopes로 정한 인증 종류와 다르면 생성기가 멈춘다
# (docs/infra.md §4.1 '인증 종류 대조'). 백엔드는 그 작업의 처리기가 있는 서비스다('백엔드 대조', 정적 시험 deploy/gateways/test/route-contract.test.mjs).
# 규칙의 timeouts는 생성 규칙에 그대로 옮긴다('경로별 시간 상한').
# 규칙의 name도 그대로 옮긴다. 정책이 규칙 하나만 겨눌 때(targetRefs의 sectionName) 쓴다: 길게 쥐는 규칙(SSE)의 차단 상한(docs/infra.md §4.1 '게이트웨이 차단 상한' '길게 쥐는 라우트').
# 정책(SecurityPolicy·EnvoyExtensionPolicy·BackendTrafficPolicy)은 deploy/gateways/gw-ops.yaml에 손으로 두고 라우트 이름으로 고른다.
# 상한을 넘어 나뉜 생성 라우트(<이름>-2 …)도 정책의 targetRefs에 모두 적는다(--check가 본다).
---
# gw-ops-public: 토큰 없이 부르는 관제 경로(로그인·토큰 갱신·잠금 해제, 관리 계정 초대 수락 흐름 일곱, 감사 앵커 공개 조회, W7-WIR-05)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gw-ops-public
  namespace: envoy-gateway-system
  labels:
    peaket.io/auth: public
spec:
  parentRefs:
    - name: gw-ops
      sectionName: ops-api
  hostnames:
    - ops-api.peaket.example
  rules:
    - matches:
        - path:
            type: Exact
            value: /v1/ops/auth/sessions
        - path:
            type: PathPrefix
            value: /v1/ops/auth/access-tokens
        - path:
            type: PathPrefix
            value: /v1/ops/auth/unlock-links
        - path:
            type: PathPrefix
            value: /v1/ops/auth/unlocks
        - path:
            type: PathPrefix
            value: /v1/ops/auth/invitation-acceptances
        - path:
            type: PathPrefix
            value: /v1/ops/auth/invitation-completions
        - path:
            type: PathPrefix
            value: /v1/ops/auth/invitation-passkey-registrations
        - path:
            type: PathPrefix
            value: /v1/ops/auth/invitation-passkeys
        - path:
            type: PathPrefix
            value: /v1/ops/auth/invitation-passwords
        - path:
            type: PathPrefix
            value: /v1/ops/auth/invitation-totp-confirmations
        - path:
            type: PathPrefix
            value: /v1/ops/auth/invitation-totp-enrollments
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-peaket-app
                value: console
              - name: x-forwarded-for
                value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
            remove:
              - x-peaket-browser-traceparent
      backendRefs:
        - group: ""
          kind: Service
          name: identity-svc
          namespace: core
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /v1/ops/audit-anchors
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-peaket-app
                value: console
              - name: x-forwarded-for
                value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
            remove:
              - x-peaket-browser-traceparent
      backendRefs:
        - group: ""
          kind: Service
          name: ops-svc
          namespace: core
          port: 8080
---
# gw-ops-api: 관제 API(유효한 운영자 토큰). 스캐너 기기는 ops-svc(ADR-0148 결정 1, W7-WIR-02)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gw-ops-api
  namespace: envoy-gateway-system
  labels:
    peaket.io/auth: token
spec:
  parentRefs:
    - name: gw-ops
      sectionName: ops-api
  hostnames:
    - ops-api.peaket.example
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/ops/auth/passkey-registrations
        - path:
            type: PathPrefix
            value: /v1/ops/auth/passkeys
        - path:
            type: PathPrefix
            value: /v1/ops/auth/password-changes
        - path:
            type: PathPrefix
            value: /v1/ops/auth/reauthentications
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-peaket-app
                value: console
              - name: x-forwarded-for
                value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
            remove:
              - x-peaket-browser-traceparent
      backendRefs:
        - group: ""
          kind: Service
          name: identity-svc
          namespace: core
          port: 8080
    # 같은 경로의 GET(내 세션 정보)은 ops-svc, DELETE(로그아웃)는 identity-svc다(openapi 두 설명). 메서드로 나눈다(BAT-045 리뷰 W-03).
    - matches:
        - path:
            type: Exact
            value: /v1/ops/auth/sessions/me
          method: GET
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-peaket-app
                value: console
              - name: x-forwarded-for
                value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
            remove:
              - x-peaket-browser-traceparent
      backendRefs:
        - group: ""
          kind: Service
          name: ops-svc
          namespace: core
          port: 8080
    - matches:
        - path:
            type: Exact
            value: /v1/ops/auth/sessions/me
          method: DELETE
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-peaket-app
                value: console
              - name: x-forwarded-for
                value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
            remove:
              - x-peaket-browser-traceparent
      backendRefs:
        - group: ""
          kind: Service
          name: identity-svc
          namespace: core
          port: 8080
    - name: ops-bot-review
      matches:
        - path:
            type: PathPrefix
            value: /v1/ops/events/{eventId}/bot-review
        - path:
            type: PathPrefix
            value: /v1/ops/events/{eventId}/bot-review-samples
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-peaket-app
                value: console
              - name: x-forwarded-for
                value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
            remove:
              - x-peaket-browser-traceparent
      backendRefs:
        - group: ""
          kind: Service
          name: ops-svc
          namespace: core
          port: 8080
    # 회차 단계·T-30분 점검과 Go/No-Go 판정은 ops-svc다(openapi getOpsEventReadiness·createOpsGoNoGoJudgement, F-03-3 OPS-380).
    - name: ops-event-readiness
      matches:
        - path:
            type: PathPrefix
            value: /v1/ops/events/{eventId}/go-no-go-judgements
        - path:
            type: PathPrefix
            value: /v1/ops/events/{eventId}/readiness
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-peaket-app
                value: console
              - name: x-forwarded-for
                value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
            remove:
              - x-peaket-browser-traceparent
      backendRefs:
        - group: ""
          kind: Service
          name: ops-svc
          namespace: core
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /v1/ops/events/{eventId}/demand-forecast
        - path:
            type: PathPrefix
            value: /v1/ops/events/{eventId}/fraud-cluster-runs
        - path:
            type: PathPrefix
            value: /v1/ops/events/{eventId}/fraud-overview
        - path:
            type: PathPrefix
            value: /v1/ops/events/{eventId}/reports
        - path:
            type: PathPrefix
            value: /v1/ops/events/{eventId}/scale-changes
        - path:
            type: PathPrefix
            value: /v1/ops/reviews
        - path:
            type: PathPrefix
            value: /v1/ops/sale-reviews
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-peaket-app
                value: console
              - name: x-forwarded-for
                value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
            remove:
              - x-peaket-browser-traceparent
      backendRefs:
        - group: ""
          kind: Service
          name: core-svc
          namespace: core
          port: 8080
    - name: ops-event-live
      matches:
        - path:
            type: Exact
            value: /v1/ops/events/{eventId}/live
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-peaket-app
                value: console
              - name: x-forwarded-for
                value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
            remove:
              - x-peaket-browser-traceparent
      backendRefs:
        - group: ""
          kind: Service
          name: ops-svc
          namespace: core
          port: 8080
      timeouts:
        request: 0s
    - name: ops-live
      matches:
        - path:
            type: Exact
            value: /v1/ops/live
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-peaket-app
                value: console
              - name: x-forwarded-for
                value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
            remove:
              - x-peaket-browser-traceparent
      backendRefs:
        - group: ""
          kind: Service
          name: ops-svc
          namespace: core
          port: 8080
      timeouts:
        request: 0s
    - name: ops-promoters
      matches:
        - path:
            type: PathPrefix
            value: /v1/ops/promoters
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-peaket-app
                value: console
              - name: x-forwarded-for
                value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
            remove:
              - x-peaket-browser-traceparent
      backendRefs:
        - group: ""
          kind: Service
          name: core-svc
          namespace: core
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /v1/ops/admin-accounts
        - path:
            type: PathPrefix
            value: /v1/ops/alerts
        - path:
            type: PathPrefix
            value: /v1/ops/approval-requests
        - path:
            type: PathPrefix
            value: /v1/ops/artists
        - path:
            type: PathPrefix
            value: /v1/ops/audit-checkpoints
        - path:
            type: PathPrefix
            value: /v1/ops/bot-review-samples
        - path:
            type: PathPrefix
            value: /v1/ops/cases
        - path:
            type: PathPrefix
            value: /v1/ops/command-dry-runs
        - path:
            type: PathPrefix
            value: /v1/ops/commands
        - path:
            type: PathPrefix
            value: /v1/ops/compliance
        - path:
            type: PathPrefix
            value: /v1/ops/decisions
        - path:
            type: PathPrefix
            value: /v1/ops/event-cancellations
        - path:
            type: PathPrefix
            value: /v1/ops/evidence-bundles
        - path:
            type: PathPrefix
            value: /v1/ops/external-posts
        - path:
            type: PathPrefix
            value: /v1/ops/fan-lookups
        - path:
            type: PathPrefix
            value: /v1/ops/fans
        - path:
            type: PathPrefix
            value: /v1/ops/fraud-cases
        - path:
            type: PathPrefix
            value: /v1/ops/fraud-clusters
        - path:
            type: PathPrefix
            value: /v1/ops/home-layout
        - path:
            type: PathPrefix
            value: /v1/ops/notice-templates
        - path:
            type: PathPrefix
            value: /v1/ops/partner-notices
        - path:
            type: PathPrefix
            value: /v1/ops/payout-batches
        - path:
            type: PathPrefix
            value: /v1/ops/pg-circuits
        - path:
            type: PathPrefix
            value: /v1/ops/places
        - path:
            type: PathPrefix
            value: /v1/ops/productions
        - path:
            type: PathPrefix
            value: /v1/ops/receivables
        - path:
            type: PathPrefix
            value: /v1/ops/research-exports
        - path:
            type: PathPrefix
            value: /v1/ops/scanner-devices
        - path:
            type: PathPrefix
            value: /v1/ops/settlements
        - path:
            type: PathPrefix
            value: /v1/ops/widgets
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-peaket-app
                value: console
              - name: x-forwarded-for
                value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
            remove:
