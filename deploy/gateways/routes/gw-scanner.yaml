# gw-scanner 라우트 원천(BUILD_ORDER HOT-410, docs/infra.md §4.1 '경로별 메서드 생성기'). 적용 대상이 아니다: node tools/ci/gateway-routes.mjs --write가
# 이 파일과 docs/api/openapi.yaml로 deploy/gateways/gw-scanner.routes.yaml을 만든다.
# 규칙의 맞춤에는 '이 경로 아래의 계약 작업을 맡는다'는 경로를 적고, 한 경로의 작업이 인증 종류가 달라 다른 라우트로 갈 때만 method도 적는다. 값은 openapi의 꼴(틀 {이름})이다.
# PathPrefix는 그 경로와 그 아래, Exact는 그 계약 경로 하나다(같은 앞부분 아래를 다른 라우트·백엔드로 나눌 때).
# scanner-api.peaket.example의 계약 작업(경로·메서드 짝)은 정확히 한 규칙이 맡아야 한다(맡는 규칙이 없거나 둘이면 생성기가 멈춘다). 계약에 작업을 더하면 여기에 맡을 규칙을 정한다.
# 라우트마다 이름표 peaket.io/auth(public·optional·token·token-buy)를 단다. 맡은 작업의 openapi security·x-peaket-scopes로 정한 인증 종류와 다르면 생성기가 멈춘다
# (docs/infra.md §4.1 '인증 종류 대조'). 백엔드는 그 작업의 처리기가 있는 서비스다('백엔드 대조', 정적 시험 deploy/gateways/test/route-contract.test.mjs).
# 규칙의 timeouts는 생성 규칙에 그대로 옮긴다('경로별 시간 상한').
# 정책(SecurityPolicy·EnvoyExtensionPolicy·BackendTrafficPolicy)은 deploy/gateways/gw-scanner.yaml에 손으로 두고 라우트 이름으로 고른다.
# 상한을 넘어 나뉜 생성 라우트(<이름>-2 …)도 정책의 targetRefs에 모두 적는다(--check가 본다).
---
# gw-scanner-public: 토큰 없이 부르는 스캐너 경로(기기 등록·기기 인가·스태프 토큰 받기. 기기 증명 DPoP·mTLS는 서비스가 본다, authz-matrix §5.2, W7-WIR-01)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gw-scanner-public
  namespace: envoy-gateway-system
  labels:
    peaket.io/auth: public
spec:
  parentRefs:
    - name: gw-scanner
      sectionName: scanner-api
  hostnames:
    - scanner-api.peaket.example
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/scanner/device-enrollments
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-peaket-app
                value: scanner
              - name: x-forwarded-for
                value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
            remove:
              - x-peaket-browser-traceparent
      backendRefs:
        - group: ""
          kind: Service
          name: ticket-svc
          namespace: ticket
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /v1/scanner/device-authorizations
        - path:
            type: Exact
            value: /v1/scanner/token
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-peaket-app
                value: scanner
              - name: x-forwarded-for
                value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
            remove:
              - x-peaket-browser-traceparent
      backendRefs:
        - group: ""
          kind: Service
          name: identity-svc
          namespace: core
          port: 8080
---
# gw-scanner-optional: 스태프 토큰이 있으면 확인하고 기기 증명만으로도 받는 경로(스캔 올리기, openapi security에 staffToken 없는 갈래가 있다)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gw-scanner-optional
  namespace: envoy-gateway-system
  labels:
    peaket.io/auth: optional
spec:
  parentRefs:
    - name: gw-scanner
      sectionName: scanner-api
  hostnames:
    - scanner-api.peaket.example
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/scanner/scans
        - path:
            type: PathPrefix
            value: /v1/scanner/queue-reports
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-peaket-app
                value: scanner
              - name: x-forwarded-for
                value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
            remove:
              - x-peaket-browser-traceparent
      backendRefs:
        - group: ""
          kind: Service
          name: ticket-svc
          namespace: ticket
          port: 8080
---
# gw-scanner-api: 현장 스태프 경로(토큰 Authorization: DPoP, 기기 증명은 ScannerGuard가 본다)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gw-scanner-api
  namespace: envoy-gateway-system
  labels:
    peaket.io/auth: token
spec:
  parentRefs:
    - name: gw-scanner
      sectionName: scanner-api
  hostnames:
    - scanner-api.peaket.example
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/scanner/booth-authorizations
        - path:
            type: PathPrefix
            value: /v1/scanner/events
        - path:
            type: PathPrefix
            value: /v1/scanner/flags
        - path:
            type: PathPrefix
            value: /v1/scanner/shift
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-peaket-app
                value: scanner
              - name: x-forwarded-for
                value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
            remove:
              - x-peaket-browser-traceparent
      backendRefs:
        - group: ""
          kind: Service
          name: ticket-svc
          namespace: ticket
          port: 8080
