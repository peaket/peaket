# gw-partner-api: 교차 출처·출처 확인·토큰 확인·인가(유효한 토큰)
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: gw-partner-api-security
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: gw-partner-api
  cors:
    allowOrigins:
      - https://partner.peaket.example
    allowMethods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
    allowHeaders:
      - Content-Type
      - Idempotency-Key
      - If-Match
      - X-Reauth-Token
    exposeHeaders:
      - X-Trace-Id
      - ETag
    maxAge: 7200s
    allowCredentials: true
  csrf:
    additionalOrigins:
      - https://partner.peaket.example
  jwt:
    providers:
      - name: admin-partner
        issuer: https://identity.peaket.example
        audiences:
          - partner
        remoteJWKS:
          uri: http://identity-svc.core.svc.cluster.local:8080/internal/jwks/admin.json
          backendRefs:
            - group: ""
              kind: Service
              name: identity-svc
              namespace: core
              port: 8080
          cacheDuration: 300s
        extractFrom:
          headers:
            - name: Authorization
              valuePrefix: "Bearer "
          cookies:
            - __Secure-peaket_partner_at
        claimToHeaders:
          - header: X-User-Id
            claim: sub
          - header: X-Session-Id
            claim: sid
          - header: X-User-Aud
            claim: aud
          - header: X-User-Scope
            claim: scope
  authorization:
    defaultAction: Deny
    rules:
      - name: valid-token
        action: Allow
        principal:
          jwt:
            provider: admin-partner
            claims:
              - name: aud
                values:
                  - partner
---
# gw-partner-app: 파트너 콘솔 앱 서버(같은 출처 화면). x-peaket-browser-traceparent를 이 라우트에서만 넘긴다(docs/observability.md §6)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gw-partner-app
  namespace: envoy-gateway-system
spec:
  parentRefs:
    - name: gw-partner
