        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: peaket-trace-not-allowed
---
# gw-partner-public: 토큰 없이 부르는 관리 계정 경로(비밀번호 로그인·토큰 갱신·잠금 풀기, identity §6)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gw-partner-public
  namespace: envoy-gateway-system
spec:
  parentRefs:
    - name: gw-partner
      sectionName: partner-api
  hostnames:
    - partner-api.peaket.example
  rules:
    - matches:
        - path:
            type: Exact
            value: /v1/partner/auth/sessions
          method: POST
        - path:
            type: Exact
            value: /v1/partner/auth/access-tokens
          method: POST
        - path:
            type: Exact
            value: /v1/partner/auth/unlocks
          method: POST
        - path:
            type: Exact
            value: /v1/partner/auth/unlock-links
          method: POST
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-peaket-app
                value: partner
              - name: x-forwarded-for
                value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
            remove:
              - x-peaket-browser-traceparent
      backendRefs:
        - group: ""
          kind: Service
          name: identity-svc
          namespace: core
          port: 8080
---
