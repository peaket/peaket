# gw-partner 게이트웨이(BUILD_ORDER HOT-400, 묶음 BAT-055). 정본: docs/infra.md §4.1 'Envoy 게이트웨이의 첫 구현'·§9 '응답 보안 헤더', docs/architecture.md §4 'CSRF 확인 규칙',
# docs/features/identity.md §3 '발급자와 검증 규칙', docs/security/authz-matrix.md §5.1, docs/observability.md §6 '신뢰 경계의 추적 문맥'.
# Envoy Gateway v1.10.0의 API(gateway.envoyproxy.io/v1alpha1)와 Gateway API v1로 쓴다. 값은 정본 값 그대로이고 바꾸면 정본을 먼저 고친다.
# API 호스트의 HTTPRoute는 생성 파일 gw-partner.routes.yaml에 있다(원천 routes/gw-partner.yaml, node tools/ci/gateway-routes.mjs --write, BUILD_ORDER HOT-410). 여기 남은 HTTPRoute는
# openapi 밖 경로(앱 서버·queue-files·남은 경로 404·앱 서버 호스트의 TRACE)이고, 정책은 생성 라우트를 이름으로 고른다(상한으로 나뉜 <이름>-2 …도 모두, --check가 본다).
# 정적 시험: node --test "deploy/gateways/test/*.test.mjs"
---
# gw-partner: 듣는 호스트(docs/infra.md §4.1 '호스트와 내부 경로'). 리스너마다 호스트 하나, HTTPS만. 인증서 Secret은 운영에서 cert-manager가, 로컬은 cluster.mjs가 만든다
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gw-partner
  namespace: envoy-gateway-system
spec:
  gatewayClassName: peaket
  listeners:
    - name: partner-api
      hostname: partner-api.peaket.example
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: gw-partner-partner-api-tls
      allowedRoutes:
        namespaces:
          from: Same
    - name: partner
      hostname: partner.peaket.example
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: gw-partner-partner-tls
      allowedRoutes:
        namespaces:
          from: Same
---
# gw-partner: 연결·들어올 때 머리·응답 머리(docs/infra.md §4.1 '들어올 때 지우고 넣는 머리'·'클라이언트 IP'·'응답 머리', §9 '응답 보안 헤더')
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: gw-partner-client
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gw-partner
  clientIPDetection:
    xForwardedFor:
      numTrustedHops: 1
  tls:
    minVersion: "1.2"
    maxVersion: "1.3"
    ciphers:
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES256-GCM-SHA384
      - ECDHE-ECDSA-CHACHA20-POLY1305
      - ECDHE-RSA-CHACHA20-POLY1305
  headers:
    withUnderscoresAction: DropHeader
    earlyRequestHeaders:
      mutations:
        - remove: x-peaket-browser-traceparent
      set:
        - name: x-peaket-browser-traceparent
          value: "%REQ(traceparent)%"
      remove:
        - traceparent
        - tracestate
        - baggage
        - x-peaket-app
        - x-user-id
        - x-session-id
        - x-user-aud
        - x-user-scope
        - x-user-pid
        - x-user-pid-prev
        - x-user-role
        - x-tenant-id
        - forwarded
        - x-real-ip
        - x-forwarded-host
        - x-forwarded-port
        - x-forwarded-prefix
        - x-forwarded-proto
      removeOnMatch:
        - type: Prefix
          value: x-user-
    lateResponseHeaders:
      set:
        - name: Strict-Transport-Security
          value: max-age=31536000; includeSubDomains
        - name: X-Content-Type-Options
          value: nosniff
      addIfAbsent:
        - name: Content-Security-Policy
          value: default-src 'none'; frame-ancestors 'none'
      add:
        - name: Vary
          value: Origin
---
# gw-partner: 원본 확인·끝단 신호 머리 지우기와 토큰 유형(typ) 확인(공통 Lua, JWT 확인 뒤에 돈다)
# 라우트 수준 정책(gw-partner-public-edge·gw-partner-api-edge)은 이 게이트웨이 정책을 통째로 덮는다(Envoy Gateway v1.10.0).
# 그래서 라우트 정책도 refreshCookie/refreshPath·csrfOrigin을 그대로 싣는다(BAT-045 리뷰 W-01).
# csrfOrigin은 여기 두지 않는다: 이 정책은 파트너 앱 서버 라우트에도 닿는데, 앱 서버 양식은 `Origin: null`을 보낸다(BAT-055 RV-02).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: gw-partner-edge
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gw-partner
  lua:
    - type: ValueRef
      valueRef:
        group: ""
        kind: ConfigMap
        name: peaket-gateway-edge-lua
      filterContext:
        originVerify: true
        checkTyp: false
        tokenCookie: __Secure-peaket_partner_at
        tokenScheme: Bearer
        refreshCookie: __Secure-peaket_partner_rt
        refreshPath: /v1/partner/auth/access-tokens
---
# gw-partner-public: 로그인·갱신 등 공개 라우트도 같은 게이트웨이 설정을 그대로 받고, CSRF Origin만 글자 그대로 견준다
# (라우트 정책이 게이트웨이 정책을 덮으므로 전부 다시 싣는다, BAT-045 리뷰 W-01·W-02).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: gw-partner-public-edge
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: gw-partner-public
  lua:
    - type: ValueRef
      valueRef:
        group: ""
        kind: ConfigMap
        name: peaket-gateway-edge-lua
      filterContext:
        originVerify: true
        checkTyp: false
        tokenCookie: __Secure-peaket_partner_at
        tokenScheme: Bearer
        refreshCookie: __Secure-peaket_partner_rt
        refreshPath: /v1/partner/auth/access-tokens
        csrfOrigin: https://partner.peaket.example
---
# gw-partner: 토큰 확인이 대상(aud)으로 거절한 응답(Envoy는 403과 WWW-Authenticate error="invalid_token")을 401로 바꾼다
# (docs/features/identity.md §3 발급자와 검증 규칙, I-T36: 다른 대상의 토큰은 역할과 상관없이 401. 2026-11-16 kind 확인). 출처 확인·인가의 403은 그 머리가 없어 그대로다.
# 게이트웨이가 스스로 만든 404(없는 경로·맞지 않는 메서드)·413·429·503은 고정 Problem 본문(type about:blank, title은 HTTP 상태 문구, detail·instance 없음)으로 바꾼다
# (docs/infra.md §4.1 '게이트웨이 오류의 Problem', docs/api/guidelines.md §2, D-T43 ①, ASVS 16.5.1). source: Local이라 서비스가 낸 응답(본문 그대로)은 건드리지 않는다.
# 바꾼 응답에는 lateResponseHeaders가 닿지 않아 응답 보안 머리와 X-Trace-Id를 그 응답에 다시 단다(X-Trace-Id 치환이 되는지는 kind 확인 대상).
# 404는 여기서 고치지 않는다: 고친 응답은 머리를 새로 써 X-Trace-Id가 빠진다(2026-11-16 kind). API 호스트의 남은 경로·맞지 않는 메서드 404는
# 직접 응답 필터 peaket-api-not-found가 같은 Problem 본문과 X-Trace-Id를 낸다(00-common.yaml, docs/infra.md §4.1 '추적 머리', 계획 '판단: 구현 kind 확인의 남은 것' 1 (가)②).
# 403(인가·출처 확인 거절, W7-WIR-08)·405(TRACE, W7-SEC-04)도 같은 고정 본문으로 바꾼다. 403은 대상 거절을 401로 바꾸는 첫 고치기 뒤에 둔다(그 고치기가 먼저 맞는다).
# 라우트에 따로 건 BackendTrafficPolicy(한도)는 mergeType: StrategicMerge로 이 정책에 합쳐 그 라우트에도 이 응답 고치기가 닿는다.
# 게이트웨이가 만든 503(차단 상한 넘침·연결 실패·건강한 파드 없음)에는 Retry-After: 2 [가정]를 단다(docs/infra.md §4.1 '게이트웨이 차단 상한', docs/api/guidelines.md §2, V-T43 ②).
# 차단 상한(circuitBreaker)도 이 정책에 두어, 합친 라우트 정책이 그 칸을 적지 않으면 이 값이 그 라우트에 닿는다.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: gw-partner-responses
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gw-partner
  # 차단 상한(서킷 브레이커, docs/infra.md §4.1 '게이트웨이 차단 상한', V-T43). 프록시 파드 하나·라우트 규칙 하나마다 센다.
  # 값은 정본 '지금 값과 잰 값(적용 보류)'의 지금 값이다(BAT-058 진단 측정이 결정 규칙대로 정함, docs/infra.md §4.1 '진단 측정으로 정함', ADR-0287 결정 11).
  # 연결 = 동시 처리 = ⌈k × R_pod × L_gw⌉, 보류 = ⌈동시 × q⌉. 재시도(retry)는 어디에도 두지 않는다(ADR-0009 결정 3)
  circuitBreaker:
    maxConnections: 6084
    maxParallelRequests: 6084
    maxPendingRequests: 761
  responseOverride:
    - match:
        statusCodes:
          - type: Value
            value: 403
        responseHeaders:
          - name: WWW-Authenticate
            value:
              type: RegularExpression
              value: .*invalid_token.*
      source: Local
      response:
        statusCode: 401
        contentType: application/problem+json
        body:
          type: Inline
          inline: '{"type":"about:blank","title":"Unauthorized","status":401}'
        header:
          set:
            - name: WWW-Authenticate
              value: Bearer error="invalid_token"
            - name: Strict-Transport-Security
              value: max-age=31536000; includeSubDomains
            - name: X-Content-Type-Options
              value: nosniff
            - name: Content-Security-Policy
              value: default-src 'none'; frame-ancestors 'none'
    - match:
        statusCodes:
          - type: Value
            value: 413
      source: Local
      response:
        contentType: application/problem+json
        body:
          type: Inline
          inline: '{"type":"about:blank","title":"Content Too Large","status":413}'
        header:
          set:
            - name: Strict-Transport-Security
              value: max-age=31536000; includeSubDomains
            - name: X-Content-Type-Options
              value: nosniff
            - name: Content-Security-Policy
              value: default-src 'none'; frame-ancestors 'none'
    - match:
        statusCodes:
          - type: Value
            value: 429
        requestHeaders:
          - name: X-User-Id
            value:
              type: RegularExpression
              value: .+
      source: Local
      response:
        contentType: application/problem+json
        body:
          type: Inline
          inline: '{"type":"about:blank","title":"Too Many Requests","status":429}'
        header:
          set:
            - name: Retry-After
              value: "60"
            - name: Strict-Transport-Security
              value: max-age=31536000; includeSubDomains
            - name: X-Content-Type-Options
              value: nosniff
            - name: Content-Security-Policy
              value: default-src 'none'; frame-ancestors 'none'
    - match:
        statusCodes:
          - type: Value
            value: 429
      source: Local
      response:
        contentType: application/problem+json
        body:
          type: Inline
          inline: '{"type":"about:blank","title":"Too Many Requests","status":429}'
        header:
          set:
            - name: Retry-After
              value: "1"
            - name: Strict-Transport-Security
              value: max-age=31536000; includeSubDomains
            - name: X-Content-Type-Options
              value: nosniff
            - name: Content-Security-Policy
              value: default-src 'none'; frame-ancestors 'none'
    - match:
        statusCodes:
          - type: Value
            value: 503
      source: Local
      response:
        contentType: application/problem+json
        body:
          type: Inline
          inline: '{"type":"about:blank","title":"Service Unavailable","status":503}'
        header:
          set:
            - name: Retry-After
              value: "2"
            - name: Strict-Transport-Security
              value: max-age=31536000; includeSubDomains
            - name: X-Content-Type-Options
              value: nosniff
            - name: Content-Security-Policy
              value: default-src 'none'; frame-ancestors 'none'
    - match:
        statusCodes:
          - type: Value
            value: 403
      source: Local
      response:
        contentType: application/problem+json
        body:
          type: Inline
          inline: '{"type":"about:blank","title":"Forbidden","status":403}'
        header:
          set:
            - name: Strict-Transport-Security
              value: max-age=31536000; includeSubDomains
            - name: X-Content-Type-Options
              value: nosniff
            - name: Content-Security-Policy
              value: default-src 'none'; frame-ancestors 'none'
    - match:
        statusCodes:
          - type: Value
            value: 405
      source: Local
      response:
        contentType: application/problem+json
        body:
          type: Inline
          inline: '{"type":"about:blank","title":"Method Not Allowed","status":405}'
        header:
          set:
            - name: Strict-Transport-Security
              value: max-age=31536000; includeSubDomains
            - name: X-Content-Type-Options
              value: nosniff
            - name: Content-Security-Policy
              value: default-src 'none'; frame-ancestors 'none'
---
# gw-partner-trace: 교차 출처 응답만(토큰 확인 없음)
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: gw-partner-trace-security
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: gw-partner-trace
  cors:
    allowOrigins:
      - https://partner.peaket.example
    allowMethods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
    allowHeaders:
      - Content-Type
      - Idempotency-Key
      - If-Match
      - X-Reauth-Token
      - tosspayments-webhook-signature
      - tosspayments-webhook-transmission-id
      - tosspayments-webhook-transmission-retried-count
      - tosspayments-webhook-transmission-time
      - webhook-id
      - webhook-signature
      - webhook-timestamp
      - X-Requested-With
    exposeHeaders:
      - X-Trace-Id
      - ETag
      - Retry-After
      - WWW-Authenticate
    maxAge: 7200s
    allowCredentials: true
---
# gw-partner partner: TRACE는 405(docs/security/asvs/delivery.md 13.4.4). 토큰 확인이 없는 라우트라 401보다 먼저 답한다. 이 호스트 라우트의 경로를 모두 TRACE로 다시 적는다
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gw-partner-partner-trace
  namespace: envoy-gateway-system
spec:
  parentRefs:
    - name: gw-partner
      sectionName: partner
  hostnames:
    - partner.peaket.example
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
          method: TRACE
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-peaket-app
                value: partner
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: peaket-trace-not-allowed
---
# gw-partner-public: 교차 출처·출처 확인(토큰 확인 없음, 공개 경로)
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: gw-partner-public-security
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: gw-partner-public
  cors:
    allowOrigins:
      - https://partner.peaket.example
    allowMethods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
    allowHeaders:
      - Content-Type
      - Idempotency-Key
      - If-Match
      - X-Reauth-Token
      - tosspayments-webhook-signature
      - tosspayments-webhook-transmission-id
      - tosspayments-webhook-transmission-retried-count
      - tosspayments-webhook-transmission-time
      - webhook-id
      - webhook-signature
      - webhook-timestamp
      - X-Requested-With
    exposeHeaders:
      - X-Trace-Id
      - ETag
      - Retry-After
      - WWW-Authenticate
    maxAge: 7200s
    allowCredentials: true
  csrf:
    additionalOrigins:
      - https://partner.peaket.example
---
# gw-partner-api: 교차 출처·출처 확인·토큰 확인·인가(유효한 토큰)
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: gw-partner-api-security
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: gw-partner-api
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: gw-partner-api-2
  cors:
    allowOrigins:
      - https://partner.peaket.example
    allowMethods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
    allowHeaders:
      - Content-Type
      - Idempotency-Key
      - If-Match
      - X-Reauth-Token
      - tosspayments-webhook-signature
      - tosspayments-webhook-transmission-id
      - tosspayments-webhook-transmission-retried-count
      - tosspayments-webhook-transmission-time
      - webhook-id
      - webhook-signature
      - webhook-timestamp
      - X-Requested-With
    exposeHeaders:
      - X-Trace-Id
      - ETag
      - Retry-After
      - WWW-Authenticate
    maxAge: 7200s
    allowCredentials: true
  csrf:
    additionalOrigins:
      - https://partner.peaket.example
  jwt:
    providers:
      - name: admin-partner
        issuer: https://identity.peaket.example
        audiences:
          - partner
        remoteJWKS:
          uri: http://identity-svc.core.svc.cluster.local:8080/internal/jwks/admin.json
          backendRefs:
            - group: ""
              kind: Service
              name: identity-svc
              namespace: core
              port: 8080
          cacheDuration: 300s
        extractFrom:
          headers:
            - name: Authorization
              valuePrefix: "Bearer "
          cookies:
            - __Secure-peaket_partner_at
        claimToHeaders:
          - header: X-User-Id
            claim: sub
          - header: X-Session-Id
            claim: sid
          - header: X-User-Aud
            claim: aud
          - header: X-User-Scope
            claim: scope
  authorization:
    defaultAction: Deny
    rules:
      - name: valid-token
        action: Allow
        principal:
          jwt:
            provider: admin-partner
            claims:
              - name: aud
                values:
                  - partner
---
# gw-partner-api: 공통 Lua + 토큰 유형(typ) 확인(JWT 확인보다 앞에서 실린 토큰의 머리를 직접 읽는다)
# 이 라우트 정책은 gw-partner-edge(게이트웨이)를 통째로 덮으므로(v1.10.0) 게이트웨이 설정을 모두 다시 싣는다. checkTyp만 다르다.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: gw-partner-api-edge
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: gw-partner-api
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: gw-partner-api-2
  lua:
    - type: ValueRef
      valueRef:
        group: ""
        kind: ConfigMap
        name: peaket-gateway-edge-lua
      filterContext:
        originVerify: true
        checkTyp: true
        tokenCookie: __Secure-peaket_partner_at
        tokenScheme: Bearer
        refreshCookie: __Secure-peaket_partner_rt
        refreshPath: /v1/partner/auth/access-tokens
        csrfOrigin: https://partner.peaket.example
---
# gw-partner-app: 파트너 콘솔 앱 서버(같은 출처 화면). x-peaket-browser-traceparent를 이 라우트에서만 넘긴다(docs/observability.md §6)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gw-partner-app
  namespace: envoy-gateway-system
spec:
  parentRefs:
    - name: gw-partner
      sectionName: partner
  hostnames:
    - partner.peaket.example
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-peaket-app
                value: partner
              - name: x-forwarded-for
                value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
      backendRefs:
        - group: ""
          kind: Service
          name: partner
          namespace: web
          port: 3001
---
# gw-partner partner-api: 다른 라우트에 맞지 않는 경로는 404(토큰 확인 없음). 생성 라우트가 정규식이라 가장 짧은 정규식 /.*로 둔다(Envoy Gateway는 정규식을 앞부분 매치보다 앞에 둔다, docs/infra.md §4.1 '호스트와 내부 경로'). 이 라우트에도 공통 Lua가 돌아 접근 로그에 위조 끝단 머리가 남지 않는다(리뷰 RV-01)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gw-partner-not-found
  namespace: envoy-gateway-system
spec:
  parentRefs:
    - name: gw-partner
      sectionName: partner-api
  hostnames:
    - partner-api.peaket.example
  rules:
    - matches:
        - path:
            type: RegularExpression
            value: /.*
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-peaket-app
                value: partner
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: peaket-api-not-found
---
# gw-partner-not-found: 교차 출처 응답만(토큰 확인 없음)
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: gw-partner-not-found-security
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: gw-partner-not-found
  cors:
    allowOrigins:
      - https://partner.peaket.example
    allowMethods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
    allowHeaders:
      - Content-Type
      - Idempotency-Key
      - If-Match
      - X-Reauth-Token
      - tosspayments-webhook-signature
      - tosspayments-webhook-transmission-id
      - tosspayments-webhook-transmission-retried-count
      - tosspayments-webhook-transmission-time
      - webhook-id
      - webhook-signature
      - webhook-timestamp
      - X-Requested-With
    exposeHeaders:
      - X-Trace-Id
      - ETag
      - Retry-After
      - WWW-Authenticate
    maxAge: 7200s
    allowCredentials: true
---
# gw-partner: 파트너 콘솔 API의 계정 단위 전역 한도(docs/infra.md §4.1 '전역 레이트 리밋 걸기', docs/api/guidelines.md §6, D-T50 ①⑤).
# gw-partner-api(나뉜 생성 라우트 포함)를 한 버킷(shared)으로 묶어 계정마다 분당 600회, 리포트 조회(GET /v1/partner/events/{eventId}/report)는 계정마다 분당 30회를 더 건다.
# 토큰에 파트너 테넌트가 없어(ADR-0172) 테넌트당 600회/분은 여기서 세지 않는다(D-T50 ⑦, 정할 곳 미정). 웹훅 라우트에는 걸지 않는다.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: gw-partner-account-rate-limit
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: gw-partner-api
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: gw-partner-api-2
  mergeType: StrategicMerge
  rateLimit:
    global:
      rules:
        - clientSelectors:
          - headers:
              - name: X-User-Id
                type: Distinct
          limit:
            requests: 600
            unit: Minute
          shared: true
        - clientSelectors:
          - headers:
              - name: X-User-Id
                type: Distinct
            path:
              type: RegularExpression
              value: /v1/partner/events/[^/]+/report
            methods:
              - value: GET
          limit:
            requests: 30
            unit: Minute
          shared: true
---
# gw-partner-webhooks: 결제사 웹훅의 출발지 IP 한도와 본문 상한(docs/infra.md §4.1 '웹훅 경로', docs/features/payment.md §5, D-T50 ⑥).
# 토스 결제 웹훅에는 서명이 없어 받는 쪽만으로는 위조 요청의 양을 막지 못한다. 출발지 IP마다(IPv4·IPv6 규칙 하나씩, sourceCIDR Distinct) 초당 100건이고
# 넘으면 429다(게이트웨이 파드마다 센다). 본문은 payment-svc와 같은 64KB(65,536바이트)를 넘으면 413이다(BufferAndLimit: 본문을 다 받아 상한을 지킨다).
# 토큰 확인·출처 확인·CORS는 걸지 않는다(SecurityPolicy 없음). 게이트웨이의 응답 고치기(gw-partner-responses)와 합친다(mergeType).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: gw-partner-webhooks-limits
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: gw-partner-webhooks
  mergeType: StrategicMerge
  rateLimit:
    local:
      rules:
        - clientSelectors:
            - sourceCIDR:
                type: Distinct
                value: 0.0.0.0/0
          limit:
            requests: 100
            unit: Second
        - clientSelectors:
            - sourceCIDR:
                type: Distinct
                value: ::/0
          limit:
            requests: 100
            unit: Second
  requestBuffer:
    limit: 64Ki
