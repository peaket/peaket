  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-peaket-app
                value: partner
              - name: x-forwarded-for
                value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
      backendRefs:
        - group: ""
          kind: Service
          name: partner
          namespace: web
          port: 3001
---
# gw-partner-app: 출처 확인(같은 출처 앱 서버, 토큰은 앱 서버가 본다)
apiVersion: gateway.envoyproxy.io/v1alpha1
