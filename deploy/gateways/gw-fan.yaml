# gw-fan 게이트웨이(BUILD_ORDER HOT-400, 묶음 BAT-055). 정본: docs/infra.md §4.1 'Envoy 게이트웨이의 첫 구현'·§9 '응답 보안 헤더', docs/architecture.md §4 'CSRF 확인 규칙',
# docs/features/identity.md §3 '발급자와 검증 규칙', docs/security/authz-matrix.md §5.1, docs/observability.md §6 '신뢰 경계의 추적 문맥'.
# Envoy Gateway v1.10.0의 API(gateway.envoyproxy.io/v1alpha1)와 Gateway API v1로 쓴다. 값은 정본 값 그대로이고 바꾸면 정본을 먼저 고친다.
# API 호스트의 HTTPRoute는 생성 파일 gw-fan.routes.yaml에 있다(원천 routes/gw-fan.yaml, node tools/ci/gateway-routes.mjs --write, BUILD_ORDER HOT-410). 여기 남은 HTTPRoute는
# openapi 밖 경로(앱 서버·queue-files·남은 경로 404·앱 서버 호스트의 TRACE)이고, 정책은 생성 라우트를 이름으로 고른다(상한으로 나뉜 <이름>-2 …도 모두, --check가 본다).
# 정적 시험: node --test "deploy/gateways/test/*.test.mjs"
---
# gw-fan: 듣는 호스트(docs/infra.md §4.1 '호스트와 내부 경로'). 리스너마다 호스트 하나, HTTPS만. 인증서 Secret은 운영에서 cert-manager가, 로컬은 cluster.mjs가 만든다
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gw-fan
  namespace: envoy-gateway-system
spec:
  gatewayClassName: peaket
  listeners:
    - name: api
      hostname: api.peaket.example
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: gw-fan-api-tls
      allowedRoutes:
        namespaces:
          from: Same
    - name: www
      hostname: www.peaket.example
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: gw-fan-www-tls
      allowedRoutes:
        namespaces:
          from: Same
---
# gw-fan: 연결·들어올 때 머리·응답 머리(docs/infra.md §4.1 '들어올 때 지우고 넣는 머리'·'클라이언트 IP'·'응답 머리', §9 '응답 보안 헤더')
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: gw-fan-client
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gw-fan
  clientIPDetection:
    xForwardedFor:
      numTrustedHops: 1
  tls:
    minVersion: "1.2"
    maxVersion: "1.3"
    ciphers:
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES256-GCM-SHA384
      - ECDHE-ECDSA-CHACHA20-POLY1305
      - ECDHE-RSA-CHACHA20-POLY1305
  headers:
    withUnderscoresAction: DropHeader
    earlyRequestHeaders:
      mutations:
        - remove: x-peaket-browser-traceparent
      set:
        - name: x-peaket-browser-traceparent
          value: "%REQ(traceparent)%"
      remove:
        - traceparent
        - tracestate
        - baggage
        - x-peaket-app
        - x-user-id
        - x-session-id
        - x-user-aud
        - x-user-scope
        - x-user-pid
        - x-user-pid-prev
        - x-user-role
        - x-tenant-id
        - forwarded
        - x-real-ip
        - x-forwarded-host
        - x-forwarded-port
        - x-forwarded-prefix
        - x-forwarded-proto
      removeOnMatch:
        - type: Prefix
          value: x-user-
    lateResponseHeaders:
      set:
        - name: Strict-Transport-Security
          value: max-age=31536000; includeSubDomains
        - name: X-Content-Type-Options
          value: nosniff
      addIfAbsent:
        - name: Content-Security-Policy
          value: default-src 'none'; frame-ancestors 'none'
      add:
        - name: Vary
          value: Origin
---
# gw-fan: 원본 확인·끝단 신호 머리 지우기와 토큰 유형(typ) 확인(공통 Lua, JWT 확인 뒤에 돈다)
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: gw-fan-edge
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gw-fan
  lua:
    - type: ValueRef
      valueRef:
        group: ""
        kind: ConfigMap
        name: peaket-gateway-edge-lua
      filterContext:
        originVerify: true
        checkTyp: false
        tokenCookie: __Secure-peaket_at
        tokenScheme: Bearer
---
# gw-fan: 토큰 확인이 대상(aud)으로 거절한 응답(Envoy는 403과 WWW-Authenticate error="invalid_token")을 401로 바꾼다
# (docs/features/identity.md §3 발급자와 검증 규칙, I-T36: 다른 대상의 토큰은 역할과 상관없이 401. 2026-11-16 kind 확인). 출처 확인·인가의 403은 그 머리가 없어 그대로다.
# 게이트웨이가 스스로 만든 404(없는 경로·맞지 않는 메서드)·413·429·503은 고정 Problem 본문(type about:blank, title은 HTTP 상태 문구, detail·instance 없음)으로 바꾼다
# (docs/infra.md §4.1 '게이트웨이 오류의 Problem', docs/api/guidelines.md §2, D-T43 ①, ASVS 16.5.1). source: Local이라 서비스가 낸 응답(본문 그대로)은 건드리지 않는다.
# 바꾼 응답에는 lateResponseHeaders가 닿지 않아 응답 보안 머리와 X-Trace-Id를 그 응답에 다시 단다(X-Trace-Id 치환이 되는지는 kind 확인 대상).
# 404는 여기서 고치지 않는다: 고친 응답은 머리를 새로 써 X-Trace-Id가 빠진다(2026-11-16 kind). API 호스트의 남은 경로·맞지 않는 메서드 404는
# 직접 응답 필터 peaket-api-not-found가 같은 Problem 본문과 X-Trace-Id를 낸다(00-common.yaml, docs/infra.md §4.1 '추적 머리', 계획 '판단: 구현 kind 확인의 남은 것' 1 (가)②).
# 403(인가·출처 확인 거절, W7-WIR-08)·405(TRACE, W7-SEC-04)도 같은 고정 본문으로 바꾼다. 403은 대상 거절을 401로 바꾸는 첫 고치기 뒤에 둔다(그 고치기가 먼저 맞는다).
# 라우트에 따로 건 BackendTrafficPolicy(한도)는 mergeType: StrategicMerge로 이 정책에 합쳐 그 라우트에도 이 응답 고치기가 닿는다.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: gw-fan-responses
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gw-fan
  responseOverride:
    - match:
        statusCodes:
          - type: Value
            value: 403
        responseHeaders:
          - name: WWW-Authenticate
            value:
              type: RegularExpression
              value: .*invalid_token.*
      source: Local
      response:
        statusCode: 401
        contentType: application/problem+json
        body:
          type: Inline
          inline: '{"type":"about:blank","title":"Unauthorized","status":401}'
        header:
          set:
            - name: WWW-Authenticate
              value: Bearer error="invalid_token"
            - name: Strict-Transport-Security
              value: max-age=31536000; includeSubDomains
            - name: X-Content-Type-Options
              value: nosniff
            - name: Content-Security-Policy
              value: default-src 'none'; frame-ancestors 'none'
    - match:
        statusCodes:
          - type: Value
            value: 413
      source: Local
      response:
        contentType: application/problem+json
        body:
          type: Inline
          inline: '{"type":"about:blank","title":"Content Too Large","status":413}'
        header:
          set:
            - name: Strict-Transport-Security
              value: max-age=31536000; includeSubDomains
            - name: X-Content-Type-Options
              value: nosniff
            - name: Content-Security-Policy
              value: default-src 'none'; frame-ancestors 'none'
    - match:
        statusCodes:
          - type: Value
            value: 429
        requestHeaders:
          - name: X-User-Id
            value:
              type: RegularExpression
              value: .+
      source: Local
      response:
        contentType: application/problem+json
        body:
          type: Inline
          inline: '{"type":"about:blank","title":"Too Many Requests","status":429}'
        header:
          set:
            - name: Retry-After
              value: "60"
            - name: Strict-Transport-Security
              value: max-age=31536000; includeSubDomains
            - name: X-Content-Type-Options
              value: nosniff
            - name: Content-Security-Policy
              value: default-src 'none'; frame-ancestors 'none'
    - match:
        statusCodes:
          - type: Value
            value: 429
      source: Local
      response:
        contentType: application/problem+json
        body:
          type: Inline
          inline: '{"type":"about:blank","title":"Too Many Requests","status":429}'
        header:
          set:
            - name: Retry-After
              value: "1"
            - name: Strict-Transport-Security
              value: max-age=31536000; includeSubDomains
            - name: X-Content-Type-Options
              value: nosniff
            - name: Content-Security-Policy
              value: default-src 'none'; frame-ancestors 'none'
    - match:
        statusCodes:
          - type: Value
            value: 503
      source: Local
      response:
        contentType: application/problem+json
        body:
          type: Inline
          inline: '{"type":"about:blank","title":"Service Unavailable","status":503}'
        header:
          set:
            - name: Strict-Transport-Security
              value: max-age=31536000; includeSubDomains
            - name: X-Content-Type-Options
              value: nosniff
            - name: Content-Security-Policy
              value: default-src 'none'; frame-ancestors 'none'
    - match:
        statusCodes:
          - type: Value
            value: 403
      source: Local
      response:
        contentType: application/problem+json
        body:
          type: Inline
          inline: '{"type":"about:blank","title":"Forbidden","status":403}'
        header:
          set:
            - name: Strict-Transport-Security
              value: max-age=31536000; includeSubDomains
            - name: X-Content-Type-Options
              value: nosniff
            - name: Content-Security-Policy
              value: default-src 'none'; frame-ancestors 'none'
    - match:
        statusCodes:
          - type: Value
            value: 405
      source: Local
      response:
        contentType: application/problem+json
        body:
          type: Inline
          inline: '{"type":"about:blank","title":"Method Not Allowed","status":405}'
        header:
          set:
            - name: Strict-Transport-Security
              value: max-age=31536000; includeSubDomains
            - name: X-Content-Type-Options
              value: nosniff
            - name: Content-Security-Policy
              value: default-src 'none'; frame-ancestors 'none'
---
# gw-fan-trace: 교차 출처 응답만(토큰 확인 없음)
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: gw-fan-trace-security
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: gw-fan-trace
  cors:
    allowOrigins:
      - https://www.peaket.example
    allowMethods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
    allowHeaders:
      - Content-Type
      - Idempotency-Key
      - If-Match
      - X-Reauth-Token
      - X-Admission-Token
      - X-Client-Ephemeral-Key
      - X-Purchase-Mac
      - X-Purchase-Seq
      - X-Requested-With
    exposeHeaders:
      - Date
      - X-Trace-Id
      - ETag
      - Location
      - Retry-After
      - WWW-Authenticate
    maxAge: 7200s
    allowCredentials: true
---
# gw-fan www: TRACE는 405(docs/security/asvs/delivery.md 13.4.4). 토큰 확인이 없는 라우트라 401보다 먼저 답한다. 이 호스트 라우트의 경로를 모두 TRACE로 다시 적는다
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gw-fan-www-trace
  namespace: envoy-gateway-system
spec:
  parentRefs:
    - name: gw-fan
      sectionName: www
  hostnames:
    - www.peaket.example
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
          method: TRACE
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-peaket-app
                value: web
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: peaket-trace-not-allowed
---
