---
# gw-fan-buy: 구매 경로(openapi에서 팬 쿠키와 입장 토큰을 함께 요구하는 작업: 좌석 스냅샷, 홀드 잡기·조회·해제·연장, 구매 세션 끝내기, 주문·결제. purchase-svc, ticket:buy, docs/security/authz-matrix.md §5.1, 리뷰 RV-03). /v1/events 아래 셋은 정규식이라 gw-fan-api의 /v1/events 정규식보다 앞에 둔다(같은 정규식 꼴이면 긴 쪽이 앞선다)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gw-fan-buy
  namespace: envoy-gateway-system
spec:
  parentRefs:
    - name: gw-fan
      sectionName: api
  hostnames:
    - api.peaket.example
  rules:
    - matches:
        - path:
            type: RegularExpression
            value: /v1/events/[^/]+/seatmap-snapshot
          method: GET
        - path:
            type: RegularExpression
            value: /v1/events/[^/]+/holds
          method: POST
        - path:
            type: RegularExpression
            value: /v1/events/[^/]+/purchase-session
          method: DELETE
        - path:
            type: RegularExpression
            value: /v1/holds(/.*)?
        - path:
            type: RegularExpression
            value: /v1/orders(/.*)?
        - path:
            type: RegularExpression
            value: /v1/events/[^/]+/seatmap-snapshot
          method: OPTIONS
        - path:
            type: RegularExpression
            value: /v1/events/[^/]+/holds
          method: OPTIONS
        - path:
            type: RegularExpression
            value: /v1/events/[^/]+/purchase-session
          method: OPTIONS
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-peaket-app
                value: web
              - name: x-forwarded-for
                value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
            remove:
              - x-peaket-browser-traceparent
      backendRefs:
        - group: ""
          kind: Service
          name: purchase-svc
          namespace: purchase
          port: 8080
---
# gw-fan-buy: 교차 출처·출처 확인·토큰 확인·인가(ticket:buy)
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: gw-fan-buy-security
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: gw-fan-buy
  cors:
    allowOrigins:
