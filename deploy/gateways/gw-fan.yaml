# gw-fan-api: 그 밖의 팬 API(경로 앞부분 단위의 첫 몫. 작업마다의 메서드·서비스 나눔은 openapi 생성기 HOT-410). /v1/events는 구매 경로(gw-fan-buy)와 가르려고 정규식으로 적는다
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gw-fan-api
  namespace: envoy-gateway-system
spec:
  parentRefs:
    - name: gw-fan
      sectionName: api
  hostnames:
    - api.peaket.example
  rules:
    - matches:
        - path:
            type: RegularExpression
            value: /v1/events(/.*)?
        - path:
            type: RegularExpression
            value: /v1/productions(/.*)?
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-peaket-app
                value: web
              - name: x-forwarded-for
                value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
            remove:
              - x-peaket-browser-traceparent
      backendRefs:
        - group: ""
          kind: Service
          name: core-svc
          namespace: core
          port: 8080
    - matches:
        - path:
            type: RegularExpression
            value: /v1/tickets(/.*)?
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-peaket-app
                value: web
              - name: x-forwarded-for
                value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
            remove:
              - x-peaket-browser-traceparent
      backendRefs:
        - group: ""
          kind: Service
          name: ticket-svc
          namespace: ticket
          port: 8080
---
