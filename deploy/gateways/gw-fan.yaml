# gw-fan 게이트웨이(BUILD_ORDER HOT-400, 묶음 BAT-055). 정본: docs/infra.md §4.1 'Envoy 게이트웨이의 첫 구현'·§9 '응답 보안 헤더', docs/architecture.md §4 'CSRF 확인 규칙',
# docs/features/identity.md §3 '발급자와 검증 규칙', docs/security/authz-matrix.md §5.1, docs/observability.md §6 '신뢰 경계의 추적 문맥'.
# Envoy Gateway v1.10.0의 API(gateway.envoyproxy.io/v1alpha1)와 Gateway API v1로 쓴다. 값은 정본 값 그대로이고 바꾸면 정본을 먼저 고친다.
# 정적 시험: node --test "deploy/gateways/test/*.test.mjs"
---
# gw-fan: 듣는 호스트(docs/infra.md §4.1 '호스트와 내부 경로'). 리스너마다 호스트 하나, HTTPS만. 인증서 Secret은 운영에서 cert-manager가, 로컬은 cluster.mjs가 만든다
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gw-fan
  namespace: envoy-gateway-system
spec:
  gatewayClassName: peaket
  listeners:
    - name: api
      hostname: api.peaket.example
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: gw-fan-api-tls
      allowedRoutes:
        namespaces:
          from: Same
    - name: www
      hostname: www.peaket.example
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: gw-fan-www-tls
      allowedRoutes:
        namespaces:
          from: Same
---
# gw-fan: 연결·들어올 때 머리·응답 머리(docs/infra.md §4.1 '들어올 때 지우고 넣는 머리'·'클라이언트 IP'·'응답 머리', §9 '응답 보안 헤더')
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: gw-fan-client
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gw-fan
  clientIPDetection:
    xForwardedFor:
      numTrustedHops: 1
  tls:
    minVersion: "1.2"
    maxVersion: "1.3"
    ciphers:
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES256-GCM-SHA384
      - ECDHE-ECDSA-CHACHA20-POLY1305
      - ECDHE-RSA-CHACHA20-POLY1305
  headers:
    withUnderscoresAction: DropHeader
    earlyRequestHeaders:
      mutations:
        - remove: x-peaket-browser-traceparent
      set:
        - name: x-peaket-browser-traceparent
          value: "%REQ(traceparent)%"
      remove:
        - traceparent
        - tracestate
        - baggage
        - x-peaket-app
        - x-user-id
        - x-session-id
        - x-user-aud
        - x-user-scope
        - x-user-pid
        - x-user-pid-prev
        - x-user-role
        - x-tenant-id
        - forwarded
        - x-real-ip
        - x-forwarded-host
        - x-forwarded-port
        - x-forwarded-prefix
        - x-forwarded-proto
      removeOnMatch:
        - type: Prefix
          value: x-user-
    lateResponseHeaders:
      set:
        - name: Strict-Transport-Security
          value: max-age=31536000; includeSubDomains
        - name: X-Content-Type-Options
          value: nosniff
      addIfAbsent:
        - name: Content-Security-Policy
          value: default-src 'none'; frame-ancestors 'none'
      add:
        - name: Vary
          value: Origin
---
# gw-fan: 원본 확인·끝단 신호 머리 지우기와 토큰 유형(typ) 확인(공통 Lua, JWT 확인 뒤에 돈다)
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: gw-fan-edge
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gw-fan
  lua:
    - type: ValueRef
      valueRef:
        group: ""
        kind: ConfigMap
        name: peaket-gateway-edge-lua
      filterContext:
        originVerify: true
        checkTyp: false
        tokenCookie: __Secure-peaket_at
        tokenScheme: Bearer
---
# gw-fan: 토큰 확인이 대상(aud)으로 거절한 응답(Envoy는 403과 WWW-Authenticate error="invalid_token")을 401로 바꾼다
# (docs/features/identity.md §3 발급자와 검증 규칙, I-T36: 다른 대상의 토큰은 역할과 상관없이 401. 2026-11-16 kind 확인). 출처 확인·인가의 403은 그 머리가 없어 그대로다.
# 라우트에 따로 건 BackendTrafficPolicy(검색 한도)가 있으면 그 라우트는 이 정책을 받지 않는다(그 라우트는 토큰 확인이 없다).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: gw-fan-responses
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gw-fan
  responseOverride:
    - match:
        statusCodes:
          - type: Value
            value: 403
        responseHeaders:
          - name: WWW-Authenticate
            value:
              type: RegularExpression
              value: .*invalid_token.*
      source: Local
      response:
        statusCode: 401
        contentType: application/problem+json
        body:
          type: Inline
          inline: '{"type":"about:blank","title":"Unauthorized","status":401}'
        header:
          set:
            - name: WWW-Authenticate
              value: Bearer error="invalid_token"
            - name: Strict-Transport-Security
              value: max-age=31536000; includeSubDomains
            - name: X-Content-Type-Options
              value: nosniff
            - name: Content-Security-Policy
              value: default-src 'none'; frame-ancestors 'none'
---
# gw-fan api: TRACE는 405(docs/security/asvs/delivery.md 13.4.4). 토큰 확인이 없는 라우트라 401보다 먼저 답한다. 이 호스트 라우트의 경로를 모두 TRACE로 다시 적는다
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gw-fan-trace
  namespace: envoy-gateway-system
spec:
  parentRefs:
    - name: gw-fan
      sectionName: api
  hostnames:
    - api.peaket.example
  rules:
    - matches:
        - path:
            type: Exact
            value: /v1/identity/access-tokens
          method: TRACE
        - path:
            type: RegularExpression
            value: /v1/search(/.*)?
          method: TRACE
        - path:
            type: RegularExpression
            value: /v1/identity(/.*)?
          method: TRACE
        - path:
            type: RegularExpression
            value: /v1/events/[^/]+/seatmap-snapshot
          method: TRACE
        - path:
            type: RegularExpression
            value: /v1/events/[^/]+/holds
          method: TRACE
        - path:
            type: RegularExpression
            value: /v1/events/[^/]+/purchase-session
          method: TRACE
        - path:
            type: RegularExpression
            value: /v1/holds(/.*)?
          method: TRACE
        - path:
            type: RegularExpression
            value: /v1/orders(/.*)?
          method: TRACE
        - path:
            type: RegularExpression
            value: /v1/events(/.*)?
          method: TRACE
        - path:
            type: RegularExpression
            value: /v1/productions(/.*)?
          method: TRACE
        - path:
            type: RegularExpression
            value: /v1/tickets(/.*)?
          method: TRACE
        - path:
            type: PathPrefix
            value: /
          method: TRACE
        - path:
            type: RegularExpression
            value: /.*
          method: TRACE
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-peaket-app
                value: web
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: peaket-trace-not-allowed
---
# gw-fan-trace: 교차 출처 응답만(토큰 확인 없음)
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: gw-fan-trace-security
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: gw-fan-trace
  cors:
    allowOrigins:
      - https://www.peaket.example
    allowMethods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
    allowHeaders:
      - Content-Type
      - Idempotency-Key
      - If-Match
      - X-Reauth-Token
    exposeHeaders:
      - Date
      - X-Trace-Id
      - ETag
    maxAge: 7200s
    allowCredentials: true
---
# gw-fan www: TRACE는 405(docs/security/asvs/delivery.md 13.4.4). 토큰 확인이 없는 라우트라 401보다 먼저 답한다. 이 호스트 라우트의 경로를 모두 TRACE로 다시 적는다
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
