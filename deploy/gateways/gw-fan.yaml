          - header: X-User-Pid-Prev
            claim: pid_prev
  authorization:
    defaultAction: Deny
    rules:
      - name: ticket-buy
        action: Allow
        principal:
          jwt:
            provider: fan-fan
            scopes:
              - ticket:buy
---
