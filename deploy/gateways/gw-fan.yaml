---
# gw-fan-public: 로그인 없이 부르는 팬 경로: 토큰 갱신(리프레시 쿠키만 읽는다, 응답의 Set-Cookie와 401 본문을 그대로 돌려준다, identity §3 PRF-030·ADR-0235)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gw-fan-public
  namespace: envoy-gateway-system
spec:
  parentRefs:
    - name: gw-fan
      sectionName: api
  hostnames:
    - api.peaket.example
  rules:
    - matches:
        - path:
            type: Exact
            value: /v1/identity/access-tokens
          method: POST
        - path:
            type: Exact
            value: /v1/identity/access-tokens
          method: OPTIONS
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-peaket-app
                value: web
              - name: x-forwarded-for
                value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
            remove:
              - x-peaket-browser-traceparent
      backendRefs:
        - group: ""
          kind: Service
          name: identity-svc
          namespace: core
          port: 8080
---
# gw-fan-public: 교차 출처·출처 확인(토큰 확인 없음, 공개 경로)
