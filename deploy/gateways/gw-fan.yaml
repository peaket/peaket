# gw-fan-search: 교차 출처·출처 확인(토큰 확인 없음, 공개 경로)
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: gw-fan-search-security
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: gw-fan-search
  cors:
    allowOrigins:
      - https://www.peaket.example
    allowMethods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
    allowHeaders:
      - Content-Type
      - Idempotency-Key
      - If-Match
      - X-Reauth-Token
      - X-Admission-Token
      - X-Client-Ephemeral-Key
      - X-Purchase-Mac
      - X-Purchase-Seq
      - X-Requested-With
    exposeHeaders:
      - Date
      - X-Trace-Id
      - ETag
      - Location
      - Retry-After
      - WWW-Authenticate
    maxAge: 7200s
    allowCredentials: true
  csrf:
    additionalOrigins:
