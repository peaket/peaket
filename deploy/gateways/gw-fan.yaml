# gw-fan-app: 소비자 웹 앱 서버(같은 출처 화면). 브라우저 traceparent를 옮긴 x-peaket-browser-traceparent를 이 라우트에서만 넘긴다(docs/observability.md §6). CSP·Referrer-Policy·COOP는 앱 값을 그대로 둔다
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gw-fan-app
  namespace: envoy-gateway-system
spec:
  parentRefs:
    - name: gw-fan
      sectionName: www
  hostnames:
    - www.peaket.example
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-peaket-app
                value: web
              - name: x-forwarded-for
                value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
      backendRefs:
        - group: ""
          kind: Service
          name: web
          namespace: web
          port: 3000
---
# gw-fan api: 다른 라우트에 맞지 않는 경로는 404(토큰 확인 없음). 이 라우트에도 공통 Lua가 돌아 접근 로그에 위조 끝단 머리가 남지 않는다(리뷰 RV-01)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gw-fan-not-found
  namespace: envoy-gateway-system
spec:
  parentRefs:
    - name: gw-fan
      sectionName: api
  hostnames:
    - api.peaket.example
  rules:
    - matches:
        - path:
            type: RegularExpression
            value: /.*
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-peaket-app
                value: web
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: peaket-api-not-found
---
