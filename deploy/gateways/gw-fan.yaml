    allowMethods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
    allowHeaders:
      - Content-Type
      - Idempotency-Key
      - If-Match
      - X-Reauth-Token
      - X-Admission-Token
      - X-Client-Ephemeral-Key
      - X-Purchase-Mac
      - X-Purchase-Seq
      - X-Requested-With
    exposeHeaders:
      - Date
      - X-Trace-Id
      - ETag
      - Location
      - Retry-After
      - WWW-Authenticate
    maxAge: 7200s
    allowCredentials: true
  csrf:
    additionalOrigins:
      - https://www.peaket.example
  jwt:
    optional: true
    providers:
      - name: fan-fan
        issuer: https://identity.peaket.example
        audiences:
          - fan
        remoteJWKS:
          uri: http://identity-svc.core.svc.cluster.local:8080/internal/jwks/fan.json
          backendRefs:
            - group: ""
              kind: Service
              name: identity-svc
              namespace: core
              port: 8080
          cacheDuration: 300s
        extractFrom:
          headers:
            - name: Authorization
              valuePrefix: "Bearer "
          cookies:
            - __Secure-peaket_at
        claimToHeaders:
          - header: X-User-Id
            claim: sub
          - header: X-Session-Id
            claim: sid
          - header: X-User-Aud
            claim: aud
          - header: X-User-Scope
            claim: scope
          - header: X-User-Pid
            claim: pid
          - header: X-User-Pid-Prev
            claim: pid_prev
---
