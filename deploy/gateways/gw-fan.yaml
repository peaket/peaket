# gw-fan-search: 클라이언트 IP(게이트웨이가 정한 값)마다 초당 50건(docs/features/search.md §8 '무작위 입력' 줄의 '첫 값', SR-T13 ②).
# - 로컬 한도(프록시 파드마다 센다)라 실제 상한은 파드 수 × 이 값이다. 이 판은 모아 두기(버킷 크기)를 초당 건수와 같게 만든다(따로 적는 칸이 없다).
# - IPv4·IPv6를 규칙 하나씩으로 덮는다(sourceCIDR Distinct는 CIDR 하나만 받는다). 넘으면 429이고 Envoy Gateway가 Retry-After를 붙인다(ClientTrafficPolicy disableRetryAfterHeader를 켜지 않는다).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: gw-fan-search-rate-limit
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: gw-fan-search
  rateLimit:
    local:
      rules:
        - clientSelectors:
            - sourceCIDR:
                type: Distinct
                value: 0.0.0.0/0
          limit:
            requests: 50
            unit: Second
        - clientSelectors:
            - sourceCIDR:
                type: Distinct
                value: ::/0
          limit:
            requests: 50
            unit: Second
---
# gw-fan-identity: 팬 계정 경로(identity-svc 앱 포트): 로그인한 기기(X-Reauth-Token을 넘긴다, BOT-044), 계정 요약·가입 마무리(BOT-047) 등. /internal/은 내지 않는다
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gw-fan-identity
  namespace: envoy-gateway-system
spec:
  parentRefs:
    - name: gw-fan
      sectionName: api
  hostnames:
    - api.peaket.example
  rules:
    - matches:
        - path:
            type: RegularExpression
            value: /v1/identity(/.*)?
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-peaket-app
                value: web
              - name: x-forwarded-for
                value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
            remove:
              - x-peaket-browser-traceparent
      backendRefs:
        - group: ""
          kind: Service
          name: identity-svc
          namespace: core
          port: 8080
---
# gw-fan-identity: 교차 출처·출처 확인·토큰 확인·인가(유효한 토큰)
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: gw-fan-identity-security
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: gw-fan-identity
  cors:
    allowOrigins:
      - https://www.peaket.example
    allowMethods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
    allowHeaders:
      - Content-Type
      - Idempotency-Key
      - If-Match
      - X-Reauth-Token
    exposeHeaders:
      - Date
      - X-Trace-Id
      - ETag
    maxAge: 7200s
    allowCredentials: true
  csrf:
    additionalOrigins:
      - https://www.peaket.example
  jwt:
    providers:
      - name: fan-fan
        issuer: https://identity.peaket.example
        audiences:
          - fan
        remoteJWKS:
          uri: http://identity-svc.core.svc.cluster.local:8080/internal/jwks/fan.json
          backendRefs:
            - group: ""
              kind: Service
              name: identity-svc
              namespace: core
              port: 8080
          cacheDuration: 300s
        extractFrom:
          headers:
            - name: Authorization
              valuePrefix: "Bearer "
          cookies:
            - __Secure-peaket_at
        claimToHeaders:
          - header: X-User-Id
            claim: sub
          - header: X-Session-Id
            claim: sid
          - header: X-User-Aud
            claim: aud
          - header: X-User-Scope
            claim: scope
          - header: X-User-Pid
            claim: pid
          - header: X-User-Pid-Prev
            claim: pid_prev
  authorization:
    defaultAction: Deny
    rules:
      - name: valid-token
        action: Allow
        principal:
          jwt:
            provider: fan-fan
            claims:
              - name: aud
                values:
                  - fan
---
# gw-fan-identity: 공통 Lua + 토큰 유형(typ) 확인(JWT 확인보다 앞에서 실린 토큰의 머리를 직접 읽는다)
