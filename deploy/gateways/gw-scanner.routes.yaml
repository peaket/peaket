---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gw-scanner-trace
  namespace: envoy-gateway-system
  labels:
    peaket.io/route: gw-scanner-trace
spec:
  parentRefs:
    - name: gw-scanner
      sectionName: scanner-api
  hostnames:
    - scanner-api.peaket.example
  rules:
    - matches:
        - path:
            type: RegularExpression
            value: /v1/scanner/booth-authorizations(/.*)?
          method: TRACE
        - path:
            type: RegularExpression
            value: /v1/scanner/device-authorizations(/.*)?
          method: TRACE
        - path:
            type: RegularExpression
            value: /v1/scanner/device-enrollments(/.*)?
          method: TRACE
        - path:
            type: RegularExpression
            value: /v1/scanner/events(/.*)?
          method: TRACE
        - path:
            type: RegularExpression
            value: /v1/scanner/flags(/.*)?
          method: TRACE
        - path:
            type: RegularExpression
            value: /v1/scanner/scans(/.*)?
          method: TRACE
        - path:
            type: RegularExpression
            value: /v1/scanner/shift(/.*)?
          method: TRACE
        - path:
            type: RegularExpression
            value: /v1/scanner/token(/.*)?
          method: TRACE
        - path:
            type: PathPrefix
            value: /
          method: TRACE
        - path:
            type: RegularExpression
            value: /.*
          method: TRACE
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-peaket-app
                value: scanner
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: peaket-trace-not-allowed
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gw-scanner-public
  namespace: envoy-gateway-system
  labels:
    peaket.io/auth: public
    peaket.io/route: gw-scanner-public
spec:
  parentRefs:
    - name: gw-scanner
      sectionName: scanner-api
  hostnames:
    - scanner-api.peaket.example
  rules:
    - matches:
        - path:
            type: Exact
            value: /v1/scanner/device-enrollments
          method: POST
        - path:
            type: Exact
            value: /v1/scanner/device-enrollments
          method: OPTIONS
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-peaket-app
                value: scanner
              - name: x-forwarded-for
                value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
            remove:
              - x-peaket-browser-traceparent
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: X-Trace-Id
                value: "%TRACE_ID%"
      backendRefs:
        - group: ""
          kind: Service
          name: ticket-svc
          namespace: ticket
          port: 8080
    - matches:
        - path:
            type: Exact
            value: /v1/scanner/device-authorizations
          method: POST
        - path:
            type: Exact
            value: /v1/scanner/device-authorizations
          method: OPTIONS
        - path:
            type: Exact
            value: /v1/scanner/token
          method: POST
        - path:
            type: Exact
            value: /v1/scanner/token
          method: OPTIONS
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-peaket-app
                value: scanner
              - name: x-forwarded-for
                value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
            remove:
              - x-peaket-browser-traceparent
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: X-Trace-Id
                value: "%TRACE_ID%"
      backendRefs:
        - group: ""
          kind: Service
          name: identity-svc
          namespace: core
          port: 8080
