# gw-ops 게이트웨이(BUILD_ORDER HOT-400, 묶음 BAT-055). 정본: docs/infra.md §4.1 'Envoy 게이트웨이의 첫 구현'·§9 '응답 보안 헤더', docs/architecture.md §4 'CSRF 확인 규칙',
# docs/features/identity.md §3 '발급자와 검증 규칙', docs/security/authz-matrix.md §5.1, docs/observability.md §6 '신뢰 경계의 추적 문맥'.
# Envoy Gateway v1.10.0의 API(gateway.envoyproxy.io/v1alpha1)와 Gateway API v1로 쓴다. 값은 정본 값 그대로이고 바꾸면 정본을 먼저 고친다.
# API 호스트의 HTTPRoute는 생성 파일 gw-ops.routes.yaml에 있다(원천 routes/gw-ops.yaml, node tools/ci/gateway-routes.mjs --write, BUILD_ORDER HOT-410). 여기 남은 HTTPRoute는
# openapi 밖 경로(앱 서버·queue-files·남은 경로 404·앱 서버 호스트의 TRACE)이고, 정책은 생성 라우트를 이름으로 고른다(상한으로 나뉜 <이름>-2 …도 모두, --check가 본다).
# 정적 시험: node --test "deploy/gateways/test/*.test.mjs"
---
# gw-ops: 듣는 호스트(docs/infra.md §4.1 '호스트와 내부 경로'). 리스너마다 호스트 하나, HTTPS만. 인증서 Secret은 운영에서 cert-manager가, 로컬은 cluster.mjs가 만든다
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gw-ops
  namespace: envoy-gateway-system
spec:
  gatewayClassName: peaket
  listeners:
    - name: ops-api
      hostname: ops-api.peaket.example
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: gw-ops-ops-api-tls
      allowedRoutes:
        namespaces:
          from: Same
---
# gw-ops: 연결·들어올 때 머리·응답 머리(docs/infra.md §4.1 '들어올 때 지우고 넣는 머리'·'클라이언트 IP'·'응답 머리', §9 '응답 보안 헤더')
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: gw-ops-client
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gw-ops
  clientIPDetection:
    xForwardedFor:
      numTrustedHops: 1
  tls:
    minVersion: "1.2"
    maxVersion: "1.3"
    ciphers:
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES256-GCM-SHA384
      - ECDHE-ECDSA-CHACHA20-POLY1305
      - ECDHE-RSA-CHACHA20-POLY1305
  headers:
    withUnderscoresAction: DropHeader
    earlyRequestHeaders:
      remove:
        - traceparent
        - tracestate
        - baggage
        - x-peaket-app
        - x-peaket-browser-traceparent
        - x-user-id
        - x-session-id
        - x-user-aud
        - x-user-scope
        - x-user-pid
        - x-user-pid-prev
        - x-user-role
        - x-tenant-id
        - forwarded
        - x-real-ip
        - x-forwarded-host
        - x-forwarded-port
        - x-forwarded-prefix
        - x-forwarded-proto
      removeOnMatch:
        - type: Prefix
          value: x-user-
    lateResponseHeaders:
      set:
        - name: Strict-Transport-Security
          value: max-age=31536000; includeSubDomains
        - name: X-Content-Type-Options
          value: nosniff
      addIfAbsent:
        - name: Content-Security-Policy
          value: default-src 'none'; frame-ancestors 'none'
      add:
        - name: Vary
          value: Origin
---
# gw-ops: 원본 확인·끝단 신호 머리 지우기와 토큰 유형(typ) 확인(공통 Lua, JWT 확인 뒤에 돈다)
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: gw-ops-edge
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gw-ops
  lua:
    - type: ValueRef
      valueRef:
        group: ""
        kind: ConfigMap
        name: peaket-gateway-edge-lua
      filterContext:
        originVerify: true
        checkTyp: false
        tokenCookie: __Host-peaket_ops_at
        tokenScheme: Bearer
---
# gw-ops: 토큰 확인이 대상(aud)으로 거절한 응답(Envoy는 403과 WWW-Authenticate error="invalid_token")을 401로 바꾼다
# (docs/features/identity.md §3 발급자와 검증 규칙, I-T36: 다른 대상의 토큰은 역할과 상관없이 401. 2026-11-16 kind 확인). 출처 확인·인가의 403은 그 머리가 없어 그대로다.
# 게이트웨이가 스스로 만든 404(없는 경로·맞지 않는 메서드)·413·429·503은 고정 Problem 본문(type about:blank, title은 HTTP 상태 문구, detail·instance 없음)으로 바꾼다
# (docs/infra.md §4.1 '게이트웨이 오류의 Problem', docs/api/guidelines.md §2, D-T43 ①, ASVS 16.5.1). source: Local이라 서비스가 낸 응답(본문 그대로)은 건드리지 않는다.
# 바꾼 응답에는 lateResponseHeaders가 닿지 않아 응답 보안 머리와 X-Trace-Id를 그 응답에 다시 단다(X-Trace-Id 치환이 되는지는 kind 확인 대상).
# 403(인가·출처 확인 거절, W7-WIR-08)·405(TRACE, W7-SEC-04)도 같은 고정 본문으로 바꾼다. 403은 대상 거절을 401로 바꾸는 첫 고치기 뒤에 둔다(그 고치기가 먼저 맞는다).
# 라우트에 따로 건 BackendTrafficPolicy(한도)는 mergeType: StrategicMerge로 이 정책에 합쳐 그 라우트에도 이 응답 고치기가 닿는다.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: gw-ops-responses
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gw-ops
  responseOverride:
    - match:
        statusCodes:
          - type: Value
            value: 403
        responseHeaders:
          - name: WWW-Authenticate
            value:
              type: RegularExpression
              value: .*invalid_token.*
      source: Local
      response:
        statusCode: 401
        contentType: application/problem+json
        body:
          type: Inline
          inline: '{"type":"about:blank","title":"Unauthorized","status":401}'
        header:
          set:
            - name: WWW-Authenticate
              value: Bearer error="invalid_token"
            - name: Strict-Transport-Security
              value: max-age=31536000; includeSubDomains
            - name: X-Content-Type-Options
              value: nosniff
            - name: Content-Security-Policy
              value: default-src 'none'; frame-ancestors 'none'
    - match:
        statusCodes:
          - type: Value
            value: 404
      source: Local
      response:
        contentType: application/problem+json
        body:
          type: Inline
          inline: '{"type":"about:blank","title":"Not Found","status":404}'
        header:
          set:
            - name: Strict-Transport-Security
              value: max-age=31536000; includeSubDomains
            - name: X-Content-Type-Options
              value: nosniff
            - name: Content-Security-Policy
              value: default-src 'none'; frame-ancestors 'none'
    - match:
        statusCodes:
          - type: Value
            value: 413
      source: Local
      response:
        contentType: application/problem+json
        body:
          type: Inline
          inline: '{"type":"about:blank","title":"Content Too Large","status":413}'
        header:
          set:
            - name: Strict-Transport-Security
              value: max-age=31536000; includeSubDomains
            - name: X-Content-Type-Options
              value: nosniff
            - name: Content-Security-Policy
              value: default-src 'none'; frame-ancestors 'none'
    - match:
        statusCodes:
          - type: Value
            value: 429
        requestHeaders:
          - name: X-User-Id
            value:
              type: RegularExpression
              value: .+
      source: Local
      response:
        contentType: application/problem+json
        body:
          type: Inline
          inline: '{"type":"about:blank","title":"Too Many Requests","status":429}'
        header:
          set:
            - name: Retry-After
              value: "60"
            - name: Strict-Transport-Security
              value: max-age=31536000; includeSubDomains
            - name: X-Content-Type-Options
              value: nosniff
            - name: Content-Security-Policy
              value: default-src 'none'; frame-ancestors 'none'
    - match:
        statusCodes:
          - type: Value
            value: 429
      source: Local
      response:
        contentType: application/problem+json
        body:
          type: Inline
          inline: '{"type":"about:blank","title":"Too Many Requests","status":429}'
        header:
          set:
            - name: Retry-After
              value: "1"
            - name: Strict-Transport-Security
              value: max-age=31536000; includeSubDomains
            - name: X-Content-Type-Options
              value: nosniff
            - name: Content-Security-Policy
              value: default-src 'none'; frame-ancestors 'none'
    - match:
        statusCodes:
          - type: Value
            value: 503
      source: Local
      response:
        contentType: application/problem+json
        body:
          type: Inline
          inline: '{"type":"about:blank","title":"Service Unavailable","status":503}'
        header:
          set:
            - name: Strict-Transport-Security
              value: max-age=31536000; includeSubDomains
            - name: X-Content-Type-Options
              value: nosniff
            - name: Content-Security-Policy
              value: default-src 'none'; frame-ancestors 'none'
    - match:
        statusCodes:
          - type: Value
            value: 403
      source: Local
      response:
        contentType: application/problem+json
        body:
          type: Inline
          inline: '{"type":"about:blank","title":"Forbidden","status":403}'
        header:
          set:
            - name: Strict-Transport-Security
              value: max-age=31536000; includeSubDomains
            - name: X-Content-Type-Options
              value: nosniff
            - name: Content-Security-Policy
              value: default-src 'none'; frame-ancestors 'none'
    - match:
        statusCodes:
          - type: Value
            value: 405
      source: Local
      response:
        contentType: application/problem+json
        body:
          type: Inline
          inline: '{"type":"about:blank","title":"Method Not Allowed","status":405}'
        header:
          set:
            - name: Strict-Transport-Security
              value: max-age=31536000; includeSubDomains
            - name: X-Content-Type-Options
              value: nosniff
            - name: Content-Security-Policy
              value: default-src 'none'; frame-ancestors 'none'
---
# gw-ops-trace: 교차 출처 응답만(토큰 확인 없음)
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: gw-ops-trace-security
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: gw-ops-trace
  cors:
    allowOrigins:
      - https://console.peaket.example
    allowMethods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
    allowHeaders:
      - Content-Type
      - Idempotency-Key
      - If-Match
      - X-Reauth-Token
      - Last-Event-ID
      - X-Requested-With
    exposeHeaders:
      - X-Trace-Id
      - ETag
      - Content-Disposition
      - Location
      - Retry-After
      - WWW-Authenticate
    maxAge: 7200s
    allowCredentials: true
---
# gw-ops-public: 교차 출처·출처 확인(토큰 확인 없음, 공개 경로)
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: gw-ops-public-security
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: gw-ops-public
  cors:
    allowOrigins:
      - https://console.peaket.example
    allowMethods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
    allowHeaders:
      - Content-Type
      - Idempotency-Key
      - If-Match
      - X-Reauth-Token
      - Last-Event-ID
      - X-Requested-With
    exposeHeaders:
      - X-Trace-Id
      - ETag
      - Content-Disposition
      - Location
      - Retry-After
      - WWW-Authenticate
    maxAge: 7200s
    allowCredentials: true
  csrf:
    additionalOrigins:
      - https://console.peaket.example
---
# gw-ops-api: 교차 출처·출처 확인·토큰 확인·인가(유효한 토큰)
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: gw-ops-api-security
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: gw-ops-api
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: gw-ops-api-2
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: gw-ops-api-3
  cors:
    allowOrigins:
      - https://console.peaket.example
    allowMethods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
    allowHeaders:
      - Content-Type
      - Idempotency-Key
      - If-Match
      - X-Reauth-Token
      - Last-Event-ID
      - X-Requested-With
    exposeHeaders:
      - X-Trace-Id
      - ETag
      - Content-Disposition
      - Location
      - Retry-After
      - WWW-Authenticate
    maxAge: 7200s
    allowCredentials: true
  csrf:
    additionalOrigins:
      - https://console.peaket.example
  jwt:
    providers:
      - name: admin-ops
        issuer: https://identity.peaket.example
        audiences:
          - ops
        remoteJWKS:
          uri: http://identity-svc.core.svc.cluster.local:8080/internal/jwks/admin.json
          backendRefs:
            - group: ""
              kind: Service
              name: identity-svc
              namespace: core
              port: 8080
          cacheDuration: 300s
        extractFrom:
          headers:
            - name: Authorization
              valuePrefix: "Bearer "
          cookies:
            - __Host-peaket_ops_at
        claimToHeaders:
          - header: X-User-Id
            claim: sub
          - header: X-Session-Id
            claim: sid
          - header: X-User-Aud
            claim: aud
          - header: X-User-Scope
            claim: scope
  authorization:
    defaultAction: Deny
    rules:
      - name: valid-token
        action: Allow
        principal:
          jwt:
            provider: admin-ops
            claims:
              - name: aud
                values:
                  - ops
---
# gw-ops-api: 공통 Lua + 토큰 유형(typ) 확인(JWT 확인보다 앞에서 실린 토큰의 머리를 직접 읽는다)
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: gw-ops-api-edge
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: gw-ops-api
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: gw-ops-api-2
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: gw-ops-api-3
  lua:
    - type: ValueRef
      valueRef:
        group: ""
        kind: ConfigMap
        name: peaket-gateway-edge-lua
      filterContext:
        originVerify: true
        checkTyp: true
        tokenCookie: __Host-peaket_ops_at
        tokenScheme: Bearer
---
# gw-ops ops-api: 다른 라우트에 맞지 않는 경로는 404(토큰 확인 없음). 생성 라우트가 정규식이라 가장 짧은 정규식 /.*로 둔다(Envoy Gateway는 정규식을 앞부분 매치보다 앞에 둔다, docs/infra.md §4.1 '호스트와 내부 경로'). 이 라우트에도 공통 Lua가 돌아 접근 로그에 위조 끝단 머리가 남지 않는다(리뷰 RV-01)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gw-ops-not-found
  namespace: envoy-gateway-system
spec:
  parentRefs:
    - name: gw-ops
      sectionName: ops-api
  hostnames:
    - ops-api.peaket.example
  rules:
    - matches:
        - path:
            type: RegularExpression
            value: /.*
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-peaket-app
                value: console
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: peaket-not-found
---
