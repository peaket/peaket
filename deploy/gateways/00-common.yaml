# 게이트웨이 다섯이 함께 쓰는 것: GatewayClass·EnvoyProxy·공통 Lua·TRACE 직접 응답·ReferenceGrant(BUILD_ORDER HOT-400, 묶음 BAT-055). 정본: docs/infra.md §4.1 'Envoy 게이트웨이의 첫 구현'·§9 '응답 보안 헤더', docs/architecture.md §4 'CSRF 확인 규칙',
# docs/features/identity.md §3 '발급자와 검증 규칙', docs/security/authz-matrix.md §5.1, docs/observability.md §6 '신뢰 경계의 추적 문맥'.
# Envoy Gateway v1.10.0의 API(gateway.envoyproxy.io/v1alpha1)와 Gateway API v1로 쓴다. 값은 정본 값 그대로이고 바꾸면 정본을 먼저 고친다.
# EnvoyProxy 둘의 일꾼 수·CPU 요청은 docs/infra.md §4.1 '프록시 일꾼 수와 파드 CPU'(ADR-0287, 묶음 BAT-058): 일꾼 수 = CPU 요청 2 [가정], 한도 없음.
# 정적 시험: node --test "deploy/gateways/test/*.test.mjs"
---
# 게이트웨이 다섯이 함께 쓰는 GatewayClass. 프록시 설정은 EnvoyProxy peaket-proxy(docs/infra.md §4.1 'Envoy 게이트웨이의 첫 구현')
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: peaket
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: peaket-proxy
    namespace: envoy-gateway-system
---
# 프록시 공통: 접근 로그 JSON 한 줄(docs/infra.md §4.1 '접근 로그', §9 '접근 로그의 복귀 경로 쿼리'), 추적(표본 100%, 새 trace), 원본 확인 값 환경 값.
# - 경로 칸은 쿼리를 뗀 %REQ_WITHOUT_QUERY(:PATH)%다. Envoy Gateway v1.10은 이 명령을 보면 envoy.formatter.req_without_query를 스스로 더한다(internal/xds/translator/accesslog.go).
# - 조사 칸 ja4·asn·edgeBotLabels는 Lua가 원본 확인 뒤에 남긴 값이다(위조 머리는 지워져 비는 칸, docs/features/bot-defense.md §3.3). 토큰의 jny는 입장 토큰 확인(BAT-057)과 함께 싣는다.
# - 원본 확인 값(docs/security/secrets-and-keys.md 'CloudFront 원본 확인 헤더 값', 교체 중 두 값)은 Secret peaket-origin-verify에서 받는다. 저장소에는 값이 없다.
#   Lua 검증(Strict)이 os.getenv로 읽는 이름을 allowedEnvVars에 적는다.
# - 입장 토큰 공개키 목록(docs/infra.md §4.1 '입장 토큰 확인', ADR-0288 결정 5)은 ConfigMap peaket-admission-jwks의 jwks를 PEAKET_ADMISSION_JWKS로 받는다.
#   optional: true라 ConfigMap이 없어도 프록시는 뜨고(그때 입장 토큰은 모두 거절), 값은 배포 때 queue-svc 묶음과 같게 넣는다(저장소에는 값이 없다).
#   이 값을 쓰는 라우트는 gw-fan-buy뿐이다. gw-queue의 peaket-proxy-queue는 값을 받지 않고, 같은 공통 Lua를 검증하므로 allowedEnvVars에만 이름을 둔다.
# - 일꾼(요청을 처리하는 작업 스레드) 수 concurrency는 envoy 컨테이너 CPU 요청과 같은 2 [가정]이다. 정하지 않으면 노드 CPU 수만큼 생긴다
#   (docs/infra.md §4.1 '프록시 일꾼 수와 파드 CPU', ADR-0287 결정 1~3). extraArgs로 --concurrency·--cpuset-threads를 겹쳐 걸지 않는다.
#   resources를 적으면 Envoy Gateway 기본 요청이 통째로 바뀌므로 메모리 요청 512Mi(기본값)를 다시 적고, CPU·메모리 한도는 두지 않는다.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: peaket-proxy
  namespace: envoy-gateway-system
spec:
  concurrency: 2
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        container:
          env:
            - name: PEAKET_ORIGIN_VERIFY
              valueFrom:
                secretKeyRef:
                  name: peaket-origin-verify
                  key: current
                  optional: true
            - name: PEAKET_ORIGIN_VERIFY_PREVIOUS
              valueFrom:
                secretKeyRef:
                  name: peaket-origin-verify
                  key: previous
                  optional: true
            - name: PEAKET_ADMISSION_JWKS
              valueFrom:
                configMapKeyRef:
                  name: peaket-admission-jwks
                  key: jwks
                  optional: true
            # gw-ops 허용 IP(IPv4 CIDR, 쉼표로 이음). ConfigMap이 없거나 값이 비면 공통 Lua가 모두 거절한다(닫힌 쪽, ADR-0321 결정 3)
            - name: PEAKET_OPS_ALLOWED_IPS
              valueFrom:
                configMapKeyRef:
                  name: peaket-ops-allow
                  key: cidrs
                  optional: true
          resources:
            requests:
              cpu: "2"
              memory: 512Mi
  lua:
    validationType: Strict
    strictValidation:
      allowedEnvVars:
        - PEAKET_ORIGIN_VERIFY
        - PEAKET_ORIGIN_VERIFY_PREVIOUS
        - PEAKET_ADMISSION_JWKS
        - PEAKET_OPS_ALLOWED_IPS
  filterOrder:
    - name: envoy.filters.http.lua
      before: envoy.filters.http.cors
  telemetry:
    accessLog:
      settings:
        - format:
            type: JSON
            json:
              time: "%START_TIME(%Y-%m-%dT%H:%M:%S.%3fZ)%"
              method: "%REQ(:METHOD)%"
              path: "%REQ_WITHOUT_QUERY(:PATH)%"
              host: "%REQ(:AUTHORITY)%"
              status: "%RESPONSE_CODE%"
              durationMs: "%DURATION%"
              clientIp: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
              app: "%REQ(x-peaket-app)%"
              ja4: "%REQ(cloudfront-viewer-ja4-fingerprint)%"
              asn: "%REQ(cloudfront-viewer-asn)%"
              edgeBotLabels: "%REQ(x-amzn-waf-bot-labels)%"
              sub: "%REQ(x-user-id)%"
              pid: "%REQ(x-user-pid)%"
              traceId: "%TRACE_ID%"
          sinks:
            - type: File
              file:
                path: /dev/stdout
    tracing:
      samplingRate: 100
      provider:
        type: OpenTelemetry
        backendRefs:
          - name: otel-gateway-collector
            namespace: otel
            port: 4317
---
# gw-queue 프록시: 공통 peaket-proxy와 같고 추적만 다르다(docs/infra.md §4.1 추적 표본과 속성, ADR-0125 결정 1, 웨이브 끝 리뷰 W7-COR-02).
# - 진입 경로는 꼬리 표본에서 빼므로 trace를 시작할 때 1/1000만 고르고, 고른 trace에 고정 태그 peaket.sample.mode=head를 단다(docs/observability.md §6).
# - 일꾼 수·CPU 요청·한도 없음은 peaket-proxy와 같다(docs/infra.md §4.1 '프록시 일꾼 수와 파드 CPU', ADR-0287).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: peaket-proxy-queue
  namespace: envoy-gateway-system
spec:
  concurrency: 2
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        container:
          env:
            - name: PEAKET_ORIGIN_VERIFY
              valueFrom:
                secretKeyRef:
                  name: peaket-origin-verify
                  key: current
                  optional: true
            - name: PEAKET_ORIGIN_VERIFY_PREVIOUS
              valueFrom:
                secretKeyRef:
                  name: peaket-origin-verify
                  key: previous
                  optional: true
          resources:
            requests:
              cpu: "2"
              memory: 512Mi
  lua:
    validationType: Strict
    strictValidation:
      allowedEnvVars:
        - PEAKET_ORIGIN_VERIFY
        - PEAKET_ORIGIN_VERIFY_PREVIOUS
        - PEAKET_ADMISSION_JWKS
        - PEAKET_OPS_ALLOWED_IPS
  filterOrder:
    - name: envoy.filters.http.lua
      before: envoy.filters.http.cors
  telemetry:
    accessLog:
      settings:
        - format:
            type: JSON
            json:
              time: "%START_TIME(%Y-%m-%dT%H:%M:%S.%3fZ)%"
              method: "%REQ(:METHOD)%"
              path: "%REQ_WITHOUT_QUERY(:PATH)%"
              host: "%REQ(:AUTHORITY)%"
              status: "%RESPONSE_CODE%"
              durationMs: "%DURATION%"
              clientIp: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
              app: "%REQ(x-peaket-app)%"
              ja4: "%REQ(cloudfront-viewer-ja4-fingerprint)%"
              asn: "%REQ(cloudfront-viewer-asn)%"
              edgeBotLabels: "%REQ(x-amzn-waf-bot-labels)%"
              sub: "%REQ(x-user-id)%"
              pid: "%REQ(x-user-pid)%"
              traceId: "%TRACE_ID%"
          sinks:
            - type: File
              file:
                path: /dev/stdout
    tracing:
      provider:
        type: OpenTelemetry
        backendRefs:
          - name: otel-gateway-collector
            namespace: otel
            port: 4317
      samplingFraction:
        numerator: 1
        denominator: 1000
      customTags:
        peaket.sample.mode:
          type: Literal
          literal:
            value: head
---
# 공통 Lua(EnvoyExtensionPolicy <게이트웨이>-edge가 filterContext로 게이트웨이마다 설정을 준다)
apiVersion: v1
kind: ConfigMap
metadata:
  name: peaket-gateway-edge-lua
  namespace: envoy-gateway-system
data:
  lua: |
    -- 게이트웨이 공통 Lua(docs/infra.md §4.1 'Envoy 게이트웨이의 첫 구현', BUILD_ORDER HOT-400).
    -- 필터 차례의 맨 앞(교차 출처·출처 확인·JWT 확인보다 앞)에서 돈다(EnvoyProxy filterOrder, 리뷰 RV-01, docs/infra.md §4.1 '접근 로그').
    -- 1. 원본 확인(docs/infra.md §4.1 '원본 확인 머리'): x-peaket-origin-verify를 프록시 환경 값 PEAKET_ORIGIN_VERIFY(교체 중에는
    --    PEAKET_ORIGIN_VERIFY_PREVIOUS도)와 견준다. 맞지 않거나 없으면, 또 CloudFront를 거치지 않는 게이트웨이(originVerify 거짓)는 늘
    --    끝단 신호 머리(cloudfront-viewer-로 시작하는 머리, x-amzn-waf-로 시작하는 머리, x-peaket-arrival)를 지운다. gw-ops처럼
    --    requireOriginVerify가 참인 게이트웨이는 맞지 않으면 403이고 백엔드에 닿지 않는다(ADR-0321 결정 2). 맞든 틀리든 원본 확인 머리
    --    자체는 지운 뒤 안쪽으로 넘긴다. /internal/ 404가 이 거절보다 먼저다(기존 차례).
    --    gw-ops의 허용 IP(opsAllowedIpsEnv, ADR-0321 결정 3): 원본 확인이 맞은 요청만 CloudFront-Viewer-Address(IPv4, IP:port)를
    --    프록시 환경 값 PEAKET_OPS_ALLOWED_IPS(쉼표로 이은 IPv4 CIDR, 최대 32개)와 견준다. 값이 없거나 형식이 틀리면 모두 거절한다.
    --    IPv6 주소는 이 묶음에서 거절한다(다음 묶음). 거절은 gateway_ops_ip_denied_{missing|malformed|not_allowed} 지표와
    --    가린 출발지(/24) 로그로 남긴다.
    -- 2. 토큰 유형(docs/features/identity.md §3 '발급자와 검증 규칙', I-T36): Envoy의 JWT 확인은 typ을 보지 않는다. 토큰을 요구하는 라우트
    --    (checkTyp 참)에서는 JWT 확인보다 먼저, Envoy JWT 필터가 꺼낼 수 있는 자리의 토큰(Authorization 값마다, Cookie 머리마다)을 모두 꺼내
    --    꼴이 어긋나거나 typ이 액세스 토큰 값(at+jwt)이 아니면 401이다(닫힌 쪽으로 실패, 웨이브 끝 리뷰 W7-SEC-01·W7-CON-01).
    -- 2.5 관리 리프레시 쿠키 깊은 방어(docs/features/identity.md §3 쿠키 표, I-T46 ⑤, ADR-0321 결정 1): refreshCookie가 있는 게이트웨이는
    --    refreshPath(갱신 경로)의 POST가 아닌 모든 요청에서 그 쿠키를 Cookie 머리에서 지운다. Cookie 머리가 여럿이거나 값이 큰따옴표로
    --    묶여 있어도, 이름 앞뒤에 빈칸이 있어도 지운다. 다른 쿠키는 그대로 둔다.
    -- 3. 내부 경로(docs/infra.md §4.1 '호스트와 내부 경로'): /internal/로 시작하는 경로는 어느 라우트든 1 다음에 404로 바로 답한다. 라우트는 /internal/을 내지 않지만
    --    앱 서버로 / 전체를 넘기는 라우트(www·partner)는 경로가 남으므로, 그 앞에서 막는다(대소문자를 가리지 않고 견준다).
    -- 4. 입장 토큰(docs/infra.md §4.1 '입장 토큰 확인', ADR-0288 결정 4~6, 묶음 BAT-057): admission이 참인 라우트(gw-fan-buy)에서 사전 요청(OPTIONS)을 뺀
    --    요청마다 X-Admission-Token을 JWT 확인보다 앞에서 차례 ①~⑨로 본다. ①~⑧에 걸리면 401 admission-token-invalid, ⑨(주소의 회차)는 403이다.
    --    키 목록은 프록시 환경 값 PEAKET_ADMISSION_JWKS(ConfigMap peaket-admission-jwks)다. 없거나 읽지 못하거나 쓸 키가 없거나 확인 중 오류가 나면
    --    모두 거절한다(닫힌 쪽. Envoy는 Lua 오류를 만나면 요청을 그대로 넘기므로 확인 전체를 pcall로 감싼다).
    -- 5. 거절 응답의 교차 출처 머리(ADR-0288 결정 6): corsOrigin을 받은 라우트에서 요청 Origin이 그 값 하나와 같으면 Lua가 낸 401·403에 교차 출처 머리 셋
    --    (Allow-Origin·Allow-Credentials·Expose-Headers)을 단다. Vary: Origin은 달지 않는다: 401에는 gw-fan lateResponseHeaders가 덧붙이고(Lua도 달면 겹친다),
    --    403은 응답 고치기가 머리를 새로 쓰므로 gw-fan-responses의 www 출처 403 고치기가 넷을 고정 값으로 다시 단다(BAT-057 리뷰 반영 R057-1·R057-5).
    -- 설정(filterContext): originVerify(참이면 1의 견주기를 한다), requireOriginVerify(참이면 1의 견주기가 틀릴 때 403),
    -- checkTyp(참이면 2를 한다, 토큰을 요구하는 라우트), tokenCookie(액세스 쿠키 이름, 없으면 ""), tokenScheme(Authorization 앞말),
    -- opsAllowedIpsEnv(gw-ops 허용 IP 환경 값 이름, 없으면 검사하지 않는다), refreshCookie(지울 리프레시 쿠키 이름, 없으면 ""),
    -- refreshPath(그 쿠키를 넘기는 유일한 갱신 경로), csrfOrigin(CSRF를 볼 화면 출처, 없으면 보지 않는다),
    -- admission(참이면 4를 한다), admissionIssuer(입장 토큰 발급자 iss), corsOrigin(5의 화면 출처)

    local ORIGIN_VERIFY = "x-peaket-origin-verify"
    local EDGE_PREFIXES = { "cloudfront-viewer-", "x-amzn-waf-" }
    local EDGE_HEADERS = { ["x-peaket-arrival"] = true }
    local ACCESS_TYP = "at+jwt"
    local UNAUTHORIZED = '{"type":"about:blank","title":"Unauthorized","status":401}'

    -- 길이가 같으면 끝까지 견준다(앞에서 틀린 자리로 값을 짐작하지 못하게)
    local function same(a, b)
      if a == nil or b == nil or #b == 0 or #a ~= #b then return false end
      local diff = 0
      for i = 1, #a do
        if string.byte(a, i) ~= string.byte(b, i) then diff = diff + 1 end
      end
      return diff == 0
    end

    local function origin_ok(value)
      if value == nil or value == "" then return false end
      return same(value, os.getenv("PEAKET_ORIGIN_VERIFY")) or same(value, os.getenv("PEAKET_ORIGIN_VERIFY_PREVIOUS"))
    end

    local function is_edge(name)
      local n = string.lower(name)
      if EDGE_HEADERS[n] then return true end
      for _, p in ipairs(EDGE_PREFIXES) do
        if string.sub(n, 1, #p) == p then return true end
      end
      return false
    end

    local function strip_edge(headers)
      local drop = {}
      for name, _ in pairs(headers) do
        if is_edge(name) then drop[#drop + 1] = name end
      end
      for _, name in ipairs(drop) do headers:remove(name) end
    end

    local B64 = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_"
    local B64_INDEX = {}
    for i = 1, #B64 do B64_INDEX[string.sub(B64, i, i)] = i - 1 end

    -- base64url(채움 없음)을 푼다. 꼴이 아니면 nil
    local function b64url_decode(s)
      local out, bits, nbits = {}, 0, 0
      for i = 1, #s do
        local v = B64_INDEX[string.sub(s, i, i)]
        if v == nil then return nil end
        bits = bits * 64 + v
        nbits = nbits + 6
        if nbits >= 8 then
          nbits = nbits - 8
          local byte = math.floor(bits / 2 ^ nbits)
          out[#out + 1] = string.char(byte)
          bits = bits - byte * 2 ^ nbits
        end
      end
      return table.concat(out)
    end

    -- JWT 꼴: base64url 마디 셋을 점으로 이은 것(빈 마디 없음)
    local JWT_FORM = "^[%w%-_]+%.[%w%-_]+%.[%w%-_]+$"

    -- 토큰 머리(첫 마디)의 JSON 글. 풀지 못하면 nil
    local function header_of(token)
      local dot = string.find(token, ".", 1, true)
      if dot == nil then return nil end
      local json = b64url_decode(string.sub(token, 1, dot - 1))
      if json == nil or string.sub(json, 1, 1) ~= "{" then return nil end
      return json
    end

    -- 머리 JSON의 typ(소문자). 없으면 nil
    local function typ_in(json)
      local typ = string.match(json, '"typ"%s*:%s*"([^"]*)"')
      return typ and string.lower(typ) or nil
    end

    -- 앞뒤 빈칸(빈칸·탭)을 뗀다. 패턴 없이 글자를 하나씩 본다(되짚기 없음, 웨이브 끝 리뷰 W7-CON-01)
    local function trim(s)
      local i, j = 1, #s
      while i <= j do
        local b = string.byte(s, i)
        if b ~= 32 and b ~= 9 then break end
        i = i + 1
      end
      while j >= i do
        local b = string.byte(s, j)
        if b ~= 32 and b ~= 9 then break end
        j = j - 1
      end
      return string.sub(s, i, j)
    end

    -- 같은 이름 머리의 값 전부(머리가 여럿이면 하나씩)
    local function values_of(headers, name)
      local out = {}
      local ok, n = pcall(function() return headers:getNumValues(name) end)
      if ok and type(n) == "number" and n > 0 then
        for i = 0, n - 1 do
          local v = headers:getAtIndex(name, i)
          if v ~= nil then out[#out + 1] = v end
        end
      else
        local v = headers:get(name)
        if v ~= nil then out[#out + 1] = v end
      end
      return out
    end

    -- 설정 값 하나(filterContext는 표가 아니라 get으로 읽는 값이다, 2026-11-16 kind 확인)
    local function setting(ctx, key)
      if ctx == nil then return nil end
      local ok, v = pcall(function() return ctx:get(key) end)
      if ok then return v end
      return nil
    end

    -- IPv4 주소(점 넷, 0~255)를 정수로. 꼴이 아니면 nil
    local function ipv4_of(s)
      if type(s) ~= "string" then return nil end
      local a, b, c, d = string.match(s, "^(%d+)%.(%d+)%.(%d+)%.(%d+)$")
      if a == nil then return nil end
      local n = {}
      for _, v in ipairs({ a, b, c, d }) do
        if #v > 3 or (#v > 1 and string.sub(v, 1, 1) == "0") then return nil end
        local x = tonumber(v)
        if x == nil or x > 255 then return nil end
        n[#n + 1] = x
      end
      return ((n[1] * 256 + n[2]) * 256 + n[3]) * 256 + n[4]
    end

    -- IPv4 CIDR(a.b.c.d/n)을 {net=정수, bits=n}으로. 꼴이 아니면 nil
    local function cidr_of(s)
      local addr, bits = string.match(s or "", "^([^/]+)/(%d+)$")
      if addr == nil or #bits > 2 then return nil end
      local net = ipv4_of(addr)
      local n = tonumber(bits)
      if net == nil or n == nil or n > 32 then return nil end
      return { net = net, bits = n }
    end

    -- 그 주소가 CIDR 안인가
    local function in_cidr(ip, cidr)
      if cidr.bits == 0 then return true end
      local size = 2 ^ (32 - cidr.bits)
      return math.floor(ip / size) == math.floor(cidr.net / size)
    end

    -- 환경 값의 IPv4 CIDR 목록(쉼표로 이음, 최대 32개). 값이 없거나 하나라도 틀리면 nil(모두 거절)
    local function cidrs_of(envName)
      local raw = os.getenv(envName)
      if type(raw) ~= "string" then return nil end
      raw = trim(raw)
      if raw == "" then return nil end
      local out = {}
      local pos = 1
      while pos <= #raw + 1 do
        local comma = string.find(raw, ",", pos, true)
        local seg = trim(string.sub(raw, pos, (comma or (#raw + 1)) - 1))
        if seg == "" then return nil end
        local c = cidr_of(seg)
        if c == nil then return nil end
        out[#out + 1] = c
        if #out > 32 then return nil end
        if comma == nil then break end
        pos = comma + 1
      end
      if #out == 0 then return nil end
      return out
    end

    -- 거절 지표(Envoy 지표 이름에는 라벨을 쓸 수 없어 사유마다 하나씩 센다)와 가린 출발지(/24) 로그
    local function ops_ip_denied(handle, reason, ip)
      pcall(function()
        local m = "gateway_ops_ip_denied_" .. reason
        handle:defineMetric(m, 0)
        handle:incrementMetric(m, 1)
        -- 계획 §B9의 이름(라벨 대신 사유별 이름과 합계를 함께 센다)
        handle:defineMetric("gateway_ops_ip_denied_total", 0)
        handle:incrementMetric("gateway_ops_ip_denied_total", 1)
      end)
      if ip ~= nil then
        local masked = string.format("%d.%d.%d.0/24", math.floor(ip / 16777216), math.floor(ip / 65536) % 256, math.floor(ip / 256) % 256)
        pcall(function() handle:logInfo("peaket ops ip denied reason=" .. reason .. " source=" .. masked) end)
      else
        pcall(function() handle:logInfo("peaket ops ip denied reason=" .. reason) end)
      end
    end

    -- CloudFront-Viewer-Address(IPv4, IP 또는 IP:port)를 꺼낸다. 없거나 여럿이거나 꼴이 아니면 (nil, 사유)
    local function viewer_ip(headers)
      local vals = values_of(headers, "cloudfront-viewer-address")
      if #vals == 0 then return nil, "missing" end
      if #vals ~= 1 then return nil, "malformed" end
      local v = trim(vals[1])
      local addr, port = string.match(v, "^([^:]+):(%d+)$")
      if addr ~= nil then
        if #port > 5 or tonumber(port) == nil or tonumber(port) > 65535 then return nil, "malformed" end
        v = addr
      elseif string.find(v, ":", 1, true) ~= nil then
        -- IPv6(이 묶음은 받지 않는다) 또는 꼴이 틀린 값
        return nil, "malformed"
      end
      local ip = ipv4_of(v)
      if ip == nil then return nil, "malformed" end
      return ip, nil
    end

    -- gw-ops 허용 IP: 통과면 nil, 거절이면 사유. 환경 값이 없거나 하나라도 틀리면 모두 거절한다(닫힌 쪽)
    local function ops_ip_check(handle, headers, envName)
      local ip, why = viewer_ip(headers)
      if ip == nil then
        ops_ip_denied(handle, why or "malformed", nil)
        return why or "malformed"
      end
      local cidrs = cidrs_of(envName)
      if cidrs == nil then
        ops_ip_denied(handle, "missing", ip)
        return "missing"
      end
      for _, c in ipairs(cidrs) do
        if in_cidr(ip, c) then return nil end
      end
      ops_ip_denied(handle, "not_allowed", ip)
      return "not_allowed"
    end

    -- 2.5 리프레시 쿠키 다시 쓰기: 갱신 경로의 POST가 아니면 refreshCookie를 Cookie 머리에서 지운다.
    -- 머리가 여럿이면 남은 쿠키를 하나로 이어 다시 넣고, 남은 것이 없으면 Cookie 머리를 지운다(ADR-0321 결정 1).
    local function rewrite_cookies(headers, ctx)
      local name = setting(ctx, "refreshCookie")
      if type(name) ~= "string" or name == "" then return end
      local path = setting(ctx, "refreshPath")
      local p = string.match(headers:get(":path") or "", "^[^?#]*") or ""
      local method = headers:get(":method")
      if method == "POST" and type(path) == "string" and path ~= "" and p == path then return end
      local kept = {}
      for _, header in ipairs(values_of(headers, "cookie")) do
        local pos = 1
        while pos <= #header + 1 do
          local semi = string.find(header, ";", pos, true)
          local seg = string.sub(header, pos, (semi or (#header + 1)) - 1)
          local eq = string.find(seg, "=", 1, true)
          local n = eq and trim(string.sub(seg, 1, eq - 1)) or ""
          if eq == nil or n ~= name then
            local t = trim(seg)
            if t ~= "" then kept[#kept + 1] = t end
          end
          if semi == nil then break end
          pos = semi + 1
        end
      end
      headers:remove("cookie")
      if #kept > 0 then headers:add("cookie", table.concat(kept, "; ")) end
    end

    --[[ Envoy JWT 필터가 꺼낼 수 있는 자리의 토큰을 모두 꺼낸다(docs/infra.md §4.1 '토큰 확인과 인가', 웨이브 끝 리뷰 W7-SEC-01).
      Envoy는 접두어를 값의 어디에서나 찾고, 같은 이름 머리와 Cookie 머리 여럿을 모두 읽고, 쿠키 값의 큰따옴표를 벗긴다.
      그래서 닫힌 쪽으로 실패한다: 꼴이 어긋나면 nil(거절)을 돌려준다.
      ① Authorization 값마다 접두어(대소문자 무시)가 들어 있으면 값 전체가 정확히 '접두어 + JWT 꼴'이어야 한다
      ② Cookie 머리마다 그 이름의 값마다 앞뒤 빈칸과 큰따옴표를 벗겨 JWT 꼴이어야 한다. 나누기는 평문 찾기만 쓴다 ]]
    local function tokens_of(headers, ctx)
      local out = {}
      local scheme = (setting(ctx, "tokenScheme") or "Bearer") .. " "
      local lscheme = string.lower(scheme)
      for _, v in ipairs(values_of(headers, "authorization")) do
        if string.find(string.lower(v), lscheme, 1, true) ~= nil then
          if string.sub(v, 1, #scheme) ~= scheme then return nil end
          local t = string.sub(v, #scheme + 1)
          if string.find(t, JWT_FORM) == nil then return nil end
          out[#out + 1] = t
        end
      end
      local name = setting(ctx, "tokenCookie")
      if name ~= nil and name ~= "" then
        for _, header in ipairs(values_of(headers, "cookie")) do
          local pos = 1
          while pos <= #header + 1 do
            local semi = string.find(header, ";", pos, true)
            local seg = string.sub(header, pos, (semi or (#header + 1)) - 1)
            local eq = string.find(seg, "=", 1, true)
            if eq ~= nil and trim(string.sub(seg, 1, eq - 1)) == name then
              local val = trim(string.sub(seg, eq + 1))
              if #val >= 2 and string.sub(val, 1, 1) == '"' and string.sub(val, -1) == '"' then val = string.sub(val, 2, -2) end
              if string.find(val, JWT_FORM) == nil then return nil end
              out[#out + 1] = val
            end
            if semi == nil then break end
            pos = semi + 1
          end
        end
      end
      return out
    end

    local NOT_FOUND = '{"type":"about:blank","title":"Not Found","status":404}'

    -- 쿼리를 뗀 경로가 /internal이거나 /internal/로 시작하는가
    local function is_internal(path)
      if path == nil then return false end
      local p = string.lower(string.match(path, "^[^?#]*") or path)
      return p == "/internal" or string.sub(p, 1, 10) == "/internal/"
    end

    -- Lua가 직접 낸 응답에도 응답 보안 머리를 단다(docs/infra.md §9 '응답 보안 헤더', 웨이브 끝 리뷰 W7-SEC-04. 게이트웨이의 lateResponseHeaders가
    -- 이 응답에 닿는지 kind에서 보기 전에도 빠지지 않게 같은 값을 직접 싣는다)
    local function direct_headers(status, extra)
      local h = {
        [":status"] = status,
        ["content-type"] = "application/problem+json",
        ["strict-transport-security"] = "max-age=31536000; includeSubDomains",
        ["x-content-type-options"] = "nosniff",
        ["content-security-policy"] = "default-src 'none'; frame-ancestors 'none'",
      }
      for k, v in pairs(extra or {}) do h[k] = v end
      return h
    end

    -- 5. Lua가 낸 거절에 다는 교차 출처 머리. corsOrigin이 있고 요청 Origin이 정확히 하나이며 그 값과 같을 때만(허용 밖 출처에는 달지 않는다)
    local function cors_headers(headers, ctx)
      local allowed = setting(ctx, "corsOrigin")
      if type(allowed) ~= "string" or allowed == "" then return {} end
      local origins = values_of(headers, "origin")
      if #origins ~= 1 or origins[1] ~= allowed then return {} end
      return {
        ["access-control-allow-origin"] = allowed,
        ["access-control-allow-credentials"] = "true",
        ["access-control-expose-headers"] = "WWW-Authenticate",
      }
    end

    -- 1.5 CSRF Origin 글자 그대로 확인(docs/architecture.md §4, BAT-045 리뷰 W-02): Envoy csrf 필터는 Origin의 끝 슬래시를
    --    떼고 견주어 `https://console.peaket.example/`을 같은 출처로 받는다(2026-11-20 kind 확인). 그래서 csrfOrigin을 받은
    --    게이트웨이는 위험한 메서드(POST·PUT·PATCH·DELETE)에 Origin이 있으면 값이 정확히 하나이고 그 출처와 글자 그대로 같아야 한다.
    --    Origin이 없으면 통과한다(브라우저 밖 클라이언트). 빈 값·여럿·끝 슬래시·다른 출처는 403이고 백엔드에 닿지 않는다.
    local function csrf_origin_denied(handle, headers, ctx)
      local allowed = setting(ctx, "csrfOrigin")
      if type(allowed) ~= "string" or allowed == "" then return false end
      local method = headers:get(":method")
      if method ~= "POST" and method ~= "PUT" and method ~= "PATCH" and method ~= "DELETE" then return false end
      local origins = values_of(headers, "origin")
      if #origins == 0 then return false end
      if #origins ~= 1 then return true end
      return origins[1] ~= allowed
    end

    local function reject(handle, headers, ctx)
      local extra = cors_headers(headers, ctx)
      extra["www-authenticate"] = 'Bearer error="invalid_token"'
      handle:respond(direct_headers("401", extra), UNAUTHORIZED)
    end

    -- 4. 입장 토큰 확인(docs/infra.md §4.1 '입장 토큰 확인', ADR-0288 결정 4·5)
    local ADMISSION_HEADER = "x-admission-token"
    local ADMISSION_ENV = "PEAKET_ADMISSION_JWKS"
    local ADMISSION_TYP = "admission+jwt"
    local ADMISSION_AUD = "purchase"
    local ADMISSION_MAX = 2048
    local ADMISSION_INVALID = '{"type":"https://peaket.example/problems/admission-token-invalid","title":"입장 확인이 끝났습니다","status":401}'
    local FORBIDDEN = '{"type":"about:blank","title":"Forbidden","status":403}'
    local EVENTS_PREFIX = "/v1/events/"
    -- P-256 공개키의 SubjectPublicKeyInfo DER 앞부분(SEQUENCE{ SEQUENCE{ id-ecPublicKey, prime256v1 }, BIT STRING 04 ‖ x ‖ y })
    local P256_SPKI = string.char(0x30, 0x59, 0x30, 0x13, 0x06, 0x07, 0x2A, 0x86, 0x48, 0xCE, 0x3D, 0x02, 0x01, 0x06, 0x08, 0x2A, 0x86, 0x48, 0xCE, 0x3D, 0x03, 0x01, 0x07, 0x03, 0x42, 0x00, 0x04)

    -- base64url(채움 없음)을 엄격하게 푼다: 길이를 4로 나눈 나머지가 1이거나 남는 비트가 0이 아니면 nil(같은 값의 다른 글이 통하지 않게)
    local function b64url_strict(s)
      if #s % 4 == 1 then return nil end
      local out, bits, nbits = {}, 0, 0
      for i = 1, #s do
        local v = B64_INDEX[string.sub(s, i, i)]
        if v == nil then return nil end
        bits = bits * 64 + v
        nbits = nbits + 6
        if nbits >= 8 then
          nbits = nbits - 8
          local byte = math.floor(bits / 2 ^ nbits)
          out[#out + 1] = string.char(byte)
          bits = bits - byte * 2 ^ nbits
        end
      end
      if bits ~= 0 then return nil end
      return table.concat(out)
    end

    --[[ 작은 JSON 읽개(RFC 8259의 객체·배열·문자열·수·true·false·null). 틀리면 nil.
      객체는 [OBJ], 배열은 [ARR], 수는 [NUM] 표시가 있는 표이고 null은 NULL이다(JSON 글로는 문자열이 아닌 열쇠를 만들 수 없어 꾸밀 수 없다).
      수는 value(값)와 integer(소수점·지수 없는 15자리 이하 정수인가)를 든다. 같은 이름의 칸이 두 번 나오거나, 깊이가 8을 넘거나,
      값 뒤에 글이 남거나, \u 이스케이프가 서로게이트면 틀린 것으로 본다. 글자를 하나씩 보고 되짚기 패턴을 쓰지 않는다 ]]
    local OBJ, ARR, NUM, NULL = {}, {}, {}, {}
    local JSON_ESCAPES = { [34] = '"', [92] = "\\", [47] = "/", [98] = "\b", [102] = "\f", [110] = "\n", [114] = "\r", [116] = "\t" }

    local function utf8_of(cp)
      if cp < 0x80 then return string.char(cp) end
      if cp < 0x800 then return string.char(0xC0 + math.floor(cp / 0x40), 0x80 + cp % 0x40) end
      return string.char(0xE0 + math.floor(cp / 0x1000), 0x80 + math.floor(cp / 0x40) % 0x40, 0x80 + cp % 0x40)
    end

    local function json_decode(s)
      local pos, n = 1, #s
      local function skip()
        while pos <= n do
          local b = string.byte(s, pos)
          if b ~= 32 and b ~= 9 and b ~= 10 and b ~= 13 then return end
          pos = pos + 1
        end
      end
      local function str()
        pos = pos + 1
        local out = {}
        while pos <= n do
          local b = string.byte(s, pos)
          if b == 34 then
            pos = pos + 1
            return table.concat(out)
          elseif b < 32 then
            return nil
          elseif b == 92 then
            local e = string.byte(s, pos + 1)
            if e == 117 then
              local hex = string.sub(s, pos + 2, pos + 5)
              if #hex ~= 4 or string.find(hex, "[^%x]") ~= nil then return nil end
              local cp = tonumber(hex, 16)
              if cp >= 0xD800 and cp <= 0xDFFF then return nil end
              out[#out + 1] = utf8_of(cp)
              pos = pos + 6
            elseif e ~= nil and JSON_ESCAPES[e] ~= nil then
              out[#out + 1] = JSON_ESCAPES[e]
              pos = pos + 2
            else
              return nil
            end
          else
            local stop = pos
            while stop <= n do
              local c = string.byte(s, stop)
              if c == 34 or c == 92 or c < 32 then break end
              stop = stop + 1
            end
            out[#out + 1] = string.sub(s, pos, stop - 1)
            pos = stop
          end
        end
        return nil
      end
      local function digits()
        local start = pos
        while pos <= n do
          local c = string.byte(s, pos)
          if c < 48 or c > 57 then break end
          pos = pos + 1
        end
        return pos - start
      end
      local function num()
        local start = pos
        if string.byte(s, pos) == 45 then pos = pos + 1 end
        local int_start = pos
        local nd = digits()
        if nd == 0 or (nd > 1 and string.byte(s, int_start) == 48) then return nil end
        local integer = nd <= 15
        if string.byte(s, pos) == 46 then
          pos = pos + 1
          integer = false
          if digits() == 0 then return nil end
        end
        local c = string.byte(s, pos)
        if c == 101 or c == 69 then
          pos = pos + 1
          integer = false
          c = string.byte(s, pos)
          if c == 43 or c == 45 then pos = pos + 1 end
          if digits() == 0 then return nil end
        end
        local v = tonumber(string.sub(s, start, pos - 1))
        if v == nil then return nil end
        return { [NUM] = true, value = v, integer = integer }
      end
      local function word(w, v)
        if string.sub(s, pos, pos + #w - 1) ~= w then return nil end
        pos = pos + #w
        return v
      end
      local value
      value = function(depth)
        if depth > 8 then return nil end
        skip()
        local b = string.byte(s, pos)
        if b == 123 then
          pos = pos + 1
          local o = { [OBJ] = true }
          skip()
          if string.byte(s, pos) == 125 then
            pos = pos + 1
            return o
          end
          while true do
            skip()
            if string.byte(s, pos) ~= 34 then return nil end
            local k = str()
            if k == nil or o[k] ~= nil then return nil end
            skip()
            if string.byte(s, pos) ~= 58 then return nil end
            pos = pos + 1
            local v = value(depth + 1)
            if v == nil then return nil end
            o[k] = v
            skip()
            local c = string.byte(s, pos)
            pos = pos + 1
            if c == 125 then return o end
            if c ~= 44 then return nil end
          end
        elseif b == 91 then
          pos = pos + 1
          local a = { [ARR] = true }
          local count = 0
          skip()
          if string.byte(s, pos) == 93 then
            pos = pos + 1
            return a
          end
          while true do
            local v = value(depth + 1)
            if v == nil then return nil end
            count = count + 1
            a[count] = v
            skip()
            local c = string.byte(s, pos)
            pos = pos + 1
            if c == 93 then return a end
            if c ~= 44 then return nil end
          end
        elseif b == 34 then
          return str()
        elseif b == 116 then
          return word("true", true)
        elseif b == 102 then
          return word("false", false)
        elseif b == 110 then
          return word("null", NULL)
        elseif b ~= nil and (b == 45 or (b >= 48 and b <= 57)) then
          return num()
        end
        return nil
      end
      local v = value(1)
      if v == nil then return nil end
      skip()
      if pos <= n then return nil end
      return v
    end

    local function is_obj(v) return type(v) == "table" and v[OBJ] == true end
    local function int_of(v)
      if type(v) == "table" and v[NUM] == true and v.integer == true then return v.value end
      return nil
    end

    -- 원소 하나를 { der, until_s }로 바꾼다. P-256 공개 JWK가 아니거나(d가 있으면 아님) peaket_until이 정수가 아니면 nil
    local function admission_key(jwk)
      if not is_obj(jwk) or jwk.kty ~= "EC" or jwk.crv ~= "P-256" or jwk.d ~= nil then return nil end
      if jwk.alg ~= nil and jwk.alg ~= "ES256" then return nil end
      if jwk.use ~= nil and jwk.use ~= "sig" then return nil end
      if type(jwk.kid) ~= "string" or #jwk.kid > 64 or string.find(jwk.kid, "^[%w%._%-]+$") == nil then return nil end
      if type(jwk.x) ~= "string" or type(jwk.y) ~= "string" then return nil end
      local x, y = b64url_strict(jwk.x), b64url_strict(jwk.y)
      if x == nil or y == nil or #x ~= 32 or #y ~= 32 then return nil end
      local until_s = nil
      if jwk.peaket_until ~= nil then
        until_s = int_of(jwk.peaket_until)
        if until_s == nil then return nil end
      end
      return { der = P256_SPKI .. x .. y, until_s = until_s }
    end

    -- 키 목록을 kid → 원소 표로 읽는다. 일꾼(Lua 상태)마다 환경 값이 바뀌었을 때만 다시 읽는다(환경 값은 프록시가 시작할 때 정해진다).
    -- 틀린 원소·겹친 kid가 하나라도 있거나 키가 하나도 없으면 목록 전체를 쓰지 않는다(닫힌 쪽). 쓸 수 없는 동안 일꾼마다 60초에 한 번 경고 로그를 남긴다
    local admission_cache = { raw = false, keys = nil, problem = nil, warned_s = nil }

    local function admission_parse(raw)
      if raw == nil or raw == "" then return nil, "missing" end
      if #raw > 65536 then return nil, "too-large" end
      local doc = json_decode(raw)
      if not is_obj(doc) or type(doc.keys) ~= "table" or doc.keys[ARR] ~= true then return nil, "malformed" end
      local keys, count = {}, 0
      for _, jwk in ipairs(doc.keys) do
        local key = admission_key(jwk)
        if key == nil or keys[jwk.kid] ~= nil then return nil, "malformed" end
        keys[jwk.kid] = key
        count = count + 1
      end
      if count == 0 then return nil, "empty" end
      return keys, nil
    end

    local function admission_keys(handle, now_s)
      local raw = os.getenv(ADMISSION_ENV)
      if raw ~= admission_cache.raw then
        admission_cache.raw = raw
        admission_cache.keys, admission_cache.problem = admission_parse(raw)
        admission_cache.warned_s = nil
      end
      if admission_cache.keys == nil and (admission_cache.warned_s == nil or now_s - admission_cache.warned_s >= 60) then
        admission_cache.warned_s = now_s
        handle:logWarn("peaket admission jwks unusable: " .. tostring(admission_cache.problem) .. " (all admission tokens rejected)")
      end
      return admission_cache.keys
    end

    -- DER INTEGER 하나(앞의 0 바이트를 떼고, 맨 앞 비트가 1이면 0을 붙인다)
    local function der_int(b)
      local i = 1
      while i < #b and string.byte(b, i) == 0 do i = i + 1 end
      b = string.sub(b, i)
      if string.byte(b, 1) >= 0x80 then b = string.char(0) .. b end
      return string.char(0x02, #b) .. b
    end

    -- JWS ES256 서명(r‖s 64바이트)을 DER ECDSA-Sig-Value(SEQUENCE{ INTEGER r, INTEGER s })로
    local function der_signature(raw)
      local r, s = der_int(string.sub(raw, 1, 32)), der_int(string.sub(raw, 33, 64))
      return string.char(0x30, #r + #s) .. r .. s
    end

    -- 차례 ①~⑨. 통과면 nil, 아니면 401 또는 403
    local function admission_check(handle, headers, ctx)
      -- ① 값이 정확히 하나이고 2,048자 이하의 JWT 꼴
      local values = values_of(headers, ADMISSION_HEADER)
      if #values ~= 1 then return 401 end
      local jwt = values[1]
      if #jwt > ADMISSION_MAX or string.find(jwt, JWT_FORM) == nil then return 401 end
      local d1 = string.find(jwt, ".", 1, true)
      local d2 = string.find(jwt, ".", d1 + 1, true)
      local head_json = b64url_strict(string.sub(jwt, 1, d1 - 1))
      local head = head_json and json_decode(head_json)
      if not is_obj(head) then return 401 end
      -- ② alg ES256(머리의 jku·x5u·jwk·x5c는 읽지 않는다)
      if head.alg ~= "ES256" then return 401 end
      -- ③ kid가 키 목록에 있고 peaket_until이 있으면 지금(초) ≤ 그 값
      local now_s = math.floor(handle:timestamp() / 1000)
      local keys = admission_keys(handle, now_s)
      if keys == nil or type(head.kid) ~= "string" then return 401 end
      local key = keys[head.kid]
      if key == nil or (key.until_s ~= nil and now_s > key.until_s) then return 401 end
      -- ④ 서명(r‖s 64바이트를 DER로 바꿔 확인한다). Envoy v1.40은 가져온 공개키를 그 요청의 저장소에 두고 importPublicKey가 돌려준 객체의 get()을
      --    verifySignature에 넘긴다. 그 저장소는 요청이 끝나면 사라지고 한 요청에서 두 번째 importPublicKey는 첫 키를 돌려주므로,
      --    요청마다 쓸 키 하나만 가져온다(2026-11-19 같은 프록시 이미지에서 확인, docs/infra.md §4.1 '입장 토큰 확인')
      local sig = b64url_strict(string.sub(jwt, d2 + 1))
      if sig == nil or #sig ~= 64 then return 401 end
      local der = der_signature(sig)
      local signed = string.sub(jwt, 1, d2 - 1)
      local pub = handle:importPublicKey(key.der, #key.der):get()
      if type(pub) ~= "string" or pub == "" then return 401 end
      local ok = handle:verifySignature("sha256", pub, der, #der, signed, #signed)
      if ok ~= true then return 401 end
      -- ⑤ typ(글자 그대로)
      if head.typ ~= ADMISSION_TYP then return 401 end
      local body_json = b64url_strict(string.sub(jwt, d1 + 1, d2 - 1))
      local body = body_json and json_decode(body_json)
      if not is_obj(body) then return 401 end
      -- ⑥ iss
      local issuer = setting(ctx, "admissionIssuer")
      if type(issuer) ~= "string" or issuer == "" or body.iss ~= issuer then return 401 end
      -- ⑦ aud는 문자열 purchase(배열은 받지 않는다)
      if body.aud ~= ADMISSION_AUD then return 401 end
      -- ⑧ 정수 exp와 지금(초) < exp
      local exp = int_of(body.exp)
      if exp == nil or not (now_s < exp) then return 401 end
      -- ⑨ 주소가 /v1/events/{eventId}/로 시작하면 eventId = event(글자 그대로)
      local path = string.match(headers:get(":path") or "", "^[^?#]*") or ""
      if string.sub(path, 1, #EVENTS_PREFIX) == EVENTS_PREFIX then
        local slash = string.find(path, "/", #EVENTS_PREFIX + 1, true)
        if slash ~= nil and (type(body.event) ~= "string" or body.event ~= string.sub(path, #EVENTS_PREFIX + 1, slash - 1)) then return 403 end
      end
      return nil
    end

    local function admission_reject(handle, headers, ctx, status)
      local extra = cors_headers(headers, ctx)
      if status == 403 then return handle:respond(direct_headers("403", extra), FORBIDDEN) end
      extra["www-authenticate"] = 'Cookie realm="peaket"'
      return handle:respond(direct_headers("401", extra), ADMISSION_INVALID)
    end

    function envoy_on_request(handle)
      -- Envoy Gateway의 엄격 검증이 이 함수를 핸들이 아닌 값으로 한 번 부른다. 그때는 아무것도 하지 않는다.
      if type(handle) ~= "userdata" then return end
      local ok_ctx, ctx = pcall(function() return handle:filterContext() end)
      if not ok_ctx then return end
      local headers = handle:headers()
      -- 1을 가장 먼저 한다: 뒤의 어느 거절(404·401·403·사전 요청)이든 접근 로그 줄에 위조 끝단 머리가 남지 않게(리뷰 RV-01)
      local verified = setting(ctx, "originVerify") == true and origin_ok(headers:get(ORIGIN_VERIFY))
      if not verified then strip_edge(headers) end
      headers:remove(ORIGIN_VERIFY)
      if is_internal(headers:get(":path")) then
        -- /internal/ 404는 끝단 머리를 지운 다음 답한다(docs/infra.md §4.1 '호스트와 내부 경로')
        strip_edge(headers)
        return handle:respond(direct_headers("404"), NOT_FOUND)
      end
      -- gw-ops는 허용 IP를 CloudFront-Viewer-Address로만 보고, 조사 칸(ja4·asn·edgeBotLabels)은 접근 로그에 남기지 않는다.
      -- 허용 IP 확인이 끝난 뒤에 지운다(B-T18 ④, 운영 콘솔에 시청자 지문을 남기지 않는다).
      local strip_ops = setting(ctx, "requireOriginVerify") == true
      -- gw-ops는 CloudFront를 거쳐야만 닿는다(ADR-0144 결정 2, ADR-0321 결정 2). /internal/ 404 다음이다
      if setting(ctx, "requireOriginVerify") == true and not verified then
        return handle:respond(direct_headers("403"), FORBIDDEN)
      end
      -- 허용 IP는 원본 확인이 맞은 요청에서만 본다(ADR-0321 결정 3). 확인 중 Lua 오류는 거절로 바꾼다
      local opsEnv = setting(ctx, "opsAllowedIpsEnv")
      if verified and type(opsEnv) == "string" and opsEnv ~= "" then
        local ok, denied = pcall(ops_ip_check, handle, headers, opsEnv)
        if not ok then
          pcall(function() handle:logWarn("peaket ops ip check error (rejected)") end)
          if strip_ops then strip_edge(headers) end
          return handle:respond(direct_headers("403"), FORBIDDEN)
        end
        if denied ~= nil then
          if strip_ops then strip_edge(headers) end
          return handle:respond(direct_headers("403"), FORBIDDEN)
        end
      end
      if strip_ops then strip_edge(headers) end
      -- CSRF 출처는 글자 그대로 견준다(Envoy csrf 필터가 끝 슬래시를 떼는 것을 덮는다, BAT-045 리뷰 W-02)
      if csrf_origin_denied(handle, headers, ctx) then
        return handle:respond(direct_headers("403"), FORBIDDEN)
      end
      -- 리프레시 쿠키는 갱신 경로 밖으로 넘기지 않는다(깊은 방어, I-T46 ⑤)
      rewrite_cookies(headers, ctx)
      if setting(ctx, "checkTyp") == true then
        local tokens = tokens_of(headers, ctx)
        if tokens == nil then return reject(handle, headers, ctx) end
        for _, t in ipairs(tokens) do
          -- 꺼낸 토큰마다 머리의 typ이 액세스 토큰 값이어야 한다(머리를 풀지 못하거나 typ이 없어도 거절)
          local head = header_of(t)
          if head == nil or typ_in(head) ~= ACCESS_TYP then return reject(handle, headers, ctx) end
        end
      end
      if setting(ctx, "admission") == true and headers:get(":method") ~= "OPTIONS" then
        -- 확인 중 Lua 오류는 거절로 바꾼다(Envoy는 오류 난 Lua 뒤로 요청을 넘긴다: 열린 쪽 실패를 막는다)
        local ok, status = pcall(admission_check, handle, headers, ctx)
        if not ok then
          handle:logWarn("peaket admission check error (rejected)")
          status = 401
        end
        if status ~= nil then return admission_reject(handle, headers, ctx, status) end
      end
    end
---
# API 호스트에서 다른 라우트에 맞지 않는 경로의 404 직접 응답(<게이트웨이>-not-found 라우트, 리뷰 RV-01)
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: peaket-not-found
  namespace: envoy-gateway-system
spec:
  directResponse:
    statusCode: 404
    contentType: application/problem+json
    body:
      type: Inline
      inline: '{"type":"about:blank","title":"Not Found","status":404}'
    header:
      set:
        - name: Strict-Transport-Security
          value: max-age=31536000; includeSubDomains
        - name: X-Content-Type-Options
          value: nosniff
        - name: Content-Security-Policy
          value: default-src 'none'; frame-ancestors 'none'
---
# API 호스트 다섯의 남은 경로·맞지 않는 메서드 404 직접 응답(<게이트웨이>-not-found 라우트). 위 peaket-not-found와 같은 Problem 본문에
# 그 요청의 trace-id를 X-Trace-Id로 단다(docs/infra.md §4.1 '추적 머리', D-T42 ④·D-T43 ①). 404는 응답 고치기에서 뺐다: 고친 응답은 머리를 새로 써서
# 이 머리가 빠진다(2026-11-16 kind lane1-b060k 확인). CDN이 캐시하는 queue-files와 앱 서버 호스트는 위 peaket-not-found를 그대로 쓴다
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: peaket-api-not-found
  namespace: envoy-gateway-system
spec:
  directResponse:
    statusCode: 404
    contentType: application/problem+json
    body:
      type: Inline
      inline: '{"type":"about:blank","title":"Not Found","status":404}'
    header:
      set:
        - name: X-Trace-Id
          value: "%TRACE_ID%"
---
# TRACE를 405로 답하는 직접 응답(docs/security/asvs/delivery.md 13.4.4)
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: peaket-trace-not-allowed
  namespace: envoy-gateway-system
spec:
  directResponse:
    statusCode: 405
    contentType: application/problem+json
    body:
      type: Inline
      inline: '{"type":"about:blank","title":"Method Not Allowed","status":405}'
    header:
      set:
        - name: Strict-Transport-Security
          value: max-age=31536000; includeSubDomains
        - name: X-Content-Type-Options
          value: nosniff
        - name: Content-Security-Policy
          value: default-src 'none'; frame-ancestors 'none'
---
# core 네임스페이스의 Service를 게이트웨이 라우트·정책이 가리키도록 허락한다(Gateway API ReferenceGrant)
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: peaket-gateways
  namespace: core
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: envoy-gateway-system
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: envoy-gateway-system
    - group: gateway.envoyproxy.io
      kind: EnvoyProxy
      namespace: envoy-gateway-system
  to:
    - group: ""
      kind: Service
---
