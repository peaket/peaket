# F-04-19 research_export_denial 90일 purge CronJob(동결 로컬, LCH-330).
# 소유자 결정(2026-11-27): 90일 보존, ops_app DELETE 금지, 전용 ops_research_purger만 실행.
# 이 파일은 ArgoCD가 deploy/jobs를 포함할 때 적용한다. 적용 경로·Secret·역할은 deploy/jobs/README.md.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: research-export-purge
  labels:
    app.kubernetes.io/name: research-export-purge
    app.kubernetes.io/part-of: peaket
spec:
  # 매일 04:15 UTC. 90일이 지난 거절·경보 메타데이터만 지운다.
  schedule: "15 4 * * *"
  timeZone: "Etc/UTC"
  # 이전 실행이 끝나지 않았으면 다음 실행을 건너뛴다(같은 행을 두 번 지우는 경합을 막는다).
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: research-export-purge
            app.kubernetes.io/part-of: peaket
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            fsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: purge
              # 운영 승격 때는 서명된 다이제스트로 고정한다(docs/devops.md §5.2, ADR-0288).
              image: postgres:18-alpine
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  set -eu
                  : "${PEAKET_RESEARCH_PURGE_DATABASE_URL:?PEAKET_RESEARCH_PURGE_DATABASE_URL is required}"
                  psql "$PEAKET_RESEARCH_PURGE_DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atc \
                    "SET ROLE ops_research_purger; SELECT public.research_export_denial_purge();"
              env:
                # DSN은 Secret에서만 받는다. 로그인 역할은 ops_research_purger의 멤버여야 한다.
                - name: PEAKET_RESEARCH_PURGE_DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: ops-research-purge-secrets
                      key: PEAKET_RESEARCH_PURGE_DATABASE_URL
                      optional: false
                - name: HOME
                  value: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { memory: 64Mi }
              volumeMounts:
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: tmp
              emptyDir: {}
