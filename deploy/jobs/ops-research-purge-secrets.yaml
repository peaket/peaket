# F-04-19 research_export_denial purge Job의 DSN Secret(동결 로컬, LCH-330).
# 값은 Secrets Manager에만 있고, 이 파일은 경로만 가리킨다. 경로는 환경별 Secrets Manager 계정에서 같다.
# DSN의 로그인 역할은 ops_research_purge_login이고, 0041이 ops_research_purger 멤버십을 준다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ops-research-purge-secrets
  labels:
    app.kubernetes.io/name: research-export-purge
    app.kubernetes.io/part-of: peaket
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: peaket-secrets
  target:
    name: ops-research-purge-secrets
    creationPolicy: Owner
  data:
    - secretKey: PEAKET_RESEARCH_PURGE_DATABASE_URL
      remoteRef:
        key: peaket/research-purge/database-url
