# purchase-svc 배포 단위 기본 값(docs/devops.md §5.2, BUILD_ORDER PRF-137이 넘긴 것, 묶음 BAT-057, ADR-0288 결정 7·8). 환경 값은 deploy/envs/<환경>/purchase-svc.yaml에 둔다.
# 포트는 메시 원천 deploy/platform/mesh/port-allow.yaml의 purchase-svc와 같다(앱 8080·지표 9464). 업무 gRPC·제어 gRPC 포트와 다른 서비스 주소는 그 단계가 더한다.
# 이 파일의 세 값(docs/features/seat-hold.md §2 '입장 토큰 공개키 묶음 주기 읽기' '배포 값'):
# - PEAKET_ADMISSION_JWKS_URL: queue-svc 앱 포트의 입장 토큰 공개키 묶음. 5분마다 다시 읽는다(키를 바꿔도 다시 시작하지 않는다).
#   정적 묶음 PEAKET_ADMISSION_JWKS는 local·ci만 받으므로 여기에 두지 않는다(두 값이 함께 있으면 시작하지 않는다). 메시는 purchase-svc → queue-svc rest를 허용한다
# - PEAKET_ADMISSION_ISSUER: 입장 토큰 발급자 [가정]. queue-svc PEAKET_ADMISSION_TOKEN_ISSUER, gw-fan admissionIssuer와 같은 값이다
# - PEAKET_SEATMAP_DIR: 회차별 좌석맵 판 {eventId}.json 폴더(seat-hold §2 '운영 좌석맵 판'). 아래 볼륨을 붙인 자리와 같다.
#   판 파일을 넣는 길은 회차 설정을 core에서 받는 단계(LCH-080)가 정한다. 그 전에는 ConfigMap purchase-svc-seatmaps [가정]이고 없어도 뜬다(빈 폴더: 회차마다 판이 없다)
# 비밀(좌석 Redis 주소, 서버 ECDH 개인키 PEAKET_PURCHASE_ECDH_KEY, DB 주소, 내부 토큰)은 env에 두지 않고 Secret(secretEnvFrom)으로만 받는다.
name: purchase-svc

secretEnvFrom: purchase-svc-secrets

managementPort: 9464

service:
  replicas: 2
  port: 8080
  command: ["node", "--import", "@peaket/platform/telemetry/register", "dist/main.js"]
  env:
    PEAKET_ADMISSION_JWKS_URL: http://queue-svc.queue.svc.cluster.local:8080/internal/jwks/admission.json
    PEAKET_ADMISSION_ISSUER: https://queue.peaket.example
    PEAKET_SEATMAP_DIR: /etc/peaket/seatmaps
    # BAT-425 GAT-120: 회차 취소 일괄 환불의 자동 정지가 읽는 payment-svc 내부 `GET /internal/v1/circuits`의 뿌리 주소.
    # 없으면 local·ci는 늘 닫힌 대역이고 그 밖 환경은 시작하지 않는다(서킷이 늘 닫힌 채 조용히 도는 것을 막는다)
    PEAKET_PAYMENT_HTTP_URL: http://payment-svc.purchase.svc.cluster.local:8080
  volumes:
    - name: seatmaps
      configMap:
        name: purchase-svc-seatmaps
        optional: true
  volumeMounts:
    - { name: seatmaps, mountPath: /etc/peaket/seatmaps, readOnly: true }
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }
