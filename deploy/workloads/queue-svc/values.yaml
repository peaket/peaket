# queue-svc 배포 단위 기본 값(docs/devops.md §5.2, BUILD_ORDER PRF-050이 넘긴 것, 묶음 BAT-057, ADR-0288 결정 8). 환경 값은 deploy/envs/<환경>/queue-svc.yaml에 둔다.
# 포트는 메시 원천 deploy/platform/mesh/port-allow.yaml의 queue-svc와 같다(앱 8080·업무 gRPC 50051·제어 50061·지표 9464).
# tools/ci/mesh-policies.mjs --check가 앱·지표 포트와 업무 gRPC 주소(PEAKET_*_GRPC_URL)를 원천과 견준다.
# 앱 포트 8080에는 gw-queue와 purchase-svc(입장 토큰 공개키 묶음 GET /internal/jwks/admission.json, docs/features/queue-admission.md §6)·ops-svc가 닿는다.
# 비밀은 env에 두지 않고 Secret(secretEnvFrom, 운영은 ExternalSecret이 만든다, wbs 0.4.4)으로만 받는다:
# 대기열 Redis 주소(PEAKET_QUEUE_REDIS_URL·PEAKET_QUEUE_REDIS_CLUSTER_URLS), 대기표 서명 키 PEAKET_QUEUE_TOKEN_KEY(교체 때 …_PREVIOUS),
# 입장 토큰 서명 개인 JWK PEAKET_ADMISSION_TOKEN_KEY(교체 때 공개 JWK PEAKET_ADMISSION_TOKEN_KEY_PREVIOUS·…_PREVIOUS_UNTIL·…_NEXT, 교체 차례는 queue-admission §6),
# 도착 시각 쿠키 키 PEAKET_ARRIVAL_COOKIE_KEY(교체 때 …_PREVIOUS), 최초 방문 쿠키 키 PEAKET_FIRST_VISIT_COOKIE_KEYS, 내부 HTTP 토큰 PEAKET_INTERNAL_TOKEN.
name: queue-svc

secretEnvFrom: queue-svc-secrets

managementPort: 9464

service:
  # 핫패스: 온디맨드 노드에 둔다(karpenter.sh/capacity-type: on-demand [가정, BAT-076 NodePool 라벨과 맞춘다], ADR-0102 결정 3)
  nodeSelector:
    karpenter.sh/capacity-type: on-demand
  replicas: 2
  port: 8080
  command: ["node", "--import", "@peaket/platform/telemetry/register", "dist/main.js"]
  # 업무 gRPC(QueueService·VerificationAppealService·PriorityGrantService·BookingRestrictionService)와 제어 gRPC(ControlReceiver.ApplyControl, ADR-0102)
  extraPorts:
    - { name: grpc, port: 50051 }
    - { name: control, port: 50061 }
  env:
    PEAKET_GRPC_PORT: "50051"
    PEAKET_QUEUE_CONTROL_GRPC_PORT: "50061"
    # 업무 gRPC는 웨이포인트를 붙인 전용 Service <워크로드>-grpc로 부른다(ADR-0285 결정 5, deploy/platform/mesh/policies.yaml)
    PEAKET_IDENTITY_GRPC_URL: identity-svc-grpc:50051
    PEAKET_TRUST_GRPC_URL: trust-svc-grpc:50051
    # 입장 토큰 발급자(iss) [가정]. purchase-svc PEAKET_ADMISSION_ISSUER, gw-fan gw-fan-buy-edge의 admissionIssuer와 같은 값이다(ADR-0288 결정 8, 정적 시험이 셋을 견준다)
    PEAKET_ADMISSION_TOKEN_ISSUER: https://queue.peaket.example
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }
