# core-svc 배포 단위 기본 값(BAT-087 데모 무대, docs/devops.md §5.2). 환경 값은 deploy/envs/<환경>/core-svc.yaml에 둔다.
name: core-svc

managementPort: 9464

service:
  enabled: true
  replicas: 1
  port: 8080
  extraPorts:
    - { name: grpc, port: 50051 }
  command: ["node", "--import", "@peaket/platform/telemetry/register", "dist/main.js"]
  env: {}
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }
