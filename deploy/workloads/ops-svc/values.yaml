# ops-svc 배포 단위 기본 값(platform 템플릿 기반, GAT-110 첫 몫). 환경 값은 deploy/envs/<환경>/ops-svc.yaml에 둔다.
# 관제 전용 노드 풀·ops 전용 Aurora·gw-ops 경로는 ADR-0102다. 이 골격은 HTTP 명령 접수·2인 승인·감사 체인만 열고,
# 제어 gRPC 전달·ack·SSE는 후속이다. CS 처리함 건 요청은 Kafka support.cases-requested로도 받는다(F-06-2 GAT-280).
# CS 처리함 기한은 공휴일 달력 파일 PEAKET_HOLIDAY_CALENDAR_FILE(purchase-svc와 같은 파일, ADR-0364 결정 1)로 센다.
# staging·prod는 그 파일이 없거나 읽지 못하면 시작하지 않으므로, 그 환경 값(deploy/envs/<환경>/ops-svc.yaml)이 파일을 붙이고 경로를 넣는다.
name: ops-svc

# 비밀(DB 주소, 내부 토큰, 재인증 Redis·테넌트 Redis 주소)은 env에 두지 않고 Secret(secretEnvFrom)으로 받는다.
# 재인증 jti 1회용 Redis 주소는 Secret 키 PEAKET_REAUTH_REDIS_URL로 온다(ops-svc-secrets, env에 값을 두지 않는다).
# 테넌트 한도 Redis(BAT-173 리뷰 RV-01): PEAKET_TENANT_REDIS_URL은 세션·캐시 클러스터를 가리키고 재인증 jti Redis(PEAKET_REAUTH_REDIS_URL)와 별개다.
# staging·prod·demo는 이 값이 없으면 시작하지 않는다. local·ci만 재인증 Redis로 닫힌 대역을 쓴다.
secretEnvFrom: ops-svc-secrets

managementPort: 9464

service:
  # 관제·시스템 풀(ADR-0102 결정 3, docs/devops.md §5.2 네임스페이스 지도). 확장·제어 길이 서비스보다 먼저 뜬다
  priorityClassName: peaket-control
  nodeSelector:
    peaket.io/pool: ops
  tolerations:
    - key: peaket.io/pool
      operator: Equal
      value: ops
      effect: NoSchedule
  replicas: 2
  port: 8080
  command: ["node", "--import", "@peaket/platform/telemetry/register", "dist/main.js"]
  env:
    # 관제 역할(operator·commander·viewer)은 요청마다 identity AdminAuthzService.GetAdminAuthz로 본다(ADR-0172).
    # 업무 gRPC는 웨이포인트를 붙인 전용 Service <워크로드>-grpc로 부른다(ADR-0285 결정 5, deploy/platform/mesh/policies.yaml)
    PEAKET_IDENTITY_GRPC_URL: identity-svc-grpc:50051
    # 관리 계정 쓰기·위험 명령 재인증의 JWKS(identity-svc 앱 포트의 관리 공개키 묶음, 클러스터 안에서만)
    PEAKET_IDENTITY_JWKS_URL: http://identity-svc.core.svc.cluster.local:8080/internal/jwks/admin.json
    # purchase-svc 내부 HTTP 주소(BAT-425). EVENT_CANCEL 전달에 쓴다
    PEAKET_PURCHASE_HTTP_URL: http://purchase-svc:8080
    # core-svc 내부 HTTP 주소: 판매 설정 사본·회차 규모 변경·회차 취소 core 상태 반영(GAT-110). 운영은 없으면 시작하지 않는다
    PEAKET_CORE_HTTP_URL: http://core-svc:8080
    # 봇 판정 표본 검토(BAT-197 BOT-080): 표본 판정 HUMAN·BOT을 trust-svc ApplyLabel로 반영한다(없으면 그 판정만 503)
    PEAKET_TRUST_GRPC_URL: trust-svc-grpc:50051
    # 표본 후보 원장은 분석 저장소 ClickHouse bot_sample_review다. 적재는 OPS-220 몫이라 아직 운영 표가 없다.
    # OPS-220 배포 때 Service 이름을 확인한다. 사용자는 읽기 전용 an_ops_reader이고 비밀은 Secret(ops-svc-secrets)에서 온다.
    PEAKET_BOT_REVIEW_SOURCE: clickhouse
    PEAKET_ANALYTICS_CLICKHOUSE_URL: http://clickhouse.analytics.svc.cluster.local:8123
    PEAKET_ANALYTICS_CLICKHOUSE_USER: an_ops_reader
    # 내부 HTTP 공유 토큰 PEAKET_INTERNAL_TOKEN은 Secret에서 넣는다(비우면 로컬·CI처럼 검사를 끈다)
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }
