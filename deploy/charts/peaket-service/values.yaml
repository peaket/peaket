# 차트 기본값. 배포 단위 값은 deploy/workloads/<배포 단위>/values.yaml, 환경 값은 deploy/envs/<환경>/<서비스>.yaml에 둔다(docs/devops.md §5.2).
# 비밀 값은 여기에 두지 않는다. secretEnvFrom으로 Secret 이름만 가리킨다(운영은 ExternalSecret이 만든다, wbs 0.4.4).

# 서비스 이름(필수, 예: purchase-svc). Deployment·Lease·로그의 service 이름이 된다
name: ""

image:
  repository: ""
  # 운영·데모·스테이징은 digest(sha256:…)로만 고정한다. tag는 로컬 kind 시험(PEAKET_ENV local·ci)에만 쓴다
  digest: ""
  tag: ""
  pullPolicy: IfNotPresent

# 두 Deployment가 함께 받는 환경 변수(이름: 값). PEAKET_ENV는 필수다
env: {}
# 두 Deployment가 함께 받는 Secret 이름(envFrom). 비우면 쓰지 않는다
secretEnvFrom: ""

# 준비·생존·시작 프로브(docs/architecture.md §5 '프로브 규칙'). 정적 앱(web·partner·console-host·scanner·queue-room)은
# 관리 포트 /ready·/livez가 없어 로컬 데모 값에서 끈다(BAT-087). 끄면 파드는 컨테이너가 뜨는 대로 준비다
probes:
  enabled: true

# 관리 포트(/metrics·/ready·/livez). 앱 트래픽과 다른 포트다(docs/architecture.md §5 '프로브 규칙')
managementPort: 9464

# 진단 수집(RB-31, ADR-0070 결정 1, BUILD_ORDER BAS-080). 서비스·릴레이 컨테이너는 늘 진단 실행 옵션(NODE_OPTIONS)·/diag·주석 파일·메모리 한도 값을 받는다.
# 운영자가 파드에 peaket.io/diagnose=<report|heap>@<UTC 시각> 주석을 달면 서비스가 준비를 내리고 보고서(·힙 스냅샷)를 증거 버킷에 올린 뒤 다시 뜬다.
diagnose:
  # 증거 버킷 이름(운영은 Terraform이 만든 버킷). 비우면 local·ci는 수집을 끄고(경고 한 줄), 그 밖의 환경(staging·prod·demo)은 렌더하지 않는다
  bucket: ""
  # 흉내 서버 주소(local·ci의 AWS 흉내 서버 moto S3). local·ci에서 수집을 켜려면 bucket과 함께 있어야 한다. 그 밖의 환경에 적으면 렌더하지 않는다
  s3Endpoint: ""
  # 값으로 받는 NODE_OPTIONS(env·service.env·outboxRelay.env)는 안전 옵션 앞에 붙고, 안전 옵션을 끄는 값(--no-disable-sigusr1·--no-report-*·--inspect…)은 렌더하지 않는다
  # V8 힙 상한(메모리 한도에 대한 백분율, 10~90) [가정]. 나머지는 힙 밖 메모리와 힙 스냅샷 여유다
  heapPercent: 75

service:
  enabled: true
  replicas: 2
  port: 8080
  command: ["node", "--import", "@peaket/platform/telemetry/register", "template/dist/main.js"]
  # 서비스 Deployment만 받는 환경 변수
  env: {}
  # 서비스 파드끼리 리더를 뽑을 Lease 이름(BUILD_ORDER PRF-202). 이름 하나(글)나 이름 목록(한 파드가 여러 Lease를 잡는 합본, BUILD_ORDER PRF-215)을 받는다.
  # 비우면 Lease·권한을 만들지 않고 토큰을 붙이지 않는다
  # 서비스 파드의 우선순위 클래스(예: peaket-control). 비우면 칸을 넣지 않는다(docs/devops.md §5.2, ADR-0078 결정 8)
  priorityClassName: ""
  # 서비스 파드의 노드 배치 값(쿠버네티스 nodeSelector·tolerations 그대로). 비우면 칸을 넣지 않아 지금 렌더와 같다.
  # 핫패스는 온디맨드 노드(karpenter.sh/capacity-type: on-demand), ops-svc는 관제 풀(peaket.io/pool=ops:NoSchedule)에 둔다
  # (ADR-0102 결정 3, docs/infra-handover.md §3.1, 추천 적용 2026-11-20, BUILD_ORDER BAT-085)
  nodeSelector: {}
  tolerations: []
  # Argo Rollouts 카나리(운영). 켜면 Deployment 대신 Rollout 하나를 내고, local·CI는 기본값(Deployment)을 쓴다
  # 단계의 pauseSeconds는 그 단계 뒤 분석·대기 시간(초)이다. 값은 [가정](docs/devops.md §6.2)
  rollout:
    enabled: false
    steps:
      - { weight: 10, pauseSeconds: 60 }
      - { weight: 50, pauseSeconds: 120 }
      - { weight: 100 }
  # PodDisruptionBudget. maxUnavailable: 1은 복제 2 이상일 때 쓴다(docs/devops.md §6.1)
  pdb:
    enabled: false
    maxUnavailable: 1
  # KEDA ScaledObject(wbs 0.4.4). 지표를 못 읽으면 fallback.replicas(-1)로 지금 복제 수를 유지한다(docs/observability.md §5 G-21)
  keda:
    enabled: false
    triggers: []
    fallback:
      failureThreshold: 3
      replicas: -1
  leaderLease: ""
  # 앱 포트(port) 밖의 포트(BUILD_ORDER PRF-215: 합본은 서비스마다 앱 포트가 다르다). 칸마다 { name, port }이고 컨테이너 포트와 Service 포트가 함께 열린다
  extraPorts: []
  # 서비스 파드에 더 붙일 볼륨과 붙일 자리(쿠버네티스 볼륨·volumeMount 꼴 그대로. 합본의 서비스별 환경 파일 Secret·좌석맵 판 ConfigMap, BUILD_ORDER PRF-215)
  volumes: []
  volumeMounts: []
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }
  # 종료: preStop 5초 → SIGTERM → 진행 중 요청 마감(docs/devops.md §6.4 '일반 서비스')
  preStopSleepSeconds: 5
  terminationGracePeriodSeconds: 30
  # CPU 사용률 HPA(autoscaling/v2). v0 배포의 K9 비교 기준이다(docs/infra.md §3 'v0 배포'). v1은 KEDA로 확장한다(wbs 0.4.4).
  # 켜면 Deployment에 replicas를 적지 않는다(HPA가 정한 수를 다시 올릴 때 되돌리지 않게). resources.requests.cpu가 있어야 한다
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    # 요청 CPU 대비 평균 사용률(1~100). 확장 동작(behavior)은 쿠버네티스 기본값 그대로 둔다
    targetCPUUtilizationPercentage: 70
  # 앱 포트·관리 포트에 닿을 수 있는 곳을 좁히는 NetworkPolicy(로컬은 kindnet이 지킨다). 운영 정책은 wbs 0.4.4에서 정한다
  networkPolicy:
    enabled: false
    # 앱 포트에 닿을 수 있는 같은 네임스페이스 파드의 라벨(예: { app.kubernetes.io/name: v0-gateway }). 비면 아무도 닿지 못한다
    appFromPodLabels: {}
    # 관리 포트에 닿을 수 있는 네임스페이스 이름(로컬 관측 최소의 Prometheus)
    managementFromNamespaces: [observability]
    # 나가는 연결 허용 목록(docs/infra.md §9, BUILD_ORDER PRF-192). 둘 다 비면 Egress를 넣지 않아 나가는 쪽을 막지 않는다.
    # 하나라도 있으면 클러스터 DNS(53)가 함께 열리고 적지 않은 곳은 모두 막힌다(DB·수집기 같은 안쪽 대상도 적어야 닿는다).
    # 릴레이를 켠 차트는 릴레이 파드도 같은 값을 받는다(NetworkPolicy <서비스>-outbox-relay, 추천 적용 2026-11-09, BUILD_ORDER PRF-192, 코드 리뷰)
    egress:
      # 공인 주소의 TCP 443(사설·루프백·링크 로컬·CGNAT·멀티캐스트·예약 대역은 뺀다)
      publicHttps: false
      # 안쪽 대상. 칸마다 ports(TCP)가 있고, cidrs·allowLinkLocalCidrs·(namespaces·podLabels) 가운데 한 종류만 쓴다
      # cidrs: 전체 대역이나 사설 대역보다 넓은 값(IPv4 /8, IPv6 /7 미만)과 링크 로컬(169.254.0.0/16 등)은 렌더를 멈춘다
      # allowLinkLocalCidrs: 링크 로컬을 일부러 여는 칸이다. 호스트 하나씩(/32)만 받고 메타데이터 주소 169.254.169.254는 받지 않는다
      # 예: [{ namespaces: [data], podLabels: { app: pgbouncer }, ports: [6432] }, { cidrs: [10.20.0.0/16], ports: [5432] }, { allowLinkLocalCidrs: [169.254.170.23/32], ports: [80] }]
      internal: []

# 스트림 작업자 모드(docs/streaming.md §2.2·§2.3, ASVS v5.0.0-13.4.5, BUILD_ORDER OPS-150). 작업자에는 관리 API가 없고 들어오는 연결은 지표 수집·상태 확인뿐이다.
# 켜면 서비스 Deployment가 앱 포트·Service를 만들지 않고(컨테이너 포트는 관리 포트 하나, PORT 환경 값 없음), NetworkPolicy를 service.networkPolicy.enabled와
# 상관없이 늘 낸다. 들어옴은 service.networkPolicy.managementFromNamespaces(관측 네임스페이스)에서 관리 포트로만, 나감은 service.networkPolicy.egress 그대로다.
# 앱 포트에 기대는 값(service.extraPorts·service.networkPolicy.appFromPodLabels), 쿠버네티스 API 권한(service.leaderLease),
# 자동 확장·카나리(service.autoscaling·service.keda·service.rollout, §2.2 '복제 수 고정·롤링')는 받지 않는다(렌더를 멈춘다)
worker:
  enabled: false

# 서비스별 Outbox 릴레이(ADR-0116 결정 1·2). 서비스와 같은 이미지를 다른 시작 명령으로 띄운다. Lease 리더만 보내고 정비를 돈다
outboxRelay:
  enabled: false
  replicas: 2
  command: ["node", "--import", "@peaket/platform/telemetry/register", "template/dist/relay.js"]
  # 릴레이만 받는 환경 변수: PEAKET_OUTBOX_DATABASE_URL(릴레이 역할)·PEAKET_MAINTENANCE_DATABASE_URL(정비 역할, PgBouncer를 거치지 않는다)·
  # PEAKET_KAFKA_BROKERS. 업무 데이터를 쓰는 릴레이(purchase·payment)는 PEAKET_DATABASE_URL(서비스 역할)도 받는다. 운영의 DB 주소는 secretEnvFrom/relaySecretEnvFrom으로 받는다
  env: {}
  secretEnvFrom: ""
  # 릴레이 파드에 더 붙일 볼륨과 붙일 자리(서비스 파드의 service.volumes와 같은 꼴. purchase-svc 릴레이는 좌석맵 판 폴더를 읽는다, BUILD_ORDER PRF-215)
  volumes: []
  volumeMounts: []
  resources:
    requests: { cpu: 50m, memory: 192Mi }
    limits: { memory: 384Mi }
  terminationGracePeriodSeconds: 30

# Kubernetes Secret을 External Secrets로 채운다(docs/devops.md §5.2 '비밀 값은 저장소에 없다'). 켜면 ExternalSecret 하나를 낸다.
# data 칸은 remoteRef(Secrets Manager 경로)만 받고 값은 두지 않는다. 시크릿 저장소 이름·대상 Secret 이름은 값 파일이 준다
externalSecret:
  enabled: false
  # remoteRef 경로 앞에 붙는 환경 이름(peaket/<환경>/...). 배포 단위 값은 환경 안쪽 경로만 적고 환경 값이 이 칸을 채운다.
  # 비우면 ExternalSecret 렌더를 멈춘다(환경 없이 운영 경로를 만들지 않는다, BAT-080 RV-01)
  environment: ""
  # External Secrets가 Secret을 다시 읽는 주기. 없거나 0이면 한 번만 만들고 갱신하지 않아 키 교체가 Secret에 닿지 않는다(BAT-080 RV-06)
  refreshInterval: 1h
  # 만들 Secret의 소유권. ExternalSecret을 지우면 Secret도 함께 지운다(docs/security/asvs/delivery.md 13.3.4)
  creationPolicy: Owner
  secretStoreRef: { name: "", kind: ClusterSecretStore }
  target: { name: "" }
  data: []

# 생산자 스키마 ID 설정(ADR-0357 결정 4, F-04-2). 켜면 ConfigMap(기본 schema-ids, 키 schema-ids.json)을 앱·Outbox 릴레이 컨테이너의
# /etc/peaket/schema-ids/에 읽기 전용으로 붙이고 PEAKET_SCHEMA_IDS_FILE이 그 파일을 가리킨다. Avro로 사건을 내는 서비스가 켠다
# (purchase-svc·trust-svc). 서비스는 파일이 없거나 내는 주제가 빠졌으면 시작하지 않는다(D-T39 ③). 로컬 클러스터는 tools/local이 고정 번호로 만든다
schemaIds:
  enabled: false
  configMapName: schema-ids

# Avro 사건 스키마 등록 Job(BUILD_ORDER BAS-030, docs/devops.md §4.2, D-T39).
# ArgoCD PreSync 훅으로 그 서비스가 내는 주제만 등록하고, 주제별 스키마 ID를 ConfigMap schema-ids에 쓴다.
# image는 kubectl과 tools/ci/register-avro.mjs를 담은 도구 이미지다(운영 조립은 그 이미지를 만드는 단계에서 정한다).
schemaRegistry:
  enabled: false
  image: ""
  registryUrl: ""
  topics: {}
  serviceAccountName: ""
  command: ["/bin/sh", "-c"]
  args:
    - |
      set -euo pipefail
      node /app/register-avro.mjs --registry "$PEAKET_SCHEMA_REGISTRY_URL" --topic-map /app/topics.json > /tmp/schema-ids.json
      kubectl create configmap schema-ids --from-file=schema-ids.json=/tmp/schema-ids.json --dry-run=client -o yaml | kubectl apply -f -

# DB 마이그레이션 Job(BAS-060, F-09-2). 기본은 꺼짐이고 DB가 있는 서비스 여섯만 배포 값에서 켠다.
# 켜면 같은 이미지의 scripts/migrate.mjs를 ArgoCD PreSync로 돌린다. DDL 역할·정비 역할 주소는 Secret에서만 받는다.
migration:
  enabled: false
  # Secret 이름. 키는 ddl-url(DDL 역할)·maintenance-url(정비 역할)이다.
  secretName: ""