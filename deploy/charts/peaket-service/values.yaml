# 차트 기본값. 배포 단위 값은 deploy/workloads/<배포 단위>/values.yaml, 환경 값은 deploy/envs/<환경>/<서비스>.yaml에 둔다(docs/devops.md §5.2).
# 비밀 값은 여기에 두지 않는다. secretEnvFrom으로 Secret 이름만 가리킨다(운영은 ExternalSecret이 만든다, wbs 0.4.4).

# 서비스 이름(필수, 예: purchase-svc). Deployment·Lease·로그의 service 이름이 된다
name: ""

image:
  repository: ""
  # 운영·데모·스테이징은 digest(sha256:…)로만 고정한다. tag는 로컬 kind 시험(PEAKET_ENV local·ci)에만 쓴다
  digest: ""
  tag: ""
  pullPolicy: IfNotPresent

# 두 Deployment가 함께 받는 환경 변수(이름: 값). PEAKET_ENV는 필수다
env: {}
# 두 Deployment가 함께 받는 Secret 이름(envFrom). 비우면 쓰지 않는다
secretEnvFrom: ""

# 관리 포트(/metrics·/ready·/livez). 앱 트래픽과 다른 포트다(docs/architecture.md §5 '프로브 규칙')
managementPort: 9464

service:
  enabled: true
  replicas: 2
  port: 8080
  command: ["node", "--import", "@peaket/platform/telemetry/register", "template/dist/main.js"]
  # 서비스 Deployment만 받는 환경 변수
  env: {}
  # 서비스 파드끼리 리더를 뽑을 Lease 이름(BUILD_ORDER PRF-202). 이름 하나(글)나 이름 목록(한 파드가 여러 Lease를 잡는 합본, BUILD_ORDER PRF-215)을 받는다.
  # 비우면 Lease·권한을 만들지 않고 토큰을 붙이지 않는다
  leaderLease: ""
  # 앱 포트(port) 밖의 포트(BUILD_ORDER PRF-215: 합본은 서비스마다 앱 포트가 다르다). 칸마다 { name, port }이고 컨테이너 포트와 Service 포트가 함께 열린다
  extraPorts: []
  # 서비스 파드에 더 붙일 볼륨과 붙일 자리(쿠버네티스 볼륨·volumeMount 꼴 그대로. 합본의 서비스별 환경 파일 Secret·좌석맵 판 ConfigMap, BUILD_ORDER PRF-215)
  volumes: []
  volumeMounts: []
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }
  # 종료: preStop 5초 → SIGTERM → 진행 중 요청 마감(docs/devops.md §6.4 '일반 서비스')
  preStopSleepSeconds: 5
  terminationGracePeriodSeconds: 30
  # CPU 사용률 HPA(autoscaling/v2). v0 배포의 K9 비교 기준이다(docs/infra.md §3 'v0 배포'). v1은 KEDA로 확장한다(wbs 0.4.4).
  # 켜면 Deployment에 replicas를 적지 않는다(HPA가 정한 수를 다시 올릴 때 되돌리지 않게). resources.requests.cpu가 있어야 한다
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    # 요청 CPU 대비 평균 사용률(1~100). 확장 동작(behavior)은 쿠버네티스 기본값 그대로 둔다
    targetCPUUtilizationPercentage: 70
  # 앱 포트·관리 포트에 닿을 수 있는 곳을 좁히는 NetworkPolicy(로컬은 kindnet이 지킨다). 운영 정책은 wbs 0.4.4에서 정한다
  networkPolicy:
    enabled: false
    # 앱 포트에 닿을 수 있는 같은 네임스페이스 파드의 라벨(예: { app.kubernetes.io/name: v0-gateway }). 비면 아무도 닿지 못한다
    appFromPodLabels: {}
    # 관리 포트에 닿을 수 있는 네임스페이스 이름(로컬 관측 최소의 Prometheus)
    managementFromNamespaces: [observability]
    # 나가는 연결 허용 목록(docs/infra.md §9, BUILD_ORDER PRF-192). 둘 다 비면 Egress를 넣지 않아 나가는 쪽을 막지 않는다.
    # 하나라도 있으면 클러스터 DNS(53)가 함께 열리고 적지 않은 곳은 모두 막힌다(DB·수집기 같은 안쪽 대상도 적어야 닿는다).
    # 릴레이를 켠 차트는 릴레이 파드도 같은 값을 받는다(NetworkPolicy <서비스>-outbox-relay, 추천 적용 2026-11-09, BUILD_ORDER PRF-192, 코드 리뷰)
    egress:
      # 공인 주소의 TCP 443(사설·루프백·링크 로컬·CGNAT·멀티캐스트·예약 대역은 뺀다)
      publicHttps: false
      # 안쪽 대상. 칸마다 ports(TCP)가 있고, cidrs·allowLinkLocalCidrs·(namespaces·podLabels) 가운데 한 종류만 쓴다
      # cidrs: 전체 대역이나 사설 대역보다 넓은 값(IPv4 /8, IPv6 /7 미만)과 링크 로컬(169.254.0.0/16 등)은 렌더를 멈춘다
      # allowLinkLocalCidrs: 링크 로컬을 일부러 여는 칸이다. 호스트 하나씩(/32)만 받고 메타데이터 주소 169.254.169.254는 받지 않는다
      # 예: [{ namespaces: [data], podLabels: { app: pgbouncer }, ports: [6432] }, { cidrs: [10.20.0.0/16], ports: [5432] }, { allowLinkLocalCidrs: [169.254.170.23/32], ports: [80] }]
      internal: []

# 서비스별 Outbox 릴레이(ADR-0116 결정 1·2). 서비스와 같은 이미지를 다른 시작 명령으로 띄운다. Lease 리더만 보내고 정비를 돈다
outboxRelay:
  enabled: false
  replicas: 2
  command: ["node", "--import", "@peaket/platform/telemetry/register", "template/dist/relay.js"]
  # 릴레이만 받는 환경 변수: PEAKET_OUTBOX_DATABASE_URL(릴레이 역할)·PEAKET_MAINTENANCE_DATABASE_URL(정비 역할, PgBouncer를 거치지 않는다)·
  # PEAKET_KAFKA_BROKERS. 업무 데이터를 쓰는 릴레이(purchase·payment)는 PEAKET_DATABASE_URL(서비스 역할)도 받는다. 운영의 DB 주소는 secretEnvFrom/relaySecretEnvFrom으로 받는다
  env: {}
  secretEnvFrom: ""
  # 릴레이 파드에 더 붙일 볼륨과 붙일 자리(서비스 파드의 service.volumes와 같은 꼴. purchase-svc 릴레이는 좌석맵 판 폴더를 읽는다, BUILD_ORDER PRF-215)
  volumes: []
  volumeMounts: []
  resources:
    requests: { cpu: 50m, memory: 192Mi }
    limits: { memory: 384Mi }
  terminationGracePeriodSeconds: 30

# Avro 사건 스키마 등록 Job(BUILD_ORDER BAS-030, docs/devops.md §4.2, D-T39).
# ArgoCD PreSync 훅으로 그 서비스가 내는 주제만 등록하고, 주제별 스키마 ID를 ConfigMap schema-ids에 쓴다.
# image는 kubectl과 tools/ci/register-avro.mjs를 담은 도구 이미지다(운영 조립은 그 이미지를 만드는 단계에서 정한다).
schemaRegistry:
  enabled: false
  image: ""
  registryUrl: ""
  topics: {}
  serviceAccountName: ""
  command: ["/bin/sh", "-c"]
  args:
    - |
      set -euo pipefail
      node /app/register-avro.mjs --registry "$PEAKET_SCHEMA_REGISTRY_URL" --topic-map /app/topics.json > /tmp/schema-ids.json
      kubectl create configmap schema-ids --from-file=schema-ids.json=/tmp/schema-ids.json --dry-run=client -o yaml | kubectl apply -f -
