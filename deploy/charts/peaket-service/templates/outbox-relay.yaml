{{- if .Values.outboxRelay.enabled }}
{{- $name := include "peaket.name" . }}
{{- $relay := printf "%s-outbox-relay" $name }}
# 서비스별 Outbox 릴레이(ADR-0116 결정 1·2, BUILD_ORDER FND-110). Lease `<서비스>-outbox-relay`의 리더만 보내고 정비를 돈다.
# 권한은 자기 네임스페이스의 그 Lease 하나의 읽기·고치기뿐이다(이름으로 좁힌다, ASVS v5.0.0-13.2.2). 만들기는 RBAC가 이름으로 좁히지 못해
# (뚫린 파드가 같은 네임스페이스의 아직 없는 다른 Lease를 먼저 만들어 리더 선출을 막을 수 있다) 주지 않고, 그 Lease를 차트가 미리 만든다
# (추천 적용 2026-11-01, 코드 리뷰). 비어 있는 Lease는 첫 복제가 고치기로 잡는다. spec을 차트에 적지 않아 배포가 보유자를 지우지 않는다
apiVersion: coordination.k8s.io/v1
kind: Lease
metadata:
  name: {{ $relay }}
  labels: {{- include "peaket.labels" . | nindent 4 }}
spec: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $relay }}
  labels: {{- include "peaket.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $relay }}-lease
  labels: {{- include "peaket.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: [{{ $relay | quote }}]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $relay }}-lease
  labels: {{- include "peaket.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $relay }}-lease
subjects:
  - kind: ServiceAccount
    name: {{ $relay }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $relay }}
  labels:
    {{- include "peaket.labels" . | nindent 4 }}
    app.kubernetes.io/component: outbox-relay
spec:
  replicas: {{ .Values.outboxRelay.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/component: outbox-relay
  # 한 파드씩 바꾼다(docs/devops.md §6.1 'Kafka 소비자·워커(notify, Outbox 릴레이)'). 끝나는 리더가 Lease를 놓아 대기 복제가 바로 잡는다
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 1, maxSurge: 0 }
  template:
    metadata:
      labels:
        {{- include "peaket.labels" . | nindent 8 }}
        app.kubernetes.io/component: outbox-relay
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.managementPort }}"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: {{ $relay }}
      # Lease API를 부르는 이 파드에만 토큰을 붙인다(돌려 바뀌는 투영 토큰)
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: {{ .Values.outboxRelay.terminationGracePeriodSeconds }}
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: relay
          image: {{ include "peaket.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: {{- toYaml .Values.outboxRelay.command | nindent 12 }}
          ports:
            - { name: management, containerPort: {{ .Values.managementPort }} }
          env:
            {{- include "peaket.commonEnv" . | nindent 12 }}
            {{- range $k, $v := .Values.outboxRelay.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- if or .Values.secretEnvFrom .Values.outboxRelay.secretEnvFrom }}
          envFrom:
            {{- if .Values.secretEnvFrom }}
            - secretRef: { name: {{ .Values.secretEnvFrom }} }
            {{- end }}
            {{- if .Values.outboxRelay.secretEnvFrom }}
            - secretRef: { name: {{ .Values.outboxRelay.secretEnvFrom }} }
            {{- end }}
          {{- end }}
          {{- include "peaket.probes" . | nindent 10 }}
          resources: {{- toYaml .Values.outboxRelay.resources | nindent 12 }}
          securityContext: {{- include "peaket.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            {{- with .Values.outboxRelay.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 64Mi } }
        {{- with .Values.outboxRelay.volumes }}
        {{- include "peaket.volumes" (dict "volumes" . "env" $.Values.env.PEAKET_ENV "where" "outboxRelay.volumes") | nindent 8 }}
        {{- end }}
{{- end }}
