{{- if .Values.outboxRelay.enabled }}
{{- $name := include "peaket.name" . }}
{{- $relay := printf "%s-outbox-relay" $name }}
# 서비스별 Outbox 릴레이(ADR-0116 결정 1·2, BUILD_ORDER FND-110). Lease `<서비스>-outbox-relay`의 리더만 보내고 정비를 돈다.
# 읽기·고치기·패치는 자기 네임스페이스의 그 Lease 하나로 이름을 좁힌다(ASVS v5.0.0-13.2.2). 만들기는 RBAC가 이름으로
# 좁히지 못하므로 따로 두되, 차트가 Lease를 미리 만들어 정상 배포에서는 create가 쓰이지 않게 한다(추천 적용 2026-11-01,
# 코드 리뷰). Lease가 지워져도 릴레이가 다시 만들 수 있어 리더 선출이 멈추지 않는다(감사 OPS-08). 비어 있는 Lease는
# 첫 복제가 고치기로 잡는다. spec을 차트에 적지 않아 배포가 보유자를 지우지 않는다
apiVersion: coordination.k8s.io/v1
kind: Lease
metadata:
  name: {{ $relay }}
  labels: {{- include "peaket.labels" . | nindent 4 }}
spec: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $relay }}
  labels: {{- include "peaket.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $relay }}-lease
  labels: {{- include "peaket.labels" . | nindent 4 }}
rules:
  # create는 resourceNames로 좁힐 수 없다(요청 URL에 이름이 없다). 차트가 미리 만든 Lease가 있으면 쓰이지 않는다
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: [{{ $relay | quote }}]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $relay }}-lease
  labels: {{- include "peaket.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $relay }}-lease
subjects:
  - kind: ServiceAccount
    name: {{ $relay }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $relay }}
  labels:
    {{- include "peaket.labels" . | nindent 4 }}
    app.kubernetes.io/component: outbox-relay
spec:
  replicas: {{ .Values.outboxRelay.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/component: outbox-relay
  # 한 파드씩 바꾼다(docs/devops.md §6.1 'Kafka 소비자·워커(notify, Outbox 릴레이)'). 끝나는 리더가 Lease를 놓아 대기 복제가 바로 잡는다
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 1, maxSurge: 0 }
  template:
    metadata:
      labels:
        {{- include "peaket.labels" . | nindent 8 }}
        app.kubernetes.io/component: outbox-relay
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.managementPort }}"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: {{ $relay }}
      # Lease API를 부르는 이 파드에만 토큰을 붙인다(돌려 바뀌는 투영 토큰)
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: {{ .Values.outboxRelay.terminationGracePeriodSeconds }}
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: relay
          image: {{ include "peaket.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: {{- toYaml .Values.outboxRelay.command | nindent 12 }}
          ports:
            - { name: management, containerPort: {{ .Values.managementPort }} }
          env:
            {{- include "peaket.commonEnv" . | nindent 12 }}
            {{- range $k, $v := .Values.outboxRelay.env }}
            {{- if ne $k "NODE_OPTIONS" }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- end }}
            {{- include "peaket.diagnoseEnv" (dict "root" $ "resources" .Values.outboxRelay.resources "extra" .Values.outboxRelay.env.NODE_OPTIONS "where" "outboxRelay") | nindent 12 }}
          {{- if or .Values.secretEnvFrom .Values.outboxRelay.secretEnvFrom }}
          envFrom:
            {{- if .Values.secretEnvFrom }}
            - secretRef: { name: {{ .Values.secretEnvFrom }} }
            {{- end }}
            {{- if .Values.outboxRelay.secretEnvFrom }}
            - secretRef: { name: {{ .Values.outboxRelay.secretEnvFrom }} }
            {{- end }}
          {{- end }}
          {{- include "peaket.probes" . | nindent 10 }}
          resources: {{- toYaml .Values.outboxRelay.resources | nindent 12 }}
          securityContext: {{- include "peaket.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            {{- include "peaket.diagnoseMounts" . | nindent 12 }}
            {{- with .Values.outboxRelay.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 64Mi } }
        {{- include "peaket.diagnoseVolumes" (dict "resources" .Values.outboxRelay.resources "where" "outboxRelay") | nindent 8 }}
        {{- with .Values.outboxRelay.volumes }}
        {{- include "peaket.volumes" (dict "volumes" . "env" $.Values.env.PEAKET_ENV "where" "outboxRelay.volumes") | nindent 8 }}
        {{- end }}
{{- end }}
