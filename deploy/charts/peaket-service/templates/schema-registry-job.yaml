{{- if .Values.schemaRegistry.enabled }}
{{- $name := include "peaket.name" . }}
# Avro 사건 스키마 등록 Job(BUILD_ORDER BAS-030, docs/api/avro/README.md §3, docs/devops.md §4.2·§4.5, D-T39).
# ArgoCD PreSync 훅이라 서비스 파드보다 먼저 돈다. 호환 검사(BACKWARD_TRANSITIVE)에 걸리면 Job이 실패해 동기화가 멈추고 생산자는 배포되지 않는다.
# 주제별 스키마 ID는 같은 네임스페이스의 ConfigMap `schema-ids`에 쓴다. 생산자는 실행 중에 레지스트리를 부르지 않고 이 ID로 Avro 바이트를 만든다.
# 등록 도구는 tools/ci/register-avro.mjs이고, Job은 그 출력(JSON)을 schema-ids.json으로 ConfigMap에 쓴다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: schema-ids
  labels: {{- include "peaket.labels" . | nindent 4 }}
data: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-schema-topics
  labels: {{- include "peaket.labels" . | nindent 4 }}
data:
  topics.json: {{ .Values.schemaRegistry.topics | toJson | quote }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.schemaRegistry.serviceAccountName }}
  labels: {{- include "peaket.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-schema-register
  labels: {{- include "peaket.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-schema-register
  labels: {{- include "peaket.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-schema-register
subjects:
  - kind: ServiceAccount
    name: {{ .Values.schemaRegistry.serviceAccountName }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-schema-register
  labels: {{- include "peaket.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  template:
    metadata:
      labels: {{- include "peaket.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ required "schemaRegistry.serviceAccountName이 필요하다(등록 Job의 ConfigMap 쓰기 신원)" .Values.schemaRegistry.serviceAccountName }}
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: register
          image: {{ required "schemaRegistry.image가 필요하다(등록 도구 이미지)" .Values.schemaRegistry.image }}
          imagePullPolicy: IfNotPresent
          command: {{- toYaml .Values.schemaRegistry.command | nindent 12 }}
          args: {{- toYaml .Values.schemaRegistry.args | nindent 12 }}
          env:
            - name: PEAKET_SCHEMA_REGISTRY_URL
              value: {{ required "schemaRegistry.registryUrl이 필요하다" .Values.schemaRegistry.registryUrl | quote }}
          volumeMounts:
            - { name: topics, mountPath: /app/topics.json, subPath: topics.json, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
      volumes:
        - name: topics
          configMap: { name: {{ $name }}-schema-topics }
        - name: tmp
          emptyDir: {}
{{- end }}
