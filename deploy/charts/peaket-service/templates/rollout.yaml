{{- if and .Values.service.rollout.analysis.enabled (not .Values.service.rollout.enabled) }}{{ fail "service.rollout.analysis.enabled를 켜려면 service.rollout.enabled도 참이어야 한다" }}{{ end }}
{{- if and .Values.service.enabled .Values.service.rollout.enabled }}
{{- $name := include "peaket.name" . }}
{{- include "peaket.extraPorts" . }}
{{- $steps := .Values.service.rollout.steps }}
{{- $analysis := .Values.service.rollout.analysis.enabled }}
{{- if not $steps }}{{- fail "service.rollout.steps가 비었다. 카나리 단계를 하나 이상 적는다" }}{{- end }}
{{- $prev := 0 }}
{{- $last := int (sub (len $steps) 1) }}
{{- range $i, $step := $steps }}
{{- if not (kindIs "map" $step) }}{{- fail "service.rollout.steps의 칸은 weight와 pauseSeconds를 가진 map이어야 한다" }}{{- end }}
{{- $w := int $step.weight }}
{{- if or (lt $w 1) (gt $w 100) }}{{- fail (printf "service.rollout.steps의 weight는 1~100이다(%d)" $w) }}{{- end }}
{{- if le $w $prev }}{{- fail (printf "service.rollout.steps의 weight는 단계마다 커져야 한다(%d 뒤 %d)" $prev $w) }}{{- end }}
{{- if and (eq $i $last) (hasKey $step "pauseSeconds") }}{{- fail "service.rollout.steps의 마지막 100% 단계에는 pauseSeconds를 두지 않는다(롤아웃이 끝나지 않는다)" }}{{- end }}
{{- if hasKey $step "pauseSeconds" }}
{{- if lt (int $step.pauseSeconds) 1 }}{{- fail "service.rollout.steps의 pauseSeconds는 1초 이상이어야 한다" }}{{- end }}
{{- end }}
{{- $prev = $w }}
{{- end }}
{{- if ne $prev 100 }}{{- fail (printf "service.rollout.steps의 마지막 weight는 100이어야 한다(%d)" $prev) }}{{- end }}
# Argo Rollouts 카나리(docs/devops.md §6.2, BUILD_ORDER BAS-140·OPS-440). 켜면 Deployment 대신 이 Rollout 하나만 낸다.
# 단계는 값(service.rollout.steps)의 weight·pauseSeconds를 그대로 옮긴다. 분석을 켜면 5%·25%·50% 단계 뒤에 인라인 분석을 붙인다.
# 분석 실패는 Argo Rollouts가 자동 중단하고 안정판 100%로 되돌린다. 판정 불가는 Inconclusive로 그 단계에서 멈춘다.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ $name }}
  labels:
    {{- include "peaket.labels" . | nindent 4 }}
    app.kubernetes.io/component: service
spec:
  {{- if not .Values.service.autoscaling.enabled }}
  replicas: {{ .Values.service.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/component: service
  template:
    {{- include "peaket.servicePodTemplate" . | nindent 4 }}
  strategy:
    canary:
      steps:
        {{- range $i, $step := .Values.service.rollout.steps }}
        {{- $w := int $step.weight }}
        {{- if $analysis }}
        - setWeight: {{ $w }}
          {{- if hasKey $step "pauseSeconds" }}
        - pause: { duration: {{ printf "%ds" (int $step.pauseSeconds) }} }
          {{- end }}
          {{- if lt $w 100 }}
        - analysis:
            templates:
              - { templateName: peaket-canary-error-ratio, clusterScope: true }
              {{- if ge $w 25 }}
              - { templateName: peaket-canary-latency, clusterScope: true }
              {{- end }}
              - { templateName: peaket-canary-event-loop, clusterScope: true }
            args:
              - { name: service, value: {{ $name | quote }} }
              - name: canary-hash
                valueFrom: { podTemplateHashValue: Latest }
              - name: stable-hash
                valueFrom: { podTemplateHashValue: Stable }
          {{- end }}
        {{- else }}
        - setWeight: {{ $w }}
          {{- if hasKey $step "pauseSeconds" }}
          pause: { duration: {{ printf "%ds" (int $step.pauseSeconds) }} }
          {{- end }}
        {{- end }}
        {{- end }}
      rollbackWindow:
        revisions: 3
{{- end }}
