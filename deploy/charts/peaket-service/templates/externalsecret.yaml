{{- if .Values.externalSecret.enabled }}
{{- $name := include "peaket.name" . }}
{{- /* 환경은 값 파일이 아니라 환경 값(deploy/envs/<환경>/)이 채운다. 비우면 운영 경로를 잘못 만들지 않도록 렌더를 멈춘다(BAT-080 RV-01) */}}
{{- $environment := required "externalSecret.environment(환경 이름: local·ci·staging·demo·prod)이 필요하다: remoteRef 경로를 peaket/<환경>/...로 만든다" .Values.externalSecret.environment }}
{{- $_ := required "externalSecret.target.name(만들 Secret 이름)이 필요하다" .Values.externalSecret.target.name }}
{{- $_ := required "externalSecret.secretStoreRef.name(ClusterSecretStore 이름)이 필요하다" .Values.externalSecret.secretStoreRef.name }}
{{- range .Values.externalSecret.data }}
{{- $_ := required "externalSecret.data의 칸마다 remoteRef(Secrets Manager 경로)가 필요하다" .remoteRef }}
{{- $key := required "externalSecret.data의 remoteRef.key(환경 안쪽 경로, 예: identity/fan-token-key)가 필요하다" .remoteRef.key }}
{{- /* 환경은 차트가 한 번만 붙인다. 값 파일에 peaket/...를 박으면 다른 환경이 운영 경로를 가리킨다 */}}
{{- if or (hasPrefix "peaket/" $key) (hasPrefix "/" $key) }}
{{- fail (printf "externalSecret.data의 remoteRef.key는 환경 안쪽 상대 경로만 적는다(peaket/<환경>/는 차트가 붙인다): %s" $key) }}
{{- end }}
{{- end }}
# 비밀 값은 저장소에 없다. Secrets Manager의 경로(remoteRef)만 가리킨다(docs/devops.md §5.2, ASVS v5.0.0-13.1.4·13.3.4).
# data에는 value·valueFrom 같은 값을 두지 않는다(값은 Secrets Manager에만 있다)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  labels:
    {{- include "peaket.labels" . | nindent 4 }}
spec:
  # 정해진 주기로 다시 읽어야 키 교체가 Secret에 닿는다. 0이거나 없으면 External Secrets는 한 번만 만든다(BAT-080 RV-06)
  refreshInterval: {{ .Values.externalSecret.refreshInterval | default "1h" }}
  secretStoreRef: {{- toYaml .Values.externalSecret.secretStoreRef | nindent 4 }}
  target:
    name: {{ .Values.externalSecret.target.name | quote }}
    # External Secrets가 읽는 자리다. Owner면 ExternalSecret을 지울 때 Secret도 함께 지운다(docs/security/asvs/delivery.md 13.3.4)
    creationPolicy: {{ .Values.externalSecret.creationPolicy | default "Owner" }}
  # 차트 렌더 계약(묶음 BAT-080 CH-05)이 spec.creationPolicy도 보므로 같은 값을 한 번 더 적는다. 값의 정본은 target이다
  creationPolicy: {{ .Values.externalSecret.creationPolicy | default "Owner" }}
  data:
    {{- range .Values.externalSecret.data }}
    {{- $remote := deepCopy .remoteRef }}
    {{- $_ := set $remote "key" (printf "peaket/%s/%s" $environment .remoteRef.key) }}
    - secretKey: {{ .secretKey | quote }}
      remoteRef: {{- toYaml $remote | nindent 8 }}
    {{- end }}
{{- end }}
