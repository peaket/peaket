{{- if .Values.service.enabled }}
{{- $name := include "peaket.name" . }}
{{- include "peaket.workerChecks" . }}
{{- include "peaket.extraPorts" . }}
# 서비스 파드. 쿠버네티스 API를 부르지 않으므로 서비스 계정 토큰을 붙이지 않는다(ASVS v5.0.0-13.2.2)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels: {{- include "peaket.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
{{- /* Rollout을 켜면 Deployment 대신 Rollout만 낸다(templates/rollout.yaml). local·CI는 기본값(Deployment)을 쓴다 */}}
{{- if not .Values.service.rollout.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "peaket.labels" . | nindent 4 }}
    app.kubernetes.io/component: service
spec:
  {{- /* HPA를 켜면 복제 수를 적지 않는다(HPA가 정한 수를 다시 올릴 때 되돌리지 않게, docs/infra.md §3 'v0 배포') */}}
  {{- if .Values.service.legalAccessSeq.enabled }}
  {{- /* 법정 seq는 한 파드만 쥔다(IR-13). 값의 replicas와 무관하게 1이고, 롤링 중 두 파드가 같은 RWO PVC를 붙지 않게 Recreate다 */}}
  replicas: 1
  strategy:
    type: Recreate
  {{- else if not .Values.service.autoscaling.enabled }}
  replicas: {{ .Values.service.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/component: service
  template:
    {{- include "peaket.servicePodTemplate" . | nindent 4 }}
---
{{- end }}
{{- /* 스트림 작업자는 앱 포트가 없어 Service를 만들지 않는다(docs/streaming.md §2.3, worker.enabled). 지표는 PodMonitor·주석으로 파드에서 긁는다 */}}
{{- if not .Values.worker.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "peaket.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/component: service
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: http }
    {{- range .Values.service.extraPorts }}
    - { name: {{ .name }}, port: {{ int .port }}, targetPort: {{ .name }} }
    {{- end }}
{{- end }}
{{- end }}
