{{- if .Values.migration.enabled }}
{{- $name := include "peaket.name" . }}
# DB 마이그레이션 Job(BAS-060, docs/devops.md §7.2, D-T44 ⑤, F-09-2).
# ArgoCD PreSync라 동기화·롤아웃보다 먼저 돈다. 실패하면 동기화가 실패해 롤아웃이 시작되지 않는다.
# 서비스와 같은 이미지의 scripts/migrate.mjs를 다른 명령으로 부른다. DDL 역할·정비 역할 주소만 Secret에서 받는다.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-migration
  labels: {{- include "peaket.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: {{- include "peaket.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: migrate
          image: {{ include "peaket.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "scripts/migrate.mjs"]
          env:
            - name: PEAKET_ENV
              value: {{ .Values.env.PEAKET_ENV | quote }}
            - name: PEAKET_MIGRATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "migration.secretName이 필요하다(DDL 역할 Secret)" .Values.migration.secretName }}
                  key: ddl-url
            - name: PEAKET_MAINTENANCE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "migration.secretName이 필요하다(정비 역할 Secret)" .Values.migration.secretName }}
                  key: maintenance-url
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
{{- end }}
