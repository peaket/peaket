{{- $leases := include "peaket.leaderLeases" . | fromJsonArray }}
{{- if and .Values.service.enabled $leases }}
{{- $name := include "peaket.name" . }}
{{- range $leases }}
# 서비스 파드끼리 리더를 뽑는 Lease(ADR-0105 결정 8, BUILD_ORDER PRF-202). 권한은 자기 네임스페이스의 이 Lease들의 읽기·고치기뿐이다(이름으로 좁힌다, ASVS v5.0.0-13.2.2).
# 만들기는 RBAC가 이름으로 좁히지 못해 주지 않고 차트가 빈 Lease를 미리 만든다(outbox-relay.yaml과 같다). spec을 적지 않아 배포가 보유자를 지우지 않는다.
# 한 파드가 여러 Lease를 잡을 수 있다(합본, BUILD_ORDER PRF-215)
apiVersion: coordination.k8s.io/v1
kind: Lease
metadata:
  name: {{ . }}
  labels: {{- include "peaket.labels" $ | nindent 4 }}
spec: {}
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-leader-lease
  labels: {{- include "peaket.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: {{ toJson $leases }}
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-leader-lease
  labels: {{- include "peaket.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-leader-lease
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
{{- end }}
