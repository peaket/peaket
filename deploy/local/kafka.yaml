# 로컬 Kafka(Strimzi 0.47.0, KRaft, 브로커 겸 컨트롤러 하나, 임시 저장소). 운영 MSK와 같은 Kafka 3.9.x(docs/devops.md §9.4 'Kafka 판', ADR-0141 결정 3).
# Strimzi는 3.9.2 이미지를 내지 않아 3.9.1을 쓴다. 이미지는 Strimzi 0.47.0 릴리스 노트의 다이제스트로 고정한다.
# 자동 토픽 만들기는 끈다(운영과 같다, docs/streaming.md). 시험은 토픽을 먼저 만든다.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: dual
  namespace: kafka
  labels:
    strimzi.io/cluster: peaket
spec:
  replicas: 1
  roles: [controller, broker]
  storage:
    type: ephemeral
  resources:
    requests: { cpu: 250m, memory: 1Gi }
    limits: { memory: 1Gi }
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: peaket
  namespace: kafka
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 3.9.1
    metadataVersion: 3.9-IV0
    image: quay.io/strimzi/kafka:0.47.0-kafka-3.9.1
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      auto.create.topics.enable: false
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
  entityOperator:
    topicOperator: {}
