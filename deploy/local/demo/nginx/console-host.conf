# 관제 콘솔 호스트의 데모 nginx(BAT-087 G1). API 주소는 이미지 빌드 때 굳는다.
# 루트가 아닌 nginx(101)로 8080에서 듣는다. 해시 붙은 자산만 오래 캐시하고 화면 HTML과 원격 진입 파일(remoteEntry.js)은 매번 확인한다.
# 헤더는 운영 배포 응답 헤더 정책과 같은 값이다: staticAppHeaders('console', { origins: { opsApi: 데모 ops-api } })
# (packages/config/headers/security-headers.mjs, docs/frontend.md §5.14.1 묶음 C, OPS-340, ADR-0360 결정 6). 묶음 C CSP는 막는 모드,
# Trusted Types는 보고 모드다. 값을 바꾸려면 security-headers.mjs를 먼저 고치고 이 파일을 같은 글자로 맞춘다.
server {
  listen 8080;
  server_name console.peaket.example;
  root /usr/share/nginx/html;
  index index.html;

  set $peaket_csp "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://ops-api.peaket.example:18444; worker-src 'self'; manifest-src 'self'; form-action 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; report-to csp";
  set $peaket_tt "require-trusted-types-for 'script'; trusted-types peaket peaket-webpack-host peaket-webpack-queue peaket-webpack-purchase peaket-remote default; report-to csp";
  set $peaket_permissions "camera=(), microphone=(), geolocation=(), usb=(), serial=(), hid=(), bluetooth=()";

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  # 원격 위젯(Module Federation): 진입 파일은 매번 확인하고, 해시 붙은 덩어리는 오래 캐시한다
  location ~ ^/remotes/[a-z]+/remoteEntry\.js$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
  }

  location /remotes/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy $peaket_csp always;
    add_header Content-Security-Policy-Report-Only $peaket_tt always;
    add_header Reporting-Endpoints 'csp="/_t/csp"' always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy $peaket_permissions always;
    add_header X-Content-Type-Options "nosniff" always;
  }
}
