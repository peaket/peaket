# 관제 콘솔 호스트의 데모 nginx(BAT-087 G1). API 주소는 이미지 빌드 때 굳는다.
# 루트가 아닌 nginx(101)로 8080에서 듣는다. 해시 붙은 자산만 오래 캐시하고 화면 HTML은 매번 확인한다.
server {
  listen 8080;
  server_name console.peaket.example;
  root /usr/share/nginx/html;
  index index.html;

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
