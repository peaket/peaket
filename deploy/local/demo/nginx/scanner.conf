# 현장 스캐너 PWA의 데모 nginx(BAT-087 G1). 경로 이동은 앱이 하므로 모든 주소에 index.html을 준다(SPA fallback).
# 해시 붙은 자산만 오래 캐시한다. 루트가 아닌 nginx(101)로 8080에서 듣는다.
server {
  listen 8080;
  server_name scanner.peaket.example;
  root /usr/share/nginx/html;
  index index.html;

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://api.peaket.example:18441 https://scanner-api.peaket.example:18445; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://api.peaket.example:18441 https://scanner-api.peaket.example:18445; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
  }
}
