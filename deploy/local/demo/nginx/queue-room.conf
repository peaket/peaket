# 대기실 경량 페이지의 데모 nginx(BAT-087 G1, docs/frontend.md §2.5·§5.1, ADR-0220).
# 셸과 자산은 /_q/ 아래에 있고, 아래 세 정규식만 로케일 셸로 바꾼다. ^/queue/{id}/verify(추가 검증)는 이 앱 화면이 아니라 잡지 않는다.
server {
  listen 8080;
  server_name queue.peaket.example;
  root /usr/share/nginx/html;
  index shell.ko.html;

  location /_q/ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
  }

  location = /_q/preview.html {
    return 404;
  }

  rewrite ^/(en|ja|zh)/queue/[^/]+/?$ /_q/shell.$1.html last;
  rewrite ^/queue/[^/]+/?$ /_q/shell.ko.html last;
  rewrite ^/shop/[^/]+/queue$ /_q/shell.ko.html last;

  location / {
    return 404;
  }
}
