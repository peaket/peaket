# 로컬 관측 최소(docs/observability.md §3 '로컬 관측 최소와 템플릿 대시보드', wbs 1.3.1, BUILD_ORDER BSL-070).
# 운영 관측 스택(wbs 4.1.x) 전에 로컬 측정과 개발에서 서비스 템플릿 지표를 보고 collect.py --prom-url로 읽는다.
# 올리기: node tools/local/cluster.mjs observability (Grafana 관리자 Secret, 대시보드 ConfigMap(deploy/local/dashboards/),
# 프로비저닝 ConfigMap(deploy/platform/observability/grafana/provisioning/의 datasources.yaml·dashboards.yaml)은 그 명령이 만든다. ADR-0356 결정 1·2)
# 이미지는 다이제스트로 고정한다(2026-11-02 확인). 둘 다 클러스터 안 주소만 갖는다.
apiVersion: v1
kind: Namespace
metadata:
  name: observability
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: observability
---
# 파드 목록을 읽는 권한만(수집 대상 찾기)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-pods
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-pods
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-pods
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    scrape_configs:
      # 주석 prometheus.io/scrape: "true"를 단 파드만(공용 서비스 차트가 관리 포트에 단다)
      - job_name: pods
        scrape_interval: 5s
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_phase]
            action: drop
            regex: (Pending|Succeeded|Failed)
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          # 지표 자체의 service 라벨은 덮지 않는다. Node 기본 지표는 이 app 라벨로 고른다
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            target_label: app
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            target_label: component
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: observability
  labels: { app.kubernetes.io/name: prometheus, app.kubernetes.io/component: observability }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: prometheus }
  template:
    metadata:
      labels: { app.kubernetes.io/name: prometheus, app.kubernetes.io/component: observability }
    spec:
      serviceAccountName: prometheus
      securityContext: { runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534, fsGroup: 65534, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: prometheus
          image: prom/prometheus:v3.14.0@sha256:e906cef998316bbe319f98711e1b4d8613ad37e14b08ff831d7036e77b7464f9
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=2d
            - --enable-feature=exemplar-storage
            # 설정을 고쳐 다시 올리면 재시작 없이(emptyDir의 자료를 지우지 않고) 다시 읽는다
            - --enable-feature=auto-reload-config
            - --config.auto-reload-interval=10s
          ports:
            - { name: http, containerPort: 9090 }
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus, readOnly: true }
            - { name: data, mountPath: /prometheus }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: observability
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: prometheus }
  ports:
    - { name: http, port: 9090, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: observability
  labels: { app.kubernetes.io/name: grafana, app.kubernetes.io/component: observability }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: grafana }
  template:
    metadata:
      labels: { app.kubernetes.io/name: grafana, app.kubernetes.io/component: observability }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 472, runAsGroup: 472, fsGroup: 472, seccompProfile: { type: RuntimeDefault } }
      # 시작 전에 펼친다: ① 대시보드 ConfigMap의 '<폴더>__<파일>' 키를 /var/lib/grafana/dashboards/<폴더>/<파일>로(ConfigMap 키에는 /를 못 쓴다)
      # ② 프로비저닝은 기본 조직(orgId 1) 몫만(*.base.yaml). 제한 조직은 Grafana가 뜬 뒤 조직을 만들고(tools/local/grafana-access.mjs)
      #    전체 파일로 바꿔 다시 읽힌다(cluster.mjs observability). 없는 조직의 orgId를 적은 프로비저닝은 Grafana 시작을 실패시킨다
      initContainers:
        - name: unpack
          image: grafana/grafana:13.2.5@sha256:ffeeebf613b00fede764821c5e5b1545fb376aba561ae91c488e91f219adb25a
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p /work/provisioning/datasources /work/provisioning/dashboards /work/dashboards
              cp /src/provisioning/datasources.base.yaml /work/provisioning/datasources/datasources.yaml
              cp /src/provisioning/dashboards.base.yaml /work/provisioning/dashboards/dashboards.yaml
              for f in /src/dashboards/*__*.json; do
                b=$(basename "$f"); d="${b%%__*}"
                mkdir -p "/work/dashboards/$d"
                cp "$f" "/work/dashboards/$d/${b#*__}"
              done
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: provisioning-src, mountPath: /src/provisioning, readOnly: true }
            - { name: dashboards-src, mountPath: /src/dashboards, readOnly: true }
            - { name: provisioning, mountPath: /work/provisioning }
            - { name: dashboards, mountPath: /work/dashboards }
      containers:
        - name: grafana
          image: grafana/grafana:13.2.5@sha256:ffeeebf613b00fede764821c5e5b1545fb376aba561ae91c488e91f219adb25a
          env:
            # 익명 보기만 연다. 로그인 화면을 끄고, 관리자 비밀번호는 cluster.mjs가 만든 Secret에서만 받는다
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer }
            # 익명 보기는 기본 조직(access.yaml의 1번 조직 이름. grafana-access.mjs가 1번 조직 이름을 바꾼다)
            - { name: GF_AUTH_ANONYMOUS_ORG_NAME, value: PEAKET 관측 }
            - { name: GF_AUTH_DISABLE_LOGIN_FORM, value: "true" }
            - { name: GF_SECURITY_ADMIN_USER, value: admin }
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: grafana-admin, key: password } }
            - { name: GF_ANALYTICS_REPORTING_ENABLED, value: "false" }
            - { name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false" }
            - { name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES, value: "false" }
            - { name: GF_NEWS_NEWS_FEED_ENABLED, value: "false" }
          ports:
            - { name: http, containerPort: 3000 }
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts:
            # 프로비저닝(펼친 사본, 제한 조직을 더할 때 전체 파일로 바꿔 쓴다)과 그 원본(ConfigMap)
            - { name: provisioning, mountPath: /etc/grafana/provisioning }
            - { name: provisioning-src, mountPath: /etc/peaket/provisioning, readOnly: true }
            - { name: dashboards, mountPath: /var/lib/grafana/dashboards, readOnly: true }
            - { name: data, mountPath: /var/lib/grafana }
            - { name: tmp, mountPath: /tmp }
      volumes:
        # cluster.mjs observability가 deploy/platform/observability/grafana/provisioning/으로 만든다(기본 조직 몫 *.base.yaml과 전체)
        - name: provisioning-src
          configMap: { name: grafana-provisioning }
        # cluster.mjs observability가 deploy/local/dashboards/<폴더>/<파일>.json으로 만든다(키 '<폴더>__<파일>.json')
        - name: dashboards-src
          configMap: { name: grafana-dashboards }
        - name: provisioning
          emptyDir: {}
        - name: dashboards
          emptyDir: {}
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: observability
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: grafana }
  ports:
    - { name: http, port: 3000, targetPort: http }
