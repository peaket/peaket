  /v1/ops/approval-requests/{approvalId}/approvals:
    post: { operationId: createOpsApprovalRequestApproval, tags: [ops], x-peaket-roles: [commander, cs_lead], summary: "승인(요청자 불가, 실행 직전 관리 계정 재인증). 실행 실패(FAILED) 뒤 다시 부르면 다시 실행", description: "POL-038. FAILED 상태에서 원인을 고친 뒤 승인자가 다시 부르면(실행 직전 재인증, 처리 기한 안) 같은 대상·금액으로 같은 승인을 다시 실행한다. 승인 ID가 멱등키라 두 번 실행되지 않는다. 새 경로는 두지 않는다(docs/planning/03 §2.10, 추천 적용 2026-10-20, ADR-0073). kind FRAUD_ACTION은 요청자가 아니고 가명정보 취급자(PSEUDONYM_HANDLER) 지정이 없으며 지난 90일 [가정] 안에 그 지정을 거둔 적도 없는 commander만 승인·반려한다. ops-svc는 이때 지정 확인 캐시를 쓰지 않고 identity-svc GetAdminDesignations를 바로 부르며, 지정이 있거나 90일 안에 거둔 기록이 있거나 identity-svc가 답하지 않으면 403 fraud-approver-ineligible이다(추천 적용 2026-10-31, ADR-0171). 승인자는 GET /v1/ops/approval-requests/{approvalId}의 fraudCaseSummary를 보고 재인증한 뒤 승인한다(POL-038 ⑪, 추천 적용 2026-10-31, ADR-0171). 사람이 실질적으로 결정하도록(자동화된 결정 안내서 pp.7–8) FRAUD_ACTION 승인에는 세 규칙을 더한다(추천 적용 2026-10-31, ADR-0173). ① 승인자가 자기 판단 이유를 본문 reason에 직접 적는다(없으면 422 approval-reason-required). ② 그 승인자가 상세를 연 적이 없으면(summaryViewedAt 없음) 409 fraud-summary-not-viewed다. ③ 계정·표를 빼서 범위를 줄여 승인할 수 있다(excludeAccountIds·excludeTicketIds). 요청 범위 밖 값이거나 다 빼면 422 approval-scope-invalid이고, 다 빼려면 반려한다. 실행은 요청 범위에서 뺀 것을 덜고 한다. 뺀 계정·표는 그 요청에서 반려한 것으로 보고, 뺀 계정의 양도 잠금은 그 계정을 다룬 다른 열린 조치 요청이 없으면 풀린다. 한 번 부를 때 승인 업무 하나만 승인하고, 여러 사건을 한꺼번에 승인하는 경로는 두지 않는다. 다른 종류의 승인에서 본문은 선택이고 reason만 읽으며 범위 줄이기 칸은 받지 않는다(보내면 422 approval-scope-invalid)", security: [{ opsCookie: [] }], parameters: [{ name: approvalId, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/ReauthToken' }], requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalDecisionBody' } } } }, responses: { '200': { description: "승인 반영", content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalRequest' } } } }, '403': { $ref: '#/components/responses/Problem', description: "요청자 본인·권한 밖, fraud-approver-ineligible(FRAUD_ACTION을 가명정보 취급자 지정이 있거나 90일 안에 거둔 commander가 승인, 또는 identity-svc 무응답)" }, '409': { $ref: '#/components/responses/Problem', description: "fraud-summary-not-viewed(FRAUD_ACTION을 그 승인자가 상세를 열지 않고 승인)" }, '422': { $ref: '#/components/responses/Problem', description: "approval-reason-required(FRAUD_ACTION인데 reason 없음), approval-scope-invalid(요청 범위 밖 계정·표, 다 뺌, FRAUD_ACTION이 아닌데 범위 칸을 보냄)" } } }
