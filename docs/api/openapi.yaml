      summary: "초대 수락: 패스키 등록 마치기(브라우저가 만든 자격 확인)"
      description: "FR-021, POL-020, I-T53 ①, ADR-0206. POST /v1/partner/auth/passkeys와 같은 확인이다: 출처는 파트너 콘솔, RP ID는 partner.peaket.example, 챌린지 일치, 사용자 확인 필수, 받는 서명 방식. 이유는 싣지 않는다. 등록해도 활성화는 POST /v1/partner/auth/invitation-completions에서 한다. 공개키와 자격 ID 원문은 응답에 싣지 않는다. gw-partner가 Origin을 확인한다. Cache-Control: no-store"
      security: []
      requestBody:
        required: true
        content:
