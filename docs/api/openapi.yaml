  /v1/ops/promoters/{promoterId}/contract-term-changes:
    post:
      operationId: createOpsPromoterContractTermChange
      tags: [ops]
      x-peaket-roles: [operator, commander]
      x-peaket-trace-rare: true
      summary: "수수료율·보증 변경 요청 → 승인 업무 CONTRACT_TERMS_CHANGE"
      description: "SCR-065, SCR-046, POL-038, ADR-0060, docs/planning/03 §3 '파트너사·계약' 행. 승인 업무(kind CONTRACT_TERMS_CHANGE, targetRef 파트너사 ID)를 만들고 202로 돌려준다. 요청자가 아닌 commander가 POST /v1/ops/approval-requests/{approvalId}/approvals(재인증)로 승인하면 새 promoter_contract 행이 시작되고 promoter.commission_rate_bp가 바뀐다. 요청 자체에는 재인증을 받지 않는다(승인 쪽에서 본다, createOpsPayoutBatch와 같다). 바뀐 수수료율은 승인 뒤 판매 승인을 받는 공연부터 쓰고, 이미 고정된 공연은 바뀌지 않는다(ADR-0060). 칸은 바꿀 것만 보낸다. 바꿀 칸이 하나도 없으면 422다. POST /v1/ops/approval-requests로 이 종류를 만들면 바꿀 값을 실을 칸이 없으므로 이 경로만 만든다 [가정]"
      security:
        - opsCookie: []
      parameters:
        - name: promoterId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromoterContractTermChangeCreate' }
      responses:
        '202':
          description: "승인 업무를 만들었다(아직 바꾸지 않음)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRequest' }
        '400': { $ref: '#/components/responses/Problem', description: "본문 형식 오류, idempotency-key-invalid" }
        '401': { $ref: '#/components/responses/Unauthorized', description: "액세스 토큰 없음·만료" }
        '403': { $ref: '#/components/responses/Problem', description: "operator·commander가 아님" }
        '404': { $ref: '#/components/responses/Problem', description: "없는 파트너사(not-found)" }
        '409': { $ref: '#/components/responses/Problem', description: "같은 파트너사에 승인 대기 중인 변경이 있음, idempotency-request-in-progress" }
        '422': { $ref: '#/components/responses/Problem', description: "바꿀 칸 없음, 지금 값과 같음, idempotency-key-reused" }
