        '409': { $ref: '#/components/responses/Problem', description: "sale-eligibility-list-locked: 잠금 시각이 지났다(명단은 그대로다), production-suspended: 판매 중지 중인 공연" }
  /v1/partner/seatmap-templates:
    get: { operationId: getPartnerSeatmapTemplates, tags: [partner], x-peaket-roles: [partner_admin, partner_member], summary: "좌석맵 템플릿 목록(코드·이름·계열·기본 좌석·층·구역 수·변형·개략도 주소)", description: "FR-023, 소유자 요청 2026-10-19(목록 10종은 추천 적용 2026-10-19), ADR-0066. 흔한 공연장 모양을 본뜬 출발점이고 실제 공연장의 배치도가 아니며 특정 공연장 이름은 쓰지 않는다. 템플릿은 저장소의 정적 파일을 배포 때 넣고(published인 것만 보인다) 파트너는 읽기만 한다. 기본 좌석 수는 모두 [가정]이다. 스탠딩(정리번호 입장) 구역은 지원하지 않아 플로어는 지정석이다(ADR-0051). 10종이라 페이지를 나누지 않는다. 파트너 소속 계정이면 관리자·실무자 모두", security: [{ partnerCookie: [] }], responses: { '200': { description: 목록, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/SeatmapTemplateSummary' } } } } } } } } }
  /v1/partner/seatmap-templates/{templateId}:
