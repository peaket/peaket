 required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SeatMapLayoutInput' } } } }, responses: { '412': { $ref: '#/components/responses/Problem', description: "If-Match의 layoutVersion이 서버 판과 다름(precondition-failed, 다른 사람이 먼저 저장, 기술 검토 낮음-030). 본문 layoutVersion이 If-Match와 다를 때도 같다(ADR-0260 결정 5)" }, '428': { $ref: '#/components/responses/Problem', description: "If-Match 없음(precondition-required)" }, '200': { description: "저장(새 layoutVersion, 서버가 매긴 색인, 가격 등급, fanFilePublished)", headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/SeatMapLayout' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Problem', description: "partner-admin-required: 승인 이력이 있는 공연의 좌석맵을 파트너 실무자가 저장함(재승인 대상, planning/03 §3)" }, '404': { $ref: '#/components/responses/Problem', description: "not-found: 없는 공연과 다른 파트너 공연(같은 응답, ADR-0257 결정 2와 같다)" }, '503': { $ref: '#/components/responses/ServiceUnavailable', description: "seatmap-publish-unavailable: 팬 좌석맵 파일을 쓰지 못함(판이 오르지 않는다. Retry-After 10초 [가정], ADR-0260 결정 5). 트랜잭션 ①과 ② 사이에 회차가 거듭 늘어 두 번 다시 해도 맞추지 못함(Retry-After 1초 [가정], 추천 적용 2026-11-10 리뷰)" }, '504': { $ref: '#/components/responses/Problem', description: "deadline-exceeded: 팬 좌석맵 파일을 쓰기 직전 요청의 남은 시간이 모자람(남은 시간 − 2초 [가정]이 1초 [가정] 미만, 판은 버린 번호가 되고 파일은 쓰지 않는다, 추천 적용 2026-11-10 리뷰)" }, '429': { $ref: '#/components/responses/TooManyRequests', description: "server-busy: 좌석맵 저장 칸막이(파드당 2 [가정], 본문을 읽기 전에 잡고 처리기가 끝날 때까지 쥔다)가 찼다(Retry-After, 추천 적용 2026-11-10 리뷰)" }, '409': { $ref: '#/components/responses/Problem', description: "오픈 뒤 도형·좌표·좌석 추가·삭제(seatmap-geometry-locked), 오픈 뒤 가격 등급 바꾸기(sale-setting-locked), 판매 중지 중인 공연(production-suspended). 판 불일치는 412다(2026-10-28, 기술 검토 낮음-030)" }, '422': { description: "도형·좌석 검증 오류 목록. Problem(type seatmap-invalid)의 확장 필드 result에 SeatMapImportResult를 싣는다(오류 본문 한 형식, 추천 적용 2026-10-21, ADR-0081)", content: { application/problem+json: { schema: { allOf: [{ $ref: '#/components/schemas/Problem' }, { type: object, properties: { result: { $ref: '#/components/schemas/SeatMapImportResult' } } }] } } } } } }
    post: { operationId: createPartnerProductionSeatmap, tags: [partner], x-peaket-roles: [partner_admin, partner_member], summary: "템플릿에서 만들기(템플릿 도형과 채우기 규칙을 이 공연의 배치본으로 복제)", description: "FR-023, 소유자 요청 2026-10-19(세부는 추천 적용 2026-10-19), ADR-0066. variant는 템플릿 variants에서 고른 값이고, 서버가 targetCapacity(목표 좌석 수)를 구역 비율대로 나눠 구역별 채우기 규칙(fillRule)의 목표 수로 넣는다. 좌석 배치(자동 채우기)는 에디터가 계산해 PUT …/seatmap으로 저장하고 서버가 그때 도형 안·번호 중복을 다시 검사한다(겹침과 도형 밖 좌석은 경고만). 대상은 이 공연의 배치본이고 편집은 그 배치본에만 미친다. templateId는 TEMPLATE 행만 받으므로 다른 파트너의 배치본은 복제할 수 없다. 이미 좌석이 있는 배치본은 replace가 true가 아니면 409이고 화면은 지우고 다시 만들지 확인을 받는다. 배치본을 쓰는 회차가 오픈한 뒤에는 replace와 상관없이 409 seatmap-geometry-locked다. 판매 승인 뒤 바꾸면 다시 승인 대기다(sale-review 설명과 같다). 템플릿은 흔한 모양을 본뜬 출발점이고 실제 공연장의 배치도가 아니다. 파트너 소속 공연만", security: [{ partnerCookie: [] }], parameters: [{ $ref: '#/components/parameters/ProductionId' }], requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [templateId, targetCapacity], properties: { templateId: { type: string, description: "venue kind TEMPLATE의 ID(배치본 ID면 404)" }, variant: { type: object, description: "고를 수 있는 것의 값. 키는 템플릿 variants[].key이고 없으면 기본값", additionalProperties: { type: [string, integer, boolean] } }, targetCapacity: { type: integer, minimum: 1, description: "목표 좌석 수" }, replace: { type: boolean, default: false, description: "이미 좌석이 있는 배치본을 지우고 다시 만들 때 true" } } } } } }, responses: { '201': { description: "만듦(새 layoutVersion, 구역별 fillRule, 좌석은 아직 없음)", content: { application/json: { schema: { $ref: '#/components/schemas/SeatMapLayout' } } } }, '403': { $ref: '#/components/responses/Problem', description: "partner-admin-required: 승인 이력이 있는 공연의 배치본을 파트너 실무자가 바꿈(좌석맵 저장과 같은 규칙, 추천 적용 2026-11-10, ADR-0264 결정 17)" }, '404': { $ref: '#/components/responses/Problem', description: "not-found: 없거나 공개되지 않은 템플릿(배치본 ID 포함), 없는 공연과 다른 파트너 공연(같은 응답, ADR-0257 결정 2와 같다. 추천 적용 2026-11-10, ADR-0264 결정 17)" }, '409': { $ref: '#/components/responses/Problem', description: "seatmap-replace-required(좌석이 있는데 replace가 없음, 지울 좌석 수 existingSeatCount를 싣는다), seatmap-geometry-locked(오픈 뒤 잠긴 배치본)" }, '422': { $ref: '#/components/responses/Problem', description: "변형 값·목표 좌석 수가 템플릿 범위 밖" } } }
  /v1/partner/productions/{productionId}/seatmap-imports:
    post: { operationId: createPartnerProductionSeatmapImport, tags: [partner], x-peaket-roles: [partner_admin, partner_member], summary: "좌석맵 가져오기(SVG/JSON/CSV, 구역 도형과 좌석 좌표를 함께, 행별 검증 결과)", description: "FR-023. SVG는 구역 도형(polygon·path·rect, id·data 속성으로 구역 이름)과 좌석 원(circle의 중심 좌표, data 속성으로 열·번호), JSON은 SeatMapLayout, CSV는 좌석 행(구역·열·번호·x·y·등급·휠체어석·게이트 구역)과 구역 첫 행의 shape 열(꼭짓점 'x y;x y;…')로 받는다(추천 적용 2026-10-14, ADR-0063). 검증만 하고 저장하지 않는다(저장은 PUT …/seatmap). 파일 해석은 core-svc가 하지 않고 DB 자격 증명이 없는 별도 작업 seatmap-worker에 gRPC로 맡긴다(seatmap.proto ParseSeatmapImport). core-svc는 돌려받은 배치를 스키마·개수 상한·업무 경고로 다시 본 뒤 결과를 만든다(소유자 결정 2026-10-30, open-items 70번 ②, 세부는 추천 적용 2026-10-30, docs/features/seat-hold.md §10). 사전 요청이 생기도록 X-Requested-With 헤더가 있어야 받는다(공연 이미지 올리기와 같다, ADR-0257 결정 8)", security: [{ partnerCookie: [] }], parameters: [{ $ref: '#/components/parameters/ProductionId' }, { name: X-Requested-With, in: header, required: true, schema: { type: string } }], requestBody: { required: true, content: { multipart/form-data: { schema: { additionalProperties: false, type: object, required: [file, format], properties: { file: { type: string, format: binary }, format: { type: string, enum: [SVG, JSON, CSV] } } } } } }, responses: { '200': { description: 검증 결과, content: { application/json: { schema: { $ref: '#/components/schemas/SeatMapImportResult' } } } }, '404': { $ref: '#/components/responses/Problem', description: "없는 공연이거나 다른 파트너 공연(not-found, ADR-0257 결정 2)" }, '413': { $ref: '#/components/responses/Problem', description: "파일이 너무 큼(10MB [가정] 초과)이거나 압축 파일(seatmap-import-too-large, 작업을 부르지 않는다)" }, '422': { $ref: '#/components/responses/Problem', description: "seatmap-import-rejected. 해석하지 않은 파일: format과 내용이 다르다, SVG에 <!DOCTYPE이 있다, 좌석 5만·구역 500·꼭짓점 1,000 [가정]을 넘는다, 해석이 CPU 5초 [가정]를 넘었다(seatmap-worker가 REJECTED로 답한 경우, docs/features/seat-hold.md §10, S-T32). 어느 이유인지는 Problem detail에 적는다(추천 적용 2026-10-30). core-svc가 다시 본 배치가 개수 상한을 넘거나 해석한 배치가 응답 상한을 넘어도(LAYOUT_TOO_LARGE) 이 이름이다(S-T34 ⑥, ADR-0257 결정 5·8)" }, '429': { $ref: '#/components/responses/TooManyRequests', description: "파드의 multipart 받기 칸막이(동시 4 [가정], 공연 이미지 올리기와 함께 씀)가 찼다(server-busy, Retry-After, ADR-0257 결정 2)" }, '503': { $ref: '#/components/responses/ServiceUnavailable', description: "seatmap-worker-unavailable. seatmap-worker가 데드라인 10초 [가정] 안에 답하지 않았거나 쓸 수 없다(UNAVAILABLE, 메모리 상한으로 파드가 죽은 경우 포함). Retry-After를 지켜 다시 올린다. 원본은 저장하지 않았으므로 파일을 다시 보낸다(추천 적용 2026-10-30, docs/features/seat-hold.md §10 '실패')" } } }
