    post: { operationId: createOpsCommandPostReview, tags: [ops], x-peaket-roles: [commander], summary: "명령 3·11 사후 검토 보고서 제출(실행한 commander, 실행 뒤 48시간 안)", description: "FR-030, POL-021 A·C(4), 추천 적용 2026-10-14, ADR-0062. 명령 3·11만(명령 3은 추천 적용 2026-10-27, ADR-0095. 명령 3은 인시던트 포스트모템의 한 절로도 쓴다). 실행 기록·정지 동안의 조치·영향·재개는 시스템이 감사 로그와 지표에서 채운다(docs/features/control-tower.md §6). 제출하면 다른 commander에게 검토를 요청한다. 기한을 넘기면 SEV3", security: [{ opsCookie: [] }], parameters: [{ name: commandId, in: path, required: true, schema: { type: string } }], requestBody: { required: true, content: { application/json: { schema: { additionalProperties: false, type: object, required: [trigger, triggerDetail], properties: { trigger: { type: string, enum: [METRIC_OR_INPUT_ERROR, CONTROL_MALFUNCTION, MISHANDLED_EXTERNAL_CAUSE, MONEY_OR_SEAT_SUSPICION, PRICE_OR_DISPLAY_ERROR, SYSTEM_FAILURE, PREVENTIVE_STOP, OTHER], description: "계기. 명령 11: 지표·입력 오류, 자동 제어 동작 오류, 외부 원인에 대한 잘못된 대응. 명령 3: 돈·좌석 의심(오버셀·이중 결제·결제-발권 불일치·위조 통과), 가격·표시 오류, 시스템 장애 대응. 둘 다: 예방 정지(점검·시험), 그 밖. 명령에 맞지 않는 값은 422" }, triggerDetail: { type: string, maxLength: 2000, description: "무엇을 보고 멈췄는지" }, whyNoSecondApproval: { type: string, maxLength: 2000, description: "2인 승인을 기다리지 않은 이유(명령 11은 필수, 빠지면 422. 명령 3은 1인 실행이 규칙이라 쓰지 않는다)" }, actionsNote: { type: string, maxLength: 2000, description: "정지 동안의 조치에 덧붙일 설명(선택)" }, impactNote: { type: string, maxLength: 2000, description: "영향 해석(선택)" }, followUps: { type: array, description: "후속 조치(0개 이상). 자동 제어 규칙이나 임계값을 바꿔야 하면 결정 기록이나 ADR로 잇는다", items: { additionalProperties: false, type: object, properties: { task: { type: string }, owner: { type: string }, dueDate: { type: string, format: date }, issueUrl: { type: string, format: uri } } } } } } } } }, responses: { '201': { description: "제출됨(검토 요청)" }, '403': { $ref: '#/components/responses/Problem', description: "실행한 commander가 아님" }, '409': { $ref: '#/components/responses/Problem', description: "명령 3·11이 아니거나 이미 제출함" }, '422': { $ref: '#/components/responses/Problem', description: "계기 값이 명령에 맞지 않음, 또는 명령 11인데 whyNoSecondApproval이 없음" } } }
  /v1/ops/commands/{commandId}/post-review-confirmation:
