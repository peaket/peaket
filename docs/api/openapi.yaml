    delete: { operationId: deletePartnerProductionImage, tags: [partner], x-peaket-roles: [partner_admin, partner_member], summary: "공연 이미지 지우기(파생본 삭제와 CDN 무효화)", description: "FR-022(추천 적용 2026-10-14, ADR-0063). 포스터는 지울 수 없고 바꾸기만 한다(판매 승인 요청에 포스터 필수). 판매 승인 뒤 지워도 재승인 대상이 아니다(docs/planning/03 §2.14)", security: [{ partnerCookie: [] }], parameters: [{ $ref: '#/components/parameters/ProductionId' }, { name: imageId, in: path, required: true, schema: { type: string } }], responses: { '204': { description: 지움 }, '403': { $ref: '#/components/responses/Problem', description: "파트너 관리자·실무자가 아닌 계정(역할 가드, x-peaket-roles). 다른 파트너 공연은 403이 아니라 없는 것과 같은 404다(ADR-0257 결정 2)" }, '404': { $ref: '#/components/responses/Problem', description: "없는 이미지·공연이거나 다른 파트너 공연(not-found, ADR-0257 결정 2)" }, '409': { $ref: '#/components/responses/Problem', description: "포스터는 지우지 않고 바꾼다(poster-not-deletable)" } } }
  /v1/partner/products:
    post:
      operationId: createPartnerProduct
      tags: [partner]
      x-peaket-roles: [partner_admin, partner_member]
      summary: "상품 빌더 저장(PostgreSQL product 표, 유형별 속성은 Zod 스키마로 검사하는 JSONB)"
      description: "FR-024, ADR-0101(ADR-0013의 MongoDB를 대신함, 2026-10-28). 공통 칸과 돈(가격·배송비·반품 배송비)은 칸, 유형마다 다른 속성만 attributes에 둔다. 유형은 product_type 목록에 있어야 하고 schema_version 판의 스키마를 통과해야 저장한다. status PUBLISHED면 게시하고, DRAFT면 목록에 초안으로 남는다. 중개수수료율은 게시할 때 그 파트너의 계약값으로 고정한다(ADR-0062). Cache-Control: no-store"
      security:
        - partnerCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PartnerProductCreate' }
      responses:
        '201':
          description: 상품
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartnerProductDetail' }
        '400': { $ref: '#/components/responses/Problem', description: "본문 형식 오류" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Problem', description: "유형별 속성·판매 기간·수령 방식이 규칙과 맞지 않음" }
    get:
      operationId: listPartnerProducts
      tags: [partner]
      x-peaket-roles: [partner_admin, partner_member]
      summary: "상품 목록(SCR-023 [상품 목록], 유형·상태·표시 가격의 재료·재고·판매 기간·연결 공연)"
      description: "FR-024, POL-016, SCR-023, docs/design/d5 §1.6 16번. 소속 파트너의 상품만 준다(product.promoter_id, authz-matrix §3.3). status는 저장 값(DRAFT·PUBLISHED·HIDDEN)과 판매 기간·재고로 계산한 값이다(docs/data.md product). 표시 가격(총금액 규칙, docs/design/d5 §5.15 ⑬)은 화면이 price·shippingFee·fulfillments로 그린다. [가정] 화면의 네 상태(판매 전·판매 중·품절·숨김) 밖에 초안 DRAFT와 판매 기간이 끝난 ENDED를 둔다. [가정] 연결 공연은 부가 상품이면 linked_event_id의 공연, 굿즈면 수령 시간대(pickup_slot)의 공연이고, 없으면 null이다. 정렬은 최근 고친 순 [가정]. 상품 고치기(SCR-023 [ 고치기 ])의 경로는 §1.6 16번에 없어 이 초안에 넣지 않았다. 커서 페이징. Cache-Control: no-store"
      security:
        - partnerCookie: []
      parameters:
        - { name: ticketLinked, in: query, required: false, description: "칩 값: true면 티켓 연동 부가 상품, false면 굿즈, 없으면 전체", schema: { type: boolean } }
        - { name: status, in: query, required: false, style: form, explode: false, description: "상품 상태(쉼표로 여러 값)", schema: { type: array, items: { type: string, enum: [DRAFT, NOT_STARTED, ON_SALE, SOLD_OUT, ENDED, HIDDEN] } } }
        - { name: linkedProductionId, in: query, required: false, description: "연결 공연", schema: { type: string, format: uuid } }
        - { name: q, in: query, required: false, description: "상품 이름 찾기(부분 일치)", schema: { type: string, minLength: 1, maxLength: 100 } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: 상품 한 페이지
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartnerProductPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
