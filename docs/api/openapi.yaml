      description: "FR-056, POL-019, ADR-0046 결정 5, SCR-043, docs/design/d5 §1.6 18번. 그 주문의 결제자 본인만 읽는다. 남의 건과 없는 건은 같은 404다. Cache-Control: private, no-store"
