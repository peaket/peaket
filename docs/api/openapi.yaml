      description: "FR-027, FR-062, POL-039, SCR-027, docs/planning/03 §3 '정산 리포트는 모두', docs/design/d5 §1.6 16번. 소속 파트너의 회차만 준다. 금액 항목은 판매 대금·환급·중개수수료·배상 상계·보증 충당·청구 내역과 결제사별 상태·지급 예정일·지급 결과다(FR-027). 계좌는 은행과 끝 4자리만, 배상은 대상 수와 합계만이고 사람 단위 값·결제사 내부 ID·결제사 오류 원문은 없다(authz-matrix §4.1, settlement §9). CSV·XLSX는 수식으로 읽힐 첫 글자를 막는다(guidelines §9). [가정] 개인정보가 없어 사유·재인증을 받지 않는다. 내보낸 기록(사람·형식·시각)을 남기므로 예매자 명단과 같은 POST이고 파일을 다시 돌려줄 수 없어 멱등 키를 받지 않는다. 판매 요약 탭의 내려받기는 §1.6 16번에 없어 이 초안에 넣지 않았다"
