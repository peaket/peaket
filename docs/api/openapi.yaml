      description: "FR-011, POL-036, ADR-0044. 결제창을 열기 직전에 부른다. 선택 순서는 결제사 전환, 공연 지정, 플랫폼 기본. 접수 전의 이전 시도는 SUPERSEDED. 승인 요청을 보낸 주문은 409. 고른 결제사 채널이 서버 승인을 지원하지 않거나 비활성이면, 또 결제사 장애·채널 호출 상한으로 새 결제 진입을 멈춘 동안이면 503(새 결제 일시 정지, payment §2.2·§9. 이 동안 주문을 만들고 결제 접수 전인 홀드의 남은 시간은 멈춘다, ADR-0085). 같은 멱등 키의 재생은 처음 시도의 결제사로 결제창 값을 다시 만든다(추천 적용 2026-11-09, BUILD_ORDER PRF-191, guidelines §4). 구매 세션 요청 서명 필수"
      security: [{ fanCookie: [], admissionToken: [] }]
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/PurchaseSeq' }, { $ref: '#/components/parameters/PurchaseMac' }]
      requestBody: { content: { application/json: { schema: { additionalProperties: false, type: object, properties: { payMethod: { type: string, description: "포트원 채널 선택에 쓰는 결제수단. 토스는 위젯 안에서 고르므로 생략. CARD·EASY_PAY·TRANSFER·VIRTUAL_ACCOUNT·MOBILE만 받고 아니면 400이다(서버 검사, 추천 적용 2026-11-09, BUILD_ORDER PRF-191). 본문이 없으면 400이라 칸이 없어도 빈 객체를 보낸다" }, behavior: { $ref: '#/components/schemas/BehaviorSummary', description: "결제 화면에서 잰 행동 요약(선택). purchase-svc가 BehaviorSignal(screen PAYMENT)로 내고 실시간 판정에는 쓰지 않는다. 같은 주문의 두 번째 시도부터는 싣지 않는다(추천 적용 2026-10-31, ADR-0171 결정 4)" } } } } } }
      responses: { '404': { $ref: '#/components/responses/Problem', description: "주소의 주문이 이 구매 세션에서 만든 주문이 아니다(남의 주문, 다른 회차·다른 구매 세션의 주문, 없는 주문을 가리지 않고 같은 404, guidelines §12 '개인·거래 기록', 추천 적용 2026-10-30, docs/features/seat-hold.md §2)" }, '401': { $ref: '#/components/responses/Unauthorized', description: "팬 쿠키 없음·만료(about:blank, 화면은 토큰을 한 번 갱신한다), 입장 토큰 없음·만료이거나 구매 세션이 없거나 끝남(purchase-session-ended), 구매 세션 요청 서명 머리 없음·형식·불일치(purchase-signature-invalid), 일련번호 재사용(purchase-seq-reused). 어느 머리가 틀렸는지는 싣지 않는다. 화면 처리는 docs/frontend.md §4.1 '401'(BAS-040)" }, '415': { $ref: '#/components/responses/Problem', description: "application/json이 아닌 본문" }, '201': { description: 결제 시도, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentAttempt' } } } }, '400': { $ref: '#/components/responses/Problem', description: "허용 밖 칸, 허용 밖 결제수단, 가상계좌를 끈 회차의 VIRTUAL_ACCOUNT(첫 요청만이다. 같은 키의 재생은 400이 아니라 503이다), 본문 없음(추천 적용 2026-11-09, BUILD_ORDER PRF-191, 코드 리뷰)" }, '409': { $ref: '#/components/responses/Problem', description: "승인 요청을 이미 보낸 주문(payment-already-accepted), 같은 주문의 결제 시도 3회 [가정] 초과(payment-attempts-exceeded, 시도 행 수로 잰다, payment §4.2), 결제하지 않아 만료된 주문(order-expired, ADR-0107)" }, '423': { $ref: '#/components/responses/Problem', description: "판매 일시정지(명령 3)" }, '429': { $ref: '#/components/responses/TooManyRequests', description: "게이트웨이 로컬 한도 초과, 또는 purchase-svc 파드의 자기 과부하(server-busy, docs/architecture.md §5)" }, '503': { $ref: '#/components/responses/ServiceUnavailable', description: "결제사 사용 불가(pg-unavailable: 고른 결제사를 쓸 수 없거나 결제창 준비가 시간 안에 끝나지 않거나 파드당 동시 호출 상한을 넘음, Retry-After 2초 [가정], 추천 적용 2026-11-09, BUILD_ORDER PRF-191, 코드 리뷰), 새 결제 일시 정지(new-payment-paused, Retry-After 5초 [가정], 추천 적용 2026-11-09, BUILD_ORDER PRF-201). Problem의 holdRemainingSeconds에 멈춘 홀드 남은 시간(ADR-0085, 홀드 만료를 읽지 못하면 칸을 뺀다). 시도를 만들지 않는다. 또는 좌석 Redis 장애 조치 중이거나 그 회차 좌석 저장소가 준비되지 않음(Problem type seat-store-unavailable, Retry-After 2초 [가정], ADR-0121), 결제창 준비의 설정 오류(dependency-unavailable). type으로 가른다" }, '504': { $ref: '#/components/responses/Problem', description: "좌석 Redis나 payment-svc를 부르기 전에 요청의 남은 시간이 모자라 부르지 않았다(Problem type deadline-exceeded, Retry-After 없음. 시도를 만들지 않는다, 추천 적용 2026-11-09, BUILD_ORDER PRF-191, guidelines §5)" } }
  /v1/orders/{orderId}/payment-acceptance:
    post:
      operationId: createOrderPaymentAcceptance
      tags: [orders]
      x-peaket-roles: [fan]
      summary: 결제 접수(202). 결제사별 본문(토스 paymentKey·amount, 포트원 paymentId·paymentToken·txId)
      description: "FR-011, NFR-005 p99 150ms. pg와 활성 결제 시도의 결제사 대조(다르면 409) → 토스는 amount 대조, 포트원은 paymentId 대조 → 결제 참조 저장 → Saga 시작. 결제사 호출은 응답 밖(ADR-0015). 접수 뒤 주문은 그 결제사에 고정(ADR-0044). 구매 세션 요청 서명 필수"
      security: [{ fanCookie: [], admissionToken: [] }]
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/PurchaseSeq' }, { $ref: '#/components/parameters/PurchaseMac' }]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/PaymentAccept' } } } }
      responses: { '404': { $ref: '#/components/responses/Problem', description: "주소의 주문이 이 구매 세션에서 만든 주문이 아니다(남의 주문, 다른 회차·다른 구매 세션의 주문, 없는 주문을 가리지 않고 같은 404, guidelines §12 '개인·거래 기록', 추천 적용 2026-10-30, docs/features/seat-hold.md §2)" }, '202': { description: 접수됨 }, '415': { $ref: '#/components/responses/Problem', description: "application/json이 아닌 본문" }, '401': { $ref: '#/components/responses/Unauthorized', description: "팬 쿠키 없음·만료(about:blank, 화면은 토큰을 한 번 갱신한다), 입장 토큰 없음·만료이거나 구매 세션이 없거나 끝남(purchase-session-ended), 구매 세션 요청 서명 머리 없음·형식·불일치(purchase-signature-invalid), 일련번호 재사용(purchase-seq-reused). 어느 머리가 틀렸는지는 싣지 않는다. 화면 처리는 docs/frontend.md §4.1 '401'(BAS-040)" }, '400': { $ref: '#/components/responses/Problem', description: 금액 불일치·허용 밖 필드 }, '409': { $ref: '#/components/responses/Problem', description: "활성 결제 시도가 없거나 attemptId·결제사·paymentId 불일치(payment-attempt-mismatch), 또는 같은 주문을 다른 탭·기기에서 이미 접수함(payment-already-accepted, payment §4.2 2번), 결제하지 않아 만료된 주문(order-expired, 결제사 승인을 부르지 않는다, ADR-0107). 이름은 추천 적용 2026-11-05(docs/features/payment.md §2 '결제 접수의 첫 구현')" }, '423': { $ref: '#/components/responses/Problem', description: "판매 일시정지(명령 3)" }, '429': { $ref: '#/components/responses/TooManyRequests', description: "게이트웨이 로컬 한도 초과, 또는 purchase-svc 파드의 자기 과부하(server-busy, docs/architecture.md §5)" }, '503': { $ref: '#/components/responses/ServiceUnavailable', description: "좌석 Redis 장애 조치 중이거나 그 회차 좌석 저장소가 준비되지 않음(Problem type seat-store-unavailable, Retry-After 2초 [가정], ADR-0121)" }, '504': { $ref: '#/components/responses/Problem', description: "좌석 Redis를 부르기 전에 요청의 남은 시간(x-peaket-deadline-ms)이 5ms [가정] 미만이라 부르지 않았다(Problem type deadline-exceeded, Retry-After 없음). 접수하지 않는다(추천 적용 2026-11-05, guidelines §5, docs/features/payment.md §2 '결제 접수의 첫 구현')" } }
  /v1/orders/{orderId}/payment-status:
    get:
      operationId: getOrderPaymentStatus
      x-peaket-timeout: longpoll  # api-client 시간 초과 30초(서버 상한 25초 + 5초, docs/frontend.md §4.1 '시간 초과', BAS-041)
      tags: [orders]
      x-peaket-roles: [fan]
      summary: 결제 결과 long polling(최대 25초 [가정] 대기, 추천 적용 2026-10-28, 기술 검토 중간-047)
      description: "FR-011, NFR-006 확정 p99 3초(Degraded 60초). UNKNOWN은 조회 API로 확정 후 알림. 서버는 결과가 정해지면 바로, 아니면 25초 [가정]에 그때의 상태로 답한다. api 배포의 CloudFront 원본 응답 시간 초과(기본 30초)보다 짧게 두어, CloudFront가 같은 GET을 원본에 다시 보내지 않게 한다. gw-fan 경로 시간 초과 27초 [가정], 브라우저 시간 초과 30초 [가정](docs/infra.md §4.1). 처음 상한 30초는 추천 적용 2026-10-09"
      security: [{ fanCookie: [] }]
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: 상태, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentStatus' } } } }, '404': { $ref: '#/components/responses/Problem', description: "그 계정의 주문이 아니거나 없는 주문(같은 404, not-found, 추천 적용 2026-11-05, docs/features/payment.md §2 '결제 결과 long polling의 첫 구현')" }, '409': { $ref: '#/components/responses/Problem', description: "결제를 아직 접수하지 않은 주문(payment-not-accepted: CREATED·AUTHENTICATED), 결제하지 않아 만료된 주문(order-expired)" }, '401': { $ref: '#/components/responses/Unauthorized', description: 팬 쿠키 없음·만료 }, '429': { $ref: '#/components/responses/TooManyRequests', description: "게이트웨이 로컬 한도 초과, 또는 purchase-svc 파드의 자기 과부하(server-busy, docs/architecture.md §5)" }, '504': { $ref: '#/components/responses/Problem', description: "게이트웨이 경로 시간 초과 27초 [가정](서버가 답하지 못함, P-T44 ④)" } }
  /v1/tickets:
    get:
      operationId: listTickets
      tags: [tickets]
      x-peaket-roles: [fan]
      summary: 마이 티켓 목록(월렛)
      description: "FR-012. 목록은 커서로 나눈다(guidelines §3). 월렛의 기기 저장은 nextCursor가 없을 때까지 받는다(추천 적용 2026-10-21, ADR-0081)"
      security: [{ fanCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { description: 티켓 한 페이지, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Ticket' } }, nextCursor: { type: [string, 'null'] } } } } } } }
  /v1/tickets/{ticketId}/device-keys:
    post:
      operationId: createTicketDeviceKey
      tags: [tickets]
      x-peaket-roles: [fan]
      summary: 기기 공개키 등록(입장용 휴대폰 등록·재발급·부스). 이전 키 폐기
      description: "FR-012, POL-018, ADR-0025, ADR-0050 결정 2, ADR-0051 결정 10·11. ISSUE는 월렛의 '이 휴대폰을 입장용으로 등록'에서만 부르고, 입장 시작 뒤 ISSUE는 재인증 토큰이 있어야 하며 계정 이메일로 알린다. 이미 유효 키가 있으면 ISSUE도 첫 등록이 아니므로 재인증이 필요하고 REISSUE와 같은 24시간 1회 한도를 따른다. REISSUE는 입장 시작 전에만, 소셜 제공자 재인증 토큰이 있어야 하고 티켓당 24시간에 1회까지다. 재발급하면 계정 이메일과 이전 기기에 알린다. 입장 시작 뒤 REISSUE는 403이고 BOOTH만 된다. BOOTH는 그 티켓의 부스 허용(POST /v1/scanner/booth-authorizations)이 있고 허용 뒤 10분 안일 때만 된다. TRANSFER는 양도 수락·돌려주기·양도 회수로 보유자가 바뀐 뒤 새 보유자가 같은 버튼으로 처음 등록할 때이고 ISSUE와 같은 규칙을 따른다(키는 등록 버튼으로만 만든다). 등록·폐기는 scanner_change에 남는다. 응답에 keyId(SPKI SHA-256 앞 8바이트)를 준다"
      security: [{ fanCookie: [] }]
      parameters: [{ name: ticketId, in: path, required: true, schema: { type: string } }, { name: X-Reauth-Token, in: header, required: false, description: "REISSUE와 입장 시작 뒤 ISSUE일 때 필수(guidelines §7)", schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { additionalProperties: false, type: object, required: [publicKeyJwk, reason], properties: { publicKeyJwk: { type: object, additionalProperties: false, required: [kty, crv, x, y], description: "기기 공개키(P-256, RFC 7517 JWK). 브라우저 crypto.subtle.exportKey('jwk')가 내는 칸(ext·key_ops)까지만 받고, 개인키 칸(d)이 섞이면 정의 밖 칸이라 400이다(BAS-040)", properties: { kty: { type: string, enum: [EC] }, crv: { type: string, enum: [P-256] }, x: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }, y: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }, ext: { type: boolean }, key_ops: { type: array, maxItems: 2, items: { type: string, enum: [verify] } }, alg: { type: string, enum: [ES256] } } }, reason: { type: string, enum: [ISSUE, REISSUE, TRANSFER, BOOTH] }, boothRequestId: { type: string, description: "BOOTH일 때 필수" } } } } } }
      responses: { '201': { description: "등록됨(keyId)", content: { application/json: { schema: { type: object, required: [keyId], properties: { keyId: { type: string, description: "QR v1 keyId(base64url 8바이트)" } } } } } }, '403': { $ref: '#/components/responses/Problem', description: "입장 시작 뒤 온라인 재발급(현장 부스 안내)·재인증 없음·부스 허용 없음 또는 10분 지남·결제자 그대로인데 TRANSFER(reauth-required·booth-not-authorized·transfer-not-allowed)" }, '404': { $ref: '#/components/responses/Problem', description: "티켓이 없거나 보유자가 아님(not-found)" }, '422': { $ref: '#/components/responses/Problem', description: "공개키가 P-256 곡선 위의 점이 아님(invalid-device-key)" }, '429': { $ref: '#/components/responses/TooManyRequests', description: "24시간 재발급 한도 초과(고객센터 안내)" } }
  /v1/tickets/{ticketId}/booth-requests:
    post: { operationId: createTicketBoothRequest, tags: [tickets], x-peaket-roles: [fan], summary: "부스 재발급 요청(입장 시작 뒤, 보유자). 부스 본인확인 대조 결과로 부스 코드(8자, 10분)를 받는다", description: "FR-066, ADR-0051 결정 11. reverificationToken은 POST /v1/identity/booth-reverifications 결과(ci_hmac 일치)다. 티켓당 하루 3회 [가정]", security: [{ fanCookie: [] }], parameters: [{ name: ticketId, in: path, required: true, schema: { type: string } }], requestBody: { content: { application/json: { schema: { additionalProperties: false, type: object, required: [reverificationToken], properties: { reverificationToken: { type: string } } } } } }, responses: { '201': { description: "부스 요청(boothRequestId, 부스 코드 QR 문자열, 만료 시각)" }, '409': { $ref: '#/components/responses/Problem', description: "입장 시작 전(온라인 재발급 안내)·대조 불일치" }, '429': { $ref: '#/components/responses/TooManyRequests', description: "하루 요청 한도 초과" } } }
  /v1/identity/booth-reverifications:
