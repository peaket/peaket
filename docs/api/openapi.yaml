    post: { operationId: createScannerBoothAuthorization, tags: [scanner], x-peaket-roles: [gate_lead], summary: "부스 재발급 허용(현장 책임자가 관객 화면의 부스 코드를 찍음). 그 티켓의 BOOTH 등록을 10분 허용", description: "FR-066, ADR-0050 결정 2, ADR-0051 결정 11. 코드는 8자·10분·한 번. 책임자당 10분 5회 실패 제한 [가정]", security: [{ deviceDpop: [], staffToken: [] }, { deviceMtls: [], staffToken: [] }],requestBody: { content: { application/json: { schema: { additionalProperties: false, type: object, required: [boothCode], properties: { boothCode: { type: string } } } } } }, responses: { '200': { description: "허용(티켓의 좌석 표시, 허용 끝 시각)" }, '403': { $ref: '#/components/responses/Problem', description: "책임자 아님·다른 회차" }, '410': { $ref: '#/components/responses/Problem', description: "코드 만료·사용됨" } } }
  # ── 1. 굿즈 결제 ─────────────────────────────────────────────
  /v1/shop/orders/{orderId}/payments:
    post:
      operationId: createShopOrderPayment
      tags: [shop]
      x-peaket-roles: [fan]
      security: [{ fanCookie: [] }]
      summary: "굿즈 주문의 결제 시도 시작(결제사 선택, 결제창 값 발급)"
      description: "FR-015, POL-014, POL-016, ADR-0044, ADR-0062, ADR-0107 결정 4, docs/frontend.md §6.2 30번. 티켓의 POST /v1/orders/{orderId}/payments와 같은 일을 하되, 입장 토큰과 구매 세션 서명을 받지 않는다. 그 둘은 좌석 구매 세션을 지키는 값인데 굿즈 주문에는 구매 세션이 없고, 인기 MD의 입장 토큰은 주문 생성(POST /v1/shop/orders)에서 이미 확인했기 때문이다 [가정]. 팬 쿠키로만 받고, 주문 계정이 세션 계정의 계정 묶음에 들 때만 처리한다(authz-matrix §3.2). 받는 곳은 gw-fan → core-svc shop 모듈 [가정]이다. 결제 상점은 주문의 paymentStore대로 고른다: ESCROW(택배)면 에스크로 상점 값과 TossCheckout.escrowProducts를 싣고 useEscrow는 넣지 않아 구매자가 고르게 한다(docs/features/payment.md §6, POL-014). 응답의 PaymentAttempt.holdExpiresAt은 싣지 않는다(좌석 홀드가 없다). 재고 예약 시각은 주문의 stockReservedUntil이고, 결제 시도 시작은 이 시각을 늘리지 않는다(결제 접수 때 승인 기한까지 늘어난다, ADR-0107 결정 4). 결제사 장애로 새 결제를 멈춰도 재고 예약 시간은 멈추지 않는다 [가정](ADR-0085의 시간 멈춤은 좌석 홀드 규칙이다). 접수 전의 이전 시도는 SUPERSEDED다(ADR-0044) ESCROW 주문은 토스페이먼츠로만 결제한다. 다른 결제사로 전환하면 구매자의 에스크로 선택권이 사라지므로, 토스를 쓸 수 없으면 503이다(payment.md 결제대금예치 선택권)."
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              type: object
              properties:
                payMethod: { type: string, maxLength: 32, description: "포트원 채널 선택에 쓰는 결제수단. 토스는 위젯 안에서 고르므로 뺀다. 32자 상한은 [가정]" }
      responses:
        '201': { description: 결제 시도, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentAttempt' } } } }
        '400': { $ref: '#/components/responses/Problem', description: "본문 형식 오류, 모르는 칸" }
        '401': { $ref: '#/components/responses/Unauthorized', description: "팬 쿠키 없음·만료" }
        '404': { $ref: '#/components/responses/Problem', description: "없는 주문이거나 이 계정 묶음의 주문이 아니다(같은 404, not-found, guidelines §12 '개인·거래 기록')" }
        '409': { $ref: '#/components/responses/Problem', description: "승인 요청을 이미 보낸 주문(payment-already-accepted), 같은 주문의 결제창 단계 실패 3회 [가정] 초과(payment-attempts-exceeded), 재고 예약이 끝나 만료된 주문(order-expired, ADR-0107)" }
        '415': { $ref: '#/components/responses/Problem', description: "application/json이 아닌 본문" }
        '429': { $ref: '#/components/responses/TooManyRequests', description: "게이트웨이 로컬 한도 초과, 또는 서비스 파드의 자기 과부하(server-busy)" }
        '503': { $ref: '#/components/responses/ServiceUnavailable', description: "결제사 사용 불가(새 결제 일시 정지, payment §2.2·§9). 티켓과 달리 holdRemainingSeconds를 싣지 않는다" }
  /v1/shop/orders/{orderId}/payment-acceptance:
    post:
      operationId: createShopOrderPaymentAcceptance
      tags: [shop]
      x-peaket-roles: [fan]
      security: [{ fanCookie: [] }]
      summary: "굿즈 주문의 결제 접수(202). 결제사별 본문은 티켓과 같다"
      description: "FR-015, NFR-025, ADR-0015, ADR-0044, ADR-0107 결정 4, P-T42, docs/frontend.md §6.2 30번. 활성 결제 시도의 결제사와 대조하고(다르면 409) 토스는 amount, 포트원은 paymentId를 대조한 뒤 결제 참조를 저장하고 승인 명령을 낸다. 결제사 호출은 응답 밖이다(ADR-0015). 접수 때 재고 예약을 그 결제의 승인 기한(인증 + 10분)까지 늘린다. 재고 예약 만료 작업과 경합하면 하나만 이긴다(P-T42 ③). 승인 직전에 PostgreSQL product_stock을 조건부로 확정한다(data.md §4 5). 지금 payment-svc ConfirmPayment는 event_id가 필수이고 payment.event_id가 NOT NULL이라 굿즈 주문을 받지 못한다. LCH-010이 event_id 필수를 풀거나 다른 길을 정한 뒤에야 이 작업이 동작한다(docs/features/payment.md §2 '받는 주문', BUILD_ORDER LCH-010)"
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentAccept' } } } }
      responses:
        '202': { description: 접수됨 }
        '400': { $ref: '#/components/responses/Problem', description: "금액 불일치, 허용 밖 칸" }
        '401': { $ref: '#/components/responses/Unauthorized', description: "팬 쿠키 없음·만료" }
        '404': { $ref: '#/components/responses/Problem', description: "없는 주문이거나 이 계정 묶음의 주문이 아니다(같은 404, not-found)" }
        '409': { $ref: '#/components/responses/Problem', description: "활성 결제 시도가 없거나 결제사·paymentId 불일치(payment-attempt-mismatch), 다른 탭·기기에서 이미 접수함(payment-already-accepted), 재고 예약이 끝나 만료된 주문(order-expired, 결제사 승인을 부르지 않는다)" }
        '415': { $ref: '#/components/responses/Problem', description: "application/json이 아닌 본문" }
        '429': { $ref: '#/components/responses/TooManyRequests', description: "게이트웨이 로컬 한도 초과, 또는 서비스 파드의 자기 과부하(server-busy)" }
        '503': { $ref: '#/components/responses/ServiceUnavailable', description: "재고 저장소나 결제 서비스를 잠시 쓸 수 없다(dependency-unavailable)" }
  /v1/shop/orders/{orderId}/payment-status:
    get:
      operationId: getShopOrderPaymentStatus
      x-peaket-timeout: longpoll
      tags: [shop]
      x-peaket-roles: [fan]
      security: [{ fanCookie: [] }]
      summary: "굿즈 결제 결과 long polling(최대 25초 [가정] 대기)"
      description: "FR-015, ADR-0044, docs/frontend.md §6.2 30번. 티켓의 GET /v1/orders/{orderId}/payment-status와 같은 규칙이다. 결과가 정해지면 바로, 아니면 25초 [가정]에 그때의 상태로 답한다. 이 경로에도 gw-fan 경로 시간 초과 27초 [가정]와 브라우저 시간 초과 30초를 준다(docs/infra.md §4.1). 입금 계좌 전체 번호는 입금 대기 응답인 이 경로에만 싣는다(구매자에게 입금처로 알리는 값이고 구매자 계좌가 아니다, authz-matrix §4.1 '결제 상태'). Cache-Control: private, no-store"
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 상태, content: { application/json: { schema: { $ref: '#/components/schemas/ShopPaymentStatus' } } } }
        '401': { $ref: '#/components/responses/Unauthorized', description: "팬 쿠키 없음·만료" }
        '404': { $ref: '#/components/responses/Problem', description: "없는 주문이거나 이 계정 묶음의 주문이 아니다(같은 404, not-found)" }
        '409': { $ref: '#/components/responses/Problem', description: "결제를 아직 접수하지 않은 주문(payment-not-accepted), 재고 예약이 끝나 만료된 주문(order-expired)" }
        '429': { $ref: '#/components/responses/TooManyRequests', description: "요청 한도 초과" }
        '504': { $ref: '#/components/responses/Problem', description: "게이트웨이 경로 시간 초과 27초 [가정](deadline-exceeded)" }
  /v1/orders/{orderId}:
    get:
      operationId: getOrder
      tags: [orders]
      x-peaket-roles: [fan]
      security: [{ fanCookie: [] }]
      summary: "내 예매 주문 상세(예매 확인서, 결제 결과 화면의 예매번호·결제 금액)"
      description: "FR-011, FR-053, POL-032, POL-037, SCR-012, SCR-055, docs/design/d5 §1.6 2번. 결제 결과 화면과 예매 확인서가 읽는다. 주문 계정이 세션 계정의 계정 묶음에 들어야 한다(authz-matrix §3.2). 결제 상태의 긴 기다림은 GET /v1/orders/{orderId}/payment-status가 맡고 이 경로는 바로 답한다. 카드번호와 계좌 전체는 싣지 않는다. 가상계좌 입금 번호는 입금 대기일 때 payment-status로 읽는다. Cache-Control: private, no-store"
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 상세, content: { application/json: { schema: { $ref: '#/components/schemas/OrderDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthorized', description: "로그인 필요" }
        '404': { $ref: '#/components/responses/Problem', description: "없는 주문이거나 이 계정 묶음의 주문이 아니다(같은 404, not-found)" }
  /v1/shop/orders/{orderId}:
    get:
      operationId: getShopOrder
      tags: [shop]
      x-peaket-roles: [fan]
      security: [{ fanCookie: [] }]
      summary: "내 굿즈·부가 상품 주문 상세(항목 상태, 배송, 교환권, 구매 확정 상태, 취소·반품 가능 여부)"
      description: "FR-014, FR-015, POL-014, POL-016, POL-037, SCR-055, docs/design/d5 §1.6 2번·§5.29, docs/planning/03 §2.13. 구매 확정 상태는 escrow와 purchaseConfirmedAt으로 읽는다. 구매 확정은 구매자가 토스페이먼츠 이메일에서 하고, 3영업일 동안 고르지 않으면 자동 확정된다(결제사 상태). 그래서 PEAKET에 구매 확정을 쓰는 팬 경로는 없다. 배송 정보 등록도 팬 경로가 아니다: 판매자가 송장을 등록하고(SCR-023 [배송·반품 처리], d5 §1.6 16번) 그때 서버가 결제사에 배송 정보를 등록한다(payment §6). 팬은 items[].shipment로 읽기만 한다. Cache-Control: private, no-store"
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 상세, content: { application/json: { schema: { $ref: '#/components/schemas/ShopOrderDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthorized', description: "로그인 필요" }
        '404': { $ref: '#/components/responses/Problem', description: "없는 주문이거나 이 계정 묶음의 주문이 아니다(같은 404, not-found)" }
  /v1/shop/orders/{orderId}/cancellations:
    post:
      operationId: createShopOrderCancellation
      tags: [shop]
      x-peaket-roles: [fan]
      security: [{ fanCookie: [] }]
      summary: "굿즈·부가 상품 주문 취소(발송·수령 전, 부가 상품은 입장 시작 전)"
      description: "FR-014, FR-015, POL-014, POL-016 §1.4, docs/planning/03 §2.13 I2, docs/design/d5 §5.29. 결제를 마친 주문의 READY 항목만 취소한다. 전액 환급이고(처음 배송비 포함, 공제 없음) 결제사에서 바로 취소한다. itemIds가 없으면 주문의 READY 항목 전부다. 에스크로 주문은 구매 확정 전에는 주문 전체만 취소한다(부분 취소 불가, payment §2.1 표). 결제 전 주문은 취소 대상이 아니다(재고 예약 만료나 입금 기한으로 끝난다). 재인증은 refundAccount를 보낼 때만 요구하고 작업 묶음은 FAN_HIGH_RISK다(돈이 나갈 계좌를 정하는 작업, ADR-0089, authz-matrix §6). 가상계좌 결제면 refundAccount가 필요하고, 저장하지 않고 결제사 취소 요청에 바로 넘긴다(POL-014). 여러 번 쌓일 수 있어 복수형이다(guidelines §10)"
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { name: X-Reauth-Token, in: header, required: false, description: "refundAccount를 보낼 때 필수(guidelines §7)", schema: { type: string } }
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/ShopOrderCancellationInput' } } } }
      responses:
        '202': { description: "접수(결제사 취소는 응답 밖)", content: { application/json: { schema: { $ref: '#/components/schemas/Cancellation' } } } }
        '400': { $ref: '#/components/responses/Problem', description: "본문 형식 오류, 모르는 칸" }
        '401': { $ref: '#/components/responses/Unauthorized', description: "로그인 필요" }
        '403': { $ref: '#/components/responses/Problem', description: "refundAccount를 보냈는데 재인증이 없거나 만료·재사용(reauth-required)" }
        '404': { $ref: '#/components/responses/Problem', description: "없는 주문이거나 이 계정 묶음의 주문이 아니다, 또는 itemIds에 이 주문의 항목이 아닌 값이 있다(not-found)" }
        '409': { $ref: '#/components/responses/Problem', description: "이미 보냈거나 받은 상품, 결제 전 주문(merch-cancel-not-allowed), 연결 회차의 입장이 시작된 부가 상품(entry-started), 구매 확정 전 에스크로 주문의 일부 취소(escrow-partial-not-allowed)" }
        '415': { $ref: '#/components/responses/Problem', description: "application/json이 아닌 본문" }
        '422': { $ref: '#/components/responses/Problem', description: "가상계좌 결제인데 refundAccount가 없다(refund-account-required), 결제사가 계좌를 거절했다(입력 칸 다시 받음)" }
        '429': { $ref: '#/components/responses/TooManyRequests', description: "요청 한도 초과" }
        '503': { $ref: '#/components/responses/ServiceUnavailable', description: "결제 서비스를 잠시 쓸 수 없다(dependency-unavailable)" }
  /v1/shop/orders/{orderId}/returns:
    post:
      operationId: createShopOrderReturn
      tags: [shop]
      x-peaket-roles: [fan]
      security: [{ fanCookie: [] }]
      summary: "굿즈·부가 상품 반품 요청(단순 변심 받은 날부터 7일, 상품 이상·설명과 다름 3개월)"
      description: "FR-014, FR-015, POL-016 §1.4, docs/planning/03 §2.13 I7~I10, docs/design/d5 §5.29, 전자상거래법 §17. 항목 단위로 받고 그 항목을 RETURN_REQUESTED로 바꾼 뒤 바뀐 주문을 200으로 돌려준다(guidelines §12). 환급은 판매자가 반품을 받은 날부터 3영업일 안이라 이 요청 안에서 돈이 움직이지 않는다. 그래서 계좌를 받지 않는다(지연 환급과 같은 규칙, ADR-0050 결정 3). 가상계좌 결제의 환불 계좌는 환급을 실행할 때 알림으로 받는다 [가정]. 기한의 기준은 delivered_at·picked_up_at이고, 배송 완료 기록이 없으면 요청을 기한 안의 것으로 받는다(전자상거래법 §17⑤). '안 날부터 30일'은 서버가 알 수 없어 3개월만 본다. 입장이 시작된 부가 상품(LOCKED)은 DEFECT_OR_MISMATCH만 받는다(I10). 에스크로 주문은 구매 확정 전에는 주문 전체 항목만 받는다(ADR-0062). 여러 번 쌓일 수 있어 복수형이다"
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ShopOrderReturnInput' } } } }
      responses:
        '200': { description: "반품 요청됨(바뀐 주문)", content: { application/json: { schema: { $ref: '#/components/schemas/ShopOrderDetail' } } } }
        '400': { $ref: '#/components/responses/Problem', description: "본문 형식 오류, 모르는 칸" }
        '401': { $ref: '#/components/responses/Unauthorized', description: "로그인 필요" }
        '404': { $ref: '#/components/responses/Problem', description: "없는 주문이거나 이 계정 묶음의 주문이 아니다, 또는 itemIds에 이 주문의 항목이 아닌 값이 있다(not-found)" }
        '409': { $ref: '#/components/responses/Problem', description: "반품할 수 없는 상태이거나 기한이 지난 항목이 있다(merch-return-not-allowed, 줄마다의 기한은 items[].returnDueAt), 구매 확정 전 에스크로 주문의 일부 반품(escrow-partial-not-allowed)" }
        '415': { $ref: '#/components/responses/Problem', description: "application/json이 아닌 본문" }
        '429': { $ref: '#/components/responses/TooManyRequests', description: "요청 한도 초과" }
  # ── 4. 티켓 ──────────────────────────────────────────────────
  /v1/tickets/{ticketId}:
