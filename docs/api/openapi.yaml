      x-peaket-roles: [public]
      summary: "초대 수락: 패스키 등록 시작(등록 옵션)"
      description: "FR-021, POL-020, I-T53 ①, ADR-0206. POST /v1/partner/auth/passkey-registrations와 같은 등록 옵션과 응답이다. 다른 점은 세션과 재인증 토큰 대신 acceptanceStep으로 부르는 것뿐이다. TOTP 확인 뒤에만 받는다. RP ID는 partner.peaket.example이고 사용자 확인 필수다. registrationId와 챌린지는 그 수락 단계에서 5분 [가정] 한 번이다. partner_member는 이 단계를 건너뛸 수 있고 partner_admin은 필수다(identity §6 'MFA' 행). gw-partner가 Origin을 확인한다. Cache-Control: no-store"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminInvitationStepBody' }
      responses:
        '201':
          description: "등록 옵션"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPasskeyRegistration' }
        '400': { $ref: '#/components/responses/Problem', description: "본문 형식 오류" }
        '409': { $ref: '#/components/responses/Problem', description: "invitation-step-out-of-order(인증 앱을 아직 확인하지 않음), passkey-limit" }
        '410': { $ref: '#/components/responses/Problem', description: "invitation-step-invalid" }
        '429': { $ref: '#/components/responses/TooManyRequests', description: "admin-login-busy" }
        '503': { $ref: '#/components/responses/ServiceUnavailable', description: "admin-login-unavailable(챌린지 저장소에 닿지 못함)" }
