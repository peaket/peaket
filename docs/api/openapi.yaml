      type: object
      additionalProperties: false
      description: "해제 링크 다시 받기 본문(POST /v1/partner/auth/unlock-links·/v1/ops/auth/unlock-links). 로그인 화면의 잠김 안내(SCR-020·SCR-028)가 이미 넣은 업무 이메일을 보낸다(docs/security/auth-controls.md §3.3, 추천 적용 2026-10-30)"
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
    AdminLoginPasswordStep:
      type: object
      additionalProperties: false
      description: "관리 계정 로그인 1단계 본문(POST /v1/partner/auth/sessions·/v1/ops/auth/sessions). 2단계(인증 앱 코드) 본문은 BUILD_ORDER BOT-120이 더한다. 사람 확인 토큰은 직전 응답이 humanCheckRequired였거나 428을 받았을 때 싣는다(docs/security/auth-controls.md §2.3). 정본은 docs/features/identity.md §6 '관리 계정 로그인 1단계와 실패 제한의 첫 구현'(추천 적용 2026-11-05)"
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 1024, description: "원문. 서버가 NFC로 맞춘다. 길이 상한은 설정 password.max_length의 허용 상한이다" }
        deviceId: { type: string, pattern: '^[A-Za-z0-9_-]{1,128}$', description: "브라우저 기기 식별값(브라우저 저장소의 값). 출발지 묶음(IP와 이것)을 셀 때 쓴다" }
        humanCheckToken: { type: string, minLength: 1, maxLength: 2048, description: "Cloudflare Turnstile 토큰(300초 1회용). identity가 검증 API로 확인한다" }
    AdminLoginSecondStep:
      type: object
      additionalProperties: false
      description: "관리 계정 로그인 2단계 본문(같은 두 경로). 1단계 응답의 loginStep과 인증 앱 코드(숫자 6자리)나 복구 코드(Crockford base32 16자를 4자씩 붙임표로 이은 꼴)를 보낸다. 정본은 docs/features/identity.md §6 '관리 계정 TOTP와 로그인 2단계의 첫 구현'(추천 적용 2026-11-05, BUILD_ORDER BOT-120)"
      required: [loginStep, code]
      properties:
        loginStep: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
        code: { type: string, minLength: 6, maxLength: 32 }
    AdminLoginDone:
      type: object
      required: [next]
      description: "관리 계정 로그인 완료(2단계 통과). 토큰은 본문이 아니라 Set-Cookie 둘로 준다(추천 적용 2026-11-05)"
      properties:
        next: { type: string, enum: [DONE] }
    AdminLoginStep:
      type: object
      required: [next, loginStep, expiresInSeconds]
      description: "관리 계정 로그인 1단계 통과(비밀번호가 맞았다). 2단계에 loginStep을 그대로 보낸다(추천 적용 2026-11-05)"
      properties:
        next: { type: string, enum: [TOTP] }
        loginStep: { type: string, pattern: '^[A-Za-z0-9_-]{43}$', description: "32바이트 난수의 채움 없는 base64url. 서버는 SHA-256만 둔다. 한 번 쓴다" }
        expiresInSeconds: { type: integer, description: "loginStep 수명(300초 [가정])" }
    AdminPasswordChangeCreate:
      type: object
      additionalProperties: false
      description: "관리 계정 비밀번호 바꾸기 본문(POST /v1/partner/auth/password-changes·/v1/ops/auth/password-changes). 지금 비밀번호와 새 비밀번호를 함께 검증한다(ASVS 6.2.3). 새 비밀번호는 15자 이상 256자 [가정] 이하이고, 흔한 비밀번호·서비스 맥락 말·계정 맥락 말·유출 목록과 대조한다(docs/security/auth-controls.md §4, POL-020). 정기 변경은 강제하지 않는다(추천 적용 2026-10-30, auth-controls §3.5·§5)"
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 1, maxLength: 256 }
        newPassword: { type: string, minLength: 15, maxLength: 256 }
    PartnerReauthPasswordStep:
      type: object
      additionalProperties: false
      description: "파트너 관리 계정 재인증 1단계 본문(POST /v1/partner/auth/reauthentications). 작업 묶음 act는 파트너 콘솔이 받는 셋이다(docs/security/authz-matrix.md §6). withPasskey가 참이면 다음 단계에서 패스키를 확인한다. 정본은 docs/features/identity.md §6 '관리 계정 패스키의 첫 구현'(추천 적용 2026-11-05, BUILD_ORDER BOT-122, ADR-0206)"
      required: [act, password, code]
      properties:
        act: { type: string, enum: [PAYOUT_ACCOUNT, BOOKER_EXPORT, ACCOUNT_SECURITY], description: "정산 계좌, 명단 내려받기, 계정 보안 설정(내 패스키 등록·지우기)" }
        password: { type: string, minLength: 1, maxLength: 1024, description: "원문. 서버가 NFC로 맞춘다" }
        code: { type: string, pattern: '^[0-9]{3} ?[0-9]{3}$', description: "인증 앱 코드(TOTP 6자리, 가운데를 띄어 써도 된다). 복구 코드는 받지 않는다" }
        withPasskey: { type: boolean, description: "참이면 패스키 확인 옵션을 받고 2단계로 간다. 없으면 거짓이다" }
    OpsReauthPasswordStep:
      type: object
      additionalProperties: false
      description: "운영자·CS 관리 계정 재인증 1단계 본문(POST /v1/ops/auth/reauthentications). 파트너 본문과 같고 act만 관제 콘솔이 받는 다섯이다(docs/security/authz-matrix.md §6, 추천 적용 2026-11-05, BUILD_ORDER BOT-122)"
      required: [act, password, code]
      properties:
        act: { type: string, enum: [OPS_COMMAND, APPROVAL, PERMISSION_CHANGE, AUTHORITY_DATA, ACCOUNT_SECURITY], description: "운영 명령, 승인 업무, 권한 변경, 수사기관 자료, 계정 보안 설정(내 패스키 등록·지우기)" }
        password: { type: string, minLength: 1, maxLength: 1024, description: "원문. 서버가 NFC로 맞춘다" }
        code: { type: string, pattern: '^[0-9]{3} ?[0-9]{3}$', description: "인증 앱 코드(TOTP 6자리, 가운데를 띄어 써도 된다). 복구 코드는 받지 않는다" }
        withPasskey: { type: boolean, description: "참이면 패스키 확인 옵션을 받고 2단계로 간다. 없으면 거짓이다" }
    AdminReauthPasskeyStep:
      type: object
      additionalProperties: false
      description: "관리 계정 재인증 2단계 본문(파트너·관제 같은 꼴). 1단계 응답의 reauthStep과 브라우저 navigator.credentials.get()의 결과(PublicKeyCredential.toJSON())를 보낸다(추천 적용 2026-11-05, BUILD_ORDER BOT-122)"
      required: [reauthStep, credential]
      properties:
        reauthStep: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
        credential: { $ref: '#/components/schemas/WebAuthnAssertion' }
    WebAuthnAssertion:
      type: object
      additionalProperties: false
      description: "패스키 확인 결과(W3C WebAuthn Level 3 AuthenticationResponseJSON). 이진 값은 모두 채움 없는 base64url이다"
      required: [id, rawId, type, response, clientExtensionResults]
      properties:
        id: { type: string, minLength: 1, maxLength: 1366, pattern: '^[A-Za-z0-9_-]+$', description: "자격 ID(1~1023바이트)" }
        rawId: { type: string, minLength: 1, maxLength: 1366, pattern: '^[A-Za-z0-9_-]+$' }
        type: { type: string, enum: [public-key] }
        authenticatorAttachment: { type: string, maxLength: 32 }
        clientExtensionResults: { type: object, x-peaket-open-object: "확장마다 다른 모양의 결과를 브라우저가 싣는다. 서버는 읽지 않는다(추천 적용 2026-11-05)" }
        response:
          type: object
          additionalProperties: false
          required: [clientDataJSON, authenticatorData, signature]
          properties:
            clientDataJSON: { type: string, minLength: 1, maxLength: 4096, pattern: '^[A-Za-z0-9_-]+$' }
            authenticatorData: { type: string, minLength: 1, maxLength: 4096, pattern: '^[A-Za-z0-9_-]+$' }
            signature: { type: string, minLength: 1, maxLength: 1024, pattern: '^[A-Za-z0-9_-]+$' }
            userHandle: { type: string, maxLength: 128, pattern: '^[A-Za-z0-9_-]*$' }
    WebAuthnAttestation:
      type: object
      additionalProperties: false
      description: "패스키 등록 결과(W3C WebAuthn Level 3 RegistrationResponseJSON, navigator.credentials.create()의 PublicKeyCredential.toJSON()). 이진 값은 모두 채움 없는 base64url이다"
      required: [id, rawId, type, response, clientExtensionResults]
      properties:
        id: { type: string, minLength: 1, maxLength: 1366, pattern: '^[A-Za-z0-9_-]+$', description: "자격 ID(1~1023바이트)" }
        rawId: { type: string, minLength: 1, maxLength: 1366, pattern: '^[A-Za-z0-9_-]+$' }
        type: { type: string, enum: [public-key] }
        authenticatorAttachment: { type: string, maxLength: 32 }
        clientExtensionResults: { type: object, x-peaket-open-object: "확장마다 다른 모양의 결과를 브라우저가 싣는다. 서버는 읽지 않는다(추천 적용 2026-11-05)" }
        response:
          type: object
          additionalProperties: false
          required: [clientDataJSON, attestationObject]
          properties:
            clientDataJSON: { type: string, minLength: 1, maxLength: 4096, pattern: '^[A-Za-z0-9_-]+$' }
            attestationObject: { type: string, minLength: 1, maxLength: 16384, pattern: '^[A-Za-z0-9_-]+$' }
            authenticatorData: { type: string, maxLength: 8192, pattern: '^[A-Za-z0-9_-]*$' }
            publicKey: { type: string, maxLength: 4096, pattern: '^[A-Za-z0-9_-]*$' }
            publicKeyAlgorithm: { type: integer }
            transports: { type: array, maxItems: 8, items: { type: string, pattern: '^[a-z-]{1,32}$' }, description: "인증기가 알린 전송 방식(internal·hybrid·usb·nfc·ble 등)" }
    AdminPasskeyCreate:
      type: object
      additionalProperties: false
      description: "내 패스키 등록 마치기 본문(POST /v1/partner/auth/passkeys·/v1/ops/auth/passkeys). 등록 시작 응답의 registrationId와 브라우저가 만든 자격을 보낸다(추천 적용 2026-11-05, BUILD_ORDER BOT-122)"
      required: [registrationId, credential]
      properties:
        registrationId: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
        credential: { $ref: '#/components/schemas/WebAuthnAttestation' }
        name: { type: string, minLength: 1, maxLength: 30, description: "이름표(예: 사무실 노트북). 앞뒤 빈칸과 제어 문자를 지운 1~30자 [가정]. 없으면 '패스키'" }
    WebAuthnCredentialDescriptor: { type: object, description: "패스키 하나를 가리키는 값(PublicKeyCredentialDescriptorJSON)", properties: { id: { type: string }, type: { type: string, enum: [public-key] }, transports: { type: array, items: { type: string } } } }
    WebAuthnRequestOptions:
      type: object
      description: "패스키 확인 옵션(W3C WebAuthn Level 3 PublicKeyCredentialRequestOptionsJSON). 화면은 PublicKeyCredential.parseRequestOptionsFromJSON()으로 바꿔 navigator.credentials.get()에 넘긴다"
      properties:
        challenge: { type: string, description: "32바이트 난수의 base64url. 5분 [가정] 한 번" }
        rpId: { type: string, description: "그 콘솔 호스트(partner.peaket.example 또는 console.peaket.example)" }
        timeout: { type: integer, description: "밀리초" }
        userVerification: { type: string, enum: [required] }
        allowCredentials: { type: array, items: { $ref: '#/components/schemas/WebAuthnCredentialDescriptor' }, description: "그 계정의 패스키만" }
    WebAuthnCreationOptions:
      type: object
      description: "패스키 등록 옵션(W3C WebAuthn Level 3 PublicKeyCredentialCreationOptionsJSON). 화면은 PublicKeyCredential.parseCreationOptionsFromJSON()으로 바꿔 navigator.credentials.create()에 넘긴다"
      properties:
        rp: { type: object, properties: { id: { type: string, description: "그 콘솔 호스트" }, name: { type: string } } }
        user: { type: object, properties: { id: { type: string, description: "관리 계정 ID 16바이트의 base64url" }, name: { type: string, description: "업무 이메일" }, displayName: { type: string } } }
        challenge: { type: string, description: "32바이트 난수의 base64url. 5분 [가정] 한 번" }
        pubKeyCredParams: { type: array, items: { type: object, properties: { type: { type: string }, alg: { type: integer, description: "COSE 알고리즘(-7 ES256, -8 EdDSA, -257 RS256)" } } } }
        timeout: { type: integer, description: "밀리초" }
        excludeCredentials: { type: array, items: { $ref: '#/components/schemas/WebAuthnCredentialDescriptor' }, description: "이미 등록한 패스키(다시 등록하지 않게)" }
        authenticatorSelection: { type: object, properties: { residentKey: { type: string }, userVerification: { type: string, enum: [required] } } }
        attestation: { type: string, enum: [none] }
        extensions: { type: object }
        hints: { type: array, items: { type: string } }
    AdminReauthPasskeyChallenge:
      type: object
      required: [next, reauthStep, publicKey, expiresInSeconds]
      description: "재인증 1단계 통과(비밀번호·인증 앱 코드가 맞았다). 2단계에 reauthStep과 패스키 확인 결과를 보낸다(추천 적용 2026-11-05, BUILD_ORDER BOT-122)"
      properties:
        next: { type: string, enum: [PASSKEY] }
        reauthStep: { type: string, pattern: '^[A-Za-z0-9_-]{43}$', description: "32바이트 난수의 채움 없는 base64url. 서버는 SHA-256만 둔다. 5분 [가정] 한 번" }
        publicKey: { $ref: '#/components/schemas/WebAuthnRequestOptions' }
        expiresInSeconds: { type: integer }
    AdminReauthDone:
      type: object
      required: [next, reauthToken, factors, expiresInSeconds]
      description: "재인증 토큰(추천 적용 2026-11-05, BUILD_ORDER BOT-122). 화면이 명령 API의 X-Reauth-Token으로 보낸다(guidelines §7)"
      properties:
        next: { type: string, enum: [DONE] }
        reauthToken: { type: string, description: "typ reauth+jwt, 관리 토큰 키 ES256, 5분 한 번. 그 세션 sid와 작업 묶음 act에 묶인다" }
        factors: { type: array, items: { type: string, enum: [password, totp, passkey] }, description: "확인한 요소(토큰의 factors와 같다)" }
        expiresInSeconds: { type: integer }
    AdminPasskeyRegistration:
      type: object
      required: [registrationId, publicKey, expiresInSeconds]
      description: "내 패스키 등록 시작 응답(추천 적용 2026-11-05, BUILD_ORDER BOT-122)"
      properties:
        registrationId: { type: string, pattern: '^[A-Za-z0-9_-]{43}$', description: "32바이트 난수의 채움 없는 base64url. 그 세션에서 5분 [가정] 한 번" }
        publicKey: { $ref: '#/components/schemas/WebAuthnCreationOptions' }
        expiresInSeconds: { type: integer }
    AdminPasskey:
      type: object
      description: "내 패스키 한 줄(docs/data.md admin_passkey). 공개키와 자격 ID 원문은 싣지 않는다(추천 적용 2026-11-05, BUILD_ORDER BOT-122)"
      properties:
        passkeyId: { type: string, format: uuid }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: [string, 'null'], format: date-time }
        backedUp: { type: boolean, description: "백업 상태(여러 기기에 동기화되어 있는지)" }
        deviceType: { type: string, enum: [singleDevice, multiDevice] }
        transports: { type: array, items: { type: string } }
    AdminPasskeyList: { type: object, description: "내 패스키 목록(만든 차례, 10개 [가정]까지)", properties: { items: { type: array, items: { $ref: '#/components/schemas/AdminPasskey' } } } }
    AdminRole: { type: string, enum: [viewer, operator, commander, cs_agent, cs_lead, partner_admin, partner_member], description: "관리 계정 역할 하나(docs/data.md admin_account.role, docs/planning/03 §3). 앞의 다섯은 관제 역할(group OPS), 뒤의 둘은 파트너 역할(group PARTNER)이다" }
    AdminAccount:
      type: object
      description: "관리 계정(SCR-064 계정 표, docs/data.md admin_account). 이메일은 가린 값만 싣는다. 잠금은 상태와 따로 lockKind로 준다(docs/planning/03 §2.7의 Locked·ProtectLocked). version은 역할 변경의 If-Match에 쓰는 판이다(guidelines §12, 소유자 결정 2026-10-30, open-items 73번. 칸은 추천 적용 2026-10-30)"
      properties:
        adminAccountId: { type: string }
        emailMasked: { type: string, description: "가린 업무용 이메일(예 st****@stella.example). 삭제한 계정은 비운다" }
        displayName: { type: [string, 'null'], description: "표시 이름(업무에서 부르는 이름이나 별명). 관제·파트너 화면이 담당자·내려받은 사람을 보일 때 쓴다(SCR-020 ⑨, SCR-045 문의 담당자, 명단 다운로드 이력). 삭제한 계정은 null이다(docs/data.md admin_account.display_name, 추천 적용 2026-10-30)" }
        group: { type: string, enum: [OPS, PARTNER] }
        role: { $ref: '#/components/schemas/AdminRole' }
        promoterId: { type: string, description: "파트너 계정만. 초대 때 정하고 바꾸지 않는다" }
        status: { type: string, enum: [INVITED, ACTIVE, INVITE_EXPIRED, REMOVED], description: "docs/planning/03 §2.7 관리 계정 상태의 Invited·ActiveAdmin·InviteExpired·Removed" }
        lockKind: { type: string, enum: [NONE, TIMED, PROTECT], description: "없음·시간 잠금·보호 잠금(docs/security/auth-controls.md §3.2)" }
        lockReason: { type: string, enum: [FAILED_ATTEMPTS, SECOND_FACTOR_FAILURES, PASSWORD_FAILURE_TOTAL], description: "잠겼을 때만. 계정 연속 실패 5회(시간 잠금), 2단계 실패 5회, 비밀번호 연속 실패 누계 100(보호 잠금). 화면은 이 값으로 잠김 상세 글을 고른다(docs/design/d5 SCR-064 '잠김 상세'). 계정 주인에게는 보호 잠금의 원인을 알리지 않는다(auth-controls §3.2)" }
        lockedUntil: { type: string, format: date-time, description: "시간 잠금만" }
        totpEnrolled: { type: boolean, description: "인증 앱 등록 여부" }
        passkeyCount: { type: integer, minimum: 0 }
        designations: { type: array, items: { type: string, enum: [ACCESS_REVIEWER, PSEUDONYM_HANDLER, FRAUD_INVESTIGATOR] }, description: "살아 있는 지정(접속기록 점검자·가명정보 취급자·부정 거래 조사관). 앞의 둘은 commander에게만, FRAUD_INVESTIGATOR는 commander와 cs_lead에게 붙는다. 그 밖의 역할이면 비어 있다(FRAUD_INVESTIGATOR는 추천 적용 2026-10-31, ADR-0171)" }
        inviteExpiresAt: { type: string, format: date-time, description: "초대됨일 때만. 보낸 때부터 24시간" }
        lastLoginAt: { type: string, format: date-time, description: "마지막 로그인 성공 시각('마지막 접속')" }
        removedAt: { type: string, format: date-time }
        version: { type: integer, description: "판. 응답의 ETag와 같은 값이다" }
    AdminAccountDetail:
      description: "관리 계정 상세(SCR-064 오른쪽 상세). 활성 세션은 브라우저·운영체제·시각만 싣고 IP 주소는 싣지 않는다(추천 적용 2026-10-30)"
      allOf:
        - { $ref: '#/components/schemas/AdminAccount' }
        - type: object
          properties:
            sessions: { type: array, items: { type: object, properties: { sessionId: { type: string }, browser: { type: string }, os: { type: string }, createdAt: { type: string, format: date-time }, lastActiveAt: { type: string, format: date-time } } } }
    AdminAccountPage: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/AdminAccount' } }, nextCursor: { type: [string, 'null'] } } }
    AdminInvitationCreate:
      type: object
      additionalProperties: false
      description: "관리 계정 초대 본문(POST /v1/ops/admin-accounts). commander로는 초대하지 않는다(역할 변경의 2인 승인으로만 준다, POL-038 ⑨, 추천 적용 2026-10-30). 파트너 역할이면 promoterId가 필수이고 관제 역할이면 넣지 않는다"
      required: [email, role, displayName]
      properties:
        email: { type: string, format: email, maxLength: 254, description: "업무용 이메일. 삭제하지 않은 관리 계정 사이에서 하나뿐이어야 한다" }
        displayName: { type: string, minLength: 1, maxLength: 30, description: "표시 이름. 30자 [가정](NFC 정규화 뒤 grapheme으로 센다). 제어 문자와 양방향 제어 문자는 지운다. 초대한 사람이 넣고, 수락할 때 계정 주인이 고칠 수 있다(초대 수락 경로는 wbs 0.2.3, 추천 적용 2026-10-30)" }
        role: { type: string, enum: [viewer, operator, cs_agent, cs_lead, partner_admin, partner_member] }
        promoterId: { type: string }
    AdminRoleChange:
      type: object
      additionalProperties: false
      description: "역할 변경 본문(PUT /v1/ops/admin-accounts/{adminAccountId}/role). 사유는 권한 변경 내역에 남는다(고시 제5조 제3항)"
      required: [role, reason]
      properties:
        role: { $ref: '#/components/schemas/AdminRole' }
        reason: { type: string, minLength: 1, maxLength: 500 }
    AdminReinvitationCreate:
      type: object
      additionalProperties: false
      description: "재초대 본문(POST /v1/ops/admin-accounts/{adminAccountId}/invitation, 추천 적용 2026-10-30). RESEND는 초대됨·초대 만료 계정의 링크 다시 보내기, PROTECT_LOCK은 보호 잠금 해제, CREDENTIAL_LOST는 활성 계정이나 시간 잠금 중인 계정의 주인이 비밀번호·인증 앱을 잃은 경우다(docs/planning/03 §2.7 A11·A12). 뒤의 둘은 신원을 어떻게 확인했는지 reason에 적는다(개인정보 원문은 적지 않는다)"
      required: [reasonCode, reason]
      properties:
        reasonCode: { type: string, enum: [RESEND, PROTECT_LOCK, CREDENTIAL_LOST] }
        reason: { type: string, minLength: 1, maxLength: 500 }
    AdminRemovalCreate:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500, description: "권한 말소 내역에 남는 사유" }
    AdminDesignationCreate:
      type: object
      additionalProperties: false
      description: "지정 본문(POST /v1/ops/admin-accounts/{adminAccountId}/designations). basis는 개인정보 보호책임자의 지정 문서 번호 같은 근거다(docs/data.md admin_designation.basis, SCR-064 ⑤)"
      required: [kind, basis]
      properties:
        kind: { type: string, enum: [ACCESS_REVIEWER, PSEUDONYM_HANDLER, FRAUD_INVESTIGATOR], description: "접속기록 점검자·가명정보 취급자·부정 거래 조사관(FRAUD_INVESTIGATOR, 2026-10-31 ADR-0171)" }
        basis: { type: string, minLength: 1, maxLength: 200 }
    AdminSessionSelf: { type: object, description: "GET /v1/ops/auth/sessions/me의 응답(추천 적용 2026-10-31, ADR-0171)", properties: { adminAccountId: { type: string }, role: { $ref: '#/components/schemas/AdminRole' }, displayName: { type: [string, 'null'] }, designations: { type: array, items: { type: string, enum: [ACCESS_REVIEWER, PSEUDONYM_HANDLER, FRAUD_INVESTIGATOR] }, description: "살아 있는 지정. 메뉴를 그릴 때만 쓴다" } } }
    AdminDesignation: { type: object, properties: { kind: { type: string, enum: [ACCESS_REVIEWER, PSEUDONYM_HANDLER, FRAUD_INVESTIGATOR] }, basis: { type: string }, designatedBy: { type: string, description: "지정을 기록한 관리 계정 ID" }, designatedAt: { type: string, format: date-time } } }
    AdminPermissionChange: { type: object, description: "권한 부여·변경·말소 내역 한 줄(SCR-064 ⑥, 고시 제5조 제3항, 3년 보관). ops-svc 감사 저장소가 원본이다", properties: { changedAt: { type: string, format: date-time }, action: { type: string, enum: [INVITED, REINVITED, ROLE_CHANGED, DESIGNATED, DESIGNATION_REVOKED, REMOVED] }, fromRole: { $ref: '#/components/schemas/AdminRole' }, toRole: { $ref: '#/components/schemas/AdminRole' }, designationKind: { type: string, enum: [ACCESS_REVIEWER, PSEUDONYM_HANDLER, FRAUD_INVESTIGATOR], description: "FRAUD_INVESTIGATOR는 2026-10-31 ADR-0171로 더함" }, actorAdminAccountId: { type: string }, actorRole: { $ref: '#/components/schemas/AdminRole' }, approvalId: { type: string, description: "2인 승인을 거친 변경(commander 역할의 부여·회수)만" }, reason: { type: string } } }
    AdminPermissionChangePage: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/AdminPermissionChange' } }, nextCursor: { type: [string, 'null'] } } }
    PartnerTeamAccount: { type: object, description: "파트너 콘솔 팀 계정 한 줄(SCR-020 ⑨). 계정 ID·이메일 원문은 싣지 않는다", properties: { displayName: { type: string, description: "표시 이름(화면의 '이름' 칸, AdminAccount.displayName과 같은 값, 추천 적용 2026-10-30)" }, emailMasked: { type: string }, role: { type: string, enum: [partner_admin, partner_member] }, status: { type: string, enum: [INVITED, ACTIVE, INVITE_EXPIRED] }, locked: { type: boolean, description: "시간 잠금·보호 잠금 가운데 하나가 걸려 있다. 종류는 싣지 않는다" }, lastLoginAt: { type: string, format: date-time } } }
    BookingRestrictionStatus: { type: object, description: "내 예매 제한 상태(GET /v1/booking-restrictions/me, 추천 적용 2026-10-30). 사유는 코드만 싣고, 확인한 CS 책임자와 증빙은 싣지 않는다. LIFTED·EXPIRED는 NONE으로 보인다", required: [status], properties: { status: { type: string, enum: [NONE, ACTIVE] }, restrictionId: { type: [string, 'null'], description: "ACTIVE일 때. 소명 제출(POST /v1/appeals, kind RESTRICTION)의 targetId" }, reasonCode: { type: [string, 'null'], description: "booking_restriction.reason_code. 화면은 이 코드로 사유 범주 문구를 고른다(SCR-042 ①). 부정 예매 이용 제한은 FRAUD이고 소명은 kind FRAUD_CASE로 낸다(POL-046 ⑥, 추천 적용 2026-10-31)" }, startsAt: { type: [string, 'null'], format: date-time }, endsAt: { type: [string, 'null'], format: date-time, description: "끝이 정해지지 않았으면 null" }, appealDueAt: { type: [string, 'null'], format: date-time, description: "소명 기한(제한을 확인한 때부터 1일 이상, docs/features/transfer-refund.md §3.2)" } } }
    FraudReasonCategory: { type: string, enum: [MACRO_BOT, QUEUE_BYPASS, CAPTCHA_BYPASS, ACCOUNT_LENDING, LIMIT_EVASION], description: "부정 예매 사유 범주 다섯(POL-046 ①): 자동화 프로그램(매크로·봇), 대기열 우회 링크, 보안문자 우회, 명의 대여·사들인 계정, 1인 매수 제한 회피. 팬에게 알리는 것은 이 범주뿐이고 점수와 가중치는 알리지 않는다(추천 적용 2026-10-31, ADR-0171)" }
    FraudLinkKind: { type: string, enum: [DEVICE, PAYMENT_METHOD, CONTACT, IP, ASN, IDENTITY_CONFLICT], description: "묶음 계정이 함께 쓴 연결 값의 종류(FR-072): 기기 가명(deviceRef), 결제 수단 연결값(paymentMethodRef. 카드 지문이 없어 약한 값이다, docs/features/payment.md), 연락처·수령 정보 가명(contactRef), 시간창 안의 같은 IP, 같은 ASN(망 운영자 번호), 같은 본인확인으로 다른 계정에서 시도한 기록(docs/data.md identity_conflict_attempt). 추천 적용 2026-10-31, ADR-0171" }
    FraudSignal: { type: string, enum: [LINK_GRAPH, SYNC_STEPS, VELOCITY, TIMING_BASELINE, BYPASS_TRACE, POST_MATCH], description: "근거 신호. ADR-0171 결정 6의 분석 방법 여섯과 같다: 연결 그래프, 거의 같은 시각에 같은 단계를 밟는 동시 행동 군집, 같은 IP·기기에서 여러 계정을 빠르게 오가는 속도 규칙, 판매 시작부터 단계별 걸린 시간이 정상 기준선 밖, 입장 토큰 없는 홀드 시도·우회 링크 흔적, 외부 되팔이 게시물과 좌석 대조. 규칙과 점수는 docs/features/forensic-replay.md가 정한다(추천 적용 2026-10-31)" }
    FraudCaseStatus: { type: string, enum: [INVESTIGATING, APPEAL_PENDING, DECISION_PENDING, ACTIONED, CLEARED, OBJECTED, REVERSED], description: "사건 상태(docs/data.md fraud_case.status, 상태 모형은 docs/features/forensic-replay.md): 조사 중, 소명 대기, 결정 대기(승인 업무 진행), 조치됨, 정상 종료, 이의 접수, 이의 인정(되돌림). 이의는 계정별이다. OBJECTED는 결정되지 않은 이의가 하나라도 있는 상태이고, 이용 제한 풀기 승인 업무가 진행 중이어도 OBJECTED에 머문다(DECISION_PENDING으로 가지 않는다). 모든 이의가 결정되면 조치받은 계정 모두가 인정되어 되돌림(이용 제한 풀기 Done, 표마다 우선 구매 부여나 보상 건)을 마쳤을 때 REVERSED, 아니면 ACTIONED로 돌아간다. 전이와 조건(C1~C15)의 정본은 docs/features/forensic-replay.md §6.7.4다. 표 취소는 취소 마감 시각(판매 종료 − 재판매 준비 2시간 [가정] = 공연 시작 26시간 전)까지만 요청·승인하고 그 뒤에는 이용 제한만 한다. 취소한 좌석은 언제나 정가 재판매로 돌린다(2026-10-31 정함, POL-038 ⑪·POL-046 ⑤). 입장 시작에는 양도 잠금이 모두 풀리고 사건은 이용 제한만 남긴 채 계속한다(상태는 그대로, 추천 적용 2026-10-31, ADR-0171)" }
    FraudCluster:
      type: object
      description: "부정 예매 후보 묶음(이름은 달라도 한 사람이나 한 조직이 쓰는 것으로 보이는 계정 모음, SCR-070 ②, FR-072). 후보는 조치가 아니다. 이 응답을 만들었다고 팬 계정·티켓이 바뀌지 않는다(POL-046 ②, 추천 적용 2026-10-31, ADR-0171)"
      properties:
        clusterId: { type: string, format: uuid }
        eventId: { type: string }
        generation: { type: integer, minimum: 1, description: "후보 계산 판. 온세일 윈도우가 끝난 뒤(T+60분) 첫 계산이 1이고, 판매 종료까지 새 구매·양도·외부 게시물로 다시 계산할 때마다 오른다(docs/data.md fraud_cluster.generation)" }
        scoreBand: { type: string, enum: [HIGH, MEDIUM, LOW], description: "점수 범주. 점수 원값과 가중치는 싣지 않는다" }
        accountCount: { type: integer, minimum: 1 }
        purchaseCount: { type: integer, minimum: 0, description: "묶음 계정이 산 표 수(취소된 표 제외)" }
        limitPerPerson: { type: integer, minimum: 1, description: "그 회차의 1인 매수 한도. 화면은 '구매 27 / 한도 4'처럼 보인다" }
        sharedAttributes: { type: array, items: { $ref: '#/components/schemas/FraudLinkKind' } }
        signals: { type: array, items: { $ref: '#/components/schemas/FraudSignal' } }
        caseId: { type: [string, 'null'], description: "이 묶음으로 만든 사건. 없으면 null" }
        createdAt: { type: string, format: date-time }
    FraudClusterMember: { type: object, description: "묶음에 든 계정 하나. 조사 갈래라 계정 ID를 그대로 싣는다(ADR-0171 결정 2)", properties: { accountId: { type: string }, ticketCount: { type: integer, minimum: 0 }, signals: { type: array, items: { $ref: '#/components/schemas/FraudSignal' } }, addedBy: { type: string, enum: [SYSTEM, INVESTIGATOR] }, removed: { type: boolean, default: false, description: "조사관이 묶음에서 뺀 계정. 뺀 이유는 사건 기록에 남는다" }, appealResult: { type: string, enum: [NOT_REQUESTED, PENDING, SUBMITTED, ACCEPTED, REJECTED, EXPIRED], description: "그 계정의 소명 결과(docs/data.md fraud_cluster_member.appeal_result). PENDING 요청했고 제출 전, SUBMITTED 제출했고 판단 전(판단 전까지 조치 대상이 아니다), EXPIRED 기한까지 제출하지 않음" }, appealDueAt: { type: [string, 'null'], format: date-time }, objectionResult: { type: string, enum: [NONE, PENDING, ACCEPTED, REJECTED], description: "그 계정의 이의(조치 결과 통지 + 30일 [가정] 안). PENDING은 접수했고 결정 전" }, objectionDueAt: { type: [string, 'null'], format: date-time, description: "이의 창의 끝(결과 통지 + 30일 [가정])" }, transferLocked: { type: boolean, default: false, description: "그 계정이 결제한 표에 이 사건의 양도 잠금이 걸려 있는지" }, lockExpiresAt: { type: [string, 'null'], format: date-time, description: "그 계정의 양도 잠금 최대 기한(그 계정의 첫 소명 요청 + 14일 [가정], 연장 없음). 계정마다 따로이고 소명을 다시 요청해도 늘지 않는다. 잠근 적이 없으면 null(docs/data.md fraud_cluster_member.lock_expires_at, 추천 적용 2026-10-31, ADR-0173)" } } }
    FraudClusterDetail: { description: "후보 묶음 상세(GET /v1/ops/fraud-clusters/{clusterId})", allOf: [{ $ref: '#/components/schemas/FraudCluster' }, { type: object, properties: { members: { type: array, items: { $ref: '#/components/schemas/FraudClusterMember' } } } }] }
    FraudClusterPage: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/FraudCluster' } }, nextCursor: { type: [string, 'null'] } } }
    FraudCaseCreate: { type: object, additionalProperties: false, required: [clusterId], properties: { clusterId: { type: string, format: uuid }, reasonCategory: { $ref: '#/components/schemas/FraudReasonCategory' } } }
    FraudCase:
      type: object
      description: "부정 예매 사건(SCR-070 ③·SCR-071, FR-073, docs/data.md fraud_case). version은 PATCH의 If-Match에 쓰는 판이고 단건 응답의 ETag와 같다(guidelines §12, 추천 적용 2026-10-31, ADR-0171)"
      properties:
        caseId: { type: string, format: uuid }
        eventId: { type: string }
        clusterId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/FraudCaseStatus' }
        reasonCategory: { $ref: '#/components/schemas/FraudReasonCategory' }
        assigneeId: { type: string, description: "담당 조사관 관리 계정 ID" }
        accountCount: { type: integer, minimum: 0 }
        ticketCount: { type: integer, minimum: 0 }
        appealDueAt: { type: [string, 'null'], format: date-time, description: "소명 기한. 소명 요청 전이면 null" }
        cancelDeadlineAt: { type: string, format: date-time, description: "취소 마감 시각 = 판매 종료(공연 시작 24시간 전) − 재판매 준비 2시간 [가정](POL-046 ⑤). 이 시각이 지나면 표 취소를 요청·승인할 수 없고 이용 제한만 한다" }
        transferLocked: { type: boolean, default: false, description: "이 사건으로 양도가 잠긴 티켓이 있는지(POL-046 ③)" }
        approvalId: { type: [string, 'null'], description: "진행 중이거나 마지막 조치 승인 업무(kind FRAUD_ACTION)" }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        closedAt: { type: [string, 'null'], format: date-time }
    FraudCaseEvent: { type: object, description: "사건 기록 한 줄(누가·언제·무엇을, SCR-071 ⑧, docs/data.md fraud_case_event)", properties: { seq: { type: integer }, kind: { type: string, description: "docs/data.md fraud_case_event.kind의 값" }, actorId: { type: [string, 'null'], description: "관리 계정 ID. 시스템이면 null" }, note: { type: [string, 'null'] }, detail: { type: [object, 'null'], description: "kind별 세부(docs/data.md fraud_case_event.detail). 예: LOCK_RELEASED는 풀린 때(releaseReason 일곱 가운데 하나)와 계정, APPEAL_REQUESTED는 대상 계정·기한·잠금 최대 기한과 함께 알린 받은 사람 수·표, APPEAL_RECEIVED는 party(PAYER·HOLDER), ACTION_APPROVED는 승인자의 판단 이유·뺀 계정·표·그 승인자의 요약 첫 열람 시각. 연락처·IP 원문은 없다(추천 적용 2026-10-31, ADR-0173)" }, occurredAt: { type: string, format: date-time } } }
    FraudCaseDetail: { description: "사건 상세(GET /v1/ops/fraud-cases/{caseId})", allOf: [{ $ref: '#/components/schemas/FraudCase' }, { type: object, properties: { members: { type: array, items: { $ref: '#/components/schemas/FraudClusterMember' } }, snapshot: { type: object, description: "고정 시점의 조사용 기록(docs/data.md fraud_snapshot)", properties: { version: { type: integer }, frozenAt: { type: string, format: date-time }, invHash: { type: string, pattern: '^[0-9a-f]{64}$' } } }, appealOutcome: { type: string, enum: [NOT_REQUESTED, PENDING, ACCEPTED, REJECTED, PARTIAL], description: "소명 결과. PENDING은 아직 제출 전이거나 판단 전인 계정이 남음, PARTIAL은 계정마다 판단이 갈린 경우. 계정별 값은 members[].appealResult" }, investigatorOpinion: { type: [string, 'null'], maxLength: 2000 }, evidenceBundleIds: { type: array, items: { type: string, format: uuid }, description: "이 사건의 증거 묶음 ID(만든 순서). 작업대가 GET /v1/ops/evidence-bundles/{bundleId}를 부른다. 아직 없으면 빈 목록(추천 적용 2026-10-31, ADR-0171, FRN-070)" }, events: { type: array, items: { $ref: '#/components/schemas/FraudCaseEvent' } } } }] }
    FraudCasePage: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/FraudCase' } }, nextCursor: { type: [string, 'null'] } } }
    FraudCountCell: { type: object, required: [suppressed], description: "기획사 보고의 칸 하나(forensic-replay.md §6.7.7 '칸 합치기'). 1~4건인 칸과, 다른 칸이나 합계에서 빼서 그런 칸을 알아낼 수 있는 칸(2차 가림)은 value가 null이고 suppressed가 true다. 0건은 0이다(추천 적용 2026-10-31, ADR-0171, FRN-070)", properties: { value: { type: [integer, 'null'], minimum: 0 }, suppressed: { type: boolean } } }
    PromoterFraudReport: { type: object, description: "부정 예매 조치 집계(기획사 보고, FR-074·POL-046 ⑧, SCR-027 '부정 예매 조치' 탭). 증거 묶음 내보내기 PROMOTER와 같은 계산·같은 칸 합치기다. 그 회차의 끝난 사건(ACTIONED·CLEARED·REVERSED)으로 센다. 사람 단위 행·좌석 번호·계정·주문 ID·점수는 없다(추천 적용 2026-10-31, ADR-0171, FRN-070)", properties: { eventId: { type: string }, asOf: { type: string, format: date-time, description: "집계 시각. 사건이 끝날 때마다가 아니라 하루 한 번 06:00 KST [가정]에 다시 센다(사건 하나가 끝난 때를 집계 변화로 짚지 못하게)" }, closedCaseCount: { $ref: '#/components/schemas/FraudCountCell' }, cancelActionCount: { $ref: '#/components/schemas/FraudCountCell' }, restrictActionCount: { $ref: '#/components/schemas/FraudCountCell' }, cancelledTicketCount: { $ref: '#/components/schemas/FraudCountCell' }, resoldAtFaceValueCount: { $ref: '#/components/schemas/FraudCountCell' }, byReasonCategory: { type: array, items: { type: object, properties: { category: { type: string, enum: [MACRO_BOT, QUEUE_BYPASS, CAPTCHA_BYPASS, ACCOUNT_LENDING, LIMIT_EVASION, OTHER], description: "5건 미만 칸은 OTHER로 합친다. OTHER가 5건 미만이거나 합계에서 빼서 알아낼 수 있으면 OTHER와 그다음으로 작은 칸을 함께 가린다(2차 가림)" }, count: { $ref: '#/components/schemas/FraudCountCell' } } } }, appealAcceptedRatio: { type: [number, 'null'], minimum: 0, maximum: 1, description: "소명 인정 비율. 분모(소명 판단을 받은 계정 수)가 5건 [가정] 이상일 때만, 아니면 null" } } }
    FraudClusterRun: { type: object, description: "후보 계산 한 번(docs/data.md fraud_cluster_run, forensic-replay.md §6.7.3)(추천 적용 2026-10-31, ADR-0171, FRN-070)", properties: { generation: { type: integer, minimum: 1 }, snapshotVersion: { type: integer }, ruleVersion: { type: string }, status: { type: string, enum: [RUNNING, DONE, FAILED] }, attempt: { type: integer, minimum: 1, description: "이 판의 시도 번호(docs/data.md fraud_cluster_run 기본 키 (event_id, generation, attempt)). 다시 돌리기는 같은 판의 새 시도다" }, trigger: { type: string, enum: [SCHEDULED, SNAPSHOT, AUTO_RETRY, MANUAL], description: "온세일 윈도우 끝, 새 기록 고정 판, 자동 다시 시도, 조사관의 다시 돌리기" }, failureReason: { type: [string, 'null'], enum: [SOURCE_READ_FAILED, TIMEOUT, OTHER, null], description: "FAILED일 때 오류 범주" }, startedAt: { type: string, format: date-time }, finishedAt: { type: [string, 'null'], format: date-time }, clusterCount: { type: [integer, 'null'], description: "DONE일 때 후보로 올린 묶음 수" }, autoRetriesLeft: { type: integer, minimum: 0, description: "이 판에 남은 자동 다시 시도 수(처음 셋 [가정]). 0이고 FAILED면 SEV3이고 다시 돌리기를 열 수 있다" } } }
    FraudEventOverview: { type: object, description: "회차의 부정 거래 조사 머리(SCR-070 머리·①, d5 §1.6 39번 ①②). 조사관만 보므로 칸을 합치지 않는다(추천 적용 2026-10-31, ADR-0171, FRN-070)", properties: { eventId: { type: string }, snapshot: { type: [object, 'null'], description: "마지막 기록 고정 판(docs/data.md fraud_snapshot). 온세일 윈도우가 끝나기 전이면 null", properties: { version: { type: integer }, frozenAt: { type: string, format: date-time }, invHash: { type: string, pattern: '^[0-9a-f]{64}$' }, late: { type: boolean, description: "늦은 적재(조사 적재가 따라오지 못해 30분 [가정] 기다린 뒤 고정함)" } } }, latestRun: { oneOf: [{ $ref: '#/components/schemas/FraudClusterRun' }, { type: 'null' }], description: "마지막 후보 계산. 아직 없으면 null" }, rerunAllowed: { type: boolean, description: "[ 다시 돌리기 ]를 보일지. 마지막 시도가 FAILED이고 자동 다시 시도가 남지 않았으며(autoRetriesLeft 0) 원천이 살아 있을 때만 true" }, summary: { type: object, description: "회차 요약 집계", properties: { clusterCount: { type: integer }, caseCount: { type: integer }, byStatus: { type: object, description: "사건 상태(FraudCaseStatus)마다의 수", additionalProperties: { type: integer } }, actionedTicketCount: { type: integer, description: "조치로 취소한 표 수" }, restrictedAccountCount: { type: integer }, appealAcceptedRatio: { type: [number, 'null'], minimum: 0, maximum: 1, description: "소명 판단을 받은 계정이 없으면 null" } } }, cancelDeadlineAt: { type: string, format: date-time, description: "표 취소 마감(판매 종료 − 2시간 [가정])" }, sourceExpiresAt: { type: [string, 'null'], format: date-time, description: "조사 원천(inv) 보존 끝(그 회차 공연일 + 30일 [가정]. ops-svc 파기 작업 inv-partition-purge가 이때 회차 파티션을 지우고 결과를 남긴다. ClickHouse TTL은 보조다(추천 적용 2026-10-31, ADR-0173)). 지나면 리플레이와 다시 돌리기가 410이고 증거 묶음만 남는다" } } }
    EvidenceBundleSummary: { type: object, description: "증거 묶음 목록의 한 줄. 파일 목록·파일 해시·관리 연속성 기록은 싣지 않는다. 그것은 열람(VIEWED)이 남는 GET /v1/ops/evidence-bundles/{bundleId}로만 본다(추천 적용 2026-10-31, ADR-0171, FRN-070)", properties: { bundleId: { type: string, format: uuid }, caseId: { type: string, format: uuid }, status: { type: string, enum: [BUILDING, SEALED, DISPOSED] }, manifestSha256: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$' }, holdReason: { type: string, enum: [DISPUTE, INVESTIGATION, OBJECTION] }, holdEndedAt: { type: [string, 'null'], format: date-time }, createdAt: { type: string, format: date-time } } }
    EvidenceBundlePage: { type: object, description: "회차의 증거 묶음 목록(원천이 만료된 회차에서도 남는다)(추천 적용 2026-10-31, ADR-0171, FRN-070)", properties: { items: { type: array, items: { $ref: '#/components/schemas/EvidenceBundleSummary' } }, nextCursor: { type: [string, 'null'] } } }
    FraudCasePatch:
      type: object
      additionalProperties: false
      description: "사건 고치기(SCR-071 ②·⑤). 묶음에서 계정을 빼거나 더할 때와 소명을 판단할 때는 이유가 필수다. 모든 변경은 사건 기록(fraud_case_event)에 누가·언제·무엇을·왜로 남는다(추천 적용 2026-10-31, ADR-0171)"
      properties:
        addMembers: { type: array, maxItems: 100, items: { type: object, additionalProperties: false, required: [accountId, reason], properties: { accountId: { type: string }, reason: { type: string, minLength: 1, maxLength: 500 } } } }
        removeMembers: { type: array, maxItems: 100, items: { type: object, additionalProperties: false, required: [accountId, reason], properties: { accountId: { type: string }, reason: { type: string, minLength: 1, maxLength: 500 } } } }
        reasonCategory: { $ref: '#/components/schemas/FraudReasonCategory' }
        note: { type: string, minLength: 1, maxLength: 2000, description: "메모 한 줄을 더한다(지난 메모는 고치지 않는다)" }
        investigatorOpinion: { type: string, maxLength: 2000, description: "승인자가 사건 요약에서 읽는 조사관 의견" }
        objectionDecisions: { type: array, maxItems: 100, description: "이의 결정(계정별, 추천 적용 2026-10-31, ADR-0171). 이의를 낸 계정마다 인정(ACCEPTED)·기각(REJECTED)과 이유. 인정한 계정은 계정별로 되돌린다(이용 제한 풀기 요청, 취소한 표의 우선 구매나 보상 건). 모든 이의가 결정되면 조치받은 계정이 모두 인정되어 되돌림을 마쳤을 때 REVERSED, 아니면 ACTIONED로 간다. 이의가 없는 계정·이미 결정한 이의는 422", items: { type: object, additionalProperties: false, required: [accountId, decision, reason], properties: { accountId: { type: string }, decision: { type: string, enum: [ACCEPTED, REJECTED] }, reason: { type: string, minLength: 1, maxLength: 1000, description: "팬에게 이의 결과의 이유로 그대로 보인다(SCR-042, 이의 결과 알림). 다른 계정·점수·근거 신호를 적지 않는다(추천 적용 2026-10-31, ADR-0171, FRN-070)" } } } }
        appealDecisions: { type: array, maxItems: 100, description: "소명 판단(제출한 계정만, 제출 전 계정은 422). 계정마다 인정(ACCEPTED)·불인정(REJECTED)과 이유. 묶음의 모든 계정이 인정되면 사건은 CLEARED로 닫히고 양도 잠금이 풀린다", items: { type: object, additionalProperties: false, required: [accountId, decision, reason], properties: { accountId: { type: string }, decision: { type: string, enum: [ACCEPTED, REJECTED] }, reason: { type: string, minLength: 1, maxLength: 1000 } } } }
    FraudCaseGraph:
      type: object
      description: "연결 그래프(SCR-071 ②): 계정과 그 계정이 쓴 기기 가명·결제 수단 연결값·연락처 가명·IP·ASN을 점과 선으로 준다. IP 점의 label은 원문이 아니라 가린 값(IPv4 /24, IPv6 /48 앞부분)이고, 원문은 조사관이 사유를 적어 여는 요청(POST /v1/ops/fraud-cases/{caseId}/ip-reveals)으로만 받는다(docs/security/authz-matrix.md §4.3, 추천 적용 2026-10-31, ADR-0171). 점이 상한(2,000 [가정])을 넘으면 앞부분만 주고 truncated를 true로 한다(화면은 묶음을 나눠 보라고 안내)"
      properties:
        nodes: { type: array, items: { type: object, properties: { nodeId: { type: string, description: "사건마다 서버가 만든 무작위 값(UUIDv4)이다. 계정 ID·가명·IP·ASN에서 계산하지 않는다(키 없는 해시와 원문 금지). nodeId와 실제 값의 대응표는 ops-svc가 ops DB fraud_graph_node에 두고, IP 점은 원문 대신 그 IP가 든 조사용 요청 기록 한 줄의 요청 ID를 가리킨다(추천 적용 2026-10-31, ADR-0171)" }, kind: { type: string, enum: [ACCOUNT, DEVICE, PAYMENT_METHOD, CONTACT, IP, ASN] }, label: { type: string, description: "계정 ID, 가명 앞 8글자, IP의 가린 값(IPv4 /24, IPv6 /48. 같은 대역의 서로 다른 IP는 nodeId가 다르다), ASN 번호" }, inCluster: { type: boolean, description: "ACCOUNT만. 지금 묶음에 든 계정인지" } } } }
        edges: { type: array, items: { type: object, properties: { from: { type: string, description: "nodes의 nodeId(무작위 값)" }, to: { type: string, description: "nodes의 nodeId(무작위 값)" }, kind: { $ref: '#/components/schemas/FraudLinkKind' }, firstSeenAt: { type: string, format: date-time }, lastSeenAt: { type: string, format: date-time }, count: { type: integer, minimum: 1 } } } }
        truncated: { type: boolean, default: false }
    FraudIpRevealCreate:
      type: object
      additionalProperties: false
      required: [nodeIds, reason]
      description: "연결 그래프 IP 점의 원문 열기(authz-matrix §4.3 '가린 값을 여는 절차'와 같은 방식, 추천 적용 2026-10-31, ADR-0171). 사유가 없으면 422다"
      properties:
        nodeIds: { type: array, minItems: 1, maxItems: 50, uniqueItems: true, items: { type: string }, description: "그 사건 그래프의 IP 점(kind IP)만. 한 번에 50개 [가정]까지" }
        reason: { type: string, minLength: 5, maxLength: 500, description: "열람 사유(접속기록에 남는다). 개인정보를 적지 않는다" }
    FraudIpReveal:
      type: object
      readOnly: true
      description: "연 IP 원문. Cache-Control: no-store이고 화면은 메모리에만 둔다"
      properties:
        items: { type: array, items: { type: object, properties: { nodeId: { type: string }, ip: { type: string, description: "원문 IP(IPv4는 점 표기, IPv6는 RFC 5952 표기)" } } } }
    FraudAppealRequestCreate:
      type: object
      additionalProperties: false
      required: [accountIds, reasonCategories, dueAt]
      description: "소명 요청(SCR-071 ④, POL-046 ③). 서버는 기한이 지금부터 24시간 [가정] 이상이고 입장 시작 전인지 본다. 보내면 그 계정들의 이 회차 티켓에 양도 잠금을 건다(ticket-svc SetTransferLock, 진행 중 양도 요청은 시스템이 철회). 잠금의 최대 기한은 그 계정에 처음 소명을 요청한 때 + 14일 [가정]이고 연장하지 않는다(같은 계정에 다시 요청해도 늘지 않는다). 그 계정들이 결제한 표를 양도로 받아 가진 사람(사건 밖 계정)에게도 같은 기한의 소명 기회를 알린다(FraudAppealView party HOLDER, 알림 FRAUD_HOLDER_NOTICE)(추천 적용 2026-10-31, ADR-0173)"
      properties:
        accountIds: { type: array, minItems: 1, maxItems: 100, items: { type: string }, description: "묶음 안의 계정만" }
        reasonCategories: { type: array, minItems: 1, maxItems: 5, uniqueItems: true, items: { $ref: '#/components/schemas/FraudReasonCategory' }, description: "알릴 사유 범주(하나 이상, POL-046 ①)" }
        dueAt: { type: string, format: date-time, description: "소명 기한. 기본 3일 [가정], 공연이 가까우면 줄이되 24시간 [가정] 아래로 내리지 않는다" }
    FraudAppealRequest: { type: object, properties: { appealRequestId: { type: string, format: uuid }, caseId: { type: string, format: uuid }, accountIds: { type: array, items: { type: string } }, dueAt: { type: string, format: date-time }, lockedTicketCount: { type: integer, minimum: 0 }, withdrawnOfferCount: { type: integer, minimum: 0, description: "잠그면서 시스템이 철회한 진행 중 양도 요청 수" }, lockExpiresAt: { type: [string, 'null'], format: date-time, description: "이 요청으로 처음 잠긴 계정들의 양도 잠금 최대 기한(이 요청 + 14일 [가정], 연장 없음). 다시 요청받은 계정은 처음 기한을 그대로 두므로 계정마다의 기한은 사건 상세의 members[].lockExpiresAt을 본다. 이 요청으로 처음 잠긴 계정이 없으면 null(추천 적용 2026-10-31, ADR-0173)" }, notifiedHolderCount: { type: integer, minimum: 0, description: "함께 소명 기회를 알린 받은 사람(그 계정들이 결제한 표를 지금 가진 사건 밖 계정)의 수. SetTransferLock 결과의 holder_account_id로 센다(추천 적용 2026-10-31, ADR-0173)" } } }
    FraudActionRequestCreate:
      type: object
      additionalProperties: false
      required: [fraudAction, accountIds, reason]
      description: "조치 요청(SCR-071 ⑥, POL-038 ⑪). 승인 업무 FRAUD_ACTION을 만들고, 승인·반려·철회는 /v1/ops/approval-requests/{approvalId} 아래 경로로 한다"
      properties:
        fraudAction: { type: string, enum: [CANCEL_TICKETS, RESTRICT, LIFT_RESTRICTION], description: "표 취소와 환급, 이용 제한 걸기, 이용 제한 풀기" }
        accountIds: { type: array, minItems: 1, maxItems: 100, items: { type: string } }
        ticketIds: { type: array, maxItems: 500, items: { type: string }, description: "CANCEL_TICKETS만. 비우면 그 계정들이 결제한 이 회차 티켓 가운데 받은 사람(사건 밖 계정)이 가진 표를 뺀 모두다. 받은 사람이 가진 표는 조사관이 그 사람의 소명(보유자 진술)을 본 뒤 표마다 넣을지 정해 여기에 적어야만 든다(추천 적용 2026-10-31, ADR-0173)" }
        restrictionEndsAt: { type: [string, 'null'], format: date-time, description: "RESTRICT만. 이용 제한 끝(POL-038 ⑤와 같은 기간 규칙). 부정 예매(사유 FRAUD) 이용 제한은 건 날 + 1년 [가정]을 넘지 못한다. 요청의 끝이 요청 시각 + 1년을 넘으면 422 restriction-too-long이다(실행은 요청 뒤라 건 날 + 1년도 넘지 않는다). 더 늘리려면 끝나기 전에 새 RESTRICT 요청(2인 승인)을 낸다(추천 적용 2026-10-31, ADR-0173)" }
        reason: { type: string, minLength: 1, maxLength: 2000 }
    FraudCaseSummary:
      type: object
      readOnly: true
      description: "승인 업무 FRAUD_ACTION에 붙는 사건 요약(읽기 전용, POL-038 ⑪, SCR-046). 그 업무의 요청자와 승인 자격자만 상세를 받고(그 밖은 404) 그 상세에 늘 실린다(추천 적용 2026-10-31, ADR-0171). 승인자는 조사 경로(/v1/ops/fraud-cases 아래)를 부르지 않고 이것만 본다. 계정 수·근거 신호 범주·소명 결과·조사관 의견과, 범위를 줄이는 데 쓰는 대상 계정·표의 내부 ID(targets)만 싣고, 기기 가명·연락처 가명·IP 같은 연결 값은 싣지 않는다. 열람은 접속기록에 남는다(추천 적용 2026-10-31, ADR-0171 결정 7. targets는 (추천 적용 2026-10-31, ADR-0173))"
      properties:
        caseId: { type: string, format: uuid }
        eventId: { type: string }
        reasonCategory: { $ref: '#/components/schemas/FraudReasonCategory' }
        accountCount: { type: integer, minimum: 0 }
        ticketCount: { type: integer, minimum: 0, description: "조치 대상 티켓 수" }
        purchaseCount: { type: integer, minimum: 0 }
        limitPerPerson: { type: integer, minimum: 1 }
        sharedAttributes: { type: array, items: { $ref: '#/components/schemas/FraudLinkKind' } }
        signals: { type: array, items: { $ref: '#/components/schemas/FraudSignal' } }
        appealOutcome: { type: string, enum: [NOT_REQUESTED, PENDING, ACCEPTED, REJECTED, PARTIAL] }
        investigatorOpinion: { type: [string, 'null'] }
        cancelDeadlineAt: { type: string, format: date-time, description: "표 취소는 이 시각까지만 승인할 수 있고, 취소한 좌석은 언제나 정가 재판매로 돌린다(2026-10-31 정함, 그래서 예전 초안의 재판매 여부 칸 resaleOnCancel은 뺐다)" }
        appealCounts: { type: object, description: "계정별 소명 결과의 수. 범위 줄이기용 targets 말고는 계정 ID를 싣지 않는다(추천 적용 2026-10-31, ADR-0173)", properties: { accepted: { type: integer, minimum: 0 }, rejected: { type: integer, minimum: 0 }, expired: { type: integer, minimum: 0, description: "기한까지 제출하지 않음" }, submitted: { type: integer, minimum: 0, description: "제출했고 판단 전" }, pending: { type: integer, minimum: 0, description: "요청했고 제출 전" } } }
        snapshotHash: { type: string, pattern: '^[0-9a-f]{64}$', description: "고정 시점 조사용 기록의 해시(fraud_snapshot.inv_hash)" }
        targets: { type: array, maxItems: 100, description: "조치 요청의 대상 계정마다 한 줄. 승인자가 범위를 줄일 때(ApprovalDecisionBody.excludeAccountIds·excludeTicketIds) 고르는 목록이다. 계정 ID(내부 ID)와 표 ID, 그 계정의 소명 결과만 싣고 실명·연락처·가명·IP·연결 값은 싣지 않는다. 범위 줄이기용 targets 말고는 계정 ID를 싣지 않는다. 내부 ID는 API 본문(excludeAccountIds·excludeTicketIds)에 쓰려는 것이고, 화면은 ID를 보이지 않고 줄마다 '계정 1·2…'로 이름 붙인다(추천 적용 2026-10-31, ADR-0173)", items: { type: object, properties: { accountId: { type: string }, ticketIds: { type: array, items: { type: string }, description: "이 요청에 든 그 계정 결제 표(CANCEL_TICKETS만)" }, holderTicketIds: { type: array, items: { type: string }, description: "그 가운데 받은 사람(사건 밖 계정)이 가진 표. 조사관이 받은 사람의 진술을 보고 넣은 표다" }, appealOutcome: { type: string, enum: [NOT_REQUESTED, PENDING, SUBMITTED, ACCEPTED, REJECTED, EXPIRED] } } } }
    ExternalPostCreate:
      additionalProperties: false
      type: object
      required: [eventId, url, capturedAt, source, capture]
      description: "외부 되팔이 게시물 수동 등록 본문(multipart/form-data, SCR-070 ④, FR-072). 화면 캡처는 PNG·JPEG·PDF만, 10MB [가정]까지. 서버가 캡처의 SHA-256을 계산해 남기고, 원본은 격리 버킷에 받아 악성 코드 검사 뒤 증거 버킷으로 옮긴다(공문 원본과 같은 방식). 자동 수집은 하지 않는다(ADR-0171 결정 4). 최소한만 받는다(법률 확인 37번(추천 적용 2026-10-31, ADR-0173)): 로그인 없이 누구나 볼 수 있는 공개 게시물만, 게시물 한 건의 화면만 받고 작성자 프로필·다른 글·신원 추적은 하지 않는다. 서버는 화면 글자 읽기(OCR)로 연락처를 뽑지 않고 contactRef와 자동으로 맞추지 않는다(대조는 좌석으로만). 보기용 사본은 연락처·계좌·채팅 링크를 가리고, 신고자 정보는 수집본에 넣지 않는다"
      properties:
        eventId: { type: string }
        url: { type: string, format: uri, maxLength: 2048 }
        capturedAt: { type: string, format: date-time, description: "조사관이나 신고자가 게시물을 본 시각" }
        source: { type: string, enum: [REPORT, MANUAL], description: "REPORT는 문의 유형 RESALE_POST_REPORT(외부 되팔이 게시물 신고, FR-069)의 문의로 받은 건이고(그 밖의 건이면 422), MANUAL은 조사관이 공개 게시물을 직접 본 등록이다(추천 적용 2026-10-31, ADR-0173)" }
        reportCaseId: { type: string, description: "source REPORT일 때 그 문의의 CS 처리함 건(kind INQUIRY, 문의 유형 RESALE_POST_REPORT). 그 밖의 건이면 422(추천 적용 2026-10-31, ADR-0173)" }
        claimedSeats: { type: string, maxLength: 1000, description: "게시물이 말하는 좌석·구역(적힌 그대로)" }
        postedAt: { type: string, format: date-time, description: "게시 시각(게시물 화면에 보일 때만)(추천 적용 2026-10-31, ADR-0173)" }
        maskRegions: { type: array, maxItems: 20, description: "보기용 사본에서 칠할 자리(연락처·계좌·채팅 링크). 화면 글자 읽기(OCR)를 쓰지 않으므로 조사관이 캡처 위에 상자로 고른다. 값은 캡처 크기에 대한 비율(0~1)이고, 서버가 그 부분을 칠해 보기용 사본을 만든다. 원본은 바꾸지 않는다. multipart 안에서는 JSON 부분으로 보낸다(추천 적용 2026-10-31, ADR-0173)", items: { $ref: '#/components/schemas/MaskRegionInput' } }
        capture: { type: string, format: binary }
    MaskRegion: { type: object, required: [x, y, w, h], description: "캡처 위의 가릴 상자 하나(왼쪽 위 기준, 캡처 너비·높이에 대한 비율(추천 적용 2026-10-31, ADR-0173))", properties: { x: { type: number, minimum: 0, maximum: 1 }, y: { type: number, minimum: 0, maximum: 1 }, w: { type: number, exclusiveMinimum: 0, maximum: 1 }, h: { type: number, exclusiveMinimum: 0, maximum: 1 } } }
    MaskRegionInput:
      type: object
      additionalProperties: false
      description: MaskRegion의 요청용(정의 밖 칸을 400으로 거절한다). 칸의 뜻은 원래 스키마(MaskRegion)와 같고 응답은 MaskRegion(열림)다(guidelines §1 '요청은 닫고 응답은 연다', BAS-040).
      required: [x, y, w, h]
      properties:
        x: {type: number, minimum: 0, maximum: 1}
        y: {type: number, minimum: 0, maximum: 1}
        w: {type: number, exclusiveMinimum: 0, maximum: 1}
        h: {type: number, exclusiveMinimum: 0, maximum: 1}
    ExternalPost: { type: object, properties: { postId: { type: string, format: uuid }, eventId: { type: string }, url: { type: string }, site: { type: string, description: "주소의 호스트" }, capturedAt: { type: string, format: date-time }, postedAt: { type: [string, 'null'], format: date-time, description: "게시 시각(화면에 보였을 때만(추천 적용 2026-10-31, ADR-0173))" }, maskRegions: { type: array, items: { $ref: '#/components/schemas/MaskRegion' }, description: "보기용 사본에서 칠한 자리(추천 적용 2026-10-31, ADR-0173)" }, source: { type: string, enum: [REPORT, MANUAL] }, captureSha256: { type: string, pattern: '^[0-9a-f]{64}$' }, scanStatus: { type: string, enum: [PENDING, CLEAN, THREAT] }, matchedTicketCount: { type: integer, minimum: 0, description: "좌석 대조로 맞은 티켓 수" }, registeredBy: { type: string }, createdAt: { type: string, format: date-time } } }
    ExternalPostPage: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/ExternalPost' } }, nextCursor: { type: [string, 'null'] } } }
    EvidenceBundleCreate: { type: object, additionalProperties: false, required: [reason], properties: { reason: { type: string, minLength: 1, maxLength: 1000 } } }
    EvidenceBundle:
      type: object
      description: "증거 묶음(SCR-071 ⑦, FR-074, docs/data.md evidence_bundle). 파일마다의 SHA-256과 묶음 전체 해시(목록 파일의 SHA-256)를 준다. 열람·내보내기는 관리 연속성 기록(custody)에 더해진다(추천 적용 2026-10-31, ADR-0171 결정 8)"
      properties:
        bundleId: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        status: { type: string, enum: [BUILDING, SEALED, DISPOSED], description: "만드는 중, 봉인(해시 확정), 파기" }
        snapshotHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        manifestSha256: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$', description: "SEALED부터" }
        files: { type: array, items: { type: object, properties: { name: { type: string }, sha256: { type: string, pattern: '^[0-9a-f]{64}$' }, sizeBytes: { type: integer } } } }
        holdReason: { type: string, enum: [DISPUTE, INVESTIGATION, OBJECTION], description: "보존 이유. OBJECTION은 이의 창이 끝나면 시스템이 끝낸다. DISPUTE·INVESTIGATION의 끝은 조사관이 요청하고(hold-end-requests) 요청자가 아닌 commander가 확인해야(hold-end-confirmations) 기록되고, 그때부터 파기 시계가 돈다(추천 적용 2026-10-31, ADR-0171)" }
        holdEndRequest: { type: [object, 'null'], description: "확인을 기다리는 보존 끝 요청(요청자, 요청 시각, 근거). 확인되면 null이 되고 holdEndedAt이 찬다", properties: { requestedBy: { type: string }, requestedAt: { type: string, format: date-time }, basis: { type: string } } }
        holdEndedAt: { type: [string, 'null'], format: date-time, description: "보존 끝을 확인한 시각. 보존 끝 = 이 시각 + 30일 [가정]" }
        custody: { type: array, items: { type: object, properties: { seq: { type: integer }, action: { type: string, enum: [CREATED, SEALED, VIEWED, EXPORTED, HOLD_CHANGED, HOLD_END_REQUESTED, HOLD_ENDED, DISPOSED], description: "HOLD_CHANGED는 보존 이유 바꾸기(이의 기간 → 분쟁·수사), HOLD_ENDED는 보존 끝 기록(docs/data.md evidence_custody_log.action, 추천 적용 2026-10-31)" }, actorId: { type: string }, reason: { type: string }, occurredAt: { type: string, format: date-time } } } }
        createdAt: { type: string, format: date-time }
    EvidenceExportCreate:
      type: object
      additionalProperties: false
      required: [kind, reason]
      description: "증거 묶음 내보내기(FR-074). AUTHORITY는 접수된 신고기관·수사기관 요청(FR-034, /v1/ops/compliance/data-requests)에 묶어서만 그 요청 범위로 낸다. PROMOTER는 회차 집계만(사람 단위 행 없음, 5건 미만 칸은 합침)이다. COMPLAINT는 고소·고발장에 붙일 개인정보 없는 요약(ComplaintPacket)이다. 계정 ID·실명·연락처·IP·결제 정보·연계정보·묶음의 다른 계정은 싣지 않는다(대법원 2018도1966, 법률 확인 35번(추천 적용 2026-10-31, ADR-0173))"
      properties:
        kind: { type: string, enum: [AUTHORITY, PROMOTER, COMPLAINT] }
        dataRequestId: { type: string, format: uuid, description: "AUTHORITY일 때 필수. 접수된 기관 요청" }
        reason: { type: string, minLength: 1, maxLength: 1000 }
    EvidenceExport: { type: object, properties: { exportId: { type: string, format: uuid }, kind: { type: string, enum: [AUTHORITY, PROMOTER, COMPLAINT] }, dataRequestId: { type: [string, 'null'], format: uuid }, documentId: { type: [string, 'null'], format: uuid, description: "AUTHORITY일 때 그 기관 요청에 붙은 제출 파일(ComplianceDocument kind SUBMISSION_FILE). 제출 기록은 FR-034 절차로 남긴다" }, sha256: { type: string, pattern: '^[0-9a-f]{64}$' }, rows: { type: integer }, createdAt: { type: string, format: date-time } } }
    ComplaintPacket:
      type: object
      description: "고소·고발용 요약(증거 묶음 내보내기 kind COMPLAINT의 200 본문, FR-074, 법률 확인 35번(추천 적용 2026-10-31, ADR-0173)). 피고소인은 '성명불상자(PEAKET 부정 예매 사건 caseNumber번에 묶인 계정 accountCount개를 쓴 사람)'로 적는다. 개인정보 칸이 없도록 서버는 이 목록의 칸만 낸다(응답 직렬화 스키마가 정의 밖 칸을 버린다. 응답 칸 추가가 깨짐이 아니도록 스키마는 닫지 않는다, guidelines §1, BAS-040). 계정 ID·실명·연락처·IP·결제 정보·연계정보·묶음의 다른 계정은 없다. 고소장 최소 항목과 고발 선택은 docs/features/forensic-replay.md §6.7.7이다"
      required: [caseNumber, eventName, showAt, salesOpenedAt, reasonCategories, bypassedControls, purchasedCount, limitPerPerson, accountCount, resaleEvidence, resalePosts, bundleManifestSha256, statement]
      properties:
        caseNumber: { type: string, description: "사건 번호(fraud_case.id). 개인을 가리키지 않는다" }
        eventName: { type: string, description: "공연명" }
        showAt: { type: string, format: date-time, description: "회차 공연 시각" }
        salesOpenedAt: { type: string, format: date-time, description: "판매 시작 시각" }
        reasonCategories: { type: array, minItems: 1, items: { $ref: '#/components/schemas/FraudReasonCategory' } }
        bypassedControls: { type: array, items: { type: string }, description: "사유 범주가 말하는 우회한 보안 조치의 이름(예: 1인 매수 한도, 대기열, 봇 판정). 방법의 세부·탐지 규칙 값은 싣지 않는다" }
        purchasedCount: { type: integer, minimum: 0, description: "사건 계정들이 산 매수 합" }
        limitPerPerson: { type: integer, minimum: 1, description: "1인 매수 한도" }
        accountCount: { type: integer, minimum: 1, description: "사건에 묶인 계정 수" }
        resaleEvidence: { type: boolean, description: "되팔 목적의 증거(외부 되팔이 게시물)가 있는지. false면 공연법 제4조의2 제1항 제1호를 적용 법조로 쓰지 않는다" }
        resalePosts: { type: array, items: { type: object, required: [url, postedAt, captureSha256], properties: { url: { type: string, format: uri }, postedAt: { type: string, format: date-time, description: "게시 시각(게시물에 보이는 값, 없으면 수집 시각)" }, captureSha256: { type: string, pattern: '^[0-9a-f]{64}$', description: "수집본 캡처의 SHA-256(ExternalPost.captureSha256)" } } }, description: "공개 게시물의 주소·게시 시각·캡처 해시. 캡처 파일은 이 본문에 싣지 않는다" }
        bundleManifestSha256: { type: string, pattern: '^[0-9a-f]{64}$', description: "증거 묶음의 봉인 해시(목록 파일의 SHA-256)" }
        statement: { type: string, const: "기록을 보존하고 있으며 영장이나 공연법 제4조의3 요청을 받으면 정해진 절차로 냅니다", description: "고정 문장" }
    ResearchExportCreate: { type: object, additionalProperties: false, required: [eventId, fromMs, toMs, reason], description: "연구 갈래 내보내기 본문(회차 가명 사건, docs/features/forensic-replay.md. 예전 초안 이름은 /v1/forensics/exports였다). 목적은 과학적 연구(봇 판정 규칙의 탐지율·사람 오탐률 개선)이고 가명정보 처리 기록(pseudonymization_log)에 목적 SCIENTIFIC_RESEARCH로 통계작성(STATISTICS)과 나눠 남는다(추천 적용 2026-10-31, ADR-0173)", properties: { eventId: { type: string }, fromMs: { type: integer, minimum: 0, description: "오픈 기준 시작(밀리초)" }, toMs: { type: integer, minimum: 0, description: "오픈 기준 끝. 시간창은 30분 [가정] 이하" }, reason: { type: string, minLength: 1, maxLength: 500 } } }
    ResearchExport: { type: object, properties: { exportId: { type: string, format: uuid }, eventId: { type: string }, status: { type: string, enum: [PENDING, READY, FAILED] }, createdAt: { type: string, format: date-time } } }
    FraudAppealView: { type: object, description: "팬에게 보이는 부정 예매 소명 요청 하나(GET /v1/fraud-appeal-requests, 추천 적용 2026-10-31, ADR-0171). party PAYER는 사건 계정(결제자)의 것이고, HOLDER는 사건 계정이 결제한 표를 양도로 받아 가진 사람의 것이다. HOLDER도 같은 기한에 같은 소명 제출(kind FRAUD_CASE)로 사정을 알릴 수 있다(추천 적용 2026-10-31, ADR-0173)", properties: { caseId: { type: string, format: uuid, description: "소명 제출의 targetId" }, eventId: { type: string }, party: { type: string, enum: [PAYER, HOLDER], default: PAYER, description: "PAYER 결제자(사건 계정), HOLDER 받은 사람. HOLDER에는 사유 범주·이용 제한·우선 구매·잠긴 표·잠금 기한을 싣지 않고 lockActive는 늘 false다(결제자의 사유라서. 받은 사람은 기한과 가진 표만 본다)(추천 적용 2026-10-31, ADR-0173)" }, heldTicketIds: { type: array, items: { type: string }, description: "HOLDER만. 내가 가진 이 사건의 표(결제자가 결제한 표). 받은 사람은 원래 다시 양도할 수 없고 돌려주기는 되므로 잠금 줄을 보이지 않는다(lockActive false, lockExpiresAt null). PAYER면 빈 목록(추천 적용 2026-10-31, ADR-0173)" }, excludedTicketIds: { type: array, items: { type: string }, description: "HOLDER만. heldTicketIds 가운데 이 사건에서 더는 취소하지 않게 된 표(취소 대상에서 빠짐). 빠졌다고 알린 표는 이 사건에서 다시 취소 대상이 되지 않는다(core.proto excluded_ticket_ids(추천 적용 2026-10-31, ADR-0173))" }, reasonCategories: { type: array, items: { $ref: '#/components/schemas/FraudReasonCategory' }, description: "PAYER만. HOLDER면 빈 목록" }, dueAt: { type: string, format: date-time, description: "소명 기한" }, objectionDueAt: { type: [string, 'null'], format: date-time, description: "조치 결과를 알린 뒤의 이의 창 끝(통지 + 30일 [가정]). 조치 전이거나 HOLDER면 null(받은 사람은 이의 대신 고객 문의로 묻는다, 추천 적용 2026-10-31, ADR-0173). 이 안이면 같은 소명 제출(kind FRAUD_CASE)이 이의로 접수된다" }, objectionStatus: { type: string, enum: [NONE, SUBMITTED, ACCEPTED, REJECTED], description: "이의 상태" }, objectionNote: { type: [string, 'null'], maxLength: 1000, description: "이의 결과의 이유(조사관이 사건 고치기 objectionDecisions[].reason에 적은 글, 팬에게 그대로 보인다). 이의가 결정되기 전이면 null(추천 적용 2026-10-31, ADR-0171, FRN-070)" }, actionResult: { type: [object, 'null'], description: "내 계정에 내려진 조치(조치 결과를 알린 뒤에만, 아니면 null). 조치 결과 알림과 같은 값이다(추천 적용 2026-10-31, ADR-0171, FRN-070)", properties: { cancelledTicketIds: { type: array, items: { type: string }, description: "부정 예매로 취소한 내 티켓(전액 환급). HOLDER면 내가 가진 표 가운데 취소된 표이고, 환급은 결제자에게 간다(알림 FRAUD_HOLDER_RESULT(추천 적용 2026-10-31, ADR-0173))" }, restrictedUntil: { type: [string, 'null'], format: date-time, description: "이용 제한 끝. 제한이 없거나 HOLDER면 null" } } }, lockedTicketIds: { type: array, items: { type: string }, description: "PAYER만. 이 요청으로 양도가 잠긴 내 티켓. 소명 인정·사건 정상 종료·조치 실행 끝·묶음에서 빠짐·입장 시작·조치 요청의 반려·만료·최대 기한 가운데 먼저 오는 때에 풀린다. 풀려도 목록은 그대로 두고, 풀렸는지는 lockActive false로만 알린다(풀림 알림 FRAUD_TRANSFER_LOCK_RELEASED(추천 적용 2026-10-31, ADR-0173))" }, lockActive: { type: boolean, default: false, description: "양도 잠금이 지금 걸려 있으면 true(core.proto lock_active). 풀리면 false가 되고 lockedTicketIds는 그대로 남는다. HOLDER는 늘 false다. 주문·결제 화면(SCR-011)은 같은 eventId이고 party PAYER이며 이 값이 true인 항목이 있을 때만 결제 전 잠금 안내를 보인다(추천 적용 2026-10-31, ADR-0173)" }, lockExpiresAt: { type: [string, 'null'], format: date-time, description: "양도 잠금의 최대 기한(그 계정의 첫 소명 요청 + 14일 [가정], 연장 없음). 늦어도 이때 풀린다. 잠금이 없거나 HOLDER면 null(core.proto lock_expires_at(추천 적용 2026-10-31, ADR-0173))" }, status: { type: string, enum: [OPEN, SUBMITTED, ACCEPTED, REJECTED, EXPIRED], description: "소명 상태. OPEN 제출 전, SUBMITTED 제출했고 판단 전, ACCEPTED 인정, REJECTED 불인정, EXPIRED 기한까지 제출하지 않음" }, priorityPurchases: { type: array, description: "우선 구매(이의가 인정된 부정 예매 표 취소의 되돌림, POL-046 ⑦). 이의가 인정되어 취소한 표를 되돌릴 때만 있고, 그 사건의 이용 제한 풀기가 끝난(Done) 뒤에 열린다(48시간은 그때부터, 제한이 없던 계정은 이의 인정 바로 뒤). 표를 무상으로 되살리지 않고, 같은 좌석(아직 팔리지 않았을 때)이나 같은 등급 남은 좌석을 원래 가격·취소 수수료 없이 48시간 [가정] 안에 다시 살 수 있다. 입장 확정에 grantId를 priorityGrantId로 보내 산다", items: { type: object, properties: { grantId: { type: string, format: uuid }, seatLabel: { type: string }, price: { type: integer }, expiresAt: { type: string, format: date-time }, status: { type: string, enum: [OFFERED, USED, EXPIRED, WITHDRAWN], description: "USED는 결제 완료. 결제가 실패하면 OFFERED 그대로이고 기한 안에서 다시 시도할 수 있다" } } } }, version: { type: integer, description: "사본의 판 번호" } } }
    FraudAppealViewPage: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/FraudAppealView' } }, nextCursor: { type: [string, 'null'] } } }
    PartnerTeamAccountPage: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/PartnerTeamAccount' } }, nextCursor: { type: [string, 'null'] } } }
    EventStatus: { type: string, enum: [SCHEDULED, CANCELLED, POSTPONED], description: "회차 상태(docs/data.md event.status). 판매 상태(판매 전·판매 중·판매 종료)는 이 값이 아니다" }
    EventPublicSummary:
      type: object
      description: "회차 공개 요약과 공연 상세(GET /v1/events/{eventId}). 처음 다섯 칸은 소유자 결정 2026-10-30(open-items 78번, 칸은 추천 적용 2026-10-30)이고, 스캐너 승인 화면(SCR-051)은 그 가운데 title·startsAt·sellerName을 읽는다. 나머지는 공연 상세(SCR-002) 정적 셸이 읽는 칸이다(추천 적용 2026-11-05, ADR-0200). 등급별 판매 상태·후기 요약·개인 값은 싣지 않는다(실시간 값은 대기 상태 파일, 후기는 review-summary, 개인 값은 화면 스크립트)"
      properties:
        eventId: { type: string }
        productionId: { type: string }
        title: { type: string, description: "공연명" }
        startsAt: { type: string, format: date-time, description: "회차 시작" }
        sellerName: { type: string, description: "판매자 상호(판매자 신원정보 SellerInfo.legalName과 같은 값, 전자상거래법 제20조 제2항, POL-037). 공연 상세의 판매자 줄에 보이는 값이다" }
        genre: { $ref: '#/components/schemas/Genre' }
        ageRating: { type: string, description: "관람 연령(예: 만 7세 이상)" }
        runningMinutes: { type: integer, description: "러닝타임(분)" }
        posterUrl: { type: string, format: uri, description: "포스터 파생본 묶음의 기준 주소(ProductionCard.posterUrl과 같은 규칙, ADR-0199 결정 4)" }
        posterAlt: { type: string }
        descriptionText: { type: string, maxLength: 20000, description: "공연 설명 글의 글자판(줄바꿈만, 20,000자 [가정]). 서식은 description이다. 이 칸은 글자로만 그린다(ADR-0200 결정 1)" }
        description: { $ref: '#/components/schemas/ProductionDescriptionDoc' }
        detailImages:
          type: array
          maxItems: 10
          description: "상세 이미지 0~10장(ADR-0062 결정 38). 이미지에만 있는 정보는 설명 글에도 있다"
          items: { type: object, required: [url, alt], properties: { url: { type: string, format: uri, description: "파생본 묶음의 기준 주소" }, alt: { type: string } } }
        artists: { type: array, maxItems: 20, items: { type: object, properties: { artistId: { type: string }, name: { type: string } } } }
        placeId: { type: string }
        placeName: { type: string }
        placeAddress: { type: string, description: "도로명 주소(장소 섹션의 [주소 복사])" }
        openAt: { type: string, format: date-time, description: "티켓 오픈(T=0)" }
        lobbyOpensAt: { type: [string, 'null'], format: date-time, description: "로비 개방(오픈 − 로비 분). 로비 셔플을 끈 회차(FIFO)는 null" }
        entryOpensAt: { type: [string, 'null'], format: date-time, description: "입장 시작" }
        endsAt: { type: string, format: date-time, description: "공연 종료 예정" }
        saleEndsAt: { type: string, format: date-time, description: "판매 종료(공연 시작 − 24시간, ADR-0064)" }
        status: { $ref: '#/components/schemas/EventStatus' }
        queueOrder: { type: string, enum: [HYBRID, PREQUEUE_SHUFFLE, FIFO], description: "정렬 방식 이름(회차의 lobbyShuffle·openBatch 두 값에서 계산, ADR-0118). 화면은 POL-004 표준 문구를 고른다" }
        seatAssignment: { type: string, enum: [PICK, AUTO] }
        perPersonLimit: { type: integer, description: "1인 한도(POL-011)" }
        reentryAllowed: { type: boolean, description: "재입장 허용(POL-018)" }
        badges: { type: array, items: { type: string, enum: [PREQUEUE_SHUFFLE, HYBRID, FIFO, PRESALE, AUTO_SEAT] }, description: "판매 정보 배지 코드(ProductionCard.badges와 같다)" }
        rounds:
          type: array
          maxItems: 60
          description: "같은 공연의 공개 회차(시작 순, 이 회차 포함). 취소된 회차와 판매 종료가 지난 회차는 빼고(이 회차는 늘 넣는다) 60개 [가정]까지다. 승인 뒤 더한 회차(변경분, ADR-0198 결정 3)는 재승인 전까지 없다. 회차 칩(CMP-066)이 회차마다 주소를 바꾸고 오픈 예정·판매 중·판매 종료를 가른다(ADR-0093)"
          items: { type: object, properties: { eventId: { type: string }, startsAt: { type: string, format: date-time }, openAt: { type: string, format: date-time }, saleEndsAt: { type: string, format: date-time }, status: { $ref: '#/components/schemas/EventStatus' } } }
        priceTiers:
          type: array
          maxItems: 20
          description: "등급별 정가(보이는 순서). 판매 상태 배지는 싣지 않는다. 실시간 상태는 등급 ID로 맞춰 화면이 얹는다(출처는 HOT-010·HOT-311, ADR-0200 결정 2). core-svc가 회차 배치본의 가격 등급(마지막 승인 내용)으로 채우고 배치본이 없으면 빈 목록이다. 배치본 하나에 16개까지다(추천 적용 2026-11-10, ADR-0260 결정 12)"
          items: { type: object, properties: { tierId: { type: string, description: "등급 ID(좌석맵 판의 tierId, 대기 상태 파일 soldOutTiers와 같은 값)" }, name: { type: string, description: "등급 이름(예: R석)" }, price: { type: integer, description: "정가(원). 예매 수수료가 없어 소비자가 내는 총금액이다(POL-032)" } } }
        seller: { $ref: '#/components/schemas/SellerInfo' }
        salePhases:
          type: array
          maxItems: 10
          description: "이 회차의 판매 단계 요약(오픈부터 판매 종료까지, 시작 순). 마지막 승인 내용의 판매 정책 규칙으로 core-svc가 계산한다(@peaket/validation salePhases, 추천 적용 2026-11-10, ADR-0261 결정 3·5). 규칙이 없으면 GENERAL 하나다. 명단 키는 싣지 않는다. 팬마다 대상인지는 GET /v1/events/{eventId}/sale-eligibility다"
          items: { $ref: '#/components/schemas/SalePhase' }
        refundFees:
          type: array
          maxItems: 20
          description: "이 회차에 걸리는 판매 정책의 취소 공제율 구간(공연일까지 남은 달력일 기준, 남은 날이 많은 차례). 빈 목록이면 POL-032 기본 공제표다. 적지 않은 날도 POL-032 기본 공제율이다(ADR-0261 결정 5). 한 회차에 걸리는 구간이 20개를 넘는 규칙은 저장 때 422 TOO_MANY_REFUND_BANDS이고, 여기는 방어로 20개까지만 싣는다(추천 적용, 2026-11-10, 리뷰, ADR-0261 결정 13)"
          items: { $ref: '#/components/schemas/SalePolicyRefundBand' }
    SalePhase:
      type: object
      description: "판매 단계 한 조각(ADR-0261 결정 3). PRESALE은 명단이 없는 사람이 들어갈 수 없는 창이다. limitPerPerson은 표시용이고 강제는 홀드 때의 평가다. 이웃한 조각은 종류와 창을 여는 명단 키 집합이 같을 때만 합친다(한도는 작은 값, 추천 적용, 2026-11-10, 리뷰, ADR-0261 결정 13)"
      required: [kind, startsAt, endsAt, limitPerPerson]
      properties:
        kind: { type: string, enum: [PRESALE, GENERAL] }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        limitPerPerson: { type: integer, minimum: 1, maximum: 10 }
    FanSaleEligibility:
      type: object
      description: "팬별 판매 자격(GET /v1/events/{eventId}/sale-eligibility, Cache-Control: no-store, ADR-0261 결정 5, ADR-0213 결정 1). phases는 공개 요약 salePhases와 같은 차례·시각이다"
      required: [eventId, phases, lists]
      properties:
        eventId: { type: string, format: uuid }
        phases:
          type: array
          maxItems: 10
          items:
            type: object
            required: [kind, startsAt, endsAt, eligible, limitPerPerson]
            properties:
              kind: { type: string, enum: [PRESALE, GENERAL] }
              startsAt: { type: string, format: date-time }
              endsAt: { type: string, format: date-time }
              eligible: { type: boolean, description: "이 계정이 그 단계의 진입 판정을 지나는가(명단 대상 여부)" }
              limitPerPerson: { type: integer, minimum: 1, maximum: 10, description: "이 계정에게 나올 수 있는 한도 가운데 가장 작은 값(표시용)" }
        lists:
          type: array
          maxItems: 10
          description: "이 계정이 든 이 공연의 판매 자격 명단. 공연 상세의 명단 출처·목적·파기 고지(d5 §5.2 '선예매 대상')에 쓴다"
          items:
            type: object
            required: [name, destroyAt]
            properties:
              name: { type: string, description: "명단 표시 이름" }
              destroyAt: { type: string, format: date-time, description: "명단 파기 예정 시각(판매 기간 끝 + 1일 [가정])" }
    ProductionDescriptionInline:
      description: "글자 또는 줄바꿈(CMP-070)"
      oneOf:
        - type: object
          required: [t, v]
          properties:
            t: { type: string, enum: [text] }
            v: { type: string, maxLength: 20000 }
            b: { type: boolean, enum: [true], description: "강조. 없으면 강조 없음" }
        - type: object
          required: [t]
          properties:
            t: { type: string, enum: [br] }
    ProductionDescriptionDoc:
      type: object
      description: "공연 설명 구조 문서(CMP-070). HTML이 아니라 허용 노드 다섯(문단·줄바꿈·강조·목록·제목)만 담는다(asvs/catalog-review 1.3.1, ADR-0204). 합계 상한은 글자판(블록 사이 빈 줄 포함) 20,000자, 노드 5,000개 [가정]이고 넘으면 400이다(ADR-0244)"
      required: [v, blocks]
      properties:
        v: { type: integer, enum: [1] }
        blocks:
          type: array
          maxItems: 200
          items:
            oneOf:
              - type: object
                required: [t, c]
                properties:
                  t: { type: string, enum: [p] }
                  c: { type: array, maxItems: 5000, items: { $ref: '#/components/schemas/ProductionDescriptionInline' } }
              - type: object
                required: [t, level, c]
                properties:
                  t: { type: string, enum: [h] }
                  level: { type: integer, enum: [2, 3] }
                  c: { type: array, maxItems: 5000, items: { $ref: '#/components/schemas/ProductionDescriptionInline' } }
              - type: object
                required: [t, items]
                properties:
                  t: { type: string, enum: [ul, ol] }
                  items: { type: array, maxItems: 5000, items: { type: array, maxItems: 5000, items: { $ref: '#/components/schemas/ProductionDescriptionInline' } } }
    ProductionDescriptionInlineInput:
      description: "글자 또는 줄바꿈(CMP-070)"
      oneOf:
        - type: object
          additionalProperties: false
          required: [t, v]
          properties:
            t: { type: string, enum: [text] }
            v: { type: string, maxLength: 20000 }
            b: { type: boolean, enum: [true], description: "강조. 없으면 강조 없음" }
        - type: object
          additionalProperties: false
          required: [t]
          properties:
            t: { type: string, enum: [br] }
    ProductionDescriptionDocInput:
      type: object
      additionalProperties: false
      description: "공연 설명 구조 문서(CMP-070). HTML이 아니라 허용 노드 다섯(문단·줄바꿈·강조·목록·제목)만 담는다(asvs/catalog-review 1.3.1, ADR-0204). 합계 상한은 글자판(블록 사이 빈 줄 포함) 20,000자, 노드 5,000개 [가정]이고 넘으면 400이다(ADR-0244)"
      required: [v, blocks]
      properties:
        v: { type: integer, enum: [1] }
        blocks:
          type: array
          maxItems: 200
          items:
            oneOf:
              - type: object
                additionalProperties: false
                required: [t, c]
                properties:
                  t: { type: string, enum: [p] }
                  c: { type: array, maxItems: 5000, items: { $ref: '#/components/schemas/ProductionDescriptionInlineInput' } }
              - type: object
                additionalProperties: false
                required: [t, level, c]
                properties:
                  t: { type: string, enum: [h] }
                  level: { type: integer, enum: [2, 3] }
                  c: { type: array, maxItems: 5000, items: { $ref: '#/components/schemas/ProductionDescriptionInlineInput' } }
              - type: object
                additionalProperties: false
                required: [t, items]
                properties:
                  t: { type: string, enum: [ul, ol] }
                  items: { type: array, maxItems: 5000, items: { type: array, maxItems: 5000, items: { $ref: '#/components/schemas/ProductionDescriptionInlineInput' } } }
    PartnerProductionCreate:
      type: object
      additionalProperties: false
      description: "공연 등록 본문(POST /v1/partner/productions, SCR-021 위저드의 공연 정보·회차 저장, 추천 적용 2026-11-05, ADR-0198 결정 1). 이미지(HOT-190), 좌석맵·가격 등급(HOT-210~240), 판매 정책 DSL·판매 자격 명단(HOT-250)은 각자 경로로 더한다. 판매자 칸은 없다(테넌트는 요청마다 identity에서 받은 값, authz-matrix §3.3). 공연장은 placeId와 newPlace 가운데 꼭 하나다(둘 다거나 둘 다 없으면 400)"
      required: [title, genre, artists, events]
      properties:
        description: { $ref: '#/components/schemas/ProductionDescriptionDocInput' }
        kopisFields:
          type: object
          additionalProperties: false
          description: "공연예술통합전산망 항목 가운데 파트너가 적는 칸(공연법 시행규칙 §2, transfer-refund §2.4). 나머지는 공연명·회차·공연장·가격·판매 집계에서 온다. 위저드가 임시저장하므로 여기서는 선택이고 필수 여부는 판매 승인 요청이 본다(ADR-0244)"
          properties:
            producer: { type: string, minLength: 1, maxLength: 200, description: "기획사·제작사 [가정]" }
            notice: { type: string, minLength: 1, maxLength: 1000, description: "안내 사항 [가정]" }
        title: { type: string, minLength: 1, maxLength: 100, description: "공연명 1~100자 [가정]" }
        genre: { $ref: '#/components/schemas/Genre' }
        ageRating: { type: string, minLength: 1, maxLength: 30, description: "관람 연령(예: 만 7세 이상)" }
        runningMinutes: { type: integer, minimum: 1, maximum: 1440, description: "러닝타임(분)" }
        placeId: { type: string, format: uuid, description: "등록된 공연장(GET /v1/partner/places로 찾는다)" }
        newPlace:
          type: object
          additionalProperties: false
          required: [name, address]
          description: "목록에 없는 공연장 요청. 판매 승인 때 운영자가 기존 공연장에 잇거나 새로 만든다(ADR-0093 결정 3)"
          properties:
            name: { type: string, minLength: 1, maxLength: 100 }
            address: { type: string, minLength: 1, maxLength: 200, description: "도로명 주소" }
        artists:
          type: array
          maxItems: 20
          description: "아티스트 목록 20개 [가정]까지, 보이는 순서대로. 칸마다 artistId(등록된 아티스트)와 name(새 이름 요청, 판매 승인 때 운영자가 잇거나 만든다) 가운데 꼭 하나다(아니면 400). 같은 artistId를 두 번 쓰면 400"
          items:
            type: object
            additionalProperties: false
            properties:
              artistId: { type: string, format: uuid }
              name: { type: string, minLength: 1, maxLength: 100 }
        aliases:
          type: array
          maxItems: 5
          uniqueItems: true
          description: "공연의 다른 이름(영문 표기 등) 5개 [가정]까지. 검색에만 쓰인다(POL-045, ADR-0093 결정 5)"
          items: { type: string, minLength: 1, maxLength: 100 }
        events:
          type: array
          minItems: 1
          maxItems: 50
          description: "첫 회차들 1~50개 [가정]. 응답의 eventIds가 같은 순서다"
          items: { $ref: '#/components/schemas/PartnerEventCreate' }
    PartnerEventCreate:
      type: object
      additionalProperties: false
      description: "회차 하나(공연 등록의 events 칸과 회차 더하기 본문, ADR-0198 결정 2). 판정 순서: 일정(422 event-schedule-invalid: 지금 < 오픈 < 판매 종료(공연 시작 − 24시간) < 공연 시작 < 공연 종료, 입장 시작 ≤ 공연 시작) → 정렬 설정(422 queue-order-invalid: 둘 다 false) → 정비 창(409 open-maintenance-window: 오픈이 수요일 03:00~06:30 KST) → 오픈 간격(409 open-too-close: 공개 중인 다른 공연의 취소되지 않은 회차와 5분 안, 정확히 5분은 된다. 확장 칸 suggestedOpenAt은 판매 종료 전인 가능 시각이 있을 때만). 같은 공연의 회차끼리는 오픈 간격을 보지 않는다. 승인 전 공연끼리의 간격은 판매 승인이 다시 본다(ADR-0198 결정 2)"
      required: [openAt, startsAt, endsAt]
      properties:
        openAt: { type: string, format: date-time, description: "티켓 오픈 시각" }
        lobbyMinutes: { type: integer, minimum: 0, maximum: 60, default: 10, description: "오픈 전 로비 개방 분 [가정]" }
        entryOpensAt: { type: string, format: date-time, description: "입장 시작(공연 시작 이하)" }
        startsAt: { type: string, format: date-time, description: "공연 시작. 판매 종료는 이 시각 − 24시간이다(ADR-0064)" }
        endsAt: { type: string, format: date-time, description: "공연 종료 예정(필수, ADR-0051)" }
        reentryAllowed: { type: boolean, default: false, description: "재입장 허용(POL-018)" }
        lobbyShuffle: { type: boolean, default: true, description: "로비 셔플(POL-003, ADR-0118)" }
        openBatch: { type: boolean, default: true, description: "오픈 직후 동시 도착 묶음(POL-003, ADR-0118). lobbyShuffle과 둘 다 false면 422" }
        seatAssignment: { type: string, enum: [PICK, AUTO], default: PICK, description: "좌석 배정 방식(POL-035)" }
        perPersonLimit: { type: integer, minimum: 1, maximum: 10, default: 4, description: "1인 한도 [가정](POL-011). 판매 정책 DSL의 단계별 한도(HOT-250)는 이 값을 넘지 않는다" }
    PartnerOpenWarning:
      type: object
      description: "저장은 되었지만 알릴 것(ADR-0062). LARGE_SHOW_NEAR는 대형으로 승인된 다른 공연과 오픈이 30분 안이라는 뜻이다. 이 공연이 판매 승인에서 대형이 되면 그때 막힌다. 공연 규모 칸은 판매 승인(LCH-080)이 더하므로 그 전에는 나오지 않는다"
      properties:
        eventIndex: { type: integer, description: "요청 events의 차례(0부터). 회차 더하기면 0" }
        code: { type: string, enum: [LARGE_SHOW_NEAR] }
        suggestedOpenAt: { type: string, format: date-time }
    PartnerProductionCreated:
      type: object
      description: "공연 등록 결과(ADR-0198 결정 1). 공연은 DRAFT로 만든다(planning/03 §2.14 T1)"
      required: [productionId, eventIds, warnings]
      properties:
        productionId: { type: string, format: uuid }
        eventIds: { type: array, items: { type: string, format: uuid }, description: "요청 events와 같은 순서" }
        warnings: { type: array, items: { $ref: '#/components/schemas/PartnerOpenWarning' } }
    PartnerEventCreated:
      type: object
      description: "회차 더하기 결과(ADR-0198 결정 3). pending이 true면 판매 승인 뒤 더한 회차라 재승인 때까지 변경분에만 있고 공개·판매되지 않는다"
      required: [eventId, pending, warnings]
      properties:
        eventId: { type: string, format: uuid }
        pending: { type: boolean }
        warnings: { type: array, items: { $ref: '#/components/schemas/PartnerOpenWarning' } }
    ComplianceNoticeCreate:
      type: object
      additionalProperties: false
      description: "신고기관·수사기관 통보 문서 등록 본문(POST /v1/ops/compliance/notices, SCR-032). 등록하는 즉시 법정 처리 기한 타이머가 시작되고, 공문 원본은 등록 뒤 …/notices/{noticeId}/documents로 올린다(원본 올리기와 악성 코드 검사 때문에 타이머 시작이 늦어지지 않게 하려는 것이다). 칸은 docs/features/control-tower.md §9 '신고기관·수사기관 통보 문서 등록' 행이다. 길이·개수 상한은 [가정](추천 적용 2026-10-30, docs/security/asvs/control-tower.md 2.1.1, ADR-0159)"
      required: [requester, agencyName, receivedAt, deadline, reviewIds]
      properties:
        requester: { type: string, enum: [AGENCY, POLICE], description: "통보한 기관 종류. AGENCY는 신고기관(한국콘텐츠진흥원), POLICE는 경찰청 등 수사기관(docs/data.md data_request.requester와 같은 값)" }
        agencyName: { type: string, minLength: 1, maxLength: 100, description: "접수 기관 이름" }
        receivedAt: { type: string, format: date-time, description: "공문 접수 시각. 처리 기한은 이 시각부터 센다" }
        deadline: { type: string, enum: [H24, H10], description: "처리 기한. 기본 H24(24시간)이고, 문화체육관광부 고시 사항이면 H10(10시간, 공연법 시행령 §3의3 2호 바목. 고시는 확인 필요, POL-024). 기한 2시간 전까지 미조치면 SEV2다" }
        reviewIds: { type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: { type: string, format: uuid }, description: "통보에 적힌 불법 거래 게시물(관람 후기) ID. 노출 차단(…/takedown)이 이 목록에 명령 10을 건다(docs/data.md takedown_action.review_id)" }
        summary: { type: string, maxLength: 2000, description: "통보 요약. 제어 문자와 양방향 제어 문자는 지운다(asvs/control-tower.md 1.3.3)" }
    DataRequestCreate:
      type: object
      additionalProperties: false
      description: "신고기관·수사기관 자료 요청 등록 본문(POST /v1/ops/compliance/data-requests, SCR-032). 점검표가 하나라도 통과하지 않으면(통신사실확인자료인데 법원 허가서가 없는 경우 포함) 서버가 거부 사유를 기록하고 422로 답한다. 요청서·법원 허가서 원본은 등록 뒤 …/data-requests/{requestId}/documents로 올린다. 칸은 docs/features/control-tower.md §9 '법적 자료 요청서 검증' 행과 POL-025다. 대상자 식별값(subjects)은 본문으로만 받고(guidelines §9) 조회만 하는 역할에는 보이지 않는다(control-tower §9 '접근 권한 통제'). 대상자 식별값의 종류, 길이·개수 상한은 [가정](추천 적용 2026-10-30, docs/security/asvs/control-tower.md 2.1.1, ADR-0159)"
      required: [requester, agencyName, kind, receivedAt, dueAt, legalBasis, purpose, subjects, dataItems, checklist]
      properties:
        requester: { type: string, enum: [AGENCY, POLICE], description: "요청 기관 종류(docs/data.md data_request.requester)" }
        agencyName: { type: string, minLength: 1, maxLength: 100 }
        kind: { type: string, enum: [REPORT, CDR, SUBSCRIBER], description: "자료 종류(docs/data.md data_request.kind). REPORT는 신고기관 자료 제출(공연법 §4의3), CDR은 통신사실확인자료(법원 허가서 필수, 대장과 원본 7년 보존, 통신비밀보호법 §13), SUBSCRIBER는 통신이용자정보(1년 보존, 전기통신사업법 §83)" }
        receivedAt: { type: string, format: date-time, description: 요청서 접수 시각 }
        dueAt: { type: string, format: date-time, description: 요청서에 적힌 제출 기한 }
        legalBasis: { type: string, minLength: 1, maxLength: 500, description: 요청서에 적힌 법적 근거 }
        purpose: { type: string, minLength: 1, maxLength: 2000, description: 요청 목적 }
        subjects:
          type: array
          minItems: 1
          maxItems: 100
          description: "요청 대상자. 이 값으로 범위 안의 자료만 골라 뽑는다"
          items: { type: object, additionalProperties: false, required: [kind, value], properties: { kind: { type: string, enum: [ACCOUNT_ID, ORDER_NUMBER, PHONE, EMAIL] }, value: { type: string, minLength: 1, maxLength: 200 } } }
        dataItems: { type: array, minItems: 1, uniqueItems: true, items: { type: string, enum: [BOOKINGS, BUYER_INFO, ACCESS_LOGS, POSTS, SUBSCRIBER_INFO] }, description: "요청 범위의 자료 항목(POL-025: 예매 내역, 구매자 정보(카드 번호는 저장하지 않는다), 통신 접속기록, 관련 게시물, 통신이용자정보(성명·전화번호·ID·가입일))" }
        periodFrom: { type: string, format: date-time, description: "대상 기간 시작. 요청서에 기간이 없으면 뺀다" }
        periodTo: { type: string, format: date-time }
        checklist:
          type: object
          additionalProperties: false
          description: "운영자가 단계별로 확인한 결과(docs/data.md data_request.legal_basis_checked). 앞의 넷(legalBasisChecked·purposeChecked·scopeChecked·dueChecked)은 모두 true여야 하고, courtWarrantAttached는 kind CDR일 때만 true여야 한다. 둘을 모두 지켜야 접수한다(control-tower §9 P1·P2)"
          required: [legalBasisChecked, purposeChecked, scopeChecked, dueChecked, courtWarrantAttached]
          properties:
            legalBasisChecked: { type: boolean, description: 법적 근거가 정당한지 }
            purposeChecked: { type: boolean, description: 요청 목적과 대상의 연관이 적혀 있는지 }
            scopeChecked: { type: boolean, description: 대상 범위가 요청 목적 안인지 }
            dueChecked: { type: boolean, description: 제출 기한이 적혀 있는지 }
            courtWarrantAttached: { type: boolean, description: "법원 허가서(영장)가 첨부됐는지. kind CDR이면 true여야 한다. 다른 종류는 false여도 된다" }
        note: { type: string, maxLength: 2000, description: "운영자 메모. 거부할 때 사유를 더 적는다" }
    SecurityIncidentCreate:
      type: object
      additionalProperties: false
      description: "보안 사고 등록 본문(POST /v1/ops/compliance/incidents, FR-063). 등록하면 의무별 신고·통지 기한이 생기고 SEV1을 띄운다. 공격으로 생긴 장애의 시작·끝은 관제 지표가 채우므로 받지 않는다. 개인정보 원문은 넣지 않고 대상 수와 요약만 받는다(docs/data.md security_incident, ADR-0049). 길이 상한은 [가정](추천 적용 2026-10-30, docs/security/asvs/control-tower.md 2.1.1)"
      required: [kind, awareAt, sensitiveOrUnique, externalAccess]
      properties:
        kind: { type: string, enum: [INTRUSION, PERSONAL_DATA, PERSONAL_DATA_POSSIBLE], description: "INTRUSION 침해사고(정보통신망법 §2①7호), PERSONAL_DATA 개인정보 유출등, PERSONAL_DATA_POSSIBLE 유출 가능성(시행령 §39의2·§39의3)" }
        awareAt: { type: string, format: date-time, description: "인지 시각. 모든 기한의 기준이다" }
        affectedCount: { type: integer, minimum: 0, description: "유출등 대상 수. 모르면 뺀다" }
        sensitiveOrUnique: { type: boolean, description: 민감정보·고유식별정보 포함 }
        externalAccess: { type: boolean, description: 외부 불법 접근 }
        summary: { type: string, maxLength: 2000, description: "사고 요약. 개인정보 원문을 넣지 않는다" }
    IncidentFilingCreate:
      type: object
      additionalProperties: false
      description: "신고·통지 수행 기록 본문(POST /v1/ops/compliance/incidents/{incidentId}/filings). 의무 하나에 한 줄이다. 개인정보 원문과 통지 대상 목록은 받지 않는다(docs/data.md incident_filing). 길이 상한은 [가정](추천 적용 2026-10-30, docs/security/asvs/control-tower.md 2.1.1)"
      required: [duty, channel, doneAt, summary]
      properties:
        duty: { type: string, enum: [KISA_REPORT_24H, ADDITIONAL_24H, USER_NOTICE, RELIEF_14D, SUBJECT_NOTICE_72H, PIPC_REPORT_72H, POSSIBILITY_NOTICE_72H, NOT_LEAKED_NOTICE], description: "수행한 의무(docs/data.md incident_filing.duty)" }
        channel: { type: string, minLength: 1, maxLength: 200, description: "기관과 방법(서면, 전자우편, 홈페이지 게시 등)" }
        doneAt: { type: string, format: date-time }
        summary: { type: string, minLength: 1, maxLength: 2000, description: "신고·통지 내용 요약. 개인정보 원문 없음" }
    ComplianceDocumentUpload:
      additionalProperties: false
      type: object
      required: [kind, file]
      description: "요청서·공문 원본 올리기 본문(multipart/form-data). PDF만 받는다: 확장자 .pdf와 첫 바이트 %PDF-가 함께 맞아야 하고(아니면 415), 한 파일 20MB [가정]를 넘으면 413, 압축 파일은 받지 않는다. 올린 파일 이름은 정화해 메타데이터로만 남기고 객체 키는 서버가 만든다(추천 적용 2026-10-30, docs/features/control-tower.md §9 '자료 추출 및 법정 대장 관리', docs/security/asvs/control-tower.md V5, ADR-0159 결정 9)"
      properties:
        kind: { type: string, enum: [OFFICIAL_LETTER, COURT_WARRANT], description: "OFFICIAL_LETTER는 통보 공문·자료 요청서, COURT_WARRANT는 법원 허가서(영장)" }
        file: { type: string, format: binary, contentMediaType: application/pdf }
    ComplianceDocument:
      type: object
      description: "올린 원본의 메타데이터. 원본은 공개하지 않는 격리 버킷에 받아 악성 코드 검사 결과가 '위협 없음'(CLEAN)일 때만 감사 저장소로 옮겨 내려받게 한다. 보존은 그 기록과 같다(통신사실확인자료 7년, 통신이용자정보 1년, control-tower §9)"
      properties:
        documentId: { type: string, format: uuid }
        kind: { type: string, enum: [OFFICIAL_LETTER, COURT_WARRANT, SUBMISSION_FILE], description: "SUBMISSION_FILE은 commander가 추출을 승인한 뒤 서버가 만든 제출 파일이다. 올리기로는 만들 수 없다(ComplianceDocumentUpload.kind에 없다, 추천 적용 2026-10-30, open-items 68번)" }
        mediaType: { type: string, enum: [application/pdf, text/csv, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet], description: "내려받기 응답의 Content-Type. 올린 원본은 늘 application/pdf이고, 제출 파일만 요청 기관의 형식에 맞춰 셋 가운데 하나다(형식 목록은 [가정, wbs 4.4.1], 추천 적용 2026-10-30, GET /v1/ops/compliance/documents/{documentId})" }
        sizeBytes: { type: integer }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        scanStatus: { type: string, enum: [PENDING, CLEAN, THREAT], description: "PENDING 검사 중, CLEAN 위협 없음(내려받기 가능), THREAT 위협 발견(내려받기 막음, SEV2)" }
        uploadedAt: { type: string, format: date-time }
    DataRequestExtractionCreate:
      type: object
      additionalProperties: false
      description: "자료 추출 요청 본문(POST /v1/ops/compliance/data-requests/{requestId}/extraction-requests, SCR-032). 요청서 범위 안에서 꼭 필요한 최소 범위를 고른다. 대상자는 등록한 요청서의 대상자 그대로이고 더할 수 없다. 받으면 PENDING_APPROVAL이 되고, 요청자가 아닌 commander가 승인한 뒤에만 뽑는다(소유자 결정 2026-10-30, open-items 68번. 칸과 길이 상한은 추천 적용 2026-10-30, docs/features/control-tower.md §9 '자료 추출·제출 승인')"
      required: [dataItems, reason]
      properties:
        dataItems: { type: array, minItems: 1, uniqueItems: true, items: { type: string, enum: [BOOKINGS, BUYER_INFO, ACCESS_LOGS, POSTS, SUBSCRIBER_INFO] }, description: "뽑을 자료 항목. 요청서의 dataItems 안이어야 한다(밖이면 422)" }
        periodFrom: { type: string, format: date-time, description: "뽑을 기간의 시작. 요청서에 기간이 있으면 그 안이어야 한다(밖이면 422)" }
        periodTo: { type: string, format: date-time }
        reason: { type: string, minLength: 1, maxLength: 2000, description: "이 범위가 꼭 필요한 이유. 제어 문자와 양방향 제어 문자는 지운다(docs/security/asvs/control-tower.md 1.3.3)" }
    DataRequestRejectionCreate:
      type: object
      additionalProperties: false
      description: "자료 추출 요청의 거부 본문(POST /v1/ops/compliance/data-requests/{requestId}/rejections, commander). REVISE는 범위를 고쳐 다시 요청하도록 접수(RECEIVED)로 돌리고, DECLINE은 제공하지 않음(REFUSED)으로 끝낸다. 사유는 요청 기록에 남는다(추천 적용 2026-10-30, docs/features/control-tower.md §9 '자료 요청의 상태' P5·P6)"
      required: [outcome, reason]
      properties:
        outcome: { type: string, enum: [REVISE, DECLINE] }
        reason: { type: string, minLength: 1, maxLength: 2000 }
    DataRequestSubmissionCreate:
      type: object
      additionalProperties: false
      description: "제출 기록 본문(POST /v1/ops/compliance/data-requests/{requestId}/submission). 승인 뒤 만든 제출 파일을 기관에 낸 뒤 적는다. fileSha256이 그 파일과 다르면 422다. 이 기록이 제공 대장(provision_ledger)의 행이 되고, 보존 끝(retainUntil)을 제공한 날부터 다시 센다(통신사실확인자료 7년, 통신이용자정보 1년. 추천 적용 2026-10-30, docs/features/control-tower.md §9 P8)"
      required: [submittedAt, recipient, channel, fileSha256]
      properties:
        submittedAt: { type: string, format: date-time, description: 기관에 낸 시각 }
        recipient: { type: string, minLength: 1, maxLength: 200, description: "받은 기관과 부서" }
        channel: { type: string, minLength: 1, maxLength: 200, description: "낸 방법(전자 제출, 암호화한 파일 전달 등)" }
        fileSha256: { type: string, pattern: '^[0-9a-f]{64}$', description: "낸 파일의 SHA-256(소문자 16진수)" }
    ComplianceNotice:
      type: object
      description: "신고기관·수사기관 통보 한 건(GET /v1/ops/compliance/notices·/v1/ops/compliance/notices/{noticeId}). 칸 가림은 docs/security/authz-matrix.md §4.1 '기관 요청' 행이다. CS 담당자는 view SUMMARY로 건 요약(ID, 기관, 종류, 기한, 상태)만 받고, operator·commander는 view FULL로 나머지 칸도 받는다. 상태는 OPEN(처리 기한 진행 중, 아직 차단하지 않음), TAKEN_DOWN(명령 10으로 차단함), WITHDRAWN(통보 철회로 복원함)이다(추천 적용 2026-10-30, open-items 74번)"
      required: [view, noticeId, requester, agencyName, dueAt, status]
      properties:
        view: { type: string, enum: [SUMMARY, FULL] }
        noticeId: { type: string, format: uuid }
        requester: { type: string, enum: [AGENCY, POLICE], description: "통보한 기관 종류(ComplianceNoticeCreate.requester와 같다)" }
        agencyName: { type: string }
        dueAt: { type: string, format: date-time, description: "처리 기한(접수 시각 + 24시간, 고시 사항이면 10시간)" }
        status: { type: string, enum: [OPEN, TAKEN_DOWN, WITHDRAWN] }
        receivedAt: { type: string, format: date-time, description: "FULL만" }
        deadline: { type: string, enum: [H24, H10], description: "FULL만" }
        reviewIds: { type: array, items: { type: string, format: uuid }, description: "FULL만. 통보에 적힌 게시물 ID" }
        summary: { type: string, description: "FULL만" }
        documents: { type: array, items: { $ref: '#/components/schemas/ComplianceDocument' }, description: "FULL만. 공문 원본" }
        takenDownAt: { type: [string, 'null'], format: date-time, description: "FULL만" }
        withdrawnAt: { type: [string, 'null'], format: date-time, description: "FULL만" }
    ComplianceNoticePage: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/ComplianceNotice' } }, nextCursor: { type: [string, 'null'] } } }
    DataRequest:
      type: object
      description: "자료 요청 한 건(GET /v1/ops/compliance/data-requests·/v1/ops/compliance/data-requests/{requestId}와, 추출 요청·승인·거부·제출 기록의 응답). CS 담당자는 view SUMMARY로 건 요약(ID, 기관, 종류, 기한, 상태)만 받고 요청 대상자 식별값·범위·제출 파일은 받지 않는다. operator·commander는 view FULL이고, 상세를 열면 관리 계정 접속기록에 남는다(docs/security/authz-matrix.md §4.1, docs/features/control-tower.md §9). 상태와 전이는 control-tower §9 '자료 요청의 상태' P1~P8이다(추천 적용 2026-10-30, open-items 68·74번)"
      required: [view, requestId, requester, agencyName, kind, dueAt, status]
      properties:
        view: { type: string, enum: [SUMMARY, FULL] }
        requestId: { type: string, format: uuid }
        requester: { type: string, enum: [AGENCY, POLICE] }
        agencyName: { type: string }
        kind: { type: string, enum: [REPORT, CDR, SUBSCRIBER] }
        dueAt: { type: string, format: date-time, description: 요청서에 적힌 제출 기한 }
        status: { type: string, enum: [RECEIVED, REFUSED, PENDING_APPROVAL, APPROVED, EXTRACTED, SUBMITTED] }
        receivedAt: { type: string, format: date-time, description: "FULL만" }
        legalBasis: { type: string, description: "FULL만" }
        purpose: { type: string, description: "FULL만" }
        subjects: { type: array, description: "FULL만. 요청 대상자(DataRequestCreate.subjects와 같다)", items: { type: object, properties: { kind: { type: string, enum: [ACCOUNT_ID, ORDER_NUMBER, PHONE, EMAIL] }, value: { type: string } } } }
        dataItems: { type: array, items: { type: string, enum: [BOOKINGS, BUYER_INFO, ACCESS_LOGS, POSTS, SUBSCRIBER_INFO] }, description: "FULL만. 요청서의 범위" }
        periodFrom: { type: [string, 'null'], format: date-time, description: "FULL만" }
        periodTo: { type: [string, 'null'], format: date-time, description: "FULL만" }
        refusalReason: { type: [string, 'null'], description: "FULL만. 점검표가 통과하지 않았거나 제공하지 않음(DECLINE)으로 끝낸 사유" }
        documents: { type: array, items: { $ref: '#/components/schemas/ComplianceDocument' }, description: "FULL만. 요청서·법원 허가서 원본과, 승인 뒤 만든 제출 파일(kind SUBMISSION_FILE)" }
        extraction: { type: [object, 'null'], description: "FULL만. 지금의 추출 요청", properties: { dataItems: { type: array, items: { type: string } }, periodFrom: { type: [string, 'null'], format: date-time }, periodTo: { type: [string, 'null'], format: date-time }, rowCounts: { type: object, additionalProperties: { type: integer }, description: "항목별로 뽑힐 행 수(센 값)" }, reason: { type: string }, requestedAt: { type: string, format: date-time }, requesterRole: { type: string, enum: [operator, commander] }, approvalExpiresAt: { type: string, format: date-time, description: "요청 뒤 24시간 [가정]과 제출 기한 가운데 이른 때" } } }
        decisions: { type: array, description: "FULL만. 승인·거부·만료 기록(시간 순)", items: { type: object, properties: { decision: { type: string, enum: [APPROVED, REJECTED_REVISE, REJECTED_DECLINE, EXPIRED] }, deciderRole: { type: string, enum: [commander, system] }, reason: { type: [string, 'null'] }, decidedAt: { type: string, format: date-time } } } }
        submission: { type: [object, 'null'], description: "FULL만. 제출 기록", properties: { submittedAt: { type: string, format: date-time }, recipient: { type: string }, channel: { type: string }, fileSha256: { type: string } } }
        retainUntil: { type: string, format: date-time, description: "FULL만. 보존 끝. 제출을 기록하면 제공한 날부터 다시 센다" }
    DataRequestPage: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/DataRequest' } }, nextCursor: { type: [string, 'null'] } } }
    SecurityIncident:
      type: object
      description: "보안 사고 한 건(GET /v1/ops/compliance/incidents·/v1/ops/compliance/incidents/{incidentId}). viewer와 CS 담당자는 view SUMMARY로 건 요약(ID, 종류, 가장 가까운 기한, 상태)만 받고, operator·commander는 view FULL이다. 통지 대상 목록과 대상자 식별값은 어느 역할에도 싣지 않는다(docs/security/authz-matrix.md §4.1 '보안 사고와 이용자 통지' 행, 추천 적용 2026-10-30, open-items 74번)"
      required: [view, incidentId, kind, status]
      properties:
        view: { type: string, enum: [SUMMARY, FULL] }
        incidentId: { type: string, format: uuid }
        kind: { type: string, enum: [INTRUSION, PERSONAL_DATA, PERSONAL_DATA_POSSIBLE] }
        status: { type: string, enum: [OPEN, CLOSED] }
        nextDueAt: { type: [string, 'null'], format: date-time, description: "아직 하지 않은 의무 가운데 가장 가까운 기한" }
        awareAt: { type: string, format: date-time, description: "FULL만. 인지 시각" }
        affectedCount: { type: [integer, 'null'], description: "FULL만" }
        sensitiveOrUnique: { type: boolean, description: "FULL만" }
        externalAccess: { type: boolean, description: "FULL만" }
        summary: { type: string, description: "FULL만. 개인정보 원문 없음" }
        outageStartedAt: { type: [string, 'null'], format: date-time, description: "FULL만. 관제 지표가 채운 장애 시작" }
        outageEndedAt: { type: [string, 'null'], format: date-time, description: "FULL만" }
        decidedAt: { type: [string, 'null'], format: date-time, description: "FULL만. commander의 해당 판단 시각. 판단(해당함·판단이 서지 않음)은 POST /v1/ops/compliance/incidents/{incidentId}/determination(commander)으로 기록하고, 모든 의무를 마친 사고는 POST /v1/ops/compliance/incidents/{incidentId}/closure(operator·commander)로 닫는다(control-tower §9.1 6번, 추천 적용 2026-10-30)" }
        duties: { type: array, description: "FULL만. 의무별 기한과 수행 시각", items: { type: object, properties: { duty: { type: string, enum: [KISA_REPORT_24H, ADDITIONAL_24H, USER_NOTICE, RELIEF_14D, SUBJECT_NOTICE_72H, PIPC_REPORT_72H, POSSIBILITY_NOTICE_72H, NOT_LEAKED_NOTICE] }, dueAt: { type: [string, 'null'], format: date-time }, doneAt: { type: [string, 'null'], format: date-time } } } }
        filings: { type: array, description: "FULL만. 신고·통지 수행 기록(IncidentFilingCreate의 칸)", items: { type: object, properties: { duty: { type: string }, channel: { type: string }, doneAt: { type: string, format: date-time }, summary: { type: string } } } }
    SecurityIncidentPage: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/SecurityIncident' } }, nextCursor: { type: [string, 'null'] } } }
    PartnerSalesReport: { type: object, description: "파트너 판매 요약(R3 뒤, FR-068, POL-040). 판매 5건 [가정] 미만 칸은 합치고 봇 범주·가명·내부 규칙 수치는 없다", properties: { eventId: { type: string }, soldSeats: { type: integer }, soldOutAt: { type: string, format: date-time }, byTier: { type: array, items: { type: object, properties: { tier: { type: string }, soldSeats: { type: integer, description: "판매 매수(환불 전)" }, refundedSeats: { type: integer, description: "환불 매수. 순 판매 = soldSeats − refundedSeats" }, salesAmount: { type: integer, format: int64, description: "등급의 판매 금액 합계(원, 여러 건을 모은 금액이라 int64, guidelines §1)" }, soldOutAt: { type: string, format: date-time } } } }, salesCurve: { type: array, description: "구역·시간대 칸. 작은 칸은 합쳐져 merged=true", items: { type: object, properties: { section: { type: string }, minuteFrom: { type: integer }, minuteTo: { type: integer }, soldSeats: { type: integer }, merged: { type: boolean } } } }, refunds: { type: object, properties: { count: { type: integer }, amount: { type: integer, format: int64, description: "환불 금액 합계(원)" } } }, recommendations: { type: array, items: { type: string } } } }
    PayoutAccountChange: { additionalProperties: false, type: object, required: [bankCode, accountNumber, holderName], description: "정산 계좌 변경. 저장하지 않고 결제사 수정 요청에 바로 넘김(POL-039)", properties: { bankCode: { type: string }, accountNumber: { type: string }, holderName: { type: string } } }
    DeviceAuthorization:
      type: object
      description: RFC 8628 기기 권한 부여 응답과 같은 필드
      properties:
        deviceCode: { type: string, description: "CSPRNG 256비트" }
        userCode: { type: string, pattern: "^[BCDFGHJKLMNPQRSTVWXZ]{4}-[BCDFGHJKLMNPQRSTVWXZ]{4}$", description: "스캐너·휴대폰 두 화면에서 같은지 확인하는 8자 코드(RFC 8628 §6.1 문자 집합, ADR-0051)" }
        verificationUriComplete: { type: string, format: uri, description: "QR로 보여 줌. 확인 코드는 URL 조각(#code=)에만 담는다" }
        expiresIn: { type: integer, description: "300초" }
        interval: { type: integer, description: "폴링 최소 간격(초), 기본 5" }
    StaffAssignment: { type: object, description: "파트너용 명단에는 이메일·계정 ID를 넣지 않는다", properties: { assignmentId: { type: string }, eventId: { type: string }, nickname: { type: string }, role: { type: string, enum: [gate_staff, gate_lead] }, status: { type: string, enum: [INVITED, ASSIGNED, REVOKED, ENDED, EXPIRED] }, inviteExpiresAt: { type: string, format: date-time }, validFrom: { type: string, format: date-time }, validUntil: { type: string, format: date-time }, scanCount: { type: integer }, overrideCount: { type: integer } } }
    StaffInvitationView: { type: object, description: "초대 수락 화면(SCR-050)용", properties: { partnerName: { type: string }, eventTitle: { type: string }, eventStartsAt: { type: string, format: date-time }, role: { type: string, enum: [gate_staff, gate_lead] }, validFrom: { type: string, format: date-time }, validUntil: { type: string, format: date-time }, invitedEmailMasked: { type: string }, consents: { type: object, properties: { collection: { type: string, description: "수집·이용 고지(목적, 항목, 보유 기간, 거부권과 불이익)" }, provision: { type: string, description: "파트너 제공 고지(받는 자, 목적, 항목, 보유 기간, 거부권과 불이익)" }, consentVersion: { type: string, description: "두 고지 문안의 판. 수락 요청의 consentVersion으로 그대로 보낸다(추천 적용 2026-10-30, ADR-0089)" } } } } }
    DeviceApprovalView: { type: object, description: "스캐너 승인 화면(SCR-051)용. 배정 파트너의 이름(상호)은 싣지 않는다. identity-svc가 기기 원장에서 받는 것은 배정 파트너 ID뿐이고, 상호는 공개 정보라 새 내부 호출을 두지 않는다. 화면은 assignments[].eventId로 회차 공개 요약(GET /v1/events/{eventId})을 읽어 그 sellerName을 '배정 파트너'로, title·startsAt을 '내 배정' 이름으로 보인다(소유자 결정 2026-10-30, open-items 78번. 화면 규칙은 추천 적용 2026-10-30, docs/features/identity.md §6.1)", properties: { deviceName: { type: string }, userCode: { type: string }, assignments: { type: array, items: { $ref: '#/components/schemas/StaffAssignment' }, description: "지금 유효한 내 배정 가운데 이 기기의 배정 파트너 회차의 것만(POST /v1/device-approvals와 같은 조건). 하나도 없으면 이 응답 대신 403이다(staff-assignment-missing·other-partner-device·outside-staff-hours). 그래서 200이면 하나 이상 있다" }, canProxy: { type: boolean, description: "책임자만 true" } } }
    ScannerShift: { type: object, description: "근무 준비 응답(SCR-033)", properties: { serverTime: { type: string, format: date-time }, eventId: { type: string }, reentryAllowed: { type: boolean }, placement: { $ref: '#/components/schemas/ScannerPlacement' }, packageSeq: { type: integer }, role: { type: string, enum: [gate_staff, gate_lead] }, proxy: { type: boolean } } }
    ScannerPlacement: { type: object, required: [gateZone, mode], properties: { gateZone: { type: string }, mode: { type: string, enum: [IN, OUT], description: "OUT은 재입장 허용 회차만(그 밖 422)" } } }
    ScannerPlacementInput:
      type: object
      additionalProperties: false
      description: ScannerPlacement의 요청용(정의 밖 칸을 400으로 거절한다). 칸의 뜻은 원래 스키마(ScannerPlacement)와 같고 응답은 ScannerPlacement(열림)다(guidelines §1 '요청은 닫고 응답은 연다', BAS-040).
      required: [gateZone, mode]
      properties:
        gateZone: {type: string}
        mode:
          type: string
          enum: [IN, OUT]
          description: OUT은 재입장 허용 회차만(그 밖 422)
    ScannerPackageTicket: { type: object, description: "개인정보 없음", properties: { ticketId: { type: string }, gateZone: { type: string }, seatLabel: { type: string }, status: { type: string, enum: [ISSUED, ACTIVE, TRANSFER_PENDING, CANCEL_REQUESTED, REFUNDED, FLAGGED, VOIDED], description: "VOIDED는 가상계좌 입금 오류로 무효(ADR-0062)" }, keys: { type: array, items: { type: object, properties: { keyId: { type: string, description: "base64url 8바이트" }, publicKey: { type: string, description: "압축 P-256 공개키 base64url" } } } }, scanState: { type: object, properties: { lastDirection: { type: string, enum: [IN, OUT] }, lastAt: { type: string, format: date-time }, lastDeviceName: { type: string }, lastGateZone: { type: string } } } } }
    ScannerVersionVector: { type: object, description: "오프라인 스냅샷 버전 벡터(offline-gate §6.3, GAT-160). 각 값은 그 종류 변경의 마지막 일련번호다", required: [eventId, seq, ticketSeq, keySeq, policySeq, placementSeq, flagSeq, issuedAt, maxOfflineMs], properties: { eventId: { type: string }, seq: { type: integer }, ticketSeq: { type: integer, description: "TICKET_STATUS의 마지막 일련번호" }, keySeq: { type: integer, description: "KEY_REGISTERED·KEY_REVOKED의 마지막 일련번호" }, policySeq: { type: integer, description: "POLICY의 마지막 일련번호" }, placementSeq: { type: integer, description: "PLACEMENT의 마지막 일련번호" }, flagSeq: { type: integer, description: "FLAG의 마지막 일련번호" }, issuedAt: { type: string, format: date-time, description: "이 벡터를 만든 서버 시각" }, maxOfflineMs: { type: integer, description: "오프라인 허용 최대 시간(ms). 이보다 오래된 스냅샷은 재동기화가 필요하다(24시간 [가정])" } } }
    ScannerVersionVectorInput: { type: object, additionalProperties: false, description: "스캔 기록이 싣는 클라이언트 스냅샷 버전 벡터(GAT-160). 응답 ScannerVersionVector와 같은 칸이다", required: [eventId, seq, ticketSeq, keySeq, policySeq, placementSeq, flagSeq, issuedAt, maxOfflineMs], properties: { eventId: { type: string }, seq: { type: integer }, ticketSeq: { type: integer }, keySeq: { type: integer }, policySeq: { type: integer }, placementSeq: { type: integer }, flagSeq: { type: integer }, issuedAt: { type: string, format: date-time }, maxOfflineMs: { type: integer } } }
    ScannerPackage: { type: object, description: "회차 목록 전체(offline-gate §6.3)", properties: { eventId: { type: string }, reentryAllowed: { type: boolean }, gateZones: { type: array, items: { type: string } }, serverTime: { type: string, format: date-time }, tickets: { type: array, items: { $ref: '#/components/schemas/ScannerPackageTicket' } }, revokedKeyIds: { type: array, items: { type: string } }, lastSeq: { type: integer }, versionVector: { $ref: '#/components/schemas/ScannerVersionVector' }, minAppVersion: { type: string, description: "서버가 지원하는 가장 낮은 스캐너 앱 판(SemVer, 예 1.4.0). 스캐너 API는 최근 앱 판 2개와 호환한다. 새 판은 근무 준비 때만 적용하고, 입장 시간 중에는 서버가 판이 낮다고 거부하지 않는다(guidelines §1, docs/devops.md §6.6, 추천 적용 2026-10-29, ADR-0145 결정 4)" } } }
    ScannerChange: { type: object, properties: { seq: { type: integer }, kind: { type: string, enum: [KEY_REGISTERED, KEY_REVOKED, TICKET_STATUS, SCAN_STATE, POLICY, PLACEMENT, FLAG, SESSION_TERMINATED] }, payload: { type: object, description: "개인정보 없음" } } }
    ScannerChanges: { type: object, properties: { changes: { type: array, items: { $ref: '#/components/schemas/ScannerChange' } }, lastSeq: { type: integer }, hasMore: { type: boolean }, versionVector: { $ref: '#/components/schemas/ScannerVersionVector' }, minAppVersion: { type: string, description: "ScannerPackage.minAppVersion과 같다(추천 적용 2026-10-29, ADR-0145 결정 4)" } } }
    GateFlag: { type: object, properties: { flagId: { type: string }, ticketId: { type: string }, seatLabel: { type: string }, gateZone: { type: string }, kind: { type: string, enum: [DUPLICATE, NO_EXIT, AFTER_CANCEL, OUT_OF_SESSION, AFTER_CLOSE, OVERRIDE_REVIEW, STALE_VERSION] }, awareness: { type: string, enum: [CONCURRENT, KNOWN] }, status: { type: string, enum: [OPEN, OK, SUSPECT, UNDETERMINED] }, createdAt: { type: string, format: date-time } } }
    ScannerDevice: { type: object, properties: { deviceId: { type: string }, name: { type: string }, promoterId: { type: string }, status: { type: string, enum: [ACTIVE, REVOKED, RETIRED] }, credentialType: { type: string, enum: [MTLS_CERT, DEVICE_KEY] }, certExpiresAt: { type: string, format: date-time }, lastSeenAt: { type: string, format: date-time }, activeSessionNickname: { type: string } } }
    ScannerDeviceCreated: { type: object, required: [enrollmentCode, enrollmentCodeExpiresAt], properties: { deviceId: { type: string }, name: { type: string }, promoterId: { type: string }, status: { type: string, enum: [ACTIVE, REVOKED, RETIRED] }, credentialType: { type: string, enum: [MTLS_CERT, DEVICE_KEY] }, certExpiresAt: { type: string, format: date-time }, lastSeenAt: { type: string, format: date-time }, activeSessionNickname: { type: string }, enrollmentCode: { type: string, pattern: "^[BCDFGHJKLMNPQRSTVWXZ]{4}-[BCDFGHJKLMNPQRSTVWXZ]{4}-[BCDFGHJKLMNPQRSTVWXZ]{4}$" }, enrollmentCodeExpiresAt: { type: string, format: date-time } } }
    GateStatus: { type: object, description: "파트너 현장 운영 탭(SCR-037)·관제 입장 탭(SCR-029)용 집계. 개인정보 없음", properties: { devices: { type: array, items: { type: object, properties: { deviceId: { type: string }, name: { type: string }, placement: { $ref: "#/components/schemas/ScannerPlacement" }, ready: { type: boolean }, packageSeq: { type: integer }, lastSyncAt: { type: string, format: date-time }, pendingUploads: { type: integer }, staffLoggedIn: { type: boolean, description: "그 기기에 지금 현장 스태프가 로그인해 있는지(SCR-037 ⑦ '로그인', docs/design/d5 §1.6 16번). 끝나지 않고 만료되지 않은 스캐너 세션이 있으면 참이다. 사람을 가리키는 값은 싣지 않는다 [가정]" } } } }, entriesByZone: { type: object, additionalProperties: { type: integer } }, rejectsByReason: { type: object, additionalProperties: { type: integer } }, openFlags: { type: integer }, boothCount: { type: integer }, overrideCount: { type: integer }, entryClosedAt: { type: string, format: date-time } } }
    LinkProposal: { type: object, required: [proposalId, existingProvider, newProvider, expiresAt, attemptsLeft], properties: { proposalId: { type: string }, existingProvider: { type: string, enum: [kakao, naver, google] }, newProvider: { type: string, enum: [kakao, naver, google] }, expiresAt: { type: string, format: date-time }, attemptsLeft: { type: integer } } }
    MergeProposal: { type: object, properties: { proposalId: { type: string }, primaryAccountId: { type: string }, mergedAccountId: { type: string }, status: { type: string, enum: [PROPOSED, BLOCKED, CONFIRMED, MERGING, MERGED, CANCELLED] }, moved: { type: object, properties: { tickets: { type: integer }, orders: { type: integer }, wishes: { type: integer }, reviews: { type: integer }, subscriptions: { type: integer }, addresses: { type: integer }, providers: { type: integer } } }, blockers: { type: array, description: "막는 사유(docs/features/identity.md §2.1). SAME_PROVIDER_KIND는 두 계정에 같은 종류의 다른 로그인 수단이 있다는 뜻이다(예: 두 계정이 서로 다른 카카오 계정을 가짐). 합치면 로그인 수단 '종류마다 하나' 규칙이 깨지므로 막고, 사용자가 한쪽 계정에서 그 수단을 해제한 뒤 다시 합친다(소유자 결정 2026-11-05, OPEN[21] 추천 적용)", items: { type: string, enum: [ACTIVE_PURCHASE_SESSION, PENDING_PAYMENT, QUOTA_EXCEEDED, BOTH_VERIFIED, WITHDRAWAL_IN_PROGRESS, APPEAL_PENDING, ENTRY_STARTED, SAME_PROVIDER_KIND] } }, sameKindProviders: { type: array, items: { type: string, enum: [kakao, naver, google] }, description: "blockers에 SAME_PROVIDER_KIND가 있을 때만 준다: 두 계정에 함께 있는 로그인 수단 종류(카카오·네이버·구글 순). 화면이 '두 계정에 서로 다른 카카오 계정이 연결되어 있습니다'처럼 어느 종류인지 말하는 데 쓴다(소유자 결정 2026-11-05, OPEN[21] 추천 적용)" }, expiresAt: { type: string, format: date-time }, newProvider: { type: string, enum: [kakao, naver, google], description: "추가하려던 로그인 수단의 종류(다른 계정의 것). 화면의 '구글 계정은 이미 다른 PEAKET 계정입니다' 문구에 쓴다(추천 적용 2026-11-04, BOT-043)" }, requesterRole: { type: string, enum: [PRIMARY, MERGED], description: "지금 로그인한 계정이 남는 쪽(PRIMARY)인지 흡수되는 쪽(MERGED)인지. MERGED면 확정 뒤 지금 세션이 끝난다(SCR-040 '지금 계정이 흡수됨', 추천 적용 2026-11-04, BOT-043)" }, primaryVerified: { type: boolean, description: "남는 계정이 본인확인을 마쳤는가(제안을 만든 때 값, 화면 '남는 계정(대표): 본인확인한 계정', 추천 적용 2026-11-04, BOT-043)" } } }
    ScanEvent:
      additionalProperties: false
      type: object
      description: "스캔 기록(offline-gate §6.5). 스태프 계정과 역할은 서버가 scannerSessionId로 정한다(클라이언트 값을 받지 않음)"
      required: [id, eventId, ticketId, scannerSessionId, direction, method, result, scannedAtDevice, knownSeq, deviceSeq]
      properties:
        id: { type: string, format: uuid, description: 클라이언트 생성 멱등 ID(UUIDv7) }
        eventId: { type: string }
        ticketId: { type: string }
        scannerSessionId: { type: string, description: "그 시각의 스캐너 세션. 서버가 유효 구간 밖이면 '세션 밖 기록'으로 표시" }
        direction: { type: string, enum: [IN, OUT] }
        method: { type: string, enum: [QR, OVERRIDE, VERIFY] }
        result: { type: string, enum: [PASS, REJECT, CHECK] }
        reason: { type: string, enum: [INVALID_QR, UNSUPPORTED_VERSION, UNKNOWN_TICKET, TICKET_CANCELLED, KEY_REVOKED, KEY_UNKNOWN, BAD_SIGNATURE, QR_EXPIRED, WRONG_ZONE, ALREADY_IN, NO_EXIT_RECORD, NO_ENTRY_RECORD, VERIFY_ONLY, OVERRIDE_CAMERA, OVERRIDE_PHONE_DEAD, OVERRIDE_KEY_UNKNOWN, OVERRIDE_BOOTH_OFFLINE, OVERRIDE_OTHER] }
        overrideNote: { type: string, maxLength: 100, description: "예외 통과 메모(개인정보 금지)" }
        gateZone: { type: string }
        keyId: { type: string }
        qrTimestamp: { type: string, format: date-time }
        scannedAtDevice: { type: string, format: date-time, description: 보정 시각 }
        clockOffsetMs: { type: integer }
        knownSeq: { type: integer, description: "판정 때 반영한 서버 변경 일련번호(두 칸 버전 벡터의 첫 칸)" }
        deviceSeq: { type: integer, description: "기기 일련번호(두 번째 칸)" }
        versionVector: { $ref: '#/components/schemas/ScannerVersionVectorInput', description: "판정 때 클라이언트가 들고 있던 스냅샷 버전 벡터(GAT-160). 없으면 옛 클라이언트로 본다" }
    Command:
      additionalProperties: false
      type: object
      required: [type, reason]
      properties:
        type: { type: string, enum: [ADMISSION_TARGET, ADMISSION_PAUSE, KILL_SWITCH, BLOCK_ASN_IP, BOT_LEVEL, DEGRADED_MODE, LOBBY_BANNER, LOG_LEVEL, FEATURE_OFF, TAKEDOWN, AUTOMATION_STOP, PG_ASSIGN, EVENT_CANCEL, SCALE_CHANGE], description: "PG_ASSIGN은 명령 12 결제사 지정(온세일 윈도우 밖, ADR-0044). 결제사 전환은 DEGRADED_MODE의 결제 모드. SCALE_CHANGE는 판매 승인 뒤 회차 규모 올리기(BAT-465, core-svc POST /v1/ops/events/{eventId}/scale-changes)" }
        reason: { type: string, minLength: 1, maxLength: 2000, description: "실행 사유. 제어 문자와 양방향 제어 문자는 지운다(ADR-0159 결정 11, docs/security/asvs/control-tower.md 1.3.3)" }
        params: { type: object, x-peaket-open-object: "명령 유형마다 oneOf로 칸을 정하기 전까지 열어 둔다(구현 전에 더한다, 추천 적용 2026-10-30). 명령을 받는 서버를 만드는 단계가 oneOf로 닫는다(BAS-040)", description: "명령 유형별 값. 유형마다 oneOf 스키마로 칸과 범위를 정한다(구현 전에 더한다, 추천 적용 2026-10-30): 설정 사건으로 퍼지는 명령(5·8·9·12, 6의 설정 갈래, 7의 purchase-svc 쪽)은 SettingChanged.avsc의 value 갈래와 같은 칸, 제어 gRPC 명령(1·2·3·6 진입·6 대체 결제사 전환·7·11)은 control.proto desired_state_json과 같은 칸, 명령 4는 대역·ASN 목록과 만료 시각(24시간 이하), 명령 10은 통보 ID다(control-tower §3 안전 허용 범위). KILL_SWITCH는 {scope: EVENT|PLATFORM, eventIds: [...]}이고 EVENT면 회차 1개 이상(추천 적용 2026-10-14, ADR-0062). BOT_LEVEL은 {level: RELAXED|STANDARD|AGGRESSIVE, reassessMode: OFF|SHADOW|ENFORCE}이고 강도와 대기 중 재평가 모드를 따로 고른다(asyncapi SettingChanged, 추천 적용 2026-10-20, ADR-0073)" }
    CommandState: { type: object, properties: { commandId: { type: string }, state: { type: string, enum: [DRAFTED, DRY_RUN, PENDING_APPROVAL, APPROVED, REJECTED, DISPATCHED, ACKED, SUCCEEDED, FAILED, REVERT_PENDING, REVERTED, AUTO_EXPIRED], description: "DISPATCHED는 대상 실행 중, SUCCEEDED는 대상이 성공한 끝 상태, FAILED는 실행 실패(재시도 가능)다. REVERT_PENDING은 명령 3·11의 되돌리기 요청이 두 번째 승인을 기다리는 상태(10분, docs/planning/03 §2.6, 추천 적용 2026-10-20, ADR-0073)" }, dryRun: { type: object }, approvals: { type: array, items: { type: string } }, ackedAt: { type: string, format: date-time }, expiresAt: { type: string, format: date-time, description: "만료 있는 명령(2·4·8)의 만료 시각. 명령 2는 연장하면 바뀐다(ADR-0062)" }, type: { type: string, description: "명령 유형(Command.type과 같은 값)" }, eventId: { type: [string, "null"], description: "회차 하나에 건 명령이면 그 회차. 범위가 여럿이거나 전체면 null이고 params로 본다" }, reason: { type: string, description: "실행 사유. 승인자에게 그대로 보인다" }, params: { type: object, description: "유형별 값. 상세에만 싣는다" }, requestedBy: { $ref: "#/components/schemas/OpsActor" }, createdAt: { type: string, format: date-time }, approvalExpiresAt: { type: [string, "null"], format: date-time, description: "두 번째 승인 기한(10분, PENDING_APPROVAL·REVERT_PENDING일 때만)" }, attempts: { type: integer, description: "실행 시도 횟수(재시도 포함). 첫 실행 전에는 0" }, lastError: { type: [string, "null"], description: "마지막 실행 실패 사유. 성공하면 null" }, executedAt: { type: [string, "null"], format: date-time, description: "마지막 실행이 끝난 시각" }, result: { type: [object, "null"], description: "대상이 돌려준 결과(성공했을 때만)" }, canApprove: { type: boolean, description: "부른 계정이 지금 승인·거부할 수 있는지(요청자 제외). 서버가 판정한다" }, postReviewDueAt: { type: [string, "null"], format: date-time, description: "명령 3·11의 사후 검토 보고서 기한(48시간, control-tower §6)" }, delivery: { type: [object, "null"], description: "전파 상태. 제어 gRPC 명령은 ack 수, 설정형 명령은 적용 확인(ADR-0143). 상세에만 싣는다", properties: { kind: { type: string, enum: [ACK, APPLY_CHECK] }, ackedCount: { type: integer }, targetCount: { type: integer }, unackedTargets: { type: array, items: { type: string } }, applyStatus: { type: [string, "null"], enum: [OUTBOX_WAITING, CHECKING, CONFIRMED, UNCONFIRMED, UNKNOWN, null], description: "APPLY_CHECK일 때만" } } } } }
    AuditCheckpoint:
      type: object
      description: "감사 체크포인트(BAT-465 GAT-310, ADR-0075). 감사 체인의 fromSeq~toSeq 기록을 SHA-256 루트로 묶고 직전 체크포인트 루트와 잇는다. 공개 앵커·서명·OpenTimestamps는 후속이다."
      properties:
        checkpointId: { type: string, format: uuid }
        fromSeq: { type: integer, format: int64 }
        toSeq: { type: integer, format: int64 }
        rootHash: { type: string, description: "구간 기록의 (seq, hash)를 이어 붙인 SHA-256 16진" }
        prevCheckpointHash: { type: string, description: "직전 체크포인트의 rootHash. 첫 체크포인트는 빈 글자" }
        reason: { type: string }
        actorRef: { type: string }
        createdAt: { type: string, format: date-time }
    AuditCheckpointPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AuditCheckpoint' } }
        nextCursor: { type: [string, "null"] }
    AuditCheckpointVerification:
      type: object
      properties:
        checkpointId: { type: string, format: uuid }
        valid: { type: boolean, description: "루트와 직전 사슬이 모두 맞는가" }
        rootValid: { type: boolean, description: "구간 기록을 다시 모은 루트가 저장값과 같은가" }
        prevValid: { type: boolean, description: "직전 체크포인트 루트와 이어지는가" }
        fromSeq: { type: integer, format: int64 }
        toSeq: { type: integer, format: int64 }
        checkedAt: { type: string, format: date-time }
    QueueEntryRequest: { description: "대기열 진입 본문(POST /v1/queues/{eventId}/entries). application/json과 text/plain(JSON 글자, T=0 사전 요청 없음) 두 표현이 같은 이 스키마를 쓴다(BAS-040)", additionalProperties: false, type: object, required: [preverifyToken], properties: { preverifyToken: { type: string }, deviceId: { type: string }, entryRequestId: { type: string, format: uuid, description: "진입 시도 하나에 브라우저가 만든 UUID. 응답을 못 받아 다시 보낼 때 같은 값을 쓰면 이어서 처리하고, 이미 번호를 기록했으면 같은 번호의 대기표를 다시 준다. 1인 1순번 선점 값 PENDING:{요청 ID}에 쓴다(헤더가 아니라 본문이라 사전 요청이 없다, 추천 적용 2026-10-28, 기술 검토 중간-035)" } } }
    AdmissionRequest: { description: "입장 확정 본문(POST /v1/queues/{eventId}/admission). application/json과 text/plain(JSON 글자, T=0 사전 요청 없음) 두 표현이 같은 이 스키마를 쓴다(BAS-040)", additionalProperties: false, type: object, properties: { queueTicket: { type: string }, lobbyToken: { type: string }, priorityGrantId: { type: string, format: uuid, description: "우선 구매(이의가 인정된 부정 예매 표 취소의 되돌림, POL-046 ⑦)의 권리 ID(GET /v1/fraud-appeal-requests의 priorityPurchases). 대기표·참가 토큰 대신 보낸다. 그 계정의 OFFERED 권리이고 만료 전이면 대기 번호·15분 만료 없이 입장 토큰(클레임 prio)을 주고 입장 자리 수에 세지 않는다. 이때 queue-svc가 새 여정 ID(jny)를 만든다. 판매 종료 뒤에도 받는다(판매 종료 규칙의 예외, 추천 적용 2026-10-31, ADR-0171)" }, firstEtaSec: { type: number, description: "선택. 대기 화면이 이 대기에서 처음 보인 예상 대기(초, 1~86,400). firstEtaAtMs와 함께 오면 queue-svc가 그 대기표가 처음 자리를 잡을 때 (차례 시각 − firstEtaAtMs) ÷ firstEtaSec을 예상 대기 오차 지표(queue_eta_error_ratio)에 넣는다. 관측용이라 서버는 모양을 묻지 않고(입장을 400으로 막지 않는다) 숫자가 아니거나 범위 밖이면 버리며, 판정에 쓰지 않는다(추천 적용 2026-11-03, ADR-0183)" }, firstEtaAtMs: { type: number, description: "선택. firstEtaSec을 처음 보인 때의 보정된 서버 시각(유닉스 밀리초, ADR-0110). 미래이거나 이틀보다 앞이면 버린다" } } }
    QueueResultFile: { type: object, description: "셔플 결과 파일과 동시 도착 묶음 결과 파일의 본문: 토큰 해시 → 순번의 평평한 표다(docs/features/queue-admission.md §3 '결과 게시', ADR-0058, BUILD_ORDER BAS-042). 키는 SHA-256(UTF-8(토큰))의 소문자 16진 64자이고(셔플은 참가 토큰, 묶음은 사전 검증 토큰), 파일 이름의 hashPrefix는 그 앞 세 자리다(파일 4,096개 [가정]). 순번은 1부터다. 받는 시각의 분산은 응답의 spreadSec·shuffleSpreadSec 안에서 토큰 해시로 정한다", additionalProperties: { type: integer, minimum: 1 } }
    QueueShuffleProofGroup:
      type: object
      description: "셔플 구간 하나의 공시 기록(로비 lobby·동시 도착 묶음 batch). 아직 없는 값은 칸을 뺀다. 시드는 공개 시각(seedRevealAt)이 지나고 그 구간을 게시한 뒤에만 싣는다. 봉인 값은 싣지 않는다(ADR-0232)"
      required: [chain, algorithm, resultPathPrefix, fileCount]
      properties:
        chain: { type: string, description: "drand 체인 이름(quicknet)" }
        algorithm: { type: string, description: "알고리즘 판(v1)" }
        commit: { type: string, pattern: '^[0-9a-f]{64}$', description: "시드 해시(커밋)" }
        committedAt: { type: string, format: date-time, description: "커밋을 공시한 시각" }
        fixedAt: { type: string, format: date-time, description: "참가자 목록을 고정하는 시각(로비는 오픈, 묶음은 구간 끝)" }
        round: { type: integer, minimum: 1, description: "공시한 drand 라운드" }
        roundAt: { type: string, format: date-time, description: "그 라운드의 예정 시각" }
        merkleRoot: { type: string, pattern: '^[0-9a-f]{64}$', description: "참가자 머클 루트. 목록을 고정한 뒤 비콘을 받기 전에 공시한다" }
        rootAt: { type: string, format: date-time, description: "머클 루트를 공시한 시각" }
        firstSeq: { type: integer, minimum: 1, description: "이 구간의 첫 번호" }
        participantCount: { type: integer, minimum: 0, description: "참가자 수(목록을 고정한 때의 값)" }
        beacon: { type: string, pattern: '^[0-9a-f]{64}$', description: "drand 라운드 값" }
        beaconSignature: { type: string, pattern: '^[0-9a-f]+$', description: "drand 서명" }
        publishedAt: { type: string, format: date-time, description: "결과를 게시한 시각" }
        resultPathPrefix: { type: string, description: "결과 파일 경로의 앞부분. 뒤에 '{앞 세 자리}.json'을 붙이면 파일 경로다(queue-files 배포)" }
        fileCount: { type: integer, minimum: 0, description: "결과 파일 수(16진 앞 세 자리, 4,096 [가정]). 참가자가 0명으로 닫힌 구간은 파일이 없어 0이다" }
        seed: { type: string, pattern: '^[0-9a-f]{64}$', description: "공개한 시드" }
        seedRevealedAt: { type: string, format: date-time, description: "시드를 공개한 시각" }
        stopped: { type: object, required: [reason, at], description: "셔플을 멈춤(RB-35)", properties: { reason: { type: string, enum: [beacon, stale_round, late_commit, no_commit, late_root, members_changed, unknown] }, at: { type: string, format: date-time }, detail: { type: string, description: "reason이 unknown일 때의 자세한 이유(unauthorized: 서명 없는 RB-35 표시, seed_unavailable: 시드를 풀지 못하고 상한을 넘김, ADR-0239)" } } }
        emergency: { type: object, required: [at, reason, stopReason, limitation], description: "시드만 쓰는 비상 셔플을 실행함(RB-35, ADR-0239). 비콘 값이 없고, 다시 계산할 때 비콘 자리에 SHA-256(\"PEAKET-shuffle-v1-no-beacon\")을 넣는다", properties: { at: { type: string, format: date-time, description: "비상 셔플을 허가한 시각" }, reason: { type: string, maxLength: 200, description: "commander 두 명이 서명한 공개 사유" }, stopReason: { type: string, enum: [beacon], description: "멈췄던 이유. 비상 셔플은 비콘 지연에서만 받는다(ADR-0050 결정 7)" }, limitation: { type: string, description: "이 처리의 한계(고정 문장)" } } }
        redisclosures: { type: array, description: "공시 뒤 오픈 시각이 바뀌어 라운드를 다시 공시한 이력(시드와 커밋은 그대로, RB-35, ADR-0239)", items: { type: object, required: [at, previousRound, round, reason], properties: { at: { type: string, format: date-time, description: "다시 공시한 시각" }, previousRound: { type: integer, minimum: 1, description: "이전에 공시한 라운드" }, round: { type: integer, minimum: 1, description: "새로 공시한 라운드" }, reason: { type: string, maxLength: 200, description: "commander 두 명이 서명한 공개 사유" } } } }
        invalidDisclosures: { type: array, description: "비상 셔플·다시 공시 기록이 있는데 읽지 못한 칸(위조나 손상일 수 있다, ADR-0239 결정 15). 있으면 그 구간의 공시를 믿지 않는다", items: { type: string, enum: [emergency, redisclosures] } }
    QueueShuffleProof:
      type: object
      description: "셔플 검증 정보(SCR-019, POL-005, ADR-0232)"
      required: [eventId, opensAt, seedRevealAt, lobby, batch]
      properties:
        eventId: { type: string }
        opensAt: { type: string, format: date-time, description: "판매 오픈 시각" }
        seedRevealAt: { type: string, format: date-time, description: "시드 공개 예정 시각(오픈 60분 뒤)" }
        lobby: { oneOf: [{ $ref: '#/components/schemas/QueueShuffleProofGroup' }, { type: 'null' }], description: "로비 셔플. 끈 회차는 null" }
        batch: { oneOf: [{ $ref: '#/components/schemas/QueueShuffleProofGroup' }, { type: 'null' }], description: "동시 도착 묶음. 끈 회차는 null" }
    BatchingResponse: { type: object, description: "202 BATCHING 본문(ADR-0041·0058)", properties: { entryRequestId: { type: string, format: uuid, description: "이 묶음 참가의 진입 요청 ID(본문에 없었으면 queue-svc가 만든 값). 결과 뒤 이 값으로 진입을 다시 보낸다(묶음 기록은 같은 요청 ID로만 잇는다. 화면은 이 값을 localStorage에 둔다, 추천 적용 2026-11-03)" }, resultPath: { type: string, description: "queue-files의 묶음 결과 파일 경로(/v1/queues/{eventId}/batch-results/{hashPrefix}.json)" }, resultAt: { type: string, format: date-time, description: "결과 공개 예정 시각(공시 drand 라운드의 예정 시각 + 게시 목표 5초 [가정], ADR-0231)" }, spreadSec: { type: integer, description: "분산 창(초, 8 [가정])" }, serverTimeMs: { type: integer, format: int64, description: "서버 시각(유닉스 밀리초). 시계 보정 표본(ADR-0110)" } } }
    RecipientLookupResult: { type: object, description: "양도 받는 사람 확인 결과(FR-013)", properties: { recipientRef: { type: string, description: "불투명 참조값(10분 [가정], 양도 요청 한 번에만 쓴다)" }, nicknameMasked: { type: string, description: 닉네임 일부 } } }
    Genre: { type: string, enum: [콘서트, 뮤지컬, 연극, 클래식, 페스티벌, 팬미팅, 기타], description: "장르 정본 목록. 파트너 등록(SCR-021 1단계)·검색 필터·홈 장르 바로가기·장르별 랭킹이 같은 값을 쓴다(추천 적용 2026-10-14, ADR-0063)" }
    ProductionCard:
      type: object
      description: "홈·검색·랭킹·찜이 함께 쓰는 공연 카드. 공연(회차 묶음) 하나에 카드 하나이고 공개 값만 싣는다(추천 적용 2026-10-27, ADR-0093. 회차 단위였던 EventCard를 바꿈). 누르면 대표 회차 상세(/events/{eventId})로 간다"
      properties:
        productionId: { type: string }
        eventId: { type: string, description: "대표 회차: 판매 중인 회차 가운데 판매 종료가 가장 이른 것 → 오픈 예정 회차 가운데 오픈이 가장 이른 것 → 매진 회차 가운데 공연 시작이 가장 이른 것 → 가장 최근에 공연한 회차(취소 회차 제외, ADR-0093 결정 8)" }
        title: { type: string }
        genre: { $ref: '#/components/schemas/Genre' }
        posterUrl: { type: string, format: uri, description: "포스터 파생본 묶음의 기준 주소(ADR-0062 결정 38). 파생본 하나는 {기준 주소}/{폭}.{avif|webp}이고 폭은 320·640·960·1280 [가정]이다. 화면은 AVIF를 먼저, WebP를 대체로 둔 <picture>로 고른다(ADR-0199 결정 4)" }
        posterAlt: { type: string }
        placeName: { type: string, description: "공연장 이름(ADR-0093)" }
        periodStart: { type: string, format: date, description: "첫 회차 시작 날짜(KST)" }
        periodEnd: { type: string, format: date, description: "마지막 회차 종료 날짜(KST)" }
        nextOpenAt: { type: [string, 'null'], format: date-time, description: "아직 오픈하지 않은 회차 가운데 가장 이른 오픈 시각" }
        nextOpenEventId: { type: [string, 'null'], description: "그 회차. 카드의 오픈 알림 종 버튼이 이 회차를 신청한다(ADR-0093)" }
        saleStatus: { type: string, enum: [UPCOMING, ON_SALE, SOLD_OUT, ENDED], description: "회차 판매 상태(docs/planning/03 §2.15)를 공연 단위로 모은 값이다. 일시 매진(ALL_HELD) 회차는 판매 중으로 센다(ADR-0122). 판매 중인 회차가 하나라도 있으면 ON_SALE, 없고 오픈 예정 회차가 있으면 UPCOMING, 남은 회차가 모두 매진이면 SOLD_OUT, 모든 회차가 판매 종료(각 회차의 공연 시작 24시간 전)를 지났으면 ENDED(소유자 결정 2026-10-14, ADR-0064, POL-030, 공연 단위 ADR-0093)" }
        saleEndsAt: { type: string, format: date-time, description: "이 공연의 마지막 회차의 판매 종료(그 회차의 starts_at − 24시간, 새 데이터 칸 없이 계산, 추천 적용 2026-10-14, ADR-0064). '지금 판매 중'의 남은 판매 기간 표시와 정렬에 쓴다(POL-043)" }
        minPrice: { type: integer, description: "가장 낮은 등급의 티켓 가격(원). 예매 수수료를 받지 않으므로(POL-032) 이 값이 소비자가 내는 총금액이다(수수료 없음, 전자상거래법 §21의2①1호, 전자상거래 소비자보호 지침 12, 2026-10-14 원문 확인)" }
        badges: { type: array, description: "대표 회차의 피켓 판매 정보 배지 코드. 문구는 화면이 정한다. PREQUEUE_SHUFFLE·HYBRID·FIFO는 회차의 정렬 설정 두 값(lobbyShuffle·openBatch)의 조합에서 계산한 이름이다(ADR-0118)", items: { type: string, enum: [PREQUEUE_SHUFFLE, HYBRID, FIFO, PRESALE, AUTO_SEAT] } }
    HomeFeed:
      type: object
      description: "홈 피드(SCR-001, 소유자 결정 2026-10-14, ADR-0063). 개인 값(찜한 공연, 오픈 알림 상태)은 싣지 않는다. 비어 있는 섹션은 빈 배열이고 화면은 그 섹션만 숨긴다. 장르 바로가기는 정본 장르 목록이라 피드에 없고, 장르별 랭킹은 랭킹 파일로 따로 받는다"
      properties:
        banners:
          type: array
          description: "운영자가 [홈 구성]에서 정한 순서. 노출 기간 안이고 판매 승인된 공연만"
          items: { type: object, properties: { bannerId: { type: string }, productionId: { type: string }, eventId: { type: string, description: "대표 회차(누르면 이 회차 상세, ADR-0093)" }, title: { type: string, description: "배너의 핵심 문구(HTML 글자로 이미지 위·아래에 보인다. 이미지 안 글자로 넣지 않는다, d5 §5.1, WCAG 2.2 SC 1.4.5). [홈 구성]에서 적지 않았으면 없다" }, subtitle: { type: string, description: "둘째 줄(일시·장소 등)" }, imageUrl: { type: string, format: uri, description: "가로형 배너 파생본 묶음의 기준 주소(원본 1240×400 이상 [가정]). 파생본 이름은 posterUrl과 같은 규칙이다(ADR-0199 결정 4)" }, alt: { type: string }, displayUntil: { type: string, format: date-time } } }
        upcoming: { type: array, description: "오픈 예정 공연(다음 오픈 시각 순, ADR-0093)", items: { $ref: '#/components/schemas/ProductionCard' } }
        onSale: { type: array, description: "지금 판매 중. 잔여석이 있는 공연을 판매 종료(마지막 회차의 공연 시작 24시간 전, saleEndsAt)가 가까운 순으로(POL-043, ADR-0064)", items: { $ref: '#/components/schemas/ProductionCard' } }
        themes:
          type: array
          description: "운영자가 [홈 구성]에서 만든 테마 줄(순서대로)"
          items: { type: object, properties: { themeId: { type: string }, name: { type: string }, productions: { type: array, items: { $ref: '#/components/schemas/ProductionCard' } } } }
        places:
          type: array
          description: "공연장 줄(오픈 예정·판매 중 공연이 있는 공연장, 추천 적용 2026-10-14, ADR-0063. 실제 공연장 place, ADR-0093). 누르면 /v1/search?placeId="
          items: { type: object, properties: { placeId: { type: string }, name: { type: string }, initial: { type: string, description: "원형 이니셜 글자(로고 이미지 없음)" } } }
        rankingsPath: { type: string, description: "장르별 랭킹 파일 경로(/v1/home/rankings.json)" }
        generatedAt: { type: string, format: date-time }
    RankingFile:
      type: object
      description: "장르별 랭킹 파일(SCR-001 ⑧, 추천 적용 2026-10-14, ADR-0063). 어제(KST) 확정 판매 매수 순위이고 매수 값은 싣지 않는다. 공연 단위다(그 공연 회차들의 판매 매수 합, 추천 적용 2026-10-27, ADR-0093). docs/features/analytics.md §8.5"
      properties:
        basisDate: { type: string, format: date, description: "집계한 날(어제, KST)" }
        generatedAt: { type: string, format: date-time }
        overall: { type: array, maxItems: 10, description: "'전체' 칩의 장르 구분 없는 순위, 최대 10위 [가정](추천 적용 2026-10-14, ADR-0063)", items: { allOf: [{ $ref: '#/components/schemas/ProductionCard' }, { type: object, required: [rank], properties: { rank: { type: integer, minimum: 1 } } }] } }
        genres:
          type: array
          items:
            type: object
            properties:
              genre: { $ref: '#/components/schemas/Genre' }
              items: { type: array, maxItems: 10, description: "최대 10위 [가정]", items: { allOf: [{ $ref: '#/components/schemas/ProductionCard' }, { type: object, required: [rank], properties: { rank: { type: integer, minimum: 1 } } }] } }
    SearchResultPage:
      type: object
      description: "검색 결과 한 쪽(페이지 번호 방식, guidelines §3 예외, 소유자 결정 2026-10-14, ADR-0063). 한 줄은 공연이다(ADR-0093). 결과 0건 처리와 관련 공연은 docs/features/search.md §5.5·§6(추천 적용 2026-10-27, ADR-0094)"
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ProductionCard' } }
        page: { type: integer, minimum: 1 }
        limit: { type: integer, enum: [20] }
        total: { type: integer, description: "결과 수. 1,000 [가정]을 넘으면 1000이고 totalCapped가 true" }
        totalCapped: { type: boolean }
        totalPages: { type: integer }
        query:
          type: object
          description: "검색어 해석"
          properties:
            normalized: { type: string, description: "정규화한 입력(NFKC 뒤 자모를 호환 자모로 되돌림·소문자·제로폭과 한글 채움 문자 지움·공백 정리, docs/features/search.md §3.1)" }
            converted: { type: [object, 'null'], description: "로마자만인 입력이 0건이라 한/영 변환 값으로 찾았을 때만 싣는다. 화면은 바꾼 값으로 찾았다고 알리고 원래 값으로 찾는 링크를 둔다", properties: { from: { type: string }, to: { type: string } } }
        didYouMean: { type: [string, 'null'], description: "결과가 0건일 때 낱자 단위로 가장 가까운 이름 하나(없으면 null)" }
        relaxedTotal: { type: [integer, 'null'], description: "결과가 0건이고 필터가 걸려 있을 때 필터를 뺀 결과 수" }
        filterNames:
          type: object
          description: "주소로 받은 공연장·아티스트 필터의 화면 이름(필터 칩에 보인다. 홈 공연장 줄·자동완성 후보가 ID로만 연다, 추천 적용 2026-11-05, HOT-312). 없는 ID면 null"
          properties:
            placeName: { type: [string, 'null'] }
            artistName: { type: [string, 'null'] }
        related:
          type: [object, 'null']
          description: "관련 공연. 맨 위 결과가 아티스트·공연장으로 맞았으면 그 아티스트의 다른 공연이나 그 공연장의 오픈 예정 공연, 결과가 0건이면 오픈 예정 인기 공연. 검색 기록은 쓰지 않는다"
          properties:
            basis: { type: object, properties: { kind: { type: string, enum: [ARTIST, PLACE, UPCOMING_POPULAR] }, id: { type: [string, 'null'] }, name: { type: [string, 'null'] } } }
            items: { type: array, maxItems: 6, description: "6개 [가정]", items: { $ref: '#/components/schemas/ProductionCard' } }
    SuggestResult:
      type: object
      description: "자동완성 창의 응답(소유자 결정 2026-10-14, ADR-0063. 이름 '자동완성'은 소유자 결정 2026-10-27, ADR-0094). 최대 8개 [가정]이고 종류별 몫은 공연 5·아티스트 2·공연장 1 [가정], 빈 몫은 다른 종류로 채운다(docs/features/search.md §4)"
      properties:
        query: { type: string, description: "정규화한 입력(NFKC 뒤 자모를 호환 자모로 되돌림, 소문자, 제로폭과 한글 채움 문자 지움, 공백 정리, docs/features/search.md §3.1)" }
        items:
          type: array
          maxItems: 8
          items:
            type: object
            required: [kind, label]
            properties:
              kind: { type: string, enum: [PRODUCTION, ARTIST, PLACE], description: "공연·아티스트·공연장. 화면이 종류 아이콘과 종류 글자를 붙인다" }
              label: { type: string, description: "화면 이름. 다른 이름으로 맞아도 원래 이름을 보인다" }
              matches: { type: array, description: "label에서 굵게 보일 부분(UTF-16 위치와 길이). 낱자·초성·다른 이름으로 맞은 경우도 서버가 원래 이름 위에서 계산한다(docs/features/search.md §4.2)", items: { type: object, properties: { start: { type: integer }, length: { type: integer } } } }
              productionId: { type: string, description: "kind=PRODUCTION일 때" }
              eventId: { type: string, description: "kind=PRODUCTION일 때 대표 회차. 고르면 이 회차 상세로 간다" }
              posterUrl: { type: string, format: uri, description: "kind=PRODUCTION일 때 작은 포스터" }
              nextOpenAt: { type: [string, 'null'], format: date-time, description: "kind=PRODUCTION일 때 다음 오픈 일시" }
              saleStatus: { type: string, enum: [UPCOMING, ON_SALE, SOLD_OUT], description: "kind=PRODUCTION일 때" }
              artistId: { type: string, description: "kind=ARTIST일 때. 고르면 /search?artistId=" }
              placeId: { type: string, description: "kind=PLACE일 때. 고르면 /search?placeId=" }
    Review:
      type: object
      description: "관람 후기(소유자 결정 2026-10-14, ADR-0063). 작성자는 닉네임 첫 글자와 '**', 관람 회차 일시만 싣고 이메일·전화번호·실명·계정 ID는 싣지 않는다. 본인 후기는 mine으로만 알린다(추천 적용 2026-10-14, ADR-0063)"
      properties:
        reviewId: { type: string }
        eventId: { type: string }
        authorDisplay: { type: string, description: "닉네임 첫 글자(grapheme) + '**'. 예: 김**" }
        attendedStartsAt: { type: string, format: date-time, description: "관람 회차 일시" }
        rating: { type: integer, minimum: 1, maximum: 5 }
        body: { type: string }
        createdAt: { type: string, format: date-time }
        edited: { type: boolean }
        mine: { type: boolean, description: "본인 후기. 팬 쿠키로 부른 목록·단건에서만 true가 될 수 있고 CDN 캐시 응답(요약)에는 늘 false" }
        reportedByMe: { type: boolean, description: "이 계정이 이미 신고한 후기. 화면은 [신고함](비활성)으로 보인다. 팬 쿠키로 부른 목록·단건에서만 true가 될 수 있고 CDN 캐시 응답(요약)에는 늘 false(ADR-0066)" }
        images: { type: array, maxItems: 3, description: "후기 사진(최대 3장 [가정], ADR-0066). 남에게 가린 후기에는 싣지 않는다", items: { $ref: '#/components/schemas/ReviewImage' } }
        status: { type: string, enum: [VISIBLE, HIDDEN], description: "HIDDEN(통보·같은 내용·불법 촬영물 신고 확인 중·신고 처리로 가림)은 본인에게 '노출 제한'으로 보인다. 신고 처리로 임시조치·노출 차단한 후기는 남에게도 본문·사진·별점 없이 notice만 있는 자리로 온다(ADR-0066)" }
        notice: { type: string, enum: [RIGHTS_TEMP, POLICY], description: "신고 처리로 가린 후기의 공시(정보통신망법 §44의2② 후단). RIGHTS_TEMP면 화면이 '권리 침해 신고로 임시조치된 후기입니다(noticeUntil까지)', POLICY면 '운영정책에 따라 가려진 후기입니다'를 보인다. 통보·같은 내용 차단과 불법 촬영물 신고 확인 중 가림은 남의 목록에서 빠지고 이 값이 없다(추천 적용 2026-10-19, ADR-0066)" }
        noticeUntil: { type: string, format: date-time, description: "RIGHTS_TEMP의 끝 시각(30일 이내)" }
        permalink: { type: string, description: "이 후기를 가리키는 같은 출처 주소(신고 모달의 신고기관 바로가기 때 복사, FR-016·FR-070). 형식은 docs/design/d5 SCR-016" }
    ReviewPage: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Review' } }, nextCursor: { type: [string, 'null'] } } }
    ReviewSummary:
      type: object
      description: "공연 상세 후기 섹션(그 공연의 모든 회차 후기의 평균 별점, 후기 수, 최근 후기 2개, ADR-0093). 개인 값 없음"
      properties:
        averageRating: { type: [number, 'null'], description: "소수 첫째 자리. 후기가 없으면 null" }
        count: { type: integer }
        recent: { type: array, maxItems: 2, items: { $ref: '#/components/schemas/Review' } }
    ReviewEligibility:
      type: object
      description: "후기 쓰기 자격. [후기 쓰기]를 누를 때 확인하고, 자격이 없으면 화면이 이유 대화상자를 띄운다(버튼을 숨기지 않는다)"
      properties:
        eligible: { type: boolean }
        reason: { type: string, enum: [NOT_ENDED, NOT_PURCHASER, EVENT_CANCELLED, ALREADY_WRITTEN], description: "eligible=false일 때. NOT_ENDED: 공연 종료 예정 시각 전, NOT_PURCHASER: 이 회차 결제자가 아니거나 티켓이 모두 취소·환불됨(양도받은 분 포함), EVENT_CANCELLED: 취소된 회차, ALREADY_WRITTEN: 이미 씀(수정으로 안내)" }
        myReviewId: { type: string, description: "ALREADY_WRITTEN일 때" }
    ReviewWrite: { additionalProperties: false, type: object, required: [rating, body], properties: { rating: { type: integer, minimum: 1, maximum: 5 }, body: { type: string, maxLength: 4000, description: "NFC 정규화 뒤 grapheme 10~1,000자 [가정]. 금칙어는 NFKC 정규화 뒤 대조" }, images: { type: array, maxItems: 3, description: "붙일 사진(최대 3장 [가정], 순서대로). POST /v1/review-images로 이 계정이 올린 READY 사진만. 고치기에서 보내면 사진 목록을 이 값으로 바꾸고 빠진 사진은 지운다(소유자 요청 2026-10-19, 세부는 추천 적용 2026-10-19, ADR-0066)", items: { type: object, additionalProperties: false, required: [imageId], properties: { imageId: { type: string }, alt: { type: string, maxLength: 400, description: "사진 설명(대체 텍스트, 선택). NFC 정규화 뒤 grapheme 100자 [가정]. 비우면 화면이 '후기 사진 1/3'으로 읽는다" } } } } } }
    ReviewImage: { type: object, description: "후기에 붙은 사진(ADR-0066). 메타데이터를 지운 파생본 2종만 있고 원본은 없다. 이름은 서버가 만든 ID", properties: { imageId: { type: string }, thumbnailUrl: { type: string, format: uri, description: "목록 파생본(240px [가정])" }, url: { type: string, format: uri, description: "보기 파생본(긴 변 1,280px [가정])" }, alt: { type: string, description: "사진 설명. 비었으면 화면이 '후기 사진 1/3'으로 읽는다" }, width: { type: integer }, height: { type: integer } } }
    ReviewImageUpload: { type: object, description: "후기 사진 올리기 결과(ADR-0066). 검사·다시 인코딩이 끝난 뒤 응답한다", properties: { imageId: { type: string }, status: { type: string, enum: [READY], description: "붙일 수 있는 사진. 받지 않은 사진은 422" }, thumbnailUrl: { type: string, format: uri, description: "목록 파생본(240px [가정])" } } }
    ContentReportCreate:
      type: object
      additionalProperties: false
      description: "후기 신고(FR-070, POL-044, 소유자 요청 2026-10-19, 세부는 추천 적용 2026-10-19, ADR-0066). 화면은 확인 모달의 [신고합니다]에서만 보낸다"
      required: [category]
      properties:
        category: { type: string, enum: [SCALPING, MACRO, ABUSE, RIGHTS, ILLEGAL_FILMING, SPAM, OFF_TOPIC, OTHER], description: "SCALPING 암표·부정판매, MACRO 매크로·부정 예매 프로그램, ABUSE 욕설·비방·혐오 표현, RIGHTS 개인정보 노출·명예훼손, ILLEGAL_FILMING 음란물·불법 촬영물, SPAM 광고·도배, OFF_TOPIC 공연과 관계없는 내용, OTHER 기타" }
        detail: { type: string, maxLength: 2000, description: "자세한 내용. NFC 정규화 뒤 grapheme 0~500자 [가정]. RIGHTS이고 rightsHolder가 true이거나 OTHER면 필수(아니면 422)" }
        rightsHolder: { type: boolean, description: "RIGHTS일 때 필수. 이 후기로 권리를 침해받은 본인이면 true이고 정보통신망법 §44의2 삭제 요청으로 받는다" }
        notifyChannel: { type: string, enum: [APP, EMAIL], description: "처리 결과를 받을 곳(앱 알림, 계정 이메일). rightsHolder가 true면 필수(§44의2① 통지 수단 지정)" }
    ContentReportResult: { type: object, properties: { reportId: { type: string } } }
    ReviewModeration:
      type: object
      additionalProperties: false
      description: "신고된 후기 처리(FR-070, POL-044, 추천 적용 2026-10-19, ADR-0066)"
      required: [action, reason]
      properties:
        action: { type: string, enum: [NO_ACTION, TEMP_BLOCK, BLOCK, RELEASE], description: "NO_ACTION 조치 없음, TEMP_BLOCK 임시조치(최대 30일), BLOCK 운영정책 위반 노출 차단, RELEASE 가린 후기를 다시 보이게 함" }
        reason: { type: string, minLength: 1, maxLength: 2000, description: "사유(필수, 감사 로그). 팬 개인정보를 적지 않는다" }
        violation: { type: string, enum: [SCALPING, MACRO, ABUSE, RIGHTS, ILLEGAL_FILMING, SPAM, OFF_TOPIC, OTHER], description: "TEMP_BLOCK·BLOCK일 때 필수. 글쓴이에게 알리는 사유 종류(신고 사유와 같은 코드)" }
        endsAt: { type: string, format: date-time, description: "TEMP_BLOCK일 때 필수. 지금부터 30일 이내(정보통신망법 §44의2④)" }
    InquiryCategory: { type: string, enum: [BOOKING_PAYMENT, CANCEL_REFUND, TRANSFER, ENTRY, ACCOUNT, AUTOMATED_DECISION, SELLER_DISPUTE, MINOR_CONTRACT_CANCEL, MERCH, MODERATION_APPEAL, RESALE_POST_REPORT, OTHER], description: "문의 유형 12개(추천 적용 2026-10-19, ADR-0066): 예매·결제, 취소·환불(사정이 있어 공제 면제를 요청), 양도, 입장·현장, 계정, 자동화된 결정(추가 검증) 설명·재검토, 공연(판매자) 관련 분쟁, 미성년자 계약 취소, 굿즈·상품, 게시물 조치 이의, 외부 되팔이 게시물 신고, 기타. 외부 되팔이 게시물 신고(RESALE_POST_REPORT)는 PEAKET 밖 사이트의 되팔이 글을 알리는 창구다. 문의에는 첨부가 없어 신고는 공개 게시물의 주소와 설명만 담는다. 신고자가 받은 비공개 메시지나 로그인해야 보이는 비공개 모임의 글은 모으지 않는다고 화면이 안내한다. CS 처리함 건(INQUIRY)이 되고, 답변은 접수 확인까지만 하며 조사 결과를 신고자에게 알리지 않는다. 담당자가 그 건을 조사관에게 넘기면 조사관이 외부 게시물 등록(POST /v1/ops/external-posts, source REPORT)의 출처로 쓴다. 신고자 정보는 수집본에 넣지 않는다(법률 확인 37번(추천 적용 2026-10-31, ADR-0173))" }
    InquiryCreate:
      type: object
      additionalProperties: false
      description: "문의하기(SCR-056, FR-069, ADR-0066). 첨부 파일은 받지 않는다"
      required: [category, title, body]
      properties:
        category: { $ref: '#/components/schemas/InquiryCategory' }
        orderRef: { type: string, description: "관련 주문(선택). 이 계정의 예매번호나 굿즈 주문번호만" }
        title: { type: string, maxLength: 200, description: "NFC 정규화 뒤 grapheme 5~50자 [가정]" }
        body: { type: string, maxLength: 8000, description: "NFC 정규화 뒤 grapheme 10~2,000자 [가정]. 건강 정보 같은 민감한 내용과 계좌번호는 적지 않아도 된다(화면 안내)" }
    InquiryCreated: { type: object, properties: { inquiryId: { type: string }, number: { type: string, description: "접수 번호 Q-YYMM-NNNN [가정](예 Q-2610-0042)" }, dueAt: { type: string, format: date-time, description: "결과 안내 기한(일반 문의 답변 3영업일 [가정], 분쟁 결과 10영업일)" } } }
    InquiryMessage: { type: object, description: "문의 기록 한 줄(ADR-0066)", properties: { messageId: { type: string }, authorKind: { type: string, enum: [FAN, AGENT, SYSTEM] }, authorDisplay: { type: string, description: "AGENT는 '피켓 고객센터'. 담당자 이름·계정 ID는 싣지 않는다" }, kind: { type: string, enum: [MESSAGE, PROGRESS, ANSWER], description: "MESSAGE 문의·추가 문의, PROGRESS 진행 경과, ANSWER 답변" }, body: { type: string }, createdAt: { type: string, format: date-time } } }
    Inquiry:
      type: object
      description: "고객 문의(FR-069, 추천 적용 2026-10-19, ADR-0066). 본인 것만. 목록에는 messages가 없고 상세에만 있다"
      properties:
        inquiryId: { type: string }
        number: { type: string, description: "접수 번호 Q-YYMM-NNNN [가정]" }
        category: { $ref: '#/components/schemas/InquiryCategory' }
        orderRef: { type: string }
        orderSummary: { type: string, description: "관련 주문 표시(공연명·회차·좌석 등급·매수 또는 상품 요약). 없으면 없음" }
        title: { type: string }
        status: { type: string, enum: [RECEIVED, IN_PROGRESS, ANSWERED, CLOSED], description: "접수됨·처리 중·답변 완료·닫힘" }
        hasNewAnswer: { type: boolean, description: "상세를 마지막으로 연 뒤 답변·진행 경과가 왔음" }
        createdAt: { type: string, format: date-time }
        answeredAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time }
        progressDueAt: { type: string, format: date-time, description: "분쟁 유형만. 진행 경과 안내 기한(3영업일, 전자상거래법 시행령 §25의2)" }
        resultDueAt: { type: string, format: date-time, description: "결과 안내 기한(분쟁 10영업일, 일반 문의 답변 3영업일 [가정])" }
        messages: { type: array, description: "상세에만. 시간 순", items: { $ref: '#/components/schemas/InquiryMessage' } }
    InquiryPage: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Inquiry' } }, total: { type: integer, description: "조건에 맞는 문의 수" }, page: { type: integer }, limit: { type: integer } } }
    CaseReply: { type: object, additionalProperties: false, required: [kind, body], description: "문의 답변·진행 경과(ADR-0066)", properties: { kind: { type: string, enum: [ANSWER, PROGRESS] }, body: { type: string, minLength: 1, maxLength: 8000, description: "NFC 정규화 뒤 grapheme 2,000자까지. 팬에게는 '피켓 고객센터'로 보인다" } } }
    HomeLayout:
      type: object
      description: "홈 구성(SCR-068 [홈 구성] 탭, operator 1인, 감사 로그). 배너와 테마를 한 문서로 통째로 저장하고 version으로 동시 수정을 막는다. 개수 상한은 [가정](추천 적용 2026-10-14, ADR-0063)"
      required: [version, banners, themes]
      properties:
        version: { type: integer, description: "읽은 판. 저장 때 서버 판과 다르면 409" }
        banners:
          type: array
          maxItems: 10
          items:
            type: object
            required: [productionId, imageId, alt, displayFrom, displayUntil]
            properties:
              bannerId: { type: string }
              productionId: { type: string, description: "판매 승인된 공연만(아니면 422, ADR-0093). 누르면 대표 회차 상세" }
              imageId: { type: string, description: "POST /v1/ops/home-layout/banner-images로 올린 이미지" }
              alt: { type: string, minLength: 1, maxLength: 300, description: "대체 텍스트. 이미지에만 있는 정보(일시·장소)도 적는다" }
              title: { type: string, minLength: 1, maxLength: 40, description: "배너의 핵심 문구 40자 [가정]. 화면이 HTML 글자로 보인다(이미지 안 글자로 넣지 않는다, d5 §5.1, ADR-0199 결정 5)" }
              subtitle: { type: string, minLength: 1, maxLength: 80, description: "둘째 줄 80자 [가정](일시·장소 등)" }
              displayFrom: { type: string, format: date-time }
              displayUntil: { type: string, format: date-time }
        themes:
          type: array
          maxItems: 5
          items:
            type: object
            required: [name, productionIds, displayFrom, displayUntil]
            properties:
              themeId: { type: string }
              name: { type: string, minLength: 1, maxLength: 30 }
              productionIds: { type: array, minItems: 1, maxItems: 20, items: { type: string }, description: "판매 승인된 공연만, 순서대로(ADR-0093)" }
              displayFrom: { type: string, format: date-time }
              displayUntil: { type: string, format: date-time }
        updatedBy: { type: string, readOnly: true, description: "마지막으로 저장한 운영자" }
        updatedAt: { type: string, format: date-time, readOnly: true }
    HomeLayoutInput:
      type: object
      additionalProperties: false
      description: HomeLayout의 요청용(정의 밖 칸을 400으로 거절한다). 칸의 뜻은 원래 스키마(HomeLayout)와 같고 응답은 HomeLayout(열림)다(guidelines §1 '요청은 닫고 응답은 연다', BAS-040). 서버가 채우는 updatedBy·updatedAt은 받지 않고, 저장 사유 reason을 함께 받는다(PUT /v1/ops/home-layout. allOf로 잇던 것을 한 스키마로 바꿔 orval이 읽기 전용 칸을 본문 Zod에 넣던 차이도 없앴다).
      required: [version, banners, themes, reason]
      properties:
        version: {type: integer, description: 읽은 판. 저장 때 서버 판과 다르면 409}
        banners:
          type: array
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [productionId, imageId, alt, displayFrom, displayUntil]
            properties:
              bannerId: {type: string}
              productionId: {type: string, description: '판매 승인된 공연만(아니면 422, ADR-0093). 누르면 대표 회차 상세'}
              imageId: {type: string, description: POST /v1/ops/home-layout/banner-images로 올린 이미지}
              alt: {type: string, minLength: 1, maxLength: 300, description: 대체 텍스트. 이미지에만 있는 정보(일시·장소)도 적는다}
              title: {type: string, minLength: 1, maxLength: 40, description: '배너의 핵심 문구 40자 [가정]. 화면이 HTML 글자로 보인다(ADR-0199 결정 5)'}
              subtitle: {type: string, minLength: 1, maxLength: 80, description: '둘째 줄 80자 [가정]'}
              displayFrom: {type: string, format: date-time}
              displayUntil: {type: string, format: date-time}
        themes:
          type: array
          maxItems: 5
          items:
            type: object
            additionalProperties: false
            required: [name, productionIds, displayFrom, displayUntil]
            properties:
              themeId: {type: string}
              name: {type: string, minLength: 1, maxLength: 30}
              productionIds:
                type: array
                minItems: 1
                maxItems: 20
                items: {type: string}
                description: 판매 승인된 공연만, 순서대로(ADR-0093)
              displayFrom: {type: string, format: date-time}
              displayUntil: {type: string, format: date-time}
        reason: {type: string, minLength: 1, maxLength: 500}
    SeatMapShape: { type: object, required: [kind, points], description: "공연장 좌표계 도형. 그린 도구가 무엇이든 저장 값은 꼭짓점 목록(다각형)이다", properties: { kind: { type: string, enum: [RECT, POLYGON, SECTOR, ARC_BAND], description: "그린 도구(사각형·다각형·부채꼴·곡선 띠). 곡선 띠는 안쪽·바깥 반지름이 있는 부채꼴 띠다(추천 적용 2026-10-19, ADR-0066)" }, points: { type: array, minItems: 3, items: { type: array, minItems: 2, maxItems: 2, items: { type: integer } }, description: "꼭짓점 [x, y] 목록" }, name: { type: string }, arc: { $ref: '#/components/schemas/SeatMapShapeArc' } } }
    SeatMapShapeArc: { type: object, required: [cx, cy, innerRadius, outerRadius, startAngle, endAngle], description: "부채꼴·곡선 띠를 그린 원래 매개변수(에디터 전용, 추천 적용 2026-11-10, ADR-0264 결정 12). 저장 값은 points이고, 이 값은 에디터가 다시 열 때 반지름·각도 손잡이를 되살리는 데만 쓴다(구역은 section.editor_meta, 무대는 venue.stage_shapes). 팬 좌석맵 파일에는 싣지 않는다", properties: { cx: { type: integer, description: "중심 x(cm)" }, cy: { type: integer, description: "중심 y(cm)" }, innerRadius: { type: integer, description: "안쪽 반지름(cm). 부채꼴은 0" }, outerRadius: { type: integer, description: "바깥 반지름(cm)" }, startAngle: { type: integer, description: "시작각(도). 화면 오른쪽이 0이고 시계 방향으로 는다" }, endAngle: { type: integer, description: "끝각(도)" } } }
    SeatMapShapeArcInput:
      type: object
      additionalProperties: false
      description: SeatMapShapeArc의 요청용(정의 밖 칸을 400으로 거절한다). 범위 밖 값은 400이고, innerRadius ≥ outerRadius, endAngle ≤ startAngle, endAngle − startAngle > 360이거나 kind가 SECTOR·ARC_BAND가 아닌 도형에 있으면 422 seatmap-invalid(항목 코드 SHAPE_PARAMS_INVALID)다(추천 적용 2026-11-10, ADR-0264 결정 12)
      required: [cx, cy, innerRadius, outerRadius, startAngle, endAngle]
      properties:
        cx: {type: integer, minimum: 0, maximum: 100000}
        cy: {type: integer, minimum: 0, maximum: 100000}
        innerRadius: {type: integer, minimum: 0, maximum: 100000}
        outerRadius: {type: integer, minimum: 1, maximum: 100000}
        startAngle: {type: integer, minimum: -360, maximum: 360}
        endAngle: {type: integer, minimum: -360, maximum: 720}
    SeatMapShapeInput:
      type: object
      additionalProperties: false
      description: SeatMapShape의 요청용(정의 밖 칸을 400으로 거절한다). 칸의 뜻은 원래 스키마(SeatMapShape)와 같고 응답은 SeatMapShape(열림)다(guidelines §1 '요청은 닫고 응답은 연다', BAS-040).
      required: [kind, points]
      properties:
        kind:
          type: string
          enum: [RECT, POLYGON, SECTOR, ARC_BAND]
          description: 그린 도구(사각형·다각형·부채꼴·곡선 띠). 곡선 띠는 안쪽·바깥 반지름이 있는 부채꼴 띠다(추천 적용 2026-10-19, ADR-0066)
        points:
          type: array
          minItems: 3
          items:
            type: array
            minItems: 2
            maxItems: 2
            items: {type: integer}
          description: 꼭짓점 [x, y] 목록
        name: {type: string}
        arc: {$ref: '#/components/schemas/SeatMapShapeArcInput'}
    SeatMapLayout:
      type: object
      description: "좌석맵 두 층(배치 층: 캔버스·무대·구역 도형·라벨 위치·등급, 좌석 층: 행·좌석·좌표, 추천 적용 2026-10-14, ADR-0063). 파트너 에디터가 불러오고 저장하는 본문이다. 팬 화면 좌석맵 파일은 같은 두 층을 구역마다 열 단위 배열로 낸 SeatMapColumns다(2026-11-04 BUILD_ORDER HOT-110, BAS-190 PoC에서 객체 배열보다 압축 전 3.4배·brotli 3.0배 작았다)"
      required: [canvas, sections]
      properties:
        layoutVersion: { type: integer, description: "저장할 때 읽은 판. 서버 판과 다르면 412(추천 적용 2026-11-10, 리뷰). 0이면 새 배치본" }
        templateVenueId: { type: string, description: "복제한 공연장 틀 ID. 배치본은 틀을 복제한 공연용 사본이고 편집은 그 사본에만 미친다(추천 적용 2026-10-14, ADR-0063)" }
        priceTiers: { type: array, maxItems: 16, description: "가격 등급(보이는 순서, 배치본 단위 = 공연 단위, 추천 적용 2026-11-10, ADR-0260 결정 2·4). 팬 좌석맵 파일 tiers와 공연 상세 priceTiers의 차례다", items: { $ref: '#/components/schemas/SeatMapPriceTier' } }
        fanFilePublished: { type: boolean, description: "저장 응답에서만: 이 판의 팬 좌석맵 파일을 회차마다 게시했는지. 좌석이 없는 구역이 있으면 false다(ADR-0260 결정 6)" }
        geometryLocked: { type: boolean, description: "불러오기·저장 응답에서만: 오픈 뒤 도형 잠금(승인 이력이 있고 이 배치본의 취소되지 않은 회차 하나의 오픈 시각이 지남, ADR-0260 결정 7과 같은 판정 함수). 참이면 에디터는 도형·좌석 더하기·지우기·옮기기·채우기와 가격 등급 고치기를 끄고, 좌석의 판매 제외·휠체어석·게이트와 구역의 게이트만 받는다(추천 적용 2026-11-10, ADR-0264 결정 13)" }
        warnings: { type: array, description: "저장 응답에서만: 저장한 배치의 업무 경고(휠체어석 W1~W3, 좌석 겹침, 도형 밖 좌석). 가져오기 결과와 같은 검사기·같은 모양이고 저장을 막지 않는다(추천 적용 2026-11-10, ADR-0264 결정 15, BUILD_ORDER HOT-230)", items: { $ref: '#/components/schemas/SeatMapWarning' } }
        canvas: { type: object, required: [width, height], properties: { width: { type: integer }, height: { type: integer } } }
        stage: { type: array, description: "무대·통로 등 판매하지 않는 도형", items: { $ref: '#/components/schemas/SeatMapShape' } }
        sections:
          type: array
          items:
            type: object
            required: [sectionId, name, shape]
            properties:
              sectionId: { type: string }
              name: { type: string }
              level: { type: string }
              shape: { $ref: '#/components/schemas/SeatMapShape' }
              label: { type: object, description: "구역 라벨 위치", properties: { x: { type: integer }, y: { type: integer } } }
              tierId: { type: string, description: "구역 기본 등급. 회차 판매 등급은 좌석의 tierId" }
              gateZone: { type: string }
              seatIndexRange: { type: object, description: "이 구역 좌석의 비트맵 인덱스 범위. 브라우저가 스냅샷에서 구역별 남은 좌석을 센다(추천 적용 2026-10-14, ADR-0063)", properties: { from: { type: integer }, to: { type: integer } } }
              fillRule: { $ref: '#/components/schemas/SeatFillRule', description: "파트너 에디터 전용 좌석 채우기 규칙(section.editor_meta). 팬 좌석맵 파일에는 싣지 않는다(ADR-0066)" }
              seats:
                type: array
                items: { type: object, required: [seatId, row, number, x, y], properties: { seatId: { type: string }, index: { type: integer, description: "비트맵 인덱스" }, row: { type: string }, number: { type: integer }, x: { type: integer }, y: { type: integer }, tierId: { type: string }, wheelchair: { type: boolean }, unavailable: { type: boolean, description: "판매 제외" }, gateZone: { type: string } } }
    SeatMapLayoutInput:
      type: object
      additionalProperties: false
      description: SeatMapLayout의 요청용(정의 밖 칸을 400으로 거절한다). 칸의 뜻은 원래 스키마(SeatMapLayout)와 같고 응답은 SeatMapLayout(열림)다(guidelines §1 '요청은 닫고 응답은 연다', BAS-040).
      required: [canvas, sections]
      properties:
        layoutVersion: {type: integer, description: '저장할 때 읽은 판. 서버 판과 다르면 412(추천 적용 2026-11-10, 리뷰). 0이면 새 배치본'}
        templateVenueId: {type: string, description: '복제한 공연장 틀 ID. 배치본은 틀을 복제한 공연용 사본이고 편집은 그 사본에만 미친다(추천 적용 2026-10-14, ADR-0063)'}
        priceTiers:
          type: array
          maxItems: 16
          description: '가격 등급(보이는 순서). 보내지 않으면 지금 가격 등급을 그대로 쓴다. 빈 목록은 등급 없이 저장한다(좌석이 있으면 TIER_UNKNOWN, 불러오기가 준 빈 목록을 그대로 다시 보낼 수 있다, 추천 적용 2026-11-10 리뷰). tierId는 겹치지 않는다(ADR-0260 결정 4)'
          items: {$ref: '#/components/schemas/SeatMapPriceTierInput'}
        canvas:
          type: object
          additionalProperties: false
          required: [width, height]
          properties:
            width: {type: integer}
            height: {type: integer}
        stage:
          type: array
          description: 무대·통로 등 판매하지 않는 도형
          items: {$ref: '#/components/schemas/SeatMapShapeInput'}
        sections:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [sectionId, name, shape]
            properties:
              sectionId: {type: string, description: '구역 ID. 영문·숫자·_·- 1~64자(판 해석 키 조각 꼴)이고 아니면 422 SECTION_ID_INVALID다(추천 적용 2026-11-10, ADR-0260 결정 2)'}
              name: {type: string}
              level: {type: string}
              shape: {$ref: '#/components/schemas/SeatMapShapeInput'}
              label:
                type: object
                additionalProperties: false
                description: 구역 라벨 위치
                properties:
                  x: {type: integer}
                  y: {type: integer}
              tierId: {type: string, description: 구역 기본 등급. 회차 판매 등급은 좌석의 tierId}
              gateZone: {type: string}
              seatIndexRange:
                type: object
                additionalProperties: false
                description: 이 구역 좌석의 비트맵 인덱스 범위. 브라우저가 스냅샷에서 구역별 남은 좌석을 센다(추천 적용 2026-10-14, ADR-0063)
                properties:
                  from: {type: integer}
                  to: {type: integer}
              fillRule: {$ref: '#/components/schemas/SeatFillRuleInput', description: 파트너 에디터 전용 좌석 채우기 규칙(section.editor_meta). 팬 좌석맵 파일에는 싣지 않는다(ADR-0066)}
              seats:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [seatId, row, number, x, y]
                  properties:
                    seatId: {type: string, description: '좌석 ID. 이 배치본에 이미 있는 소문자 UUID면 그대로 두고, 아니면(가져오기의 자리표시 등) 서버가 새 UUIDv7을 매긴다. 응답은 서버 ID다(추천 적용 2026-11-10, ADR-0260 결정 2)'}
                    index: {type: integer, description: 비트맵 인덱스}
                    row: {type: string}
                    number: {type: integer}
                    x: {type: integer}
                    y: {type: integer}
                    tierId: {type: string}
                    wheelchair: {type: boolean}
                    unavailable: {type: boolean, description: 판매 제외}
                    gateZone: {type: string}
    SeatMapPriceTier:
      type: object
      description: "가격 등급 하나(docs/data.md price_tier, ADR-0260 결정 2)"
      required: [tierId, name, price]
      properties:
        tierId: { type: string, description: "등급 ID(좌석·구역의 tierId, 대기 상태 파일 soldOutTiers와 같은 값)" }
        name: { type: string, description: "등급 이름(예: R석)" }
        price: { type: integer, description: "정가(원)" }
    SeatMapPriceTierInput:
      type: object
      additionalProperties: false
      description: SeatMapPriceTier의 요청용(정의 밖 칸을 400으로 거절한다)
      required: [tierId, name, price]
      properties:
        tierId: {type: string, minLength: 1, maxLength: 30, description: 등급 ID. 제어 문자 없음}
        name: {type: string, minLength: 1, maxLength: 30, description: 등급 이름}
        price: {type: integer, minimum: 1, maximum: 10000000, description: '정가(원) 1~10,000,000 [가정]'}
    SeatMapColumns:
      type: object
      description: "팬 화면 좌석맵 파일(seatmap-layouts/{layoutVersion}.json, 2026-11-04 BUILD_ORDER HOT-110). SeatMapLayout과 같은 두 층(배치 층: 캔버스·무대·구역 도형·라벨 위치·등급, 좌석 층: 좌석 ID·행·번호·좌표·등급·플래그)을 구역마다 열 단위 배열로 낸다. 좌석 색인은 구역 순서대로 이어 붙인 위치(seatIndexRange.from부터)이고 스냅샷 비트맵의 차례·델타 seatOffset과 같다(seat-hold §2). 에디터 전용 fillRule·gateZone은 싣지 않는다. 브라우저는 @peaket/seatmap의 decodeLayout으로 검사하고 형식 배열로 푼다"
      required: [format, layoutVersion, canvas, stage, tiers, seatCount, sections]
      properties:
        format: { type: string, const: peaket.seatmap.columns.v1 }
        layoutVersion: { type: integer, minimum: 1, description: "파트너가 저장해 게시한 배치 판(1부터. 0은 게시하지 않는 저장 전 초안이다)" }
        canvas: { type: object, required: [minX, minY, width, height], description: "공연장 캔버스(cm). 한 변 100,000(1km) [가정] 이하이고 무대·구역 도형과 좌석 좌표는 모두 이 안에 있다(브라우저 격자 색인이 끝없이 커지지 않게)", properties: { minX: { type: integer }, minY: { type: integer }, width: { type: integer, minimum: 1, maximum: 100000 }, height: { type: integer, minimum: 1, maximum: 100000 } } }
        stage: { type: array, items: { $ref: '#/components/schemas/SeatMapShape' } }
        tiers: { type: array, minItems: 1, maxItems: 16, items: { type: string }, description: "등급 ID 목록(보통 가격이 높은 등급부터). 좌석 tier 열이 이 색인을 쓴다. 전체 배치의 구역 면 색(앞 셋이 heat.3·heat.2·heat.1, d2 CMP-024)은 화면이 회차 가격표로 넘긴 등급 차례를 쓰고, 넘기지 않으면 이 차례를 쓴다" }
        seatCount: { type: integer, minimum: 1, maximum: 1000000, description: "가장 큰 seatIndexRange.to + 1" }
        sections:
          type: array
          minItems: 1
          maxItems: 65535
          items:
            type: object
            required: [sectionId, name, shape, label, seatIndexRange, seats]
            properties:
              sectionId: { type: string }
              name: { type: string }
              shape: { $ref: '#/components/schemas/SeatMapShape' }
              label: { type: object, required: [x, y], properties: { x: { type: integer }, y: { type: integer } } }
              seatIndexRange: { type: object, required: [from, to], properties: { from: { type: integer, minimum: 0 }, to: { type: integer, minimum: 0 } }, description: "구역의 좌석 색인 범위(끝 포함). 앞 구역 바로 다음부터 빈틈 없이 이어진다. 구역마다 65,536석 이하(델타 seatOffset이 u16)" }
              seats:
                type: object
                required: [seatId, row, number, x, y, tier, flags]
                description: "열마다 길이가 그 구역 좌석 수(to − from + 1)와 같다"
                properties:
                  seatId: { type: array, items: { type: string }, description: "홀드 요청에 쓰는 좌석 ID" }
                  row: { type: array, items: { type: string } }
                  number: { type: array, items: { type: string } }
                  x: { type: array, items: { type: integer }, description: "공연장 좌표(1단위 = 1cm [가정])" }
                  y: { type: array, items: { type: integer } }
                  tier: { type: array, items: { type: integer, minimum: 0, maximum: 15 }, description: "tiers 색인" }
                  flags: { type: array, items: { type: integer, minimum: 0, maximum: 15 }, description: "값 1 휠체어석, 값 2 판매 제외(둘 다면 3. 맨 아래 비트부터 0번·1번 비트)" }
    SeatMapImportResult:
      type: object
      description: "좌석맵 가져오기 검증 결과. 오류가 하나라도 있으면 반영하지 않는다(FR-023)"
      properties:
        ok: { type: boolean }
        layout: { $ref: '#/components/schemas/SeatMapLayout', description: "ok일 때 에디터에 올릴 배치. 저장은 PUT /v1/partner/productions/{productionId}/seatmap" }
        errors: { type: array, items: { type: object, properties: { line: { type: integer }, field: { type: string }, code: { type: string } } } }
        warnings: { type: array, description: "업무 경고(휠체어석 W1~W3, 좌석 겹침, 도형 밖 좌석)와 SVG에서 읽지 않고 넘긴 요소·속성(SVG_IGNORED). 모두 막지 않는다", items: { $ref: '#/components/schemas/SeatMapWarning' } }
    SeatMapWarning: { type: object, description: "좌석맵 경고 하나. 휠체어석 기준 경고 W1~W3(FR-023, docs/design/d5 §6.5), 좌석 겹침 SEAT_OVERLAP(좌석 중심 사이가 좌석 간격의 절반보다 가까움 [가정], ADR-0066), 구역 도형 밖 좌석 SEAT_OUTSIDE_SHAPE(좌석 중심이 그 구역 다각형 밖, ADR-0063, 추천 적용 2026-11-10, ADR-0264 결정 15), SVG에서 읽지 않고 넘긴 요소·속성 SVG_IGNORED(script·foreignObject·image·use·style·바깥 href 등. 가져오기만, seatmap-worker 응답의 ignored를 옮긴다, docs/features/seat-hold.md §10, 추천 적용 2026-10-30). 모두 막지 않는다", properties: { code: { type: string, enum: [W1, W2, W3, SEAT_OVERLAP, SEAT_OUTSIDE_SHAPE, SVG_IGNORED] }, seatIds: { type: array, items: { type: string }, description: "걸린 좌석 ID(경고마다 100개까지 [가정], ADR-0264 결정 15)" }, seatCount: { type: integer, description: "걸린 좌석 수(seatIds가 잘렸어도 전체 수, 추천 적용 2026-11-10, ADR-0264 결정 15)" }, ignored: { type: array, items: { type: string }, description: "SVG_IGNORED에만. 읽지 않고 넘긴 요소·속성 이름(값과 바깥 주소는 싣지 않는다)" } } }
    SeatFillRule:
      type: object
      description: "구역 좌석 채우기 규칙(SCR-022 ② 좌석 채우기, 소유자 요청 2026-10-19, 세부는 추천 적용 2026-10-19, ADR-0066). 에디터(브라우저)가 이 규칙으로 도형 안에 좌석 좌표를 계산하고 서버는 저장 때 다시 검사한다. 기본값은 모두 [가정]"
      required: [method]
      properties:
        method: { type: string, enum: [COUNT, GRID], description: "COUNT 좌석 수로 채우기, GRID 행 수 × 행마다 좌석 수" }
        targetCount: { type: integer, minimum: 1, description: "COUNT일 때 목표 좌석 수(예 600)" }
        rows: { type: integer, minimum: 1, description: "GRID일 때 행 수(예 20)" }
        seatsPerRow: { type: integer, minimum: 1, description: "GRID일 때 행마다 좌석 수(예 30)" }
        rowShape: { type: string, enum: [STRAIGHT, CURVED], description: "직선, 무대를 향한 곡선" }
        seatSpacingCm: { type: integer, minimum: 1, description: "좌석 간격(옆), 기본 50 [가정]" }
        rowSpacingCm: { type: integer, minimum: 1, description: "행 간격(앞뒤), 기본 90 [가정]" }
        aisles: { type: integer, minimum: 0, description: "세로 통로 수, 기본 2 [가정]" }
        aisleWidthCm: { type: integer, minimum: 1, description: "통로 폭, 기본 120 [가정]" }
        rowLabel: { type: string, enum: [NUMBER, ALPHA], description: "행 이름 1열·2열 또는 A·B·C" }
        firstNumber: { type: integer, minimum: 0, description: "첫 번호, 기본 1 [가정]" }
        numberFrom: { type: string, enum: [LEFT, RIGHT], description: "번호 방향(무대를 보고 왼쪽부터·오른쪽부터)" }
    SeatFillRuleInput:
      type: object
      additionalProperties: false
      description: SeatFillRule의 요청용(정의 밖 칸을 400으로 거절한다). 칸의 뜻은 원래 스키마(SeatFillRule)와 같고 응답은 SeatFillRule(열림)다(guidelines §1 '요청은 닫고 응답은 연다', BAS-040).
      required: [method]
      properties:
        method:
          type: string
          enum: [COUNT, GRID]
          description: COUNT 좌석 수로 채우기, GRID 행 수 × 행마다 좌석 수
        targetCount: {type: integer, minimum: 1, description: COUNT일 때 목표 좌석 수(예 600)}
        rows: {type: integer, minimum: 1, description: GRID일 때 행 수(예 20)}
        seatsPerRow: {type: integer, minimum: 1, description: GRID일 때 행마다 좌석 수(예 30)}
        rowShape:
          type: string
          enum: [STRAIGHT, CURVED]
          description: 직선, 무대를 향한 곡선
        seatSpacingCm: {type: integer, minimum: 1, description: '좌석 간격(옆), 기본 50 [가정]'}
        rowSpacingCm: {type: integer, minimum: 1, description: '행 간격(앞뒤), 기본 90 [가정]'}
        aisles: {type: integer, minimum: 0, description: '세로 통로 수, 기본 2 [가정]'}
        aisleWidthCm: {type: integer, minimum: 1, description: '통로 폭, 기본 120 [가정]'}
        rowLabel:
          type: string
          enum: [NUMBER, ALPHA]
          description: 행 이름 1열·2열 또는 A·B·C
        firstNumber: {type: integer, minimum: 0, description: '첫 번호, 기본 1 [가정]'}
        numberFrom:
          type: string
          enum: [LEFT, RIGHT]
          description: 번호 방향(무대를 보고 왼쪽부터·오른쪽부터)
    SeatmapTemplateSummary:
      type: object
      description: "좌석맵 템플릿 카드(템플릿 고르기, 소유자 요청 2026-10-19, 목록은 추천 적용 2026-10-19, ADR-0066). 흔한 공연장 모양을 본뜬 출발점이고 실제 공연장의 배치도가 아니다"
      properties:
        templateId: { type: string, description: "venue kind TEMPLATE의 ID" }
        code: { type: string, enum: [ARENA-END, ARENA-THRUST, ARENA-CENTER, DOME, STADIUM, THEATER-L, THEATER-M, THEATER-S, HALL, FLAT] }
        name: { type: string, description: "예 '실내 아레나 · 엔드 스테이지'. 특정 공연장 이름을 쓰지 않는다" }
        family: { type: string, enum: [ARENA, DOME, STADIUM, THEATER, HALL, FLAT] }
        defaultCapacity: { type: integer, description: "기본 좌석 수 [가정](예 약 12,000). 파트너가 목표 좌석 수로 바꾼다" }
        levelCount: { type: integer, description: "층 수" }
        sectionCount: { type: integer, description: "구역 수" }
        summary: { type: string, description: "한 줄 설명(구성)" }
        variants:
          type: array
          description: "고를 수 있는 것(돌출 길이, 그라운드 구역 수, 오케스트라 피트 있음·없음, 합창석 판매 여부, 블록 수). 없으면 빈 배열"
          items: { type: object, required: [key, label, kind], properties: { key: { type: string }, label: { type: string }, kind: { type: string, enum: [CHOICE, NUMBER, BOOLEAN] }, options: { type: array, items: { type: string }, description: "CHOICE일 때" }, min: { type: integer }, max: { type: integer }, defaultValue: { description: "기본값(kind에 맞는 형)" } } }
        schematicUrl: { type: string, format: uri, description: "개략도 SVG(템플릿과 함께 배포한 정적 파일)" }
        version: { type: integer, description: "템플릿 판" }
    SeatmapTemplate:
      description: "좌석맵 템플릿 하나(도형·구역별 채우기 규칙·등급 기본값, ADR-0066). 좌석 좌표는 없다(에디터가 채우기 규칙으로 계산)"
      allOf:
        - $ref: '#/components/schemas/SeatmapTemplateSummary'
        - type: object
          properties:
            layout: { $ref: '#/components/schemas/SeatMapLayout', description: "캔버스·무대·구역 도형. 구역마다 fillRule(기본 채우기 규칙)이 있고 tierId는 등급 기본값 안(R·S·A)이며 seats는 비어 있다" }
    AttendeeExport: { type: object, description: "예매자 명단 다운로드 기록(SCR-027 [다운로드 이력], 추천 적용 2026-10-19, ADR-0066). 내려받은 사람은 표시 이름과 역할만 싣고 이메일·계정 ID는 싣지 않는다", properties: { exportId: { type: string }, exportedAt: { type: string, format: date-time }, actorDisplayName: { type: string }, actorRole: { type: string, description: "내려받을 때의 역할(지금은 partner_admin만 내려받는다)" }, reason: { type: string }, count: { type: integer, description: "건수" }, format: { type: string, enum: [CSV, XLSX, PDF] }, result: { type: string, enum: [COMPLETED, FAILED] } } }
    AttendeeExportPage: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/AttendeeExport' } }, nextCursor: { type: [string, 'null'] } } }
    SellerChangeRequest:
      type: object
      additionalProperties: false
      description: "판매자 정보 변경 요청(파트너 관리자, 추천 적용 2026-10-19, ADR-0066). 근거 서류는 참조값만 받고 파일은 받지 않는다"
      required: [changes]
      properties:
        changes: { type: array, minItems: 1, maxItems: 7, items: { type: object, additionalProperties: false, required: [field, newValue], properties: { field: { type: string, enum: [legalName, representative, address, phone, email, businessRegNo, mailOrderReportNo] }, newValue: { type: string, minLength: 1 } } } }
        evidenceRef: { type: string, description: "근거 서류 참조(예 서류 종류와 발급 번호). 파일은 받지 않는다" }
    SellerChangeRequestState: { type: object, properties: { requestId: { type: string }, status: { type: string, enum: [IN_REVIEW, APPLIED, REJECTED] }, fields: { type: array, items: { type: string } }, requestedAt: { type: string, format: date-time }, identityReviewRequired: { type: boolean, description: "상호(legalName)나 대표자(representative)를 바꾸면 true. PEAKET 운영자가 판매자 정보를 다시 확인한다(판매자 정보 재승인, POL-039, docs/planning/03 §2.14). 공연의 판매 재승인은 아니며 확인이 끝날 때까지 지금 정보가 보인다(ADR-0066 결정 12)" } } }
    SellerProfile: { type: object, description: "파트너 판매자 정보(SCR-020 [판매자 정보], FR-052·FR-053, POL-037, ADR-0066). 공연 상세·결제 직전·예매 확인서에 판매자 정보로 보이는 값(전자상거래법 §20②)", properties: { seller: { $ref: '#/components/schemas/SellerInfo' }, verifiedAt: { type: string, format: date-time, description: "마지막 확인(PEAKET 판매 승인에 쓰인 값)" }, pendingChange: { oneOf: [{ $ref: '#/components/schemas/SellerChangeRequestState' }, { type: 'null' }], description: "검토 중인 변경 요청. 없으면 null" } } }
    VerificationStart:
      type: object
      description: "본인확인 시작 응답(SCR-006 본인확인 흐름, 소유자 결정 2026-10-14, ADR-0063)"
      properties:
        verificationId: { type: string }
        window: { type: object, description: "본인확인기관 창 값. 브라우저는 버튼을 누른 동작 안에서 미리 연 창에 이 양식을 제출한다. 창이 막혔거나 mode가 REDIRECT면 지금 창에서 제출한다", properties: { url: { type: string, format: uri }, method: { type: string, enum: [GET, POST] }, fields: { type: object, additionalProperties: { type: string } }, mode: { type: string, enum: [POPUP, REDIRECT] } } }
        expiresAt: { type: string, format: date-time }
    LinkedProvider:
      type: object
      description: "계정에 연결된 로그인 수단 하나(GET /v1/identity/providers, docs/features/identity.md §8 '탈퇴 화면 연결', 추천 적용 2026-11-04, BUILD_ORDER BOT-036). 화면은 재인증할 제공자를 이것으로 고른다"
      required: [provider, linkedAt, lastLoginAt]
      properties:
        provider: { type: string, enum: [kakao, naver, google] }
        linkedAt: { type: string, format: date-time }
        lastLoginAt: { type: [string, 'null'], format: date-time, description: "그 제공자로 마지막 로그인한 시각. 아직 기록하지 않아 늘 null이다(제공자별 로그인 시각은 계정 연결·병합 단계 BOT-040이 남긴다)" }
    FanDeviceSession:
      type: object
      description: "로그인한 기기 한 줄(GET /v1/identity/sessions, 추천 적용 2026-11-05, ADR-0209, BUILD_ORDER BOT-044). 같은 기기의 살아 있는 세션을 묶은 것이다. 기기 가명·User-Agent 원문은 싣지 않는다"
      required: [sessionId, deviceName, lastActiveAt, current, otherSessions]
      properties:
        sessionId: { type: string, format: uuid, description: "대표 세션. 지금 세션이 들어 있으면 지금 세션, 아니면 마지막 활동이 가장 늦은 세션이다. 원격 로그아웃(DELETE /v1/identity/sessions/{sessionId})에 쓴다" }
        deviceName: { type: [string, 'null'], maxLength: 40, description: "화면용 기기 이름 '브라우저 · 운영체제'(예: 'Chrome · Windows'). 로그인 때 identity가 User-Agent에서 정해진 낱말만 뽑는다(docs/features/identity.md §8 '로그인한 기기와 다른 세션 끝내기의 첫 구현'). 모르면 null이고 화면은 '알 수 없는 기기'로 보인다" }
        lastActiveAt: { type: string, format: date-time, description: "그 기기 세션들의 마지막 활동(로그인·토큰 갱신 시각 가운데 가장 늦은 값). 실제 활동과 최대 15분(액세스 토큰 수명) 차이 난다" }
        current: { type: boolean, description: "이 요청의 세션이 들어 있다(지금 이 기기). 이 줄에는 로그아웃 버튼 대신 '지금 이 기기'를 보인다" }
        otherSessions: { type: integer, minimum: 0, description: "그 줄에서 대표 세션 말고 살아 있는 세션 수(같은 기기의 다른 로그인. 같은 브라우저에서 다시 로그인하면 앞 세션이 남는다). 지금 이 기기 줄에서 0보다 크면 화면이 [이 기기의 다른 로그인 끝내기]를 보인다(DELETE에 그 줄의 sessionId를 보낸다, 새 맥락 리뷰 중간 1)" }
    FanAccountSummary:
      type: object
      description: "로그인한 팬의 계정 요약(GET /v1/identity/me, 추천 적용 2026-11-05, ADR-0202). 화면이 셸 머리와 예매 버튼을 고르는 데 필요한 값만 둔다"
      required: [nickname, signupCompleted, verified, hasStaffAssignment]
      properties:
        nickname: { type: [string, 'null'], maxLength: 64, description: "닉네임. 가입 완료 화면(SCR-005)을 마치기 전이면 null(길이는 가입 마무리 입력과 같다, ADR-0203 결정 2)" }
        signupCompleted: { type: boolean, description: "만 14세 이상 확인과 필수 동의(TERMS·PRIVACY_REQUIRED)를 마쳤다(SCR-005, identity §2)" }
        verified: { type: boolean, description: "휴대폰 본인확인 기록이 있다. 액세스 토큰의 ticket:buy와 같은 출처다(identity §5)" }
        hasStaffAssignment: { type: boolean, description: "지금 ASSIGNED인 현장 스태프 배정이 있다(계정 메뉴의 '현장 근무', SCR-061)" }
    SignupCompletionInput:
      type: object
      additionalProperties: false
      description: "가입 마무리 본문(SCR-005, ADR-0203 결정 1). 동의는 화면이 미리 켜 두지 않는다(d1 §3)"
      required: [ageOver14, consents, nickname]
      properties:
        ageOver14: { type: boolean, const: true, description: "만 14세 이상 자기 확인(생년월일은 받지 않는다, ADR-0062)" }
        consents:
          type: object
          additionalProperties: false
          required: [terms, privacy, marketing, phone]
          properties:
            terms: { type: boolean, const: true, description: "이용약관(TERMS)" }
            privacy: { type: boolean, const: true, description: "개인정보 수집·이용(PRIVACY_REQUIRED)" }
            marketing: { type: boolean, description: "마케팅 알림(MARKETING, 선택)" }
            phone: { type: boolean, description: "휴대폰 번호 수집(PRIVACY_PHONE, 선택)" }
        nickname: { type: string, minLength: 1, maxLength: 64, description: "닉네임(규칙은 ADR-0203 결정 2, 서버가 다시 본다)" }
        phone: { type: string, pattern: '^(010[0-9]{8}|01[16789][0-9]{7,8})$', description: "휴대폰 번호(숫자만, 010은 11자리). consents.phone이 true일 때만" }
    NicknameCheckResult:
      type: object
      description: "닉네임 확인 결과(ADR-0203 결정 3)"
      required: [available]
      properties:
        available: { type: boolean }
        reason: { type: string, enum: [taken, invalid], description: "쓸 수 없는 까닭(available이 false일 때만)" }
    VerificationResult:
      type: object
      description: "본인확인 결과. 부르는 화면이 결과 대화상자로 보인다(docs/design/d5 §5.6 상태 표)"
      properties:
        verificationId: { type: string }
        purpose: { type: string, enum: [FIRST, REVERIFY, BOOTH, MINOR_CONTRACT] }
        status: { type: string, enum: [PENDING, VERIFIED, CANCELLED, FAILED, PROVIDER_DOWN, DUPLICATE_ACCOUNT, UNDER_14, BOOTH_MISMATCH] }
        next: { type: string, description: "결과 대화상자를 띄울 같은 출처 경로" }
        resultToken: { type: string, description: "BOOTH(reverificationToken)·MINOR_CONTRACT(verificationResultToken) 목적으로 VERIFIED일 때만" }
        restrictedUntil: { type: [string, 'null'], format: date-time, description: "FIRST·REVERIFY로 VERIFIED일 때, 같은 연계정보의 부정 예매 이용 제한이 이어진 계정이면 그 제한의 끝 시각. 그때까지 토큰에 구매 권한 ticket:buy를 싣지 않는다(docs/features/identity.md §8, POL-046 ⑥, 추천 적용 2026-10-31, ADR-0171). 아니면 null" }
    SubscriptionState: { type: object, description: "회차별 알림 신청 상태(추천 적용 2026-10-14, ADR-0063). 취소표 알림의 끝남 칸은 SCR-054 '신청 끝'을 그린다(추천 적용 2026-10-30, docs/features/notify.md §3.2)", properties: { eventId: { type: string }, open: { type: boolean, description: "오픈 알림 신청" }, cancellation: { type: boolean, description: "취소표 알림 신청(끝난 신청도 true, 상태는 cancellationStatus)" }, nightPush: { type: boolean }, cancellationStatus: { type: [string, 'null'], enum: [ACTIVE, ENDED, null], description: "취소표 알림 신청이 없으면 null" }, endReason: { type: [string, 'null'], enum: [SENT_MAX, BOOKED, SALE_ENDED, null], description: "SENT_MAX는 5번 [가정] 보냄, BOOKED는 그 회차 예매, SALE_ENDED는 판매 종료. SALE_ENDED면 화면에 [다시 신청]을 보이지 않는다" }, sentCount: { type: integer, minimum: 0, description: "취소표 알림을 보낸 횟수" } } }
    PushSubscriptionCreate: { type: object, additionalProperties: false, required: [endpoint, keys], description: "브라우저 PushSubscription.toJSON()의 값(추천 적용 2026-10-30, docs/features/notify.md §3.4)", properties: { endpoint: { type: string, format: uri, maxLength: 1024, description: "https, 포트 443, 푸시 서비스 호스트 허용 목록 안. 경로·쿼리에 넣지 않고 본문으로만 받는다" }, keys: { type: object, additionalProperties: false, required: [p256dh, auth], properties: { p256dh: { type: string, description: "base64url, 풀면 65바이트 비압축 P-256 점" }, auth: { type: string, description: "base64url, 풀면 16바이트" } } }, expirationTime: { type: [integer, 'null'], description: "밀리초 유닉스 시각, 없으면 null" } } }
    PushSubscriptionRegistered: { type: object, properties: { subscriptionKey: { type: string, description: "SHA-256(endpoint)의 채움 없는 base64url(43자). 해제 경로의 ID. 브라우저가 같은 값을 계산할 수 있어 저장하지 않아도 된다" }, service: { type: string, enum: [FCM, MOZILLA, APPLE, WNS] } } }
    WebhookEndpoint: { type: object, description: "파트너 웹훅 엔드포인트(추천 적용 2026-10-30, docs/features/notify.md §9). 서명 비밀 원문은 싣지 않는다", properties: { endpointId: { type: string }, url: { type: string, format: uri }, eventTypes: { type: array, items: { type: string } }, status: { type: string, enum: [ACTIVE, DISABLED] }, disabledReason: { type: [string, 'null'], enum: [PARTNER, FAILING, null] }, secretIssuedAt: { type: string, format: date-time }, previousSecretValidUntil: { type: [string, 'null'], format: date-time, description: "비밀을 바꾼 뒤 옛 비밀 서명도 붙이는 끝 시각(24시간)" }, version: { type: integer } } }
    WebhookDelivery: { type: object, description: "파트너 웹훅 발송 원장 한 행(SCR-025 ③, ADR-0109). 상대 서버의 응답 본문은 저장하지 않는다", properties: { deliveryId: { type: string }, webhookId: { type: string, description: "webhook-id(사건 키, 다시 보내도 같다)" }, eventType: { type: string }, status: { type: string, enum: [PENDING, RETRYING, SUCCEEDED, DEAD] }, attemptCount: { type: integer }, lastHttpStatus: { type: [integer, 'null'] }, lastError: { type: [string, 'null'], description: "TIMEOUT·TLS·DNS_BLOCKED·REDIRECT 등 분류" }, nextAttemptAt: { type: [string, 'null'], format: date-time }, createdAt: { type: string, format: date-time }, finishedAt: { type: [string, 'null'], format: date-time } } }
    ProductionImage:
      type: object
      description: "공연 이미지(포스터 1장, 상세 0~10장, ADR-0062 결정 38). 서버가 다시 검사하고 메타데이터를 지운 파생본만 공개한다. 원본 파일 이름은 쓰지 않는다"
      properties:
        imageId: { type: string }
        kind: { type: string, enum: [POSTER, DETAIL] }
        alt: { type: string, description: "대체 텍스트(필수). 이미지에만 있는 정보는 공연 설명 글에도 적는다" }
        order: { type: integer, description: "상세 이미지 순서(0부터)" }
        width: { type: integer, description: "image-worker가 디코딩한 원본 폭(px)" }
        height: { type: integer }
        version: { type: integer, description: "고치기(PATCH)의 If-Match에 쓰는 판. 응답의 ETag와 같다(ADR-0257)" }
        url: { type: string, format: uri, description: "파생본 묶음의 기준 주소({이미지 출처}/production/{imageId}). 공연 상세의 posterUrl·detailImages[].url과 같은 규칙(ADR-0199 결정 4, ADR-0257)" }
        derivatives: { type: object, description: "파생본 주소 표. 키는 '{폭}.{avif|webp}'(폭 320·640·960·1280 [가정]의 여덟 개), 값은 {기준 주소}/{폭}.{형식}이다. JPEG 파생본은 만들지 않는다(catalog-review 3.2.1, ADR-0257)", additionalProperties: { type: string, format: uri } }
    CsCasePage: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/CsCase' } }, nextCursor: { type: [string, 'null'] } } }
    StaffAssignmentPage: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/StaffAssignment' } }, nextCursor: { type: [string, 'null'] } } }
    GateFlagPage: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/GateFlag' } }, nextCursor: { type: [string, 'null'] } } }
    SettlementStatementPage: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/SettlementStatement' } }, nextCursor: { type: [string, 'null'] } } }
    DecisionRecordPage: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/DecisionRecord' } }, nextCursor: { type: [string, 'null'] } } }
    PartnerWebhookEvent:
      type: object
      description: "파트너 웹훅 본문(Standard Webhooks 권고 형식 {type, timestamp, data}, thin, FR-025). 개인정보(이름·연락처·이메일)·계정 ID·좌석 번호·결제사 결제 참조는 싣지 않고 금액은 원 단위 정수다. 같은 type의 data 구조는 바꾸지 않고 깨지는 변경은 새 type으로 낸다. 순서는 보장하지 않으므로 받는 쪽은 timestamp와 상태로 판단하고 webhook-id로 중복을 거른다(추천 적용 2026-10-14, ADR-0062)"
      required: [type, timestamp, data]
      properties:
        type: { type: string, enum: [order.confirmed, order.cancelled, event.sold_out, event.cancelled, event.postponed, statement.notified, payout.completed, payout.failed], description: "<자원>.<과거형 동작>, 소문자와 _만" }
        timestamp: { type: string, format: date-time, description: "사건 시각(ISO 8601 UTC)" }
        data:
          description: "type별 필드. 아래 oneOf의 title이 type이다"
          oneOf:
            - { title: order.confirmed, description: "판매 확정. 결제가 확정되어 티켓을 발권했을 때(OrderEvent CONFIRMED)", type: object, required: [eventId, orderId, ticketCount, amount, tiers, confirmedAt], properties: { eventId: { type: string }, orderId: { type: string }, ticketCount: { type: integer }, amount: { type: integer }, tiers: { type: array, items: { type: object, properties: { tierId: { type: string }, count: { type: integer } } } }, confirmedAt: { type: string, format: date-time } } }
            - { title: order.cancelled, description: "예매 취소·환급. 예매 취소가 확정되어 환급을 시작할 때(입장 시작 뒤 접수한 취소는 입장 기록 확인 뒤, Cancellation REFUND_PENDING)", type: object, required: [eventId, orderId, ticketCount, refundAmount, cause, cancelledAt], properties: { eventId: { type: string }, orderId: { type: string }, ticketCount: { type: integer }, refundAmount: { type: integer }, cause: { type: string, enum: [FAN, EVENT_CANCELLATION, EVENT_POSTPONEMENT, OPERATOR] }, cancelledAt: { type: string, format: date-time } } }
            - { title: event.sold_out, description: "매진. 회차의 모든 좌석이 팔렸을 때(queue-admission §8)", type: object, required: [eventId, soldOutAt], properties: { eventId: { type: string }, soldOutAt: { type: string, format: date-time } } }
            - { title: event.cancelled, description: "회차 취소 확정(EventCancellationRequest APPROVED, CANCEL)", type: object, required: [eventId, fault, confirmedAt], properties: { eventId: { type: string }, fault: { type: string, enum: [ORGANIZER, FORCE_MAJEURE, CONTENT_CHANGE] }, confirmedAt: { type: string, format: date-time } } }
            - { title: event.postponed, description: "회차 연기 확정(EventCancellationRequest APPROVED, POSTPONE)", type: object, required: [eventId, newStartsAt, refundRequestDeadline, fault, confirmedAt], properties: { eventId: { type: string }, newStartsAt: { type: string, format: date-time }, refundRequestDeadline: { type: string, format: date-time }, fault: { type: string, enum: [ORGANIZER, FORCE_MAJEURE, CONTENT_CHANGE] }, confirmedAt: { type: string, format: date-time } } }
            - { title: statement.notified, description: "정산서 통지. 정산서를 계산해 알렸을 때, 이의 기간 시작(SettlementEvent STATEMENT_NOTIFIED)", type: object, required: [statementId, kind, pg, payoutAmount, disputeDueAt], if: { properties: { kind: { const: EVENT } } }, then: { required: [eventId] }, else: { required: [periodStart, periodEnd] }, properties: { statementId: { type: string }, kind: { type: string, enum: [EVENT, PRODUCT], description: "EVENT는 티켓 회차 정산서, PRODUCT는 굿즈·부가 상품 상품 정산서(추천 적용 2026-10-14, ADR-0062)" }, eventId: { type: string, description: "정산서의 eventId(회차). kind=EVENT일 때만 있다" }, pg: { type: string, enum: [TOSS, PORTONE] }, pgStore: { type: string, enum: [STANDARD, ESCROW], description: "토스페이먼츠 결제 상점(토스페이먼츠만)" }, periodStart: { type: string, format: date, description: "상품 정산서의 주 시작(KST)" }, periodEnd: { type: string, format: date, description: "상품 정산서의 주 끝(KST)" }, payoutAmount: { type: integer, format: int64 }, revision: { type: integer, description: "정산서 판본. 다시 계산해 새로 알린 판이면 2 이상이다(settlement §4.1, 추천 적용 2026-10-29)" }, supersedesId: { type: [string, 'null'], description: "새 판이 대신한 옛 판의 statementId. 이 값이 있으면 옛 판(SUPERSEDED)의 금액 대신 이 판을 쓴다. 첫 판은 null(추천 적용 2026-10-29)" }, disputeDueAt: { type: string, format: date-time } } }
            - { title: payout.completed, description: "지급 완료. 정산금이 정산 계좌로 지급되었을 때(SettlementEvent PAYOUT_COMPLETED)", type: object, required: [statementId, kind, pg, amount, paidAt], properties: { statementId: { type: string }, kind: { type: string, enum: [EVENT, PRODUCT], description: "정산서 종류(추천 적용 2026-10-14, ADR-0062)" }, pg: { type: string, enum: [TOSS, PORTONE] }, pgStore: { type: string, enum: [STANDARD, ESCROW], description: "토스페이먼츠만" }, amount: { type: integer, format: int64 }, paidAt: { type: string, format: date-time } } }
            - { title: payout.failed, description: "지급 실패. 지급이 실패해 계좌 확인이 필요할 때(SettlementEvent PAYOUT_FAILED)", type: object, required: [statementId, kind, pg, amount, failedAt], properties: { statementId: { type: string }, kind: { type: string, enum: [EVENT, PRODUCT], description: "정산서 종류(추천 적용 2026-10-14, ADR-0062)" }, pg: { type: string, enum: [TOSS, PORTONE] }, pgStore: { type: string, enum: [STANDARD, ESCROW], description: "토스페이먼츠만" }, amount: { type: integer, format: int64 }, failedAt: { type: string, format: date-time } } }
    OAuthError: { type: object, description: "RFC 6749 §5.2 오류 본문. 기기 승인 토큰 엔드포인트(POST /v1/scanner/token)의 400만 이 형식이고 그 밖의 오류는 Problem이다(guidelines §2)", required: [error], properties: { error: { type: string, description: "authorization_pending·slow_down·access_denied·expired_token(RFC 8628 §3.5), 그 밖은 RFC 6749 §5.2" }, error_description: { type: string } } }
    # BAS-043 fan 초안(ADR-0238)
    ShopPaymentStatus:
      type: object
      description: "굿즈 결제 결과(GET /v1/shop/orders/{orderId}/payment-status). 티켓 PaymentStatus와 같은 뜻의 칸이고 상태 값만 굿즈 상태도에 맞춘다(docs/planning/03 §2.13). UNKNOWN은 결제사 답을 아직 모르는 동안이다(결제 원장 상태). 재고 예약이 끝난 주문은 이 응답 대신 409 order-expired다"
      required: [status]
      properties:
        status: { type: string, enum: [ACCEPTED, AWAITING_DEPOSIT, PAID, FAILED, UNKNOWN] }
        stockReservedUntil: { type: [string, 'null'], format: date-time, description: "한정 재고 상품의 재고 예약이 끝나는 지금 시각(접수 뒤 승인 기한까지 늘어난 값). 한정 재고가 아니면 null" }
        virtualAccount:
          type: object
          description: "가상계좌 입금 안내(입금 대기일 때만). 입금처 번호라 구매자의 계좌가 아니다. 입금 확정·만료 뒤에는 칸이 없다(authz-matrix §4.1 '결제 상태', data.md payment.virtual_account_no)"
          properties:
            bank: { type: string }
            accountNumber: { type: string }
            dueAt: { type: string, format: date-time }
        reason: { type: string, description: "FAILED일 때 실패 범주(payment §4). 결제사 오류 원문은 싣지 않는다" }
        pg: { type: string, enum: [TOSS, PORTONE, SIMULATOR], description: "결제 접수에서 고정된 결제사(ADR-0044)" }
    OrderSummary:
      type: object
      description: "예매 주문 한 줄(SCR-055 목록). 공연명·등급 표시 값은 주문 때 복사한 값으로 답한다 [가정]"
      required: [orderId, bookingNumber, eventId, amount, status, createdAt]
      properties:
        orderId: { type: string }
        bookingNumber: { type: string, description: "예매번호 [가정] 날짜 8자리 + 일련번호 5자리(화면 예 2026101400123). 고객 문의의 orderRef와 같은 값. docs/data.md purchase_order에 칸이 아직 없다" }
        eventId: { type: string }
        eventTitle: { type: string, description: "공연명" }
        eventStartsAt: { type: string, format: date-time, description: "회차 시작" }
        tiers:
          type: array
          maxItems: 20
          description: "등급별 매수(예 R석 2매). 20개 상한은 [가정]"
          items: { type: object, properties: { tierName: { type: string }, quantity: { type: integer } } }
        amount: { type: integer, description: "결제 금액(원, 서버 계산)" }
        status: { type: string, enum: [CREATED, AUTHENTICATED, ACCEPTED, RESERVED, AWAITING_DEPOSIT, APPROVED, UNKNOWN, CONFIRMED, FAILED, COMPENSATED, PARTIALLY_REFUNDED, REFUNDED, EXPIRED], description: "Order.status와 같은 값. 목록에는 EXPIRED가 나오지 않고 단건에는 나올 수 있다" }
        issueDelayed: { type: boolean, description: "PaymentStatus.issueDelayed와 같은 뜻(결제 완료·티켓 발급 중, ADR-0106)" }
        failureReason: { type: [string, 'null'], description: "FAILED일 때 사유 코드(purchase_order.failure_reason). 입금 기한이 지나 끝난 주문도 FAILED이고(T17) 화면은 <주문 취소됨>을 보인다" }
        refundPending: { type: boolean, description: "환급을 보류 중인 취소가 있다(<환급 보류>)" }
        virtualAccount:
          type: [object, 'null']
          description: "입금 대기일 때 은행과 입금 기한만. 입금처 번호는 GET /v1/orders/{orderId}/payment-status로 읽는다"
          properties:
            bank: { type: string }
            dueAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    OrderSummaryPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/OrderSummary' } }
        nextCursor: { type: [string, 'null'] }
    OrderDetail:
      description: "예매 주문 상세(GET /v1/orders/{orderId}, 예매 확인서). 예매자 성명·휴대폰 번호는 화면이 쓰지 않아 싣지 않는다"
      allOf:
        - { $ref: '#/components/schemas/OrderSummary' }
        - type: object
          properties:
            placeName: { type: string }
            entryOpensAt: { type: [string, 'null'], format: date-time, description: "입장 시작" }
            seats:
              type: array
              maxItems: 20
              description: "좌석별 줄(order_item). ticketId는 발권 뒤에만 있다. 20개 상한은 [가정]"
              items:
                type: object
                properties:
                  seatLabel: { type: string }
                  tierName: { type: string }
                  unitPrice: { type: integer, description: "주문 때 가격(원)" }
                  gateZone: { type: [string, 'null'], description: "입장 게이트 구역" }
                  ticketId: { type: [string, 'null'] }
            payment:
              type: [object, 'null']
              description: "결제 수단 표시. 접수 전이면 null. 카드번호 전체는 어떤 칸에도 없다"
              properties:
                method: { type: string, description: "결제 수단 이름 코드 [가정]" }
                cardLast4: { type: [string, 'null'], pattern: '^[0-9]{4}$', description: "카드 끝 4자리(d5 §5.29). 카드가 아니면 null. docs/data.md payment에 칸이 아직 없다 [가정]" }
                pg: { type: string, enum: [TOSS, PORTONE, SIMULATOR] }
            cancellations:
              type: array
              description: "취소·환급 이력(order_cancellation)"
              items:
                type: object
                properties:
                  cancellationId: { type: string }
                  ticketId: { type: [string, 'null'] }
                  requestedAt: { type: string, format: date-time }
                  deductionAmount: { type: integer, description: "공제액(원)" }
                  refundAmount: { type: integer, description: "환급액(원)" }
                  refundDueAt: { type: [string, 'null'], format: date-time, description: "환급 예정일(3영업일)" }
                  status: { type: string, enum: [REQUESTED, REFUND_PENDING, REFUNDED, VOIDED] }
                  refundAccountRequired: { type: boolean, description: "환불 계좌를 기다리는 건(POST /v1/cancellations/{cancellationId}/account, SCR-060)" }
            compensation:
              oneOf:
                - { $ref: '#/components/schemas/Compensation' }
                - { type: 'null' }
              description: "배상 건(SCR-043으로 잇는다). 없으면 null"
            seller: { $ref: '#/components/schemas/SellerInfo', description: "판매자 정보(CMP-058 receipt, 전자상거래법 §20②)" }
    ShopOrderItemBrief:
      type: object
      description: "굿즈 주문 항목의 목록용 줄"
      required: [itemId, productId, name, quantity, status]
      properties:
        itemId: { type: string }
        productId: { type: string }
        name: { type: string, description: "주문 때 복사한 상품 이름(option_snapshot)" }
        quantity: { type: integer }
        status: { type: string, enum: [READY, SHIPPED, DELIVERED, PICKED_UP, LOCKED, RETURN_REQUESTED, RETURN_RECEIVED, DISPUTED, CANCELLED, REFUNDED], description: "merch_order_item.status(docs/planning/03 §2.13). 화면 배지는 수령 방식과 함께 고른다(READY는 택배 '배송 준비', 현장 '수령 대기', 부가 상품 '사용 가능')" }
    ShopOrderSummary:
      type: object
      description: "굿즈·부가 상품 주문 한 줄(SCR-055 목록)"
      required: [orderId, orderNumber, fulfillment, status, totalAmount, items, createdAt]
      properties:
        orderId: { type: string }
        orderNumber: { type: string, description: "주문번호 [가정] 예매번호와 같은 꼴. 고객 문의의 orderRef와 같은 값. docs/data.md merch_order에 칸이 아직 없다" }
        fulfillment: { type: string, enum: [DELIVERY, PICKUP, WALLET] }
        status: { type: string, enum: [CREATED, AWAITING_DEPOSIT, PAID, EXPIRED, FAILED], description: "merch_order.status(docs/planning/03 §2.13)" }
        paymentStore: { type: string, enum: [STANDARD, ESCROW], description: "결제 상점(merch_order.pg_store)" }
        escrow: { type: boolean, description: "구매자가 결제대금예치를 골랐으면 true(결제 승인 뒤 정해진다). 화면의 <결제대금예치>" }
        totalAmount: { type: integer, description: "결제 금액(원, 상품 + 배송비). docs/data.md merch_order에 칸이 아직 없다" }
        items: { type: array, minItems: 1, maxItems: 20, items: { $ref: '#/components/schemas/ShopOrderItemBrief' } }
        pickupWindow:
          type: [object, 'null']
          description: "현장 수령이면 고른 시간대"
          properties:
            startsAt: { type: string, format: date-time }
            endsAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    ShopOrderSummaryPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ShopOrderSummary' } }
        nextCursor: { type: [string, 'null'] }
    ShopOrderItem:
      description: "굿즈 주문 항목의 상세 줄"
      allOf:
        - { $ref: '#/components/schemas/ShopOrderItemBrief' }
        - type: object
          properties:
            unitPrice: { type: integer, description: "주문 때 가격(원)" }
            options: { type: object, additionalProperties: { type: string }, description: "고른 옵션(옵션 이름 → 값)" }
            shipment:
              type: [object, 'null']
              description: "판매자가 등록한 배송 정보(읽기만). 송장 전이면 null"
              properties:
                carrier: { type: string, description: "택배사 코드 [가정](송장의 택배사)" }
                trackingNo: { type: string }
                deliveredAt: { type: [string, 'null'], format: date-time }
            pickedUpAt: { type: [string, 'null'], format: date-time }
            cancellable: { type: boolean, description: "지금 취소할 수 있다(READY이고 입장 시작 전). 화면 버튼의 기준(guidelines §11)이고 최종 판정은 서버다" }
            returnable: { type: boolean, description: "지금 반품을 요청할 수 있다" }
            returnDueAt: { type: [string, 'null'], format: date-time, description: "단순 변심 반품 기한(받은 날 + 7일)" }
            defectReturnDueAt: { type: [string, 'null'], format: date-time, description: "상품 이상·설명과 다름의 반품 기한(받은 날 + 3개월)" }
            returnReason: { type: [string, 'null'], enum: [CHANGE_OF_MIND, DEFECT_OR_MISMATCH, null] }
            returnTrackingNo: { type: [string, 'null'] }
    ShopOrderDetail:
      description: "굿즈·부가 상품 주문 상세(GET /v1/shop/orders/{orderId}). 본인 주문만이라 배송지 주소는 원문이고 받는 분 연락처는 화면이 번호를 쓰지 않아 가린 값만 준다"
      allOf:
        - { $ref: '#/components/schemas/ShopOrderSummary' }
        - type: object
          required: [items]
          properties:
            items: { type: array, minItems: 1, maxItems: 20, items: { $ref: '#/components/schemas/ShopOrderItem' } }
            shippingFee: { type: integer, description: "처음 배송비(원). 택배가 아니면 0. docs/data.md merch_order에 칸이 아직 없다" }
            stockReservedUntil: { type: [string, 'null'], format: date-time, description: "결제 전 주문의 재고 예약이 끝나는 시각(merch_order.stock_reserved_until, ADR-0107)" }
            purchaseConfirmedAt: { type: [string, 'null'], format: date-time, description: "구매 확정 시각. escrow가 true이고 이 값이 null이면 구매 확정 전이다. 결제사 상태에서 오고 3영업일 무선택이면 자동 확정이다(merch_order.purchase_confirmed_at)" }
            delivery:
              type: [object, 'null']
              description: "택배 주문의 배송지"
              properties:
                recipientName: { type: string }
                recipientPhoneMasked: { type: string, description: "가린 연락처 [가정] 예 010-****-1234" }
                address: { type: string, description: "우편번호·기본 주소·상세 주소(merch_order.delivery_address 한 칸)" }
            pickupVoucher:
              type: [object, 'null']
              description: "현장 수령 교환권(수령 전까지). 화면이 QR로 그린다. 값의 꼴과 수명은 wbs 7.1.1이 정한다 [가정]"
              properties:
                code: { type: string }
            returnPolicy:
              type: object
              description: "반품 대화상자 값(판매자가 정한 편도 금액과 주소, POL-016 §1.4)"
              properties:
                returnShippingFee: { type: integer, description: "단순 변심 반품 배송비(원)" }
                returnAddress: { type: string }
            refunds:
              type: array
              description: "취소·환급 이력. docs/data.md에 굿즈 환급 기록 표가 아직 없다 [가정]"
              items:
                type: object
                properties:
                  cancellationId: { type: string }
                  itemIds: { type: array, items: { type: string } }
                  refundAmount: { type: integer }
                  deductedShippingFee: { type: integer, description: "뺀 반품 배송비(원). 없으면 0" }
                  refundDueAt: { type: [string, 'null'], format: date-time }
                  status: { type: string, enum: [REQUESTED, REFUND_PENDING, REFUNDED, VOIDED] }
                  refundAccountRequired: { type: boolean, description: "가상계좌 결제의 환급에 계좌를 기다리는 건 [가정]" }
            seller: { $ref: '#/components/schemas/SellerInfo', description: "판매자 정보(CMP-058 receipt, 판매자는 상품을 등록한 파트너, POL-037)" }
    ShopOrderCancellationInput:
      type: object
      additionalProperties: false
      description: "굿즈·부가 상품 주문 취소 본문(POL-016 §1.4)"
      properties:
        itemIds: { type: array, minItems: 1, maxItems: 20, uniqueItems: true, items: { type: string, maxLength: 64 }, description: "취소할 항목. 없으면 READY 항목 전부" }
        refundAccount: { $ref: '#/components/schemas/RefundAccount', description: "가상계좌 결제일 때 필수. 저장하지 않고 결제사 취소 요청에 바로 넘긴다(POL-014). 보내면 X-Reauth-Token이 필수다" }
    ShopOrderReturnInput:
      type: object
      additionalProperties: false
      description: "반품 요청 본문(docs/design/d5 §5.29 반품 대화상자). 계좌는 받지 않는다(환급이 나중이라 저장해야 하는데 저장하지 않는다, POL-014)"
      required: [itemIds, reason]
      properties:
        itemIds: { type: array, minItems: 1, maxItems: 20, uniqueItems: true, items: { type: string, maxLength: 64 } }
        reason: { type: string, enum: [CHANGE_OF_MIND, DEFECT_OR_MISMATCH], description: "단순 변심, 상품 이상·설명과 다름" }
        returnTrackingNo: { type: string, maxLength: 64, description: "반품 송장(선택). 64자 상한은 [가정]" }
    TicketAddon:
      type: object
      description: "티켓에 연동해 산 부가 상품(월렛에 이용권으로 보인다, FR-014)"
      required: [itemId, productId, name, quantity, status]
      properties:
        orderId: { type: [string, 'null'], description: "이 부가 상품의 주문. 받은 티켓에서는 결제자의 주문이라 null이다 [가정](POL-017, Ticket.bookingNumber와 같은 규칙)" }
        itemId: { type: string }
        productId: { type: string }
        name: { type: string, description: "주문 때 복사한 상품 이름" }
        quantity: { type: integer }
        status: { type: string, enum: [READY, LOCKED, RETURN_REQUESTED, RETURN_RECEIVED, DISPUTED, CANCELLED, REFUNDED], description: "merch_order_item.status 가운데 부가 상품에 쓰는 값(READY '사용 가능', LOCKED '입장 시작, 취소 불가')" }
    TicketAddonPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/TicketAddon' } }
        nextCursor: { type: [string, 'null'] }
    ShopProductSummary:
      type: object
      description: "상품 한 줄(SCR-015 목록 카드). 개인 값은 싣지 않는다. 표시 가격은 화면이 price·shippingFee·fulfillments로 계산한다(d5 §5.15 ⑬)"
      required: [productId, type, name, price, fulfillments, sellerName, saleStatus]
      properties:
        productId: { type: string, format: uuid }
        type: { type: string, description: "product_type.code(MERCH·PARKING·VIP·FAST_LANE 등, 목록이 늘 수 있어 열거로 닫지 않는다)" }
        name: { type: string }
        imageUrl: { type: [string, 'null'], format: uri, description: "대표 사진. 파생본 묶음의 기준 주소 [가정](docs/data.md product에 칸이 없어 attributes에 둔다)" }
        imageAlt: { type: [string, 'null'] }
        price: { type: integer, description: "상품 가격(원)" }
        shippingFee: { type: [integer, 'null'], description: "편도 배송비(원). 택배를 받지 않으면 null" }
        fulfillments: { type: array, minItems: 1, uniqueItems: true, items: { type: string, enum: [DELIVERY, PICKUP, WALLET] }, description: "받을 수 있는 수령 방식" }
        sellerName: { type: string, description: "판매자 상호(POL-037)" }
        saleStatus: { type: string, enum: [UPCOMING, ON_SALE, SOLD_OUT, ENDED], description: "판매 기간과 재고로 계산한다(data.md product.status). HIDDEN·DRAFT는 나오지 않는다" }
        limitedQuantity: { type: [integer, 'null'], description: "한정 수량. 한정이 아니면 null" }
        remainingQuantity: { type: [integer, 'null'], description: "남은 수량(근사). 한정이 아니면 null. 결제 전 주문이 잡은 수량을 뺀 값이다" }
        perAccountLimit: { type: [integer, 'null'], description: "계정당 최대 수량(SCR-015 ⑦). attributes에 둔다 [가정]" }
        ticketHoldersOnly: { type: boolean, description: "티켓 보유자 전용 상품(d5 §5.15). attributes에 둔다 [가정]" }
        linkedEventId: { type: [string, 'null'], description: "티켓 연동 부가 상품의 연결 회차" }
        linkedEventStartsAt: { type: [string, 'null'], format: date-time, description: "연결 회차 시작(카드의 '10/25(일) 18:00 회차')" }
        queueRequired: { type: boolean, description: "인기 MD 오픈 상품. 참이면 대기열을 거쳐 주문하고 대기열 식별자는 productId다(GET·POST /v1/queues/{productId}/…, 주문은 입장 토큰 필요). attributes에 둔다 [가정]" }
    ShopProductPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ShopProductSummary' } }
        nextCursor: { type: [string, 'null'] }
    ShopProduct:
      description: "상품 상세(GET /v1/shop/products/{productId}, SCR-015). 응답은 닫지 않으므로 유형별 칸은 attributes에 더해진다(ADR-0101)"
      allOf:
        - { $ref: '#/components/schemas/ShopProductSummary' }
        - type: object
          properties:
            descriptionText: { type: [string, 'null'], description: "상품 설명 글" }
            schemaVersion: { type: integer, description: "유형 속성 스키마의 판(product.schema_version)" }
            attributes: { type: object, description: "유형마다 다른 속성(공개할 키만, ADR-0101). 화면이 유형 묶음의 설정으로 읽는다" }
            options:
              type: array
              maxItems: 10
              description: "고를 옵션(옵션 ▾). 주문 본문 MerchOrderItemInput.options의 이름과 값이다 [가정]"
              items:
                type: object
                properties:
                  name: { type: string }
                  values: { type: array, items: { type: string } }
            saleStartsAt: { type: [string, 'null'], format: date-time }
            saleEndsAt: { type: [string, 'null'], format: date-time }
            returnShippingFee: { type: [integer, 'null'], description: "단순 변심 반품 배송비(원, 편도)" }
            transferable: { type: boolean, description: "티켓과 함께 양도할 수 있다" }
            pickupSlots:
              type: array
              description: "현장 수령 시간대(data.md pickup_slot). 끝난 시간대는 뺀다. 고른 값이 주문의 pickupSlotId다"
              items:
                type: object
                required: [pickupSlotId, startsAt, endsAt]
                properties:
                  pickupSlotId: { type: string }
                  eventId: { type: string, description: "받는 회차" }
                  startsAt: { type: string, format: date-time }
                  endsAt: { type: string, format: date-time }
                  ticketHoldersOnly: { type: boolean, description: "티켓 소지자 전용(자격이 아니라 혜택, FR-015)" }
            seller: { $ref: '#/components/schemas/SellerInfo', description: "판매자 정보(CMP-058 detail)" }
    TransferOfferPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/TransferOffer' } }
        nextCursor: { type: [string, 'null'] }
    StaffAssignmentSelf:
      type: object
      description: "내 현장 배정 한 줄(SCR-061). 공연명·상호는 eventId로 회차 공개 요약에서 읽는다(DeviceApprovalView와 같다)"
      required: [assignmentId, eventId, role, status, validFrom, validUntil]
      properties:
        assignmentId: { type: string }
        eventId: { type: string }
        role: { type: string, enum: [gate_staff, gate_lead] }
        status: { type: string, enum: [ASSIGNED, REVOKED, ENDED] }
        validFrom: { type: string, format: date-time }
        validUntil: { type: string, format: date-time }
        activeScannerDeviceName: { type: [string, 'null'], description: "지금 로그인한 스캐너 이름(예 동문-03). 없으면 null" }
    StaffAssignmentSelfPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/StaffAssignmentSelf' } }
        nextCursor: { type: [string, 'null'] }
    IdentityConsent:
      type: object
      description: "동의 하나(data.md consent). 동의한 종류만 나온다"
      required: [kind, noticeVersion, agreedAt]
      properties:
        kind: { type: string, enum: [TERMS, PRIVACY_REQUIRED, PRIVACY_PHONE, MARKETING] }
        noticeVersion: { type: string, description: "동의한 고지 문안의 판" }
        channels: { type: [string, 'null'], description: "MARKETING만. 수신 채널(docs/planning/03 §1.2)" }
        agreedAt: { type: string, format: date-time }
    IdentityProfile:
      type: object
      description: "계정 설정의 프로필(GET /v1/identity/profile). 이메일과 연계정보는 싣지 않는다"
      required: [nickname, memberCode, verified, consents]
      properties:
        nickname: { type: [string, 'null'], maxLength: 64 }
        memberCode: { type: string, description: "내 회원 코드(양도 받는 사람 찾기에 쓴다, 예 PK7-42Q9)" }
        verified: { type: boolean }
        verifiedAt: { type: [string, 'null'], format: date-time, description: "휴대폰 본인확인 일시(SCR-017 ①)" }
        phoneMasked: { type: [string, 'null'], description: "가린 연락처 [가정] 예 010-****-1234. 없으면 null" }
        savedBookerName: { type: [string, 'null'], description: "저장된 예매자 성명" }
        savedBookerPhone: { type: [string, 'null'], description: "저장된 예매자 휴대폰 번호(숫자만). 예매 화면의 입력을 미리 채운다" }
        consents: { type: array, items: { $ref: '#/components/schemas/IdentityConsent' } }
    IdentityProfileUpdateInput:
      type: object
      additionalProperties: false
      minProperties: 1
      description: "프로필 고치기 본문(보낸 칸만 바꾼다)"
      properties:
        nickname: { type: string, minLength: 1, maxLength: 64, description: "닉네임(규칙은 ADR-0203 결정 2, 서버가 다시 본다)" }
        phone: { type: [string, 'null'], pattern: '^(010[0-9]{8}|01[16789][0-9]{7,8})$', description: "휴대폰 번호(숫자만, 010은 11자리). null이면 지운다. 재인증 필요" }
        savedBookerName: { type: [string, 'null'], minLength: 1, maxLength: 50, description: "저장된 예매자 성명. null이면 지운다. 50자 상한은 [가정]" }
        savedBookerPhone: { type: [string, 'null'], pattern: '^(010[0-9]{8}|01[16789][0-9]{7,8})$', description: "저장된 예매자 휴대폰 번호. null이면 지운다" }
    ScannerSessionSelf:
      type: object
      description: "내 스캐너 세션(휴대폰 쪽). 스태프 토큰과 기기 키는 싣지 않는다"
      required: [sessionId, deviceName, eventId, role, approvedAt, expiresAt]
      properties:
        sessionId: { type: string, format: uuid, description: "끝내기(DELETE /v1/identity/scanner-sessions/{sessionId})에 쓴다" }
        deviceName: { type: [string, 'null'], description: "스캐너 이름(예 동문-03). scanner_session에 칸이 없어 승인 때 복사하거나 기기 원장에서 읽는다 [가정]. 모르면 null" }
        eventId: { type: string, description: "배정 회차. 화면이 회차 공개 요약을 읽는다" }
        role: { type: string, enum: [gate_staff, gate_lead], description: "대리 승인이면 gate_staff" }
        proxy: { type: boolean, description: "책임자 대리 승인" }
        approvedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, description: "역할 유효 끝" }
        lastSeenAt: { type: [string, 'null'], format: date-time }
    Appeal:
      type: object
      description: "내가 낸 소명(data.md appeal). 본문, CS 건 ID, 담당자는 싣지 않는다"
      required: [appealId, kind, targetId, status, submittedAt]
      properties:
        appealId: { type: string }
        kind: { type: string, enum: [RESTRICTION, RECLAIM, FRAUD_CASE] }
        targetId: { type: string, description: "소명 제출의 targetId" }
        status: { type: string, enum: [SUBMITTED, DECIDED, INVALID], description: "INVALID는 대상 아님·기한 경과로 닫힘(화면 '소명 닫힘')" }
        result: { type: [string, 'null'], enum: [LIFTED, KEPT, NOT_RECLAIMED, RECLAIMED, ACCEPTED, REJECTED, null], description: "결정 결과(SCR-042 결과 배지)" }
        resultNote: { type: [string, 'null'], maxLength: 1000, description: "담당자가 적은 검토 사유(d5 §5.24 <제한 유지> + 사유). docs/data.md appeal에 칸이 아직 없다 [가정]. 1,000자 상한은 [가정]" }
        reasonCode: { type: [string, 'null'], description: "사유 범주 코드. RESTRICTION은 예매 제한 사본의 reasonCode, RECLAIM·FRAUD_CASE는 null [가정]" }
        dueAt: { type: [string, 'null'], format: date-time, description: "소명 기한. RESTRICTION만, RECLAIM·FRAUD_CASE는 null [가정]" }
        resultDueAt: { type: [string, 'null'], format: date-time, description: "결과 안내 예정일(예매 제한 소명 3영업일 [가정], d5 §5.24)" }
        submittedAt: { type: string, format: date-time }
        decidedAt: { type: [string, 'null'], format: date-time }
    AppealPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Appeal' } }
        nextCursor: { type: [string, 'null'] }
    CompensationPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Compensation' } }
        nextCursor: { type: [string, 'null'] }

    # BAS-043 partner 초안(ADR-0238)
    PartnerProductionSummary:
      type: object
      description: "파트너 공연 목록의 한 줄(SCR-062). 판매자 칸은 요청 테넌트로 정해져 싣지 않는다"
      required: [productionId, title, eventCount, saleReview, hasApprovalHistory]
      properties:
        productionId: { type: string, format: uuid }
        title: { type: string }
        eventCount: { type: integer, description: "회차 수(승인 뒤 더해 변경분에만 있는 회차 포함)" }
        saleReview: { type: string, enum: [DRAFT, SUBMITTED, APPROVED, REJECTED, SUSPENDED], description: "docs/data.md production.sale_review" }
        hasApprovalHistory: { type: boolean, description: "sale_approved_at이 있는지. SUBMITTED·REJECTED와 함께 재승인 대기·변경 반려를 가른다" }
        rejectionReason: { type: [string, 'null'], description: "REJECTED일 때 운영자가 적은 반려 사유" }
        suspensionReasonCode: { type: [string, 'null'], enum: [SELLER_IDENTITY, LEGAL_REQUEST, FRAUD_SUSPECTED, OTHER, null], description: "SUSPENDED일 때 사유 코드(ADR-0123 결정 2). 사유 원문은 싣지 않는다" }
        firstOpenAt: { type: string, format: date-time, description: "회차 가운데 가장 이른 오픈 시각" }
        saleStatus: { type: [string, 'null'], enum: [UPCOMING, ON_SALE, ALL_HELD, SOLD_OUT, ENDED, null], description: "공연 하나로 모은 판매 상태 [가정]. 판매 승인 전과 판매 중지 중에는 null" }
        pgPrimary: { type: [string, 'null'], enum: [TOSS, PORTONE, null], description: "표의 결제사 칸(xl 화면). 회차마다 다르면 첫 회차 값 [가정]" }
        payoutHoldReason: { type: [string, 'null'], enum: [KYC, ACCOUNT_CHANGE, BALANCE, ACCOUNT_MISMATCH, SALE_SUSPENDED, null], description: "표의 정산 칸(xl 화면). 지급 보류 중일 때만(settlement §6)" }
    PartnerProductionPage:
      type: object
