        eventId: {type: string}
        triggerRule: {type: string}
        triggerStage:
          type: string
          enum: [R0, R1, R2, R3]
          description: 결정 규칙이 걸린 마감 단계(동결 FROZEN은 계기가 아니다, docs/data.md decision_record)
        kind:
          type: string
          enum: [OPERATING_DEFAULT, PRODUCT, SALES_POLICY, BOT_POLICY, PARTNER_RECOMMENDATION, TARGET]
        summary: {type: string, maxLength: 4000}
        decision: {type: string, maxLength: 4000}
        evidenceStrength:
          type: string
          enum: [WEAK, MEDIUM, STRONG]
        expectedEffect:
