    ScanEvent:
      type: object
      description: "스캔 기록(offline-gate §6.5). 스태프 계정과 역할은 서버가 scannerSessionId로 정한다(클라이언트 값을 받지 않음)"
      required: [id, eventId, ticketId, scannerSessionId, direction, method, result, scannedAtDevice, knownSeq, deviceSeq]
      properties:
        id: { type: string, format: uuid, description: 클라이언트 생성 멱등 ID(UUIDv7) }
        eventId: { type: string }
        ticketId: { type: string }
        scannerSessionId: { type: string, description: "그 시각의 스캐너 세션. 서버가 유효 구간 밖이면 '세션 밖 기록'으로 표시" }
        direction: { type: string, enum: [IN, OUT] }
        method: { type: string, enum: [QR, OVERRIDE, VERIFY] }
        result: { type: string, enum: [PASS, REJECT, CHECK] }
        reason: { type: string, enum: [INVALID_QR, UNSUPPORTED_VERSION, UNKNOWN_TICKET, TICKET_CANCELLED, KEY_REVOKED, KEY_UNKNOWN, BAD_SIGNATURE, QR_EXPIRED, WRONG_ZONE, ALREADY_IN, NO_EXIT_RECORD, NO_ENTRY_RECORD, VERIFY_ONLY, OVERRIDE_CAMERA, OVERRIDE_PHONE_DEAD, OVERRIDE_KEY_UNKNOWN, OVERRIDE_BOOTH_OFFLINE, OVERRIDE_OTHER] }
        overrideNote: { type: string, maxLength: 100, description: "예외 통과 메모(개인정보 금지)" }
        gateZone: { type: string }
        keyId: { type: string }
        qrTimestamp: { type: string, format: date-time }
        scannedAtDevice: { type: string, format: date-time, description: 보정 시각 }
        clockOffsetMs: { type: integer }
        knownSeq: { type: integer, description: "판정 때 반영한 서버 변경 일련번호(두 칸 버전 벡터의 첫 칸)" }
        deviceSeq: { type: integer, description: "기기 일련번호(두 번째 칸)" }
    Command:
      type: object
      required: [type, reason]
      properties:
        type: { type: string, enum: [ADMISSION_TARGET, ADMISSION_PAUSE, KILL_SWITCH, BLOCK_ASN_IP, BOT_LEVEL, DEGRADED_MODE, LOBBY_BANNER, LOG_LEVEL, FEATURE_OFF, TAKEDOWN, AUTOMATION_STOP, PG_ASSIGN], description: "PG_ASSIGN은 명령 12 결제사 지정(온세일 윈도우 밖, ADR-0044). 결제사 전환은 DEGRADED_MODE의 결제 모드" }
        reason: { type: string, minLength: 1 }
        params: { type: object, description: "명령 유형별 값. KILL_SWITCH는 {scope: EVENT|PLATFORM, eventIds: [...]}이고 EVENT면 회차 1개 이상(추천 적용 2026-10-14, ADR-0062). BOT_LEVEL은 {level: RELAXED|STANDARD|AGGRESSIVE, reassessMode: OFF|SHADOW|ENFORCE}이고 강도와 대기 중 재평가 모드를 따로 고른다(asyncapi SettingChanged, 추천 적용 2026-10-20, ADR-0073)" }
    CommandState: { type: object, properties: { commandId: { type: string }, state: { type: string, enum: [DRAFTED, DRY_RUN, PENDING_APPROVAL, APPROVED, REJECTED, DISPATCHED, ACKED, FAILED, REVERT_PENDING, REVERTED, AUTO_EXPIRED], description: "REVERT_PENDING은 명령 3·11의 되돌리기 요청이 두 번째 승인을 기다리는 상태(10분, planning/03 §2.6, 추천 적용 2026-10-20, ADR-0073)" }, dryRun: { type: object }, approvals: { type: array, items: { type: string } }, ackedAt: { type: string, format: date-time }, expiresAt: { type: string, format: date-time, description: "만료 있는 명령(2·4·8)의 만료 시각. 명령 2는 연장하면 바뀐다(ADR-0062)" } } }
    BatchingResponse: { type: object, description: "202 BATCHING 본문(ADR-0041·0058)", properties: { resultPath: { type: string, description: "queue-files의 묶음 결과 파일 경로(/v1/queues/{eventId}/batch-results/{hashPrefix}.json)" }, resultAt: { type: string, format: date-time, description: 결과 공개 예정 시각 }, spreadSec: { type: integer, description: "분산 창(초, 8 [가정])" } } }
    RecipientLookupResult: { type: object, description: "양도 받는 사람 확인 결과(FR-013)", properties: { recipientRef: { type: string, description: "불투명 참조값(10분 [가정], 양도 요청 한 번에만 쓴다)" }, nicknameMasked: { type: string, description: 닉네임 일부 } } }
    Genre: { type: string, enum: [콘서트, 뮤지컬, 연극, 클래식, 페스티벌, 팬미팅, 기타], description: "장르 정본 목록. 파트너 등록(SCR-021 1단계)·검색 필터·홈 장르 바로가기·장르별 랭킹이 같은 값을 쓴다(추천 적용 2026-10-14, ADR-0063)" }
    EventCard:
      type: object
      description: "홈·검색·랭킹이 함께 쓰는 공연 카드. 공개 값만 싣는다(ADR-0063). 공연(회차 묶음) 엔터티가 정해지기 전에는 회차 단위다(design/d5 §1.6 31번)"
      properties:
        eventId: { type: string }
        title: { type: string }
        genre: { $ref: '#/components/schemas/Genre' }
        posterUrl: { type: string, format: uri, description: "포스터 파생본(ADR-0062 결정 38)" }
        posterAlt: { type: string }
        venueName: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        openAt: { type: string, format: date-time }
        saleStatus: { type: string, enum: [UPCOMING, ON_SALE, SOLD_OUT, ENDED], description: "ENDED는 이 공연의 모든 회차가 판매 종료(각 회차의 공연 시작 24시간 전)를 지남. 판매 중인 회차가 하나라도 있으면 ON_SALE이다(소유자 결정 2026-10-14, ADR-0064, POL-030)" }
        saleEndsAt: { type: string, format: date-time, description: "이 공연의 마지막 회차의 판매 종료(그 회차의 starts_at − 24시간, 새 데이터 칸 없이 계산, 추천 적용 2026-10-14, ADR-0064). '지금 판매 중'의 남은 판매 기간 표시와 정렬에 쓴다(POL-043)" }
        minPrice: { type: integer, description: "가장 낮은 등급의 티켓 가격(원). 예매 수수료를 받지 않으므로(POL-032) 이 값이 소비자가 내는 총금액이다(수수료 없음, 전자상거래법 §21의2①1호, 전자상거래 소비자보호 지침 12, 2026-10-14 원문 확인)" }
        badges: { type: array, description: "피켓 판매 정보 배지 코드. 문구는 화면이 정한다", items: { type: string, enum: [PREQUEUE_SHUFFLE, HYBRID, FIFO, PRESALE, AUTO_SEAT] } }
    HomeFeed:
      type: object
      description: "홈 피드(SCR-001, 소유자 결정 2026-10-14, ADR-0063). 개인 값(찜한 공연, 오픈 알림 상태)은 싣지 않는다. 비어 있는 섹션은 빈 배열이고 화면은 그 섹션만 숨긴다. 장르 바로가기는 정본 장르 목록이라 피드에 없고, 장르별 랭킹은 랭킹 파일로 따로 받는다"
      properties:
        banners:
          type: array
          description: "운영자가 [홈 구성]에서 정한 순서. 노출 기간 안이고 판매 승인된 공연만"
          items: { type: object, properties: { bannerId: { type: string }, eventId: { type: string }, imageUrl: { type: string, format: uri, description: "가로형 배너 파생본(1240×400 이상 [가정])" }, alt: { type: string }, displayUntil: { type: string, format: date-time } } }
        upcoming: { type: array, description: "오픈 예정(오픈 시각 순)", items: { $ref: '#/components/schemas/EventCard' } }
        onSale: { type: array, description: "지금 판매 중. 잔여석이 있는 공연을 판매 종료(마지막 회차의 공연 시작 24시간 전, saleEndsAt)가 가까운 순으로(POL-043, ADR-0064)", items: { $ref: '#/components/schemas/EventCard' } }
        themes:
          type: array
          description: "운영자가 [홈 구성]에서 만든 테마 줄(순서대로)"
          items: { type: object, properties: { themeId: { type: string }, name: { type: string }, events: { type: array, items: { $ref: '#/components/schemas/EventCard' } } } }
        venues:
          type: array
          description: "공연장 줄(오픈 예정·판매 중 공연이 있는 공연장, 추천 적용 2026-10-14, ADR-0063). 누르면 /v1/search?venueId="
          items: { type: object, properties: { venueId: { type: string }, name: { type: string }, initial: { type: string, description: "원형 이니셜 글자(로고 이미지 없음)" } } }
        rankingsPath: { type: string, description: "장르별 랭킹 파일 경로(/v1/home/rankings.json)" }
        generatedAt: { type: string, format: date-time }
    RankingFile:
      type: object
      description: "장르별 랭킹 파일(SCR-001 ⑧, 추천 적용 2026-10-14, ADR-0063). 어제(KST) 확정 판매 매수 순위이고 매수 값은 싣지 않는다. docs/features/analytics.md §8.5"
      properties:
        basisDate: { type: string, format: date, description: "집계한 날(어제, KST)" }
        generatedAt: { type: string, format: date-time }
        overall: { type: array, maxItems: 10, description: "'전체' 칩의 장르 구분 없는 순위, 최대 10위 [가정](추천 적용 2026-10-14, ADR-0063)", items: { allOf: [{ $ref: '#/components/schemas/EventCard' }, { type: object, required: [rank], properties: { rank: { type: integer, minimum: 1 } } }] } }
        genres:
          type: array
          items:
            type: object
            properties:
              genre: { $ref: '#/components/schemas/Genre' }
              items: { type: array, maxItems: 10, description: "최대 10위 [가정]", items: { allOf: [{ $ref: '#/components/schemas/EventCard' }, { type: object, required: [rank], properties: { rank: { type: integer, minimum: 1 } } }] } }
    SearchResultPage:
      type: object
      description: "검색 결과 한 페이지(페이지 번호 방식, guidelines §3 예외, 소유자 결정 2026-10-14, ADR-0063)"
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/EventCard' } }
        page: { type: integer, minimum: 1 }
        limit: { type: integer }
        total: { type: integer, description: "결과 수. 1,000 [가정]을 넘으면 1000이고 totalCapped가 true" }
        totalCapped: { type: boolean }
        totalPages: { type: integer }
    SuggestResult:
      type: object
      description: "연관 검색어 창(소유자 결정 2026-10-14, ADR-0063)의 응답. 최대 8개 [가정](추천 적용 2026-10-14, ADR-0063)"
      properties:
        query: { type: string, description: "정규화한 입력(NFKC, 소문자, 앞뒤 공백 제거)" }
        items:
          type: array
          maxItems: 8
          items:
            type: object
            required: [kind, label]
            properties:
              kind: { type: string, enum: [EVENT, ARTIST, VENUE], description: "공연·아티스트·공연장. 화면이 종류 아이콘을 붙인다" }
              label: { type: string }
              matches: { type: array, description: "label에서 입력과 일치한 부분(UTF-16 위치). 화면이 굵게 보인다", items: { type: object, properties: { start: { type: integer }, length: { type: integer } } } }
              eventId: { type: string, description: "kind=EVENT일 때" }
              posterUrl: { type: string, format: uri, description: "kind=EVENT일 때 작은 포스터" }
              openAt: { type: string, format: date-time, description: "kind=EVENT일 때 오픈 일시" }
              venueId: { type: string, description: "kind=VENUE일 때" }
    Review:
      type: object
      description: "관람 후기(소유자 결정 2026-10-14, ADR-0063). 작성자는 닉네임 첫 글자와 '**', 관람 회차 일시만 싣고 이메일·전화번호·실명·계정 ID는 싣지 않는다. 본인 후기는 mine으로만 알린다(추천 적용 2026-10-14, ADR-0063)"
      properties:
        reviewId: { type: string }
        eventId: { type: string }
        authorDisplay: { type: string, description: "닉네임 첫 글자(grapheme) + '**'. 예: 김**" }
        attendedStartsAt: { type: string, format: date-time, description: "관람 회차 일시" }
        rating: { type: integer, minimum: 1, maximum: 5 }
        body: { type: string }
        createdAt: { type: string, format: date-time }
        edited: { type: boolean }
        mine: { type: boolean, description: "본인 후기. 팬 쿠키로 부른 목록·단건에서만 true가 될 수 있고 CDN 캐시 응답(요약)에는 늘 false" }
        reportedByMe: { type: boolean, description: "이 계정이 이미 신고한 후기. 화면은 [신고함](비활성)으로 보인다. 팬 쿠키로 부른 목록·단건에서만 true가 될 수 있고 CDN 캐시 응답(요약)에는 늘 false(ADR-0066)" }
        images: { type: array, maxItems: 3, description: "후기 사진(최대 3장 [가정], ADR-0066). 남에게 가린 후기에는 싣지 않는다", items: { $ref: '#/components/schemas/ReviewImage' } }
        status: { type: string, enum: [VISIBLE, HIDDEN], description: "HIDDEN(통보·같은 내용·불법 촬영물 신고 확인 중·신고 처리로 가림)은 본인에게 '노출 제한'으로 보인다. 신고 처리로 임시조치·노출 차단한 후기는 남에게도 본문·사진·별점 없이 notice만 있는 자리로 온다(ADR-0066)" }
        notice: { type: string, enum: [RIGHTS_TEMP, POLICY], description: "신고 처리로 가린 후기의 공시(정보통신망법 §44의2② 후단). RIGHTS_TEMP면 화면이 '권리 침해 신고로 임시조치된 후기입니다(noticeUntil까지)', POLICY면 '운영정책에 따라 가려진 후기입니다'를 보인다. 통보·같은 내용 차단과 불법 촬영물 신고 확인 중 가림은 남의 목록에서 빠지고 이 값이 없다(추천 적용 2026-10-19, ADR-0066)" }
        noticeUntil: { type: string, format: date-time, description: "RIGHTS_TEMP의 끝 시각(30일 이내)" }
        permalink: { type: string, description: "이 후기를 가리키는 같은 출처 주소(신고 모달의 신고기관 바로가기 때 복사, FR-016·FR-070). 형식은 design/d5 SCR-016" }
    ReviewPage: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Review' } }, nextCursor: { type: [string, 'null'] } } }
    ReviewSummary:
      type: object
      description: "공연 상세 후기 섹션(평균 별점, 후기 수, 최근 후기 2개). 개인 값 없음"
      properties:
        averageRating: { type: [number, 'null'], description: "소수 첫째 자리. 후기가 없으면 null" }
        count: { type: integer }
        recent: { type: array, maxItems: 2, items: { $ref: '#/components/schemas/Review' } }
    ReviewEligibility:
      type: object
      description: "후기 쓰기 자격. [후기 쓰기]를 누를 때 확인하고, 자격이 없으면 화면이 이유 대화상자를 띄운다(버튼을 숨기지 않는다)"
      properties:
        eligible: { type: boolean }
        reason: { type: string, enum: [NOT_ENDED, NOT_PURCHASER, EVENT_CANCELLED, ALREADY_WRITTEN], description: "eligible=false일 때. NOT_ENDED: 공연 종료 예정 시각 전, NOT_PURCHASER: 이 회차 결제자가 아니거나 티켓이 모두 취소·환불됨(양도받은 분 포함), EVENT_CANCELLED: 취소된 회차, ALREADY_WRITTEN: 이미 씀(수정으로 안내)" }
        myReviewId: { type: string, description: "ALREADY_WRITTEN일 때" }
    ReviewWrite: { type: object, required: [rating, body], properties: { rating: { type: integer, minimum: 1, maximum: 5 }, body: { type: string, maxLength: 4000, description: "NFC 정규화 뒤 grapheme 10~1,000자 [가정]. 금칙어는 NFKC 정규화 뒤 대조" }, images: { type: array, maxItems: 3, description: "붙일 사진(최대 3장 [가정], 순서대로). POST /v1/review-images로 이 계정이 올린 READY 사진만. 고치기에서 보내면 사진 목록을 이 값으로 바꾸고 빠진 사진은 지운다(소유자 요청 2026-10-19, 세부는 추천 적용 2026-10-19, ADR-0066)", items: { type: object, additionalProperties: false, required: [imageId], properties: { imageId: { type: string }, alt: { type: string, maxLength: 400, description: "사진 설명(대체 텍스트, 선택). NFC 정규화 뒤 grapheme 100자 [가정]. 비우면 화면이 '후기 사진 1/3'으로 읽는다" } } } } } }
    ReviewImage: { type: object, description: "후기에 붙은 사진(ADR-0066). 메타데이터를 지운 파생본 2종만 있고 원본은 없다. 이름은 서버가 만든 ID", properties: { imageId: { type: string }, thumbnailUrl: { type: string, format: uri, description: "목록 파생본(240px [가정])" }, url: { type: string, format: uri, description: "보기 파생본(긴 변 1,280px [가정])" }, alt: { type: string, description: "사진 설명. 비었으면 화면이 '후기 사진 1/3'으로 읽는다" }, width: { type: integer }, height: { type: integer } } }
    ReviewImageUpload: { type: object, description: "후기 사진 올리기 결과(ADR-0066). 검사·다시 인코딩이 끝난 뒤 응답한다", properties: { imageId: { type: string }, status: { type: string, enum: [READY], description: "붙일 수 있는 사진. 받지 않은 사진은 422" }, thumbnailUrl: { type: string, format: uri, description: "목록 파생본(240px [가정])" } } }
    ContentReportCreate:
      type: object
      additionalProperties: false
      description: "후기 신고(FR-070, POL-044, 소유자 요청 2026-10-19, 세부는 추천 적용 2026-10-19, ADR-0066). 화면은 확인 모달의 [신고합니다]에서만 보낸다"
      required: [category]
      properties:
        category: { type: string, enum: [SCALPING, MACRO, ABUSE, RIGHTS, ILLEGAL_FILMING, SPAM, OFF_TOPIC, OTHER], description: "SCALPING 암표·부정판매, MACRO 매크로·부정 예매 프로그램, ABUSE 욕설·비방·혐오 표현, RIGHTS 개인정보 노출·명예훼손, ILLEGAL_FILMING 음란물·불법 촬영물, SPAM 광고·도배, OFF_TOPIC 공연과 관계없는 내용, OTHER 기타" }
        detail: { type: string, maxLength: 2000, description: "자세한 내용. NFC 정규화 뒤 grapheme 0~500자 [가정]. RIGHTS이고 rightsHolder가 true이거나 OTHER면 필수(아니면 422)" }
        rightsHolder: { type: boolean, description: "RIGHTS일 때 필수. 이 후기로 권리를 침해받은 본인이면 true이고 정보통신망법 §44의2 삭제 요청으로 받는다" }
        notifyChannel: { type: string, enum: [APP, EMAIL], description: "처리 결과를 받을 곳(앱 알림, 계정 이메일). rightsHolder가 true면 필수(§44의2① 통지 수단 지정)" }
    ContentReportResult: { type: object, properties: { reportId: { type: string } } }
    ReviewModeration:
      type: object
      additionalProperties: false
      description: "신고된 후기 처리(FR-070, POL-044, 추천 적용 2026-10-19, ADR-0066)"
      required: [action, reason]
      properties:
        action: { type: string, enum: [NO_ACTION, TEMP_BLOCK, BLOCK, RELEASE], description: "NO_ACTION 조치 없음, TEMP_BLOCK 임시조치(최대 30일), BLOCK 운영정책 위반 노출 차단, RELEASE 가린 후기를 다시 보이게 함" }
        reason: { type: string, minLength: 1, maxLength: 2000, description: "사유(필수, 감사 로그). 팬 개인정보를 적지 않는다" }
        violation: { type: string, enum: [SCALPING, MACRO, ABUSE, RIGHTS, ILLEGAL_FILMING, SPAM, OFF_TOPIC, OTHER], description: "TEMP_BLOCK·BLOCK일 때 필수. 글쓴이에게 알리는 사유 종류(신고 사유와 같은 코드)" }
        endsAt: { type: string, format: date-time, description: "TEMP_BLOCK일 때 필수. 지금부터 30일 이내(정보통신망법 §44의2④)" }
    InquiryCategory: { type: string, enum: [BOOKING_PAYMENT, CANCEL_REFUND, TRANSFER, ENTRY, ACCOUNT, AUTOMATED_DECISION, SELLER_DISPUTE, MINOR_CONTRACT_CANCEL, MERCH, MODERATION_APPEAL, OTHER], description: "문의 유형 11개(추천 적용 2026-10-19, ADR-0066): 예매·결제, 취소·환불(사정이 있어 공제 면제를 요청), 양도, 입장·현장, 계정, 자동화된 결정(추가 검증) 설명·재검토, 공연(판매자) 관련 분쟁, 미성년자 계약 취소, 굿즈·상품, 게시물 조치 이의, 기타" }
    InquiryCreate:
      type: object
      additionalProperties: false
      description: "문의하기(SCR-056, FR-069, ADR-0066). 첨부 파일은 받지 않는다"
      required: [category, title, body]
      properties:
        category: { $ref: '#/components/schemas/InquiryCategory' }
        orderRef: { type: string, description: "관련 주문(선택). 이 계정의 예매번호나 굿즈 주문번호만" }
        title: { type: string, maxLength: 200, description: "NFC 정규화 뒤 grapheme 5~50자 [가정]" }
        body: { type: string, maxLength: 8000, description: "NFC 정규화 뒤 grapheme 10~2,000자 [가정]. 건강 정보 같은 민감한 내용과 계좌번호는 적지 않아도 된다(화면 안내)" }
    InquiryCreated: { type: object, properties: { inquiryId: { type: string }, number: { type: string, description: "접수 번호 Q-YYMM-NNNN [가정](예 Q-2610-0042)" }, dueAt: { type: string, format: date-time, description: "결과 안내 기한(일반 문의 답변 3영업일 [가정], 분쟁 결과 10영업일)" } } }
    InquiryMessage: { type: object, description: "문의 기록 한 줄(ADR-0066)", properties: { messageId: { type: string }, authorKind: { type: string, enum: [FAN, AGENT, SYSTEM] }, authorDisplay: { type: string, description: "AGENT는 '피켓 고객센터'. 담당자 이름·계정 ID는 싣지 않는다" }, kind: { type: string, enum: [MESSAGE, PROGRESS, ANSWER], description: "MESSAGE 문의·추가 문의, PROGRESS 진행 경과, ANSWER 답변" }, body: { type: string }, createdAt: { type: string, format: date-time } } }
    Inquiry:
      type: object
      description: "고객 문의(FR-069, 추천 적용 2026-10-19, ADR-0066). 본인 것만. 목록에는 messages가 없고 상세에만 있다"
      properties:
        inquiryId: { type: string }
        number: { type: string, description: "접수 번호 Q-YYMM-NNNN [가정]" }
        category: { $ref: '#/components/schemas/InquiryCategory' }
        orderRef: { type: string }
        orderSummary: { type: string, description: "관련 주문 표시(공연명·회차·좌석 등급·매수 또는 상품 요약). 없으면 없음" }
        title: { type: string }
        status: { type: string, enum: [RECEIVED, IN_PROGRESS, ANSWERED, CLOSED], description: "접수됨·처리 중·답변 완료·닫힘" }
        hasNewAnswer: { type: boolean, description: "상세를 마지막으로 연 뒤 답변·진행 경과가 왔음" }
        createdAt: { type: string, format: date-time }
        answeredAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time }
        progressDueAt: { type: string, format: date-time, description: "분쟁 유형만. 진행 경과 안내 기한(3영업일, 전자상거래법 시행령 §25의2)" }
        resultDueAt: { type: string, format: date-time, description: "결과 안내 기한(분쟁 10영업일, 일반 문의 답변 3영업일 [가정])" }
        messages: { type: array, description: "상세에만. 시간 순", items: { $ref: '#/components/schemas/InquiryMessage' } }
    InquiryPage: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Inquiry' } }, total: { type: integer, description: "조건에 맞는 문의 수" }, page: { type: integer }, limit: { type: integer } } }
    CaseReply: { type: object, additionalProperties: false, required: [kind, body], description: "문의 답변·진행 경과(ADR-0066)", properties: { kind: { type: string, enum: [ANSWER, PROGRESS] }, body: { type: string, minLength: 1, maxLength: 8000, description: "NFC 정규화 뒤 grapheme 2,000자까지. 팬에게는 '피켓 고객센터'로 보인다" } } }
    HomeLayout:
      type: object
      description: "홈 구성(SCR-068 [홈 구성] 탭, operator 1인, 감사 로그). 배너와 테마를 한 문서로 통째로 저장하고 version으로 동시 수정을 막는다. 개수 상한은 [가정](추천 적용 2026-10-14, ADR-0063)"
      required: [version, banners, themes]
      properties:
        version: { type: integer, description: "읽은 판. 저장 때 서버 판과 다르면 409" }
        banners:
          type: array
          maxItems: 10
          items:
            type: object
            required: [eventId, imageId, alt, displayFrom, displayUntil]
            properties:
              bannerId: { type: string }
              eventId: { type: string, description: "판매 승인된 공연만(아니면 422)" }
              imageId: { type: string, description: "POST /v1/ops/home-layout/banner-images로 올린 이미지" }
              alt: { type: string, minLength: 1, maxLength: 300, description: "대체 텍스트. 이미지에만 있는 정보(일시·장소)도 적는다" }
              displayFrom: { type: string, format: date-time }
              displayUntil: { type: string, format: date-time }
        themes:
          type: array
          maxItems: 5
          items:
            type: object
            required: [name, eventIds, displayFrom, displayUntil]
            properties:
              themeId: { type: string }
              name: { type: string, minLength: 1, maxLength: 30 }
              eventIds: { type: array, minItems: 1, maxItems: 20, items: { type: string }, description: "판매 승인된 공연만, 순서대로" }
              displayFrom: { type: string, format: date-time }
              displayUntil: { type: string, format: date-time }
        updatedBy: { type: string, readOnly: true, description: "마지막으로 저장한 운영자" }
        updatedAt: { type: string, format: date-time, readOnly: true }
    SeatMapShape: { type: object, required: [kind, points], description: "공연장 좌표계 도형. 그린 도구가 무엇이든 저장 값은 꼭짓점 목록(다각형)이다", properties: { kind: { type: string, enum: [RECT, POLYGON, SECTOR, ARC_BAND], description: "그린 도구(사각형·다각형·부채꼴·곡선 띠). 곡선 띠는 안쪽·바깥 반지름이 있는 부채꼴 띠다(추천 적용 2026-10-19, ADR-0066)" }, points: { type: array, minItems: 3, items: { type: array, minItems: 2, maxItems: 2, items: { type: integer } }, description: "꼭짓점 [x, y] 목록" }, name: { type: string } } }
    SeatMapLayout:
      type: object
      description: "좌석맵 두 층(배치 층: 캔버스·무대·구역 도형·라벨 위치·등급, 좌석 층: 행·좌석·좌표, 추천 적용 2026-10-14, ADR-0063). 팬 화면 좌석맵 파일과 파트너 저장 본문이 같은 구조다. 5만 석 파일 크기는 K5에서 재고 좌석 목록을 열 단위 배열로 줄일 수 있다 [가정]"
      required: [canvas, sections]
      properties:
        layoutVersion: { type: integer, description: "저장할 때 읽은 판. 서버 판과 다르면 409. 0이면 새 배치본" }
        templateVenueId: { type: string, description: "복제한 공연장 틀 ID. 배치본은 틀을 복제한 공연용 사본이고 편집은 그 사본에만 미친다(추천 적용 2026-10-14, ADR-0063)" }
        canvas: { type: object, required: [width, height], properties: { width: { type: integer }, height: { type: integer } } }
        stage: { type: array, description: "무대·통로 등 판매하지 않는 도형", items: { $ref: '#/components/schemas/SeatMapShape' } }
        sections:
          type: array
          items:
            type: object
            required: [sectionId, name, shape]
            properties:
              sectionId: { type: string }
              name: { type: string }
              level: { type: string }
              shape: { $ref: '#/components/schemas/SeatMapShape' }
              label: { type: object, description: "구역 라벨 위치", properties: { x: { type: integer }, y: { type: integer } } }
              tierId: { type: string, description: "구역 기본 등급. 회차 판매 등급은 좌석의 tierId" }
              gateZone: { type: string }
              seatIndexRange: { type: object, description: "이 구역 좌석의 비트맵 인덱스 범위. 브라우저가 스냅샷에서 구역별 남은 좌석을 센다(추천 적용 2026-10-14, ADR-0063)", properties: { from: { type: integer }, to: { type: integer } } }
              fillRule: { $ref: '#/components/schemas/SeatFillRule', description: "파트너 에디터 전용 좌석 채우기 규칙(section.editor_meta). 팬 좌석맵 파일에는 싣지 않는다(ADR-0066)" }
              seats:
                type: array
                items: { type: object, required: [seatId, row, number, x, y], properties: { seatId: { type: string }, index: { type: integer, description: "비트맵 인덱스" }, row: { type: string }, number: { type: integer }, x: { type: integer }, y: { type: integer }, tierId: { type: string }, wheelchair: { type: boolean }, unavailable: { type: boolean, description: "판매 제외" }, gateZone: { type: string } } }
    SeatMapImportResult:
      type: object
      description: "좌석맵 가져오기 검증 결과. 오류가 하나라도 있으면 반영하지 않는다(FR-023)"
      properties:
        ok: { type: boolean }
        layout: { $ref: '#/components/schemas/SeatMapLayout', description: "ok일 때 에디터에 올릴 배치. 저장은 PUT /v1/partner/events/{eventId}/seatmap" }
        errors: { type: array, items: { type: object, properties: { line: { type: integer }, field: { type: string }, code: { type: string } } } }
        warnings: { type: array, description: "휠체어석 기준 경고 W1~W3(FR-023)와 좌석 겹침 경고 SEAT_OVERLAP(좌석 중심 사이가 좌석 간격의 절반보다 가까움 [가정], ADR-0066). 모두 막지 않는다", items: { type: object, properties: { code: { type: string, enum: [W1, W2, W3, SEAT_OVERLAP] }, seatIds: { type: array, items: { type: string } } } } }
    SeatFillRule:
      type: object
      description: "구역 좌석 채우기 규칙(SCR-022 ② 좌석 채우기, 소유자 요청 2026-10-19, 세부는 추천 적용 2026-10-19, ADR-0066). 에디터(브라우저)가 이 규칙으로 도형 안에 좌석 좌표를 계산하고 서버는 저장 때 다시 검사한다. 기본값은 모두 [가정]"
      required: [method]
      properties:
        method: { type: string, enum: [COUNT, GRID], description: "COUNT 좌석 수로 채우기, GRID 행 수 × 행마다 좌석 수" }
        targetCount: { type: integer, minimum: 1, description: "COUNT일 때 목표 좌석 수(예 600)" }
        rows: { type: integer, minimum: 1, description: "GRID일 때 행 수(예 20)" }
        seatsPerRow: { type: integer, minimum: 1, description: "GRID일 때 행마다 좌석 수(예 30)" }
        rowShape: { type: string, enum: [STRAIGHT, CURVED], description: "직선, 무대를 향한 곡선" }
        seatSpacingCm: { type: integer, minimum: 1, description: "좌석 간격(옆), 기본 50 [가정]" }
        rowSpacingCm: { type: integer, minimum: 1, description: "행 간격(앞뒤), 기본 90 [가정]" }
        aisles: { type: integer, minimum: 0, description: "세로 통로 수, 기본 2 [가정]" }
        aisleWidthCm: { type: integer, minimum: 1, description: "통로 폭, 기본 120 [가정]" }
        rowLabel: { type: string, enum: [NUMBER, ALPHA], description: "행 이름 1열·2열 또는 A·B·C" }
        firstNumber: { type: integer, minimum: 0, description: "첫 번호, 기본 1 [가정]" }
        numberFrom: { type: string, enum: [LEFT, RIGHT], description: "번호 방향(무대를 보고 왼쪽부터·오른쪽부터)" }
    SeatmapTemplateSummary:
      type: object
      description: "좌석맵 템플릿 카드(템플릿 고르기, 소유자 요청 2026-10-19, 목록은 추천 적용 2026-10-19, ADR-0066). 흔한 공연장 모양을 본뜬 출발점이고 실제 공연장의 배치도가 아니다"
      properties:
        templateId: { type: string, description: "venue kind TEMPLATE의 ID" }
        code: { type: string, enum: [ARENA-END, ARENA-THRUST, ARENA-CENTER, DOME, STADIUM, THEATER-L, THEATER-M, THEATER-S, HALL, FLAT] }
        name: { type: string, description: "예 '실내 아레나 · 엔드 스테이지'. 특정 공연장 이름을 쓰지 않는다" }
        family: { type: string, enum: [ARENA, DOME, STADIUM, THEATER, HALL, FLAT] }
        defaultCapacity: { type: integer, description: "기본 좌석 수 [가정](예 약 12,000). 파트너가 목표 좌석 수로 바꾼다" }
        levelCount: { type: integer, description: "층 수" }
        sectionCount: { type: integer, description: "구역 수" }
        summary: { type: string, description: "한 줄 설명(구성)" }
        variants:
          type: array
          description: "고를 수 있는 것(돌출 길이, 그라운드 구역 수, 오케스트라 피트 있음·없음, 합창석 판매 여부, 블록 수). 없으면 빈 배열"
          items: { type: object, required: [key, label, kind], properties: { key: { type: string }, label: { type: string }, kind: { type: string, enum: [CHOICE, NUMBER, BOOLEAN] }, options: { type: array, items: { type: string }, description: "CHOICE일 때" }, min: { type: integer }, max: { type: integer }, defaultValue: { description: "기본값(kind에 맞는 형)" } } }
        schematicUrl: { type: string, format: uri, description: "개략도 SVG(템플릿과 함께 배포한 정적 파일)" }
        version: { type: integer, description: "템플릿 판" }
    SeatmapTemplate:
      description: "좌석맵 템플릿 하나(도형·구역별 채우기 규칙·등급 기본값, ADR-0066). 좌석 좌표는 없다(에디터가 채우기 규칙으로 계산)"
      allOf:
        - $ref: '#/components/schemas/SeatmapTemplateSummary'
        - type: object
          properties:
            layout: { $ref: '#/components/schemas/SeatMapLayout', description: "캔버스·무대·구역 도형. 구역마다 fillRule(기본 채우기 규칙)이 있고 tierId는 등급 기본값 안(R·S·A)이며 seats는 비어 있다" }
    AttendeeExport: { type: object, description: "예매자 명단 다운로드 기록(SCR-027 [다운로드 이력], 추천 적용 2026-10-19, ADR-0066). 내려받은 사람은 표시 이름과 역할만 싣고 이메일·계정 ID는 싣지 않는다", properties: { exportId: { type: string }, exportedAt: { type: string, format: date-time }, actorDisplayName: { type: string }, actorRole: { type: string, description: "내려받을 때의 역할(지금은 partner_admin만 내려받는다)" }, reason: { type: string }, count: { type: integer, description: "건수" }, format: { type: string, enum: [CSV, XLSX, PDF] }, result: { type: string, enum: [COMPLETED, FAILED] } } }
    AttendeeExportPage: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/AttendeeExport' } }, nextCursor: { type: [string, 'null'] } } }
    SellerChangeRequest:
      type: object
      additionalProperties: false
      description: "판매자 정보 변경 요청(파트너 관리자, 추천 적용 2026-10-19, ADR-0066). 근거 서류는 참조값만 받고 파일은 받지 않는다"
      required: [changes]
      properties:
        changes: { type: array, minItems: 1, maxItems: 7, items: { type: object, additionalProperties: false, required: [field, newValue], properties: { field: { type: string, enum: [legalName, representative, address, phone, email, businessRegNo, mailOrderReportNo] }, newValue: { type: string, minLength: 1 } } } }
        evidenceRef: { type: string, description: "근거 서류 참조(예 서류 종류와 발급 번호). 파일은 받지 않는다" }
    SellerChangeRequestState: { type: object, properties: { requestId: { type: string }, status: { type: string, enum: [IN_REVIEW, APPLIED, REJECTED] }, fields: { type: array, items: { type: string } }, requestedAt: { type: string, format: date-time }, identityReviewRequired: { type: boolean, description: "상호(legalName)나 대표자(representative)를 바꾸면 true. PEAKET 운영자가 판매자 정보를 다시 확인한다(판매자 정보 재승인, POL-039, planning/03 §2.14). 공연의 판매 재승인은 아니며 확인이 끝날 때까지 지금 정보가 보인다(ADR-0066 결정 12)" } } }
    SellerProfile: { type: object, description: "파트너 판매자 정보(SCR-020 [판매자 정보], FR-052·FR-053, POL-037, ADR-0066). 공연 상세·결제 직전·예매 확인서에 판매자 정보로 보이는 값(전자상거래법 §20②)", properties: { seller: { $ref: '#/components/schemas/SellerInfo' }, verifiedAt: { type: string, format: date-time, description: "마지막 확인(PEAKET 판매 승인에 쓰인 값)" }, pendingChange: { oneOf: [{ $ref: '#/components/schemas/SellerChangeRequestState' }, { type: 'null' }], description: "검토 중인 변경 요청. 없으면 null" } } }
    VerificationStart:
      type: object
      description: "본인확인 시작 응답(SCR-006 본인확인 흐름, 소유자 결정 2026-10-14, ADR-0063)"
      properties:
        verificationId: { type: string }
        window: { type: object, description: "본인확인기관 창 값. 브라우저는 버튼을 누른 동작 안에서 미리 연 창에 이 양식을 제출한다. 창이 막혔거나 mode가 REDIRECT면 지금 창에서 제출한다", properties: { url: { type: string, format: uri }, method: { type: string, enum: [GET, POST] }, fields: { type: object, additionalProperties: { type: string } }, mode: { type: string, enum: [POPUP, REDIRECT] } } }
        expiresAt: { type: string, format: date-time }
    VerificationResult:
      type: object
      description: "본인확인 결과. 부르는 화면이 결과 대화상자로 보인다(design/d5 §5.6 상태 표)"
      properties:
        verificationId: { type: string }
        purpose: { type: string, enum: [FIRST, REVERIFY, BOOTH, MINOR_CONTRACT] }
        status: { type: string, enum: [PENDING, VERIFIED, CANCELLED, FAILED, PROVIDER_DOWN, DUPLICATE_ACCOUNT, UNDER_14, BOOTH_MISMATCH] }
        next: { type: string, description: "결과 대화상자를 띄울 같은 출처 경로" }
        resultToken: { type: string, description: "BOOTH(reverificationToken)·MINOR_CONTRACT(verificationResultToken) 목적으로 VERIFIED일 때만" }
    SubscriptionState: { type: object, description: "회차별 알림 신청 상태(추천 적용 2026-10-14, ADR-0063)", properties: { eventId: { type: string }, open: { type: boolean, description: "오픈 알림 신청" }, cancellation: { type: boolean, description: "취소표 알림 신청" }, nightPush: { type: boolean } } }
    EventImage:
      type: object
      description: "공연 이미지(포스터 1장, 상세 0~10장, ADR-0062 결정 38). 서버가 다시 검사하고 메타데이터를 지운 파생본만 공개한다. 원본 파일 이름은 쓰지 않는다"
      properties:
        imageId: { type: string }
        kind: { type: string, enum: [POSTER, DETAIL] }
        alt: { type: string, description: "대체 텍스트(필수). 이미지에만 있는 정보는 공연 설명 글에도 적는다" }
        order: { type: integer, description: "상세 이미지 순서(0부터)" }
        width: { type: integer }
        height: { type: integer }
        derivatives: { type: object, description: "파생본 주소(크기별 WebP·JPEG, 이름은 서버가 만든 ID)", additionalProperties: { type: string, format: uri } }
    CsCasePage: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/CsCase' } }, nextCursor: { type: [string, 'null'] } } }
    StaffAssignmentPage: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/StaffAssignment' } }, nextCursor: { type: [string, 'null'] } } }
    GateFlagPage: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/GateFlag' } }, nextCursor: { type: [string, 'null'] } } }
    SettlementStatementPage: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/SettlementStatement' } }, nextCursor: { type: [string, 'null'] } } }
    DecisionRecordPage: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/DecisionRecord' } }, nextCursor: { type: [string, 'null'] } } }
    PartnerWebhookEvent:
      type: object
      description: "파트너 웹훅 본문(Standard Webhooks 권고 형식 {type, timestamp, data}, thin, FR-025). 개인정보(이름·연락처·이메일)·계정 ID·좌석 번호·결제사 결제 참조는 싣지 않고 금액은 원 단위 정수다. 같은 type의 data 구조는 바꾸지 않고 깨지는 변경은 새 type으로 낸다. 순서는 보장하지 않으므로 받는 쪽은 timestamp와 상태로 판단하고 webhook-id로 중복을 거른다(추천 적용 2026-10-14, ADR-0062)"
      required: [type, timestamp, data]
      properties:
        type: { type: string, enum: [order.confirmed, order.cancelled, event.sold_out, event.cancelled, event.postponed, statement.notified, payout.completed, payout.failed], description: "<자원>.<과거형 동작>, 소문자와 _만" }
        timestamp: { type: string, format: date-time, description: "사건 시각(ISO 8601 UTC)" }
        data:
          description: "type별 필드. 아래 oneOf의 title이 type이다"
          oneOf:
            - { title: order.confirmed, description: "판매 확정. 결제가 확정되어 티켓을 발권했을 때(OrderEvent CONFIRMED)", type: object, required: [eventId, orderId, ticketCount, amount, tiers, confirmedAt], properties: { eventId: { type: string }, orderId: { type: string }, ticketCount: { type: integer }, amount: { type: integer }, tiers: { type: array, items: { type: object, properties: { tierId: { type: string }, count: { type: integer } } } }, confirmedAt: { type: string, format: date-time } } }
            - { title: order.cancelled, description: "예매 취소·환급. 예매 취소가 확정되어 환급을 시작할 때(입장 시작 뒤 접수한 취소는 입장 기록 확인 뒤, Cancellation REFUND_PENDING)", type: object, required: [eventId, orderId, ticketCount, refundAmount, cause, cancelledAt], properties: { eventId: { type: string }, orderId: { type: string }, ticketCount: { type: integer }, refundAmount: { type: integer }, cause: { type: string, enum: [FAN, EVENT_CANCELLATION, EVENT_POSTPONEMENT, OPERATOR] }, cancelledAt: { type: string, format: date-time } } }
            - { title: event.sold_out, description: "매진. 회차의 모든 좌석이 팔렸을 때(queue-admission §8)", type: object, required: [eventId, soldOutAt], properties: { eventId: { type: string }, soldOutAt: { type: string, format: date-time } } }
            - { title: event.cancelled, description: "회차 취소 확정(EventCancellationRequest APPROVED, CANCEL)", type: object, required: [eventId, fault, confirmedAt], properties: { eventId: { type: string }, fault: { type: string, enum: [ORGANIZER, FORCE_MAJEURE, CONTENT_CHANGE] }, confirmedAt: { type: string, format: date-time } } }
            - { title: event.postponed, description: "회차 연기 확정(EventCancellationRequest APPROVED, POSTPONE)", type: object, required: [eventId, newStartsAt, refundRequestDeadline, fault, confirmedAt], properties: { eventId: { type: string }, newStartsAt: { type: string, format: date-time }, refundRequestDeadline: { type: string, format: date-time }, fault: { type: string, enum: [ORGANIZER, FORCE_MAJEURE, CONTENT_CHANGE] }, confirmedAt: { type: string, format: date-time } } }
            - { title: statement.notified, description: "정산서 통지. 정산서를 계산해 알렸을 때, 이의 기간 시작(SettlementEvent STATEMENT_NOTIFIED)", type: object, required: [statementId, kind, pg, payoutAmount, disputeDueAt], if: { properties: { kind: { const: EVENT } } }, then: { required: [eventId] }, else: { required: [periodStart, periodEnd] }, properties: { statementId: { type: string }, kind: { type: string, enum: [EVENT, PRODUCT], description: "EVENT는 티켓 회차 정산서, PRODUCT는 굿즈·부가 상품 상품 정산서(추천 적용 2026-10-14, ADR-0062)" }, eventId: { type: string, description: "정산서의 eventId(회차). kind=EVENT일 때만 있다" }, pg: { type: string, enum: [TOSS, PORTONE] }, pgStore: { type: string, enum: [STANDARD, ESCROW], description: "토스페이먼츠 결제 상점(토스페이먼츠만)" }, periodStart: { type: string, format: date, description: "상품 정산서의 주 시작(KST)" }, periodEnd: { type: string, format: date, description: "상품 정산서의 주 끝(KST)" }, payoutAmount: { type: integer }, disputeDueAt: { type: string, format: date-time } } }
            - { title: payout.completed, description: "지급 완료. 정산금이 정산 계좌로 지급되었을 때(SettlementEvent PAYOUT_COMPLETED)", type: object, required: [statementId, kind, pg, amount, paidAt], properties: { statementId: { type: string }, kind: { type: string, enum: [EVENT, PRODUCT], description: "정산서 종류(추천 적용 2026-10-14, ADR-0062)" }, pg: { type: string, enum: [TOSS, PORTONE] }, pgStore: { type: string, enum: [STANDARD, ESCROW], description: "토스페이먼츠만" }, amount: { type: integer }, paidAt: { type: string, format: date-time } } }
            - { title: payout.failed, description: "지급 실패. 지급이 실패해 계좌 확인이 필요할 때(SettlementEvent PAYOUT_FAILED)", type: object, required: [statementId, kind, pg, amount, failedAt], properties: { statementId: { type: string }, kind: { type: string, enum: [EVENT, PRODUCT], description: "정산서 종류(추천 적용 2026-10-14, ADR-0062)" }, pg: { type: string, enum: [TOSS, PORTONE] }, pgStore: { type: string, enum: [STANDARD, ESCROW], description: "토스페이먼츠만" }, amount: { type: integer }, failedAt: { type: string, format: date-time } } }
    OAuthError: { type: object, description: "RFC 6749 §5.2 오류 본문. 기기 승인 토큰 엔드포인트(POST /v1/scanner/token)의 400만 이 형식이고 그 밖의 오류는 Problem이다(guidelines §2)", required: [error], properties: { error: { type: string, description: "authorization_pending·slow_down·access_denied·expired_token(RFC 8628 §3.5), 그 밖은 RFC 6749 §5.2" }, error_description: { type: string } } }
  responses:
    Problem: { description: RFC 9457 오류, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Unauthorized: { description: "인증 필요(RFC 9457 오류). RFC 9110 §15.5.2대로 WWW-Authenticate를 싣는다(guidelines §12)", headers: { WWW-Authenticate: { $ref: '#/components/headers/WWWAuthenticate' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    TooManyRequests: { description: "요청 한도 초과(RFC 9457 오류). Retry-After를 싣는다(guidelines §6)", headers: { Retry-After: { $ref: '#/components/headers/RetryAfter' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    ServiceUnavailable: { description: "일시적으로 처리할 수 없음(차단기·Degraded·기능 꺼짐, RFC 9457 오류). Retry-After를 싣는다(guidelines §2)", headers: { Retry-After: { $ref: '#/components/headers/RetryAfter' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  headers:
    Location: { description: "새로 만든 자원의 주소(RFC 9110 §10.2.2·§15.3.2). 그 자원을 GET으로 읽을 수 있을 때만 싣는다(guidelines §12)", schema: { type: string, format: uri-reference } }
    RetryAfter: { description: "다시 보내기 전에 기다릴 초(RFC 9110 §10.2.3). 클라이언트는 ±20% 지터를 더한다(guidelines §5)", schema: { type: integer, minimum: 0 } }
    WWWAuthenticate: { description: "challenge(RFC 9110 §11.6.1). 스캐너 경로는 Bearer(RFC 6750 §3, 토큰이 틀리거나 만료면 error=\"invalid_token\"), 쿠키 경로는 Cookie, 입장 토큰 경로는 AdmissionToken이다. Cookie·AdmissionToken은 IANA 인증 방식 등록부에 없는 프로젝트 이름이다(2026-10-21 확인, guidelines §12, 추천 적용 2026-10-21, ADR-0081)", schema: { type: string } }
paths:
  /v1/queues/{eventId}/lobby-participants:
    post:
      tags: [queue]
      summary: 로비 입장(참가 토큰 발급)
      description: "FR-005. 본인확인 완료(`ticket:buy`) + 사람 확인(Cloudflare Turnstile) 결과 + 위험 점수. pid당 1장. 위험 점수가 높으면 201 참가 토큰에 verification: REQUIRED를 실어 추가 검증(FR-020)으로 보낸다(303 대신, ADR-0079 결정 4). POL-001·002·030"
      security: [{ fanCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/EventId' }, { $ref: '#/components/parameters/FirstVisitCookie' }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { humanCheckToken: { type: string }, deviceId: { type: string } } } } } }
      responses:
        '201': { description: 참가 토큰, content: { application/json: { schema: { $ref: '#/components/schemas/LobbyToken' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem', description: "이미 참가 토큰 있음(기존 기기에서 계속. 처음 기기를 쓸 수 없으면 로비 참가 취소 뒤 다시 참가, ADR-0060)" }
  /v1/queues/{eventId}/lobby-participants/me:
    delete:
      tags: [queue]
      summary: 로비 참가 취소(다른 기기에서 다시 참가하기 전, ADR-0060)
      description: "FR-007, POL-002. 팬 쿠키로 부르므로 처음 기기가 없어도 된다. 이 사람(pid)의 참가 토큰을 무효로 하고 1인 1순번 중복 확인 키를 지운다. 셔플 전이라 다시 참가해도 불리하지 않다. 처음 기기는 다음 요청에서 취소를 안내받는다. 로비가 닫힌 뒤(T=0)에는 409이고 대기 취소(DELETE …/entries/me)를 쓴다"
      security: [{ fanCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/EventId' }]
      responses: { '204': { description: 취소됨 }, '404': { $ref: '#/components/responses/Problem', description: 참가 토큰 없음 }, '409': { $ref: '#/components/responses/Problem', description: 로비가 닫힘 } }
  /v1/queues/{eventId}/pre-verifications:
    post:
      tags: [queue]
      summary: 사전 검증 토큰 발급(오픈 후 도착 경로의 사람 확인 통과 표시, 15분. 최초 발급 시각 유지, ADR-0041)
      description: "FR-006, FR-039, POL-003. 공연 상세에서 미리 호출. 만료가 가까우면 조용히 갱신. 본문에 사람 확인 토큰과 행동 신호 요약을 함께 보내고 trust-svc가 위험 점수를 낸다(행동 신호 요약을 보내는 경로, 추천 적용 2026-10-15, ADR-0065 결정 9). 교차 출처 JSON이라 사전 요청이 붙는다"
      security: [{ fanCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/EventId' }, { $ref: '#/components/parameters/FirstVisitCookie' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { humanCheckToken: { type: string, description: "Cloudflare Turnstile 응답 토큰(300초 1회용, trust-svc가 서버 검증)" }, deviceId: { type: string }, behaviorSummary: { $ref: '#/components/schemas/BehaviorSummary' } } } } } }
      responses:
        '201': { description: "preverifyToken. 위험 점수가 높으면 '추가 검증 필요' 표시를 서명해 넣고, 진입 때 번호를 발급하고 대기표의 verification: REQUIRED로 추가 검증에 보낸다(추천 적용 2026-10-14, ADR-0062. 303 대신 본문 필드, ADR-0079 결정 4). 요청에 최초 방문 쿠키가 없으면 대기열 API 엣지 함수가 이 응답에 __Host-peaket_fv를 싣는다(ADR-0065 결정 9)", headers: { Set-Cookie: { description: "__Host-peaket_fv(쿠키가 없던 브라우저에만)", schema: { type: string } } } }
        '400': { $ref: '#/components/responses/Problem', description: "본문 형식 오류(행동 신호 요약의 범위 밖 값 포함)" }
  /v1/queues/{eventId}/entries:
    post:
      tags: [queue]
      summary: 대기열 진입(오픈 후, 대기표 발급)
      description: "FR-006. 사전 검증 토큰 + 구매 권한 + pid 중복 확인 → INCR 순번. 오픈 직후 동시 도착 구간(2초 [가정])에 오픈 전 발급 토큰으로 도착하면 202 BATCHING + 결과 파일 경로(묶음 무작위, ADR-0041). T=0 피크 20만 RPS(NFR-001). PREQUEUE_SHUFFLE 공연도 오픈 뒤 진입을 받고 동시 도착 묶음 없이 로비 참가자 전원 뒤에 도착 순으로 번호를 준다(오픈 뒤 410 거절을 없앰, 소유자 결정 2026-10-14, ADR-0064). 그 회차의 판매 종료(공연 시작 24시간 전) 뒤에는 모든 정렬 방식에서 410 sale-ended"
      security: [{ fanCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/EventId' }]
      requestBody: { description: "본문은 JSON이다. 브라우저는 CORS 사전 요청이 생기지 않도록 같은 JSON 문자열을 `Content-Type: text/plain;charset=UTF-8`로 보내고 safelisted가 아닌 헤더(추적 헤더 포함)를 붙이지 않는다. 서버는 이 경로에서 text/plain과 application/json만 받고(그 밖 415) 본문을 JSON으로 검사한다. 위조 방지는 본문의 사전 검증 토큰, 게이트웨이의 Origin 확인(guidelines §9), SameSite=Strict 쿠키가 맡는다(추천 적용 2026-10-15, ADR-0065 결정 6)", content: { application/json: { schema: { type: object, required: [preverifyToken], properties: { preverifyToken: { type: string }, deviceId: { type: string } } } }, text/plain: { schema: { type: string, contentMediaType: application/json, contentSchema: { type: object, required: [preverifyToken], properties: { preverifyToken: { type: string }, deviceId: { type: string } } } } } } }
      responses:
        '201': { description: "대기표. 추가 검증 필요 표시가 있으면 verification: REQUIRED(ADR-0079 결정 4)", content: { application/json: { schema: { $ref: '#/components/schemas/QueueTicket' } } } }
        '202': { description: "BATCHING(동시 도착 구간 묶음, ADR-0041). 받는 규칙은 셔플 결과와 같다(ADR-0058)", content: { application/json: { schema: { $ref: '#/components/schemas/BatchingResponse' } } } }
        '409': { $ref: '#/components/responses/Problem', description: "이미 대기 중(1인 1순번), 또는 이 회차에 이미 입장함(ALREADY_ADMITTED, 다시 줄 설 수 없음, ADR-0062)" }
        '410': { description: "매진(엣지 정적 응답, Problem type sold-out, ADR-0081), 또는 그 회차의 판매 종료(공연 시작 24시간 전) 뒤 진입(Problem type sale-ended, 별칭 SALE_ENDED. 번호를 발급하지 않음, ADR-0064)", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '415': { $ref: '#/components/responses/Problem', description: "text/plain·application/json이 아닌 본문(ADR-0065)" }
        '503': { $ref: '#/components/responses/ServiceUnavailable', description: 차단기·Degraded(Retry-After) }
  /v1/queues/{eventId}/entries/me:
    delete:
      tags: [queue]
      summary: 대기 취소
      description: "FR-007, POL-002, POL-007. 팬 쿠키로 부르므로 처음 기기가 없어도 된다(다른 기기에서 다시 참가, ADR-0060). 번호를 빠진 번호로 표시하고 1인 1순번 중복 확인 키를 지운다. 다시 진입하면 맨 뒤 순번"
      security: [{ fanCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/EventId' }]
      responses: { '204': { description: 취소됨 } }
  /v1/queues/{eventId}/segment-states/{segment}.json:
    servers: [{ url: 'https://queue-files.peaket.example', description: "대기열 파일 배포(ADR-0058)" }]
    get:
      tags: [queue]
      summary: 구간별 대기 상태 파일(인증 없음, 쿠키 없음, CDN 1초 캐시)
      description: "FR-007, POL-007. NFR-002. 같은 구간 1,000명이 같은 파일. 매진 시 saleStatus=SOLD_OUT으로 폴링 중단(POL-015)"
      parameters: [{ $ref: '#/components/parameters/EventId' }, { name: segment, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: 상태, headers: { Retry-After: { schema: { type: integer }, description: 백프레셔 시 폴링 주기 지시 } }, content: { application/json: { schema: { $ref: '#/components/schemas/QueueState' } } } } }
  /v1/queues/{eventId}/shuffle-results/{hashPrefix}.json:
    servers: [{ url: 'https://queue-files.peaket.example', description: "대기열 파일 배포(ADR-0058)" }]
    get:
      tags: [queue]
      summary: 셔플 결과 파일(참가 토큰 해시 앞자리별, 인증 없음, CDN 캐시. 공개 예정 시각 뒤 토큰 해시로 정한 0~8초에 받음, ADR-0058)
      description: "FR-038, POL-005. 약 1,000개 파일, 각 '해시 → 순번' 약 1,000건"
      parameters: [{ $ref: '#/components/parameters/EventId' }, { name: hashPrefix, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: 'map of hash → seq' }, '404': { description: "셔플 전(정적 파일 404라 본문을 약속하지 않는다, guidelines §2). 대기열 파일 배포는 이 응답을 1초 [가정]만 캐시한다. 2초부터 두 배씩 최대 20초 간격으로 다시 묻는다(ADR-0058)" } }
  /v1/queues/{eventId}/batch-results/{hashPrefix}.json:
    servers: [{ url: 'https://queue-files.peaket.example', description: "대기열 파일 배포(ADR-0058)" }]
    get:
      tags: [queue]
      summary: 동시 도착 묶음 결과 파일(사전 검증 토큰 해시 앞자리별, 인증 없음, CDN 캐시. 결과 공개 예정 시각 뒤 토큰 해시로 정한 분산 창 안에 받음, ADR-0041·0058)
      description: "FR-006, ADR-0041. 각 '사전 검증 토큰 해시 → 순번'. 받는 규칙은 셔플 결과 파일과 같다"
      parameters: [{ $ref: '#/components/parameters/EventId' }, { name: hashPrefix, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: 'map of hash → seq' }, '404': { description: "묶음 셔플 전(정적 파일 404라 본문을 약속하지 않는다, guidelines §2). 404는 1초 [가정]만 캐시하고 2초부터 두 배씩 최대 20초 간격으로 다시 묻는다(ADR-0058)" } }
  /v1/queues/{eventId}/shuffle-proof:
    get:
      tags: [queue]
      summary: "셔플 검증 정보(커밋, drand 체인·라운드와 값, 알고리즘 버전, 머클 루트, 비상 처리 여부와 사유, 온세일 윈도우 종료 뒤 시드 원본)"
      description: "FR-038, POL-005, SCR-019"
      parameters: [{ $ref: '#/components/parameters/EventId' }]
      responses: { '200': { description: proof } }
  /v1/queues/{eventId}/admission:
    post:
      tags: [queue]
      summary: 입장 확정(첫 예매 요청, 입장 토큰 발급)
      description: "FR-008, POL-008·009. 대기표(또는 참가 토큰) 서명, 내 번호 ≤ serving, 빠진 번호(추가 검증 통과로 복귀한 대기표는 예외)·15분 만료 확인(복귀한 대기표는 차례와 통과 중 늦은 때부터, ADR-0062), 1인 1순번 재확인(사람별 입장 키, ADR-0056). 자리 없으면 SOON + Retry-After. 입장 자리 점수 = 첫 사용 기한 5분. 좌석 자동 배정 공연의 차례 직전 직접 확인(ADR-0043)에서 내 번호 > serving이면 NOT_YET + retryAfterMs(게이트웨이 레이트 리밋 적용)"
      security: [{ fanCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/EventId' }]
      requestBody: { description: "대기열 진입(entries)과 같다. 브라우저는 CORS 사전 요청이 생기지 않도록 같은 JSON 문자열을 `Content-Type: text/plain;charset=UTF-8`로 보내고 safelisted가 아닌 헤더를 붙이지 않는다. 서버는 이 경로에서 text/plain과 application/json만 받고(그 밖 415) 본문을 JSON으로 검사한다. 위조 방지는 본문의 대기표·참가 토큰(허용한 출처만 응답을 읽어 얻는 값), 게이트웨이의 Origin 확인(guidelines §9), SameSite=Strict 쿠키가 맡는다(추천 적용 2026-10-15, ADR-0065 결정 6)", content: { application/json: { schema: { type: object, properties: { queueTicket: { type: string }, lobbyToken: { type: string } } } }, text/plain: { schema: { type: string, contentMediaType: application/json, contentSchema: { type: object, properties: { queueTicket: { type: string }, lobbyToken: { type: string } } } } } } }
      responses:
        '200': { description: "NOT_YET·ADMITTED·SOON·VERIFYING(추가 검증 중, SCR-009로, ADR-0079 결정 4)", content: { application/json: { schema: { $ref: '#/components/schemas/AdmissionResult' } } } }
        '415': { $ref: '#/components/responses/Problem', description: "text/plain·application/json이 아닌 본문(ADR-0065)" }
        '409': { $ref: '#/components/responses/Problem', description: "같은 사람이 이 회차에 다른 대기표로 이미 입장함(DUPLICATE_ADMISSION, ADR-0056). 이 대기표의 번호는 빠진 번호로 처리" }
        '410': { $ref: '#/components/responses/Problem', description: "대기표 만료(15분 경과). 이 대기표의 1인 1순번 중복 확인 키를 지우고 rejoinAllowed(다시 줄 서기 가능 여부. 이 회차에 입장한 적이 있거나 판매 종료가 지났으면 false, 사전 셔플 공연도 같은 규칙, ADR-0062·ADR-0064)를 싣는다(ADR-0062). 또는 그 회차의 판매 종료(공연 시작 24시간 전) 뒤의 입장 확정(Problem type sale-ended, 입장 자리를 주지 않음, ADR-0064)" }
  /v1/queues/{eventId}/verification:
    post:
      tags: [queue]
      summary: 추가 검증(챌린지 + 본인확인 재통과) 제출과 이의 제기
      description: "FR-020, POL-006. 통과하면 원래 순번의 차례, 지났으면 다음 빈자리"
      security: [{ fanCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/EventId' }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { challengeToken: { type: string }, appeal: { type: string, maxLength: 4000, description: "설명·재검토 요청 내용. 화면·서버는 NFC 정규화 뒤 grapheme 1,000자로 센다. 비우면 설명 요청(추천 적용 2026-10-14, ADR-0062)" } } } } } }
      responses: { '200': { description: "통과·대기 상태. 통과면 원래 번호와, 차례가 지났을 때의 입장 유예 마감 시각(graceUntil)" }, '202': { description: 이의 제기 접수(사람 처리) } }
  /v1/events/{eventId}/seatmap-snapshot:
    get:
      tags: [seats]
      summary: 좌석 비트맵 스냅샷(압축 바이트). 입장 토큰의 첫 사용 → 구매 세션 시작
      description: "FR-009. 첫 사용(구매 세션 시작) 요청은 헤지하지 않고, 그 뒤의 스냅샷 재요청만 헤지 요청 허용(읽기). realtime-gw WebSocket은 asyncapi.yaml"
      security: [{ fanCookie: [], admissionToken: [] }]
      parameters: [{ $ref: '#/components/parameters/EventId' }, { name: section, in: query, schema: { type: string } }, { $ref: '#/components/parameters/ClientEphemeralKey' }]
      responses: { '200': { description: 스냅샷, content: { application/octet-stream: {} } }, '401': { $ref: '#/components/responses/Unauthorized', description: 입장 토큰 없음·만료 } }
  /v1/events/{eventId}/seatmap-layouts/{layoutVersion}.json:
    servers: [{ url: 'https://www.peaket.example', description: "공연 페이지 배포의 정적 파일(원본 S3, ADR-0063)" }]
    get:
      tags: [seats]
      summary: "회차 좌석맵 파일(공연장 캔버스·무대·구역 도형·라벨 위치·좌석 좌표·등급). 인증 없음, CDN 장기 캐시"
      description: "FR-009, NFR-012, seat-hold §2·§10(추천 적용 2026-10-14, ADR-0063). 배치를 바꾸면 layoutVersion이 바뀌어 새 경로가 되므로 Cache-Control: public, max-age=31536000, immutable이다. 판매 상태는 싣지 않는다(상태는 스냅샷 비트맵과 좌석 델타). 대기 중 차례가 가까워지면 미리 받고(K5), 입장 확정 응답의 seatmapLayoutPath와 다르면 다시 받는다"
      parameters: [{ $ref: '#/components/parameters/EventId' }, { name: layoutVersion, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: 좌석맵, content: { application/json: { schema: { $ref: '#/components/schemas/SeatMapLayout' } } } }, '404': { description: "없는 판(정적 파일 404라 본문을 약속하지 않는다, guidelines §2)" } }
  /v1/events/{eventId}/holds:
    post:
      tags: [seats]
      summary: 좌석 홀드(다중 좌석, 1인 한도 같은 Lua)
      description: "FR-010, POL-011·012, NFR-003 p99 50ms. 경합 패배는 409 + suggestedSeats(정상 응답으로 집계). 한도 초과 422. 구매 세션 요청 서명(X-Purchase-Seq·X-Purchase-Mac) 필수, 서명 불일치·일련번호 재사용은 401. 자동 배정 공연(POL-035, FR-050, ADR-0043)은 seatIds 대신 auto(희망 조건)를 보내고 서버가 1순위 연석, 분리 허용 시 1순위 분리, 2순위 순으로 골라 같은 Lua로 홀드한다. 모두 실패하면 아무 좌석도 홀드하지 않고 409 manual-selection-required. 자동 배정 공연은 이 요청이 입장 토큰의 첫 사용(구매 세션 시작)"
      security: [{ fanCookie: [], admissionToken: [] }]
      parameters: [{ $ref: '#/components/parameters/EventId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/PurchaseSeq' }, { $ref: '#/components/parameters/PurchaseMac' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/HoldRequest' } } } }
      responses:
        '201': { description: 홀드, content: { application/json: { schema: { $ref: '#/components/schemas/Hold' } } } }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem', description: 1인당 매수 한도 초과 }
        '400': { $ref: '#/components/responses/Problem', description: 희망 조건 검증 실패(없는 등급·같은 등급 중복·휠체어석 없는 등급) }
        '410': { description: "그 회차의 판매 종료(공연 시작 24시간 전) 뒤의 새 홀드(Problem type sale-ended). 판매 종료 전에 만든 홀드는 그대로 두고 지금 홀드 시간·1회 연장 안에서 결제를 마칠 수 있다(소유자 결정 2026-10-14, 진행 중 세션 허용은 추천 적용 2026-10-14, ADR-0064)", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '423': { $ref: '#/components/responses/Problem', description: 판매 일시정지(킬스위치) }
        '401': { $ref: '#/components/responses/Unauthorized', description: "입장 토큰 없음·만료, 구매 세션 요청 서명 불일치·일련번호 재사용" }
  /v1/holds/{holdId}:
    delete:
      tags: [seats]
      summary: 홀드 해제
      description: "FR-010, FR-042. 구매 세션 요청 서명 필수"
      security: [{ fanCookie: [], admissionToken: [] }]
      parameters: [{ name: holdId, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/PurchaseSeq' }, { $ref: '#/components/parameters/PurchaseMac' }]
      responses: { '204': { description: 해제 }, '401': { $ref: '#/components/responses/Unauthorized', description: "입장 토큰 없음·만료, 구매 세션 요청 서명 불일치·일련번호 재사용" } }
  /v1/holds/{holdId}/extension:
    post:
      tags: [seats]
      summary: 홀드 1회 연장(접근성 배려)
      description: "POL-012, NFR-020. 홀드 시간 제한은 WCAG 2.2.1의 실시간 예외로 판단(ADR-0060). 구매 세션 요청 서명 필수"
      security: [{ fanCookie: [], admissionToken: [] }]
      parameters: [{ name: holdId, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/PurchaseSeq' }, { $ref: '#/components/parameters/PurchaseMac' }]
      responses: { '200': { description: 연장된 홀드 }, '409': { $ref: '#/components/responses/Problem', description: 이미 연장함 }, '401': { $ref: '#/components/responses/Unauthorized', description: "입장 토큰 없음·만료, 구매 세션 요청 서명 불일치·일련번호 재사용" } }
  /v1/orders:
    post:
      tags: [orders]
      summary: 주문 생성(금액 서버 계산, 예매자 정보, 제3자 제공 동의)
      description: "FR-011, POL-013·023. 본인확인 상태 재확인(POL-001). 구매 세션 요청 서명 필수. 그 회차의 판매 종료(공연 시작 24시간 전) 뒤에는 판매 종료 전에 만든 유효한 홀드의 주문만 받고 그 밖은 410 sale-ended다. 그 주문의 결제 시도·접수는 홀드·결제 시간 안에서 지금처럼 받는다(추천 적용 2026-10-14, ADR-0064)"
      security: [{ fanCookie: [], admissionToken: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/PurchaseSeq' }, { $ref: '#/components/parameters/PurchaseMac' }]
      requestBody: { content: { application/json: { schema: { type: object, required: [holdId, buyer, consents], properties: { holdId: { type: string }, buyer: { type: object, properties: { name: { type: string }, phone: { type: string } } }, consents: { type: object, required: [provisionToSeller, salesTerms], properties: { provisionToSeller: { type: boolean, enum: [true], description: "판매자에게 개인정보 제공 동의(필수, 문안 planning/04 SCR-011 ③, 추천 적용 2026-10-14, ADR-0062)" }, salesTerms: { type: boolean, enum: [true], description: "판매 조건(정렬 방식·1인 1순번·매수 한도·취소 규정) 결제 직전 동의(필수, POL-004)" } } } } } } } }
      responses: { '401': { $ref: '#/components/responses/Unauthorized', description: "입장 토큰 없음·만료, 구매 세션 요청 서명 불일치·일련번호 재사용" }, '201': { description: 주문, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }, '409': { $ref: '#/components/responses/Problem', description: "탈퇴를 미루는 중인 계정(account.status WITHDRAWAL_PENDING, planning/03 §1.5 ⑧)" }, '410': { description: "판매 종료(공연 시작 24시간 전) 뒤 판매 종료 전 홀드가 아닌 주문(Problem type sale-ended, ADR-0064)", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } } }
  /v1/orders/{orderId}/payments:
    post:
      tags: [orders]
      summary: 결제 시도 시작(결제사 선택, 결제창 값 발급)
      description: "FR-011, POL-036, ADR-0044. 결제창을 열기 직전에 부른다. 선택 순서는 결제사 전환, 공연 지정, 플랫폼 기본. 접수 전의 이전 시도는 SUPERSEDED. 승인 요청을 보낸 주문은 409. 고른 결제사 채널이 서버 승인을 지원하지 않거나 비활성이면, 또 결제사 장애·채널 호출 상한으로 새 결제 진입을 멈춘 동안이면 503(새 결제 일시 정지, payment §2.2·§9. 이 동안 주문을 만들고 결제 접수 전인 홀드의 남은 시간은 멈춘다, ADR-0085). 구매 세션 요청 서명 필수"
      security: [{ fanCookie: [], admissionToken: [] }]
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/PurchaseSeq' }, { $ref: '#/components/parameters/PurchaseMac' }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { payMethod: { type: string, description: 포트원 채널 선택에 쓰는 결제수단. 토스는 위젯 안에서 고르므로 생략 } } } } } }
      responses: { '401': { $ref: '#/components/responses/Unauthorized', description: "입장 토큰 없음·만료, 구매 세션 요청 서명 불일치·일련번호 재사용" }, '201': { description: 결제 시도, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentAttempt' } } } }, '409': { $ref: '#/components/responses/Problem', description: "승인 요청을 이미 보낸 주문, 같은 주문의 결제창 단계 실패 3회 [가정] 초과(홀드 만료까지 PAYMENT_ATTEMPTS_EXCEEDED, payment §4.2)" }, '423': { $ref: '#/components/responses/Problem', description: "판매 일시정지(명령 3)" }, '503': { $ref: '#/components/responses/ServiceUnavailable', description: "결제사 사용 불가(새 결제 일시 정지). Problem의 holdRemainingSeconds에 멈춘 홀드 남은 시간(ADR-0085)" } }
  /v1/orders/{orderId}/payment-acceptance:
    post:
      tags: [orders]
      summary: 결제 접수(202). 결제사별 본문(토스 paymentKey·amount, 포트원 paymentId·paymentToken·txId)
      description: "FR-011, NFR-005 p99 150ms. pg와 활성 결제 시도의 결제사 대조(다르면 409) → 토스는 amount 대조, 포트원은 paymentId 대조 → 결제 참조 저장 → Saga 시작. 결제사 호출은 응답 밖(ADR-0015). 접수 뒤 주문은 그 결제사에 고정(ADR-0044). 구매 세션 요청 서명 필수"
      security: [{ fanCookie: [], admissionToken: [] }]
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/PurchaseSeq' }, { $ref: '#/components/parameters/PurchaseMac' }]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/PaymentAccept' } } } }
      responses: { '202': { description: 접수됨 }, '401': { $ref: '#/components/responses/Unauthorized', description: "입장 토큰 없음·만료, 구매 세션 요청 서명 불일치·일련번호 재사용" }, '400': { $ref: '#/components/responses/Problem', description: 금액 불일치·허용 밖 필드 }, '409': { $ref: '#/components/responses/Problem', description: "활성 결제 시도와 결제사·paymentId 불일치, 또는 같은 주문을 다른 탭·기기에서 이미 접수함(payment §4.2 2번)" }, '423': { $ref: '#/components/responses/Problem', description: "판매 일시정지(명령 3)" } }
  /v1/orders/{orderId}/payment-status:
    get:
      tags: [orders]
      summary: 결제 결과 long polling(최대 30초 대기, 추천 적용 2026-10-09)
      description: "FR-011, NFR-006 확정 p99 3초(Degraded 60초). UNKNOWN은 조회 API로 확정 후 알림"
      security: [{ fanCookie: [] }]
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: 상태, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentStatus' } } } } }
  /v1/tickets:
    get:
      tags: [tickets]
      summary: 마이 티켓 목록(월렛)
      description: "FR-012. 목록은 커서로 나눈다(guidelines §3). 월렛의 기기 저장은 nextCursor가 없을 때까지 받는다(추천 적용 2026-10-21, ADR-0081)"
      security: [{ fanCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { description: 티켓 한 페이지, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Ticket' } }, nextCursor: { type: [string, 'null'] } } } } } } }
  /v1/tickets/{ticketId}/device-keys:
    post:
      tags: [tickets]
      summary: 기기 공개키 등록(입장용 휴대폰 등록·재발급·부스). 이전 키 폐기
      description: "FR-012, POL-018, ADR-0025, ADR-0050 결정 2, ADR-0051 결정 10·11. ISSUE는 월렛의 '이 휴대폰을 입장용으로 등록'에서만 부르고, 입장 시작 뒤 ISSUE는 재인증 토큰이 있어야 하며 계정 이메일로 알린다. REISSUE는 입장 시작 전에만, 소셜 제공자 재인증 토큰이 있어야 하고 티켓당 24시간에 1회까지다. 재발급하면 계정 이메일과 이전 기기에 알린다. 입장 시작 뒤 REISSUE는 403이고 BOOTH만 된다. BOOTH는 그 티켓의 부스 허용(POST /v1/scanner/booth-authorizations)이 있고 허용 뒤 10분 안일 때만 된다. TRANSFER는 양도 수락·돌려주기·양도 회수로 보유자가 바뀐 뒤 새 보유자가 같은 버튼으로 처음 등록할 때이고 ISSUE와 같은 규칙을 따른다(키는 등록 버튼으로만 만든다). 등록·폐기는 scanner_change에 남는다. 응답에 keyId(SPKI SHA-256 앞 8바이트)를 준다"
      security: [{ fanCookie: [] }]
      parameters: [{ name: ticketId, in: path, required: true, schema: { type: string } }, { name: X-Reauth-Token, in: header, required: false, description: "REISSUE와 입장 시작 뒤 ISSUE일 때 필수(guidelines §7)", schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { type: object, required: [publicKeyJwk, reason], properties: { publicKeyJwk: { type: object }, reason: { type: string, enum: [ISSUE, REISSUE, TRANSFER, BOOTH] }, boothRequestId: { type: string, description: "BOOTH일 때 필수" } } } } } }
