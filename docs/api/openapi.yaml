  /v1/queues/{eventId}/admission:
    post:
      operationId: createQueueAdmission
      tags: [queue]
      x-peaket-roles: [fan]
      summary: 입장 확정(첫 예매 요청, 입장 토큰 발급)
      description: "FR-008, POL-008·009. 대기표(또는 참가 토큰) 서명, 내 번호 ≤ serving, 빠진 번호(추가 검증 통과로 복귀한 대기표는 예외)·15분 만료 확인(복귀한 대기표는 차례와 통과 중 늦은 때부터, ADR-0062), 1인 1순번 재확인(사람별 입장 키, ADR-0056). 자리 없으면 SOON + retryAfterSeconds이고, 그 번호를 곧 입장 대기열에 넣는다. 자리는 '빈자리 수 > 곧 입장 대기열에서 내 번호보다 작은 번호의 수'일 때만 주므로 낮은 번호부터 들어간다. 곧 입장 대기열에 있는 동안은 15분 만료를 세지 않는다(추천 적용 2026-10-28, ADR-0104). 입장 자리 점수 = 첫 사용 기한 5분. 좌석 자동 배정 공연의 차례 직전 직접 확인(ADR-0043)에서 내 번호 > serving이면 NOT_YET + retryAfterMs(게이트웨이 레이트 리밋 적용)"
      security: [{ fanCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/EventId' }]
      requestBody: { description: "대기열 진입(entries)과 같다. 브라우저는 CORS 사전 요청이 생기지 않도록 같은 JSON 문자열을 `Content-Type: text/plain;charset=UTF-8`로 보내고 safelisted가 아닌 헤더를 붙이지 않는다. 서버는 이 경로에서 text/plain과 application/json만 받고(그 밖 415) 본문을 JSON으로 검사한다. 위조 방지는 본문의 대기표·참가 토큰(허용한 출처만 응답을 읽어 얻는 값), 게이트웨이의 Origin 확인(guidelines §9), SameSite=Strict 쿠키가 맡는다(추천 적용 2026-10-15, ADR-0065 결정 6)", content: { application/json: { schema: { $ref: '#/components/schemas/AdmissionRequest' } }, text/plain: { schema: { type: string, contentMediaType: application/json, contentSchema: { $ref: '#/components/schemas/AdmissionRequest' } } } } }
      responses:
        '200': { description: "NOT_YET·ADMITTED·SOON·VERIFYING(추가 검증 중, SCR-009로, ADR-0079 결정 4)", content: { application/json: { schema: { $ref: '#/components/schemas/AdmissionResult' } } } }
        '415': { $ref: '#/components/responses/Problem', description: "text/plain·application/json이 아닌 본문(ADR-0065)" }
        '400': { $ref: '#/components/responses/Problem', description: "본문에 queueTicket·lobbyToken·priorityGrantId가 하나도 없음(추천 적용 2026-11-03, ADR-0183)" }
        '403': { $ref: '#/components/responses/Problem', description: "대기표(또는 참가 토큰)의 서명·회차·계정이 맞지 않음(Problem type queue-ticket-invalid, 추천 적용 2026-11-03, ADR-0183). 또는 본인확인 전이라 pid가 없음(identity-verification-required, 진입과 같다). 또는 예매 제한 중인 계정(Problem type booking-restricted). queue-svc가 입장 확정 Lua를 부르기 전에 그 계정의 예매 제한 사본(대기열 Redis q:rst:{account})을 읽어, ACTIVE이고 끝 시각 전이면 입장 자리와 곧 입장 대기열을 건드리지 않고 거절한다. 대기표는 그대로 두므로 차례 뒤 15분 안에 제한이 풀리면 같은 대기표로 입장할 수 있다. 사본이 없으면 제한이 없는 것으로 본다. 화면은 폴링을 멈추고 소명 화면(SCR-042)으로 잇는다(소유자 결정 2026-10-30, open-items 75번, 세부는 추천 적용 2026-10-30, docs/features/queue-admission.md §6 '예매 제한 확인', Q-T59)" }
        '409': { $ref: '#/components/responses/Problem', description: "같은 사람이 이 회차에 다른 대기표로 이미 입장함(DUPLICATE_ADMISSION, ADR-0056). 이 대기표의 번호는 빠진 번호로 처리" }
        '410': { $ref: '#/components/responses/Problem', description: "대기표 만료(15분 경과, Problem type queue-ticket-expired, 추천 적용 2026-11-03, ADR-0183). 이 대기표의 1인 1순번 중복 확인 키를 지우고 rejoinAllowed(다시 줄 서기 가능 여부. 이 회차에 입장한 적이 있거나 판매 종료가 지났으면 false, 사전 셔플 공연도 같은 규칙, ADR-0062·ADR-0064)를 싣는다(ADR-0062). 또는 그 회차의 판매 종료(공연 시작 24시간 전) 뒤의 입장 확정(Problem type sale-ended, 입장 자리를 주지 않음, ADR-0064), 또는 매진(SOLD_OUT) 뒤의 입장 확정(Problem type sold-out, 대기 참여는 매진으로 끝남, ADR-0122. 매진이 풀린 뒤에도 매진 때의 마지막 발급 번호 이하 대기표는 같은 sold-out). 또는 빠진 번호(추가 검증 중이 아닌 대기 취소·중복·기각 등)나 장애 전환으로 건너뛴 구간의 새 세대 번호(Problem type queue-ticket-removed, 추천 적용 2026-11-03, ADR-0183). 이의 기각으로 끝난 대기표면 확장 칸 removeReason BLOCKED를 싣는다(추천 적용 2026-11-10, BUILD_ORDER BOT-090, ADR-0259). priorityGrantId로 온 입장 확정은 판매 종료·매진에도 410이 아니고, 권리가 없거나 남의 것·만료·이미 산 것이면 같은 404 priority-grant-not-found다(추천 적용 2026-10-31, ADR-0171)" }
        '503': { $ref: '#/components/responses/ServiceUnavailable', description: "대기열 Redis가 잠시 안 되면 503 dependency-unavailable, Retry-After 1초 [가정]이다. 화면은 같은 대기표로 다시 보낸다(진입과 같다, 추천 적용 2026-11-03, ADR-0183). 참가 토큰인데 셔플 결과 키를 잃었으면 503 batching(Retry-After 2초 [가정])이고, 다시 쓰기를 기다려 같은 토큰으로 다시 보낸다(ADR-0231)" }
        '404': { $ref: '#/components/responses/Problem', description: "그 회차의 대기열이 열리지 않았음(queue-not-found, 일정 사본이 없거나 회차 ID 모양이 틀림, 추천 적용 2026-11-03, ADR-0183). 또는 priority-grant-not-found(priorityGrantId가 이 계정의 살아 있는 우선 구매 권리가 아님. 없음·남의 것·만료·이미 삼을 가리지 않는다, 추천 적용 2026-10-31, ADR-0171)" }
  /v1/queues/{eventId}/verification:
    get:
      operationId: getQueueVerification
      tags: [queue]
      x-peaket-roles: [fan]
      summary: 추가 검증 상태 읽기(SCR-009 새로고침 뒤 되살리기)
      description: "FR-020, POL-006. 이 계정의 이 회차 대기 참여(q:dup:{pid}:E의 대기표)가 지금 추가 검증 중인지·통과했는지·기각됐는지, 사유 범주, 이의 접수 여부를 준다. 화면은 몇 초 [가정] 간격으로 묻는다. 새로고침 뒤 화면은 이 탭의 본인확인 기억에 기대지 않는다: VERIFYING이면 바로 제출해 보고, 200 REVERIFY_REQUIRED면 본인확인 창을 연다(추천 적용 2026-11-10, BUILD_ORDER BOT-090, ADR-0259). '검토 중' 배지는 이의 심사를 하는 ops-svc가 생기는 BUILD_ORDER GAT-280 전까지 '접수됨'으로만 보인다(추천 적용 2026-11-10, BUILD_ORDER BOT-090, ADR-0259, docs/features/bot-defense.md §12)"
      security: [{ fanCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/EventId' }]
      responses:
        '200': { description: "추가 검증 상태", content: { application/json: { schema: { $ref: '#/components/schemas/QueueVerificationState' } } } }
        '403': { $ref: '#/components/responses/Problem', description: "본인확인 전이라 pid가 없음(identity-verification-required, 진입과 같다)" }
        '404': { $ref: '#/components/responses/Problem', description: "이 회차의 대기열이 열리지 않았음(queue-not-found), 또는 이 계정의 이 회차 대기 참여가 없음(queue-entry-not-found). 대기 참여가 있으면 404가 아니다(추천 적용 2026-11-10, BUILD_ORDER BOT-090, ADR-0259)" }
        '409': { $ref: '#/components/responses/Problem', description: "대기 참여는 있는데 추가 검증 칸이 없음(추가 검증으로 보내지 않았거나 대기 취소·1인 1순번 위반으로 지워짐). 제출과 같은 not-verifying이다(추천 적용 2026-11-10, BUILD_ORDER BOT-090, ADR-0259)" }
        '503': { $ref: '#/components/responses/ServiceUnavailable', description: "대기열 Redis가 잠시 안 됨(dependency-unavailable, Retry-After 1초 [가정])" }
    post:
      operationId: createQueueVerification
      tags: [queue]
      x-peaket-roles: [fan]
      summary: 추가 검증(챌린지 + 본인확인 재통과) 제출과 이의 제기
      description: "FR-020, POL-006. 통과하면 원래 순번의 차례, 지났으면 다음 빈자리. 서버는 먼저 휴대폰 본인확인 재통과를 identity-svc 결과로 본다(identity.proto CheckReverification: 추가 검증을 시작한 뒤 같은 사람으로 확정된 REVERIFY 본인확인이 있는지, 추천 적용 2026-10-30). 재통과가 있을 때만 challengeToken을 trust-svc ScoreRisk(맥락 VERIFICATION, 사람 확인만, action verify)로 서버 검증을 맡겨 한 번 쓰기 토큰을 태우지 않는다(재통과가 없으면 200 REVERIFY_REQUIRED, 추천 적용 2026-11-10, BUILD_ORDER BOT-090, ADR-0259). trust-svc나 identity-svc가 답하지 않으면 통과로 보지 않고 503으로 답한다(축소 운영의 '막지 않는다'는 대기열에 들어오는 일의 규칙이다). appeal은 trust-svc 없이도 받는다: queue-svc가 이의 내용을 대기열 Redis에 두고 CS 처리함 건 요청(asyncapi support.cases-requested, kind VERIFICATION_APPEAL)을 낸 뒤 202로 답한다(추천 적용 2026-10-30, docs/features/bot-defense.md §5.2·§12, ADR-0156 결정 8·14). 대기 참여는 이 계정의 q:dup:{pid}:E가 가리키는 대기표이고 본문으로 받지 않는다"
      security: [{ fanCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/EventId' }]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/QueueVerificationSubmitRequest' } } } }
      responses:
        '200': { description: "제출 결과(추천 적용 2026-11-10, BUILD_ORDER BOT-090, ADR-0259). 이미 통과한 대기 참여가 다시 보내면 같은 PASSED를 다시 준다", content: { application/json: { schema: { $ref: '#/components/schemas/QueueVerificationResult' } } } }
        '202': { description: "이의 제기 접수(사람 처리). CS 처리함 건 요청을 보낸 뒤 답한다. 이의는 한 대기 참여에 한 번이고, 이미 접수했으면 새 건을 만들지 않고 처음 값으로 같은 202를 준다(건 요청의 eventKey로 중복을 지운다, B-T10, 추천 적용 2026-10-30, docs/features/bot-defense.md §12. 본문은 추천 적용 2026-11-10, BUILD_ORDER BOT-090, ADR-0259)", content: { application/json: { schema: { $ref: '#/components/schemas/QueueVerificationAppealReceipt' } } } }
        '400': { $ref: '#/components/responses/Problem', description: "본문 형식이 틀림(about:blank): challengeToken과 appeal이 둘 다 있거나 둘 다 없음, appeal이 NFC 정규화 뒤 grapheme 1,000자를 넘음, appeal에 NUL(U+0000)·양방향 제어 글자(U+202A~U+202E, U+2066~U+2069)·0폭 글자(U+200B~U+200D, U+FEFF)가 있음(뒤의 것은 추천 적용 2026-11-10, BUILD_ORDER BOT-090, ADR-0259), deviceId 형식이 다름, 정하지 않은 칸(추천 적용 2026-11-10, BUILD_ORDER BOT-090, ADR-0259)" }
        '403': { $ref: '#/components/responses/Problem', description: "본인확인 전이라 pid가 없음(identity-verification-required, 진입과 같다)" }
        '404': { $ref: '#/components/responses/Problem', description: "이 회차의 대기열이 열리지 않았음(queue-not-found), 또는 이 계정의 이 회차 대기 참여가 없음(queue-entry-not-found)(추천 적용 2026-11-10, BUILD_ORDER BOT-090, ADR-0259)" }
        '409': { $ref: '#/components/responses/Problem', description: "추가 검증 중인 대기 참여가 아님(not-verifying). 이미 통과했으면 409가 아니라 200 PASSED를 다시 준다(추천 적용 2026-11-10, BUILD_ORDER BOT-090, ADR-0259)" }
        '410': { $ref: '#/components/responses/Problem', description: "그 회차의 판매 종료 뒤(sale-ended), 또는 이의 기각으로 끝난 대기 참여(queue-ticket-removed, 확장 칸 removeReason BLOCKED)(추천 적용 2026-11-10, BUILD_ORDER BOT-090, ADR-0259)" }
        '415': { $ref: '#/components/responses/Problem', description: "application/json이 아닌 본문" }
        '429': { $ref: '#/components/responses/TooManyRequests', description: "한 대기 참여의 challengeToken 제출이 10분에 5회 [가정]를 넘음(verification-submit-limited, Retry-After). 이의는 세지 않는다(추천 적용 2026-11-10, BUILD_ORDER BOT-090, ADR-0259). trust-svc 검증을 실제로 부를 때만 센다: 본인확인 재통과 확인이 통과한 뒤 ScoreRisk(VERIFICATION) 바로 앞에서 세고, trust-svc가 응답하지 않아 부르지 못한 503(서킷 열림·데드라인 넘김)과 사람 확인 서버 검증이 보류된 503이면 센 것을 되돌린다(REVERIFY_REQUIRED·PERSON_MISMATCH·400·409·410은 세지 않는다, 추천 적용 2026-11-10, BUILD_ORDER BOT-090, ADR-0259)" }
        '503': { $ref: '#/components/responses/ServiceUnavailable', description: "추가 검증 제출: trust-svc가 응답하지 않아(서킷 열림·데드라인 넘김) 사람 확인을 확인하지 못했거나, identity-svc가 응답하지 않아 본인확인 재통과를 확인하지 못했다(뒤의 것은 추천 적용 2026-10-30). 통과로 보지 않으며 화면은 '확인하지 못했습니다. 다시 시도해 주세요'(docs/design/d5 §5.9 '챌린지 실패')를 보인다. 화면은 받았던 challengeToken을 버리고 위젯을 다시 돌린 새 토큰으로만 다시 보낸다(쓴 토큰을 다시 보내면 Turnstile이 중복으로 거절해 실패가 기록된다). 자동 다시 보내기는 Retry-After 하한 위로 3번 [가정]까지이고 그 뒤에는 '다시 시도' 버튼을 보인다(추천 적용 2026-11-10, BUILD_ORDER BOT-090, ADR-0259). 이의 제기: 건 요청 발행에 실패했거나 발행 확인이 2초 [가정] 안에 오지 않았다(뒤의 것은 추천 적용 2026-11-10, BUILD_ORDER BOT-090, ADR-0259). 화면이 Retry-After를 지켜 다시 보낸다(추천 적용 2026-10-30, docs/features/bot-defense.md §5.2·§12)" }
  /v1/events/{eventId}/seatmap-snapshot:
    get:
      operationId: getEventSeatmapSnapshot
      tags: [seats]
      x-peaket-roles: [fan]
      summary: 좌석 비트맵 스냅샷(압축 바이트). 입장 토큰의 첫 사용 → 구매 세션 시작
      description: "FR-009. 첫 사용 요청이 구매 세션을 연다. 헤지 요청은 첫 요청과 재요청 모두 쓰지 않는다(ADR-0117). 재요청이 늦거나 503이면 브라우저가 Retry-After와 지터를 지켜 다시 묻고, 같은 구역은 한 번에 하나만 묻는다. realtime-gw WebSocket은 asyncapi.yaml"
      security: [{ fanCookie: [], admissionToken: [] }]
      parameters: [{ $ref: '#/components/parameters/EventId' }, { name: section, in: query, required: false, description: "구역 하나만 받을 때의 구역 색인(0 이상, 좌석 델타 SubscribeSections·SeatDeltaBatch의 sectionIndex와 같은 값, docs/frontend.md §4.4). 빼면 전체다. 그 회차 좌석맵 판의 구역 수 밖이거나 두 번 오면 400이다(추천 적용 2026-10-30, docs/features/seat-hold.md §7, docs/security/asvs/seat-hold.md 2.1.1·15.3.7)", schema: { type: integer, minimum: 0, maximum: 65535 } }, { $ref: '#/components/parameters/ClientEphemeralKey' }]
      responses: { '200': { description: 스냅샷, content: { application/octet-stream: {} } }, '400': { $ref: '#/components/responses/Problem', description: "section이 정수가 아니거나 구역 수 밖이거나 두 번 왔다(guidelines §11)" }, '401': { $ref: '#/components/responses/Unauthorized', description: "팬 쿠키 없음·만료(about:blank), 입장 토큰 없음·서명·만료·첫 사용 기한(iat + 5분) 지남·남의 토큰·이미 다른 임시 공개키로 쓴 토큰(admission-token-invalid), 그 입장 토큰의 구매 세션이 이미 끝남(purchase-session-ended)(BAS-040, 추천 적용 2026-11-09, BUILD_ORDER PRF-192). 어느 검사에 걸렸는지는 싣지 않는다" }, '403': { $ref: '#/components/responses/Problem', description: "주소의 회차 ID가 입장 토큰의 event와 다르다. gw-fan이 토큰 서명을 확인할 때 함께 본다. 구매 세션은 회차 하나에 묶인다(추천 적용 2026-10-30, docs/features/seat-hold.md §2, ADR-0159 결정 1)" }, '503': { $ref: '#/components/responses/ServiceUnavailable', description: "좌석 Redis 장애 조치 중이거나 그 회차 좌석 저장소가 준비되지 않음(Problem type seat-store-unavailable, Retry-After 2초 [가정], ADR-0121)" } }
  /v1/events/{eventId}/seatmap-layouts/{layoutVersion}.json:
    servers: [{ url: 'https://www.peaket.example', description: "공연 페이지 배포의 정적 파일(원본 S3, ADR-0063)" }]
    get:
      operationId: getEventSeatmapLayout
      tags: [seats]
      x-peaket-roles: [public]
      security: []
      summary: "회차 좌석맵 파일(공연장 캔버스·무대·구역 도형·라벨 위치·좌석 좌표·등급). 인증 없음, CDN 장기 캐시"
      description: "FR-009, NFR-012, seat-hold §2·§10(추천 적용 2026-10-14, ADR-0063). 배치를 바꾸면 layoutVersion이 바뀌어 새 경로가 되므로 Cache-Control: public, max-age=31536000, immutable이다. 판매 상태는 싣지 않는다(상태는 스냅샷 비트맵과 좌석 델타). 대기 중 차례가 가까워지면 미리 받고(K5), 입장 확정 응답의 seatmapLayoutPath와 다르면 다시 받는다"
      parameters: [{ $ref: '#/components/parameters/EventId' }, { name: layoutVersion, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: "좌석맵(열 단위 팬 파일)", content: { application/json: { schema: { $ref: '#/components/schemas/SeatMapColumns' } } } }, '404': { description: "없는 판(정적 파일 404라 본문을 약속하지 않는다, guidelines §2)" } }
  /v1/events/{eventId}/holds:
    post:
      operationId: createEventHold
      tags: [seats]
      x-peaket-roles: [fan]
      summary: 좌석 홀드(다중 좌석, 1인 한도 같은 Lua)
      description: "FR-010, POL-011·012, NFR-003 p99 50ms. 경합 패배는 409 + suggestedSeats(정상 응답으로 집계). 한도 초과 422. 구매 세션 요청 서명(X-Purchase-Seq·X-Purchase-Mac) 필수, 서명 불일치·일련번호 재사용은 401. 자동 배정 공연(POL-035, FR-050, ADR-0043)은 seatIds 대신 auto(희망 조건)를 보내고 서버가 1순위 연석, 분리 허용 시 1순위 분리, 2순위 순으로 골라 같은 Lua로 홀드한다. 모두 실패하면 아무 좌석도 홀드하지 않고 409 manual-selection-required. 자동 배정 공연은 이 요청이 입장 토큰의 첫 사용(구매 세션 시작)"
      security: [{ fanCookie: [], admissionToken: [] }]
      parameters: [{ $ref: '#/components/parameters/EventId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/PurchaseSeq' }, { $ref: '#/components/parameters/PurchaseMac' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/HoldRequest' } } } }
      responses:
        '201': { description: 홀드, content: { application/json: { schema: { $ref: '#/components/schemas/Hold' } } } }
        '409': { $ref: '#/components/responses/Problem', description: "경합 패배 seat-already-held(suggestedSeats, 정상 분기로 집계), 자동 배정 실패 manual-selection-required, 우선 구매 좌석 밖 priority-seat-only(입장 토큰에 prio가 있는데 그 권리의 좌석 밖을 잡으려 함, 판매 종료 전, 추천 적용 2026-10-31, ADR-0171), 방금 놓은 좌석 seat-recently-released: 같은 계정이 그 회차에서 방금 놓은(해제·만료·자동 배정 반납) 좌석을 30초 [가정] 안에 다시 잡으려 했다. 아무 좌석도 잡지 않고 recentlyReleasedSeats·reholdAvailableAt을 싣는다. 다른 사람은 그 좌석을 바로 잡을 수 있다. 다른 사람이 잡은 좌석이 섞이면 seat-already-held가 먼저다(소유자 결정 2026-10-30, open-items 67번, 세부는 추천 적용 2026-10-30, docs/features/seat-hold.md §5)" }
        '422': { $ref: '#/components/responses/Problem', description: "1인당 매수 한도 초과(purchase-limit-exceeded), 희망 조건 조합 규칙 위반(같은 등급 중복·휠체어석 없는 등급, invalid-auto-condition), 같은 멱등 키에 다른 좌석 선택(idempotency-key-reused, 지문은 정렬한 seatIds만으로 만든다, guidelines §4). 직접 선택 공연의 seatIds는 purchase-svc가 Lua를 부르기 전에 그 회차의 지금 좌석맵 판에서 좌석 색인으로 바꾸고, 없는 좌석·다른 회차의 좌석·판매 제외석·같은 좌석의 중복이 하나라도 있으면 아무 좌석도 잡지 않고 422 invalid-seat로 거절한다(화면이 고르지 못하게 하는 것만으로는 API를 직접 부르는 요청을 막지 못한다, 추천 적용 2026-10-30, docs/features/seat-hold.md §3, ADR-0159 결정 2)" }
        '400': { $ref: '#/components/responses/Problem', description: "본문 형식 오류(seatIds 0개·11개 이상·좌석 ID 모양, about:blank), 희망 조건 형식 오류(그 공연에 없는 등급, auto-condition-invalid), seatIds와 auto를 함께 보냄(auto-condition-invalid)." }
        '403': { $ref: '#/components/responses/Problem', description: "주소의 회차 ID가 입장 토큰의 event와 다르거나, 구매 세션에 적힌 회차와 다르다. 한가한 회차에서 받은 입장 토큰으로 다른 회차의 좌석을 잡지 못하게 한다(추천 적용 2026-10-30, docs/features/seat-hold.md §2, ADR-0159 결정 1). sale-policy-denied: 판매 정책 규칙이 이 요청(입장 토큰의 명단 키 lst·좌석 등급·매수·지금 시각)을 거부한다. 확장 칸 reason(PRESALE_ONLY·GRADE_NOT_ON_SALE)을 싣고 아무 좌석도 잡지 않는다. 규칙 한도를 넘는 매수는 1인 한도 초과와 같은 거절이다(Q-T36 ③, 추천 적용 2026-11-10, ADR-0261 결정 10)" }
        '410': { description: "그 회차의 판매 종료(공연 시작 24시간 전) 뒤의 새 홀드(Problem type sale-ended). 판매 종료 전에 만든 홀드는 그대로 두고 지금 홀드 시간·1회 연장 안에서 결제를 마칠 수 있다(소유자 결정 2026-10-14, 진행 중 세션 허용은 추천 적용 2026-10-14, ADR-0064). 예외: 입장 토큰에 클레임 prio(우선 구매(이의가 인정된 부정 예매 표 취소의 되돌림, POL-046 ⑦))가 있으면 판매 종료 뒤에도 그 권리의 우선 구매 보류 좌석 하나만 일반 홀드로 바꿔 잡는다. prio 토큰은 판매 종료 전후와 상관없이 언제나 그 좌석 하나만 잡고, 다른 좌석이면 판매 종료 전에는 409 priority-seat-only, 뒤에는 410이다(docs/features/seat-hold.md §5 '우선 구매 보류', 추천 적용 2026-10-31, ADR-0171)", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '423': { $ref: '#/components/responses/Problem', description: "판매 일시정지(킬스위치, 명령 3)나 판매 중지(ADR-0123). Problem type sale-paused(추천 적용 2026-11-04)" }
        '429': { $ref: '#/components/responses/TooManyRequests', description: "게이트웨이 로컬 한도 초과, 또는 purchase-svc 파드의 자기 과부하(server-busy, docs/architecture.md §5)" }
        '503': { $ref: '#/components/responses/ServiceUnavailable', description: "좌석 Redis 장애 조치 중이거나 그 회차 좌석 저장소가 준비되지 않음(세대 키 s:{event:E}:epoch 없음, Problem type seat-store-unavailable, Retry-After 2초 [가정]). 좌석을 잡지 않는다. 이미 잡은 홀드는 그대로다. 해제·연장·스냅샷·주문 생성·결제 시도 시작·결제 접수도 그 회차 좌석 샤드를 쓰지 못하면 같은 503이다(추천 적용 2026-10-28, ADR-0121)" }
        '504': { $ref: '#/components/responses/Problem', description: "좌석 Redis를 부르기 전에 요청의 남은 시간(x-peaket-deadline-ms)이 5ms [가정] 미만이라 부르지 않았다(Problem type deadline-exceeded, Retry-After 없음). 좌석을 잡지 않는다. 부른 뒤 마감을 넘긴 것은 504가 아니라 503 seat-store-unavailable이다(추천 적용 2026-11-04, BUILD_ORDER PRF-135, guidelines §5, docs/features/seat-hold.md §3 '좌석 Redis 호출 마감')" }
        '401': { $ref: '#/components/responses/Unauthorized', description: "팬 쿠키 없음·만료(about:blank, 화면은 토큰을 한 번 갱신한다), 입장 토큰 없음·만료이거나 구매 세션이 없거나 끝남(purchase-session-ended), 구매 세션 요청 서명 머리 없음·형식·불일치(purchase-signature-invalid), 일련번호 재사용(purchase-seq-reused). 어느 머리가 틀렸는지는 싣지 않는다. 화면 처리는 docs/frontend.md §4.1 '401'(BAS-040)" }
  /v1/events/{eventId}/purchase-session:
    delete:
      operationId: deleteEventPurchaseSession
      tags: [seats]
      x-peaket-roles: [fan]
      summary: 구매 세션 나가기(구매 화면을 나갈 때 세션을 끝냄)
      description: "FR-010, POL-009, 구매 세션 상태 기계 T9·T11(docs/planning/03 §2.2). 구매 세션 요청 서명 필수(X-Purchase-Seq·X-Purchase-Mac, 입장 토큰 머리). 그 구매 세션을 LEFT로 끝내고(세션 상태를 지우고 입장 토큰의 재사용 차단 표지는 남긴다) PurchaseSessionEnded를 낸다. 브라우저는 화면을 나갈 때 fetch keepalive로 서명해 보낸다(sendBeacon은 머리를 달 수 없다). 이미 끝난 세션의 요청은 구매 세션 확인에서 401이다. 같은 처리에서 그 세션의 홀드를 푼다(묶인 홀드는 빼고. 추천 적용 2026-11-09, ADR-0254). 추천 적용 2026-11-04, docs/features/seat-hold.md §2 '구매 세션 종료와 정리'"
      security: [{ fanCookie: [], admissionToken: [] }]
      parameters: [{ $ref: '#/components/parameters/EventId' }, { $ref: '#/components/parameters/PurchaseSeq' }, { $ref: '#/components/parameters/PurchaseMac' }]
      responses:
        '204': { description: 끝났다 }
        '401': { $ref: '#/components/responses/Unauthorized', description: "팬 쿠키 없음·만료(about:blank, 화면은 토큰을 한 번 갱신한다), 입장 토큰 없음·만료이거나 구매 세션이 없거나 끝남(purchase-session-ended), 구매 세션 요청 서명 머리 없음·형식·불일치(purchase-signature-invalid), 일련번호 재사용(purchase-seq-reused). 어느 머리가 틀렸는지는 싣지 않는다. 화면 처리는 docs/frontend.md §4.1 '401'(BAS-040)" }
