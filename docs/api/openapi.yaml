      summary: "그 팬의 문의·CS 처리함 건"
      description: "SCR-066 [문의·건], FR-057. GET /v1/ops/cases와 같은 모양이고 그 계정이 당사자인 건만 준다. cs_case에 계정 칸이 없어 target_ref로 잇는다: 문의(inquiry.account_id)와 소명(appeal.account_id)의 건이다 [가정]. 그 계정이 신고한 건(CONTENT_REPORT의 신고자)은 넣지 않고, 부정 거래 소명(FRAUD_CASE)은 지정된 조사관 밖으로 드러나지 않게 뺀다(authz-matrix §4.1). CS 담당자에게는 정산 건 가운데 정산 이의만 싣는 등 처리함과 같은 나눔을 쓴다(open-items 72번). Cache-Control: no-store"
      security:
        - opsCookie: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: "건 한 페이지"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CsCasePage' }
        '400': { $ref: '#/components/responses/Problem', description: "limit 100 초과" }
        '401': { $ref: '#/components/responses/Unauthorized', description: "액세스 토큰 없음·만료" }
        '403': { $ref: '#/components/responses/Problem', description: "허용 역할이 아님" }
        '404': { $ref: '#/components/responses/Problem', description: "없는 계정(not-found)" }
  # ---------- 3-11. 봇 표본 검토 기록(SCR-067) ----------
  /v1/ops/events/{eventId}/bot-review:
    get:
      operationId: getOpsEventBotReview
      tags: [ops]
      x-peaket-roles: [cs_agent, cs_lead]
      summary: "회차의 봇 표본 검토 진행(건수, 기한, 중간 결과)"
      description: "FR-049, POL-006, SCR-067, ADR-0174, docs/planning/03 §3 '봇 판정 표본 검토' 행, docs/features/bot-defense.md §13. reviewKind HUMAN_BASELINE(출시 뒤 실제 사람 기준 표본 검토, 두 묶음)이면 묶음별 진행 수와 결과 비율을 싣지 않고 interim은 null이다(그것으로 방금 본 세션의 묶음을 알 수 있어서, d5 §7.15). 표본이 아직 없으면 404다. 경로와 칸은 wbs 3.2.3이 정한다고 d5·bot-defense §20에 적혀 있어 이 초안이 먼저 정한다 [가정]. Cache-Control: no-store"
      security:
        - opsCookie: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: "검토 진행"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpsBotReview' }
        '401': { $ref: '#/components/responses/Unauthorized', description: "액세스 토큰 없음·만료" }
        '403': { $ref: '#/components/responses/Problem', description: "CS 담당자가 아님" }
        '404': { $ref: '#/components/responses/Problem', description: "이 회차의 표본이 없다(not-found)" }
  /v1/ops/events/{eventId}/bot-review-samples:
    get:
      operationId: listOpsEventBotReviewSamples
