              schema: { $ref: '#/components/schemas/SalePolicyDocument' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Problem', description: "not-found: 없는 공연과 다른 파트너 공연(같은 응답)" }
    put:
      operationId: putPartnerSalePolicy
      tags: [partner]
      x-peaket-roles: [partner_admin, partner_member]
      summary: "판매 정책 규칙 저장(규칙 배열 통째로, SCR-024)"
      description: "FR-022, POL-011, POL-032, SCR-024(추천 적용 2026-11-10, ADR-0261 결정 1~3·7). 모양은 이 계약이, 뜻 규칙(사실과 연산자 짝, 조건 10·깊이 3·규칙 8KB·공연당 20개 [가정], 회차·등급 참조, 1인 한도가 회차 한도 이하, 공제율 구간 겹침과 POL-032 상한)은 @peaket/validation/sale-policy가 정하고 화면과 서버가 같은 함수를 쓴다. 판정 차례: 404 → 409 production-suspended → 403 partner-admin-required(승인 이력이 있는데 파트너 실무자) → 428·412 → 422 sale-policy-invalid. 승인 이력이 없으면 production.sale_policy를 바로 고치고, 있으면 재승인 대상이라 변경분(production.pending_revision.salePolicy)에만 두고 pending true이며 APPROVED는 SUBMITTED로 바뀐다(ADR-0198 결정 3과 같은 규칙). 같은 트랜잭션에서 그 공연 판매 자격 명단의 잠금 시각을 다시 계산한다(이미 지난 잠금은 늦추지 않는다). 본문 상한은 플랫폼 기본(1MiB)이다. 성공·오류 모두 Cache-Control: no-store"
      security: [{ partnerCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/ProductionId' }, { $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SalePolicyPut' }
      responses:
        '200':
          description: 저장(새 판, 승인 이력이 있으면 pending true)
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalePolicySaved' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem', description: "partner-admin-required: 승인 이력이 있는 공연의 규칙을 파트너 실무자가 고침(재승인 대상, planning/03 §3)" }
        '404': { $ref: '#/components/responses/Problem', description: "not-found: 없는 공연과 다른 파트너 공연(같은 응답)" }
        '409': { $ref: '#/components/responses/Problem', description: "production-suspended: 판매 중지 중인 공연" }
        '412': { $ref: '#/components/responses/Problem', description: "precondition-failed: 다른 사람이 먼저 고침" }
        '422':
          description: "sale-policy-invalid. 확장 칸 errors(50개까지)에 규칙 차례(rule, 0부터)·JSON 경로(path)·코드(code: UNKNOWN_FACT·OPERATOR_MISMATCH·TOO_DEEP·TOO_MANY_CONDITIONS·RULE_TOO_LARGE·TOO_MANY_RULES·WINDOW_INVALID·UNKNOWN_ROUND·UNKNOWN_GRADE·LIST_KEY_INVALID·LIMIT_ABOVE_EVENT·RULE_KIND_INVALID·REFUND_BAND_OVERLAP·REFUND_RATE_ABOVE_CAP·TOO_MANY_REFUND_BANDS)를 싣는다. 사실 이름·명단 키 모양·규칙 수(21개 이상)·깊이(4 이상)도 칸 위치를 알리려 여기서 낸다. 모양이 틀린 본문(알 수 없는 칸·연산자·결과 종류, 범위 밖 수, 이름 길이)은 400이다. 시각은 초까지 적은 ISO 8601이고 회차 ID는 대소문자를 가리지 않는다(추천 적용, 2026-11-10, 리뷰, ADR-0261 결정 13)"
          content:
            application/problem+json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Problem' }
                  - type: object
                    properties:
                      errors:
                        type: array
                        maxItems: 50
                        items:
                          type: object
                          required: [rule, path, code]
                          properties:
                            rule: { type: integer, minimum: 0 }
                            path: { type: string, description: "규칙 안의 JSON 경로(예: /rule/if/all/0/has)" }
                            code: { type: string }
        '428': { $ref: '#/components/responses/Problem', description: "precondition-required: If-Match 없음" }
  /v1/partner/productions/{productionId}/sale-eligibility-lists:
    get:
      operationId: listPartnerSaleEligibilityLists
      tags: [partner]
      x-peaket-roles: [partner_admin, partner_member]
      summary: "판매 자격 명단 목록(키·이름·구성원 수·잠금·파기 시각, SCR-024)"
      description: "FR-022, SCR-024(추천 적용 2026-11-10, ADR-0261 결정 6·7). 명단 정보만 주고 구성원(회원 코드·계정)은 주지 않는다. 공연당 10개 [가정]까지라 나누지 않는다. 소속 파트너의 공연만(다른 파트너 공연과 없는 공연은 같은 404). Cache-Control: no-store"
      security: [{ partnerCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/ProductionId' }]
      responses:
        '200':
          description: 명단 목록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaleEligibilityListPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Problem', description: "not-found: 없는 공연과 다른 파트너 공연(같은 응답)" }
    post:
      operationId: createPartnerSaleEligibilityList
      tags: [partner]
      x-peaket-roles: [partner_admin]
      summary: "판매 자격 명단 올리기(한 줄에 회원 코드 하나, 같은 키면 바꿔 넣기)"
      description: "FR-022, POL-011, SCR-024, ADR-0062 결정 35·37(세부는 추천 적용 2026-11-10, ADR-0261 결정 6~9). 파트너 관리자만 한다(실무자 403). 파일은 UTF-8 CSV·텍스트이고 한 줄에 회원 코드(ADR-0235 결정 4의 XXX-XXXX) 하나다. 줄마다 끝의 CR·앞뒤 공백·겹따옴표 한 쌍을 버리고 대문자로 바꾼 뒤 모양을 본다. 빈 줄은 건너뛰고 행 번호는 센다(1부터). 같은 코드는 한 번만 반영한다. 회원 코드는 identity MemberCodeService.ResolveMemberCodes로 계정 ID로 바꾸고 가입을 마친 계정만 반영한다. 올린 파일은 저장하지 않고(메모리에서만 읽는다) 계정 ID 집합만 둔다. 결과는 반영 수와 형식 오류·없는 코드 줄의 수·행 번호(각 1,000개 [가정]까지), 파일 SHA-256만이고 계정 이름·연락처·계정 ID는 싣지 않는다. 감사 기록은 올린 계정·시각·건수·파일 SHA-256만이다. 그 명단 키를 쓰는 규칙의 판매 시작 24시간 전 [가정](잠금 시각)부터는 409다. 사전 요청이 생기도록 X-Requested-With 헤더가 있어야 받는다(ADR-0257 결정 8). 성공·오류 모두 Cache-Control: no-store"
      security: [{ partnerCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/ProductionId' }, { name: X-Requested-With, in: header, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [key, name, file]
              properties:
                key: { type: string, pattern: '^[a-z0-9-]{3,32}$', description: "명단 키(규칙의 buyer.lists 값)" }
                name: { type: string, minLength: 1, maxLength: 40, description: "표시 이름(팬에게 보이는 명단 이름)" }
                file: { type: string, format: binary, description: "8MiB [가정]·50만 줄 [가정]까지" }
      responses:
        '200':
          description: 반영 결과
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaleEligibilityUploadResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem', description: "partner-admin-required: 파트너 실무자가 올림(ADR-0062 결정 35)" }
        '404': { $ref: '#/components/responses/Problem', description: "not-found: 없는 공연과 다른 파트너 공연(같은 응답)" }
        '409': { $ref: '#/components/responses/Problem', description: "sale-eligibility-list-locked: 잠금 시각이 지났다(명단은 바뀌지 않는다, Q-T36 ⑤), production-suspended: 판매 중지 중인 공연, sale-eligibility-list-limit: 공연당 명단 10개 [가정]를 넘는 새 키" }
        '413': { $ref: '#/components/responses/Problem', description: "sale-eligibility-upload-too-large: 본문 8MiB [가정] 초과(읽기 전에 거절)" }
        '422': { $ref: '#/components/responses/Problem', description: "sale-eligibility-upload-rejected: 앞부분이 압축 파일(gzip·zip), UTF-8이 아님, 50만 줄 [가정] 초과. 어느 이유인지는 detail에 적는다. 키·이름 모양이 틀린 본문은 400이다" }
        '429': { $ref: '#/components/responses/TooManyRequests', description: "server-busy: 파드의 multipart 받기 칸막이(동시 4 [가정], 이미지·좌석맵 가져오기와 함께 씀)가 찼다(Retry-After, ADR-0257 결정 2). sale-eligibility-upload-limited: 이 공연의 올리기가 지난 한 시간에 20번 [가정]이다(회원 코드 대량 떠보기 막기, Retry-After는 가장 오래된 올리기가 한 시간 창에서 빠질 때까지의 초, 추천 적용, 2026-11-10, 리뷰, ADR-0261 결정 13)" }
        '504': { $ref: '#/components/responses/Problem', description: "deadline-exceeded: 회원 코드 변환 뒤 남은 시간이 구성원 넣기에 모자란다(경로 시한 95초 [가정]에서 20초 [가정] 미만, 아무것도 저장하지 않았다, 추천 적용, 2026-11-10, 리뷰, ADR-0261 결정 13)" }
        '503': { $ref: '#/components/responses/ServiceUnavailable', description: "member-code-lookup-unavailable: identity 회원 코드 변환이 실패했다(데드라인 2초 [가정], UNAVAILABLE·UNIMPLEMENTED 포함). 아무것도 저장하지 않았으므로 파일을 다시 올린다(Retry-After)" }
  /v1/partner/productions/{productionId}/sale-eligibility-lists/{listKey}:
