  /v1/identity/account:
    delete: { operationId: deleteIdentityAccount, tags: [identity], x-peaket-roles: [fan], summary: "탈퇴(모든 세션 종료, 계정 정보·연계정보 HMAC 파기, 거래 기록 분리 보관, 바로 재가입 가능)", description: "FR-017, POL-019, POL-023, POL-033. 소셜 제공자 재인증 토큰 필요(403 REAUTH_REQUIRED). 미사용 티켓이 있으면 confirmCancelUnusedTickets=true가 있어야 하고 티켓을 취소·환급한 뒤 탈퇴. 결제 확정 대기 주문이 있으면 202 후 처리. 받은 티켓·양도 요청·가상계좌 결제·입금 대기·양도 완료 티켓·굿즈 주문은 docs/planning/03 §1.5대로 처리하고, 가상계좌 결제 티켓을 지금 환급할 수 없으면 환급을 실행할 때까지 탈퇴를 미룬다(202, 추천 적용 2026-10-14, ADR-0062)", security: [{ fanCookie: [] }], parameters: [{ $ref: '#/components/parameters/ReauthToken' }], requestBody: { content: { application/json: { schema: { additionalProperties: false, type: object, properties: { confirmCancelUnusedTickets: { type: boolean }, acknowledgeFraudHold: { type: boolean, description: "보관 안내(409의 fraudHold)를 본 뒤 true로 다시 보낸다. 보관 행이 있는데 없으면 다른 확인할 것이 없어도 409다(추천 적용 2026-10-31, ADR-0173)" }, refundAccount: { $ref: '#/components/schemas/RefundAccount', description: "가상계좌 결제 티켓을 지금 환급할 때만. 저장하지 않고 결제사 취소 요청에 바로 넘긴다(POL-014)" } } } } } }, responses: { '204': { description: 처리됨 }, '403': { $ref: '#/components/responses/Problem', description: "재인증 없음·만료·재사용(REAUTH_REQUIRED)" }, '202': { description: "결제 결과·가상계좌 지연 환급 대기 뒤 처리" }, '409': { $ref: '#/components/responses/Problem', description: "탈퇴 전 확인 필요(type withdrawal-confirmation-required, 추천 적용 2026-11-04, BUILD_ORDER BOT-035. 결제한 티켓·받은 티켓·보낸·받은 양도 요청·가상계좌 지금/나중 환급·입금 대기·양도 완료 티켓·굿즈 주문 건수와 환급 예상액, 부정 예매 연계정보 대조값 보관 fraudHold(추천 적용 2026-10-31, ADR-0173))" } } }
  /v1/identity/providers:
