  /v1/ops/compliance/notices:
    get: { operationId: listOpsComplianceNotices, tags: [ops], x-peaket-roles: [operator, commander, cs_agent, cs_lead], summary: "통보 목록(SCR-032, 기본은 처리 기한이 가까운 순)", description: "FR-033, POL-024. 소유자 결정 2026-10-30(open-items 74번), 세부는 추천 적용 2026-10-30(docs/features/control-tower.md §9 '목록·상세 조회'). 목록은 커서로 나눈다(guidelines §3). sort 기본 DUE_ASC는 처리 기한이 가까운 순, LATEST는 최근 등록 순이다. 칸 가림은 docs/security/authz-matrix.md §4.1 '기관 요청' 행대로 서버가 역할에 맞춰 뺀다. CS 담당자는 view SUMMARY(ID, 기관, 종류, 기한, 상태)만, operator·commander는 view FULL이다. 칸을 더 달라는 매개변수는 무시한다. viewer는 이 기능이 없어 403이다(docs/planning/03 §3). Cache-Control: private, no-store", security: [{ opsCookie: [] }], parameters: [{ name: status, in: query, required: false, description: "쉼표로 이은 상태(없으면 전체)", style: form, explode: false, schema: { type: array, items: { type: string, enum: [OPEN, TAKEN_DOWN, WITHDRAWN] } } }, { name: sort, in: query, required: false, schema: { type: string, enum: [DUE_ASC, LATEST], default: DUE_ASC } }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }], responses: { '200': { description: "통보 한 페이지(items·nextCursor)", content: { application/json: { schema: { $ref: '#/components/schemas/ComplianceNoticePage' } } } }, '400': { $ref: '#/components/responses/Problem', description: "limit 밖, 모르는 상태·정렬 값" }, '401': { $ref: '#/components/responses/Unauthorized', description: "로그인 필요" }, '403': { $ref: '#/components/responses/Problem', description: "권한 없음(viewer)" } } }
    post: { operationId: createOpsComplianceNotice, tags: [ops], x-peaket-roles: [operator, commander], summary: 신고기관·수사기관 통보 문서 등록(24시간 타이머), description: "FR-033, POL-024. operator 이상만 등록한다(control-tower §9 '접근 권한 통제'). 쓰기는 application/json만 받는다. 본문 스키마는 추천 적용 2026-10-30(docs/security/asvs/control-tower.md 2.1.1)", parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }], security: [{ opsCookie: [] }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ComplianceNoticeCreate' } } } }, responses: { '201': { description: "통보와 처리 기한(noticeId, dueAt)", headers: { Location: { $ref: '#/components/headers/Location' } }, content: { application/json: { schema: { type: object, properties: { noticeId: { type: string, format: uuid }, dueAt: { type: string, format: date-time } } } } } }, '400': { $ref: '#/components/responses/Problem', description: "본문 형식 오류(모르는 필드, 길이·개수 밖)" }, '403': { $ref: '#/components/responses/Problem', description: "권한 없음(operator 미만)" }, '415': { $ref: '#/components/responses/Problem', description: "application/json이 아닌 본문" } } }
  /v1/ops/compliance/notices/{noticeId}:
    get: { operationId: getOpsComplianceNotice, tags: [ops], x-peaket-roles: [operator, commander, cs_agent, cs_lead], summary: "통보 상세(SCR-032)", description: "FR-033, open-items 74번(추천 적용 2026-10-30). 칸 가림은 목록과 같다(CS 담당자는 view SUMMARY). 없는 통보는 404다. Cache-Control: private, no-store", security: [{ opsCookie: [] }], parameters: [{ name: noticeId, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '200': { description: 통보, content: { application/json: { schema: { $ref: '#/components/schemas/ComplianceNotice' } } } }, '401': { $ref: '#/components/responses/Unauthorized', description: "로그인 필요" }, '403': { $ref: '#/components/responses/Problem', description: "권한 없음(viewer)" }, '404': { $ref: '#/components/responses/Problem', description: "없는 통보" } } }
  /v1/ops/compliance/notices/{noticeId}/documents:
    post: { operationId: createOpsComplianceNoticeDocument, tags: [ops], x-peaket-roles: [operator, commander], x-peaket-trace-rare: true, summary: "통보 공문 원본 올리기(PDF만)", description: "FR-033, control-tower §9 '자료 추출 및 법정 대장 관리'. operator 이상. multipart/form-data로 받고, 쿠키로 인증하는 쓰기라 gw-ops가 Origin을 확인한다(guidelines §9). 원본은 격리 버킷에 받고 악성 코드 검사가 끝나면 scanStatus가 바뀐다. 위협이 나오면 내려받기를 막고 SEV2로 알린다(추천 적용 2026-10-30, ADR-0159 결정 9)", security: [{ opsCookie: [] }], parameters: [{ name: noticeId, in: path, required: true, schema: { type: string, format: uuid } }], requestBody: { required: true, content: { multipart/form-data: { schema: { $ref: '#/components/schemas/ComplianceDocumentUpload' } } } }, responses: { '201': { description: "받음(scanStatus PENDING)", content: { application/json: { schema: { $ref: '#/components/schemas/ComplianceDocument' } } } }, '403': { $ref: '#/components/responses/Problem', description: "권한 없음" }, '404': { $ref: '#/components/responses/Problem', description: "없는 통보" }, '413': { $ref: '#/components/responses/Problem', description: "20MB [가정] 초과" }, '415': { $ref: '#/components/responses/Problem', description: "PDF가 아니다(확장자 .pdf와 첫 바이트 %PDF-가 함께 맞지 않음), 압축 파일" } } }
  /v1/ops/compliance/notices/{noticeId}/takedown:
    post: { operationId: createOpsComplianceNoticeTakedown, tags: [ops], x-peaket-roles: [operator, commander], summary: 통보에 적힌 게시물 노출 차단 + 결과 제출 기록, description: "FR-033. 명령 10은 이 경로로만 낸다(Command.type TAKEDOWN은 이 경로가 남기는 명령 기록의 종류다). 본문 reason(사유 필수, 2,000자)과 Idempotency-Key를 받는다. 차단하면 통보 status가 TAKEN_DOWN이 된다. 통보가 정식으로 철회되면 그 통보로 가린 게시물을 모두 되살리는 복원은 POST /v1/ops/compliance/notices/{noticeId}/withdrawal(operator·commander, 사유 필수, status WITHDRAWN, takedown_action.restored_at)로 따로 낸다. 권한 밖은 403, 없는 통보는 404, 이미 차단했거나 철회한 통보는 409다(추천 적용 2026-10-30, control-tower §3·§9)", security: [{ opsCookie: [] }], parameters: [{ name: noticeId, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' }], requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [reason], properties: { reason: { type: string, minLength: 1, maxLength: 2000, description: "사유. 제어 문자와 양방향 제어 문자는 지운다(ADR-0159 결정 11)" } } } } } }, responses: { '200': { description: 처리 }, '403': { $ref: '#/components/responses/Problem', description: "권한 없음" }, '404': { $ref: '#/components/responses/Problem', description: "없는 통보" }, '409': { $ref: '#/components/responses/Problem', description: "이미 차단했거나 철회한 통보" } } }
  /v1/ops/compliance/notices/{noticeId}/withdrawal:
