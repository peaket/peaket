        '200': { description: 파일 스트림 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Problem', description: "not-found: 없는 회차·다른 파트너 회차·정산서가 아직 없는 회차(같은 응답)" }
