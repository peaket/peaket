    get: { operationId: getPartnerProductionSeatmap, tags: [partner], x-peaket-roles: [partner_admin, partner_member], summary: "좌석맵 불러오기(SCR-022 에디터, 배치 층·좌석 층)", description: "FR-023(추천 적용 2026-10-14, ADR-0063). 이 공연의 배치본을 돌려준다(공연의 회차는 모두 이 배치본을 쓴다, ADR-0093). 아직 없으면 fromTemplate에 공연장 틀 ID를 넣어 틀을 복제한 저장 전 초안(layoutVersion 0)을 받는다. 변형과 목표 좌석 수를 반영한 템플릿에서 만들기는 같은 경로의 POST다(ADR-0066, 경로는 ADR-0081). 구역마다 에디터 전용 fillRule(좌석 채우기 규칙)이 함께 온다. 내보내기(SVG·JSON·CSV)는 이 값으로 브라우저가 만든다. 승인 이력이 있는 공연은 재승인 대기 판이 있으면 그 판을 준다. 배치본이 있으면 fromTemplate는 보지 않는다. ETag는 지금 판이고 Cache-Control: no-store다(추천 적용 2026-11-10, ADR-0260 결정 9·10). 응답 geometryLocked는 오픈 뒤 도형 잠금이고, 부채꼴·곡선 띠 도형은 저장한 arc 매개변수를 함께 돌려준다(추천 적용 2026-11-10, ADR-0264 결정 12·13)", security: [{ partnerCookie: [] }], parameters: [{ $ref: '#/components/parameters/ProductionId' }, { name: fromTemplate, in: query, required: false, description: "복제할 공연장 틀(venue kind TEMPLATE) ID", schema: { type: string } }], responses: { '200': { description: 좌석맵, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/SeatMapLayout' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/Problem', description: "not-found: 아직 배치본 없음(틀 선택이나 가져오기 전), 없거나 공개되지 않은 틀, 틀 자리에 넣은 배치본 ID, 없는 공연과 다른 파트너 공연(같은 응답)" } } }
