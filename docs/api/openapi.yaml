        '400': { $ref: '#/components/responses/Problem', description: "본문 형식 오류" }
        '409': { $ref: '#/components/responses/Problem', description: "passkey-exists, passkey-limit" }
        '410': { $ref: '#/components/responses/Problem', description: "invitation-step-invalid, passkey-registration-invalid(등록 시작부터 다시)" }
