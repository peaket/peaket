        - { name: tier, in: query, required: false, description: "좌석 등급", schema: { type: string, minLength: 1, maxLength: 30 } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: 명단 한 페이지
          content:
