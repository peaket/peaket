        ageRating: { type: [string, 'null'], minLength: 1, maxLength: 30 }
        runningMinutes: { type: [integer, 'null'], minimum: 1, maximum: 1440 }
        placeId: { type: string, format: uuid }
        newPlace:
          type: object
          additionalProperties: false
          required: [name, address]
          properties:
            name: { type: string, minLength: 1, maxLength: 100 }
            address: { type: string, minLength: 1, maxLength: 200 }
        artists:
          type: array
          maxItems: 20
          description: "칸마다 artistId와 name 가운데 꼭 하나(아니면 400)"
          items:
            type: object
            additionalProperties: false
            properties:
              artistId: { type: string, format: uuid }
              name: { type: string, minLength: 1, maxLength: 100 }
        aliases:
          type: array
          maxItems: 5
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 100 }
    PartnerEventUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: "회차 고치기 본문(보낸 칸만 바꾼다). 범위와 판정 순서는 PartnerEventCreate와 같다. 재입장은 PUT …/entry-policy로 바꾼다"
      properties:
        openAt: { type: string, format: date-time }
        lobbyMinutes: { type: integer, minimum: 0, maximum: 60 }
        entryOpensAt: { type: [string, 'null'], format: date-time }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        lobbyShuffle: { type: boolean }
        openBatch: { type: boolean }
        seatAssignment: { type: string, enum: [PICK, AUTO] }
        perPersonLimit: { type: integer, minimum: 1, maximum: 10 }
    SalePolicyFactInput:
      type: object
      additionalProperties: false
      maxProperties: 2
      description: "조건의 잎: 사실 하나와 연산자 하나(docs/design/d5 §6.7 문법 1판). 사실 이름(buyer.lists·round·grade·quantity), 사실과 연산자의 짝(buyer.lists는 has, round·grade는 eq·in, quantity는 eq·lte·gte), 명단 키 모양과 값의 참조는 @peaket/validation/sale-policy가 보고 422 errors에 칸 위치와 코드(UNKNOWN_FACT·OPERATOR_MISMATCH·LIST_KEY_INVALID)로 알린다(ADR-0261 결정 3·13, 추천 적용, 2026-11-10, 리뷰)"
      required: [fact]
      properties:
        fact: { type: string, description: "사실 이름(buyer.lists·round·grade·quantity). 목록 밖이면 422 UNKNOWN_FACT" }
        has: { type: string, description: "판매 자격 명단 키(영문 소문자·숫자·하이픈 3~32자). 모양이 틀리면 422 LIST_KEY_INVALID" }
        eq: { type: [string, integer], description: "회차 ID·등급 ID(글) 또는 매수(정수)" }
        in: { type: array, minItems: 1, maxItems: 60, items: { type: string } }
        lte: { type: integer, minimum: 1, maximum: 10 }
        gte: { type: integer, minimum: 1, maximum: 10 }
    SalePolicyCondition2Input:
      description: "조건의 둘째 층. 깊이 3을 생성기가 다루게 재귀 대신 층으로 펼쳤다(ADR-0261 결정 3). 셋째 층은 잎이거나 객체다: 깊이 4 이상은 계약이 막지 않고 평가 함수가 422 TOO_DEEP(칸 위치)로 알린다(추천 적용, 2026-11-10, 리뷰, ADR-0261 결정 13)"
      oneOf:
        - { $ref: '#/components/schemas/SalePolicyFactInput' }
        - { type: object, additionalProperties: false, required: [all], properties: { all: { type: array, minItems: 1, maxItems: 10, items: { $ref: '#/components/schemas/SalePolicyCondition3Input' } } } }
        - { type: object, additionalProperties: false, required: [any], properties: { any: { type: array, minItems: 1, maxItems: 10, items: { $ref: '#/components/schemas/SalePolicyCondition3Input' } } } }
        - { type: object, additionalProperties: false, required: [not], properties: { not: { $ref: '#/components/schemas/SalePolicyCondition3Input' } } }
    SalePolicyCondition3Input:
      description: "조건의 셋째 층: 잎(SalePolicyFactInput)이 맞는 자리다. 더 깊은 조건(all·any·not)도 계약은 받고 평가 함수가 422 TOO_DEEP로 알린다(추천 적용, 2026-11-10, 리뷰, ADR-0261 결정 13)"
      anyOf:
        - { $ref: '#/components/schemas/SalePolicyFactInput' }
        - { type: object, x-peaket-open-object: "깊이 4 이상의 조건은 계약이 모양을 보지 않고 평가 함수(@peaket/validation/sale-policy, 닫힌 Zod)가 422 TOO_DEEP와 칸 위치로 알린다(추천 적용, 2026-11-10, 리뷰, ADR-0261 결정 13 ⑾)", description: "깊이 4 이상의 조건(평가 함수가 TOO_DEEP)" }
    SalePolicyConditionInput:
      description: "규칙의 조건 if(깊이 3까지, 잎 10개 [가정]까지). 사실·연산자는 목록에 있는 것만이다"
      oneOf:
        - { $ref: '#/components/schemas/SalePolicyFactInput' }
        - { type: object, additionalProperties: false, required: [all], properties: { all: { type: array, minItems: 1, maxItems: 10, items: { $ref: '#/components/schemas/SalePolicyCondition2Input' } } } }
        - { type: object, additionalProperties: false, required: [any], properties: { any: { type: array, minItems: 1, maxItems: 10, items: { $ref: '#/components/schemas/SalePolicyCondition2Input' } } } }
        - { type: object, additionalProperties: false, required: [not], properties: { not: { $ref: '#/components/schemas/SalePolicyCondition2Input' } } }
    SalePolicyOutcomeInput:
      description: "규칙의 결과 then·else(셋 가운데 하나). limitPerPerson은 규칙이 걸리는 회차 1인 한도 이하다"
      oneOf:
        - { type: object, additionalProperties: false, required: [limitPerPerson], properties: { limitPerPerson: { type: integer, minimum: 1, maximum: 10 } } }
        - { type: object, additionalProperties: false, required: [deny], properties: { deny: { type: string, enum: [PRESALE_ONLY, GRADE_NOT_ON_SALE] } } }
        - { type: object, additionalProperties: false, required: [allow], properties: { allow: { type: boolean, enum: [true] } } }
    SalePolicyRefundBandInput:
      type: object
      additionalProperties: false
      description: "취소 공제율 구간 하나. daysLeft는 공연일까지 남은 달력일(공연장 현지, payment §4.1), rate는 정수 %이고 구간 안 모든 날의 POL-032 상한 이하다. 구간은 겹치지 않는다"
      required: [daysLeft, rate]
      properties:
        daysLeft:
          type: object
          additionalProperties: false
          required: [gte, lte]
          properties:
            gte: { type: integer, minimum: 0, maximum: 365 }
            lte: { type: integer, minimum: 0, maximum: 365 }
        rate: { type: integer, minimum: 0, maximum: 100 }
    SalePolicyRuleInput:
      type: object
      additionalProperties: false
      description: "판매 정책 규칙 하나(문법 1판, docs/design/d5 §6.7). rule과 refundFee 가운데 꼭 하나이고 during은 rule에만 쓴다. JSON으로 직렬화한 UTF-8이 8KB [가정] 이하다(ADR-0261 결정 3)"
      required: [version, name, rounds]
      properties:
        version: { type: integer, enum: [1] }
        name: { type: string, minLength: 1, maxLength: 40 }
        rounds:
          oneOf:
            - { type: string, enum: [ALL] }
            - { type: array, minItems: 1, maxItems: 60, uniqueItems: true, items: { type: string, format: uuid } }
        during:
          type: object
          additionalProperties: false
          required: [from]
          description: "from 포함·to 제외. 시간대를 붙인 ISO 8601만 받는다"
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
        rule:
          type: object
          additionalProperties: false
          required: [then]
          properties:
            if: { $ref: '#/components/schemas/SalePolicyConditionInput' }
            then: { $ref: '#/components/schemas/SalePolicyOutcomeInput' }
            else: { $ref: '#/components/schemas/SalePolicyOutcomeInput' }
        refundFee:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: '#/components/schemas/SalePolicyRefundBandInput' }
    SalePolicyRule:
      type: object
      description: "판매 정책 규칙 하나의 응답 모양(저장 때의 SalePolicyRuleInput과 같은 칸, 문법 1판 docs/design/d5 §6.7). 응답이라 열려 있다"
      required: [version, name, rounds]
      properties:
        version: { type: integer }
        name: { type: string }
        rounds:
          oneOf:
            - { type: string, enum: [ALL] }
            - { type: array, items: { type: string } }
        during: { type: object, properties: { from: { type: string, format: date-time }, to: { type: string, format: date-time } } }
        rule: { type: object, description: "SalePolicyRuleInput.rule과 같은 모양(if·then·else)" }
        refundFee: { type: array, items: { $ref: '#/components/schemas/SalePolicyRefundBand' } }
    SalePolicyRefundBand:
      type: object
      description: "취소 공제율 구간 하나의 응답 모양(SalePolicyRefundBandInput과 같은 칸)"
      required: [daysLeft, rate]
      properties:
        daysLeft: { type: object, required: [gte, lte], properties: { gte: { type: integer }, lte: { type: integer } } }
        rate: { type: integer }
    SalePolicyPut:
      type: object
      additionalProperties: false
      description: "판매 정책 규칙 저장 본문(규칙 배열 통째로). 공연당 20개 [가정]를 넘으면 계약이 아니라 평가 함수가 422 TOO_MANY_RULES로 알린다(추천 적용, 2026-11-10, 리뷰, ADR-0261 결정 13). 본문은 1MiB까지다"
      required: [rules]
      properties:
        rules: { type: array, items: { $ref: '#/components/schemas/SalePolicyRuleInput' } }
    SalePolicyDocument:
      type: object
      description: "판매 정책 규칙과 판(GET …/sale-policy). pending이 true면 재승인 대기 변경분의 규칙이다"
      required: [rules, version, pending]
      properties:
        rules: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/SalePolicyRule' } }
        version: { type: integer, minimum: 1 }
        pending: { type: boolean }
    SalePolicySaved:
      type: object
      required: [version, pending]
      properties:
        version: { type: integer, minimum: 1 }
        pending: { type: boolean }
    SaleEligibilityList:
      type: object
      description: "판매 자격 명단 하나의 정보(구성원은 싣지 않는다, ADR-0261 결정 6·7)"
      required: [key, name, memberCount, lockedAt, destroyDueAt, uploadedAt, version]
      properties:
        key: { type: string }
        name: { type: string }
        memberCount: { type: integer, minimum: 0 }
        lockedAt: { type: [string, 'null'], format: date-time, description: "잠금 시각(그 키를 쓰는 규칙의 가장 이른 during.from − 24시간 [가정]). 쓰는 규칙이 없으면 null" }
        destroyDueAt: { type: string, format: date-time, description: "파기 시각(공연의 마지막 판매 종료 + 1일 [가정])" }
        uploadedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    SaleEligibilityListPage:
      type: object
      required: [items]
      properties:
        items: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/SaleEligibilityList' } }
    SaleEligibilityUploadResult:
      type: object
      description: "판매 자격 명단 올리기 결과(Q-T36 ⑥). 계정 이름·연락처·계정 ID는 싣지 않는다"
      required: [listKey, version, applied, invalidLineCount, invalidLines, unknownLineCount, unknownLines, fileSha256]
      properties:
        listKey: { type: string }
        version: { type: integer, minimum: 1 }
        applied: { type: integer, minimum: 0, description: "반영한 계정 수(같은 코드는 한 번)" }
        invalidLineCount: { type: integer, minimum: 0 }
        invalidLines: { type: array, maxItems: 1000, items: { type: integer, minimum: 1 }, description: "형식 오류 줄의 행 번호(앞에서부터 1,000개 [가정]까지)" }
        unknownLineCount: { type: integer, minimum: 0 }
        unknownLines: { type: array, maxItems: 1000, items: { type: integer, minimum: 1 }, description: "없는 회원 코드 줄의 행 번호(앞에서부터 1,000개 [가정]까지)" }
        fileSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
    PartnerEventUpdated:
      type: object
      description: "회차 고치기 결과. pending이 true면 재승인 때까지 변경분에만 있다"
      required: [eventId, version, pending, warnings]
      properties:
        eventId: { type: string, format: uuid }
        version: { type: integer }
        pending: { type: boolean }
        warnings: { type: array, items: { $ref: '#/components/schemas/PartnerOpenWarning' } }
    PartnerProductSummary:
      type: object
      description: "상품 목록의 한 줄(SCR-023)"
      required: [productId, name, type, ticketLinked, status, price, fulfillments]
      properties:
        productId: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, description: "product_type.code(MERCH·PARKING·VIP·FAST_LANE 등)" }
        ticketLinked: { type: boolean }
        status: { type: string, enum: [DRAFT, NOT_STARTED, ON_SALE, SOLD_OUT, ENDED, HIDDEN], description: "저장 값과 판매 기간·재고로 계산한 값" }
        price: { type: integer, description: "상품가(원)" }
        shippingFee: { type: [integer, 'null'], description: "편도 배송비(원). 택배를 켜지 않았으면 null" }
        fulfillments: { type: array, items: { type: string, enum: [DELIVERY, PICKUP, WALLET] }, description: "받을 수 있는 수령 방식(총금액 표시 규칙의 재료)" }
        stockRemaining: { type: [integer, 'null'], description: "남은 재고. 한정 수량이 아니면 null" }
        stockTotal: { type: [integer, 'null'], description: "전체 한정 수량. 한정 수량이 아니면 null" }
        saleStartsAt: { type: [string, 'null'], format: date-time }
        saleEndsAt: { type: [string, 'null'], format: date-time }
        linkedProductionId: { type: [string, 'null'], format: uuid }
        linkedProductionTitle: { type: [string, 'null'] }
    PartnerProductPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PartnerProductSummary' } }
        nextCursor: { type: [string, 'null'] }
    PartnerProductCreate:
      type: object
      additionalProperties: false
      description: "상품 빌더 저장 본문(SCR-023, FR-024, docs/data.md product). 유형마다 다른 속성은 attributes에 둔다. 서버는 유형별 Zod 스키마로 다시 검사한다"
      required: [type, name, price, ticketLinked, fulfillments]
      properties:
        type: { type: string, description: "product_type.code(MERCH·PARKING·VIP·FAST_LANE 등)" }
        name: { type: string, minLength: 1, maxLength: 100 }
        price: { type: integer, minimum: 0, description: "상품가(원)" }
        shippingFee: { type: [integer, 'null'], minimum: 0, description: "편도 배송비(원). 택배를 켜지 않았으면 null" }
        returnShippingFee: { type: [integer, 'null'], minimum: 0, description: "단순 변심 반품 배송비(편도, 원)" }
        returnAddress: { type: [string, 'null'], maxLength: 500, description: "반품 받을 주소" }
        ticketLinked: { type: boolean, description: "티켓 연동 부가 상품인지" }
        linkedEventId: { type: [string, 'null'], format: uuid, description: "티켓 연동 부가 상품의 연결 회차" }
        limitedQty: { type: [integer, 'null'], minimum: 0, description: "한정 수량. null이면 한정하지 않음" }
        fulfillments: { type: array, minItems: 1, uniqueItems: true, items: { type: string, enum: [DELIVERY, PICKUP, WALLET] }, description: "받을 수 있는 수령 방식" }
        transferable: { type: boolean, default: false, description: "티켓과 함께 양도 허용" }
        status: { type: string, enum: [DRAFT, PUBLISHED], default: DRAFT, description: "저장 상태. PUBLISHED면 게시한다" }
        saleStartsAt: { type: [string, 'null'], format: date-time, description: "판매 시작 시각. null이면 제한 없음" }
        saleEndsAt: { type: [string, 'null'], format: date-time, description: "판매 종료 시각. null이면 제한 없음" }
        attributes: { type: object, additionalProperties: true, 'x-peaket-open-object': true, description: "유형별 속성(옵션 규격·특전 등). 유형 스키마가 검사한다" }
    PartnerProductDetail:
      allOf:
        - $ref: '#/components/schemas/PartnerProductSummary'
        - type: object
          required: [version, linkedEventId, returnShippingFee, returnAddress, limitedQty, transferable, attributes]
          properties:
            version: { type: integer, description: "고치기 If-Match에 쓰는 판" }
            linkedEventId: { type: [string, 'null'], format: uuid, description: "티켓 연동 부가 상품의 연결 회차" }
            returnShippingFee: { type: [integer, 'null'], minimum: 0 }
            returnAddress: { type: [string, 'null'], maxLength: 500 }
            limitedQty: { type: [integer, 'null'], minimum: 0 }
            transferable: { type: boolean }
            attributes: { type: object, additionalProperties: true }
    PartnerProductUpdate:
      type: object
      additionalProperties: false
      description: "상품 고치기 본문. 보낸 칸만 바꾼다"
      properties:
        type: { type: string, description: "product_type.code" }
        name: { type: string, minLength: 1, maxLength: 100 }
        price: { type: integer, minimum: 0 }
        shippingFee: { type: [integer, 'null'], minimum: 0 }
        returnShippingFee: { type: [integer, 'null'], minimum: 0 }
        returnAddress: { type: [string, 'null'], maxLength: 500 }
        ticketLinked: { type: boolean }
        linkedEventId: { type: [string, 'null'], format: uuid }
        limitedQty: { type: [integer, 'null'], minimum: 0 }
        fulfillments: { type: array, minItems: 1, uniqueItems: true, items: { type: string, enum: [DELIVERY, PICKUP, WALLET] } }
        transferable: { type: boolean }
        status: { type: string, enum: [DRAFT, PUBLISHED, HIDDEN] }
        saleStartsAt: { type: [string, 'null'], format: date-time, description: "판매 시작 시각. null이면 제한 없음" }
        saleEndsAt: { type: [string, 'null'], format: date-time, description: "판매 종료 시각. null이면 제한 없음" }
        attributes: { type: object, additionalProperties: true, 'x-peaket-open-object': true }
    PartnerMerchOrderStatsRow:
      type: object
      description: "상품별 표의 한 줄. 개수만"
      required: [productId, productName, orderCount, quantity, deliveryQuantity, pickupQuantity, cancelCount, returnCount]
      properties:
        productId: { type: string, format: uuid }
        productName: { type: string }
        orderCount: { type: integer }
        quantity: { type: integer }
        deliveryQuantity: { type: integer }
        pickupQuantity: { type: integer }
        cancelCount: { type: integer }
        returnCount: { type: integer, description: "판매자가 도착을 확인한 반품" }
    PartnerMerchOrderStatsPage:
      type: object
      description: "굿즈 주문 현황(SCR-023). 개인정보 없음"
      required: [totals, daily, items, nextCursor]
      properties:
        totals:
          type: object
          required: [orderCount, quantity, deliveryOrderCount, pickupOrderCount, cancelReturnCount]
          properties:
            orderCount: { type: integer }
            quantity: { type: integer }
            deliveryOrderCount: { type: integer }
            pickupOrderCount: { type: integer }
            cancelReturnCount: { type: integer, description: "취소와 도착을 확인한 반품의 합" }
        daily:
          type: array
          description: "일자별 주문 수(KST, 기간이 92일 [가정]까지라 나누지 않는다)"
          items:
            type: object
            required: [date, orderCount]
            properties:
              date: { type: string, format: date }
              orderCount: { type: integer }
        items: { type: array, items: { $ref: '#/components/schemas/PartnerMerchOrderStatsRow' } }
        nextCursor: { type: [string, 'null'] }
    PartnerMerchOrderItem:
      type: object
      description: "배송·반품 처리 목록의 한 줄(주문 항목). 받는 분은 가린 값만이고 주소는 싣지 않는다. docs/data.md merch_order_item"
      required: [itemId, orderId, version, status, fulfillment, productId, productName, ticketLinked, quantity, orderedAt, escrow]
      properties:
        itemId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        version: { type: integer, description: "If-Match 값(guidelines §12). 판 칸은 구현 때 더한다" }
        status: { type: string, enum: [READY, SHIPPED, DELIVERED, PICKED_UP, LOCKED, RETURN_REQUESTED, RETURN_RECEIVED, DISPUTED, CANCELLED, REFUNDED] }
        fulfillment: { type: string, enum: [DELIVERY, PICKUP, WALLET] }
        productId: { type: string, format: uuid }
        productName: { type: string, description: "주문 때의 상품 이름" }
        ticketLinked: { type: boolean, description: "부가 상품이면 반품 확인은 CS가 한다" }
        optionSummary: { type: [string, 'null'], description: "주문 때 고른 옵션을 한 줄로" }
