        '404': { $ref: '#/components/responses/Problem', description: "not-found: 공개되지 않은 회차와 없는 회차(같은 응답)" }
        '410': { $ref: '#/components/responses/Problem', description: "event-suspended: 판매 중지된 공연의 회차" }
  /v1/reviews/{reviewId}:
    get:
