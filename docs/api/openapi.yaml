        '404': { $ref: '#/components/responses/Problem', description: "없는 건이거나 결제자 본인의 건이 아니다(같은 404, not-found)" }
  /v1/partner/todo-summary:
    get:
      operationId: getPartnerTodoSummary
      tags: [partner]
      x-peaket-roles: [partner_admin, partner_member]
      summary: "파트너 홈 할 일 카드(SCR-062: 반려된 판매 승인, 정산 이의 기한, 미처리 이상 표시, 수락 안 한 스태프 초대)"
      description: "FR-022, FR-052, FR-062, FR-067, SCR-062, docs/design/d5 §1.6 16번. 소속 파트너 것만 센다(authz-matrix §3.3). 개수와 가장 이른 기한만 싣고 사람 단위 값은 없다. 세는 기준: 반려된 판매 승인은 saleReview REJECTED인 공연, 정산 이의 기한은 이의 기간 안의 NOTIFIED 정산서, 이상 표시는 status OPEN, 스태프 초대는 status INVITED이고 초대가 만료되지 않은 것. [가정] 네 값의 정본이 서로 다른 서비스(core·payment·ticket·identity)라 받는 서비스가 각각 물어 모으고, 한 곳이 답하지 않으면 그 칸만 null로 낸다. Cache-Control: no-store"
      security:
