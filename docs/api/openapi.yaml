      summary: "운영자·CS 초대 수락: 패스키 등록 시작(등록 옵션)"
      description: "FR-028, POL-020, I-T53 ①, ADR-0206. POST /v1/ops/auth/passkey-registrations와 같은 등록 옵션과 응답이고, 세션과 재인증 토큰 대신 acceptanceStep으로 부른다. RP ID는 console.peaket.example이고 사용자 확인 필수다. operator·commander는 필수이고 viewer·cs_agent·cs_lead는 건너뛸 수 있다(identity §6 'MFA' 행). 관제 배포의 허용 IP에서만 받고 gw-ops가 Origin을 확인한다. Cache-Control: no-store"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminInvitationStepBody' }
      responses:
        '201':
          description: "등록 옵션"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPasskeyRegistration' }
        '400': { $ref: '#/components/responses/Problem', description: "본문 형식 오류" }
        '409': { $ref: '#/components/responses/Problem', description: "invitation-step-out-of-order, passkey-limit" }
        '410': { $ref: '#/components/responses/Problem', description: "invitation-step-invalid" }
        '429': { $ref: '#/components/responses/TooManyRequests', description: "admin-login-busy" }
        '503': { $ref: '#/components/responses/ServiceUnavailable', description: "admin-login-unavailable" }
  /v1/ops/auth/invitation-passkeys:
    post:
      operationId: createOpsAuthInvitationPasskey
      tags: [ops]
      x-peaket-roles: [public]
      x-peaket-trace-rare: true
      summary: "운영자·CS 초대 수락: 패스키 등록 마치기"
      description: "FR-028, POL-020, I-T53 ①, ADR-0206. POST /v1/ops/auth/passkeys와 같은 확인이다: 출처는 관제 콘솔, RP ID는 console.peaket.example, 사용자 확인 필수. 관제 배포의 허용 IP에서만 받고 gw-ops가 Origin을 확인한다. Cache-Control: no-store"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminInvitationPasskeyCreate' }
      responses:
        '201':
          description: "등록한 패스키"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPasskey' }
        '400': { $ref: '#/components/responses/Problem', description: "본문 형식 오류" }
        '409': { $ref: '#/components/responses/Problem', description: "passkey-exists, passkey-limit" }
        '410': { $ref: '#/components/responses/Problem', description: "invitation-step-invalid, passkey-registration-invalid" }
        '422': { $ref: '#/components/responses/Problem', description: "passkey-attestation-invalid" }
        '429': { $ref: '#/components/responses/TooManyRequests', description: "admin-login-busy" }
        '503': { $ref: '#/components/responses/ServiceUnavailable', description: "admin-login-unavailable" }
  /v1/ops/auth/invitation-completions:
    post:
      operationId: createOpsAuthInvitationCompletion
      tags: [ops]
      x-peaket-roles: [public]
      x-peaket-trace-rare: true
      summary: "운영자·CS 초대 수락 마치기(복구 코드 보관 확인, 계정 활성화)"
      description: "FR-028, POL-020, identity §6, I-T53 ①, docs/planning/03 §2.7 A2. POST /v1/partner/auth/invitation-completions와 같은 규칙이다. operator·commander는 패스키가 하나 이상 있어야 활성화된다(commander는 분실·보호 잠금 재초대로 이 경로를 지난다). 관제 배포의 허용 IP에서만 받고 gw-ops가 Origin을 확인한다"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminInvitationCompletionCreate' }
      responses:
        '204':
          description: "활성화했다"
        '400': { $ref: '#/components/responses/Problem', description: "본문 형식 오류, 복구 코드 보관 확인 없음" }
        '409': { $ref: '#/components/responses/Problem', description: "passkey-not-registered, invitation-step-out-of-order" }
        '410': { $ref: '#/components/responses/Problem', description: "invitation-step-invalid" }
        '429': { $ref: '#/components/responses/TooManyRequests', description: "admin-login-busy" }
        '503': { $ref: '#/components/responses/ServiceUnavailable', description: "admin-login-unavailable" }
webhooks:
  partnerEvent:
    post:
      tags: [partner]
      summary: "파트너 웹훅(PEAKET이 파트너가 등록한 주소로 보냄). 이벤트 8종, 엔드포인트마다 구독한 type만"
      description: "FR-025, ADR-0053, 추천 적용 2026-10-14, ADR-0062. 쓰임새: 매출·회계 시스템에 판매·환급 금액 반영(order.confirmed·order.cancelled), 사내 메신저에 매진·회차 취소·연기 알림(event.sold_out·event.cancelled·event.postponed), 자사 홈페이지·SNS 공지 갱신(같은 이벤트), 정산 통지·입금 확인(statement.notified·payout.completed·payout.failed). 파트너 서버가 PEAKET에 직접 물어볼 서버용 API는 없어 본문의 금액·수·ID만 쓰고 자세한 내용은 콘솔에서 본다(나중 Phase로 미룸, 추천 적용 2026-10-19, ADR-0066). Standard Webhooks 형식이다. 헤더는 webhook-id(사건 키, 재전송에도 같음), webhook-timestamp(시도 시각, 유닉스 초), webhook-signature(v1, 뒤에 base64 HMAC-SHA256(비밀, id.timestamp.본문))다. 등록은 POST /v1/partner/webhooks. 받는 쪽이 2xx로 답하지 않으면 지수 백오프로 다시 보내고 끝내 실패하면 DLQ에 둔다(guidelines §8)"
      parameters: [{ name: webhook-id, in: header, required: true, schema: { type: string } }, { name: webhook-timestamp, in: header, required: true, schema: { type: string } }, { name: webhook-signature, in: header, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PartnerWebhookEvent' } } } }
      responses: { '2XX': { description: "받음" } }
