openapi: 3.1.0
info:
  title: PEAKET Public API
  version: 1.0.0-draft
  description: |
    독자와 용도: 프론트엔드·파트너·스캐너 개발자가 REST 계약을 확인할 때 읽는다. 원본 계약은 peaket-contracts에서 버전 패키지로 배포한다.
    원문 출처: 설계서 §6(대기열, 입장 흐름, 좌석, 결제, 굿즈, 관제, 오프라인, 계정·인증), 5장 라우트, 18장 REST, 24장 Webhook. 엔드포인트 경로·스키마는 [보완]이고 planning/02 FR을 description에 적는다.
    기준 기획 버전: v1.0.
    규칙: docs/api/guidelines.md. 오류는 RFC 9457 Problem(오류 식별자는 type URI, guidelines §2). Idempotency-Key는 IdempotencyKey 파라미터가 붙은 쓰기 작업에 필수(guidelines §4). 재인증이 필요한 작업은 X-Reauth-Token 헤더(guidelines §7). 목록은 cursor·limit·nextCursor(guidelines §3). 경로 이름·검색·부분 응답·메서드와 상태 코드는 guidelines §10~§12(ADR-0081). 4xx·5xx 응답은 모두 Problem 본문이고(기기 승인 토큰 엔드포인트의 400은 OAuth 오류이고, 대기열 파일 배포의 정적 파일 404는 본문을 약속하지 않는다), 401은 WWW-Authenticate, 429·503은 Retry-After를 싣는다.
servers:
  - url: https://queue.peaket.example
    description: gw-queue (로비·대기열·입장 확정). 대기열 API 배포(CloudFront). 대기 상태·셔플 결과 파일은 queue-files 호스트(대기열 파일 배포, ADR-0058). 게이트웨이마다 호스트를 따로 둔다(추천 적용 2026-10-09, R-11). 교차 출처 응답은 Access-Control-Allow-Origin https://www.peaket.example에 Allow-Credentials true, Vary Origin, Expose-Headers Retry-After·Date를 낸다(추천 적용 2026-10-15, ADR-0065 결정 7. Date는 브라우저 시계 보정, 추천 적용 2026-10-21, ADR-0079 결정 3)
  - url: https://queue-files.peaket.example
    description: 대기열 파일 배포(CloudFront, 인증·쿠키 없음). 대기 상태 파일, 셔플 결과 파일, 묶음 결과 파일. 원본 gw-queue, 대체 원본 S3(ADR-0058). 소비자 웹 스크립트가 읽도록 이 배포와 S3 대체 원본은 Access-Control-Allow-Origin https://www.peaket.example과 Access-Control-Expose-Headers Retry-After·Date를 내고(Date는 ADR-0079 결정 3) Credentials는 두지 않는다(추천 적용 2026-10-15, ADR-0065 결정 7)
  - url: https://api.peaket.example
    description: gw-fan. 교차 출처 응답은 Access-Control-Expose-Headers에 Date를 더해 브라우저가 서버 시각을 읽게 한다(추천 적용 2026-10-21, ADR-0079 결정 3)
  - url: https://partner-api.peaket.example
    description: gw-partner (외부 PG 웹훅 수신 포함)
  - url: https://ops-api.peaket.example
    description: gw-ops (허용 IP·VPN)
  - url: https://scanner-api.peaket.example
    description: "gw-scanner (mTLS, CloudFront 미경유). 대안 B의 기기 등록 경로(POST /v1/scanner/device-enrollments)는 기기 자격 전이라 mTLS 없이 DPoP로 받는다(추천 적용 2026-10-14, ADR-0062). 교차 출처 응답은 Access-Control-Expose-Headers에 Date를 더한다(스캐너 시계 보정, ADR-0079 결정 3)"
tags:
  - { name: queue, description: 로비·대기열·입장 확정 (gw-queue) }
  - { name: seats, description: 좌석 스냅샷·홀드 (gw-fan) }
  - { name: orders, description: 주문·결제 (gw-fan) }
  - { name: tickets, description: 월렛·양도·티켓 연동 부가 상품 (gw-fan) }
  - { name: shop, description: 굿즈 (gw-fan) }
  - { name: catalog, description: "홈 피드·장르별 랭킹 파일·검색·연관 검색어 (gw-fan, 인증 없음, CDN 캐시, ADR-0063)" }
  - { name: reviews, description: "관람 후기·후기 사진·게시물 신고 (gw-fan, ADR-0063·0066)" }
  - { name: support, description: "고객 문의 (gw-fan, core-svc support 모듈, ADR-0066)" }
  - { name: identity, description: 본인확인·세션·토큰 (gw-fan·gw-partner·gw-ops) }
  - { name: partner, description: 파트너 콘솔 (gw-partner) }
  - { name: ops, description: 관제 (gw-ops) }
  - { name: scanner, description: 게이트 스캐너 (gw-scanner) }
  - { name: webhooks, description: 외부 수신 (gw-partner) }
components:
  securitySchemes:
    fanCookie: { type: apiKey, in: cookie, name: __Secure-peaket_at, description: "팬 액세스 토큰(팬 토큰 키 ES256, typ at+jwt, 15분). Secure·HttpOnly·SameSite=Strict, Domain=peaket.example(소비자 웹 앱 서버·gw-fan·gw-queue가 함께 쓰는 쿠키라 __Host- 대신 __Secure-, 추천 적용 2026-10-15, docs/features/identity.md §3). gw-fan·gw-queue가 검증(ADR-0050)" }
    refreshCookie: { type: apiKey, in: cookie, name: __Secure-peaket_rt, description: "팬 리프레시 토큰(불투명 참조 토큰). Secure·HttpOnly·SameSite=Strict, Domain=peaket.example, Path=/v1/identity/access-tokens(소비자 웹 앱 서버가 로그인 때 주고 gw-fan의 토큰 갱신이 읽음, 추천 적용 2026-10-15)" }
    admissionToken: { type: apiKey, in: header, name: X-Admission-Token, description: "입장 토큰(ES256, typ admission+jwt, aud purchase, 한 구매 세션 전용)" }
    partnerCookie: { type: apiKey, in: cookie, name: __Secure-peaket_partner_at, description: "파트너 액세스 토큰(관리 토큰 키 ES256, typ at+jwt, aud partner). Secure·HttpOnly·SameSite=Strict, Domain=peaket.example(파트너 콘솔 앱 서버가 주고 gw-partner가 읽는 공유 쿠키, 추천 적용 2026-10-15). gw-partner가 검증(ADR-0050)" }
    opsCookie: { type: apiKey, in: cookie, name: __Host-peaket_ops_at, description: "운영자 액세스 토큰(관리 토큰 키 ES256, typ at+jwt, aud ops). Secure·HttpOnly·SameSite=Strict, Domain 없음·Path=/(gw-ops의 운영자 로그인 응답이 주고 gw-ops만 읽음, 추천 적용 2026-10-15). gw-ops가 검증(ADR-0050)" }
    partnerRefreshCookie: { type: apiKey, in: cookie, name: __Secure-peaket_partner_rt, description: "파트너 리프레시 토큰(불투명 참조 토큰, 회전·재사용 탐지). Secure·HttpOnly·SameSite=Strict, Domain=peaket.example, Path=/v1/partner/auth/access-tokens(파트너 콘솔 앱 서버가 로그인 때 주고 gw-partner의 토큰 갱신이 읽음. 추천 적용 2026-10-15, ADR-0065 결정 11)" }
    opsRefreshCookie: { type: apiKey, in: cookie, name: __Host-peaket_ops_rt, description: "운영자 리프레시 토큰(불투명 참조 토큰, 회전·재사용 탐지). Secure·HttpOnly·SameSite=Strict, Domain 없음·Path=/(gw-ops의 운영자 로그인·토큰 갱신 응답이 주고 gw-ops는 토큰 갱신 경로에서만 읽음. __Host-는 Path=/라 경로를 좁히지 못해 모든 ops-api 요청에 실린다. 추천 적용 2026-10-15, ADR-0065 결정 11)" }
    deviceMtls: { type: mutualTLS, description: 스캐너 기기 인증서 }
    staffToken: { type: http, scheme: bearer, bearerFormat: JWT, description: "스캐너 현장 스태프 세션 토큰(현장 스태프 토큰 키 ES256, aud scanner, 회차·역할, 만료 = 역할 유효 끝). gw-scanner만 검증. ADR-0030, ADR-0050" }
  parameters:
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
    PurchaseSeq: { name: X-Purchase-Seq, in: header, required: true, description: "구매 세션 요청 일련번호. 요청마다 1씩 올리고 서버는 마지막 번호보다 큰 것만 받는다(ADR-0050 결정 8)", schema: { type: integer, minimum: 1 } }
    PurchaseMac: { name: X-Purchase-Mac, in: header, required: true, description: "HMAC-SHA256(구매 세션 요청 인증 키, 이어 붙인 입력)의 채움 없는 base64url. 입력은 메서드, LF, 경로와 쿼리(호스트 없음), LF, 일련번호(10진수), LF, base64url(SHA-256(본문 바이트))를 이은 UTF-8 바이트다. 키는 HKDF-SHA256(ECDH 공유 비밀, salt = 입장 토큰 jti, info = PEAKET-purchase-v1)로 만든 HMAC-SHA256 키이고, 브라우저는 추출 불가 키로 IndexedDB에 두어 결제창 복귀·새로고침에도 이어 쓴다(추천 적용 2026-10-21, ADR-0079 결정 6, docs/frontend.md §5.3)", schema: { type: string } }
    EventId: { name: eventId, in: path, required: true, schema: { type: string } }
    FirstVisitCookie: { name: __Host-peaket_fv, in: cookie, required: false, description: "최초 방문 쿠키(봇 방어의 쿠키 나이 신호). 대기열 API 엣지 함수가 쿠키가 없는 브라우저의 사전 검증 응답에 처음 싣고 HMAC-SHA256(최초 방문 쿠키 서명 키)으로 서명한다. Secure·HttpOnly·SameSite=Strict, Domain 없음·Path=/(queue 호스트만 읽음). 공연 페이지는 CDN 캐시라 사람마다 다른 쿠키를 싣지 않는다. queue-svc는 서명(상수 시간 비교)을 확인하고 발급 시각으로 쿠키 나이를 계산해 위험 점수에 넘긴다. 서명이 맞지 않으면 쿠키가 없는 것으로 본다(추천 적용 2026-10-15, ADR-0065 결정 9, docs/features/queue-admission.md §7)", schema: { type: string } }
    ReauthToken: { name: X-Reauth-Token, in: header, required: true, description: "재인증 토큰(typ reauth+jwt, 5분 1회용). 팬·관리 계정 모두 이 헤더로만 받는다(guidelines §7)", schema: { type: string } }
    Cursor: { name: cursor, in: query, required: false, description: "불투명 커서(이전 응답의 nextCursor, guidelines §3)", schema: { type: string } }
    Limit: { name: limit, in: query, required: false, description: "한 번에 받을 건수(최대 100, guidelines §3)", schema: { type: integer, minimum: 1, maximum: 100 } }
    ClientEphemeralKey: { name: X-Client-Ephemeral-Key, in: header, required: false, description: "구매 세션 요청 인증 키 합의용 클라이언트 임시 공개키(P-256, 비압축 점의 base64url). 직접 선택 공연은 입장 토큰의 첫 사용인 스냅샷 요청에 필수이고 그 뒤에는 무시한다(ADR-0050 결정 8)", schema: { type: string } }
  schemas:
    Problem:
      type: object
      description: "RFC 9457 Problem Details(guidelines §2). 오류 식별자는 type URI다. 아래 선택 확장 필드는 적힌 응답에만 싣는다"
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        traceId: { type: string }
        suggestedSeats: { type: array, items: { type: string }, description: "좌석 경합 409(seat-already-held)에만. 같은 열 인접 빈 좌석(seat-hold §3, 추천 규칙은 [보완])" }
        rejoinAllowed: { type: boolean, description: "입장 확정의 대기표 만료 410에만. 다시 줄 서기 가능 여부(이 회차에 입장한 적이 있거나 판매 종료가 지났으면 false, 사전 셔플 공연도 같은 규칙, ADR-0062·0064)" }
        holdRemainingSeconds: { type: integer, description: "결제 시도 시작의 503(새 결제 일시 정지)에만. 주문을 만들고 결제 접수 전인 홀드의 멈춘 남은 시간(초). 다시 열리면 이어 센다(ADR-0085)" }
        myReviewId: { type: string, description: "후기 쓰기의 409 review-already-written에만. 이 계정이 이 회차에 이미 쓴 후기 ID(수정으로 안내)" }
    LobbyToken: { type: object, properties: { lobbyToken: { type: string }, verification: { type: string, enum: [REQUIRED], description: "위험 점수가 높아 추가 검증이 필요하면 REQUIRED(참가 토큰은 그대로 준다). 화면은 SCR-009로 간다. 브라우저 스크립트가 303 응답을 읽지 못해 303 대신 이 필드를 쓴다(추천 적용 2026-10-21, ADR-0079 결정 4)" }, seedHash: { type: string, description: "커밋 SHA-256(PEAKET-shuffle-v1 ‖ 공연 회차 ID ‖ 시드)" }, drandChain: { type: string, description: "사용할 drand 체인(quicknet)" }, drandRound: { type: integer, description: "미리 공시한 비콘 라운드(ADR-0050 결정 7)" }, algorithmVersion: { type: string }, lobbyOpenedAt: { type: string, format: date-time }, shuffleResultAt: { type: string, format: date-time, description: "셔플 결과 공개 예정 시각(공시한 drand 라운드의 예정 시각 + 셔플·게시 목표, ADR-0058)" }, shuffleSpreadSec: { type: integer, description: "분산 창(초, 기본 8 [가정]). 참가 토큰 해시로 정한 0~분산 창 사이에 결과 파일을 받는다(ADR-0058)" } } }
    QueueTicket: { type: object, properties: { queueTicket: { type: string }, seq: { type: integer }, generation: { type: integer }, segment: { type: integer }, verification: { type: string, enum: [REQUIRED], description: "추가 검증 필요 표시가 있는 사전 검증 토큰으로 진입하면 REQUIRED. 번호는 발급하고 빠진 번호·VERIFYING으로 기록하며 화면은 SCR-009로 간다(303 대신, ADR-0079 결정 4)" } } }
    BehaviorSummary: { type: object, additionalProperties: false, description: "행동 신호 요약(사전 검증 본문, 추천 적용 2026-10-15, ADR-0065 결정 9). 공연 상세에서 잰 요약값만 보내고 원시 좌표·키 값·입력한 글자는 보내지 않는다. 필드 구성과 범위는 [가정, wbs 3.2.1에서 확정]. 보조기기 사용자는 고유 패턴이 있어 단독 판정 근거로 쓰지 않는다(queue-admission §7)", required: [v, windowMs], properties: { v: { type: integer, enum: [1], description: 형식 버전 }, windowMs: { type: integer, minimum: 0, maximum: 3600000, description: "요약한 구간 길이(밀리초)" }, pointerMoves: { type: integer, minimum: 0, description: "포인터 이동 이벤트 수" }, pointerEntropy: { type: number, minimum: 0, description: "포인터 이동 방향의 엔트로피(비트)" }, inputIntervalMeanMs: { type: number, minimum: 0, description: "터치·키 입력 간격 평균(밀리초)" }, inputIntervalStdMs: { type: number, minimum: 0, description: "터치·키 입력 간격 표준편차(밀리초)" }, scrollEvents: { type: integer, minimum: 0, description: "스크롤 이벤트 수" }, scrollDistancePx: { type: integer, minimum: 0, description: "스크롤 이동 거리 합(CSS 픽셀)" } } }
    QueueState:
      type: object
      description: "구간별 대기 상태 파일(CDN 1초 캐시. 차례에서 먼 구간의 수명을 늘리는 방식은 Phase 2에서 정함, queue-admission §4). 사용자별 값 없음. 대기 화면 진행 막대의 '처음 받은 앞 인원'은 브라우저가 처음 계산한 앞 인원을 세션 저장소에 두고 쓰므로 이 파일에 새 값이 없다(추천 적용 2026-10-14, ADR-0063)"
      properties:
        serving: { type: integer }
        servingRate: { type: number, description: 차례 진행 속도(번호/초) }
        saleStatus: { type: string, enum: [ON_SALE, PAUSED, TIER_SOLD_OUT, SOLD_OUT, ENDED], description: "ENDED는 그 회차의 판매 종료(공연 시작 24시간 전, event.starts_at − 24시간)가 지남. 차례 전 대기는 끝나고(대기 기록 SALE_END) 대기 화면은 ended로 바뀌며 폴링을 멈춘다(ADR-0063 결정 11, 소유자 결정 2026-10-14, ADR-0064)" }
        soldOutTiers: { type: array, items: { type: string }, description: "매진된 등급. 대기 화면 기본 영역에는 등급별 현황을 보이지 않고 좌석 자동 배정 공연의 희망 조건 줄 경고에만 쓴다(소유자 결정 2026-10-14, ADR-0063)" }
        removedUpToServing: { type: integer }
        removedBeforeSegment: { type: integer }
        removedBitmap: { type: string, description: base64 125바이트 }
        banner: { type: string }
    AdmissionResult:
      type: object
      properties:
        status: { type: string, enum: [NOT_YET, ADMITTED, SOON, VERIFYING], description: "만료와 판매 종료는 410 응답으로 알린다. NOT_YET은 좌석 자동 배정 공연의 차례 직전 직접 확인에서 아직 차례 전(ADR-0043). VERIFYING은 빠진 번호이고 추가 검증 중이라 화면이 SCR-009로 간다(303 대신, ADR-0079 결정 4)" }
        admissionToken: { type: string, description: "ES256, 첫 사용 기한 5분, 만료는 최대 체류 시각" }
        retryAfterSeconds: { type: integer }
        retryAfterMs: { type: integer, description: "NOT_YET일 때 예상 도래까지 남은 시간(밀리초)" }
        serverEcdhPublicKey: { type: object, description: "구매 세션 요청 인증 키를 합의하는 서버 고정 ECDH P-256 공개키. JWK(kty EC, crv P-256, x, y, kid) 형식(ADR-0050 결정 8, 추천 적용 2026-10-21, ADR-0079 결정 6)", properties: { kty: { type: string }, crv: { type: string }, x: { type: string }, y: { type: string }, kid: { type: string } } }
        seatmapLayoutPath: { type: string, description: "직접 선택 공연의 좌석맵 파일 경로(/v1/events/{eventId}/seatmap-layouts/{layoutVersion}.json). 대기 중 미리 받은 판과 다르면 다시 받는다(추천 적용 2026-10-14, ADR-0063)" }
    HoldRequest:
      type: object
      description: "직접 선택 공연은 seatIds, 좌석 자동 배정 공연은 auto 중 하나를 보낸다(POL-035, ADR-0043)"
      properties:
        seatIds: { type: array, items: { type: string }, maxItems: 10 }
        auto:
          type: object
          description: "희망 조건. 대기 중 브라우저에만 저장했다가 차례가 오면 자동으로 보낸다. 서버가 다시 검증한다(ADR-0043)"
          required: [firstTierId, count]
          properties:
            firstTierId: { type: string }
            secondTierId: { type: string, description: "선택. 1순위와 달라야 한다" }
            count: { type: integer, minimum: 1, description: "1인 매수 한도 이하" }
            wheelchair: { type: boolean, default: false }
            allowSplit: { type: boolean, default: false, description: "연석이 없을 때 같은 등급의 분리 좌석 허용" }
        clientEphemeralPublicKey: { type: string, description: "좌석 자동 배정 공연의 첫 요청에만(직접 선택 공연은 스냅샷 요청 헤더). 구매 세션에 저장" }
    Hold: { type: object, properties: { holdId: { type: string }, seatIds: { type: array, items: { type: string } }, expiresAt: { type: string, format: date-time }, extendable: { type: boolean }, fencingToken: { type: integer }, assignResult: { type: string, enum: [FIRST, FIRST_SPLIT, SECOND, SECOND_SPLIT], description: "좌석 자동 배정 결과 유형(ADR-0043). 직접 선택 공연은 없음" } } }
    Order: { type: object, properties: { orderId: { type: string }, amount: { type: integer }, status: { type: string, enum: [CREATED, AUTHENTICATED, ACCEPTED, RESERVED, AWAITING_DEPOSIT, APPROVED, UNKNOWN, CONFIRMED, FAILED, COMPENSATED, PARTIALLY_REFUNDED, REFUNDED], description: "주문 상태(planning/03 §2.4). 결제 시도 상태와 결제 원장 상태는 따로다(payment §3)" }, items: { type: array, items: { type: object } } } }
    PaymentStatus: { type: object, properties: { status: { type: string, enum: [ACCEPTED, RESERVED, AWAITING_DEPOSIT, APPROVED, CONFIRMED, FAILED, UNKNOWN, COMPENSATED] }, virtualAccount: { type: object, description: "가상계좌 안내(입금 대기일 때만, planning/03 §2.4, ADR-0062)", properties: { bank: { type: string }, accountNumber: { type: string }, dueAt: { type: string, format: date-time } } }, reason: { type: string }, pg: { type: string, enum: [TOSS, PORTONE, SIMULATOR], description: 결제 접수에서 고정된 결제사(ADR-0044) } } }
    PaymentAttempt:
      type: object
      description: "결제 시도(POL-036, ADR-0044). 결제창을 열기 직전에 만든다. 주문당 활성 시도는 1건이고 새 시도는 결제 접수 전의 이전 시도를 대체한다"
      required: [attemptId, pg, checkout]
      properties:
        attemptId: { type: string }
        pg: { type: string, enum: [TOSS, PORTONE, SIMULATOR], description: "결제사 선택기가 고른 결제사. SIMULATOR는 부하·시험 환경 전용" }
        switched: { type: boolean, description: "결제사 전환(감내 모드)으로 대체 결제사가 골라졌으면 true. 화면이 안내 문구를 띄운다(CMP-027 pg-switched)" }
        holdExpiresAt: { type: string, format: date-time, description: "이 주문 홀드의 지금 만료 시각. 새 결제 일시 정지로 멈췄던 시간을 반영한다(ADR-0085)" }
        checkout:
          type: object
          description: "결제사별 결제창 값. TOSS·SIMULATOR는 clientKey·customerKey·orderId·orderName·amount·successUrl·failUrl, PORTONE은 storeId·channelKey·paymentId·orderName·totalAmount·currency·redirectUrl·customer(채널이 요구하는 항목만)"
          additionalProperties: true
    PaymentAccept:
      description: "결제 접수 본문. pg 값으로 갈린다(ADR-0044 결정 7). 허용 필드 밖의 값은 400"
      oneOf:
        - $ref: '#/components/schemas/PaymentAcceptToss'
        - $ref: '#/components/schemas/PaymentAcceptPortone'
      discriminator:
        propertyName: pg
        mapping: { TOSS: '#/components/schemas/PaymentAcceptToss', SIMULATOR: '#/components/schemas/PaymentAcceptToss', PORTONE: '#/components/schemas/PaymentAcceptPortone' }
    PaymentAcceptToss: { type: object, additionalProperties: false, required: [pg, paymentKey, amount], properties: { pg: { type: string, enum: [TOSS, SIMULATOR] }, paymentKey: { type: string, description: 토스 성공 URL의 paymentKey(SIMULATOR도 같은 형식) }, amount: { type: integer, description: 성공 URL의 금액. 서버 주문 금액과 대조 } } }
    PaymentAcceptPortone: { type: object, additionalProperties: false, required: [pg, paymentId, paymentToken, txId], properties: { pg: { type: string, enum: [PORTONE] }, paymentId: { type: string, description: 결제 시도 응답의 paymentId와 같아야 한다 }, paymentToken: { type: string, description: 수동 승인 API용 결제 토큰. 승인 결과가 정해지면 서버에서 지운다 }, txId: { type: string, description: 결제 시도 ID. 승인 API에 검증용으로 넘긴다 } } }
    Ticket: { type: object, properties: { ticketId: { type: string }, eventId: { type: string }, seatLabel: { type: string }, gateZone: { type: string }, status: { type: string, enum: [ISSUED, ACTIVE, TRANSFER_PENDING, CANCEL_REQUESTED, REFUNDED, FLAGGED, VOIDED], description: "티켓 상태(planning/03 §2.5, ScannerPackageTicket과 같은 값). Reissued·Transferred는 상태가 아니라 사건(이력)이고, ScannedIn·ScannedOut은 입장 상태(ScannerPackageTicket의 scanState)다" }, transferable: { type: boolean }, transferDeadline: { type: string, format: date-time }, cancelDeadline: { type: string, format: date-time, description: 공연 시작 시각(POL-032) } } }
    CancellationQuote:
      type: object
      description: 예매 취소 환급 예상(POL-032). 소비자분쟁해결기준 공연업 공제율
      properties:
        ticketId: { type: string }
        daysBefore: { type: integer, description: 공연일까지 남은 달력일(공연장 현지 날짜) }
        within24h: { type: boolean, description: 예매 후 24시간 이내(비영업일 제외)이고 공연 3일 전까지 }
        deductionRate: { type: number, enum: [0, 0.1, 0.2, 0.3, 0.9] }
        basis: { type: string, description: 적용 근거 문구 }
        ticketPrice: { type: integer }
        refundAmount: { type: integer }
        refundAfterEntryClose: { type: boolean, description: "입장 시작 뒤 취소라 환급을 입장 기록 마감 뒤 실행(ADR-0051 결정 13)" }
    Cancellation: { type: object, properties: { cancellationId: { type: string }, status: { type: string, enum: [REQUESTED, REFUND_PENDING, REFUNDED, VOIDED] }, refundAmount: { type: integer } } }
    TransferOffer: { type: object, description: "양도 요청(POL-017, ADR-0046). 받는 사람에게는 결제 금액과 결제자 연락처를 싣지 않는다", properties: { offerId: { type: string }, ticketId: { type: string }, role: { type: string, enum: [SENDER, RECIPIENT] }, counterpartNickname: { type: string }, status: { type: string, enum: [OFFERED, ACCEPTED, REJECTED, WITHDRAWN, EXPIRED, RECLAIMED] }, expiresAt: { type: string, format: date-time, description: "48시간과 양도 마감 중 이른 때" }, payerOnlyNotice: { type: string, description: "결제자만 취소·환불 고지 문구" } } }
    RefundAccount: { type: object, required: [bankCode, accountNumber, holderName], description: "환불·배상 계좌. 저장하지 않고 결제사 취소·송금 요청에 바로 넘긴다(POL-014)", properties: { bankCode: { type: string }, accountNumber: { type: string }, holderName: { type: string } } }
    Compensation: { type: object, description: "분쟁해결기준에 따른 배상금(ADR-0046 결정 5)", properties: { compensationId: { type: string }, orderId: { type: string }, amount: { type: integer, description: "실제 결제 금액의 10%" }, status: { type: string, enum: [ACCOUNT_PENDING, REQUESTED, PAID, FAILED] }, accountLast4: { type: string } } }
    SellerInfo: { type: object, required: [legalName, representative, address, phone, email, businessRegNo], description: "판매자 신원정보(전자상거래법 §20②, POL-037)", properties: { legalName: { type: string }, representative: { type: string }, address: { type: string }, phone: { type: string }, email: { type: string, format: email }, businessRegNo: { type: string }, mailOrderReportNo: { type: string, description: "통신판매업 신고번호. 없으면 exemptionBasis 필수" }, exemptionBasis: { type: string } } }
    EventCancellationRequest: { type: object, description: "회차 취소 요청(ADR-0046 결정 4)", properties: { requestId: { type: string }, eventId: { type: string }, kind: { type: string, enum: [CANCEL, POSTPONE] }, status: { type: string, enum: [REQUESTED, JUDGED, PENDING_APPROVAL, APPROVED, RUNNING, PAUSED, COMPLETED, REJECTED] }, fault: { type: string, enum: [ORGANIZER, FORCE_MAJEURE, CONTENT_CHANGE] }, fanNoticeReason: { type: string, maxLength: 200, description: "팬 통지의 사유 요약(200자 [가정], 판정자가 통지 문안 미리보기에서 씀, design/d5 §9.3). 내부 판정 사유와 따로 둔다(ADR-0062)" }, dryRun: { type: object, description: "대상 주문 수, 환급 총액, 배상 대상 수와 총액, 결제사별 건수와 예상 소요 시간" }, progress: { type: object, properties: { total: { type: integer }, done: { type: integer }, failed: { type: integer } } } } }
    ApprovalRequest: { type: object, description: "승인 업무(POL-038)", properties: { approvalId: { type: string }, kind: { type: string, enum: [SYSTEM_FAULT_REFUND, DISCRETIONARY_WAIVER, TRANSFER_RECLAIM, BOOKING_RESTRICTION, PAYOUT_BATCH, SETTLEMENT_ADJUSTMENT, COMMANDER_ROLE_CHANGE, CONTRACT_TERMS_CHANGE, MINOR_CONTRACT_CANCEL], description: "MINOR_CONTRACT_CANCEL은 미성년자 계약 취소(cs_agent 요청, 요청자 아닌 cs_lead 1인 승인, POL-038 ⑧, 추천 적용 2026-10-14, ADR-0062)" }, targetRef: { type: string }, amount: { type: integer }, reasonCode: { type: string }, reasonText: { type: string }, evidenceChecked: { type: string, description: "확인한 증빙 종류만. 파일과 내용은 받지 않는다" }, requiredApprovals: { type: integer, enum: [1, 2], description: "서버가 정한다" }, approvals: { type: array, items: { type: string } }, status: { type: string, enum: [REQUESTED, PENDING_APPROVAL, APPROVED, REJECTED, ESCALATED, EXECUTING, DONE, FAILED], description: "승인 대기 저장 값은 PENDING_APPROVAL. FAILED는 원인을 고친 뒤 승인자가 approve를 다시 부르면 다시 실행한다(planning/03 §2.10, 추천 적용 2026-10-20, ADR-0073)" }, dueAt: { type: string, format: date-time } } }
    CsCase: { type: object, description: "CS 처리함 건(POL-038)", properties: { caseId: { type: string }, kind: { type: string, enum: [UNKNOWN_PAYMENT, REFUND_FAILED, FLAGGED, REFUND_ACCOUNT_PENDING, COMPENSATION_PENDING, ABUSE_FLAG, DISPUTE, JUDGEMENT_PENDING, STATEMENT_DISPUTE, SELLER_KYC_REQUIRED, PAYOUT_ERROR, PAYOUT_FAILED, PAYOUT_DELAYED, PORTONE_PAYOUT_EXECUTION, SCANNER_UNREPORTED, KOPIS_REPORT_FAILED, VERIFICATION_APPEAL, APPROVAL_EXECUTION_FAILED, RETURN_DELAYED, MINOR_CONTRACT_CANCEL, INQUIRY, CONTENT_REPORT, RIGHTS_REQUEST], description: "RETURN_DELAYED는 굿즈 반품 요청 뒤 7일 [가정] 동안 판매자 도착 확인이 없는 건(transfer-refund §7.1). MINOR_CONTRACT_CANCEL은 미성년자 계약 취소 요청(확인 결과 안내 3영업일, 승인 뒤 환급 3영업일, POL-038 ⑧). 추천 적용 2026-10-14, ADR-0062. INQUIRY는 고객 문의(답변 3영업일 [가정], 문의 유형 '공연(판매자) 관련 분쟁'은 DISPUTE, '미성년자 계약 취소'는 MINOR_CONTRACT_CANCEL로 온다), CONTENT_REPORT는 게시물 신고(같은 후기의 신고는 한 건, 결과 3영업일 [가정]), RIGHTS_REQUEST는 권리 침해 삭제 요청(정보통신망법 §44의2, 1영업일 [가정]). 추천 적용 2026-10-19, ADR-0066" }, targetRef: { type: string, description: "문의 건은 inquiryId, 신고 건은 신고된 reviewId" }, progressDueAt: { type: string, format: date-time }, resultDueAt: { type: string, format: date-time }, status: { type: string, enum: [OPEN, IN_PROGRESS, RESOLVED] }, reportSummary: { type: object, description: "CONTENT_REPORT·RIGHTS_REQUEST만. 신고 수와 사유별 수. 신고자는 싣지 않는다(ADR-0066)", properties: { total: { type: integer }, byCategory: { type: object, additionalProperties: { type: integer } } } } } }
    CsCaseDetail: { description: "CS 처리함 건 상세(GET /v1/ops/cases/{caseId}, 추천 적용 2026-10-19, ADR-0066). 신고한 계정은 싣지 않는다", allOf: [{ $ref: '#/components/schemas/CsCase' }, { type: object, properties: { messages: { type: array, description: "문의 건만. 시간 순 기록(팬·답변·진행 경과)", items: { $ref: '#/components/schemas/InquiryMessage' } }, reports: { type: array, description: "CONTENT_REPORT·RIGHTS_REQUEST만. 신고마다 사유·자세한 내용·접수 시각(신고한 계정 없음)", items: { type: object, properties: { category: { type: string, enum: [SCALPING, MACRO, ABUSE, RIGHTS, ILLEGAL_FILMING, SPAM, OFF_TOPIC, OTHER] }, detail: { type: [string, 'null'], maxLength: 2000, description: "grapheme 500자 [가정]" }, rightsHolder: { type: boolean }, notifyChannel: { type: [string, 'null'], enum: [APP, EMAIL, null] }, createdAt: { type: string, format: date-time } } } }, review: { type: [object, 'null'], description: "신고 대상 후기(본문·별점·사진 파생본)", properties: { reviewId: { type: string }, rating: { type: integer }, body: { type: string }, images: { type: array, items: { $ref: '#/components/schemas/ReviewImage' } } } } } }] }
    SettlementStatement: { type: object, description: "정산서(회차 정산서는 회차·결제사, 상품 정산서는 파트너·결제사·결제 상점·주 단위, POL-039, ADR-0047, 상품 정산서는 추천 적용 2026-10-14, ADR-0062). 계좌는 끝 4자리만", properties: { statementId: { type: string }, kind: { type: string, enum: [EVENT, PRODUCT], description: "EVENT는 티켓, PRODUCT는 굿즈·티켓 연동 부가 상품" }, eventId: { type: string, description: "회차. 상품 정산서는 null(ADR-0086)" }, pg: { type: string, enum: [TOSS, PORTONE] }, pgStore: { type: string, enum: [STANDARD, ESCROW], description: "토스페이먼츠 결제 상점(ESCROW는 굿즈 택배)" }, periodStart: { type: string, format: date, description: "상품 정산서의 주 시작(KST)" }, periodEnd: { type: string, format: date, description: "상품 정산서의 주 끝(KST)" }, grossAmount: { type: integer }, refundAmount: { type: integer }, commissionAmount: { type: integer }, commissionVat: { type: integer }, offsetAmount: { type: integer }, payoutAmount: { type: integer }, status: { type: string, enum: [CALCULATED, NOTIFIED, DISPUTED, CONFIRMED, HELD, SCHEDULED, FAILED, PAID, CARRIED_OVER] }, holdReason: { type: string, enum: [KYC, ACCOUNT_CHANGE, BALANCE] }, disputeDueAt: { type: string, format: date-time }, payoutDate: { type: string, format: date }, payoutAccountLast4: { type: string } } }
    PayoutBatch: { type: object, description: "지급 묶음(지급일·결제사·결제 상점, 2인 승인)", properties: { batchId: { type: string }, pg: { type: string, enum: [TOSS, PORTONE] }, pgStore: { type: string, enum: [STANDARD, ESCROW], description: "토스페이먼츠 결제 상점. 같은 지급일·같은 상점이면 회차·상품 정산서가 한 묶음에 든다(추천 적용 2026-10-14, ADR-0062)" }, payoutDate: { type: string, format: date }, totalAmount: { type: integer }, statementCount: { type: integer }, approvalId: { type: string }, portoneBulkPayoutId: { type: string }, pgBalance: { type: object, description: "묶음 때 본 결제사 지급 가능 잔액. 토스페이먼츠는 잔액 API, 포트원은 operator가 콘솔에서 본 값이다. 포트원 값은 검증할 수 없어 지급을 미루는 쪽으로만 쓴다(ADR-0062)", properties: { amount: { type: integer }, pendingAmount: { type: integer, description: "토스페이먼츠만. 정산 주기가 지나지 않은 '정산 대기' 금액" }, source: { type: string, enum: [PG_API, OPERATOR_CONSOLE] }, observedAt: { type: string, format: date-time }, observedBy: { type: string, description: "OPERATOR_CONSOLE일 때 입력한 operator" } } }, status: { type: string, enum: [PREPARED, PENDING_APPROVAL, APPROVED, SUBMITTED, COMPLETED, PARTIAL_FAILED] } } }
    Receivable: { type: object, description: "미수금(상계 → 보증 → 청구)", properties: { receivableId: { type: string }, cause: { type: string, enum: [REFUND_AFTER_PAYOUT, CHARGEBACK, COMPENSATION_ADVANCE, NEGATIVE_STATEMENT] }, amount: { type: integer }, remaining: { type: integer }, status: { type: string, enum: [OPEN, OFFSET, GUARANTEE, BILLED, CLOSED, WRITTEN_OFF] } } }
    ReportStage: { type: string, enum: [R0, R1, R2, R3, FROZEN], description: "마감 단계(POL-040, docs/features/analytics.md §4.2)" }
