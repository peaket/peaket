    put: { operationId: putOpsHomeLayout, tags: [ops], x-peaket-roles: [operator, commander], summary: "홈 구성 저장(배너·테마 통째로, operator 1인, 사유 필수, 감사 로그)", description: "SCR-068 [홈 구성] 탭(추천 적용 2026-10-14, ADR-0063). 판매 승인된 공연만(아니면 422), 노출 끝은 시작 뒤, 배너 이미지는 banner-images로 먼저 올린 것. If-Match의 version이 서버 판과 다르면 412(다른 운영자가 먼저 저장, 2026-10-28 기술 검토 낮음-030로 409에서 바꿨다). 저장하면 감사 로그에 사유와 전후 차이를 남기고 홈 캐시 태그를 무효화한다. 운영 명령 카탈로그(control-tower §3) 밖의 콘텐츠 설정이라 2인 승인·되돌리기 명령이 없고, 되돌리려면 이전 판을 다시 저장한다", security: [{ opsCookie: [] }], parameters: [{ $ref: '#/components/parameters/IfMatch' }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/HomeLayoutInput' } } } }, responses: { '412': { $ref: '#/components/responses/Problem', description: "If-Match의 version이 서버 판과 다름(precondition-failed, 다른 운영자가 먼저 저장, 기술 검토 낮음-030)" }, '428': { $ref: '#/components/responses/Problem', description: "If-Match 없음(precondition-required)" }, '200': { description: "저장(새 version)", content: { application/json: { schema: { $ref: '#/components/schemas/HomeLayout' } } } }, '403': { $ref: '#/components/responses/Problem', description: "operator 아님" }, '422': { $ref: '#/components/responses/Problem', description: "판매 승인 전 공연·기간 오류·없는 이미지" } } }
  /v1/ops/home-layout/banner-images:
