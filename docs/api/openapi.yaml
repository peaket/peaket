ble', description: "seatmap-publish-unavailable: 배치본이 있는 공연에 새 회차의 팬 좌석맵 파일을 쓰지 못함(회차를 더하지 않는다, ADR-0260 결정 8). 파일은 트랜잭션 밖에서 먼저 쓰고, 넣는 사이 좌석맵 판이 거듭 바뀌어 두 번 다시 해도 맞추지 못하면 Retry-After 1초 [가정]다(추천 적용 2026-11-10 리뷰)" } } }
