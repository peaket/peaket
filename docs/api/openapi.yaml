      responses: { '200': { description: "VERIFIED·CANCELLED(창을 닫음)·FAILED", content: { application/json: { schema: { $ref: '#/components/schemas/VerificationResult' } } } }, '403': { $ref: '#/components/responses/Problem', description: "under-14: 본인확인 결과 만 14세 미만(결과 미저장, 계정 정리 시작)" }, '404': { $ref: '#/components/responses/Problem', description: "없음·만료·다른 계정의 시작 요청" }, '409': { $ref: '#/components/responses/Problem', description: "이미 다른 계정에서 확인(DUPLICATE_ACCOUNT), 부스 대조 목적이면 티켓 보유 계정과 다른 사람(BOOTH_MISMATCH)" }, '503': { $ref: '#/components/responses/ServiceUnavailable', description: "기관 장애(PROVIDER_DOWN). 이미 본인확인한 계정은 영향 없음" } }
    get:
      operationId: getIdentityVerificationResult
      tags: [identity]
      x-peaket-roles: [fan]
      summary: "본인확인 결과 조회(부르는 화면이 결과 대화상자를 띄울 때)"
      description: "FR-002(추천 적용 2026-10-14, ADR-0063). 팝업 메시지가 오지 않았거나(창이 막힘·닫힘) 페이지 이동으로 next에 돌아왔을 때 부른다. 기관 창이 아직 열려 있으면 PENDING. 개인정보는 싣지 않는다. Cache-Control: no-store"
      security: [{ fanCookie: [] }]
