    post: { operationId: createScannerFlagResolution, tags: [scanner], x-peaket-roles: [gate_lead], summary: "이상 표시 현장 확인 결과 기록(정상 확인·부정 의심·판단 불가)", description: "FR-066, ADR-0051. 부정 의심·판단 불가는 CS 처리함으로 간다. 이상 표시 ID만으로 찾고 서버가 그 표시가 스캐너 토큰의 회차 것인지 확인한다(다르면 403)(추천 적용 2026-10-21, ADR-0081)", security: [{ deviceDpop: [], staffToken: [] }, { deviceMtls: [], staffToken: [] }],parameters: [{ name: flagId, in: path, required: true, schema: { type: string } }], requestBody: { content: { application/json: { schema: { additionalProperties: false, type: object, required: [status], properties: { status: { type: string, enum: [OK, SUSPECT, UNDETERMINED] }, note: { type: string, maxLength: 100, description: "개인정보 금지" } } } } } }, responses: { '200': { description: 기록됨 }, '403': { $ref: '#/components/responses/Problem', description: 책임자 아님 } } }
  /v1/scanner/booth-authorizations:
    post: { operationId: createScannerBoothAuthorization, tags: [scanner], x-peaket-roles: [gate_lead], summary: "부스 재발급 허용(현장 책임자가 관객 화면의 부스 코드를 찍음). 그 티켓의 BOOTH 등록을 10분 허용", description: "FR-066, ADR-0050 결정 2, ADR-0051 결정 11. 코드는 8자·10분·한 번. 책임자당 10분 5회 실패 제한 [가정]", security: [{ deviceDpop: [], staffToken: [] }, { deviceMtls: [], staffToken: [] }],requestBody: { content: { application/json: { schema: { additionalProperties: false, type: object, required: [boothCode], properties: { boothCode: { type: string } } } } } }, responses: { '200': { description: "허용(티켓의 좌석 표시, 허용 끝 시각)" }, '403': { $ref: '#/components/responses/Problem', description: "책임자 아님·다른 회차" }, '410': { $ref: '#/components/responses/Problem', description: "코드 만료·사용됨" } } }
webhooks:
  partnerEvent:
    post:
      tags: [partner]
      summary: "파트너 웹훅(PEAKET이 파트너가 등록한 주소로 보냄). 이벤트 8종, 엔드포인트마다 구독한 type만"
      description: "FR-025, ADR-0053, 추천 적용 2026-10-14, ADR-0062. 쓰임새: 매출·회계 시스템에 판매·환급 금액 반영(order.confirmed·order.cancelled), 사내 메신저에 매진·회차 취소·연기 알림(event.sold_out·event.cancelled·event.postponed), 자사 홈페이지·SNS 공지 갱신(같은 이벤트), 정산 통지·입금 확인(statement.notified·payout.completed·payout.failed). 파트너 서버가 PEAKET에 직접 물어볼 서버용 API는 없어 본문의 금액·수·ID만 쓰고 자세한 내용은 콘솔에서 본다(나중 Phase로 미룸, 추천 적용 2026-10-19, ADR-0066). Standard Webhooks 형식이다. 헤더는 webhook-id(사건 키, 재전송에도 같음), webhook-timestamp(시도 시각, 유닉스 초), webhook-signature(v1, 뒤에 base64 HMAC-SHA256(비밀, id.timestamp.본문))다. 등록은 POST /v1/partner/webhooks. 받는 쪽이 2xx로 답하지 않으면 지수 백오프로 다시 보내고 끝내 실패하면 DLQ에 둔다(guidelines §8)"
      parameters: [{ name: webhook-id, in: header, required: true, schema: { type: string } }, { name: webhook-timestamp, in: header, required: true, schema: { type: string } }, { name: webhook-signature, in: header, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PartnerWebhookEvent' } } } }
      responses: { '2XX': { description: "받음" } }
