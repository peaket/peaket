      description: "SCR-001 ⑧, docs/features/analytics.md §8.5(추천 적용 2026-10-14, ADR-0063). 판매 승인된 공연만 넣고 매진·판매 종료 공연도 넣어 saleStatus로 '매진'을 보인다. 장르 칩을 바꿔도 다시 받지 않도록 모든 장르를 한 파일에 싣는다. 게시 때 이 경로를 무효화하고 Cache-Control: public, max-age=3600 [가정]이다. 게시가 실패하면 직전 파일이 남고 basisDate로 알 수 있다"
      responses: { '200': { description: 랭킹, content: { application/json: { schema: { $ref: '#/components/schemas/RankingFile' } } } } }
  /v1/search:
    get:
      operationId: listSearchResults
      tags: [catalog]
      x-peaket-roles: [public]
      security: []
      summary: "공연 검색(필터·정렬·페이지 번호, 결과 0건 제안, 관련 공연). 인증 없음, CDN 캐시"
      description: "FR-003, SCR-003(소유자 결정 2026-10-14, ADR-0063), docs/features/search.md(추천 적용 2026-10-27, ADR-0094). 한 줄은 공연(ADR-0093)이고 판매 승인된 공연만 나온다. q는 정규화(NFKC·소문자·제로폭 문자 지움·공백 정리)한 뒤 공연명·아티스트·공연장과 그 다른 이름의 앞부분·낱자·초성·중간 일치로 찾는다. 로마자만인 q가 0건이면 한/영 변환 값으로 다시 찾는다. LIKE 패턴의 특수 문자는 이스케이프한다. 검색 읽기 모델(search_document·search_term)을 읽기 전용 복제본과 검색 전용 연결 묶음으로 읽는다. 기본 범위는 판매 중·오픈 예정·매진이고 includePast=true면 끝난 공연도 넣는다. 정렬 기본은 q가 있으면 RELEVANCE, 없으면 OPEN_SOON이고, 모든 정렬의 마지막은 공연 ID다. 결과는 페이지 번호로 나눈다(주소 ?q=&page=로 공유·뒤로 가기, guidelines §3 예외). 한 쪽은 20개로 고정하고(limit는 20만), page × 20이 1,000 [가정]을 넘으면 400이다. 인기순은 랭킹 잡이 함께 내는 공연별 최근 7일 확정 판매 매수 [가정] 순위(비공개 값, POL-043)를 쓰고 순위가 없는 공연은 뒤에 오픈 임박 순으로 둔다. 개인화·유료 노출은 없다(POL-045). 캐시 키는 정규화한 q와 정해진 순서의 매개변수뿐이고 쿠키는 넣지 않는다(Cache-Control: public, max-age=30, stale-while-revalidate=30, stale-if-error=600 [가정]). 판매 승인 취소·회차 전부 취소 때 CDN 경로 /v1/search*를 무효화한다"
      parameters: [{ name: q, in: query, schema: { type: string, maxLength: 50 } }, { name: genre, in: query, schema: { $ref: '#/components/schemas/Genre' } }, { name: placeId, in: query, description: "공연장(ADR-0093)", schema: { type: string } }, { name: artistId, in: query, description: "아티스트(ADR-0093)", schema: { type: string } }, { name: dateFrom, in: query, description: "공연 기간이 이 범위와 겹치는 공연(KST 날짜)", schema: { type: string, format: date } }, { name: dateTo, in: query, schema: { type: string, format: date } }, { name: status, in: query, description: "예매 상태. ENDED면 끝난 공연만", schema: { type: string, enum: [UPCOMING, ON_SALE, SOLD_OUT, ENDED] } }, { name: includePast, in: query, description: "끝난 공연도 넣기", schema: { type: boolean, default: false } }, { name: sort, in: query, description: "없으면 q가 있을 때 RELEVANCE, 없을 때 OPEN_SOON", schema: { type: string, enum: [RELEVANCE, OPEN_SOON, POPULAR] } }, { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }, { name: limit, in: query, description: "한 쪽 20개 [가정] 고정. 캐시 키가 갈리지 않게 다른 값은 받지 않는다", schema: { type: integer, enum: [20], default: 20 } }]
      responses: { '200': { description: 결과, content: { application/json: { schema: { $ref: '#/components/schemas/SearchResultPage' } } } }, '400': { $ref: '#/components/responses/Problem', description: "page × 20 상한 초과, limit가 20이 아님, 형식 오류" }, '503': { $ref: '#/components/responses/ServiceUnavailable', description: "검색 전용 연결 묶음이 넘침. CDN이 직전 응답(stale-if-error)을 낸다" } }
  /v1/search/suggestions:
    get:
      operationId: getSearchSuggestions
      tags: [catalog]
      x-peaket-roles: [public]
      security: []
      summary: "자동완성(공연·아티스트·공연장 후보, 최대 8개 [가정]). 인증 없음, CDN 캐시, 서버 메모리 사전"
      description: "SCR-003 머리 검색창의 자동완성 창(소유자 결정 2026-10-14, ADR-0063. 이름은 소유자 결정 2026-10-27, ADR-0094). core-svc 파드마다 둔 메모리 사전(검색 읽기 모델의 판을 10초 [가정]마다 확인)에서 답하고 DB와 Redis를 부르지 않는다. 입력은 정규화(NFKC·소문자·제로폭 문자 지움·공백 정리)하고 이름의 낱자 앞부분(조합 중 글자), 초성, 낱말 앞부분, 중간 일치(두 음절 이상) 순으로 찾는다. 순서는 일치 등급 → 판매 상태 → 관심도 → 이름 → ID다(docs/features/search.md §4). 공연 후보는 기본 범위(판매 중·오픈 예정·매진)의 판매 승인된 공연만, 아티스트·공연장 후보는 그런 공연이 하나 이상 있을 때만 낸다. 후보는 카탈로그에서만 만들고 검색 기록으로 만들지 않는다(POL-045). 캐시 키는 정규화한 입력뿐이다(Cache-Control: public, max-age=60, stale-while-revalidate=60, stale-if-error=600 [가정]). 브라우저는 입력이 바뀌면 앞 요청을 취소하고, 받은 후보가 8개보다 적으면 더 긴 입력은 받은 후보 안에서 거른다. 최근 검색어는 서버로 보내지 않고 기기에만 둔다(추천 적용 2026-10-14, ADR-0063)"
      parameters: [{ name: q, in: query, required: true, description: "정규화한 입력. 한글 음절이 하나라도 있으면 1자부터, 로마자·숫자·낱자만이면 2자부터 [가정]", schema: { type: string, minLength: 1, maxLength: 50 } }]
      responses: { '200': { description: 자동완성 후보, content: { application/json: { schema: { $ref: '#/components/schemas/SuggestResult' } } } }, '400': { $ref: '#/components/responses/Problem', description: "query-too-short(최소 길이 미달), 50자 초과" } }
  /v1/events/{eventId}:
    get:
      operationId: getEvent
      tags: [catalog]
      x-peaket-roles: [public]
      security: []
      summary: "회차 공개 요약(공연명·회차 시작·판매자 상호). 인증 없음, CDN 캐시"
      description: "FR-003, FR-046, POL-037(소유자 결정 2026-10-30, open-items 78번. 칸과 캐시는 추천 적용 2026-10-30). 전자상거래법 제20조 제2항은 통신판매중개업자가 판매자의 신원정보(법인이면 명칭과 대표자 성명, 주소, 전화번호 등)를 확인해 청약 전에 소비자에게 제공하라고 정한다(2026-10-30 원문 확인). 그래서 판매자 상호는 공개 정보이고, 공연 상세의 판매자 줄에 이미 보인다. 이 경로는 판매 승인되고 판매 중지가 아닌 회차만 답하고, 그 밖의 회차와 없는 회차는 같은 404다(docs/security/authz-matrix.md §3.5). 스캐너 승인 화면(SCR-051)이 내 배정의 공연명·회차 시각과 배정 파트너 이름을 이 응답에서 읽는다. 파트너 이름을 위한 내부 호출은 두지 않는다(DeviceApprovalView). 판매자 신원정보의 나머지 여섯 항목과 공연 상세의 다른 칸(가격 등급, 판매 정책, 고지, 이미지)은 공연 상세 계약과 함께 wbs 0.2.3에서 더한다. 쿠키를 캐시 키에 넣지 않고 Cache-Control: public, max-age=300, stale-if-error=86400 [가정]이다. 판매 승인·판매자 정보 변경 반영·판매 중지·회차 변경 때 공연 상세 ISR과 같은 태그(event:{eventId})로 무효화한다(docs/frontend.md의 /events/[id] 행)"
      parameters: [{ $ref: '#/components/parameters/EventId' }]
      responses: { '200': { description: 회차 공개 요약, content: { application/json: { schema: { $ref: '#/components/schemas/EventPublicSummary' } } } }, '404': { $ref: '#/components/responses/Problem', description: "없는 회차, 판매 승인 전, 판매 중지 중(같은 응답)" } }
  /v1/events/{eventId}/reviews:
    get:
      operationId: listEventReviews
      tags: [reviews]
      x-peaket-roles: [public, fan]
      summary: "관람 후기 목록(후기 전체 모달, 정렬, '더 보기' 커서)"
      description: "FR-016, FR-070, SCR-016(소유자 결정 2026-10-14, ADR-0063). 이 회차가 속한 공연의 모든 회차 후기를 모아 주고, 후기마다 관람 회차 일시가 있다(추천 적용 2026-10-27, ADR-0093). 통보·같은 내용 차단과 불법 촬영물 신고 확인 중으로 숨긴 후기는 남에게 빠지고 본인에게만 HIDDEN으로 온다. 신고 처리로 임시조치·노출 차단한 후기는 남에게 본문·사진·별점 없이 notice만 있는 자리로 온다(정보통신망법 §44의2② 후단 공시, 추천 적용 2026-10-19, ADR-0066). 팬 쿠키가 있으면 mine·reportedByMe를 채우므로 Cache-Control: private, no-store다. 명령 9로 후기 기능을 끄면 503. 후기마다의 [신고]는 POST /v1/reviews/{reviewId}/reports이고, 신고기관(한국콘텐츠진흥원) 온라인 암표신고센터 바로가기는 외부 누리집 링크라 API가 없다(POL-024 나목, 소유자 요청 2026-10-19, ADR-0066)"
      security: [{}, { fanCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/EventId' }, { name: sort, in: query, schema: { type: string, enum: [LATEST, RATING_DESC, RATING_ASC], default: LATEST } }, { $ref: '#/components/parameters/Cursor' }, { name: limit, in: query, required: false, description: "기본 10 [가정], 최대 50", schema: { type: integer, minimum: 1, maximum: 50 } }]
      responses: { '200': { description: 목록, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewPage' } } } }, '503': { $ref: '#/components/responses/ServiceUnavailable', description: "후기 기능 꺼짐(명령 9)" } }
    post:
      operationId: createEventReview
      tags: [reviews]
      x-peaket-roles: [fan]
      summary: "관람 후기 쓰기(공연 종료 뒤, 그 회차 결제자, 회차당 하나)"
      description: "FR-016, POL-024 다목 고지(쓰기 모달 위), 소유자 결정 2026-10-14, ADR-0063. 자격: 그 회차의 공연 종료 예정 시각(event.ends_at)이 지났고 그 회차 티켓의 결제자이며 취소·환불·무효가 아닌 티켓이 남은 계정. 양도받은 보유자는 쓰지 않는다. 기한은 없다. 서버가 ticket-svc에 결제자 티켓을 물어 확인한다. 금칙어는 NFKC 정규화 뒤 대조해 422, 통보로 숨긴 후기와 같은 내용(공백·문장부호·전각 차이만)이면 저장하되 바로 HIDDEN이다(FR-033 마목). 사진은 먼저 POST /v1/review-images로 올리고 images로 붙인다(최대 3장 [가정], 이 계정이 올린 READY 사진만, 아니면 422. 소유자 요청 2026-10-19, ADR-0066)"
      security: [{ fanCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/EventId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewWrite' } } } }
      responses: { '201': { description: "게시(Location: /v1/reviews/{reviewId})", headers: { Location: { $ref: '#/components/headers/Location' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Review' } } } }, '401': { $ref: '#/components/responses/Unauthorized', description: "로그인 필요" }, '403': { $ref: '#/components/responses/Problem', description: "쓰기 자격 없음. type은 review-not-ended(공연 종료 예정 시각 전), review-not-purchaser(이 회차 결제자가 아니거나 티켓이 모두 취소·환불·무효, 양도받은 보유자 포함), review-event-cancelled(취소된 회차)" }, '409': { $ref: '#/components/responses/Problem', description: "review-already-written: 이 계정은 이 회차에 이미 후기를 씀(수정으로 안내, myReviewId)" }, '422': { $ref: '#/components/responses/Problem', description: "별점 1~5 밖, 본문 10~1,000자 [가정] 밖, 금칙어, 사진 3장 [가정] 초과·남의 사진·READY가 아닌 사진·사진 설명 100자 [가정] 초과" }, '503': { $ref: '#/components/responses/ServiceUnavailable', description: "후기 기능 꺼짐(명령 9)" } }
  /v1/events/{eventId}/review-summary:
    get:
      operationId: getEventReviewSummary
      tags: [reviews]
      x-peaket-roles: [public]
      security: []
      summary: "후기 요약(평균 별점·후기 수·최근 2개). 인증 없음, CDN 캐시"
      description: "FR-016, SCR-002 후기 섹션(소유자 결정 2026-10-14, ADR-0063). 이 회차가 속한 공연의 모든 회차 후기를 모은 요약이다(ADR-0093). 공연 상세와 같은 트래픽을 받으므로 쿠키를 캐시 키에 넣지 않고 Cache-Control: public, max-age=60 [가정]이다. mine은 늘 false(추천 적용 2026-10-14, ADR-0063)"
      parameters: [{ $ref: '#/components/parameters/EventId' }]
      responses: { '200': { description: 요약, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewSummary' } } } } }
  /v1/events/{eventId}/review-eligibility:
    get:
      operationId: getEventReviewEligibility
      tags: [reviews]
      x-peaket-roles: [fan]
      summary: "후기 쓰기 자격 확인([후기 쓰기]를 누를 때)"
      description: "FR-016(추천 적용 2026-10-14, ADR-0063). 자격이 없으면 화면이 이유 대화상자를 띄운다('공연이 끝난 뒤 이 회차를 예매하신 분만 후기를 쓸 수 있습니다'). 비로그인은 401이고 화면은 로그인 안내를 띄운다. Cache-Control: no-store"
      security: [{ fanCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/EventId' }]
      responses: { '200': { description: 자격, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewEligibility' } } } }, '401': { $ref: '#/components/responses/Unauthorized', description: "로그인 필요" } }
  /v1/reviews/{reviewId}:
    get:
      operationId: getReview
      tags: [reviews]
      x-peaket-roles: [public, fan]
      summary: "후기 하나(신고서에 붙인 후기 주소로 열 때)"
      description: "FR-016, FR-070(추천 적용 2026-10-14, ADR-0063). 신고 처리로 가린 후기(권리 침해 임시조치 notice RIGHTS_TEMP, 운영정책 노출 차단 notice POLICY)는 남에게도 본문·사진·별점 없이 notice만 있는 자리로 온다(정보통신망법 §44의2② 후단 공시, 추천 적용 2026-10-19, ADR-0066). 통보·같은 내용 차단과 불법 촬영물 신고 확인 중으로 숨긴 후기만 본인이 HIDDEN으로 받고 남은 404다(후기 목록과 같은 규칙). Cache-Control: private, no-store"
      security: [{}, { fanCookie: [] }]
      parameters: [{ name: reviewId, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: 후기, content: { application/json: { schema: { $ref: '#/components/schemas/Review' } } } }, '404': { $ref: '#/components/responses/Problem', description: "없음·지움·남에게 빠지는 숨긴 후기(통보·같은 내용 차단, 불법 촬영물 신고 확인 중)" } }
    patch:
      operationId: updateReview
      tags: [reviews]
      x-peaket-roles: [fan]
      summary: "내 후기 고치기(별점·본문)"
      description: "FR-016(소유자 결정 2026-10-14, ADR-0063). 작성자만. 쓰기와 같은 길이·금칙어·같은 내용 검사를 다시 한다. 통보로 숨긴 후기는 고칠 수 없다(409, 추천 적용 2026-10-14, ADR-0063). images를 보내면 사진 목록을 그 값으로 바꾸고 빠진 사진은 지운다(보내지 않으면 그대로, ADR-0066)"
