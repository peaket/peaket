    post: { operationId: createOpsEventFraudClusterRun, tags: [investigations], x-peaket-roles: [commander, cs_lead], summary: "실패한 후보 계산 다시 돌리기(SCR-070 ① [ 다시 돌리기 ])", description: "FR-072, forensic-replay.md §6.7.3 '실패'. 마지막 시도가 FAILED이고 자동 다시 시도가 다 끝났을 때만, 같은 판(같은 기록 고정 판·규칙 판)의 새 시도로 다시 돌린다(같은 입력이면 같은 결과, 실패한 시도 행은 남는다). 자동 다시 시도와 같은 작업 큐를 쓰고 ops_event FRAUD_CLUSTER_RUN(trigger MANUAL)을 남긴다. 실행 중이면 409 fraud-run-in-progress, 자동 다시 시도가 남았으면 409 fraud-run-retrying, 마지막 시도가 DONE이면 409 fraud-run-not-failed(새 고정 판은 시스템이 알아서 다시 센다), 조사 원천 보존이 끝났으면 410 investigation-source-expired다(추천 적용 2026-10-31, ADR-0171, FRN-070)", security: [{ opsCookie: [] }], parameters: [{ name: eventId, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' }], responses: { '202': { description: "다시 돌리기를 받음. 결과는 fraud-overview로 본다", content: { application/json: { schema: { $ref: '#/components/schemas/FraudClusterRun' } } } }, '403': { $ref: '#/components/responses/Problem', description: "investigator-required" }, '404': { $ref: '#/components/responses/Problem', description: "없는 회차" }, '409': { $ref: '#/components/responses/Problem', description: "fraud-run-in-progress, fraud-run-retrying, fraud-run-not-failed" }, '410': { $ref: '#/components/responses/Problem', description: "investigation-source-expired" } } }
  /v1/ops/fraud-clusters:
    get: { operationId: listOpsFraudClusters, tags: [investigations], x-peaket-roles: [commander, cs_lead], summary: "회차의 부정 예매 후보 묶음 목록(SCR-070 ②)", description: "FR-072, POL-046 ②. 지정 확인과 기록은 태그 investigations의 설명을 따른다. 후보는 온세일 윈도우가 끝난 뒤(T+60분) 2시간 [가정] 안에 처음 나오고 판매 종료까지 다시 계산된다. 아직 없으면 200과 빈 items다(guidelines §12). 정렬은 sort의 SCORE_DESC(기본, 점수 범주 높은 순)·PURCHASE_RATIO_DESC(구매 수 대 한도 큰 순)·LATEST다(추천 적용 2026-10-31, ADR-0171)", security: [{ opsCookie: [] }], parameters: [{ name: eventId, in: query, required: true, schema: { type: string } }, { name: sort, in: query, required: false, schema: { type: string, enum: [SCORE_DESC, PURCHASE_RATIO_DESC, LATEST] } }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }], responses: { '200': { description: "묶음 한 페이지(items·nextCursor, guidelines §3)", content: { application/json: { schema: { $ref: '#/components/schemas/FraudClusterPage' } } } }, '400': { $ref: '#/components/responses/Problem', description: "eventId 없음, limit 100 초과" }, '403': { $ref: '#/components/responses/Problem', description: "investigator-required(부정 거래 조사관 지정 없음)" } } }
