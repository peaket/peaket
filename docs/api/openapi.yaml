      summary: 굿즈 주문(한정 재고 Redis 차감 → 승인 직전 PostgreSQL 확정, 수령 방식)
      description: "FR-015, POL-016. 계정당 수량 제한. 인기 MD 오픈은 대기열 입장 토큰 필요. 한 주문은 한 판매자·한 수령 방식의 상품만 담는다(다르면 422). 택배 주문은 에스크로를 켠 결제 상점으로 결제해 신용카드 외 결제에서 결제대금예치를 고를 수 있고, 현장 수령은 에스크로를 켜지 않은 상점으로 결제한다(POL-014, 추천 적용 2026-10-14, ADR-0062)"
      security: [{ fanCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '201': { description: 주문, content: { application/json: { schema: { type: object, properties: { orderId: { type: string }, fulfillment: { type: string, enum: [DELIVERY, PICKUP] }, paymentStore: { type: string, enum: [STANDARD, ESCROW], description: "결제 상점(에스크로 여부). ESCROW(택배)면 결제창에서 결제대금예치를 고를 수 있고, 구매자가 골랐는지는 결제 승인 뒤 정해진다" } } } } } }, '409': { $ref: '#/components/responses/Problem', description: "품절, 탈퇴를 미루는 중인 계정(planning/03 §1.5 ⑧)" }, '422': { $ref: '#/components/responses/Problem', description: "판매자나 수령 방식이 다른 상품이 섞임" } }
  /v1/home:
    get:
      tags: [catalog]
      summary: "홈 피드(배너·오픈 예정·지금 판매 중·테마·공연장). 인증 없음, CDN 캐시"
      description: "FR-003, SCR-001(소유자 결정 2026-10-14, ADR-0063). 홈 ISR의 원본이다. 개인 값(찜한 공연, 오픈 알림 상태)은 싣지 않고 브라우저가 로그인했을 때 따로 받는다(GET /v1/wishes, GET /v1/subscriptions?eventIds=). 쿠키를 캐시 키에 넣지 않고 Cache-Control: public, max-age=30, stale-while-revalidate=30, stale-if-error=86400 [가정]이다. 원본 장애 때는 마지막 정상 응답이 나간다(SCR-001 오류 상태). 홈 구성 저장·판매 승인·매진 때 홈 캐시 태그를 무효화한다(추천 적용 2026-10-14, ADR-0063)"
      responses: { '200': { description: 피드, content: { application/json: { schema: { $ref: '#/components/schemas/HomeFeed' } } } } }
  /v1/home/rankings.json:
    servers: [{ url: 'https://www.peaket.example', description: "공연 페이지 배포의 정적 파일(원본 S3, ADR-0063)" }]
    get:
      tags: [catalog]
      summary: "장르별 랭킹 파일(어제 확정 판매 매수 순, 매일 10:00 [가정] 게시, 인증 없음)"
      description: "SCR-001 ⑧, docs/features/analytics.md §8.5(추천 적용 2026-10-14, ADR-0063). 판매 승인된 공연만 넣고 매진·판매 종료 공연도 넣어 saleStatus로 '매진'을 보인다. 장르 칩을 바꿔도 다시 받지 않도록 모든 장르를 한 파일에 싣는다. 게시 때 이 경로를 무효화하고 Cache-Control: public, max-age=3600 [가정]이다. 게시가 실패하면 직전 파일이 남고 basisDate로 알 수 있다"
      responses: { '200': { description: 랭킹, content: { application/json: { schema: { $ref: '#/components/schemas/RankingFile' } } } } }
  /v1/search:
    get:
      tags: [catalog]
      summary: "공연 검색(필터·정렬·페이지 번호). 인증 없음, CDN 캐시"
      description: "FR-003, SCR-003(소유자 결정 2026-10-14, ADR-0063). 공연명·아티스트·공연장을 pg_trgm으로 찾는다. 결과는 페이지 번호로 나눈다(주소 ?q=&page=로 공유·뒤로 가기, guidelines §3 예외). 깊은 페이지 부하를 막으려고 page × limit이 1,000 [가정]을 넘으면 400이다. q가 없으면 필터만으로 찾는다(홈 공연장 줄의 venueId). 인기순은 랭킹 잡이 함께 내는 회차별 최근 7일 확정 판매 매수 [가정] 순위(비공개 값, POL-043)를 쓰고 순위가 없는 공연은 뒤에 오픈 임박 순으로 둔다. 캐시 키는 정규화한 q와 필터·정렬·page·limit만이고 쿠키는 넣지 않는다(Cache-Control: public, max-age=30 [가정], 추천 적용 2026-10-14, ADR-0063)"
      parameters: [{ name: q, in: query, schema: { type: string, maxLength: 50 } }, { name: genre, in: query, schema: { $ref: '#/components/schemas/Genre' } }, { name: venueId, in: query, schema: { type: string } }, { name: dateFrom, in: query, schema: { type: string, format: date } }, { name: dateTo, in: query, schema: { type: string, format: date } }, { name: status, in: query, description: "예매 상태", schema: { type: string, enum: [UPCOMING, ON_SALE, SOLD_OUT] } }, { name: sort, in: query, schema: { type: string, enum: [RELEVANCE, OPEN_SOON, POPULAR], default: RELEVANCE } }, { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }, { name: limit, in: query, description: "한 페이지 20개 [가정]", schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }]
      responses: { '200': { description: 결과, content: { application/json: { schema: { $ref: '#/components/schemas/SearchResultPage' } } } }, '400': { $ref: '#/components/responses/Problem', description: "page × limit 상한 초과, 형식 오류" } }
  /v1/search/suggestions:
    get:
      tags: [catalog]
      summary: "연관 검색어(2자부터 [가정], 최대 8개 [가정]). 인증 없음, CDN·Redis 캐시"
      description: "SCR-003 머리 검색창의 연관 검색어 창(소유자 결정 2026-10-14, ADR-0063). 공연·아티스트·공연장을 구분하고 공연이면 작은 포스터와 오픈 일시를 싣는다. 입력은 NFKC·소문자·앞뒤 공백 제거로 정규화하고 이 값만 캐시 키로 쓴다(CDN과 Redis `cat:suggest`, 60초 [가정]). 브라우저는 입력이 바뀌면 이전 요청을 취소한다. 최근 검색어는 서버로 보내지 않고 기기에만 둔다(추천 적용 2026-10-14, ADR-0063)"
      parameters: [{ name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 50 } }]
      responses: { '200': { description: 연관 검색어, content: { application/json: { schema: { $ref: '#/components/schemas/SuggestResult' } } } }, '400': { $ref: '#/components/responses/Problem', description: "2자 미만·50자 초과" } }
  /v1/events/{eventId}/reviews:
    get:
      tags: [reviews]
      summary: "관람 후기 목록(후기 전체 모달, 정렬, '더 보기' 커서)"
      description: "FR-016, FR-070, SCR-016(소유자 결정 2026-10-14, ADR-0063). 통보·같은 내용 차단과 불법 촬영물 신고 확인 중으로 숨긴 후기는 남에게 빠지고 본인에게만 HIDDEN으로 온다. 신고 처리로 임시조치·노출 차단한 후기는 남에게 본문·사진·별점 없이 notice만 있는 자리로 온다(정보통신망법 §44의2② 후단 공시, 추천 적용 2026-10-19, ADR-0066). 팬 쿠키가 있으면 mine·reportedByMe를 채우므로 Cache-Control: private, no-store다. 명령 9로 후기 기능을 끄면 503. 후기마다의 [신고]는 POST /v1/reviews/{reviewId}/reports이고, 신고기관(한국콘텐츠진흥원) 온라인 암표신고센터 바로가기는 외부 누리집 링크라 API가 없다(POL-024 나목, 소유자 요청 2026-10-19, ADR-0066)"
      security: [{}, { fanCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/EventId' }, { name: sort, in: query, schema: { type: string, enum: [LATEST, RATING_DESC, RATING_ASC], default: LATEST } }, { $ref: '#/components/parameters/Cursor' }, { name: limit, in: query, required: false, description: "기본 10 [가정], 최대 50", schema: { type: integer, minimum: 1, maximum: 50 } }]
      responses: { '200': { description: 목록, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewPage' } } } }, '503': { $ref: '#/components/responses/ServiceUnavailable', description: "후기 기능 꺼짐(명령 9)" } }
    post:
      tags: [reviews]
      summary: "관람 후기 쓰기(공연 종료 뒤, 그 회차 결제자, 회차당 하나)"
      description: "FR-016, POL-024 다목 고지(쓰기 모달 위), 소유자 결정 2026-10-14, ADR-0063. 자격: 그 회차의 공연 종료 예정 시각(event.ends_at)이 지났고 그 회차 티켓의 결제자이며 취소·환불·무효가 아닌 티켓이 남은 계정. 양도받은 보유자는 쓰지 않는다. 기한은 없다. 서버가 ticket-svc에 결제자 티켓을 물어 확인한다. 금칙어는 NFKC 정규화 뒤 대조해 422, 통보로 숨긴 후기와 같은 내용(공백·문장부호·전각 차이만)이면 저장하되 바로 HIDDEN이다(FR-033 마목). 사진은 먼저 POST /v1/review-images로 올리고 images로 붙인다(최대 3장 [가정], 이 계정이 올린 READY 사진만, 아니면 422. 소유자 요청 2026-10-19, ADR-0066)"
      security: [{ fanCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/EventId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewWrite' } } } }
      responses: { '201': { description: "게시(Location: /v1/reviews/{reviewId})", headers: { Location: { $ref: '#/components/headers/Location' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Review' } } } }, '401': { $ref: '#/components/responses/Unauthorized', description: "로그인 필요" }, '403': { $ref: '#/components/responses/Problem', description: "쓰기 자격 없음. type은 review-not-ended(공연 종료 예정 시각 전), review-not-purchaser(이 회차 결제자가 아니거나 티켓이 모두 취소·환불·무효, 양도받은 보유자 포함), review-event-cancelled(취소된 회차)" }, '409': { $ref: '#/components/responses/Problem', description: "review-already-written: 이 계정은 이 회차에 이미 후기를 씀(수정으로 안내, myReviewId)" }, '422': { $ref: '#/components/responses/Problem', description: "별점 1~5 밖, 본문 10~1,000자 [가정] 밖, 금칙어, 사진 3장 [가정] 초과·남의 사진·READY가 아닌 사진·사진 설명 100자 [가정] 초과" }, '503': { $ref: '#/components/responses/ServiceUnavailable', description: "후기 기능 꺼짐(명령 9)" } }
  /v1/events/{eventId}/review-summary:
    get:
      tags: [reviews]
      summary: "후기 요약(평균 별점·후기 수·최근 2개). 인증 없음, CDN 캐시"
      description: "FR-016, SCR-002 후기 섹션(소유자 결정 2026-10-14, ADR-0063). 공연 상세와 같은 트래픽을 받으므로 쿠키를 캐시 키에 넣지 않고 Cache-Control: public, max-age=60 [가정]이다. mine은 늘 false(추천 적용 2026-10-14, ADR-0063)"
      parameters: [{ $ref: '#/components/parameters/EventId' }]
      responses: { '200': { description: 요약, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewSummary' } } } } }
  /v1/events/{eventId}/review-eligibility:
    get:
      tags: [reviews]
      summary: "후기 쓰기 자격 확인([후기 쓰기]를 누를 때)"
      description: "FR-016(추천 적용 2026-10-14, ADR-0063). 자격이 없으면 화면이 이유 대화상자를 띄운다('공연이 끝난 뒤 이 회차를 예매하신 분만 후기를 쓸 수 있습니다'). 비로그인은 401이고 화면은 로그인 안내를 띄운다. Cache-Control: no-store"
      security: [{ fanCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/EventId' }]
      responses: { '200': { description: 자격, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewEligibility' } } } }, '401': { $ref: '#/components/responses/Unauthorized', description: "로그인 필요" } }
  /v1/reviews/{reviewId}:
    get:
      tags: [reviews]
      summary: "후기 하나(신고서에 붙인 후기 주소로 열 때)"
      description: "FR-016, FR-070(추천 적용 2026-10-14, ADR-0063). 신고 처리로 가린 후기(권리 침해 임시조치 notice RIGHTS_TEMP, 운영정책 노출 차단 notice POLICY)는 남에게도 본문·사진·별점 없이 notice만 있는 자리로 온다(정보통신망법 §44의2② 후단 공시, 추천 적용 2026-10-19, ADR-0066). 통보·같은 내용 차단과 불법 촬영물 신고 확인 중으로 숨긴 후기만 본인이 HIDDEN으로 받고 남은 404다(후기 목록과 같은 규칙). Cache-Control: private, no-store"
      security: [{}, { fanCookie: [] }]
      parameters: [{ name: reviewId, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: 후기, content: { application/json: { schema: { $ref: '#/components/schemas/Review' } } } }, '404': { $ref: '#/components/responses/Problem', description: "없음·지움·남에게 빠지는 숨긴 후기(통보·같은 내용 차단, 불법 촬영물 신고 확인 중)" } }
    patch:
      tags: [reviews]
      summary: "내 후기 고치기(별점·본문)"
      description: "FR-016(소유자 결정 2026-10-14, ADR-0063). 작성자만. 쓰기와 같은 길이·금칙어·같은 내용 검사를 다시 한다. 통보로 숨긴 후기는 고칠 수 없다(409, 추천 적용 2026-10-14, ADR-0063). images를 보내면 사진 목록을 그 값으로 바꾸고 빠진 사진은 지운다(보내지 않으면 그대로, ADR-0066)"
      security: [{ fanCookie: [] }]
      parameters: [{ name: reviewId, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewWrite' } } } }
      responses: { '200': { description: 고침, content: { application/json: { schema: { $ref: '#/components/schemas/Review' } } } }, '403': { $ref: '#/components/responses/Problem', description: "작성자가 아님" }, '409': { $ref: '#/components/responses/Problem', description: "통보로 숨긴 후기" }, '422': { $ref: '#/components/responses/Problem', description: "별점·길이·금칙어" } }
    delete:
      tags: [reviews]
      summary: "내 후기 지우기"
      description: "FR-016(소유자 결정 2026-10-14, ADR-0063). 작성자만. 지운 뒤 같은 회차에 다시 쓸 수 있다. 통보로 숨긴 후기를 지워도 조치 증적(takedown_action)은 3년 남는다. 붙은 사진의 파생본도 지우고 CDN을 무효화한다(ADR-0066)"
      security: [{ fanCookie: [] }]
      parameters: [{ name: reviewId, in: path, required: true, schema: { type: string } }]
