  /v1/shop/products/{productId}:
    get:
      operationId: getShopProduct
      tags: [shop]
      x-peaket-roles: [public]
      security: []
      summary: "굿즈·부가 상품 상세(옵션, 수령 방식과 시간대, 판매자 정보, 반품 조건, 남은 수량)"
      description: "FR-014, FR-015, POL-016, POL-037, SCR-015, ADR-0101, docs/frontend.md §6.2 32번. 게시한(PUBLISHED) 상품만 답하고 DRAFT·HIDDEN은 404다. 개인 값은 싣지 않는다(티켓 보유 여부와 구매 한도 잔여는 주문 때 서버가 본다). 상품 화면은 웹 앱 서버가 이 경로로 그려 300초 ISR에 둔다(docs/frontend.md §2.5). 그 화면의 남은 수량은 늦으므로, 브라우저가 이 경로를 다시 읽어 얹는다 [가정]. 그래서 Cache-Control: public, max-age=0, s-maxage=5 [가정]다. queueRequired가 참이면 화면은 /shop/{productId}/queue로 보낸다"
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 상품, content: { application/json: { schema: { $ref: '#/components/schemas/ShopProduct' } } } }
        '404': { $ref: '#/components/responses/Problem', description: "없거나 게시하지 않은 상품(not-found)" }
        '429': { $ref: '#/components/responses/TooManyRequests', description: "요청 한도 초과" }
  /v1/transfers:
    get:
      operationId: listTransfers
      tags: [tickets]
      x-peaket-roles: [fan]
      security: [{ fanCookie: [] }]
      summary: "내가 받은 양도 요청 목록(월렛의 받기 카드)"
      description: "FR-060, POL-017, SCR-041, SCR-013, docs/frontend.md §6.2 32번. 세션 계정이 받는 사람으로 지정된 요청만 최근 순으로 준다(그래서 role은 늘 RECIPIENT다). 경로와 쿼리에 계정 값이 없다. 결제 금액과 결제자 연락처는 싣지 않는다(authz-matrix §4.1 '양도 요청'). 화면 칩 '받기 기다리는 중'은 status=OFFERED다. Cache-Control: private, no-store"
      parameters:
        - { name: status, in: query, required: false, description: "쉼표로 이은 상태(없으면 전체)", style: form, explode: false, schema: { type: array, items: { type: string, enum: [OFFERED, ACCEPTED, REJECTED, WITHDRAWN, EXPIRED, RECLAIMED] } } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: 양도 요청 한 페이지, content: { application/json: { schema: { $ref: '#/components/schemas/TransferOfferPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized', description: "로그인 필요" }
  # ── 6. 초대 거절, 내 현장 배정 ────────────────────────────────
  /v1/staff-invitation-rejections:
    post:
      operationId: createStaffInvitationRejection
      tags: [identity]
      x-peaket-roles: [fan]
      security: [{ fanCookie: [] }]
      summary: "현장 스태프 초대 거절(SCR-050 [수락하지 않기])"
      description: "FR-046, POL-031, ADR-0051, docs/design/d5 §1.6 5번·§5.26. 토큰은 링크의 URL 조각에서 꺼내 본문으로 보낸다(주소에 두지 않는다, guidelines §9). 초대 이메일로만 가는 1회용 토큰을 가진 로그인 계정이면 거절할 수 있다 [가정](수락과 달리 본인확인과 이메일 일치를 보지 않는다. 거절은 아무 권한도 주지 않고, 수락 조건을 못 채운 사람도 거절할 수 있어야 해서다). 배정 상태를 EXPIRED로 끝내고 invite_email을 파기한다(거절을 따로 보이는 값은 응답 열거를 늘려 계약이 깨지므로 두지 않는다 [가정])(data-classification '현장 스태프 초대 이메일'). 같은 토큰을 다시 보내도 같은 204라 멱등 키를 받지 않는다(guidelines §4). 동의는 받지 않는다. Cache-Control: no-store"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              type: object
              required: [inviteToken]
              properties:
                inviteToken: { type: string, maxLength: 128, description: "링크의 토큰. 128자 상한은 [가정]" }
      responses:
        '204': { description: 거절함 }
        '400': { $ref: '#/components/responses/Problem', description: "본문 형식 오류, 모르는 칸" }
        '401': { $ref: '#/components/responses/Unauthorized', description: "로그인 필요" }
        '410': { $ref: '#/components/responses/Problem', description: "만료되었거나 이미 수락한 초대(조회·수락의 410과 같다)" }
        '429': { $ref: '#/components/responses/TooManyRequests', description: "요청 한도 초과" }
  /v1/staff-assignments:
    get:
      operationId: listStaffAssignments
      tags: [identity]
      x-peaket-roles: [fan]
      security: [{ fanCookie: [] }]
      summary: "내 현장 배정 목록(SCR-061)"
      description: "FR-046, POL-031, ADR-0051, docs/design/d5 §1.6 5번·§5.35. 세션 계정의 배정(ASSIGNED·ENDED·REVOKED)을 유효 시작이 늦은 순으로 준다. 초대 중(INVITED)과 거절·만료(EXPIRED)는 뺀다. 공연명·시작 시각·판매자 상호는 싣지 않고 화면이 eventId로 회차 공개 요약(GET /v1/events/{eventId})을 읽는다(소유자 결정 2026-10-30 open-items 78번의 DeviceApprovalView와 같은 방식). '진행 중'은 ASSIGNED이면서 지금이 validFrom과 validUntil 사이인 것으로 화면이 계산한다(data.md staff_assignment). Cache-Control: private, no-store"
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: 배정 한 페이지, content: { application/json: { schema: { $ref: '#/components/schemas/StaffAssignmentSelfPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized', description: "로그인 필요" }
  # ── 7. 계정 ──────────────────────────────────────────────────
  /v1/reviews:
    get:
      operationId: listReviews
      tags: [reviews]
      x-peaket-roles: [fan]
      security: [{ fanCookie: [] }]
      summary: "내 후기 가운데 가려진 글 목록(내 차단 글 조회)"
      description: "FR-033, FR-070, POL-024, POL-044, ADR-0066, docs/design/d5 §1.6 18번. 세션 계정이 쓴 후기만 준다(경로와 쿼리에 계정 값이 없다). 이번에는 status=HIDDEN만 받는다(내 글 전체 목록은 범위 밖). 통보·같은 내용 차단과 불법 촬영물 신고 확인 중인 글은 남의 목록에서 빠지므로 글쓴이가 볼 곳은 이 목록과 공연 상세의 내 후기뿐이다. 신고한 계정과 신고 상세는 싣지 않는다(authz-matrix §4.1). 이의는 고객 문의(category MODERATION_APPEAL)로 받는다. Cache-Control: private, no-store"
      parameters:
        - { name: status, in: query, required: true, schema: { type: string, enum: [HIDDEN] } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: 후기 한 페이지, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewPage' } } } }
        '400': { $ref: '#/components/responses/Problem', description: "status가 없거나 HIDDEN이 아니다, limit 100 초과" }
        '401': { $ref: '#/components/responses/Unauthorized', description: "로그인 필요" }
  /v1/identity/profile:
    get:
      operationId: getIdentityProfile
      tags: [identity]
      x-peaket-roles: [fan]
      security: [{ fanCookie: [] }]
      summary: "내 프로필과 동의 상태(계정 설정)"
      description: "FR-017, POL-019, POL-023, SCR-017 ①·④·⑦, docs/design/d5 §1.6 18번. 페이지마다 부르는 GET /v1/identity/me에는 개인정보를 싣지 않으므로(ADR-0202) 계정 설정 화면만 쓰는 경로를 따로 둔다. 이메일은 화면이 쓰지 않아 싣지 않는다. 휴대폰 번호는 가린 값만 준다. 저장된 예매자 정보는 예매 화면의 입력을 미리 채우는 본인 값이라 원문이다(authz-matrix §4.1 팬(본인) 원문). Cache-Control: no-store"
      responses:
        '200': { description: 프로필, content: { application/json: { schema: { $ref: '#/components/schemas/IdentityProfile' } } } }
        '401': { $ref: '#/components/responses/Unauthorized', description: "세션 없음·만료" }
    patch:
      operationId: updateIdentityProfile
      tags: [identity]
      x-peaket-roles: [fan]
      security: [{ fanCookie: [] }]
      summary: "내 프로필 고치기(닉네임, 연락처, 저장된 예매자 정보)"
      description: "FR-017, POL-019, POL-023, ADR-0203 결정 2, I-T18, SCR-017 ⑦, docs/design/d5 §1.6 18번. 보낸 칸만 바꾼다. 혼자 바꾸는 자기 상태라 If-Match 없이 마지막 저장이 이긴다(guidelines §12 예외). 같은 요청을 다시 보내도 결과가 같아 멱등 키를 받지 않는다. 닉네임은 가입 마무리와 같은 규칙이다(NFC, 앞뒤 공백 제거, 문자소 2~12개, 중복은 NFKC·대소문자 접기). phone을 바꿀 때만 재인증 토큰이 필요하고(FAN_SENSITIVE, 5분 한 번), 휴대폰 번호 수집 동의(PRIVACY_PHONE)가 있어야 한다. 닉네임은 이미 낸 후기·양도 표시에 소급하지 않는다 [가정](후기 작성자 표시는 첫 글자만이다). Cache-Control: no-store phone은 연락처 값이고 소유를 확인하지 않는다. 양도 받는 사람 찾기(POST /v1/transfer-recipient-lookups)는 이 값이 아니라 본인확인을 마친 번호로만 찾는다 [가정](구현 단계가 지킨다)."
      parameters:
        - { name: X-Reauth-Token, in: header, required: false, description: "phone을 바꿀 때 필수(guidelines §7)", schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/IdentityProfileUpdateInput' } } } }
      responses:
        '200': { description: 바뀐 프로필, content: { application/json: { schema: { $ref: '#/components/schemas/IdentityProfile' } } } }
        '400': { $ref: '#/components/responses/Problem', description: "본문 형식 오류, 모르는 칸, 닉네임 꼴(nickname-invalid)" }
        '401': { $ref: '#/components/responses/Unauthorized', description: "세션 없음·만료" }
        '403': { $ref: '#/components/responses/Problem', description: "phone을 보냈는데 재인증이 없거나 만료·재사용(reauth-required)" }
        '409': { $ref: '#/components/responses/Problem', description: "다른 사람이 쓰는 닉네임(nickname-taken), 탈퇴를 미루는 중인 계정(docs/planning/03 §1.5 ⑧)" }
        '415': { $ref: '#/components/responses/Problem', description: "application/json이 아닌 본문" }
        '422': { $ref: '#/components/responses/Problem', description: "휴대폰 번호 수집 동의 없이 phone을 보냈다(consent-required)" }
        '429': { $ref: '#/components/responses/TooManyRequests', description: "요청 한도 초과" }
  /v1/identity/consents/{kind}:
    put:
      operationId: putIdentityConsent
      tags: [identity]
      x-peaket-roles: [fan]
      security: [{ fanCookie: [] }]
      summary: "선택 동의 켜기(마케팅 알림, 휴대폰 번호 수집)"
      description: "FR-017, POL-023, SCR-017 ④, docs/planning/03 §1.2, docs/design/d5 §1.6 18번. 선택 동의 둘만 받는다(필수 동의는 철회 대신 탈퇴다). 고지 문안의 판과 동의 일시는 서버가 정해 consent에 남긴다(가입 마무리와 같다, ADR-0203). 마케팅 수신 채널은 §1.2의 기본값 [가정]이다. 이미 같은 판의 동의가 있으면 그대로 200이라 멱등 키를 받지 않는다. 동의·거부 결과의 14일 안 통지는 알림이 맡는다(§1.2). Cache-Control: no-store"
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string, enum: [MARKETING, PRIVACY_PHONE] } }
      responses:
        '200': { description: 동의, content: { application/json: { schema: { $ref: '#/components/schemas/IdentityConsent' } } } }
        '401': { $ref: '#/components/responses/Unauthorized', description: "세션 없음·만료" }
        '429': { $ref: '#/components/responses/TooManyRequests', description: "요청 한도 초과" }
    delete:
      operationId: deleteIdentityConsent
      tags: [identity]
      x-peaket-roles: [fan]
      security: [{ fanCookie: [] }]
      summary: "선택 동의 철회(마케팅 알림, 휴대폰 번호 수집)"
      description: "FR-017, POL-023, data.md consent('선택 동의를 철회하면 그 종류의 행을 지운다'), docs/design/d5 §1.6 18번. 없어도 204다(멱등). PRIVACY_PHONE을 철회하면 계정의 휴대폰 번호(account.phone)도 비운다 [가정](수집 근거가 사라진다). 그러면 양도 받는 사람 찾기와 공연 당일 문자 알림에서 그 번호를 쓰지 못한다. 저장된 예매자 정보는 이 동의와 따로다 [가정]. Cache-Control: no-store"
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string, enum: [MARKETING, PRIVACY_PHONE] } }
      responses:
        '204': { description: 철회함 }
        '401': { $ref: '#/components/responses/Unauthorized', description: "세션 없음·만료" }
        '429': { $ref: '#/components/responses/TooManyRequests', description: "요청 한도 초과" }
  /v1/identity/scanner-sessions:
    get:
      operationId: getIdentityScannerSessions
      tags: [identity]
      x-peaket-roles: [fan]
      security: [{ fanCookie: [] }]
      summary: "내 스캐너 세션 목록(휴대폰 쪽, SCR-017 로그인한 기기)"
      description: "FR-046, POL-031, ADR-0051, SCR-017 ②, docs/features/identity.md §6.1 '세션 수', docs/design/d5 §1.6 18번, BUILD_ORDER GAT-230. 세션 계정의 끝나지 않은 스캐너 세션을 준다. 계정마다 1개뿐이라(I-T38) 나누지 않는다(guidelines §3). 스태프가 아니면 빈 items다. Cache-Control: no-store"
      responses:
        '200': { description: 목록, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, maxItems: 1, items: { $ref: '#/components/schemas/ScannerSessionSelf' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized', description: "세션 없음·만료" }
  /v1/identity/scanner-sessions/{sessionId}:
    delete:
      operationId: deleteIdentityScannerSession
      tags: [identity]
      x-peaket-roles: [fan]
      security: [{ fanCookie: [] }]
      summary: "내 스캐너 세션 끝내기(재인증 토큰 필요)"
      description: "FR-046, POL-031, ADR-0051, SCR-017 ②, docs/features/identity.md §6.1, docs/design/d5 §5.17, BUILD_ORDER GAT-230. 다른 기기 로그아웃(DELETE /v1/identity/sessions/{sessionId})과 같은 재인증이다(작업 묶음 FAN_SENSITIVE, 5분 한 번, 404는 토큰을 쓰지 않는다). scanner_session.terminated_at을 적으면 스캐너 경로 가드의 세션 확인이 다음 요청부터 거절한다. 오프라인 기기에 남은 스캔 기록은 기기 자격으로 올린다(offline-gate §6.5). 휴대폰 로그아웃과는 따로다. Cache-Control: no-store"
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/ReauthToken' }
      responses:
        '204': { description: 끝냈다 }
        '401': { $ref: '#/components/responses/Unauthorized', description: "세션 없음·만료" }
        '403': { $ref: '#/components/responses/Problem', description: "재인증 없음·만료·재사용(reauth-required)" }
        '404': { $ref: '#/components/responses/Problem', description: "이 계정의 살아 있는 스캐너 세션이 아니다. 다른 계정의 세션·끝난 세션·없는 ID가 모두 같다(session-not-found)" }
  /v1/appeals/{appealId}:
    get:
