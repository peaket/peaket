              artistId: { type: [string, 'null'], format: uuid, description: "새 이름 요청이면 null" }
              name: { type: string }
        aliases: { type: array, items: { type: string } }
        saleReview: { type: string, enum: [DRAFT, SUBMITTED, APPROVED, REJECTED, SUSPENDED] }
        hasApprovalHistory: { type: boolean }
        saleApprovedAt: { type: [string, 'null'], format: date-time }
        rejectionReason: { type: [string, 'null'] }
        suspensionReasonCode: { type: [string, 'null'], enum: [SELLER_IDENTITY, LEGAL_REQUEST, FRAUD_SUSPECTED, OTHER, null] }
        hasPendingRevision: { type: boolean, description: "재승인 대기 변경분이 있는지" }
        pendingRevisionFields: { type: array, items: { type: string }, description: "변경분에 든 항목 이름" }
        progressStage: { type: string, enum: [REGISTRATION, SALE_REVIEW, OPEN, SALE, ENTRY, ENTRY_RECORD_CLOSED, SETTLEMENT], description: "SCR-063 진행 단계. 끝나지 않은 회차 가운데 가장 이른 회차 기준 [가정]" }
        images: { type: array, items: { $ref: '#/components/schemas/ProductionImage' } }
        events: { type: array, items: { $ref: '#/components/schemas/PartnerEventDetail' }, description: "회차는 공연 하나에 50개 [가정]까지라 나누지 않는다" }
    PartnerProductionUpdate:
