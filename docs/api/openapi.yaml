        '403': { $ref: '#/components/responses/Problem', description: "partner-admin-required: 파트너 실무자가 부름" }
        '404': { $ref: '#/components/responses/Problem', description: "not-found: 없는 회차와 다른 파트너 회차(같은 응답, 개인정보가 든 기록이라 있는지 알리지 않는다)" }
        '410': { $ref: '#/components/responses/Problem', description: "retention-ended: 회차가 끝나고 1개월이 지남" }
