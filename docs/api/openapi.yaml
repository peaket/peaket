  /v1/partner/webhooks:
    post: { operationId: createPartnerWebhook, tags: [partner], x-peaket-roles: [partner_admin], summary: "웹훅 등록(https만, 엔드포인트마다 서명 비밀 발급)", description: "FR-025, ADR-0053. 목적: 판매·취소·매진·회차 취소·연기·정산 같은 일이 생기면 PEAKET이 파트너 회사 서버 주소로 바로 알려 파트너 시스템(매출·회계, 사내 메신저, 자사 공지, 정산 입금 확인)이 콘솔을 계속 확인하지 않게 한다. 본문에 개인정보·좌석 번호가 없어 팬 관리(CRM)에는 쓸 수 없고, 쓰지 않아도 판매·정산은 그대로다(추천 적용 2026-10-19, ADR-0066). Standard Webhooks 형식으로 보낸다. 헤더는 webhook-id(사건 키, 재전송에도 같음), webhook-timestamp(시도 시각, 유닉스 초), webhook-signature(v1, 뒤에 base64 HMAC-SHA256(비밀, id.timestamp.본문))다. 비밀(whsec_, 32바이트)은 등록 응답에 한 번만 보여 준다. 비밀을 바꾸면 24시간 동안 옛 비밀과 새 비밀의 서명을 공백으로 이어 함께 보낸다. 받는 쪽은 시각 차이 5분 초과를 거부하고 webhook-id로 중복을 거른다. 보내는 이벤트 8종과 본문은 webhooks의 partnerEvent이고, 엔드포인트마다 고른 type만 보낸다. 등록·비밀 재발급·다시 보내기는 파트너 관리자(partner_admin)만 하고 partner_member는 403(docs/planning/03 §3, 추천 적용 2026-10-14, ADR-0062)", security: [{ partnerCookie: [] }], requestBody: { content: { application/json: { schema: { additionalProperties: false, type: object, required: [url], properties: { url: { type: string, format: uri, description: https만 }, eventTypes: { type: array, minItems: 0, description: "구독할 이벤트. 기본값은 아무것도 고르지 않음이고 이때는 보내지 않는다", items: { type: string, enum: [order.confirmed, order.cancelled, event.sold_out, event.cancelled, event.postponed, statement.notified, payout.completed, payout.failed] } } } } } } }, responses: { '201': { description: "등록. 서명 비밀(whsec_로 시작)은 이 응답에만 한 번 싣는다(추천 적용 2026-10-30, docs/features/notify.md §9)", content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/WebhookEndpoint' }, { type: object, properties: { secret: { type: string, description: "whsec_로 시작" } } }] } } } }, '400': { $ref: '#/components/responses/Problem', description: "webhook-url-not-allowed. 사유(reason): scheme(https가 아님), port(443이 아님), credentials(주소 안의 사용자 정보), ip-literal(IP를 그대로 쓴 주소), private-address(해석한 IP 가운데 사설·루프백·링크 로컬·CGNAT·메타데이터·IPv6 ULA·IPv4 사상 주소가 있음), unresolvable(이름을 해석하지 못함). 발송 때도 연결할 때마다 같은 IP 검사를 하고 리디렉션은 따르지 않는다(docs/api/guidelines.md §8, 추천 적용 2026-10-28, 기술 검토 중간-061)" }, '403': { $ref: '#/components/responses/Problem', description: "파트너 관리자가 아님(partner_member)" } } }
