      summary: "팬별 판매 자격(선예매 대상 여부·단계별 시작 시각·1인 한도, SCR-002 ⑦)"
      description: "FR-022, POL-011, SCR-002(추천 적용 2026-11-10, ADR-0261 결정 5, ADR-0213 결정 1). 이 회차의 판매 단계(공개 요약 salePhases와 같은 조각)마다 이 계정이 진입 판정을 지나는지와 한도, 이 계정이 든 이 공연의 판매 자격 명단의 표시 이름·파기 예정 시각을 준다. 명단 키·다른 사람의 정보는 싣지 않는다. 공개 요약에 PRESALE 조각이 있을 때만 화면이 문서마다 한 번 부른다(HOT-346). 공개되지 않은 회차와 없는 회차는 같은 404, 판매 중지는 410 event-suspended다(GET /v1/events/{eventId}와 같다). 표시용이고 집행은 진입·로비(403 sale-eligibility-required)와 홀드(403 sale-policy-denied)가 한다. Cache-Control: no-store"
