  - { name: tickets, description: 월렛·양도·티켓 연동 부가 상품 (gw-fan) }
  - { name: shop, description: 굿즈 (gw-fan) }
  - { name: catalog, description: "홈 피드·장르별 랭킹 파일·검색·자동완성 (gw-fan, 인증 없음, CDN 캐시, ADR-0063·0094)" }
  - { name: reviews, description: "관람 후기·후기 사진·게시물 신고 (gw-fan, ADR-0063·0066)" }
  - { name: support, description: "고객 문의·소명·예매 제한 상태 (gw-fan, core-svc support 모듈, ADR-0066. 소명·예매 제한 상태는 추천 적용 2026-10-30)" }
  - { name: identity, description: 본인확인·세션·토큰 (gw-fan·gw-partner·gw-ops) }
  - { name: partner, description: 파트너 콘솔 (gw-partner) }
  - { name: ops, description: 관제 (gw-ops) }
  - { name: investigations, description: "부정 거래 조사 (gw-ops, SCR-069~071, FR-071~074, ADR-0171). 이 태그의 작업은 지정 부정 거래 조사관만 부른다. 역할 칸은 commander·cs_lead이고, ops-svc가 요청마다 identity-svc GetAdminDesignations로 FRAUD_INVESTIGATOR 지정을 확인한다(캐시 5초 [가정]). 지정이 없으면 403 investigator-required이고 감사 기록에 남는다. 승인자(commander)는 이 경로를 부르지 않고 승인 업무 상세의 fraudCaseSummary만 본다. 조회·내려받기는 관리 계정 접속기록(2년)과 대량 조회 점검(FR-064) 대상이다(docs/observability.md §7 invAccess). 연구 갈래(가명정보) 경로와 섞지 않는다(추천 적용 2026-10-31, ADR-0171 결정 2·7)" }
  - { name: scanner, description: 게이트 스캐너 (gw-scanner) }
  - { name: webhooks, description: 외부 수신 (gw-partner) }
components:
  securitySchemes:
    fanCookie: { type: apiKey, in: cookie, name: __Secure-peaket_at, description: "팬 액세스 토큰(팬 토큰 키 ES256, typ at+jwt, 15분). Secure·HttpOnly·SameSite=Strict, Domain=peaket.example(소비자 웹 앱 서버·gw-fan·gw-queue가 함께 쓰는 쿠키라 __Host- 대신 __Secure-, 추천 적용 2026-10-15, docs/features/identity.md §3). gw-fan·gw-queue가 검증(ADR-0050)" }
    refreshCookie: { type: apiKey, in: cookie, name: __Secure-peaket_rt, description: "팬 리프레시 토큰(불투명 참조 토큰). Secure·HttpOnly·SameSite=Strict, Domain=peaket.example, Path=/v1/identity/access-tokens(소비자 웹 앱 서버가 로그인 때 주고 gw-fan의 토큰 갱신이 읽음, 추천 적용 2026-10-15)" }
    admissionToken: { type: apiKey, in: header, name: X-Admission-Token, description: "입장 토큰(ES256, typ admission+jwt, aud purchase, 한 구매 세션 전용). 클레임에 여정 ID jny(조사용 추적 ID, UUIDv7)가 있다. 우선 구매(POL-046 ⑦) 입장이면 권리 ID prio도 있고, 그 토큰은 판매 종료 규칙의 예외(그 권리 좌석 하나의 홀드·주문)를 받는다. purchase-svc가 구매 세션에 두고, gw-fan은 접근 로그 줄에 남겨 노드 에이전트의 조사 사본 갈래가 investigation.requests로 옮긴다(docs/features/queue-admission.md, 추천 적용 2026-10-31, ADR-0171)" }
    partnerCookie: { type: apiKey, in: cookie, name: __Secure-peaket_partner_at, description: "파트너 액세스 토큰(관리 토큰 키 ES256, typ at+jwt, aud partner). Secure·HttpOnly·SameSite=Strict, Domain=peaket.example(gw-partner의 로그인·토큰 갱신 응답이 주고, gw-partner와 파트너 콘솔 앱 서버(서버 컴포넌트가 gw-partner를 부를 때 넘긴다)가 읽는 공유 쿠키, 추천 적용 2026-10-15, ADR-0119). gw-partner가 검증(ADR-0050). 역할과 테넌트는 클레임에 없다. 서비스가 요청마다 identity GetAdminAuthz로 그 세션의 역할·테넌트를 받는다(소유자 결정 2026-10-31, ADR-0172). 바깥 요청에 붙은 X-User-Role·X-Tenant-Id 같은 이름의 헤더는 먼저 지운다(docs/features/identity.md §3, docs/security/authz-matrix.md §3.1, 추천 적용 2026-10-30)" }
    opsCookie: { type: apiKey, in: cookie, name: __Host-peaket_ops_at, description: "운영자 액세스 토큰(관리 토큰 키 ES256, typ at+jwt, aud ops). Secure·HttpOnly·SameSite=Strict, Domain 없음·Path=/(gw-ops의 운영자 로그인 응답이 주고 gw-ops만 읽음, 추천 적용 2026-10-15). gw-ops가 검증(ADR-0050). 역할은 클레임에 없다. 서비스가 요청마다 identity GetAdminAuthz로 그 세션의 역할을 받는다(소유자 결정 2026-10-31, ADR-0172). 바깥 요청에 붙은 X-User-Role 같은 이름의 헤더는 먼저 지운다. 접속기록 점검자·가명정보 취급자 지정은 토큰에 싣지 않는다(docs/security/authz-matrix.md §3.1, 추천 적용 2026-10-30)" }
    partnerRefreshCookie: { type: apiKey, in: cookie, name: __Secure-peaket_partner_rt, description: "파트너 리프레시 토큰(불투명 참조 토큰, 회전·재사용 탐지). Secure·HttpOnly·SameSite=Strict, Domain=peaket.example, Path=/v1/partner/auth/access-tokens(gw-partner의 로그인 응답이 주고 gw-partner의 토큰 갱신이 읽고 회전한다. 추천 적용 2026-10-15, ADR-0065 결정 11, ADR-0119)" }
    opsRefreshCookie: { type: apiKey, in: cookie, name: __Host-peaket_ops_rt, description: "운영자 리프레시 토큰(불투명 참조 토큰, 회전·재사용 탐지). Secure·HttpOnly·SameSite=Strict, Domain 없음·Path=/(gw-ops의 운영자 로그인·토큰 갱신 응답이 주고 gw-ops는 토큰 갱신 경로에서만 읽음. __Host-는 Path=/라 경로를 좁히지 못해 모든 ops-api 요청에 실린다. 추천 적용 2026-10-15, ADR-0065 결정 11)" }
    linkCookie: { type: apiKey, in: cookie, name: __Host-peaket_link, description: "계정 연결 제안 임시 쿠키(로그인 전, 10분, SameSite=Lax). 소비자 웹 앱 서버가 연결 제안을 만들 때 주고 그 서버만 읽는다(docs/features/identity.md §3). 이 쿠키를 쓰는 작업은 소비자 웹 앱 서버 호스트에서 받는다(경로의 servers, 추천 적용 2026-10-28, 기술 검토 낮음-031)" }
    deviceDpop: { type: apiKey, in: header, name: DPoP, description: "스캐너 기기 키 DPoP 증명(RFC 9449, 기본안). typ dpop+jwt, 헤더 jwk(ECDSA P-256 공개키), 내용 jti·htm·htu·iat, 스태프 토큰과 함께면 ath. 서버는 서명, htm·htu·ath, iat ±5분 [가정], jti 10분 [가정] 1회, 키 지문(jkt)이 등록된 ACTIVE 기기인지, 토큰 cnf.jkt와 같은지 본다(추천 적용 2026-10-28, 기술 검토 중간-057)" }
    deviceMtls: { type: mutualTLS, description: "스캐너 기기 인증서(운영 설계의 선택지, 하드웨어에 묶인 키가 필요할 때). VerifyIfGiven, OPTIONS를 뺀 경로는 검증된 인증서 필수" }
    staffToken: { type: http, scheme: DPoP, description: "스캐너 현장 스태프 세션 토큰(JWT. OpenAPI 3.1의 bearerFormat 칸은 scheme이 bearer일 때만 받아 형식을 여기 적는다, 추천 적용 2026-11-01. 현장 스태프 토큰 키 ES256, aud scanner, 회차, 만료 = 역할 유효 끝(역할은 토큰에 없고 서버가 요청마다 스캐너 세션으로 본다, ADR-0172), cnf.jkt = 기기 키 지문). Authorization: DPoP <토큰>(RFC 9449 §7.1). mTLS 선택지에서는 cnf.x5t#S256이고 Bearer로 보낸다. gw-scanner가 서명을 검증하고 스캐너 경로 가드가 증명과 cnf를 대조한다. ADR-0030, ADR-0050" }
  parameters:
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, description: "따옴표 없는 UUID(v4). IETF 초안의 구조화 문자열(큰따옴표로 감싼 값)과 다르게 둔 것은 의도다. 범위는 부른 계정 × 작업(메서드와 경로 틀)이다. 서버는 키와 요청 지문(메서드, 실제 경로, 본문 바이트의 SHA-256. 헤더는 넣지 않음)을 함께 저장하고, 같은 키에 다른 지문이면 422 idempotency-key-reused, 첫 요청이 처리 중이면 1초 [가정] 기다린 뒤에도 끝나지 않을 때 409 idempotency-request-in-progress와 Retry-After, 키가 없거나 UUID가 아니면 400 idempotency-key-invalid로 답한다. 커밋한 결과만 같은 상태 코드·본문으로 다시 돌려준다. 보관 기간은 좌석 홀드가 홀드 TTL(7분), 그 밖은 24시간 [가정]이다(guidelines §4, 추천 적용 2026-10-28, 기술 검토 중간-046)", schema: { type: string, format: uuid } }
    PurchaseSeq: { name: X-Purchase-Seq, in: header, required: true, description: "구매 세션 요청 일련번호. 요청마다 1씩 올리고 서버는 마지막 번호보다 큰 것만 받는다(ADR-0050 결정 8)", schema: { type: integer, minimum: 1 } }
    PurchaseMac: { name: X-Purchase-Mac, in: header, required: true, description: "HMAC-SHA256(구매 세션 요청 인증 키, 이어 붙인 입력)의 채움 없는 base64url. 입력은 메서드, LF, 경로와 쿼리(호스트 없음), LF, 일련번호(10진수), LF, base64url(SHA-256(본문 바이트))를 이은 UTF-8 바이트다. 키는 HKDF-SHA256(ECDH 공유 비밀, salt = 입장 토큰 jti, info = PEAKET-purchase-v1, 출력 32바이트)로 만든 32바이트 HMAC-SHA256 키이고(그래서 MAC은 32바이트, base64url 43자), 브라우저는 추출 불가 키로 IndexedDB에 두어 결제창 복귀·새로고침에도 이어 쓴다(추천 적용 2026-10-21, ADR-0079 결정 6, docs/frontend.md §5.3). 머리가 없거나 형식이 틀리거나 MAC이 맞지 않으면 401 purchase-signature-invalid, 일련번호가 그 구매 세션의 마지막 번호보다 크지 않으면 401 purchase-seq-reused다(BAS-040)", schema: { type: string } }
    EventId: { name: eventId, in: path, required: true, schema: { type: string }, description: "대기열 경로(/v1/queues/{eventId}/…)에서는 대기열 식별자다. 회차 대기열은 회차 ID, 인기 MD 대기열은 상품 ID(product.id, 화면 주소 /shop/[productId]/queue의 productId)를 넣는다 [가정](docs/frontend.md §6.2 31번). 두 값 모두 UUIDv7이라 겹치지 않고 queue-svc는 1~64자 불투명 문자열로 다룬다. 그래서 새 경로를 더하지 않는다" }
    ProductionId: { name: productionId, in: path, required: true, description: "공연(회차 묶음, ADR-0093)", schema: { type: string } }
    FirstVisitCookie: { name: __Host-peaket_fv, in: cookie, required: false, description: "최초 방문 쿠키(봇 방어의 쿠키 나이 신호). 대기열 API 엣지 함수가 쿠키가 없거나 서명이 틀린 브라우저의 사전 검증 응답에 싣고 HMAC-SHA256(최초 방문 쿠키 서명 키)으로 서명한다. Secure·HttpOnly·SameSite=Strict, Domain 없음·Path=/(queue 호스트만 읽음). 공연 페이지는 CDN 캐시라 사람마다 다른 쿠키를 싣지 않는다. queue-svc는 서명(상수 시간 비교)을 확인하고 발급 시각으로 쿠키 나이를 계산해 위험 점수에 넘긴다. 서명이 맞지 않으면 쿠키가 없는 것으로 본다(추천 적용 2026-10-15, ADR-0065 결정 9, docs/features/queue-admission.md §7)", schema: { type: string } }
    IfMatch: { name: If-Match, in: header, required: true, description: "고칠 자원의 판. 그 자원을 읽은 응답의 ETag(강한 ETag, 자원의 version을 큰따옴표로 감싼 값, 예 \"7\")를 그대로 보낸다. 지금 판과 다르면 412 precondition-failed(다른 사람이 먼저 고침), 없으면 428 precondition-required(guidelines §12 '동시 수정', RFC 9110 §13.1.1, RFC 6585 §3, 추천 적용 2026-10-28, 기술 검토 낮음-030)", schema: { type: string } }
    ReauthToken: { name: X-Reauth-Token, in: header, required: true, description: "재인증 토큰(typ reauth+jwt, 5분 1회용). 팬·관리 계정 모두 이 헤더로만 받는다(guidelines §7)", schema: { type: string } }
    Cursor: { name: cursor, in: query, required: false, description: "불투명 커서(이전 응답의 nextCursor, guidelines §3)", schema: { type: string } }
    Limit: { name: limit, in: query, required: false, description: "한 번에 받을 건수(최대 100, guidelines §3)", schema: { type: integer, minimum: 1, maximum: 100 } }
    ClientEphemeralKey: { name: X-Client-Ephemeral-Key, in: header, required: false, description: "구매 세션 요청 인증 키 합의용 클라이언트 임시 공개키(P-256, 비압축 점의 base64url). 직접 선택 공연은 입장 토큰의 첫 사용인 스냅샷 요청에 필수이고 그 뒤에는 보내지 않아도 된다(보내면 구매 세션에 적힌 키와 같아야 하고 다르면 401, 추천 적용 2026-11-04, docs/features/seat-hold.md §2)", schema: { type: string } }
  schemas:
    Problem:
      type: object
      description: "RFC 9457 Problem Details(guidelines §2). 오류 식별자는 type URI다. 아래 선택 확장 필드는 적힌 응답에만 싣는다"
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        traceId: { type: string }
        suggestedSeats: { type: array, items: { type: string }, description: "좌석 경합 409(seat-already-held)에만. 같은 열 인접 빈 좌석(seat-hold §3, 추천 규칙은 [보완])" }
        recentlyReleasedSeats: { type: array, items: { type: string }, description: "홀드 409(seat-recently-released)에만. 요청 좌석 가운데 같은 계정이 방금 놓아 아직 다시 잡을 수 없는 좌석 ID(seat-hold §5, 추천 적용 2026-10-30)" }
        reholdAvailableAt: { type: string, format: date-time, description: "홀드 409(seat-recently-released)에만. recentlyReleasedSeats를 모두 다시 잡을 수 있게 되는 시각(놓은 시각 + 30초 [가정], seat-hold §5, 추천 적용 2026-10-30)" }
        rejoinAllowed: { type: boolean, description: "입장 확정의 대기표 만료 410에만. 다시 줄 서기 가능 여부(이 회차에 입장한 적이 있거나 판매 종료가 지났으면 false, 사전 셔플 공연도 같은 규칙, ADR-0062·0064)" }
        removeReason: { type: string, enum: [BLOCKED], description: "입장 확정·추가 검증 제출의 410 queue-ticket-removed에만, 이의 기각으로 끝난 대기 참여일 때. 대기실·SCR-009가 '기각' 문구를 고른다. 이름과 값은 asyncapi의 대기 기록 removeReason과 같다(추천 적용 2026-11-10, BUILD_ORDER BOT-090, ADR-0259)" }
        holdRemainingSeconds: { type: integer, description: "결제 시도 시작의 503(새 결제 일시 정지)에만. 주문을 만들고 결제 접수 전인 홀드의 멈춘 남은 시간(초). 다시 열리면 이어 센다(ADR-0085)" }
        myReviewId: { type: string, description: "후기 쓰기의 409 review-already-written에만. 이 계정이 이 회차에 이미 쓴 후기 ID(수정으로 안내)" }
        ended: { type: string, enum: [LOGOUT, ADMIN_FORCE, REFRESH_REUSE, DEVICE_LIMIT, MERGED, DELETE, LOGIN_METHOD_CHANGED], description: "토큰 갱신(POST /v1/identity/access-tokens)의 401 refresh-token-invalid에만. 쿠키의 토큰이 끝난 세션의 것이고 끝난 까닭을 알 때 그 까닭을 싣는다(세션 종료 사건 SessionTerminated.reason 가운데 팬에게 보이는 것, d5 §3.5, 추천 적용 2026-11-09, ADR-0235). 모르는 토큰·모양이 틀린 토큰·유휴·절대 만료에는 없다" }
        fraudHold: { type: object, description: "탈퇴(DELETE /v1/identity/account)의 409 '탈퇴 전 확인'에만. 그 계정에 부정 예매 연계정보 대조값 보관 행(docs/data.md restricted_ci_hold)이 살아 있을 때 상태와 끝 시각을 싣고, 화면(SCR-017)이 보관 안내를 보인다. RESTRICTED면 이용 제한 끝, CASE_OPEN이면 그 회차 공연일 + 30일 [가정](docs/features/identity.md §8(추천 적용 2026-10-31, ADR-0173))", properties: { state: { type: string, enum: [CASE_OPEN, RESTRICTED] }, until: { type: string, format: date-time } } }
        remainingAttempts: { type: integer, minimum: 0, description: "관리 계정 로그인 401 admin-login-failed·admin-login-code-invalid와 본인 해제 422 unlock-code-invalid(그 링크로 남은 수, BOT-121)에만. 잠금까지 남은 실패 수(계정 실패 수와 출발지 묶음 실패 수 가운데 잠금에 가까운 쪽). 없는 이메일도 같은 규칙으로 센 값이다(docs/security/auth-controls.md §2.2, 추천 적용 2026-11-05, BUILD_ORDER BOT-111)" }
        humanCheckRequired: { type: boolean, description: "관리 계정 로그인 401 admin-login-failed에만. 다음 시도에 사람 확인 토큰이 필요한지(auth-controls §2.3, 추천 적용 2026-11-05)" }
        lock: { type: string, enum: [TIMED, PROTECT], description: "관리 계정 로그인 423 admin-account-locked에만. TIMED는 시간 잠금이나 출발지 묶음 잠금(Retry-After와 retryAfterSeconds를 함께 준다), PROTECT는 보호 잠금(원인은 싣지 않는다, auth-controls §3.2, 추천 적용 2026-11-05)" }
        retryAfterSeconds: { type: integer, minimum: 1, description: "관리 계정 로그인 423(lock TIMED)에만. 잠금이 풀릴 때까지 남은 초(화면의 남은 분 표시, Retry-After와 같은 값, 추천 적용 2026-11-05)" }
    LobbyToken: { type: object, properties: { verificationReason: { type: [string, 'null'], enum: [RAPID_REQUESTS, DEVICE_HISTORY, NETWORK, INTERACTION, HUMAN_CHECK, SHARED_PATTERN, null], description: "추가 검증(VERIFYING)일 때 이용자에게 보이는 사유 범주(trust.proto ReasonCategory 이름에서 접두사를 뺀 값). 그 밖에는 null(FR-020, docs/features/bot-defense.md §5, 추천 적용 2026-10-30)" }, lobbyToken: { type: string }, verification: { type: string, enum: [REQUIRED], description: "위험 점수가 높아 추가 검증이 필요하면 REQUIRED(참가 토큰은 그대로 준다). 화면은 SCR-009로 간다. 브라우저 스크립트가 303 응답을 읽지 못해 303 대신 이 필드를 쓴다(추천 적용 2026-10-21, ADR-0079 결정 4)" }, seedHash: { type: string, description: "커밋 SHA-256(PEAKET-shuffle-v1 ‖ 공연 회차 ID ‖ 시드)" }, drandChain: { type: string, description: "사용할 drand 체인(quicknet)" }, drandRound: { type: integer, description: "미리 공시한 비콘 라운드(ADR-0050 결정 7)" }, algorithmVersion: { type: string }, lobbyOpenedAt: { type: string, format: date-time }, shuffleResultAt: { type: string, format: date-time, description: "셔플 결과 공개 예정 시각(공시한 drand 라운드의 예정 시각 + 셔플·게시 목표, ADR-0058)" }, shuffleSpreadSec: { type: integer, description: "분산 창(초, 기본 8 [가정]). 참가 토큰 해시로 정한 0~분산 창 사이에 결과 파일을 받는다(ADR-0058)" }, serverTimeMs: { type: integer, format: int64, description: "응답을 만든 서버 시각(유닉스 밀리초). 브라우저 시계 보정 표본이다. 캐시하지 않는 대기열 API 응답에만 싣고, 대기실은 이 값만 표본으로 쓴다(추천 적용 2026-10-28, ADR-0110)" } } }
    QueueTicket: { type: object, properties: { verificationReason: { type: [string, 'null'], enum: [RAPID_REQUESTS, DEVICE_HISTORY, NETWORK, INTERACTION, HUMAN_CHECK, SHARED_PATTERN, null], description: "추가 검증(VERIFYING)일 때 이용자에게 보이는 사유 범주(trust.proto ReasonCategory 이름에서 접두사를 뺀 값). 그 밖에는 null(FR-020, docs/features/bot-defense.md §5, 추천 적용 2026-10-30)" }, queueTicket: { type: string }, seq: { type: integer }, generation: { type: integer }, segment: { type: integer }, verification: { type: string, enum: [REQUIRED], description: "추가 검증 필요 표시가 있는 사전 검증 토큰으로 진입하면 REQUIRED. 번호는 발급하고 빠진 번호·VERIFYING으로 기록하며 화면은 SCR-009로 간다(303 대신, ADR-0079 결정 4)" }, serverTimeMs: { type: integer, format: int64, description: "서버 시각(유닉스 밀리초). 시계 보정 표본(ADR-0110)" } } }
    PreverifyResult: { type: object, required: [preverifyToken, expiresAt, serverTimeMs], description: "사전 검증 토큰 발급 결과(추천 적용 2026-11-03, queue-admission §3 '첫 구현의 세부')", properties: { preverifyToken: { type: string, description: "사전 검증 토큰(15분). 진입 본문에 그대로 싣는다" }, expiresAt: { type: string, format: date-time, description: "만료 시각. 화면은 그 전에 조용히 갱신한다" }, serverTimeMs: { type: integer, format: int64, description: "서버 시각(유닉스 밀리초). 시계 보정 표본(ADR-0110)" } } }
    BehaviorSummary: { type: object, additionalProperties: false, description: "행동 신호 요약(사전 검증 본문, 추천 적용 2026-10-15, ADR-0065 결정 9). 화면에서 잰 요약값만 보내고 원시 좌표·키 값·입력한 글자는 보내지 않는다. 재는 화면은 공연 상세(사전 검증 본문)와, 2026-10-31에 더한 좌석 화면(구매 세션의 첫 직접 선택 홀드 요청 HoldRequest.behavior)·결제 화면(결제 시도 시작 본문 behavior)이다. 좌석·결제 화면의 요약은 실시간 봇 판정에 쓰지 않고 부정 예매 사후 조사의 기록(asyncapi BehaviorSignal screen SEAT·PAYMENT)에만 쓴다(추천 적용 2026-10-31, ADR-0171 결정 4). 필드 구성과 범위는 [가정, wbs 3.2.1에서 확정]. 보조기기 사용자는 고유 패턴이 있어 단독 판정 근거로 쓰지 않는다(queue-admission §7)", required: [v, windowMs], properties: { v: { type: integer, enum: [1], description: 형식 버전 }, windowMs: { type: integer, minimum: 0, maximum: 3600000, description: "요약한 구간 길이(밀리초)" }, pointerMoves: { type: integer, minimum: 0, description: "포인터 이동 이벤트 수" }, pointerEntropy: { type: number, minimum: 0, description: "포인터 이동 방향의 엔트로피(비트)" }, inputIntervalMeanMs: { type: number, minimum: 0, description: "터치·키 입력 간격 평균(밀리초)" }, inputIntervalStdMs: { type: number, minimum: 0, description: "터치·키 입력 간격 표준편차(밀리초)" }, scrollEvents: { type: integer, minimum: 0, description: "스크롤 이벤트 수" }, scrollDistancePx: { type: integer, minimum: 0, description: "스크롤 이동 거리 합(CSS 픽셀)" } } }
    QueueState:
      type: object
      description: "구간별 대기 상태 파일(CDN 1초 캐시. 입장 임박 구간 파일은 다음 생성 시각까지만 캐시한다(Expires, 낡은 값 허용 없음, ADR-0110). 차례에서 먼 구간의 수명을 늘리는 방식은 Phase 2에서 정함, queue-admission §4). 사용자별 값 없음. 대기 화면 진행 막대의 '처음 받은 앞 인원'은 브라우저가 처음 계산한 앞 인원을 세션 저장소에 두고 쓰므로 이 파일에 새 값이 없다(추천 적용 2026-10-14, ADR-0063)"
      properties:
        admissionPaused: { type: boolean, description: "입장 일시정지(관제 명령 2 ADMISSION_PAUSE)가 걸려 있다. 대기열은 그대로이고 차례 반영만 멈춘다. 안내 문구와 화면 동작(예상 시간 숨기기, 정지 중 앞 인원 갱신)은 docs/design/d5와 docs/features/queue-admission.md §4를 따르고, 이 칸은 그 판단의 재료다(BAS-042)" }
        seatmapLayoutPath: { type: string, description: "그 회차 팬 좌석맵 파일의 경로(GET /v1/events/{eventId}/seatmap-layouts/{layoutVersion}.json). 대기 중에 미리 받아 두고, 입장 확정 응답의 seatmapLayoutPath와 다르면 다시 받는다(docs/frontend.md §4.2.2, BAS-042). 회차 일정 사본(q:{event:E}:cfg)의 layoutVersion으로 만들고, 그 값이 없으면 이 칸을 싣지 않는다(추천 적용 2026-11-06, HOT-011, ADR-0219 결정 7)" }
        remainingSeats: { type: integer, minimum: 0, description: "그 회차의 남은(판매 가능) 좌석 수. 파일을 만들 때 좌석 원장에서 받은 값이라 몇 초 늦을 수 있다. 남은 앞 인원 × avgTicketsPerOrder > remainingSeats이면 화면이 '현재 순번으로는 구매가 어려울 수 있습니다'를 띄운다(POL-015, queue-admission §4, BAS-042). 값은 purchase-svc가 판매 상태 사건(EventSaleChanged)의 다시 내기에 싣는 가용 좌석(available)이다. 그 셈이 파일 생성 시각에서 30초 [가정] 안일 때만 avgTicketsPerOrder와 함께 싣고, 아니면 두 칸 모두 싣지 않는다(추천 적용 2026-11-06, HOT-011, ADR-0219 결정 5)" }
        avgTicketsPerOrder: { type: number, minimum: 0, description: "공연 평균 구매 매수(POL-015, queue-admission §4의 '공연 평균 구매 매수', BAS-042). 그 회차의 이번 판매에서 결제가 끝난 주문이 100건 [가정] 이상이면 그 주문들의 좌석 수 ÷ 주문 수(purchase-svc가 판매 상태 사건에 싣는다)이고, 그 전이나 값이 1~10 밖이면 2 [가정]다. remainingSeats와 함께 싣거나 함께 뺀다(추천 적용 2026-11-06, HOT-011, ADR-0219 결정 6)" }
        serving: { type: integer }
        servingRate: { type: number, description: "차례 진행 속도(번호/초). 다 지난 최근 10칸 [가정](1초 칸, 지금 칸 제외) 동안 지난 유효 번호 수 ÷ 칸 수(창 앞 기록이 있으면 10, 없으면 창 안 첫 기록 칸부터 지난 칸 끝까지), 소수점 셋째 자리(추천 적용 2026-11-03, queue-admission §4)" }
        saleStatus: { type: string, enum: [ON_SALE, PAUSED, ALL_HELD, TIER_SOLD_OUT, SOLD_OUT, ENDED], description: "회차 판매 상태(docs/planning/03 §2.15, purchase-svc 판정)에 판매 일시정지·판매 중지(PAUSED)와 등급 매진(TIER_SOLD_OUT)을 덧씌운 값이고, ENDED > SOLD_OUT > PAUSED > ALL_HELD > TIER_SOLD_OUT > ON_SALE 순으로 앞의 것을 쓴다. ALL_HELD는 일시 매진(가용 좌석 0이지만 홀드나 결제 중인 판매 예약이 남음)이라 대기는 이어지고 입장만 멈춘다. SOLD_OUT은 가용·홀드·결제 중이 모두 0인 매진이고, 판매 종료 전에 좌석이 돌아오면 ON_SALE로 돌아온다(매진 풀림, 추천 적용 2026-10-28, ADR-0122). ENDED는 그 회차의 판매 종료(공연 시작 24시간 전, event.starts_at − 24시간)가 지남. 차례 전 대기는 끝나고(대기 기록 SALE_END) 대기 화면은 ended로 바뀌며 폴링을 멈춘다(ADR-0063 결정 11, 소유자 결정 2026-10-14, ADR-0064)" }
        soldOutTiers: { type: array, items: { type: string }, description: "매진된 등급. 대기 화면 기본 영역에는 등급별 현황을 보이지 않고 좌석 자동 배정 공연의 희망 조건 줄 경고에만 쓴다(소유자 결정 2026-10-14, ADR-0063)" }
        removedUpToServing: { type: integer }
        removedBeforeSegment: { type: integer }
        removedBitmap: { type: string, description: "base64 125바이트. k번째 비트(0부터, 바이트 안에서는 높은 비트부터)가 이 구간의 번호 s×1,000+1+k이고, 켜져 있으면 빠진 번호(장애 전환 때 건너뛴 구간 포함, 추천 적용 2026-11-03)" }
        banner: { type: string }
        generatedAtMs: { type: integer, format: int64, description: "파일을 만든 서버 시각(유닉스 밀리초). 생성은 매초 경계에 한다(추천 적용 2026-10-28, ADR-0110)" }
        servingSteps: { type: array, description: "입장 임박 구간 파일에만. 최근 5초 [가정]의 serving 전진 기록([전진 시각(유닉스 밀리초), 그때의 serving]). 브라우저는 serving이 내 번호를 넘은 전진의 시각으로 차례 반영 지연(queue_reflect_ms, NFR-002)을 잰다(ADR-0110)", items: { type: array, minItems: 2, maxItems: 2, items: { type: integer, format: int64 } } }
        pollHintMs: { type: integer, minimum: 0, description: "다음 폴링까지의 최소 간격(밀리초). 정상 때 0(브라우저가 거리별 주기를 쓴다). 상태 조회 Degraded 때 queue-svc 파일 생성 작업과 S3 사본이 같은 값(그 구간 거리별 주기의 2배)을 싣는다. S3 객체로는 Retry-After 헤더를 줄 수 없어 본문에 둔다. 브라우저는 max(거리별 주기, 이 값)을 하한으로 위쪽으로만 0~20% 지터를 더한다. 이 값이 응답 헤더보다 늘 앞선다(추천 적용 2026-10-28, 기술 검토 중간-032·038)" }
    AdmissionResult:
      type: object
      properties:
        purchaseSessionExpiresAt: { type: string, format: date-time, description: "ADMITTED일 때만: 입장 토큰의 만료 시각(exp, 구매 세션이 끝나는 가장 늦은 때). 화면은 남은 구매 시간 표시에만 쓰고(serverTimeMs로 시계를 맞춘다) 판단은 서버가 한다. 토큰 본문을 화면이 읽지 않게 응답에 싣는다(docs/frontend.md §6.2 22번, BUILD_ORDER BAS-042)" }
        verificationReason: { type: [string, 'null'], enum: [RAPID_REQUESTS, DEVICE_HISTORY, NETWORK, INTERACTION, HUMAN_CHECK, SHARED_PATTERN, null], description: "추가 검증(VERIFYING)일 때 이용자에게 보이는 사유 범주(trust.proto ReasonCategory 이름에서 접두사를 뺀 값). 그 밖에는 null(FR-020, docs/features/bot-defense.md §5, 추천 적용 2026-10-30)" }
        status: { type: string, enum: [NOT_YET, ADMITTED, SOON, VERIFYING], description: "만료와 판매 종료는 410 응답으로 알린다. NOT_YET은 좌석 자동 배정 공연의 차례 직전 직접 확인에서 아직 차례 전(ADR-0043). VERIFYING은 빠진 번호이고 추가 검증 중이라 화면이 SCR-009로 간다(303 대신, ADR-0079 결정 4). SOON은 자리가 없어 곧 입장 대기열에 번호로 넣었다는 뜻이고, 빈자리는 그 대기열의 낮은 번호부터 간다(ADR-0104)" }
        admissionToken: { type: string, description: "ES256, 첫 사용 기한 5분, 만료는 최대 체류 시각. 머리 typ admission+jwt·kid, 클레임 iss·sub(계정)·aud purchase·jti·sid·event·jny·lst(그 계정이 든 판매 자격 명단 키 배열 1~10개, 든 것이 없으면 뺌, 추천 적용 2026-11-10, ADR-0265)·iat·exp(= iat + 최대 체류 45분). 첫 사용 기한은 따로 싣지 않고 purchase-svc가 iat + 5분으로 본다(추천 적용 2026-11-03, ADR-0183)" }
        retryAfterSeconds: { type: integer, description: "SOON일 때 다시 시도까지의 초(1~5 [가정]. 곧 입장 대기열에서 내 앞 수와 최근 자리가 비는 속도로 계산, ADR-0104). 브라우저는 이 값을 하한으로 지키고 위쪽으로만 0~20% 지터를 더한다(추천 적용 2026-10-28, 기술 검토 중간-038)" }
        serverTimeMs: { type: integer, format: int64, description: "서버 시각(유닉스 밀리초). 시계 보정 표본(ADR-0110)" }
        retryAfterMs: { type: integer, description: "NOT_YET일 때 예상 도래까지 남은 시간(밀리초)" }
        serverEcdhPublicKey: { type: object, description: "구매 세션 요청 인증 키를 합의하는 서버 고정 ECDH P-256 공개키. JWK(kty EC, crv P-256, x, y, kid) 형식(ADR-0050 결정 8, 추천 적용 2026-10-21, ADR-0079 결정 6)", properties: { kty: { type: string }, crv: { type: string }, x: { type: string }, y: { type: string }, kid: { type: string } } }
        seatmapLayoutPath: { type: string, description: "직접 선택 공연의 좌석맵 파일 경로(/v1/events/{eventId}/seatmap-layouts/{layoutVersion}.json). 대기 중 미리 받은 판과 다르면 다시 받는다(추천 적용 2026-10-14, ADR-0063)" }
    QueueVerificationSubmitRequest:
      additionalProperties: false
      type: object
      description: "추가 검증 제출 본문. challengeToken과 appeal 가운데 정확히 하나만 보낸다(둘 다 있거나 둘 다 없으면 400, 추천 적용 2026-11-10, BUILD_ORDER BOT-090, ADR-0259)"
      properties:
        challengeToken: { type: string, description: "심층 챌린지(CMP-047)의 사람 확인 토큰(action verify, 300초 한 번 쓰기)" }
        appeal: { type: string, maxLength: 4000, description: "설명·재검토 요청 내용. 화면·서버는 NFC 정규화 뒤 grapheme 1,000자로 센다. 빈 문자열이면 설명 요청(추천 적용 2026-10-14, ADR-0062). NUL(U+0000)·양방향 제어 글자(U+202A~U+202E, U+2066~U+2069)·0폭 글자(U+200B~U+200D, U+FEFF)가 있으면 400이다(추천 적용 2026-11-10, BUILD_ORDER BOT-090, ADR-0259, docs/features/bot-defense.md §12 '접수')" }
        deviceId: { type: string, description: "기기 식별값(CSPRNG 128비트, base64url 22자, docs/frontend.md §3.12, 로비 입장·사전 검증과 같은 모양). trust-svc가 기기 이력과 차단 기기 목록을 볼 때 쓴다. 선택이고 형식이 다르면 400(추천 적용 2026-11-10, BUILD_ORDER BOT-090, ADR-0259)" }
    QueueVerificationResult:
      type: object
      required: [result]
      description: "추가 검증 제출 결과(추천 적용 2026-11-10, BUILD_ORDER BOT-090, ADR-0259, docs/features/bot-defense.md §5.2)"
      properties:
        result: { type: string, enum: [PASSED, CHALLENGE_FAILED, REVERIFY_REQUIRED, PERSON_MISMATCH], description: "PASSED 통과. CHALLENGE_FAILED 사람 확인 실패(다시 할 수 있다). REVERIFY_REQUIRED 추가 검증을 시작한 뒤의 본인확인 재통과가 없음(trust-svc를 부르지 않았다). PERSON_MISMATCH 재확인한 사람이 이 계정의 사람과 다름" }
        queueNumber: { type: integer, description: "PASSED일 때만: 원래 번호" }
        graceUntil: { type: [string, 'null'], format: date-time, description: "PASSED이고 차례가 이미 지났을 때만: 입장 확정을 받는 마지막 시각. 차례와 통과 시각 가운데 늦은 때 + 유예 15분이다. 이미 통과한 대기 참여가 다시 보내도 같은 규칙으로 계산한다(처음 통과 시각 기준, 추천 적용 2026-11-10, BUILD_ORDER BOT-090, ADR-0259). 차례 전이면 null이고 원래 번호의 차례에 입장한다(queue-admission §7)" }
    QueueVerificationAppealReceipt:
      type: object
      required: [appealId, receivedAt]
      description: "이의 접수(추천 적용 2026-11-10, BUILD_ORDER BOT-090, ADR-0259). 이미 접수했으면 처음 값이다"
      properties:
        appealId: { type: string, format: uuid, description: "이의 ID(asyncapi CaseRequested.sourceId)" }
        receivedAt: { type: string, format: date-time }
    QueueVerificationState:
      type: object
      required: [state]
      description: "추가 검증 상태(GET /v1/queues/{eventId}/verification, 추천 적용 2026-11-10, BUILD_ORDER BOT-090, ADR-0259)"
      properties:
        state: { type: string, enum: [VERIFYING, PASSED, BLOCKED], description: "VERIFYING 추가 검증 중. PASSED 통과(제출 또는 이의 인정). BLOCKED 이의 기각으로 대기 참여가 끝남" }
        passedVia: { type: [string, 'null'], enum: [CHALLENGE, APPEAL, null], description: "PASSED일 때만: CHALLENGE 추가 검증 제출로 통과, APPEAL 이의 인정으로 통과. 그 밖에는 null(추천 적용 2026-11-10, BUILD_ORDER BOT-090, ADR-0259)" }
        graceUntil: { type: [string, 'null'], format: date-time, description: "PASSED이고 차례가 지났을 때만: 입장 확정을 받는 마지막 시각(차례와 통과 시각 가운데 늦은 때 + 유예 15분, QueueVerificationResult.graceUntil과 같은 계산). 그 밖에는 null(추천 적용 2026-11-10, BUILD_ORDER BOT-090, ADR-0259)" }
        verificationReason: { type: [string, 'null'], enum: [RAPID_REQUESTS, DEVICE_HISTORY, NETWORK, INTERACTION, HUMAN_CHECK, SHARED_PATTERN, null], description: "이용자에게 보이는 사유 범주(trust.proto ReasonCategory 이름, AdmissionResult.verificationReason과 같다)" }
        appeal: { type: [object, 'null'], description: "이의를 접수했으면 그 값, 아니면 null", properties: { appealId: { type: string, format: uuid }, receivedAt: { type: string, format: date-time }, text: { type: string, description: "본인이 보낸 이의 글(NFC 정규화 뒤 값, 비었으면 설명 요구). 본인에게만 돌려준다(추천 적용 2026-11-10, BUILD_ORDER BOT-090, ADR-0259)" } } }
    HoldRequest:
      additionalProperties: false
      type: object
      description: "직접 선택 공연은 seatIds, 좌석 자동 배정 공연은 auto 중 하나를 보낸다(POL-035, ADR-0043)"
      properties:
        seatIds: { type: array, items: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }, minItems: 1, maxItems: 10, description: "직접 선택 좌석 ID. 1~10개, 좌석 ID 모양이 틀리면 400이다. 같은 좌석이 두 번 들었거나 좌석맵 판에 없는 좌석·판매 제외석이면 422 invalid-seat다(docs/features/seat-hold.md §3 '좌석 ID 확인', 추천 적용 2026-11-04, BUILD_ORDER PRF-130)" }
        auto:
          additionalProperties: false
          type: object
          description: "희망 조건. 대기 중 브라우저에만 저장했다가 차례가 오면 자동으로 보낸다. 서버가 다시 검증한다(ADR-0043). 자동 배정은 BUILD_ORDER HOT-080에서 열었다. seatIds와 함께 보내면 400 auto-condition-invalid다."
          required: [firstTierId, count]
          properties:
            firstTierId: { type: string }
            secondTierId: { type: string, description: "선택. 1순위와 달라야 한다" }
            count: { type: integer, minimum: 1, description: "1인 매수 한도 이하" }
            wheelchair: { type: boolean, default: false }
            allowSplit: { type: boolean, default: false, description: "연석이 없을 때 같은 등급의 분리 좌석 허용" }
        clientEphemeralPublicKey: { type: string, description: "좌석 자동 배정 공연의 첫 요청에만(직접 선택 공연은 스냅샷 요청 헤더). 구매 세션에 저장" }
        behavior: { $ref: '#/components/schemas/BehaviorSummary', description: "좌석 화면에서 잰 행동 요약. 직접 선택 공연에서 그 구매 세션의 첫 홀드 요청에만 싣는다(다시 보내도 첫 요청의 것만 쓴다). 없어도 홀드는 그대로 처리한다. purchase-svc가 홀드 응답과 따로 BehaviorSignal(screen SEAT)로 낸다(추천 적용 2026-10-31, ADR-0171 결정 4, docs/features/seat-hold.md)" }
    Hold: { type: object, required: [holdId, seatIds, expiresAt, extendable, fencingToken], properties: { seats: { type: array, description: "홀드한 좌석의 표시 값(좌석 이름·등급·가격). 새로고침과 좌석 ↔ 결제 화면을 오갈 때 다시 그린다(docs/design/d5 §1.6 26번, BAS-042)", items: { type: object, required: [seatId, label, tierId, price], properties: { seatId: { type: string }, label: { type: string, description: "구역·열·번호(예 A구역 3열 12)" }, tierId: { type: string }, tierName: { type: string }, price: { type: integer, description: "원 단위 정가(할인 전)" } } } }, totalAmount: { type: integer, description: "좌석 정가 합(원). 할인·수수료가 붙은 결제 금액은 주문(Order.amount)이 정한다" }, holdId: { type: string }, seatIds: { type: array, items: { type: string } }, expiresAt: { type: string, format: date-time }, extendable: { type: boolean }, fencingToken: { type: integer, minimum: 1 }, frozen: { type: boolean, description: "참이면 시간이 흐르지 않는다(새 결제 일시 정지로 멈췄거나 결제 접수 뒤 묶였다). 화면은 타이머로 만료 처리하지 않고 다시 읽는다(ADR-0254, BUILD_ORDER HOT-358 리뷰 H3)" }, assignResult: { type: string, enum: [FIRST, FIRST_SPLIT, SECOND, SECOND_SPLIT], description: "좌석 자동 배정 결과 유형(ADR-0043). 직접 선택 공연은 없음" } } }
    Order: { type: object, properties: { orderId: { type: string }, amount: { type: integer }, status: { type: string, enum: [CREATED, AUTHENTICATED, ACCEPTED, RESERVED, AWAITING_DEPOSIT, APPROVED, UNKNOWN, CONFIRMED, FAILED, COMPENSATED, PARTIALLY_REFUNDED, REFUNDED, EXPIRED], description: "주문 상태(docs/planning/03 §2.4). 결제 시도 상태와 결제 원장 상태는 따로다(payment §3). EXPIRED는 결제를 접수하지 않고 끝난 주문이다(과금 없음, 추천 적용 2026-10-28, ADR-0107)" }, items: { type: array, items: { type: object } } } }
    PaymentStatus: { type: object, properties: { status: { type: string, enum: [ACCEPTED, RESERVED, AWAITING_DEPOSIT, APPROVED, CONFIRMED, FAILED, UNKNOWN, COMPENSATED] }, issueDelayed: { type: boolean, description: "APPROVED에서 승인 뒤 첫 발권 시도가 실패해 같은 주문 ID로 다시 발권하는 중이거나(발권 재시도 큐 행의 시도 수 1 이상이고 마지막 오류 있음), 그 큐 행을 만든 지(purchase가 승인을 반영한 때부터) 60초 [가정]가 지났을 때 참. 60초 조건은 trade.orders ISSUE_DELAYED를 내는 기준과 같다. 화면은 '결제 완료, 티켓 발급 중'(payment §2·§3, 추천 적용 2026-10-28, ADR-0106. 60초 조건은 BUILD_ORDER PRF-166, 그 뜻은 추천 적용 2026-11-05, BUILD_ORDER PRF-170)" }, virtualAccount: { type: object, description: "가상계좌 안내(입금 대기일 때만, docs/planning/03 §2.4, ADR-0062). 입금처 번호라 구매자의 계좌가 아니다. payment-svc에서 읽어 응답에만 싣고, 안내가 없으면 칸이 없다. 일시적으로 읽지 못하면 입금 대기 대신 처리 중인 RESERVED로 답한다(payment §6, 추천 적용 2026-11-09, BUILD_ORDER HOT-151, 코드 리뷰)", properties: { bank: { type: string }, accountNumber: { type: string }, dueAt: { type: string, format: date-time } } }, reason: { type: string }, pg: { type: string, enum: [TOSS, PORTONE, SIMULATOR], description: 결제 접수에서 고정된 결제사(ADR-0044) } } }
    LiveSnapshot:
      type: object
      description: "파트너 실시간 판매 현황(관제 실시간 표의 누적 뷰를 1분 지연으로, docs/features/control-tower.md §11). 응답마다 전체 상태다. 2026-10-28 asyncapi의 SSE 메시지에서 옮겼다(기술 검토 낮음-024)"
      required: [asOf, nextUpdateAt, sold, remaining]
      properties:
        asOf: { type: string, format: date-time, description: "이 값의 집계 시각. 화면의 '마지막 갱신 n초 전'" }
        nextUpdateAt: { type: string, format: date-time, description: "다음 집계 시각. 화면은 이 시각에 0~5초 [가정] 무작위를 더해 다시 묻는다" }
        sold: { type: integer, description: "판매 좌석(지금 SOLD인 좌석 수, 반환은 빠짐, ADR-0072)" }
        remaining: { type: integer, description: "잔여석(판매 대상 − 판매 좌석). 홀드·결제 중 좌석도 남은 좌석에 센다(ADR-0072). 홀드 수는 싣지 않는다(ADR-0073)" }
        projectedSoldOutAt: { type: [string, 'null'], format: date-time, description: "예상 매진 시각(잔여 ÷ 최근 5분 [가정] 판매 속도, docs/design/d5 §6.9, ADR-0062)" }
        waiting: { type: integer, description: "지금 대기 인원(진입 − 입장 − 빠진 번호, docs/streaming.md §4.1)" }
        queueEntries: { type: integer, description: "대기열 진입 누적" }
        sections: { type: array, description: "구역별 잔여석. remaining과 같은 정의", items: { type: object, properties: { sectionId: { type: string }, remaining: { type: integer } } } }
        soldPerMinute: { type: array, maxItems: 180, description: "분당 판매(최근 180분 [가정]). 판매 좌석 누적 값의 1분 차이(docs/streaming.md §4.3, ADR-0073)", items: { type: object, properties: { minute: { type: string, format: date-time }, sold: { type: integer } } } }
    PaymentAttempt:
      type: object
      description: "결제 시도(POL-036, ADR-0044). 결제창을 열기 직전에 만든다. 주문당 활성 시도는 1건이고 새 시도는 결제 접수 전의 이전 시도를 대체한다"
      required: [attemptId, pg, checkout]
      properties:
        attemptId: { type: string }
        pg: { type: string, enum: [TOSS, PORTONE, SIMULATOR], description: "결제사 선택기가 고른 결제사. SIMULATOR는 부하·시험 환경 전용" }
        switched: { type: boolean, description: "결제사 전환(감내 모드)으로 대체 결제사가 골라졌으면 true. 화면이 안내 문구를 띄운다(CMP-027 pg-switched)" }
        holdExpiresAt: { type: string, format: date-time, description: "이 주문 홀드의 지금 만료 시각. 새 결제 일시 정지로 멈췄던 시간을 반영한다(ADR-0085)" }
        allowedPayMethods: { type: array, items: { type: string, enum: [CARD, EASY_PAY, TRANSFER, VIRTUAL_ACCOUNT, MOBILE] }, description: "화면에 내도 되는 결제수단(추천 적용 2026-11-09, BUILD_ORDER PRF-190)" }
        depositDueAt: { type: string, format: date-time, description: "입금 기한. 가상계좌를 낼 수 있을 때만 있다(추천 적용 2026-11-09, BUILD_ORDER PRF-190)" }
        checkout:
          description: "결제사별 결제창 값. pg가 TOSS·SIMULATOR면 TossCheckout, PORTONE이면 PortoneCheckout이다. 2026-10-28에 키를 열어 둔 객체에서 결제사별 스키마로 바꿨다(payment.proto PrepareCheckoutResponse의 oneof와 같은 칸, 추천 적용 2026-10-28, 기술 검토 낮음-028)"
          oneOf:
            - { $ref: '#/components/schemas/TossCheckout' }
            - { $ref: '#/components/schemas/PortoneCheckout' }
    TossCheckout:
      type: object
      required: [clientKey, customerKey, orderId, orderName, amount, successUrl, failUrl]
      properties:
        escrowProducts: { type: array, description: "에스크로 상점 주문만. 주문 상품 목록. 칸 이름은 연동 때 토스페이먼츠 문서로 확인한다 [가정]", items: { type: object, properties: { id: { type: string }, name: { type: string }, code: { type: string }, unitPrice: { type: integer, format: int64 }, quantity: { type: integer } } } }
        clientKey: { type: string }
        customerKey: { type: string }
        orderId: { type: string }
        orderName: { type: string }
        amount: { type: integer, format: int64, description: 원 단위 }
        successUrl: { type: string, format: uri }
        failUrl: { type: string, format: uri }
    PortoneCheckout:
      type: object
      required: [storeId, channelKey, paymentId, orderName, totalAmount, currency, redirectUrl]
      properties:
        storeId: { type: string }
        channelKey: { type: string }
        paymentId: { type: string, description: "pay-{orderId}" }
        orderName: { type: string }
        totalAmount: { type: integer, format: int64, description: 원 단위 }
        currency: { type: string, description: "결제 통화. SDK에 넘기는 값의 표기는 연동 때 포트원 문서로 확인한다" }
        redirectUrl: { type: string, format: uri }
        customer: { type: object, description: "채널이 요구하는 구매자 항목만(이메일·휴대폰. SDK 필드 이름은 연동 때 확인)", additionalProperties: { type: string } }
        customData: { type: object, description: "결제사가 그대로 돌려주는 값. 대사의 주문 대조가 읽는다(추천 적용 2026-11-09, BUILD_ORDER PRF-190)", required: [orderId], properties: { orderId: { type: string } } }
    PaymentAccept:
      description: "결제 접수 본문. pg 값으로 갈린다(ADR-0044 결정 7). 허용 필드 밖의 값은 400"
      oneOf:
        - $ref: '#/components/schemas/PaymentAcceptToss'
        - $ref: '#/components/schemas/PaymentAcceptPortone'
      discriminator:
        propertyName: pg
        mapping: { TOSS: '#/components/schemas/PaymentAcceptToss', SIMULATOR: '#/components/schemas/PaymentAcceptToss', PORTONE: '#/components/schemas/PaymentAcceptPortone' }
    PaymentAcceptToss: { type: object, additionalProperties: false, required: [pg, paymentKey, amount], properties: { pg: { type: string, enum: [TOSS, SIMULATOR] }, paymentKey: { type: string, description: "토스 성공 URL의 paymentKey(SIMULATOR도 같은 형식). 1~200자 [가정]의 보이는 ASCII만 받고 아니면 400이다(서버 검사, 추천 적용 2026-11-05)" }, amount: { type: integer, description: 성공 URL의 금액. 서버 주문 금액과 대조 }, attemptId: { type: string, format: uuid, description: "결제창을 연 결제 시도의 ID(선택, `PaymentAttempt.attemptId`). 있으면 지금 READY 시도와 같아야 하고 다르면 409 payment-attempt-mismatch다. 대체된 시도의 늦은 접수를 같은 결제사에서도 막는다. 없으면 결제사만 대조한다(추천 적용 2026-11-09, BUILD_ORDER PRF-191, 코드 리뷰). 표 주문 접수만 본다(굿즈 접수는 구현 전)" } } }
    PaymentAcceptPortone: { type: object, additionalProperties: false, required: [pg, paymentId, paymentToken, txId], properties: { pg: { type: string, enum: [PORTONE] }, paymentId: { type: string, description: "결제 시도 응답의 paymentId와 같아야 한다. 세 칸 모두 1~200자 [가정]의 보이는 ASCII만 받고 아니면 400이다(서버 검사, 추천 적용 2026-11-05)" }, paymentToken: { type: string, description: 수동 승인 API용 결제 토큰. 승인 결과가 정해지면 서버에서 지운다 }, txId: { type: string, description: 결제 시도 ID. 승인 API에 검증용으로 넘긴다 }, attemptId: { type: string, format: uuid, description: "결제창을 연 결제 시도의 ID(선택, `PaymentAttempt.attemptId`. 포트원의 txId와 다른 값이다). 있으면 지금 READY 시도와 같아야 하고 다르면 409 payment-attempt-mismatch다. 없으면 결제사·paymentId만 대조한다(추천 적용 2026-11-09, BUILD_ORDER PRF-191, 코드 리뷰). 표 주문 접수만 본다(굿즈 접수는 구현 전)" } } }
    MerchOrderCreate:
      description: "굿즈 주문 본문(POST /v1/shop/orders). fulfillment 값으로 갈리고, 갈래마다 허용 필드 밖의 값은 400이다. 티켓 연동 부가 상품은 이 경로가 아니라 POST /v1/tickets/{ticketId}/addons로 주문한다(FR-014). 칸은 docs/data.md의 merch_order·merch_order_item에 맞췄다(추천 적용 2026-10-30, ADR-0089 '남는 한계')"
      oneOf:
        - $ref: '#/components/schemas/MerchOrderCreateDelivery'
        - $ref: '#/components/schemas/MerchOrderCreatePickup'
      discriminator:
        propertyName: fulfillment
        mapping: { DELIVERY: '#/components/schemas/MerchOrderCreateDelivery', PICKUP: '#/components/schemas/MerchOrderCreatePickup' }
    MerchOrderCreateDelivery:
      type: object
      additionalProperties: false
      description: "택배 주문. 판매자가 직접 보내므로 배송지와 배송 정보 판매자 제공 동의를 함께 받는다(SCR-015 ⑨, POL-016, ADR-0062)"
      required: [fulfillment, items, delivery]
      properties:
        fulfillment: { type: string, enum: [DELIVERY] }
        items: { $ref: '#/components/schemas/MerchOrderItems' }
        delivery: { $ref: '#/components/schemas/MerchDelivery' }
        consents:
          type: object
          additionalProperties: false
          description: "배송 정보를 판매자에게 주는 동의. 없거나, provisionToSeller가 true가 아니거나, consentVersion이 없으면 422 consent-required다(guidelines §12 '동의 누락'). 동의 일시는 주문의 created_at이다(ADR-0089)"
          properties:
            provisionToSeller: { type: boolean, description: "배송 정보 판매자 제공 동의(필수). 받는 자·목적·항목·보유 기간·거부권과 불이익 문안은 docs/design/d5 §5.15 '배송 정보 판매자 제공 동의'(개인정보 보호법 §17, docs/planning/03 §1.2 '굿즈 배송 정보의 판매자 제공')" }
            consentVersion: { type: string, pattern: '^[0-9A-Za-z._-]{1,32}$', description: "주문서에 보인 고지 문안의 판. merch_order.consent_version에 넣는다(문안은 판마다 따로 보관한다, docs/security/data-classification.md '법적 동의 기록'). 서버가 지금 쓰는 판이 아니면 422 consent-version-outdated이고, 화면은 지금 문안을 다시 보이고 다시 동의받는다. 32자 상한은 [가정]" }
    MerchOrderCreatePickup:
      type: object
      additionalProperties: false
      description: "현장 수령 주문. PEAKET 교환권으로 확인하므로 판매자에게 개인정보를 주지 않고, 배송지와 동의를 받지 않는다(POL-016, docs/design/d5 §5.15)"
      required: [fulfillment, items, pickupSlotId]
      properties:
        fulfillment: { type: string, enum: [PICKUP] }
        items: { $ref: '#/components/schemas/MerchOrderItems' }
        pickupSlotId: { type: string, minLength: 1, maxLength: 64, description: "고른 현장 수령 시간대. 티켓 소지자 전용 시간대는 그 공연 티켓을 가진 계정만 고른다(구매 자격이 아니라 혜택, FR-015·POL-016). 그 상품의 시간대가 아니거나 끝났거나, 티켓 없이 전용 시간대를 고르면 422 pickup-slot-unavailable이다. 수령 시간대는 docs/data.md `pickup_slot`(상품 단위, 회차·시작·끝·티켓 소지자 전용 여부 [가정])이고 주문의 칸은 `merch_order.pickup_slot_id`다(2026-10-30 더함). 화면이 시간대 목록을 읽는 경로는 아직 없다(wbs 0.2.3)" }
    MerchOrderItems:
      type: array
      minItems: 1
      maxItems: 20
      uniqueItems: true
      description: "주문 항목. 한 판매자·한 수령 방식의 상품만 담는다(다르면 422). 20개 상한은 [가정]이다. 금액은 받지 않는다. 서버가 주문 때 가격·수수료율·고른 옵션을 merch_order_item에 복사한다(ADR-0101)"
      items: { $ref: '#/components/schemas/MerchOrderItemInput' }
    MerchOrderItemInput:
      type: object
      additionalProperties: false
      required: [productId, quantity]
      properties:
        productId: { type: string, format: uuid, description: "product.id(UUIDv7). 없거나 판매 중이 아니거나 그 수령 방식을 받지 않는 상품, 티켓 연동 부가 상품이면 422" }
        quantity: { type: integer, minimum: 1, maximum: 99, description: "99는 형식 상한 [가정]이다. 상품마다 정한 계정당 한도(SCR-015 ⑦)를 넘으면 422" }
        options: { type: object, maxProperties: 10, propertyNames: { maxLength: 30 }, additionalProperties: { type: string, minLength: 1, maxLength: 50 }, description: "고른 옵션(옵션 이름 → 고른 값). 그 상품의 유형 스키마 판(product.schema_version, @peaket/validation)으로 검사하고 맞지 않으면 422. 옵션이 없는 상품은 빼거나 빈 객체로 보낸다. 10개·이름 30자·값 50자 상한은 [가정](ADR-0101)" }
    MerchDelivery:
      type: object
      additionalProperties: false
      description: "택배 배송지(CMP-067 AddressForm: 받는 분·연락처·주소 찾기·상세 주소). docs/data.md merch_order의 recipient_name·recipient_phone·delivery_address에 넣고, 우편번호·기본 주소·상세 주소는 delivery_address 한 칸에 함께 담는다. 대금결제·재화 공급 기록으로 5년 보존하고, 판매자에게는 동의 범위 안에서만 준다(docs/security/data-classification.md '굿즈 배송지'). 길이 상한은 [가정]"
      required: [recipientName, recipientPhone, postalCode, address]
      properties:
        recipientName: { type: string, minLength: 1, maxLength: 50, description: 받는 분 성명 }
        recipientPhone: { type: string, pattern: '^[0-9]{8,12}$', description: "받는 분 연락처. 숫자만(하이픈 없이) 8~12자리 [가정]" }
        postalCode: { type: string, pattern: '^[0-9]{5}$', description: "우편번호 5자리(2015-08-01부터 쓰는 국가기초구역 번호, 인터넷우체국 우편번호 안내 2026-10-30 확인)" }
        address: { type: string, minLength: 1, maxLength: 200, description: 주소 찾기로 고른 기본 주소 }
        addressDetail: { type: string, maxLength: 100, description: "상세 주소(동·호수 등). 없으면 뺀다" }
    Ticket: { type: object, properties: { ticketId: { type: string }, eventId: { type: string }, seatLabel: { type: string }, gateZone: { type: string }, status: { type: string, enum: [ISSUED, ACTIVE, TRANSFER_PENDING, CANCEL_REQUESTED, REFUNDED, FLAGGED, VOIDED], description: "티켓 상태(docs/planning/03 §2.5, ScannerPackageTicket과 같은 값). Reissued·Transferred는 상태가 아니라 사건(이력)이고, ScannedIn·ScannedOut은 입장 상태(ScannerPackageTicket의 scanState)다" }, transferable: { type: boolean }, transferLocked: { type: boolean, default: false, description: "부정 예매 소명 요청으로 양도가 잠겼는지(POL-046 ③). 잠긴 동안 양도 요청만 409 transfer-locked이고, 결제자에게 돌려주기와 입장은 막지 않는다(추천 적용 2026-10-31, ADR-0171. 돌려주기를 막지 않는 것은 추천 적용 2026-10-31, ADR-0173 결정 3)" }, transferLockExpiresAt: { type: [string, "null"], format: date-time, description: "양도 잠금의 최대 기한(소명 요청 + 14일 [가정], 연장 없음). 잠겼을 때만 싣고 아니면 null이다. 소명 인정·사건 정상 종료·조치 실행 끝·묶음에서 빠짐·입장 시작·조치 요청의 반려·만료가 먼저 오면 그때 풀린다(추천 적용 2026-10-31, ADR-0173)" }, transferDeadline: { type: string, format: date-time }, cancelDeadline: { type: string, format: date-time, description: "공연 시작 시각(POL-032)" }, eventTitle: { type: string, description: "공연명" }, placeName: { type: string, description: "장소" }, eventStartsAt: { type: string, format: date-time, description: "회차 시작" }, entryOpensAt: { type: [string, "null"], format: date-time, description: "입장 시작 시각" }, receivedFromNickname: { type: [string, "null"], description: "받은 티켓의 보낸 분 닉네임. 받은 티켓이 아니면 null(authz-matrix §4.1 '양도 요청')" }, bookingNumber: { type: [string, "null"], description: "예매번호. 결제자 본인 티켓에만 싣고 받은 티켓은 null이다 [가정](받는 사람에게 결제 정보를 주지 않는 규칙, POL-017)" }, enteredAt: { type: [string, "null"], format: date-time, description: "입장 시각(ScannedIn). 입장 전이면 null" }, seller: { $ref: "#/components/schemas/SellerInfo", description: "상세(GET /v1/tickets/{ticketId})에만. 판매자 정보(CMP-058 receipt)" } } }
    CancellationQuote:
      type: object
      description: 예매 취소 환급 예상(POL-032). 소비자분쟁해결기준 공연업 공제율
      properties:
        ticketId: { type: string }
        daysBefore: { type: integer, description: 공연일까지 남은 달력일(공연장 현지 날짜) }
        within24h: { type: boolean, description: 예매 후 24시간 이내(비영업일 제외)이고 공연 3일 전까지 }
        deductionRate: { type: number, enum: [0, 0.1, 0.2, 0.3, 0.9], description: "보여 주는 공제율. 금액 계산에는 쓰지 않는다(서버가 기준점 정수로 계산, 추천 적용 2026-10-28, 기술 검토 낮음-095)" }
        basis: { type: string, description: 적용 근거 문구 }
        ticketPrice: { type: integer }
        deductionAmount: { type: integer, description: "공제액 = 티켓 금액 × 공제율의 원 미만 버림(POL-032, 기술 검토 낮음-095)" }
        refundAmount: { type: integer, description: "티켓 금액 − 공제액. 실제 환급과 같은 공용 함수의 결과" }
        refundAfterEntryClose: { type: boolean, description: "입장 시작 뒤 취소라 환급을 입장 기록 마감 뒤 실행(ADR-0051 결정 13)" }
    Cancellation: { type: object, properties: { cancellationId: { type: string }, status: { type: string, enum: [REQUESTED, REFUND_PENDING, REFUNDED, VOIDED] }, refundAmount: { type: integer } } }
    TransferOffer: { type: object, description: "양도 요청(POL-017, ADR-0046). 받는 사람에게는 결제 금액과 결제자 연락처를 싣지 않는다", properties: { offerId: { type: string }, ticketId: { type: string }, role: { type: string, enum: [SENDER, RECIPIENT] }, counterpartNickname: { type: string }, status: { type: string, enum: [OFFERED, ACCEPTED, REJECTED, WITHDRAWN, EXPIRED, RECLAIMED] }, expiresAt: { type: string, format: date-time, description: "48시간과 양도 마감 중 이른 때" }, payerOnlyNotice: { type: string, description: "결제자만 취소·환불 고지 문구" }, eventId: { type: string }, eventTitle: { type: string, description: "공연명" }, eventStartsAt: { type: string, format: date-time, description: "회차 시작" }, seatLabel: { type: string } } }
    RefundAccount: { additionalProperties: false, type: object, required: [bankCode, accountNumber, holderName], description: "환불·배상 계좌. 저장하지 않고 결제사 취소·송금 요청에 바로 넘긴다(POL-014)", properties: { bankCode: { type: string }, accountNumber: { type: string }, holderName: { type: string } } }
    Compensation: { type: object, description: "분쟁해결기준에 따른 배상금(ADR-0046 결정 5)", properties: { compensationId: { type: string }, orderId: { type: string }, amount: { type: integer, description: "실제 결제 금액의 10%" }, status: { type: string, enum: [ACCOUNT_PENDING, REQUESTED, PAID, FAILED] }, accountLast4: { type: string }, eventId: { type: string }, reason: { type: string, enum: [ORGANIZER, CONTENT_CHANGE], description: "배상 사유(회차 취소의 귀책 판정 event_cancellation_request.fault, 불가항력은 배상 없음). compensation에는 이 칸이 없어 취소 요청에서 읽는다 [가정]" }, createdAt: { type: string, format: date-time } } }
    SellerInfo: { type: object, required: [legalName, representative, address, phone, email, businessRegNo], description: "판매자 신원정보(전자상거래법 §20②, POL-037)", properties: { legalName: { type: string }, representative: { type: string }, address: { type: string }, phone: { type: string }, email: { type: string, format: email }, businessRegNo: { type: string }, mailOrderReportNo: { type: string, description: "통신판매업 신고번호. 없으면 exemptionBasis 필수" }, exemptionBasis: { type: string } } }
    SellerInfoInput:
      type: object
      additionalProperties: false
      description: SellerInfo의 요청용(정의 밖 칸을 400으로 거절한다). 칸의 뜻은 원래 스키마(SellerInfo)와 같고 응답은 SellerInfo(열림)다(guidelines §1 '요청은 닫고 응답은 연다', BAS-040).
      required: [legalName, representative, address, phone, email, businessRegNo]
      properties:
        legalName: {type: string}
        representative: {type: string}
        address: {type: string}
        phone: {type: string}
        email: {type: string, format: email}
        businessRegNo: {type: string}
        mailOrderReportNo: {type: string, description: 통신판매업 신고번호. 없으면 exemptionBasis 필수}
        exemptionBasis: {type: string}
    EventCancellationRequest: { type: object, description: "회차 취소 요청(ADR-0046 결정 4)", properties: { requestId: { type: string }, eventId: { type: string }, kind: { type: string, enum: [CANCEL, POSTPONE] }, status: { type: string, enum: [REQUESTED, JUDGED, PENDING_APPROVAL, APPROVED, RUNNING, PAUSED, REFUND_WINDOW, COMPLETED, REJECTED], description: "REFUND_WINDOW는 연기(POSTPONE) 확정 뒤 바뀐 공연 시작 전까지 환급 신청을 받는 때(docs/planning/03 §2.11, 기술 검토 중간-044)" }, fault: { type: string, enum: [ORGANIZER, FORCE_MAJEURE, CONTENT_CHANGE] }, fanNoticeReason: { type: string, maxLength: 200, description: "팬 통지의 사유 요약(200자 [가정], 판정자가 통지 문안 미리보기에서 씀, docs/design/d5 §9.3). 내부 판정 사유와 따로 둔다(ADR-0062)" }, dryRun: { type: object, description: "대상 주문 수, 환급 총액, 배상 대상 수와 총액, 결제사별 건수와 예상 소요 시간" }, progress: { type: object, properties: { total: { type: integer }, done: { type: integer }, failed: { type: integer }, perPg: { type: array, description: "결제사 몫마다의 진행과 멈춘 이유(transfer-refund §5, 추천 적용 2026-10-28, 기술 검토 중간-045)", items: { type: object, properties: { pg: { type: string, enum: [TOSS, PORTONE, SIMULATOR] }, state: { type: string, enum: [RUNNING, PAUSED, COMPLETED] }, pauseReason: { type: [string, "null"], enum: [AUTO_FAILURE_RATE, AUTO_CONSECUTIVE_FAILURES, AUTO_CIRCUIT_OPEN, AUTO_REJECT_RATE, MANUAL, null], description: "PAUSED일 때만. AUTO_로 시작하면 스스로 멈춤" }, done: { type: integer }, failed: { type: integer }, unknown: { type: integer, description: "결과 모름으로 재시도 큐에 있는 건" } } } } } }, promoterId: { type: string }, title: { type: string, description: "공연 제목" }, partnerReason: { type: [string, "null"], description: "파트너가 적은 사유(docs/data.md partner_reason). commander가 직접 낸 요청이면 그 사유" }, faultOpinion: { type: [string, "null"], enum: [ORGANIZER, FORCE_MAJEURE, CONTENT_CHANGE, null], description: "파트너의 귀책 의견(참고값)" }, evidenceRef: { type: [string, "null"], description: "증빙 참조값" }, newStartsAt: { type: [string, "null"], format: date-time, description: "연기일 때 바뀐 공연 시작 시각" }, requestedAt: { type: string, format: date-time }, judgedBy: { oneOf: [{ $ref: "#/components/schemas/OpsActor" }, { type: "null" }], description: "판정한 commander. 관제 GET에만 싣고 파트너 응답에는 싣지 않는다" } } }
    ApprovalRequest: { type: object, description: "승인 업무(POL-038)", properties: { approvalId: { type: string }, kind: { type: string, enum: [SYSTEM_FAULT_REFUND, DISCRETIONARY_WAIVER, TRANSFER_RECLAIM, BOOKING_RESTRICTION, PAYOUT_BATCH, SETTLEMENT_ADJUSTMENT, COMMANDER_ROLE_CHANGE, CONTRACT_TERMS_CHANGE, MINOR_CONTRACT_CANCEL, SALE_SUSPENSION, SALE_RESUMPTION, FRAUD_ACTION], description: "FRAUD_ACTION은 부정 예매 조치(표 취소, 이용 제한 걸기·풀기)다. 지정 부정 거래 조사관이 POST /v1/ops/fraud-cases/{caseId}/action-requests로만 만들고(이 스키마의 POST /v1/ops/approval-requests로 보내면 422), targetRef는 사건 ID, 승인자는 요청자가 아니고 가명정보 취급자 지정이 없으며 지난 90일 안에 그 지정을 거둔 적도 없는 commander다(2인, POL-038 ⑪, 추천 적용 2026-10-31, ADR-0171). 만료는 표 취소(CANCEL_TICKETS)가 취소 마감 시각, 이용 제한 걸기·풀기(RESTRICT·LIFT_RESTRICTION)가 POL-038 공통의 요청 뒤 5영업일 [가정]이다. MINOR_CONTRACT_CANCEL은 미성년자 계약 취소(cs_agent 요청, 요청자 아닌 cs_lead 1인 승인, POL-038 ⑧, 추천 적용 2026-10-14, ADR-0062). SALE_SUSPENSION·SALE_RESUMPTION은 승인한 공연의 판매 중지·재개다. targetRef는 공연 ID이고 reasonCode는 SELLER_IDENTITY·LEGAL_REQUEST·FRAUD_SUSPECTED·OTHER [가정] 가운데 하나다. operator 이상이 요청하고 요청자가 아닌 commander가 승인한다(2인, docs/planning/03 §2.14, POL-038 ⑩, 추천 적용 2026-10-28, ADR-0123)" }, targetRef: { type: string }, requestedRole: { type: [string, "null"], enum: [commander, viewer, operator, cs_agent, cs_lead, null], description: "COMMANDER_ROLE_CHANGE에만. 승인되면 대상 관리 계정(targetRef)에 줄 역할이다. commander로 올리면 commander, commander에서 내리면 나머지 관제 역할 가운데 하나다. 그 밖의 종류는 null이다. 요청은 PUT /v1/ops/admin-accounts/{adminAccountId}/role의 202가 만들고, 승인 뒤 ops-svc가 이 값으로 identity-svc ChangeAdminRole을 부른다(docs/data.md approval_request.requested_role, 소유자 결정 2026-10-30, open-items 73번, 칸은 추천 적용 2026-10-30)" }, amount: { type: integer, format: int64, description: "원 단위. 지급 묶음 합계를 담으므로 64비트 정수다(DB bigint, 추천 적용 2026-10-28, 기술 검토 높음-20)" }, reasonCode: { type: string }, reasonText: { type: string }, evidenceChecked: { type: string, description: "확인한 증빙 종류만. 파일과 내용은 받지 않는다" }, requiredApprovals: { type: integer, enum: [1, 2], description: "서버가 정한다" }, approvals: { type: array, items: { type: string } }, status: { type: string, enum: [REQUESTED, PENDING_APPROVAL, APPROVED, REJECTED, ESCALATED, EXECUTING, DONE, FAILED, WITHDRAWN, EXPIRED], description: "승인 대기 저장 값은 PENDING_APPROVAL. FAILED는 원인을 고친 뒤 승인자가 approve를 다시 부르면 다시 실행한다(docs/planning/03 §2.10, 추천 적용 2026-10-20, ADR-0073). WITHDRAWN은 승인 전 요청자 철회, EXPIRED는 대상 상태가 바뀌었거나 처리 기한이 지나 시스템이 끝낸 것이다(POL-038 공통, 추천 적용 2026-10-28, 기술 검토 낮음-087)" }, dueAt: { type: string, format: date-time }, fraudAction: { type: [string, "null"], enum: [CANCEL_TICKETS, RESTRICT, LIFT_RESTRICTION, null], description: "FRAUD_ACTION에만. 그 밖의 종류는 null(docs/data.md approval_request.fraud_action)" }, summaryViewedAt: { type: [string, "null"], format: date-time, readOnly: true, description: "FRAUD_ACTION에만, 읽기 전용. 지금 부른 관리 계정 자신이 이 상세(fraudCaseSummary가 붙은 GET)를 처음 연 시각이다(docs/data.md approval_summary_view.first_viewed_at, 승인자마다 따로). 처음 여는 이번 응답에는 이번 시각이 실린다. 다른 종류면 null이다. 자기 열람 기록이 없는 승인자가 승인하면 409 fraud-summary-not-viewed다(POL-038 ⑪, 자동화된 결정 안내서 pp.7–8의 개입 과정 기록(추천 적용 2026-10-31, ADR-0173)" }, fraudCaseSummary: { oneOf: [{ $ref: "#/components/schemas/FraudCaseSummary" }, { type: "null" }], description: "FRAUD_ACTION에만, 읽기 전용. FRAUD_ACTION 상세는 요청자와 승인 자격자만 받으므로(그 밖은 404) 상세에는 늘 실리고, 다른 종류에는 null이다(추천 적용 2026-10-31, ADR-0171). 만료는 표 취소(CANCEL_TICKETS)가 취소 마감 시각, 이용 제한 걸기·풀기(RESTRICT·LIFT_RESTRICTION)가 POL-038 공통의 요청 뒤 5영업일 [가정]이다(POL-038 ⑪·공통, 추천 적용 2026-10-31, ADR-0171)" }, requestedBy: { $ref: "#/components/schemas/OpsActor" }, requestedAt: { type: string, format: date-time }, closeReason: { type: [string, "null"], description: "WITHDRAWN의 요청자 사유, EXPIRED의 TARGET_CHANGED·DEADLINE_PASSED(docs/data.md approval_request.close_reason)" }, canApprove: { type: boolean, description: "부른 계정이 지금 승인·반려할 수 있는지(요청자 제외). 서버가 판정한다" }, contractTerms: { type: [object, "null"], description: "CONTRACT_TERMS_CHANGE에만. 지금 값과 바꿀 값. 다른 종류는 null이다", properties: { current: { $ref: "#/components/schemas/PromoterContractTerms" }, requestedCommissionRateBp: { type: [integer, "null"] }, requestedGuaranteeRateBp: { type: [integer, "null"] }, requestedGuaranteeKind: { type: [string, "null"], enum: [DEPOSIT, PERFORMANCE_BOND, null] } } } } }
    ApprovalRequestInput:
      type: object
      additionalProperties: false
      description: 'ApprovalRequest의 요청용(정의 밖 칸을 400으로 거절한다). 칸의 뜻은 원래 스키마(ApprovalRequest)와 같고 응답은 ApprovalRequest(열림)다(guidelines §1 ''요청은 닫고 응답은 연다'', BAS-040). 서버가 정하거나 채우는 칸(approvalId·requiredApprovals·approvals·status·dueAt·summaryViewedAt·fraudCaseSummary)과 이 경로가 받지 않는 칸(requestedRole: COMMANDER_ROLE_CHANGE는 역할 경로만, fraudAction: FRAUD_ACTION은 사건 조치 요청 경로만)은 받지 않는다.'
      properties:
        kind:
          type: string
          enum: [SYSTEM_FAULT_REFUND, DISCRETIONARY_WAIVER, TRANSFER_RECLAIM, BOOKING_RESTRICTION, PAYOUT_BATCH, SETTLEMENT_ADJUSTMENT, COMMANDER_ROLE_CHANGE, CONTRACT_TERMS_CHANGE, MINOR_CONTRACT_CANCEL, SALE_SUSPENSION, SALE_RESUMPTION, FRAUD_ACTION]
          description: FRAUD_ACTION은 부정 예매 조치(표 취소, 이용 제한 걸기·풀기)다. 지정 부정 거래 조사관이 POST /v1/ops/fraud-cases/{caseId}/action-requests로만 만들고(이 스키마의 POST /v1/ops/approval-requests로 보내면 422), targetRef는 사건 ID, 승인자는 요청자가 아니고 가명정보 취급자 지정이 없으며 지난 90일 안에 그 지정을 거둔 적도 없는 commander다(2인, POL-038 ⑪, 추천 적용 2026-10-31, ADR-0171). 만료는 표 취소(CANCEL_TICKETS)가 취소 마감 시각, 이용 제한 걸기·풀기(RESTRICT·LIFT_RESTRICTION)가 POL-038 공통의 요청 뒤 5영업일 [가정]이다. MINOR_CONTRACT_CANCEL은 미성년자 계약 취소(cs_agent 요청, 요청자 아닌 cs_lead 1인 승인, POL-038 ⑧, 추천 적용 2026-10-14, ADR-0062). SALE_SUSPENSION·SALE_RESUMPTION은 승인한 공연의 판매 중지·재개다. targetRef는 공연 ID이고 reasonCode는 SELLER_IDENTITY·LEGAL_REQUEST·FRAUD_SUSPECTED·OTHER [가정] 가운데 하나다. operator 이상이 요청하고 요청자가 아닌 commander가 승인한다(2인, docs/planning/03 §2.14, POL-038 ⑩, 추천 적용 2026-10-28, ADR-0123)
        targetRef: {type: string}
        amount: {type: integer, format: int64, description: '원 단위. 지급 묶음 합계를 담으므로 64비트 정수다(DB bigint, 추천 적용 2026-10-28, 기술 검토 높음-20)'}
        reasonCode: {type: string}
        reasonText: {type: string}
        evidenceChecked: {type: string, description: 확인한 증빙 종류만. 파일과 내용은 받지 않는다}
    ApprovalDecisionBody: { type: object, additionalProperties: false, description: "승인 본문(POST /v1/ops/approval-requests/{approvalId}/approvals, POL-038 ⑪). FRAUD_ACTION에서 승인자가 실질적으로 결정했음을 남기는 칸이다. 승인자가 직접 적은 판단 이유와 뺀 계정·표는 승인 기록(docs/data.md approval_vote)과 사건 기록에 남는다(추천 적용 2026-10-31, ADR-0173)", properties: { reason: { type: string, minLength: 1, maxLength: 1000, description: "승인자의 판단 이유(1~1000자). kind FRAUD_ACTION이면 필수이고 없으면 422 approval-reason-required다. 요청자의 사유를 그대로 옮기지 말고 자기 판단을 적는다(화면 안내)" }, excludeAccountIds: { type: array, maxItems: 100, uniqueItems: true, items: { type: string }, description: "FRAUD_ACTION만. 요청 범위에서 빼고 승인할 계정. 요청 범위 밖이면 422 approval-scope-invalid" }, excludeTicketIds: { type: array, maxItems: 500, uniqueItems: true, items: { type: string }, description: "FRAUD_ACTION의 CANCEL_TICKETS만. 요청 범위에서 빼고 승인할 표. 요청 범위 밖이면 422 approval-scope-invalid, 계정·표를 다 빼면 같은 422(그때는 반려한다)" } } }
    CsCase: { type: object, description: "CS 처리함 건(POL-038)", properties: { caseId: { type: string }, kind: { type: string, enum: [UNKNOWN_PAYMENT, REFUND_FAILED, FLAGGED, REFUND_ACCOUNT_PENDING, COMPENSATION_PENDING, ABUSE_FLAG, DISPUTE, JUDGEMENT_PENDING, STATEMENT_DISPUTE, SELLER_KYC_REQUIRED, PAYOUT_ERROR, PAYOUT_FAILED, PAYOUT_DELAYED, PORTONE_PAYOUT_EXECUTION, SCANNER_UNREPORTED, KOPIS_REPORT_FAILED, VERIFICATION_APPEAL, APPROVAL_EXECUTION_FAILED, RETURN_DELAYED, MINOR_CONTRACT_CANCEL, INQUIRY, CONTENT_REPORT, RIGHTS_REQUEST, PORTONE_LEDGER_MISMATCH, TICKET_NOT_ISSUED, PG_BALANCE_MISMATCH, APPEAL, FRAUD_OBJECTION_COMPENSATION], description: "APPEAL은 소명(예매 제한·양도 회수 대상 팬의 사정 설명, POST /v1/appeals). core-svc support 모듈이 받아 건을 요청하고, 건은 그 대상(예매 제한, 양도 회수 승인 업무)에 이어진다. 결과 기한은 예매 제한 소명이 3영업일 [가정], 양도 회수 소명이 그 승인 업무의 기한(입장 시작 전)이다(추천 적용 2026-10-30, docs/features/transfer-refund.md §7.1). PG_BALANCE_MISMATCH는 결제사 잔액 대사 차이(결제사·상점별 지급대행 잔액이 PEAKET 원장과 다름. 차이가 0이 아니면 건을 만들고 1만 원 [가정]을 넘으면 SEV3, 지급 묶음은 멈추지 않는다, settlement §5.5, 추천 적용 2026-10-28, 기술 검토 중간-043). TICKET_NOT_ISSUED는 결제 뒤 미발권(승인 뒤 발권 기한 30분 [가정]을 넘겼거나 다시 보내도 같은 오류로 자동 재시도를 멈춘 주문. 확인 4시간 [가정], 발권 다시 실행 또는 '시스템 잘못이 확인된 환불', 추천 적용 2026-10-28, ADR-0106). PORTONE_LEDGER_MISMATCH는 포트원 원장 불일치(PEAKET 지급과 이어지지 않거나 금액·받는 계좌가 다른 출금, 콘솔에서 바뀐 파트너 정산 계좌, 이체 원장과 다른 잔액 입력). targetRef는 포트원 이체 ID·파트너 ID·지급 묶음 ID이고, 열린 건에서 (kind, targetRef)가 하나다(settlement §5.3, 추천 적용 2026-10-28, ADR-0108). RETURN_DELAYED는 굿즈 반품 요청 뒤 7일 [가정] 동안 판매자 도착 확인이 없는 건(transfer-refund §7.1). MINOR_CONTRACT_CANCEL은 미성년자 계약 취소 요청(확인 결과 안내 3영업일, 승인 뒤 환급 3영업일, POL-038 ⑧). 추천 적용 2026-10-14, ADR-0062. INQUIRY는 고객 문의(답변 3영업일 [가정], 문의 유형 '공연(판매자) 관련 분쟁'은 DISPUTE, '미성년자 계약 취소'는 MINOR_CONTRACT_CANCEL로 온다), CONTENT_REPORT는 게시물 신고(같은 후기의 신고는 한 건, 결과 3영업일 [가정]), RIGHTS_REQUEST는 권리 침해 삭제 요청(정보통신망법 §44의2, 1영업일 [가정]). 추천 적용 2026-10-19, ADR-0066" }, targetRef: { type: string, description: "문의 건은 inquiryId, 신고 건은 신고된 reviewId, 소명 건은 appealId, 포트원 원장 불일치는 포트원 이체 ID·파트너 ID·지급 묶음 ID" }, progressDueAt: { type: string, format: date-time }, resultDueAt: { type: string, format: date-time }, status: { type: string, enum: [OPEN, IN_PROGRESS, RESOLVED] }, reportSummary: { type: object, description: "CONTENT_REPORT·RIGHTS_REQUEST만. 신고 수와 사유별 수. 신고자는 싣지 않는다(ADR-0066)", properties: { total: { type: integer }, byCategory: { type: object, additionalProperties: { type: integer } } } } } }
    CsCaseDetail: { description: "CS 처리함 건 상세(GET /v1/ops/cases/{caseId}, 추천 적용 2026-10-19, ADR-0066). 신고한 계정은 싣지 않는다", allOf: [{ $ref: '#/components/schemas/CsCase' }, { type: object, properties: { messages: { type: array, description: "문의 건만. 시간 순 기록(팬·답변·진행 경과)", items: { $ref: '#/components/schemas/InquiryMessage' } }, reports: { type: array, description: "CONTENT_REPORT·RIGHTS_REQUEST만. 신고마다 사유·자세한 내용·접수 시각(신고한 계정 없음)", items: { type: object, properties: { category: { type: string, enum: [SCALPING, MACRO, ABUSE, RIGHTS, ILLEGAL_FILMING, SPAM, OFF_TOPIC, OTHER] }, detail: { type: [string, 'null'], maxLength: 2000, description: "grapheme 500자 [가정]" }, rightsHolder: { type: boolean }, notifyChannel: { type: [string, 'null'], enum: [APP, EMAIL, null] }, createdAt: { type: string, format: date-time } } } }, review: { type: [object, 'null'], description: "신고 대상 후기(본문·별점·사진 파생본)", properties: { reviewId: { type: string }, rating: { type: integer }, body: { type: string }, images: { type: array, items: { $ref: '#/components/schemas/ReviewImage' } } } }, statementDispute: { type: [object, 'null'], description: "STATEMENT_DISPUTE만. 그 정산서 하나의 금액 항목·상태·이의 내용이다. 결제사(pg·결제 상점), 결제사 내부 ID, 결제사 오류 원문, 정산 계좌는 싣지 않는다(SettlementStatement와 다른 모양이다). cs_lead는 이 건에서 이의 기각(POST /v1/ops/settlements/{statementId}/dispute-dismissal)이나 이의를 인정한 수기 조정 요청(POST /v1/ops/settlements/{statementId}/adjustments)을 부른다(소유자 결정 2026-10-30, open-items 72번, 칸은 추천 적용 2026-10-30, docs/features/settlement.md §9, docs/design/d5 §7.6)", properties: { statementId: { type: string }, kind: { type: string, enum: [EVENT, PRODUCT] }, eventId: { type: [string, 'null'] }, periodStart: { type: [string, 'null'], format: date }, periodEnd: { type: [string, 'null'], format: date }, grossAmount: { type: integer, format: int64 }, refundAmount: { type: integer, format: int64 }, commissionAmount: { type: integer, format: int64 }, commissionVat: { type: integer, format: int64 }, offsetAmount: { type: integer, format: int64 }, payoutAmount: { type: integer, format: int64 }, status: { type: string, description: "SettlementStatement.status와 같은 값(이의 중이면 DISPUTED)" }, disputeDueAt: { type: string, format: date-time }, disputeReasonCode: { type: string, enum: [GROSS_AMOUNT, REFUND_AMOUNT, COMMISSION, OFFSET, OTHER], description: "파트너가 낸 이의 사유 코드(POST /v1/partner/settlements/{statementId}/disputes)" }, disputeDetail: { type: [string, 'null'], maxLength: 2000 }, disputedAt: { type: string, format: date-time } } } } }] }
    SettlementStatement: { type: object, description: "정산서(회차 정산서는 회차·결제사, 상품 정산서는 파트너·결제사·결제 상점·주 단위, POL-039, ADR-0047, 상품 정산서는 추천 적용 2026-10-14, ADR-0062). 계좌는 끝 4자리만", properties: { statementId: { type: string }, kind: { type: string, enum: [EVENT, PRODUCT], description: "EVENT는 티켓, PRODUCT는 굿즈·티켓 연동 부가 상품" }, eventId: { type: string, description: "회차. 상품 정산서는 null(ADR-0086)" }, pg: { type: string, enum: [TOSS, PORTONE] }, pgStore: { type: string, enum: [STANDARD, ESCROW], description: "토스페이먼츠 결제 상점(ESCROW는 굿즈 택배)" }, periodStart: { type: string, format: date, description: "상품 정산서의 주 시작(KST)" }, periodEnd: { type: string, format: date, description: "상품 정산서의 주 끝(KST)" }, grossAmount: { type: integer, format: int64 }, refundAmount: { type: integer, format: int64 }, commissionAmount: { type: integer, format: int64 }, commissionVat: { type: integer, format: int64 }, offsetAmount: { type: integer, format: int64 }, payoutAmount: { type: integer, format: int64 }, revision: { type: integer, description: "판본. 회차 취소·연기 환급이나 승인된 수기 판단으로 다시 계산하면 1 올린 새 판을 만든다(settlement §4.1, 기술 검토 중간-043)" }, supersedesId: { type: [string, 'null'], description: "이 판이 대신한 옛 판의 statementId. 첫 판은 null" }, excludedPayments: { type: array, items: { type: string }, description: "대사 불일치로 이번 계산에서 뺀 결제 ID 목록(settlement §4.1)" }, status: { type: string, enum: [CALCULATED, NOTIFIED, DISPUTED, CONFIRMED, HELD, SCHEDULED, FAILED, PAID, CARRIED_OVER, SUPERSEDED], description: "SUPERSEDED는 다시 계산해 새 판으로 바뀐 옛 판이다. 금액은 알린 그대로 남는다(settlement §4.1·§4.4, 추천 적용 2026-10-28, 기술 검토 중간-043)" }, holdReason: { type: string, enum: [KYC, ACCOUNT_CHANGE, BALANCE, ACCOUNT_MISMATCH, SALE_SUSPENDED], description: "ACCOUNT_MISMATCH는 포트원 파트너의 정산 계좌가 PEAKET 기록과 달라 그 파트너의 포트원 결제분 지급을 멈춘 것(settlement §5.3, 추천 적용 2026-10-28, ADR-0108). SALE_SUSPENDED는 그 회차의 공연이 판매 중지되어 지급을 멈춘 것(settlement §6, 추천 적용 2026-10-28, ADR-0123)" }, disputeDueAt: { type: string, format: date-time }, payoutDate: { type: string, format: date }, payoutBankCode: { type: string, description: "정산 은행 코드(docs/data.md promoter.payout_bank_code). 화면은 은행 이름으로 바꿔 끝 4자리와 함께 보인다(ADR-0162 결정 5, 추천 적용 2026-10-30)" }, payoutAccountLast4: { type: string } } }
    PayoutBatch: { type: object, description: "지급 묶음(지급일·결제사·결제 상점, 2인 승인)", properties: { batchId: { type: string }, pg: { type: string, enum: [TOSS, PORTONE] }, pgStore: { type: string, enum: [STANDARD, ESCROW], description: "토스페이먼츠 결제 상점. 같은 지급일·같은 상점이면 회차·상품 정산서가 한 묶음에 든다(추천 적용 2026-10-14, ADR-0062)" }, payoutDate: { type: string, format: date }, totalAmount: { type: integer, format: int64 }, statementCount: { type: integer }, approvalId: { type: string }, portoneBulkPayoutId: { type: string }, pgBalance: { type: object, description: "묶음 때 본 결제사 지급 가능 잔액. 토스페이먼츠는 잔액 API, 포트원은 operator가 콘솔에서 본 값이다. 포트원 값은 검증할 수 없어 지급을 미루는 쪽으로만 쓴다(ADR-0062)", properties: { amount: { type: integer, format: int64 }, pendingAmount: { type: integer, format: int64, description: "토스페이먼츠만. 정산 주기가 지나지 않은 '정산 대기' 금액" }, ledgerAmount: { type: integer, format: int64, description: "포트원만. 이체 원장으로 계산한 지급대행 계좌 잔액. operator 입력값과 다르면 작은 값으로 잔액 부족을 판정하고 CS 처리함 건을 만든다(settlement §5.1, 추천 적용 2026-10-28, ADR-0108)" }, source: { type: string, enum: [PG_API, OPERATOR_CONSOLE] }, observedAt: { type: string, format: date-time }, observedBy: { type: string, description: "OPERATOR_CONSOLE일 때 입력한 operator" } } }, status: { type: string, enum: [PREPARED, PENDING_APPROVAL, APPROVED, SUBMITTED, COMPLETED, PARTIAL_FAILED] }, approvalDueAt: { type: [string, "null"], format: date-time, description: "승인 기한(지급일 전 영업일 15시, POL-039)" } } }
    Receivable: { type: object, description: "미수금(상계 → 보증 → 청구)", properties: { receivableId: { type: string }, cause: { type: string, enum: [REFUND_AFTER_PAYOUT, CHARGEBACK, COMPENSATION_ADVANCE, NEGATIVE_STATEMENT] }, amount: { type: integer, format: int64 }, remaining: { type: integer, format: int64 }, status: { type: string, enum: [OPEN, OFFSET, GUARANTEE, BILLED, CLOSED, WRITTEN_OFF] } } }
    ReportStage: { type: string, enum: [R0, R1, R2, R3, FROZEN], description: "마감 단계(POL-040, docs/features/analytics.md §4.2)" }
    DemandForecast: { type: object, description: "수요 예측(POL-030, ADR-0078 결정 1). 개인정보 없음", properties: { eventId: { type: string }, computedAt: { type: string, format: date-time }, trigger: { type: string, enum: [SALE_REVIEW, DAILY, T_MINUS_30] }, subscribers: { type: integer, description: "그 회차의 오픈 알림 구독 수" }, ratioMedian: { type: number }, ratioUpper: { type: number, description: "75번째 백분위" }, sampleCount: { type: integer, description: "비율에 쓴 지난 회차 수(구독 수 0.5~2배)" }, defaultRatioUsed: { type: boolean, description: "sampleCount가 10 미만이라 기본 비율을 씀" }, expectedMedian: { type: integer }, expectedUpper: { type: integer }, suggestedScale: { type: string, enum: [LARGE, MEDIUM, SMALL] }, currentScale: { type: [string, 'null'], enum: [LARGE, MEDIUM, SMALL, null], description: "판매 승인 전이면 null" }, raiseSuggested: { type: boolean, description: "상단이 지금 등급의 상한을 넘음('규모 올리기 검토' 경보)" } } }
    EventReportSummary: { type: object, description: "공연 리포트 판 목록의 한 줄(FR-068)", properties: { eventId: { type: string }, stage: { $ref: '#/components/schemas/ReportStage' }, status: { type: string, enum: [DONE, DELAYED, PENDING] }, closedAt: { type: string, format: date-time }, qualityPassed: { type: boolean }, rulesTriggered: { type: integer }, rulesDeferred: { type: integer } } }
    EventReport: { type: object, description: "공연 리포트(지표 뷰와 회차 요약·규칙 판정만 읽어 만든다, ADR-0052). 가명 값·개인 단위 행 없음", properties: { eventId: { type: string }, stage: { $ref: '#/components/schemas/ReportStage' }, generatedAt: { type: string, format: date-time }, metrics: { type: array, items: { type: object, properties: { name: { type: string }, numerator: { type: number }, denominator: { type: number }, value: { type: number }, target: { type: string }, baselineMedian: { type: number }, baselineQ1: { type: number }, baselineQ3: { type: number }, sampleSize: { type: integer }, final: { type: boolean, description: "false면 잠정" } } } }, ruleChecks: { type: array, items: { type: object, properties: { rule: { type: string }, verdict: { type: string, enum: [TRIGGERED, NOT_TRIGGERED, DEFERRED] }, deferReason: { type: string, enum: [SAMPLE_TOO_SMALL, QUALITY_FAILED, NOT_FINAL] }, decisionId: { type: string } } } }, quality: { type: object, properties: { coverageOk: { type: boolean }, realtimeDiffSeats: { type: integer }, realtimeDiffSalesWon: { type: integer }, realtimeDiffFunnelRatio: { type: number }, settlementDiffWon: { type: integer } } }, decisionChecks: { type: array, items: { type: object, properties: { decisionId: { type: string }, metric: { type: string }, target: { type: string }, observed: { type: number } } } } } }
    DecisionRecord: { type: object, description: "결정 기록(POL-040, docs/data.md decision_record)", properties: { decisionId: { type: string }, eventId: { type: string }, triggerRule: { type: string }, triggerStage: { type: string, enum: [R0, R1, R2, R3], description: "결정 규칙이 걸린 마감 단계(동결 FROZEN은 계기가 아니다, docs/data.md decision_record)" }, kind: { type: string, enum: [OPERATING_DEFAULT, PRODUCT, SALES_POLICY, BOT_POLICY, PARTNER_RECOMMENDATION, TARGET] }, summary: { type: string, maxLength: 4000 }, decision: { type: string, maxLength: 4000 }, evidenceStrength: { type: string, enum: [WEAK, MEDIUM, STRONG] }, expectedEffect: { type: object, properties: { metric: { type: string }, target: { type: string }, checkAfterEvents: { type: integer } } }, revertCondition: { type: string, maxLength: 4000 }, ref: { type: string, description: "ADR·POL 번호나 설정 변경 ID" }, partnerResponse: { type: string, enum: [ACCEPTED, DECLINED, NONE] }, status: { type: string, enum: [AWAITING_CHECK, CHECKED, WITHDRAWN] }, checkResult: { type: string, enum: [MET, NOT_MET, INCONCLUSIVE] }, decidedBy: { type: string }, decidedAt: { type: string, format: date-time } } }
    DecisionRecordInput:
      type: object
      additionalProperties: false
      description: DecisionRecord의 요청용(정의 밖 칸을 400으로 거절한다). 칸의 뜻은 원래 스키마(DecisionRecord)와 같고 응답은 DecisionRecord(열림)다(guidelines §1 '요청은 닫고 응답은 연다', BAS-040). 서버가 채우는 칸(decisionId·status·decidedBy·decidedAt)과 나중에 PATCH로 고치는 칸(checkResult·partnerResponse)은 받지 않는다.
