        '403': { $ref: '#/components/responses/Problem', description: "commander가 아님, reauth-required" }
        '404': { $ref: '#/components/responses/Problem', description: "없는 템플릿(not-found)" }
        '412': { $ref: '#/components/responses/Problem', description: "검토 뒤 문구가 바뀜(precondition-failed)" }
        '422': { $ref: '#/components/responses/Problem', description: "네 언어가 다 있지 않음" }
        '428': { $ref: '#/components/responses/Problem', description: "If-Match 없음(precondition-required)" }
