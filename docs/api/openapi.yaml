  /v1/scanner/scans:
    post: { operationId: createScannerScan, tags: [scanner], x-peaket-roles: [scanner_device, gate_staff, gate_lead], summary: "스캔 기록 일괄 업로드(클라이언트 ID 멱등, 최대 500건 [가정]). 기기 인증만으로도 된다(로그아웃·해제·만료 뒤 남은 기록)", description: "FR-036, FR-067, NFR-025, POL-032, ADR-0051. 서버가 판정 표로 다시 판정해 이상 표시를 만들고 변경 기록에 입장 상태를 남긴다. 기록 시각에 세션이 유효하지 않으면 '세션 밖 기록'으로 표시하고 버리지 않는다. 기기 인증만으로도 되는 쓰기라 Content-Type: application/json만 받고(그 밖 415) Origin이 스캐너 PWA 출처가 아니거나 없으면 거절한다. 기본안은 기기 키 DPoP라 교차 출처 사전 요청에 자격 증명이 필요 없다. mTLS 선택지에서 교차 출처 요청에 기기 인증서가 실리는지는 선택 PoC 5.4.3에서 확인한다(추천 적용 2026-10-15, ADR-0065 결정 10, 기술 검토 중간-057). 스태프 토큰은 선택이지만, 붙였는데 무효(해제·교대·로그아웃으로 세션이 끝남)거나 만료면 토큰만 빼고 기기 인증으로 받아 주지 않는다. 401 invalid_token으로 돌려주고, 앱은 그 토큰을 지운 뒤 같은 묶음을 기기 인증만으로 다시 보낸다(클라이언트 ID 멱등, RFC 9449 §7.1, 추천 적용 2026-10-28, 기술 검토 낮음-074)", security: [{ deviceDpop: [] }, { deviceDpop: [], staffToken: [] }, { deviceMtls: [] }, { deviceMtls: [], staffToken: [] }], requestBody: { required: true, content: { application/json: { schema: { type: array, maxItems: 500, items: { $ref: '#/components/schemas/ScanEvent' } } } } }, responses: { '200': { description: "처리 결과(받은 ID, 이 기록들에 붙은 이상 표시)", content: { application/json: { schema: { type: object, properties: { acceptedIds: { type: array, items: { type: string } }, flags: { type: array, items: { $ref: '#/components/schemas/GateFlag' } } } } } } }, '401': { $ref: '#/components/responses/Unauthorized', description: "붙인 스태프 토큰이 무효·만료(invalid_token: 토큰 없이 다시 보낸다)이거나 DPoP 증명이 틀림(invalid_dpop_proof: 증명을 새로 만들어 다시 보낸다)" }, '403': { $ref: '#/components/responses/Problem', description: "Origin이 스캐너 PWA 출처가 아니거나 없음" }, '415': { $ref: '#/components/responses/Problem', description: "application/json이 아님" } } }
