    put: { operationId: putProductionWish, tags: [identity], x-peaket-roles: [fan], summary: 찜(오프라인 큐 재전송 가능), description: "FR-019. 공연 단위(ADR-0093). 같은 요청을 다시 보내도 결과가 같아 오프라인 대기열(localStorage peaket.wishQueue)이 멱등 키 없이 다시 보낸다(FE-T37). 혼자 바꾸는 자기 상태라 If-Match 없이 마지막 저장이 이긴다(guidelines §12 예외). 계정마다 1,000개 [가정]까지(추천 적용 2026-10-30, docs/features/notify.md §3.3)", security: [{ fanCookie: [] }], parameters: [{ $ref: '#/components/parameters/ProductionId' }], responses: { '204': { description: 저장 }, '401': { $ref: '#/components/responses/Unauthorized', description: "로그인 필요" }, '404': { $ref: '#/components/responses/Problem', description: "없는 공연·공개 전 공연" }, '422': { $ref: '#/components/responses/Problem', description: "wish-limit: 찜 1,000개 [가정] 초과" } } }
  /v1/push-subscriptions:
    post: { operationId: createPushSubscription, tags: [identity], x-peaket-roles: [fan], summary: "웹 푸시 구독 정보 등록·다시 묶기(구독 주소는 본문으로만)", description: "FR-004, FR-040(추천 적용 2026-10-30, docs/features/notify.md §3.4). 브라우저 PushSubscription의 구독 주소와 키를 이 계정에 묶는다. 같은 구독 주소가 있으면 지금 계정으로 다시 묶고 200(한 기기를 여러 사람이 쓰면 마지막에 로그인한 사람에게 묶인다), 없으면 201. 구독 주소는 https·포트 443이고 호스트가 푸시 서비스 허용 목록(FCM·Mozilla·Apple·WNS)에 있어야 한다. 보낼 때도 연결마다 해석한 IP를 검사하고 리디렉션을 따르지 않는다(SSRF 막기, guidelines §8). 계정마다 10개 [가정]까지이고 넘으면 가장 오래 쓰지 않은 구독을 지운다. 로그인 뒤 권한이 허용이고 getSubscription()이 값을 주면 화면이 다시 부른다. Cache-Control: no-store", security: [{ fanCookie: [] }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PushSubscriptionCreate' } } } }, responses: { '200': { description: "이미 있던 구독을 이 계정에 다시 묶음", content: { application/json: { schema: { $ref: '#/components/schemas/PushSubscriptionRegistered' } } } }, '201': { description: 등록, content: { application/json: { schema: { $ref: '#/components/schemas/PushSubscriptionRegistered' } } } }, '401': { $ref: '#/components/responses/Unauthorized', description: "로그인 필요" }, '422': { $ref: '#/components/responses/Problem', description: "push-service-not-allowed(허용 목록 밖 호스트·https 아님·443 아님·사설 주소로 풀림), push-key-invalid(p256dh·auth 길이나 점이 틀림)" }, '429': { $ref: '#/components/responses/TooManyRequests', description: "요청 한도 초과" } } }
  /v1/push-subscriptions/{subscriptionKey}:
    delete: { operationId: deletePushSubscription, tags: [identity], x-peaket-roles: [fan], summary: "웹 푸시 구독 해제(로그아웃·알림 끄기)", description: "FR-004(추천 적용 2026-10-30, docs/features/notify.md §3.4). subscriptionKey는 SHA-256(구독 주소)의 채움 없는 base64url이라 구독 주소를 경로에 넣지 않는다. 이 계정의 구독만 지운다. 없거나 남의 구독이어도 같은 204다(있는지 알리지 않는다). 브라우저의 구독 자체는 남긴다. 로그아웃 정리 루틴이 부른다", security: [{ fanCookie: [] }], parameters: [{ name: subscriptionKey, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' } }], responses: { '204': { description: 해제 }, '401': { $ref: '#/components/responses/Unauthorized', description: "로그인 필요" } } }
  /v1/subscription-opt-outs/{optOutToken}:
    post:
      operationId: createSubscriptionOptOut
      tags: [identity]
      x-peaket-roles: [public]
      security: []
      summary: "신청 알림 이메일의 한 번 누름 수신 거부(RFC 8058 List-Unsubscribe-Post)"
      description: "FR-040(추천 적용 2026-10-30, docs/features/notify.md §7.4). 메일 프로그램이 List-Unsubscribe 주소로 본문 List-Unsubscribe=One-Click을 POST하면 토큰이 가리키는 신청 하나를 지운다. 인증·쿠키가 없고(그래서 Origin 확인에서 뺀다), 토큰의 힘은 그 신청 하나 지우기뿐이다. 토큰은 base64url(신청 ID ‖ HMAC-SHA256(수신 거부 토큰 키, 신청 ID)의 앞 16바이트)이고 저장하지 않는다. 토큰이 틀리거나 신청이 이미 없어도 같은 200이다(있는지 알리지 않는다). 상수 시간으로 비교한다. 이 경로에 GET은 없다(링크 미리 보기가 지우지 않게). 토큰이 경로에 드는 것은 RFC 8058 규격 때문이며 guidelines §9 예외로 둔다. 로그와 요청 기록에는 경로 템플릿만 남긴다. IP별 요청 한도를 둔다"
      parameters: [{ name: optOutToken, in: path, required: true, schema: { type: string, maxLength: 64 } }]
      requestBody: { required: true, content: { application/x-www-form-urlencoded: { schema: { additionalProperties: false, type: object, required: [List-Unsubscribe], properties: { List-Unsubscribe: { type: string, enum: [One-Click] } } } } } }
      responses: { '200': { description: "처리함(토큰이 맞지 않아도 같은 응답)" }, '429': { $ref: '#/components/responses/TooManyRequests', description: "IP별 요청 한도 초과" } }
  /v1/identity/verifications:
    post:
      operationId: createIdentityVerification
      tags: [identity]
      x-peaket-roles: [fan]
      summary: "휴대폰 본인확인 시작(본인확인기관 창 값 발급). 별도 화면 없이 부르는 화면의 버튼이 기관 창을 연다"
      description: "FR-002, POL-001. 계정당 1회. 본인확인 흐름(소유자 결정 2026-10-14, ADR-0063): 부르는 화면(SCR-002·005·007·008·009·013·017·050 등)의 [휴대폰 본인확인] 버튼이 누른 동작 안에서 빈 창을 먼저 열고(팝업 차단을 피함) 이 응답의 양식을 그 창에 제출한다. 기관은 결과를 복귀 주소 `/verify/return`(서버가 고정한 같은 출처 주소, 클라이언트 입력을 받지 않음)으로 돌려주고, 복귀 화면이 결과 경로(POST …/{verificationId}/result)를 부른다. 팝업이면 복귀 화면이 같은 출처 BroadcastChannel로 결과 코드만 알리고 창을 닫는다. 기관이 페이지 이동으로 처리하면(모바일·일부 브라우저) 복귀 화면에 진행 표시만 보이고 결과를 받으면 next로 돌아가 그 화면이 결과 대화상자를 띄운다. next는 같은 출처 상대 경로만 받는다(추천 적용 2026-10-14, ADR-0063). 만 14세 확인·중복 연계정보는 결과 경로에서 판정한다"
      security: [{ fanCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { additionalProperties: false, type: object, required: [next], properties: { purpose: { type: string, enum: [FIRST, REVERIFY, MINOR_CONTRACT], default: FIRST, description: "목적 문구는 부르는 화면이 버튼 위 한 줄로 보인다. REVERIFY는 추가 검증(SCR-009)과, 로그인 판정이 CHALLENGE·UNKNOWN인 세션에서 재인증이 '요청만 함'인 양도 요청·환급·배상 계좌 입력(docs/features/identity.md §7 '로그인 판정의 처리', 추천 적용 2026-10-30), MINOR_CONTRACT는 미성년자 계약 취소 확인(목적 동의 뒤). 부스 대조는 POST /v1/identity/booth-reverifications로 시작한다" }, next: { type: string, pattern: '^(?!.*%(?:2[fF]%2[fF]|5[cC]))/(?!/)[^\\\u0000-\u001f\u007f]*$', maxLength: 512, description: "결과를 보인 뒤 돌아갈 같은 출처 상대 경로. docs/frontend.md §5.14.3 safeNext()와 같은 규칙이다: 512자 이하, /로 시작, //·/\\로 시작하지 않음, 제어 문자·백슬래시·%2f%2f·%5c(대소문자 무시) 없음(FE-T12). 서버도 이 규칙으로 거절한다(ASVS 3.7.2)" } } } } } }
      responses: { '201': { description: 기관 창 값(본인확인 건을 만든다), content: { application/json: { schema: { $ref: '#/components/schemas/VerificationStart' } } } }, '400': { $ref: '#/components/responses/Problem', description: "next가 같은 출처 상대 경로가 아님(next-invalid), 아직 받지 않는 목적(purpose-not-supported: MINOR_CONTRACT는 그 단계 전까지, 추천 적용 2026-11-03)" }, '409': { $ref: '#/components/responses/Problem', description: "already-verified: FIRST인데 이 계정은 이미 본인확인함" }, '503': { $ref: '#/components/responses/ServiceUnavailable', description: "provider-down: 본인확인기관을 쓸 수 없음(계약 전 운영 쪽 환경, 기관 장애). 이미 본인확인한 계정은 영향 없음(docs/features/identity.md §5·§10, 추천 적용 2026-11-03)" } }
  /v1/identity/verifications/{verificationId}/result:
    post:
      operationId: createIdentityVerificationResult
      tags: [identity]
      x-peaket-roles: [fan]
      summary: "본인확인 결과 확정(복귀 화면이 기관이 돌려준 값을 넘김)"
      description: "FR-002, POL-001(소유자 결정 2026-10-14, ADR-0063). 기관이 복귀 주소로 돌려준 결과 값(기관 형식, 불투명)을 본문으로 받는다. identity-svc가 기관 규격대로 복호·조회해 확인하고 이 계정·시작 요청에 묶인 건인지 본다. 완료 시 ci_hmac 저장, ticket:buy·pid 부여. 같은 연계정보가 다른 계정에 있으면 409. 완료 결과의 생년월일로 만 나이를 계산해 만 14세 미만이면 연계정보 HMAC을 저장하지 않고 403 under-14로 답하며 계정을 회원 탈퇴와 같은 절차로 정리한다(사유 UNDER_14, 재인증 없음). 생년월일은 계산에만 쓰고 저장·로그하지 않는다(POL-023, 추천 적용 2026-10-14, ADR-0062). 기관 값은 POST 본문으로만 받고 URL에 두지 않는다(guidelines §9). 쿼리로만 돌려주는 기관이면 복귀 화면이 받자마자 주소에서 지운다(기관 규격 확인 필요). 한 번 확정된 건을 다시 보내면 같은 결과를 돌려준다"
      security: [{ fanCookie: [] }]
      parameters: [{ name: verificationId, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { additionalProperties: false, type: object, required: [providerResult], properties: { providerResult: { type: object, additionalProperties: { type: string }, description: "기관이 돌려준 값 그대로(기관별)" } } } } } }
      responses: { '200': { description: "VERIFIED·CANCELLED(창을 닫음)·FAILED", content: { application/json: { schema: { $ref: '#/components/schemas/VerificationResult' } } } }, '403': { $ref: '#/components/responses/Problem', description: "under-14: 본인확인 결과 만 14세 미만(결과 미저장, 계정 정리 시작)" }, '404': { $ref: '#/components/responses/Problem', description: "없음·만료·다른 계정의 시작 요청(verification-not-found)" }, '409': { $ref: '#/components/responses/Problem', description: "이미 다른 계정에서 확인(DUPLICATE_ACCOUNT), 부스 대조 목적이면 티켓 보유 계정과 다른 사람(BOOTH_MISMATCH)" }, '503': { $ref: '#/components/responses/ServiceUnavailable', description: "기관 장애(PROVIDER_DOWN). 이미 본인확인한 계정은 영향 없음" } }
    get:
      operationId: getIdentityVerificationResult
      tags: [identity]
      x-peaket-roles: [fan]
      summary: "본인확인 결과 조회(부르는 화면이 결과 대화상자를 띄울 때)"
      description: "FR-002(추천 적용 2026-10-14, ADR-0063). 팝업 메시지가 오지 않았거나(창이 막힘·닫힘) 페이지 이동으로 next에 돌아왔을 때 부른다. 기관 창이 아직 열려 있으면 PENDING. 개인정보는 싣지 않는다. Cache-Control: no-store"
      security: [{ fanCookie: [] }]
      parameters: [{ name: verificationId, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: 결과, content: { application/json: { schema: { $ref: '#/components/schemas/VerificationResult' } } } }, '404': { $ref: '#/components/responses/Problem', description: "없음·만료·다른 계정(verification-not-found)" } }
  /v1/identity/access-tokens:
    post:
      operationId: createIdentityAccessToken
      tags: [identity]
      x-peaket-roles: [fan]
      summary: 액세스 토큰 갱신(리프레시 토큰 쿠키, 회전·재사용 탐지)
      description: "ADR-0011, POL-019. 재사용 탐지 시 패밀리 전체 폐기 + 세션 종료 이벤트. 다만 바로 앞 리프레시 토큰이 회전 뒤 30초 [가정] 안에 다시 오고 그때 준 새 토큰이 아직 쓰이지 않았으면 응답을 잃은 재시도로 보고 새 쿠키를 한 번 더 준다(docs/features/identity.md §3, 추천 적용 2026-10-28, 기술 검토 중간-053). 본문이 없어 사전 요청이 생기지 않으므로 gw-fan이 Origin을 확인한다(docs/security/asvs/auth.md 3.5.1)"
      security: [{ refreshCookie: [] }]
      responses: { '204': { description: "새 쿠키(__Secure-peaket_at, __Secure-peaket_rt). 본문에 토큰 없음" }, '401': { $ref: '#/components/responses/Unauthorized', description: "재사용 탐지·만료. 오류 이름은 refresh-token-invalid이고, 쿠키의 토큰이 끝난 세션의 것이면 끝난 까닭 ended(Problem 확장 칸)를 싣는다. 화면은 그 값으로 로그인 화면의 ?ended=로 보낸다(docs/frontend.md §3 '세션이 끝났을 때', 추천 적용 2026-11-09, ADR-0235)" } }
  /v1/identity/sessions:
    get: { operationId: getIdentitySessions, tags: [identity], x-peaket-roles: [fan], summary: "로그인한 기기 목록(기기마다 한 줄: 화면용 기기 이름, 마지막 활동, 지금 이 기기)", description: "FR-017, POL-019(추천 적용 2026-11-05, ADR-0209, BUILD_ORDER BOT-044). 이 계정의 살아 있는 세션을 기기 행으로 묶어 기기마다 한 줄을 준다. 기기 행이 없는 세션은 혼자 한 줄이다. 기기 한도(5대)와 같은 묶음이라 나누지 않는다(guidelines §3). 지금 이 기기가 맨 앞이고 나머지는 마지막 활동이 늦은 순이다. 부른 세션이 이미 끝났으면 401이다. Cache-Control: no-store", security: [{ fanCookie: [] }], responses: { '200': { description: 목록, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, maxItems: 5, items: { $ref: '#/components/schemas/FanDeviceSession' } } } } } } }, '401': { $ref: '#/components/responses/Unauthorized', description: "세션 없음·만료·끝남" } } }
  /v1/identity/sessions/{sessionId}:
