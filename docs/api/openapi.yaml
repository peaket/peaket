)" }, '409': { $ref: '#/components/responses/Problem', description: "fraud-summary-not-viewed(FRAUD_ACTION을 그 승인자가 상세를 열지 않고 승인)" }, '422': { $ref: '#/components/responses/Problem', description: "approval-reason-required(FRAUD_ACTION인데 reason 없음), approval-scope-invalid(요청 범위 밖 계정·표, 다 뺌, FRAUD_ACTION이 아닌데 범위 칸을 보냄)" } } }
