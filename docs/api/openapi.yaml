      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/PaymentAccept' } } } }
      responses: { '404': { $ref: '#/components/responses/Problem', description: "주소의 주문이 이 구매 세션에서 만든 주문이 아니다(남의 주문, 다른 회차·다른 구매 세션의 주문, 없는 주문을 가리지 않고 같은 404, guidelines §12 '개인·거래 기록', 추천 적용 2026-10-30, docs/features/seat-hold.md §2)" }, '202': { description: 접수됨 }, '415': { $ref: '#/components/responses/Problem', description: "application/json이 아닌 본문" }, '401': { $ref: '#/components/responses/Unauthorized', description: "팬 쿠키 없음·만료(about:blank, 화면은 토큰을 한 번 갱신한다), 입장 토큰 없음·만료이거나 구매 세션이 없거나 끝남(purchase-session-ended), 구매 세션 요청 서명 머리 없음·형식·불일치(purchase-signature-invalid), 일련번호 재사용(purchase-seq-reused). 어느 머리가 틀렸는지는 싣지 않는다. 화면 처리는 docs/frontend.md §4.1 '401'(BAS-040)" }, '400': { $ref: '#/components/responses/Problem', description: 금액 불일치·허용 밖 필드 }, '409': { $ref: '#/components/responses/Problem', description: "활성 결제 시도와 결제사·paymentId 불일치, 또는 같은 주문을 다른 탭·기기에서 이미 접수함(payment §4.2 2번), 결제하지 않아 만료된 주문(order-expired, 결제사 승인을 부르지 않는다, ADR-0107)" }, '423': { $ref: '#/components/responses/Problem', description: "판매 일시정지(명령 3)" }, '429': { $ref: '#/components/responses/TooManyRequests', description: "게이트웨이 로컬 한도 초과, 또는 purchase-svc 파드의 자기 과부하(server-busy, docs/architecture.md §5)" }, '503': { $ref: '#/components/responses/ServiceUnavailable', description: "좌석 Redis 장애 조치 중이거나 그 회차 좌석 저장소가 준비되지 않음(Problem type seat-store-unavailable, Retry-After 2초 [가정], ADR-0121)" } }
  /v1/orders/{orderId}/payment-status:
    get:
      operationId: getOrderPaymentStatus
      tags: [orders]
      x-peaket-roles: [fan]
      summary: 결제 결과 long polling(최대 25초 [가정] 대기, 추천 적용 2026-10-28, 기술 검토 중간-047)
      description: "FR-011, NFR-006 확정 p99 3초(Degraded 60초). UNKNOWN은 조회 API로 확정 후 알림. 서버는 결과가 정해지면 바로, 아니면 25초 [가정]에 그때의 상태로 답한다. api 배포의 CloudFront 원본 응답 시간 초과(기본 30초)보다 짧게 두어, CloudFront가 같은 GET을 원본에 다시 보내지 않게 한다. gw-fan 경로 시간 초과 27초 [가정], 브라우저 시간 초과 30초 [가정](docs/infra.md §4.1). 처음 상한 30초는 추천 적용 2026-10-09"
      security: [{ fanCookie: [] }]
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: 상태, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentStatus' } } } } }
  /v1/tickets:
    get:
      operationId: listTickets
      tags: [tickets]
      x-peaket-roles: [fan]
      summary: 마이 티켓 목록(월렛)
      description: "FR-012. 목록은 커서로 나눈다(guidelines §3). 월렛의 기기 저장은 nextCursor가 없을 때까지 받는다(추천 적용 2026-10-21, ADR-0081)"
      security: [{ fanCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { description: 티켓 한 페이지, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Ticket' } }, nextCursor: { type: [string, 'null'] } } } } } } }
  /v1/tickets/{ticketId}/device-keys:
    post:
      operationId: createTicketDeviceKey
      tags: [tickets]
      x-peaket-roles: [fan]
      summary: 기기 공개키 등록(입장용 휴대폰 등록·재발급·부스). 이전 키 폐기
      description: "FR-012, POL-018, ADR-0025, ADR-0050 결정 2, ADR-0051 결정 10·11. ISSUE는 월렛의 '이 휴대폰을 입장용으로 등록'에서만 부르고, 입장 시작 뒤 ISSUE는 재인증 토큰이 있어야 하며 계정 이메일로 알린다. REISSUE는 입장 시작 전에만, 소셜 제공자 재인증 토큰이 있어야 하고 티켓당 24시간에 1회까지다. 재발급하면 계정 이메일과 이전 기기에 알린다. 입장 시작 뒤 REISSUE는 403이고 BOOTH만 된다. BOOTH는 그 티켓의 부스 허용(POST /v1/scanner/booth-authorizations)이 있고 허용 뒤 10분 안일 때만 된다. TRANSFER는 양도 수락·돌려주기·양도 회수로 보유자가 바뀐 뒤 새 보유자가 같은 버튼으로 처음 등록할 때이고 ISSUE와 같은 규칙을 따른다(키는 등록 버튼으로만 만든다). 등록·폐기는 scanner_change에 남는다. 응답에 keyId(SPKI SHA-256 앞 8바이트)를 준다"
      security: [{ fanCookie: [] }]
      parameters: [{ name: ticketId, in: path, required: true, schema: { type: string } }, { name: X-Reauth-Token, in: header, required: false, description: "REISSUE와 입장 시작 뒤 ISSUE일 때 필수(guidelines §7)", schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { additionalProperties: false, type: object, required: [publicKeyJwk, reason], properties: { publicKeyJwk: { type: object, additionalProperties: false, required: [kty, crv, x, y], description: "기기 공개키(P-256, RFC 7517 JWK). 브라우저 crypto.subtle.exportKey('jwk')가 내는 칸(ext·key_ops)까지만 받고, 개인키 칸(d)이 섞이면 정의 밖 칸이라 400이다(BAS-040)", properties: { kty: { type: string, enum: [EC] }, crv: { type: string, enum: [P-256] }, x: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }, y: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }, ext: { type: boolean }, key_ops: { type: array, maxItems: 2, items: { type: string, enum: [verify] } }, alg: { type: string, enum: [ES256] } } }, reason: { type: string, enum: [ISSUE, REISSUE, TRANSFER, BOOTH] }, boothRequestId: { type: string, description: "BOOTH일 때 필수" } } } } } }
      responses: { '201': { description: "등록됨(keyId)" }, '403': { $ref: '#/components/responses/Problem', description: "입장 시작 뒤 온라인 재발급(현장 부스 안내)·재인증 없음·부스 허용 없음 또는 10분 지남" }, '429': { $ref: '#/components/responses/TooManyRequests', description: "24시간 재발급 한도 초과(고객센터 안내)" } }
  /v1/tickets/{ticketId}/booth-requests:
    post: { operationId: createTicketBoothRequest, tags: [tickets], x-peaket-roles: [fan], summary: "부스 재발급 요청(입장 시작 뒤, 보유자). 부스 본인확인 대조 결과로 부스 코드(8자, 10분)를 받는다", description: "FR-066, ADR-0051 결정 11. reverificationToken은 POST /v1/identity/booth-reverifications 결과(ci_hmac 일치)다. 티켓당 하루 3회 [가정]", security: [{ fanCookie: [] }], parameters: [{ name: ticketId, in: path, required: true, schema: { type: string } }], requestBody: { content: { application/json: { schema: { additionalProperties: false, type: object, required: [reverificationToken], properties: { reverificationToken: { type: string } } } } } }, responses: { '201': { description: "부스 요청(boothRequestId, 부스 코드 QR 문자열, 만료 시각)" }, '409': { $ref: '#/components/responses/Problem', description: "입장 시작 전(온라인 재발급 안내)·대조 불일치" }, '429': { $ref: '#/components/responses/TooManyRequests', description: "하루 요청 한도 초과" } } }
  /v1/identity/booth-reverifications:
    post: { operationId: createIdentityBoothReverification, tags: [identity], x-peaket-roles: [fan], summary: "부스 재발급용 본인확인 대조 시작(대조 목적 별도 동의 필수)", description: "FR-066, ADR-0051, 정보통신망법 §23의5④ 단서. 본인확인기관 결과의 ci_hmac을 보유 계정 값과 비교해 같으면 reverificationToken(5분, 계정·티켓에 묶임)을 준다. 연계정보 원문은 저장하지 않는다", security: [{ fanCookie: [] }], requestBody: { content: { application/json: { schema: { additionalProperties: false, type: object, required: [ticketId, consent], properties: { ticketId: { type: string }, consent: { type: boolean, description: "대조 목적 동의(true만 허용)" } } } } } }, responses: { '201': { description: "본인확인기관 창 값(VerificationStart, purpose BOOTH. 본인확인 건을 만든다). 결과는 POST /v1/identity/verifications/{verificationId}/result로 확정하고 대조가 일치하면 resultToken(reverificationToken), 다르면 409 BOOTH_MISMATCH다(ADR-0063)", content: { application/json: { schema: { $ref: '#/components/schemas/VerificationStart' } } } }, '409': { $ref: '#/components/responses/Problem', description: "보유 계정과 다른 사람(결과 경로에서 판정)" }, '422': { $ref: '#/components/responses/Problem', description: "동의 없음" } } }
  /v1/identity/minor-contract-checks:
    post: { operationId: createIdentityMinorContractCheck, tags: [identity], x-peaket-roles: [fan], summary: "미성년자 계약 취소 확인(확인 목적 동의 → 휴대폰 본인확인 → 연계정보 대조 → 결제 승인일의 만 나이 계산)", description: "전자상거래법 §13③, 민법 §5②, POL-038 ⑧, 추천 적용 2026-10-14, ADR-0062. 휴대폰 본인확인을 마친 계정만. verificationResultToken은 확인 목적(purpose MINOR_CONTRACT)으로 받은 본인확인 결과 경로의 resultToken이고(ADR-0063), 연계정보 HMAC이 계정 값과 같은지 대조한 뒤 결제 승인일(KST)의 만 나이를 계산한다. 생년월일·연계정보는 저장·로그하지 않고 결과만 CS 건(MINOR_CONTRACT_CANCEL)에 남긴다", security: [{ fanCookie: [] }], requestBody: { required: true, content: { application/json: { schema: { additionalProperties: false, type: object, required: [orderIds, consent, verificationResultToken], properties: { orderIds: { type: array, minItems: 1, items: { type: string } }, consent: { type: boolean, enum: [true], description: "확인 목적 동의(true만 허용)" }, verificationResultToken: { type: string } } } } } }, responses: { '200': { description: "확인 결과(생년월일 없음)", content: { application/json: { schema: { type: object, properties: { under19AtContract: { type: boolean } } } } } }, '403': { $ref: '#/components/responses/Problem', description: "identity-required: 휴대폰 본인확인 전 계정" }, '409': { $ref: '#/components/responses/Problem', description: "본인확인 결과가 계정의 연계정보와 다름" } } }
  /v1/tickets/{ticketId}/transfers:
    post:
      operationId: createTicketTransfer
      tags: [tickets]
      x-peaket-roles: [fan]
      x-peaket-trace-rare: true
      summary: "양도 요청(결제자인 보유자만, 본인확인 회원에게, 공연 2시간 전과 입장 시작 중 이른 때까지, 제공자 재인증 후). 받는 사람이 수락해야 넘어간다"
      description: "FR-013, POL-017, ADR-0046. 행 잠금 + 버전으로 이중 양도 방지. 받은 티켓의 재양도는 409"
      security: [{ fanCookie: [] }]
      parameters: [{ name: ticketId, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/ReauthToken' }]
      requestBody: { content: { application/json: { schema: { additionalProperties: false, type: object, required: [recipientRef], properties: { recipientRef: { type: string, description: "POST /v1/transfer-recipient-lookups 결과" } } } } } }
