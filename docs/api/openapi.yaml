    post: { operationId: createOpsReviewModeration, tags: [ops], x-peaket-roles: [cs_agent], summary: "신고된 후기 처리(조치 없음·임시조치·노출 차단·해제, 사유 필수)", description: "FR-070, POL-044, POL-042, 추천 적용 2026-10-19, ADR-0066. CS 담당자(cs_agent)가 태블릿·데스크톱 관제 콘솔에서 부른다(휴대폰은 보기만, docs/design/d5 §3.9, docs/planning/03 §3). NO_ACTION은 조치 없음, TEMP_BLOCK은 임시조치(endsAt 필수, 지금부터 30일 이내, 정보통신망법 §44의2④·§44의3), BLOCK은 운영정책 위반 노출 차단, RELEASE는 가린 후기를 다시 보이게 한다(불법 촬영물 신고로 가린 후기를 확인한 뒤 되돌릴 때 포함). ops-svc가 권한·사유·감사 로그를 처리한 뒤 core-svc review 모듈 내부 API로 반영하고 그 후기의 신고를 처리 완료로 바꾼다. 결과는 신고자에게 알리고(처리함·해당 없음), 임시조치·노출 차단은 글쓴이에게 조치 사실과 사유 종류(violation)만 알리며 신고자를 밝히지 않는다. 후기 자리에는 '권리 침해 신고로 임시조치된 후기입니다(끝 날짜까지)'·'운영정책에 따라 가려진 후기입니다'를 보인다(§44의2② 후단 공시). 불법 촬영물인지 판단하기 어려우면 방송미디어통신심의위원회에 심의를 요청할 수 있다(전기통신사업법 시행령 §30의5③). 법정 통보에 따른 노출 차단은 이 경로가 아니라 POST /v1/ops/compliance/notices/{noticeId}/takedown이다. 같은 조치를 다시 보내면 지금 상태를 그대로 돌려준다", security: [{ opsCookie: [] }], parameters: [{ name: reviewId, in: path, required: true, schema: { type: string } }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewModeration' } } } }, responses: { '200': { description: "반영(후기 상태, 공시 표시, 끝 시각)" }, '403': { $ref: '#/components/responses/Problem', description: "CS 담당자가 아님" }, '404': { $ref: '#/components/responses/Problem', description: "없는 후기" }, '409': { $ref: '#/components/responses/Problem', description: "신고가 없는 후기, 통보·같은 내용으로 숨긴 후기(법정 통보 경로로만 바꾼다), 가리지 않은 후기의 해제" }, '422': { $ref: '#/components/responses/Problem', description: "사유 없음, TEMP_BLOCK·BLOCK의 violation 없음, TEMP_BLOCK의 endsAt 없음·30일 초과" } } }
