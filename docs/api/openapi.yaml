      description: "FR-059, FR-061, POL-038, SCR-042, docs/design/d5 §5.24·§1.6 18번. 소명한 계정만 읽는다. 남의 소명과 없는 소명은 같은 404다(authz-matrix §3.2). FRAUD_CASE의 사유 범주·기한·잠금·조치 결과는 이 응답에 없고 화면이 GET /v1/fraud-appeal-requests를 읽는다. RECLAIM의 사유 범주와 기한은 support에 사본이 없어 null이다 [가정](d5 §1.6 18번의 남은 질문, 사본을 둘지는 소유자 판단). Cache-Control: private, no-store"
      parameters:
        - { name: appealId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 소명, content: { application/json: { schema: { $ref: '#/components/schemas/Appeal' } } } }
        '401': { $ref: '#/components/responses/Unauthorized', description: "로그인 필요" }
        '404': { $ref: '#/components/responses/Problem', description: "없는 소명이거나 이 계정의 소명이 아니다(같은 404, not-found)" }
  /v1/compensations:
