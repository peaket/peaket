openapi: 3.1.0
info:
  title: PEAKET Public API
  version: 1.0.0-draft
  description: |
    독자와 용도: 프론트엔드·파트너·스캐너 개발자가 REST 계약을 확인할 때 읽는다. 이 파일이 원본 계약이다(`peaket` 저장소의 docs/api/). 계약에서 만든 코드(`packages/contracts`)는 패키지로 게시하지 않고 같은 저장소 안에서 `workspace:` 프로토콜로 가져다 쓴다(ADR-0165).
    원문 출처: 설계서 §6(대기열, 입장 흐름, 좌석, 결제, 굿즈, 관제, 오프라인, 계정·인증), 5장 라우트, 18장 REST, 24장 Webhook. 엔드포인트 경로·스키마는 [보완]이고 docs/planning/02 FR을 description에 적는다.
    기준 기획 버전: v1.0.
    규칙: docs/api/guidelines.md. 오류는 RFC 9457 Problem(오류 식별자는 type URI, guidelines §2). Idempotency-Key는 IdempotencyKey 파라미터가 붙은 쓰기 작업에 필수이고, 키 범위·다른 본문 422·처리 중 409·보관 기간은 guidelines §4다. 재인증이 필요한 작업은 X-Reauth-Token 헤더(guidelines §7). 목록은 cursor·limit·nextCursor(guidelines §3). 경로 이름·검색·부분 응답·메서드와 상태 코드는 guidelines §10~§12(ADR-0081). 4xx·5xx 응답은 모두 Problem 본문이고(기기 승인 토큰 엔드포인트의 400은 OAuth 오류이고, 대기열 파일 배포의 정적 파일 404는 본문을 약속하지 않는다), 401은 WWW-Authenticate, 429·503은 Retry-After를 싣는다.
servers:
  - url: https://queue.peaket.example
    description: gw-queue (로비·대기열·입장 확정). 대기열 API 배포(CloudFront). 대기 상태·셔플 결과 파일은 queue-files 호스트(대기열 파일 배포, ADR-0058). 게이트웨이마다 호스트를 따로 둔다(추천 적용 2026-10-09, R-11). 교차 출처 응답은 Access-Control-Allow-Origin https://www.peaket.example에 Allow-Credentials true, Vary Origin, Expose-Headers Retry-After·Date·X-Trace-Id를 낸다(추천 적용 2026-10-15, ADR-0065 결정 7. Date는 브라우저 시계 보정, 추천 적용 2026-10-21, ADR-0079 결정 3. X-Trace-Id는 기술 검토 낮음-023. 전체 규칙은 guidelines §9 'CORS 응답 헤더')
  - url: https://queue-files.peaket.example
    description: 대기열 파일 배포(CloudFront, 인증·쿠키 없음). 대기 상태 파일, 셔플 결과 파일, 묶음 결과 파일. 원본 gw-queue, 대체 원본 S3(ADR-0058). 소비자 웹 스크립트가 읽도록 이 배포와 S3 대체 원본은 Access-Control-Allow-Origin https://www.peaket.example과 Access-Control-Expose-Headers Retry-After를 내고 Credentials는 두지 않는다(추천 적용 2026-10-15, ADR-0065 결정 7). CDN이 캐시한 응답의 Date는 원본이 만든 시각 그대로라 노출하지 않는다(ADR-0110, 기술 검토 중간-036). Retry-After는 503의 재시도 하한으로만 쓰고, 폴링 힌트는 대기 상태 파일 본문의 pollHintMs다(기술 검토 중간-032)
  - url: https://api.peaket.example
    description: gw-fan. 교차 출처 응답은 Access-Control-Expose-Headers에 Date를 더해 브라우저가 서버 시각을 읽게 한다(추천 적용 2026-10-21, ADR-0079 결정 3). X-Trace-Id·ETag도 노출하고, 사전 요청 응답의 Access-Control-Allow-Headers에 If-Match를 더한다(기술 검토 낮음-023·030, 전체 규칙은 guidelines §9 'CORS 응답 헤더')
  - url: https://partner-api.peaket.example
    description: "gw-partner (외부 PG 웹훅 수신 포함). CloudFront partner 배포의 대체 도메인이다(ADR-0144 결정 3). 교차 출처 응답은 Access-Control-Allow-Origin https://partner.peaket.example, Expose-Headers X-Trace-Id·ETag를 내고 사전 요청에 If-Match를 허용한다(guidelines §9 'CORS 응답 헤더', 기술 검토 낮음-023·030)"
  - url: https://ops-api.peaket.example
    description: "gw-ops. 경로는 CloudFront 관제(console) 배포 → 관제 원본 NLB → gw-ops다. 관제 배포 웹 ACL의 맨 앞 규칙이 시청자 IP를 허용 목록(사내망·VPN 출구 IP)으로 거르고, gw-ops가 원본 확인 헤더와 CloudFront-Viewer-Address로 허용 IP를 한 번 더 본다. VPN으로만 닿는 내부 로드 밸런서는 관리 도구(Grafana·ArgoCD·Alertmanager)용이고 이 경로가 아니다(추천 적용 2026-10-29, ADR-0144 결정 2). 교차 출처 응답은 Access-Control-Allow-Origin https://console.peaket.example, Expose-Headers X-Trace-Id·ETag를 내고 사전 요청에 If-Match를 허용한다(guidelines §9 'CORS 응답 헤더')"
  - url: https://scanner-api.peaket.example
    description: "gw-scanner (CloudFront 미경유). 기기 자격의 기본안은 기기 키 DPoP다(RFC 9449, 추천 적용 2026-10-28, 기술 검토 중간-057): 모든 스캐너 요청에 DPoP 헤더의 증명을 싣고, 스태프 토큰은 Authorization: DPoP로 보낸다. 기기 등록 경로(POST /v1/scanner/device-enrollments)는 기기 자격 전이라 등록 코드와 DPoP로 받는다(추천 적용 2026-10-14, ADR-0062). 브라우저 요청은 자격 증명 없이(credentials omit) 오고, 사전 요청에 Access-Control-Allow-Headers Authorization·DPoP·Content-Type을 낸다. 교차 출처 응답은 Access-Control-Expose-Headers에 Date(스캐너 시계 보정, ADR-0079 결정 3)와 WWW-Authenticate, X-Trace-Id·ETag를 더하고, 사전 요청에 If-Match도 허용한다(guidelines §9 'CORS 응답 헤더', 기술 검토 낮음-023·030). 하드웨어 키가 필요한 운영 환경의 선택지 mTLS(deviceMtls)는 클라이언트 인증서를 VerifyIfGiven으로 받고 OPTIONS를 뺀 경로에서 검증된 인증서를 요구한다(docs/features/offline-gate.md §6.1)"
security:
  - fanCookie: []
x-peaket-gateways:
  description: "경로마다 어느 게이트웨이(호스트)가 받는지 정하는 규칙(추천 적용 2026-10-28, 기술 검토 낮음-031). 위에서부터 처음 맞는 접두사의 서버이고, 경로에 servers가 있으면 그것이 이긴다(정적 파일·소비자 웹 앱 서버 경로). 태그는 화면 묶음이라 게이트웨이와 일대일이 아니어서 태그 대신 경로 접두사로 정한다. 게이트웨이 라우트 생성(docs/devops.md §3.1 gitops-check)과 doc-check api 검사가 이 표를 읽는다. 전역 security(팬 쿠키)는 security를 적지 않은 작업의 기본값이고, 인증 없는 작업은 security: []로 적는다(guidelines §12)"
  rules:
    - { prefix: /v1/ops/, server: 'https://ops-api.peaket.example' }
    - { prefix: /v1/partner/, server: 'https://partner-api.peaket.example' }
    - { prefix: /v1/webhooks/, server: 'https://partner-api.peaket.example' }
    - { prefix: /v1/scanner/, server: 'https://scanner-api.peaket.example' }
    - { prefix: /v1/queues/, server: 'https://queue.peaket.example' }
    - { prefix: /v1/, server: 'https://api.peaket.example' }
x-peaket-problem-types:
  description: "이름 붙은 오류(RFC 9457 Problem의 type)의 목록이다(guidelines §2, 추천 적용 2026-11-05, BUILD_ORDER BAS-040). type URI는 base 뒤에 이름을 붙인 것이고, 한 이름은 언제나 같은 status와 title로 낸다(title은 번역만 달라진다, RFC 9457 §3.1.3). 응답 설명에 적는 오류 이름과 서비스 코드가 내는 type은 이 목록에 있어야 한다(문서 점검 api 검사, packages/platform/test/problem-types.test.ts). 이름이 없는 오류는 type about:blank와 HTTP 상태 문구를 낸다. 화면은 이 목록에서 만든 @peaket/api-client의 표로 문구 키를 고른다(docs/frontend.md §5.12)"
  base: 'https://peaket.example/problems/'
  types:
    admin-account-locked: { status: 423, title: "계정이 잠겼습니다" }
    admin-account-state-conflict: { status: 409, title: "지금 계정 상태에서는 할 수 없습니다" }
    admin-email-in-use: { status: 409, title: "이미 쓰는 이메일입니다" }
    admin-login-busy: { status: 429, title: "잠시 뒤 다시 시도해 주세요" }
    admin-login-code-invalid: { status: 401, title: "인증 앱 코드가 맞지 않습니다" }
    admin-login-failed: { status: 401, title: "이메일이나 비밀번호가 맞지 않습니다" }
    admin-login-step-invalid: { status: 401, title: "처음부터 다시 로그인해 주세요" }
    admin-login-unavailable: { status: 503, title: "잠시 뒤 다시 시도해 주세요" }
    admin-role-not-allowed: { status: 403, title: "이 역할로는 초대할 수 없습니다" }
    admission-token-invalid: { status: 401, title: "입장 확인이 끝났습니다" }
    already-admitted: { status: 409, title: "이 회차에 이미 입장했습니다" }
    already-reported: { status: 409, title: "이미 신고한 후기입니다" }
    already-verified: { status: 409, title: "이미 본인확인을 마친 계정입니다" }
    already-waiting: { status: 409, title: "이미 다른 곳에서 대기 중입니다" }
    approval-reason-required: { status: 422, title: "승인 사유를 적어 주세요" }
    approval-scope-invalid: { status: 422, title: "요청 범위 밖의 대상입니다" }
    artist-exists: { status: 409, title: "같은 이름의 아티스트가 있습니다" }
    authz-unavailable: { status: 503, title: "권한을 확인하지 못했습니다" }
    auto-assign-not-supported: { status: 400, title: "좌석 자동 배정은 아직 받지 않습니다" }
    batching: { status: 503, title: "순서를 정하는 중입니다. 잠시 뒤 다시 시도해 주세요" }
