ents/responses/Problem', description: "reauth-required(재인증 없음·만료·재사용·패스키 요소 없음), admin-role-not-allowed(부른 역할이 그 역할을 초대할 수 없음)" }, '409': { $ref: '#/components/responses/Problem', description: "admin-email-in-use" }, '422': { $ref: '#/components/responses/Problem', description: "promoter-mismatch, unknown-promoter, first-partner-account-must-be-admin" } } }
