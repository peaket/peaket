          additionalProperties: false
          properties:
            metric: {type: string}
            target: {type: string}
            checkAfterEvents: {type: integer}
        revertCondition: {type: string, maxLength: 4000}
        ref: {type: string, description: ADR·POL 번호나 설정 변경 ID}
    AdminUnlockCreate:
      type: object
      additionalProperties: false
      description: "관리 계정 시간 잠금 본인 해제 본문(POST /v1/partner/auth/unlocks·/v1/ops/auth/unlocks). 해제 링크 토큰은 링크의 URL 조각(#)에만 있고, 화면이 읽자마자 주소에서 지운 뒤 이 본문으로 보낸다(guidelines §9, docs/features/identity.md §6.1 'URL 조각의 비밀 처리'와 같다). 정본은 docs/security/auth-controls.md §3.3(추천 적용 2026-10-30, ADR-0157 결정 6)"
      required: [unlockToken, code]
      properties:
        unlockToken: { type: string, pattern: '^[A-Za-z0-9_-]{43}$', description: "해제 링크 토큰(32바이트 난수의 채움 없는 base64url). 서버는 SHA-256 해시만 저장하고 수명은 30분 [가정]이다" }
        code: { type: string, minLength: 6, maxLength: 64, description: "인증 앱 코드(TOTP 6자리)나 복구 코드" }
