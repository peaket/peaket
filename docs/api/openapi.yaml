      description: "FR-027, POL-023, SCR-027, docs/planning/03 §3, authz-matrix §4.1, docs/design/d5 §1.6 16번. 파트너 관리자만 부른다. 소속 파트너의 회차만 보여 준다. 항목은 예매자 이름·휴대폰 번호·예매번호·회차·좌석·매수뿐이고, 이름은 가운데 글자, 휴대폰은 가운데 네 자리를 가린다(김*민, 010-****-1234, SCR-027). [가정] 두 글자 이름은 끝 글자를 가린다. 원문은 POST …/attendee-exports(사유·패스키 재인증)로만 받는다. 조회도 개인정보 접속기록에 남긴다(FR-064). 회차 종료 1개월 뒤 닫는다(연기 회차는 바뀐 회차 기준). [가정] 예매번호는 주문 ID이고, 대상은 환불되지 않은 표가 남은 확정 주문이며, 합계 칸은 필터와 상관없는 그 회차 전체다. 커서 페이징. Cache-Control: no-store"
      security:
