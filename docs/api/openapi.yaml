          items: { $ref: '#/components/schemas/OpsFanQueueEntry' }
        nextCursor: { type: [string, 'null'] }

    OpsBotReview:
      type: object
      description: "회차의 봇 표본 검토 진행(SCR-067). 목표 건수는 [가정]"
      properties:
        eventId: { type: string }
        reviewKind: { type: string, enum: [PASSED_SAMPLE, HUMAN_BASELINE], description: "통과 세션 표본(FR-049)·출시 뒤 실제 사람 기준 표본(ADR-0174)" }
        reviewedCount: { type: integer }
        targetCount: { type: integer, description: "표본 200건 [가정], HUMAN_BASELINE은 두 묶음 합 400건 [가정]" }
        deadlineAt: { type: string, format: date-time, description: "행동 신호 삭제 전(오픈 + 30일)" }
        r2DueAt: { type: [string, 'null'], format: date-time, description: "R2 마감(오픈 7일 뒤)" }
        interim:
          type: [object, 'null']
          description: "중간 결과(잠정). HUMAN_BASELINE은 null"
          properties:
            missedBotRate: { type: number, description: "놓친 봇 비율 추정" }
            ci95Low: { type: number }
            ci95High: { type: number }
    OpsBotReviewSample:
      type: object
      description: "검토할 세션 표본. 개인 식별 정보와 판정 가중치가 없다(POL-006)"
      properties:
        sampleId: { type: string }
        sessionRef: { type: string, description: "가명 세션 ID" }
        status: { type: string, enum: [PENDING, RECORDED] }
        riskBand: { type: [string, 'null'], description: "위험 점수 범주. HUMAN_BASELINE은 null" }
        behaviorSummaryBand: { type: [string, 'null'], description: "행동 신호 요약 범주. HUMAN_BASELINE은 null" }
        timeline:
          type: array
          description: "진입 → 홀드 → 결제"
          items:
            type: object
            properties:
              step: { type: string, enum: [ENTRY, HOLD, PAYMENT] }
              at: { type: string, format: date-time }
        evidenceAvailable:
          type: array
          description: "행동 요약 밖의 근거 가운데 있는 것만"
          items: { type: string, enum: [CONFIRMED_SIGNAL, SHARED_DEVICE_OR_PAYMENT, POST_LABEL, VERIFICATION_FAILED] }
    OpsBotReviewSamplePage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/OpsBotReviewSample' }
        nextCursor: { type: [string, 'null'] }
    OpsBotReviewJudgementCreate:
      type: object
      additionalProperties: false
      required: [verdict]
      description: "표본 판정 기록 본문. 메모 칸은 두지 않는다(POL-006)"
      properties:
        verdict: { type: string, enum: [HUMAN, BOT, UNDECIDED] }
        evidenceKinds:
          type: array
          maxItems: 5
          uniqueItems: true
          items: { type: string, enum: [CONFIRMED_SIGNAL, SHARED_DEVICE_OR_PAYMENT, POST_LABEL, VERIFICATION_FAILED, OTHER] }
          description: "HUMAN_BASELINE의 BOT이면 하나 이상 필수"
    OpsBotReviewJudgement:
      type: object
      properties:
        sampleId: { type: string }
        verdict: { type: string, enum: [HUMAN, BOT, UNDECIDED] }
        recordedAt: { type: string, format: date-time }

    NoticeTemplateTextsInput:
      type: object
      additionalProperties: false
      description: "언어별 문구. 언어마다 120자 [가정](NFC 기준). 네 언어가 모두 있어야 승인한다"
      properties:
        ko: { type: string, minLength: 1, maxLength: 120 }
        en: { type: string, minLength: 1, maxLength: 120 }
        ja: { type: string, minLength: 1, maxLength: 120 }
        zh: { type: string, minLength: 1, maxLength: 120 }
    NoticeTemplateCreate:
      type: object
      additionalProperties: false
      required: [templateId, title, texts]
      properties:
        templateId: { type: string, pattern: '^[a-z][a-z0-9-]{2,39}$', description: "명령 7의 templateId(asyncapi LobbyBannerValue). 예 entry-delay. 만든 뒤 바꾸지 않는다" }
        title: { type: string, minLength: 1, maxLength: 60, description: "운영자용 제목. 60자 [가정]" }
        texts: { $ref: '#/components/schemas/NoticeTemplateTextsInput' }
    NoticeTemplateUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 60 }
        texts: { $ref: '#/components/schemas/NoticeTemplateTextsInput' }
    NoticeTemplate:
      type: object
      description: "대기실 공지 템플릿(POL-021 명령 7)"
      properties:
        templateId: { type: string }
        title: { type: string }
        texts:
          type: object
          properties:
            ko: { type: string }
            en: { type: string }
            ja: { type: string }
            zh: { type: string }
        status: { type: string, enum: [IN_REVIEW, APPROVED] }
        approvedBy:
          oneOf:
            - $ref: '#/components/schemas/OpsActor'
            - type: 'null'
        approvedAt: { type: [string, 'null'], format: date-time }
        lastUsedAt: { type: [string, 'null'], format: date-time }
        version: { type: integer, description: "판. 응답의 ETag와 같은 값이고 PATCH의 If-Match에 쓴다" }
    NoticeTemplatePage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/NoticeTemplate' }
        nextCursor: { type: [string, 'null'] }
    PartnerNoticeCreate:
      type: object
      additionalProperties: false
      required: [targetKind, phase, title, body, channels]
      description: "파트너 긴급 공지 본문(POL-022)"
      properties:
        targetKind: { type: string, enum: [ALL, EVENT], description: "전체 파트너·그 회차의 파트너" }
        eventId: { type: string, description: "EVENT면 필수" }
        phase: { type: string, enum: [OCCURRED, ONGOING, RESOLVED], description: "말머리 발생·진행·해결" }
        title: { type: string, minLength: 1, maxLength: 40, description: "말머리를 뺀 제목. 40자 [가정]" }
        body: { type: string, minLength: 1, maxLength: 500, description: "무슨 일 → 언제부터·지금 상태 → 파트너 영향과 할 일 → 다음 안내 시각. 500자 [가정]" }
        channels:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [CONSOLE_POPUP, EMAIL] }
    PartnerNotice:
      type: object
      description: "파트너 긴급 공지 한 건"
      properties:
        noticeId: { type: string }
        targetKind: { type: string, enum: [ALL, EVENT] }
        eventId: { type: [string, 'null'] }
        phase: { type: string, enum: [OCCURRED, ONGOING, RESOLVED] }
        title: { type: string }
        body: { type: string }
        channels:
          type: array
          items: { type: string, enum: [CONSOLE_POPUP, EMAIL] }
        sentBy: { $ref: '#/components/schemas/OpsActor' }
        sentAt: { type: string, format: date-time }
        recipientCount: { type: [integer, 'null'], description: "보낸 파트너사 수. 접수 직후에는 null" }
    PartnerNoticePage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PartnerNotice' }
        nextCursor: { type: [string, 'null'] }

    AdminInvitationAcceptanceCreate:
      type: object
      additionalProperties: false
      required: [invitationToken]
      description: "초대 수락 시작 본문. 초대 토큰은 링크의 URL 조각에만 있고 이 본문으로 보낸다(guidelines §9)"
      properties:
        invitationToken: { type: string, pattern: '^[A-Za-z0-9_-]{43}$', description: "32바이트 난수의 채움 없는 base64url. 서버는 SHA-256만 저장한다(docs/data.md admin_account.invite_token_hash). 수명 24시간" }
    AdminInvitationAcceptance:
      type: object
      required: [acceptanceStep, expiresInSeconds, emailMasked, displayName, role, passkeyRequired, next]
      description: "초대 수락 시작 응답"
      properties:
        acceptanceStep: { type: string, pattern: '^[A-Za-z0-9_-]{43}$', description: "수락 단계 토큰(32바이트 난수의 채움 없는 base64url). 서버는 SHA-256만 둔다. 화면은 메모리에만 둔다" }
        expiresInSeconds: { type: integer, description: "수명(1800초 [가정])" }
        emailMasked: { type: string }
        displayName: { type: string, description: "초대 때 받은 표시 이름. 완료 때 고칠 수 있다" }
        role: { $ref: '#/components/schemas/AdminRole' }
        promoterName: { type: [string, 'null'], description: "파트너 계정의 파트너사 상호" }
        passkeyRequired: { type: boolean, description: "partner_admin·operator·commander면 true(identity §6 'MFA' 행)" }
        next: { type: string, enum: [PASSWORD], description: "처음은 언제나 비밀번호다" }
    AdminInvitationStepBody:
      type: object
      additionalProperties: false
      required: [acceptanceStep]
      description: "수락 단계 토큰만 보내는 본문(인증 앱 등록 시작, 패스키 등록 시작)"
      properties:
        acceptanceStep: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
    AdminInvitationPasswordCreate:
      type: object
      additionalProperties: false
      required: [acceptanceStep, password]
      description: "초대 수락의 비밀번호 본문(docs/security/auth-controls.md §4, POL-020)"
      properties:
        acceptanceStep: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
        password: { type: string, minLength: 15, maxLength: 256, description: "새 비밀번호 원문. 서버가 NFC로 맞춘다" }
    AdminInvitationProgress:
      type: object
      required: [next]
      properties:
        next: { type: string, enum: [TOTP, PASSKEY, COMPLETE], description: "다음 단계" }
    AdminInvitationTotpEnrollment:
      type: object
      required: [otpauthUri]
      description: "인증 앱 등록 시작 응답. 시드는 이 응답에서만 나간다"
      properties:
        otpauthUri: { type: string, description: "otpauth:// 주소(시드 포함). 화면은 QR로 그리고 저장하지 않는다" }
    AdminInvitationTotpConfirmationCreate:
      type: object
      additionalProperties: false
      required: [acceptanceStep, code]
      properties:
        acceptanceStep: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
        code: { type: string, pattern: '^[0-9]{6}$', description: "인증 앱 코드 6자리. 복구 코드는 받지 않는다" }
    AdminInvitationTotpConfirmed:
      type: object
      required: [recoveryCodes, next]
      description: "인증 앱 확인 응답. 복구 코드는 이 응답에서 한 번만 나간다"
      properties:
        recoveryCodes:
          type: array
          items: { type: string }
          description: "복구 코드 10개 [가정]. Crockford base32 16자를 4자씩 붙임표로 이은 꼴(identity §6)"
        next: { type: string, enum: [PASSKEY, COMPLETE], description: "패스키 단계는 필수 역할이 아니어도 PASSKEY로 알리고 화면이 건너뛰기를 보인다 [가정]" }
    AdminInvitationPasskeyCreate:
      type: object
      additionalProperties: false
      required: [acceptanceStep, registrationId, credential]
      description: "초대 수락의 패스키 등록 마치기 본문. AdminPasskeyCreate에 acceptanceStep을 더한 꼴이다(요청 본문은 allOf로 잇지 않는다, guidelines §1)"
      properties:
        acceptanceStep: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
        registrationId: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
        credential: { $ref: '#/components/schemas/WebAuthnAttestation' }
        name: { type: string, minLength: 1, maxLength: 30, description: "이름표. 없으면 '패스키'" }
    AdminInvitationCompletionCreate:
      type: object
      additionalProperties: false
      required: [acceptanceStep, recoveryCodesSaved]
      properties:
        acceptanceStep: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
        recoveryCodesSaved: { type: boolean, enum: [true], description: "복구 코드를 안전한 곳에 보관했다는 확인" }
        displayName: { type: string, minLength: 1, maxLength: 30, description: "표시 이름을 고칠 때만. 30자 [가정](NFC 정규화 뒤 grapheme으로 센다)" }
  responses:
    Problem: { description: RFC 9457 오류, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Unauthorized: { description: "인증 필요(RFC 9457 오류). RFC 9110 §15.5.2대로 WWW-Authenticate를 싣는다(guidelines §12)", headers: { WWW-Authenticate: { $ref: '#/components/headers/WWWAuthenticate' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    TooManyRequests: { description: "요청 한도 초과, 또는 서비스 파드가 자기 과부하로 거절함(Problem server-busy, guidelines §2, 기술 검토 낮음-140). RFC 9457 오류. Retry-After를 싣는다(guidelines §6)", headers: { Retry-After: { $ref: '#/components/headers/RetryAfter' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    ServiceUnavailable: { description: "일시적으로 처리할 수 없음(차단기·Degraded·기능 꺼짐, RFC 9457 오류). Retry-After를 싣는다(guidelines §2)", headers: { Retry-After: { $ref: '#/components/headers/RetryAfter' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  headers:
    Location: { description: "새로 만든 자원의 주소(RFC 9110 §10.2.2·§15.3.2). 그 자원을 GET으로 읽을 수 있을 때만 싣는다(guidelines §12)", schema: { type: string, format: uri-reference } }
    ETag: { description: "자원의 판(version)을 큰따옴표로 감싼 강한 ETag(예 \"7\"). 고칠 때 If-Match로 그대로 보낸다(guidelines §12 '동시 수정', 기술 검토 낮음-030)", schema: { type: string } }
    XTraceId: { description: "이 요청의 trace-id(32자리 16진수). 게이트웨이가 붙이고 CDN이 캐시하는 공개 응답에는 싣지 않는다(guidelines §9, 기술 검토 낮음-023)", schema: { type: string, pattern: '^[0-9a-f]{32}$' } }
    RetryAfter: { description: "다시 보내기 전에 기다릴 초(RFC 9110 §10.2.3). 클라이언트는 이 값을 하한으로 지키고 위쪽으로만 0~20% 지터를 더한다(기다림 = 하한 × (1 + U(0, 0.2)), guidelines §5, 기술 검토 중간-038)", schema: { type: integer, minimum: 0 } }
    WWWAuthenticate: { description: "challenge(RFC 9110 §11.6.1). 스캐너 경로는 기본안이 DPoP(RFC 9449 §7.1, 토큰이 틀리거나 만료면 error=\"invalid_token\", 증명이 틀리면 error=\"invalid_dpop_proof\")이고 mTLS 선택지는 Bearer(RFC 6750 §3, 추천 적용 2026-10-28, 기술 검토 낮음-074), 쿠키 경로는 Cookie, 입장 토큰 경로는 AdmissionToken이다. Cookie·AdmissionToken은 IANA 인증 방식 등록부에 없는 프로젝트 이름이다(2026-10-21 확인, guidelines §12, 추천 적용 2026-10-21, ADR-0081)", schema: { type: string } }
paths:
  /v1/queues/{eventId}/lobby-participants:
    post:
      operationId: createQueueLobbyParticipant
      tags: [queue]
      x-peaket-roles: [fan]
      summary: 로비 입장(참가 토큰 발급)
      description: "FR-005. 본인확인 완료(`ticket:buy`) + 사람 확인(Cloudflare Turnstile) 결과 + 위험 점수. pid당 1장. 위험 점수가 높으면 201 참가 토큰에 verification: REQUIRED를 실어 추가 검증(FR-020)으로 보낸다(303 대신, ADR-0079 결정 4). POL-001·002·030"
      security: [{ fanCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/EventId' }, { $ref: '#/components/parameters/FirstVisitCookie' }]
      requestBody: { content: { application/json: { schema: { additionalProperties: false, type: object, properties: { humanCheckToken: { type: string }, deviceId: { type: string, description: "기기 식별값(CSPRNG 128비트, base64url 22자, docs/frontend.md §3.12). 형식이 다르면 400" } } } } } }
      responses:
        '201': { description: 참가 토큰, content: { application/json: { schema: { $ref: '#/components/schemas/LobbyToken' } } } }
        '403': { $ref: '#/components/responses/Problem', description: "identity-verification-required: 본인확인 전(pid 없음). sale-eligibility-required: 판매 자격 명단이 걸린 판매 단계(회차 일정 사본의 진입 자격 창 eligGates)에서 명단 사본에 없는 계정(대기열에 넣지 않고 번호를 내지 않는다. 화면은 공연 상세의 예매 제한 안내로 돌린다, Q-T36 ①, 추천 적용 2026-11-10, ADR-0261 결정 10). 로비 참가는 오픈 시각으로 창을 고른다. 창 안인데 명단 사본이 없거나 자격 설정이 틀려도 같은 본문이다(닫힌 쪽, 확장 칸 없음, 추천 적용 2026-11-10, ADR-0265)" }
        '404': { $ref: '#/components/responses/Problem', description: "queue-not-found: 대기열이 열리지 않았거나 로비 셔플을 끈 회차(ADR-0231)" }
        '409': { $ref: '#/components/responses/Problem', description: "already-waiting: 이미 참가 토큰 있음(기존 기기에서 계속. 처음 기기를 쓸 수 없으면 로비 참가 취소 뒤 다시 참가, ADR-0060). already-admitted: 이 회차에 이미 입장함. queue-not-open: 로비 개방 전. lobby-closed: 로비가 닫힘(오픈이 지났거나 목록을 고정함)(ADR-0231)" }
        '503': { $ref: '#/components/responses/ServiceUnavailable', description: "dependency-unavailable: 대기열 Redis나 시드 봉인을 잠시 쓸 수 없음. Retry-After 1초 [가정](ADR-0231)" }
        '429': { $ref: '#/components/responses/TooManyRequests', description: "축소 운영의 요청 한도를 넘음(queue-request-limited, trust-svc 판정을 받지 못할 때 파드 메모리에서 세는 기기·계정 5회/10초 [가정], 호스팅·프록시 대역 IP는 IP마다 같은 한도, docs/features/bot-defense.md §11.2, ADR-0248). 게이트웨이 로컬 한도 초과도 같은 429다" }
  /v1/queues/{eventId}/lobby-participants/me:
