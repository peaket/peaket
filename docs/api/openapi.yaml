        '404': { $ref: '#/components/responses/Problem', description: "queue-not-found: 그 회차의 대기열이 열리지 않았음(일정 사본이 없거나 회차 ID 모양이 틀림, ADR-0233)" }
        '503': { $ref: '#/components/responses/ServiceUnavailable', description: "dependency-unavailable: 대기열 Redis를 잠시 쓸 수 없음. Retry-After 1초 [가정]. 사람 키가 남아 있어 같은 요청을 다시 보내면 끝난다(ADR-0233)" }
  /v1/queues/{eventId}/segment-states/{segment}.json:
    servers: [{ url: 'https://queue-files.peaket.example', description: "대기열 파일 배포(ADR-0058)" }]
    get:
      operationId: getQueueSegmentState
      x-peaket-fetch-cache: no-store  # 브라우저 HTTP 캐시를 쓰지 않는다(CDN 1초 캐시만, ADR-0110, docs/frontend.md §5.9). api-client가 fetch의 cache로 넘긴다(BAS-041)
      tags: [queue]
      x-peaket-roles: [public]
      security: []
      summary: 구간별 대기 상태 파일(인증 없음, 쿠키 없음, CDN 1초 캐시. 입장 임박 구간은 다음 생성 시각까지)
      description: "FR-007, POL-007. NFR-002. 같은 구간 1,000명이 같은 파일. 매진 시 saleStatus=SOLD_OUT으로 폴링 중단(POL-015). 입장 임박 구간(그 구간의 첫 번호까지 예상 대기 60초 이내) 파일은 Expires = 생성 시각 + 1초, Cache-Control: public(max-age·stale-while-revalidate 없음)으로 내고, 그 밖 구간은 max-age=1, stale-while-revalidate=2다. 브라우저는 cache: no-store로 묻는다. 캐시 응답의 Date는 노출하지 않는다(Access-Control-Expose-Headers: Retry-After, 추천 적용 2026-10-28, ADR-0110)"
      parameters: [{ $ref: '#/components/parameters/EventId' }, { name: segment, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: "상태. 폴링을 늦추라는 힌트는 본문 pollHintMs로 준다(200 응답에는 Retry-After를 싣지 않고, 있어도 브라우저가 읽지 않는다, 추천 적용 2026-10-28, 기술 검토 중간-032)", content: { application/json: { schema: { $ref: '#/components/schemas/QueueState' } } } }, '404': { $ref: '#/components/responses/Problem', description: "queue-not-found: 없는 회차(일정 사본 없음)·마지막 구간(seq가 든 구간) 뒤 100구간 [가정]보다 뒤 구간·틀린 파일 이름. Cache-Control: public, max-age=1(추천 적용 2026-11-03)" }, '503': { $ref: '#/components/responses/ServiceUnavailable', description: "원본 과부하. Retry-After(초)는 다시 묻기의 하한이고 브라우저는 그 위로만 0~20% 지터를 더한다(기술 검토 중간-032·038). 처음 켤 때 대기열 Redis가 잠시 안 되면 dependency-unavailable, Retry-After 1초, Cache-Control: no-store다(추천 적용 2026-11-03)" } }
  /v1/queues/{eventId}/shuffle-results/{hashPrefix}.json:
