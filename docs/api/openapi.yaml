      description: "FR-038, POL-005. 파일 4,096개 [가정](참가 토큰 해시 16진 앞 세 자리), 각 '해시 → 순번'(100만 명이면 파일마다 약 250건). 본문 형식은 QueueResultFile(BAS-042)"
      parameters: [{ $ref: '#/components/parameters/EventId' }, { name: hashPrefix, in: path, required: true, schema: { type: string } }]
