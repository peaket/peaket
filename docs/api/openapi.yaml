  /v1/ops/fraud-cases/{caseId}/ip-reveals:
    post: { operationId: createOpsFraudCaseIpReveal, tags: [investigations], x-peaket-roles: [commander, cs_lead], summary: "연결 그래프 IP 점의 원문 열기(사유 필수, SCR-071 ②)", description: "FR-072·073, docs/security/authz-matrix.md §4.3 5(추천 적용 2026-10-31, ADR-0171). 그래프는 IP를 가린 값으로만 주고, 조사관이 사유를 적어 이 요청을 보낼 때만 고른 점의 원문을 준다. 연 기록(계정, 사건 ID, 점 수, 사유, 시각)은 관리 계정 접속기록(admin_data_access, 2년)과 정규 로그 줄 invAccess GRAPH_IP_REVEAL에 남고, 원문 IP는 기록에 넣지 않는다(docs/observability.md §7). 상태를 바꾸지 않는 읽기라 Idempotency-Key를 받지 않는다. 계정당 하루 200개 [가정]를 넘으면 429이고, 대량 조회 점검(docs/security/internal-management-plan.md §4.2)이 센다. 응답은 Cache-Control: no-store다. 지정 확인은 태그 investigations 설명", security: [{ opsCookie: [] }], parameters: [{ name: caseId, in: path, required: true, schema: { type: string, format: uuid } }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FraudIpRevealCreate' } } } }, responses: { '200': { description: "연 원문", content: { application/json: { schema: { $ref: '#/components/schemas/FraudIpReveal' } } } }, '400': { $ref: '#/components/responses/Problem', description: "본문 형식 오류" }, '403': { $ref: '#/components/responses/Problem', description: "investigator-required" }, '404': { $ref: '#/components/responses/Problem', description: "없는 사건" }, '410': { $ref: '#/components/responses/Problem', description: "investigation-source-expired" }, '422': { $ref: '#/components/responses/Problem', description: "사유 없음, 그 사건 그래프의 IP 점이 아닌 nodeId" }, '429': { $ref: '#/components/responses/Problem', description: "하루 한도 초과(Retry-After)" } } }
  /v1/ops/fraud-cases/{caseId}/replay-export:
    get: { operationId: getOpsFraudCaseReplayExport, tags: [investigations], x-peaket-roles: [commander, cs_lead], summary: "조사 원천 리플레이 파일(SCR-069를 사건 작업대에서 열 때)", description: "FR-071, docs/features/forensic-replay.md. 그 사건 회차·묶음의 조사용 기록을 리플레이 파일 형식(Apache Arrow IPC 파일)으로 흘려보낸다. 결과는 서버에 남기지 않는다. Cache-Control no-store이고 Content-Disposition은 붙이지 않는다(브라우저 메모리에만 둔다). Sec-Fetch-Mode가 navigate(주소창·링크로 연 요청)이면 403으로 거절하고, Sec-Fetch-Site same-origin인 fetch만 받는다. 연구 갈래 원천(/v1/ops/research-exports)과 같은 화면에 섞지 않는다. 내려받기는 접속기록과 대량 조회 점검 대상이다(추천 적용 2026-10-31, ADR-0171 결정 7)", security: [{ opsCookie: [] }], parameters: [{ name: caseId, in: path, required: true, schema: { type: string, format: uuid } }, { name: fromMs, in: query, required: false, description: "시간창 시작. 판매 시작 기준 밀리초이고 음수면 판매 시작 전이다. toMs와 함께 보내고, 둘 다 없으면 기본값(판매 시작 10분 전부터 20분 뒤까지)이다(docs/features/forensic-replay.md §6.7.1, 연구 갈래의 fromMs·toMs와 같은 이름, 추천 적용 2026-10-31)", schema: { type: integer } }, { name: toMs, in: query, required: false, description: "시간창 끝. toMs − fromMs는 1밀리초 이상 30분(1,800,000) [가정] 이하다(forensic-replay.md §4.3 한도)", schema: { type: integer } }], responses: { '200': { description: "리플레이 파일", headers: { Cache-Control: { schema: { type: string, enum: [no-store] } } }, content: { application/vnd.apache.arrow.file: { schema: { type: string, format: binary } } } }, '403': { $ref: '#/components/responses/Problem', description: "investigator-required, 주소창으로 연 요청(Sec-Fetch-Mode navigate)" }, '404': { $ref: '#/components/responses/Problem', description: "없는 사건" }, '410': { $ref: '#/components/responses/Problem', description: "investigation-source-expired" }, '422': { $ref: '#/components/responses/Problem', description: "시간창이 30분 [가정] 초과, 하나만 보냄, 끝이 시작보다 이름" } } }
  /v1/ops/fraud-cases/{caseId}/appeal-requests:
    post: { operationId: createOpsFraudCaseAppealRequest, tags: [investigations], x-peaket-roles: [commander, cs_lead], summary: "소명 요청 보내기(대상 계정, 사유 범주, 기한)와 양도 잠금", description: "FR-073, POL-046 ③. 대상 계정에 알림과 소명 제출 화면(SCR-042, POST /v1/appeals kind FRAUD_CASE)으로 사유 범주와 기한을 알린다. 같은 처리에서 ops-svc가 ticket-svc SetTransferLock으로 그 계정들이 결제한 이 회차 티켓의 양도를 잠그고, 진행 중인 양도 요청은 시스템이 철회한다. 시스템이 거는 조치는 이 잠금뿐이다. INVESTIGATING(C3)과, 묶음에 더한 계정을 위한 APPEAL_PENDING(C14)에서만 받고 그 밖은 409 fraud-case-state다. 입장 시작 뒤에는 보낼 수 없다. 기한이 취소 마감 시각 뒤로 가면 그 계정은 표 취소를 고를 수 없게 되므로 화면이 보내기 전에 알린다(추천 적용 2026-10-31, ADR-0171 결정 3). 잠금에는 최대 기한(그 계정에 처음 소명을 요청한 때 + 14일 [가정], lockExpiresAt)이 있고, 같은 계정에 다시 요청해도 늘지 않는다. 잠금은 일곱 때(소명 인정, 사건 정상 종료, 조치 실행 끝, 묶음에서 빠짐, 입장 시작, 그 계정 대상 조치 요청의 반려·만료, 최대 기한) 가운데 먼저 오는 때에 풀린다. 그 계정들이 결제한 표를 양도로 받아 가진 사람이 있으면 그 사람에게도 같은 기한의 소명 기회를 알린다(core-svc 사본 party HOLDER, 알림 FRAUD_HOLDER_NOTICE). 그 알림에는 결제자의 사유 범주를 싣지 않는다(추천 적용 2026-10-31, ADR-0173)", security: [{ opsCookie: [] }], parameters: [{ name: caseId, in: path, required: true, schema: { type: string, format: uuid } }, { $ref: '#/components/parameters/IdempotencyKey' }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FraudAppealRequestCreate' } } } }, responses: { '201': { description: "보냄(사건은 APPEAL_PENDING)", content: { application/json: { schema: { $ref: '#/components/schemas/FraudAppealRequest' } } } }, '400': { $ref: '#/components/responses/Problem', description: "본문 형식 오류" }, '403': { $ref: '#/components/responses/Problem', description: "investigator-required" }, '404': { $ref: '#/components/responses/Problem', description: "없는 사건" }, '409': { $ref: '#/components/responses/Problem', description: "fraud-case-state(INVESTIGATING·APPEAL_PENDING이 아님), entry-started(입장 시작 뒤)" }, '422': { $ref: '#/components/responses/Problem', description: "기한이 24시간 [가정]보다 짧음, 묶음 밖 계정" } } }
  /v1/ops/fraud-cases/{caseId}/action-requests:
