      description: "POL-012, NFR-020. 홀드 시간 제한은 WCAG 2.2.1의 실시간 예외로 판단(ADR-0060). 구매 세션 요청 서명 필수. 해제와 같이 그 구매 세션의 holdId만 찾고, 연장 Lua가 holdId와 소유 계정을 다시 대조한다(추천 적용 2026-10-30, docs/features/seat-hold.md §3, ADR-0159 결정 3)"
      security: [{ fanCookie: [], admissionToken: [] }]
      parameters: [{ name: holdId, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/PurchaseSeq' }, { $ref: '#/components/parameters/PurchaseMac' }]
      responses: { '200': { description: 연장된 홀드 }, '404': { $ref: '#/components/responses/Problem', description: "그 구매 세션의 홀드가 아니다. 남의 holdId와 없는 holdId는 똑같이 404다(BOLA 방지, 추천 적용 2026-10-30, docs/features/seat-hold.md §3)" }, '409': { $ref: '#/components/responses/Problem', description: 이미 연장함 }, '401': { $ref: '#/components/responses/Unauthorized', description: "팬 쿠키 없음·만료(about:blank, 화면은 토큰을 한 번 갱신한다), 입장 토큰 없음·만료이거나 구매 세션이 없거나 끝남(purchase-session-ended), 구매 세션 요청 서명 머리 없음·형식·불일치(purchase-signature-invalid), 일련번호 재사용(purchase-seq-reused). 어느 머리가 틀렸는지는 싣지 않는다. 화면 처리는 docs/frontend.md §4.1 '401'(BAS-040)" }, '503': { $ref: '#/components/responses/ServiceUnavailable', description: "좌석 Redis 장애 조치 중이거나 그 회차 좌석 저장소가 준비되지 않음(Problem type seat-store-unavailable, Retry-After 2초 [가정], ADR-0121)" } }
  /v1/orders:
    post:
      operationId: createOrder
      tags: [orders]
      x-peaket-roles: [fan]
      summary: 주문 생성(금액 서버 계산, 예매자 정보, 제3자 제공 동의)
      description: "FR-011, POL-013·023. 본인확인 상태 재확인(POL-001). 구매 세션 요청 서명 필수. 그 회차의 판매 종료(공연 시작 24시간 전) 뒤에는 판매 종료 전에 만든 유효한 홀드의 주문만 받고 그 밖은 410 sale-ended다. 그 주문의 결제 시도·접수는 홀드·결제 시간 안에서 지금처럼 받는다(추천 적용 2026-10-14, ADR-0064)"
      security: [{ fanCookie: [], admissionToken: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/PurchaseSeq' }, { $ref: '#/components/parameters/PurchaseMac' }]
      requestBody: { content: { application/json: { schema: { additionalProperties: false, type: object, required: [holdId, buyer], properties: { holdId: { type: string }, buyer: { additionalProperties: false, type: object, properties: { name: { type: string }, phone: { type: string } } }, consents: { type: object, additionalProperties: false, description: "두 동의와 고지 문안의 판. 없거나, 두 동의 가운데 하나라도 true가 아니거나, consentVersion이 없으면 422 consent-required다(동의 누락은 형식 오류가 아니라 업무 규칙이다, guidelines §12). 동의 일시는 주문의 created_at이다(추천 적용 2026-10-30, 굿즈 주문 본문 MerchOrderCreateDelivery.consents와 같은 방식, ADR-0089·0160)", properties: { provisionToSeller: { type: boolean, description: "판매자에게 개인정보 제공 동의(필수, 문안 docs/planning/04 SCR-011 ③, 추천 적용 2026-10-14, ADR-0062)" }, salesTerms: { type: boolean, description: "판매 조건(정렬 방식·1인 1순번·매수 한도·취소 규정) 결제 직전 동의(필수, POL-004)" }, consentVersion: { type: string, pattern: '^[0-9A-Za-z._-]{1,32}$', description: "주문서에 보인 두 고지 문안의 판. purchase_order.consent_version에 넣는다(문안은 판마다 따로 보관한다, docs/security/data-classification.md '법적 동의 기록'). 서버가 지금 쓰는 판이 아니면 422 consent-version-outdated이고, 화면은 지금 문안을 다시 보이고 다시 동의받는다. 32자 상한은 [가정](추천 적용 2026-10-30, docs/data.md purchase_order.consent_version)" } } } } } } } }
      responses: { '401': { $ref: '#/components/responses/Unauthorized', description: "팬 쿠키 없음·만료(about:blank, 화면은 토큰을 한 번 갱신한다), 입장 토큰 없음·만료이거나 구매 세션이 없거나 끝남(purchase-session-ended), 구매 세션 요청 서명 머리 없음·형식·불일치(purchase-signature-invalid), 일련번호 재사용(purchase-seq-reused). 어느 머리가 틀렸는지는 싣지 않는다. 화면 처리는 docs/frontend.md §4.1 '401'(BAS-040)" }, '403': { $ref: '#/components/responses/Problem', description: "예매 제한 중인 계정(Problem type booking-restricted). purchase-svc가 주문 행을 만들기 전에 좌석 Redis s:rst:{account} 사본을 읽어 ACTIVE이고 끝 시각 전이면 주문을 만들지 않는다. 같은 처리에서 그 구매 세션의 홀드를 모두 풀어 좌석을 바로 돌려준다(놓은 좌석으로 센다, docs/features/seat-hold.md §5). 구매 세션은 끝내지 않는다. 이미 만든 주문의 결제 시도·결제 접수는 막지 않는다(소유자 결정 2026-10-30, open-items 75번, 세부는 추천 적용 2026-10-30, docs/features/payment.md §2 '예매 제한 확인', P-T49)" }, '415': { $ref: '#/components/responses/Problem', description: "application/json이 아닌 본문" }, '422': { $ref: '#/components/responses/Problem', description: "업무 규칙에 어긋난 경우다(guidelines §12). ① 판매자 제공 동의나 판매 조건 동의가 없거나 true가 아니거나 consentVersion이 없다(consent-required). ② 동의한 고지 문안의 판이 지금 판이 아니다(consent-version-outdated)(추천 적용 2026-10-30, ADR-0160 결정 2와 같은 규칙)" }, '201': { description: 주문, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }, '404': { $ref: '#/components/responses/Problem', description: "본문의 holdId가 이 구매 세션의 홀드 목록(s:session:{sid})에 없다. 남의 홀드, 다른 회차·다른 구매 세션의 홀드, 없거나 끝난 홀드를 가리지 않고 같은 404로 답해 그런 홀드가 있는지 알리지 않는다. 주소에 회차가 없는 경로라 회차 불일치 403 대신 자기 홀드만 규칙을 쓴다(추천 적용 2026-10-30, docs/features/seat-hold.md §2·§3, S-T29)" }, '409': { $ref: '#/components/responses/Problem', description: "탈퇴를 미루는 중인 계정(account.status WITHDRAWAL_PENDING, docs/planning/03 §1.5 ⑧)" }, '410': { description: "판매 종료(공연 시작 24시간 전) 뒤 판매 종료 전 홀드가 아닌 주문(Problem type sale-ended, ADR-0064). 예외: 우선 구매 보류에서 바꾼 홀드의 주문(입장 토큰 클레임 prio)은 판매 종료 뒤에도 받고, 금액은 권리의 원래 가격이다. 권리는 결제 완료 때 USED가 되고, 결제가 실패하면 권리 기한 안에서 다시 시도할 수 있다. 그 권리로 진행 중인 주문이 있거나 이미 USED면 409다(priority_grant.status, 추천 적용 2026-10-31, ADR-0171)", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }, '429': { $ref: '#/components/responses/TooManyRequests', description: "게이트웨이 로컬 한도 초과, 또는 purchase-svc 파드의 자기 과부하(server-busy, docs/architecture.md §5)" }, '503': { $ref: '#/components/responses/ServiceUnavailable', description: "좌석 Redis 장애 조치 중이거나 그 회차 좌석 저장소가 준비되지 않음(Problem type seat-store-unavailable, Retry-After 2초 [가정], ADR-0121)" } }
  /v1/orders/{orderId}/payments:
    post:
      operationId: createOrderPayment
      tags: [orders]
      x-peaket-roles: [fan]
      summary: 결제 시도 시작(결제사 선택, 결제창 값 발급)
      description: "FR-011, POL-036, ADR-0044. 결제창을 열기 직전에 부른다. 선택 순서는 결제사 전환, 공연 지정, 플랫폼 기본. 접수 전의 이전 시도는 SUPERSEDED. 승인 요청을 보낸 주문은 409. 고른 결제사 채널이 서버 승인을 지원하지 않거나 비활성이면, 또 결제사 장애·채널 호출 상한으로 새 결제 진입을 멈춘 동안이면 503(새 결제 일시 정지, payment §2.2·§9. 이 동안 주문을 만들고 결제 접수 전인 홀드의 남은 시간은 멈춘다, ADR-0085). 구매 세션 요청 서명 필수"
      security: [{ fanCookie: [], admissionToken: [] }]
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/PurchaseSeq' }, { $ref: '#/components/parameters/PurchaseMac' }]
      requestBody: { content: { application/json: { schema: { additionalProperties: false, type: object, properties: { payMethod: { type: string, description: 포트원 채널 선택에 쓰는 결제수단. 토스는 위젯 안에서 고르므로 생략 }, behavior: { $ref: '#/components/schemas/BehaviorSummary', description: "결제 화면에서 잰 행동 요약(선택). purchase-svc가 BehaviorSignal(screen PAYMENT)로 내고 실시간 판정에는 쓰지 않는다. 같은 주문의 두 번째 시도부터는 싣지 않는다(추천 적용 2026-10-31, ADR-0171 결정 4)" } } } } } }
      responses: { '404': { $ref: '#/components/responses/Problem', description: "주소의 주문이 이 구매 세션에서 만든 주문이 아니다(남의 주문, 다른 회차·다른 구매 세션의 주문, 없는 주문을 가리지 않고 같은 404, guidelines §12 '개인·거래 기록', 추천 적용 2026-10-30, docs/features/seat-hold.md §2)" }, '401': { $ref: '#/components/responses/Unauthorized', description: "팬 쿠키 없음·만료(about:blank, 화면은 토큰을 한 번 갱신한다), 입장 토큰 없음·만료이거나 구매 세션이 없거나 끝남(purchase-session-ended), 구매 세션 요청 서명 머리 없음·형식·불일치(purchase-signature-invalid), 일련번호 재사용(purchase-seq-reused). 어느 머리가 틀렸는지는 싣지 않는다. 화면 처리는 docs/frontend.md §4.1 '401'(BAS-040)" }, '415': { $ref: '#/components/responses/Problem', description: "application/json이 아닌 본문" }, '201': { description: 결제 시도, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentAttempt' } } } }, '409': { $ref: '#/components/responses/Problem', description: "승인 요청을 이미 보낸 주문, 같은 주문의 결제창 단계 실패 3회 [가정] 초과(홀드 만료까지 PAYMENT_ATTEMPTS_EXCEEDED, payment §4.2), 결제하지 않아 만료된 주문(order-expired, ADR-0107)" }, '423': { $ref: '#/components/responses/Problem', description: "판매 일시정지(명령 3)" }, '429': { $ref: '#/components/responses/TooManyRequests', description: "게이트웨이 로컬 한도 초과, 또는 purchase-svc 파드의 자기 과부하(server-busy, docs/architecture.md §5)" }, '503': { $ref: '#/components/responses/ServiceUnavailable', description: "결제사 사용 불가(새 결제 일시 정지). Problem의 holdRemainingSeconds에 멈춘 홀드 남은 시간(ADR-0085). 또는 좌석 Redis 장애 조치 중이거나 그 회차 좌석 저장소가 준비되지 않음(Problem type seat-store-unavailable, Retry-After 2초 [가정], ADR-0121). 둘은 type으로 가른다" } }
  /v1/orders/{orderId}/payment-acceptance:
