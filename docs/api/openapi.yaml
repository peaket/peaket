        endsAt: { type: string, format: date-time }
        reentryAllowed: { type: boolean }
        lobbyShuffle: { type: boolean }
        openBatch: { type: boolean }
        seatAssignment: { type: string, enum: [PICK, AUTO] }
        perPersonLimit: { type: integer }
        status: { $ref: '#/components/schemas/EventStatus' }
        saleStatus: { type: [string, 'null'], enum: [UPCOMING, ON_SALE, ALL_HELD, SOLD_OUT, ENDED, null], description: "회차 판매 상태(docs/planning/03 §2.15). 판매 승인 전과 판매 중지 중에는 null" }
        soldPercent: { type: [integer, 'null'], minimum: 0, maximum: 100, description: "판매율(%). 1분 지연 집계 [가정]. 오픈 전이면 null" }
        entryClosedAt: { type: [string, 'null'], format: date-time, description: "입장 기록 마감 시각" }
    PartnerProductionDetail:
