      description: "FR-010, FR-042. 구매 세션 요청 서명 필수. purchase-svc는 요청한 구매 세션 상태에 적힌 그 세션의 holdId 목록에서만 찾고, 해제 Lua는 좌석 홀드 Hash의 holdId와 소유 계정이 요청과 같을 때만 바꾼다(추천 적용 2026-10-30, docs/features/seat-hold.md §3, ADR-0159 결정 3). 놓은 좌석은 같은 계정이 30초 [가정] 동안 다시 잡지 못한다(홀드 409 seat-recently-released, 소유자 결정 2026-10-30, open-items 67번, docs/features/seat-hold.md §5)"
      security: [{ fanCookie: [], admissionToken: [] }]
      parameters: [{ name: holdId, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/PurchaseSeq' }, { $ref: '#/components/parameters/PurchaseMac' }]
      responses: { '204': { description: 해제 }, '404': { $ref: '#/components/responses/Problem', description: "그 구매 세션의 홀드가 아니다. 남의 holdId와 없는 holdId는 똑같이 404로 답해 그런 홀드가 있는지 알리지 않는다(BOLA 방지, guidelines §12, 추천 적용 2026-10-30, docs/features/seat-hold.md §3)" }, '401': { $ref: '#/components/responses/Unauthorized', description: "팬 쿠키 없음·만료(about:blank, 화면은 토큰을 한 번 갱신한다), 입장 토큰 없음·만료이거나 구매 세션이 없거나 끝남(purchase-session-ended), 구매 세션 요청 서명 머리 없음·형식·불일치(purchase-signature-invalid), 일련번호 재사용(purchase-seq-reused). 어느 머리가 틀렸는지는 싣지 않는다. 화면 처리는 docs/frontend.md §4.1 '401'(BAS-040)" }, '503': { $ref: '#/components/responses/ServiceUnavailable', description: "좌석 Redis 장애 조치 중이거나 그 회차 좌석 저장소가 준비되지 않음(Problem type seat-store-unavailable, Retry-After 2초 [가정], ADR-0121)" } }
  /v1/holds/{holdId}/extension:
    post:
      operationId: createHoldExtension
