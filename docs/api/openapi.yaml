      description: "POL-021 명령 7, SCR-068, ADR-0060, docs/planning/03 §3 '공지 관리' 행. ko·en·ja·zh 네 언어가 모두 있어야 승인한다(없으면 422). 승인하면 명령 7에서 고를 수 있다. 재인증: authz-matrix §6에 이 작업의 행이 없어, 승인 업무와 같은 작업 묶음 APPROVAL과 패스키 요소로 둔다 [가정]. 작성자 본인의 승인은 정본이 막지 않아 막지 않는다 [가정]. 상태 전이라 Idempotency-Key를 받지 않고, 이미 승인한 판을 다시 승인하면 같은 200이다(guidelines §4) If-Match로 검토한 판을 받아, 검토 뒤 고쳐진 문구를 승인하지 않는다(guidelines §12)."
