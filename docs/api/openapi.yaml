    get: { operationId: getOpsWidget, tags: [ops], x-peaket-roles: [viewer, operator, commander, cs_agent, cs_lead], summary: "관제 위젯 조회(처음 그릴 때와 다시 보일 때의 지난 값, 그래프 최근 15분 창)", description: "FR-029, ADR-0100. 위젯 키마다 응답 모양이 다르고 위젯 키 열거와 모양은 wbs 0.2.3에서 적는다. 임의 쿼리를 받지 않는다. Cache-Control: no-store", security: [{ opsCookie: [] }], parameters: [{ name: widgetKey, in: path, required: true, schema: { type: string } }, { name: eventId, in: query, required: false, schema: { type: string } }, { name: from, in: query, required: false, schema: { type: string, format: date-time } }, { name: to, in: query, required: false, schema: { type: string, format: date-time } }], responses: { '200': { description: 위젯 값, content: { application/json: { schema: { type: object } } } }, '404': { $ref: '#/components/responses/Problem', description: 없는 위젯 키 } } }
  /v1/scanner/device-enrollments:
    post: { operationId: createScannerDeviceEnrollment, tags: [scanner], x-peaket-roles: [public], security: [], summary: "스캐너 기기 등록. 등록 코드와 DPoP 증명으로 기기 안에서 만든 키를 기기 기록에 묶는다", description: "FR-065, ADR-0051, RFC 9449, 추천 적용 2026-10-14, ADR-0062. 기기 자격 전이라 인증 없음. 스캐너 PWA가 ECDSA P-256 키(extractable=false)를 만들고 DPoP 증명(헤더 jwk에 공개키)과 함께 보낸다. 서버는 코드 해시와 DPoP 서명을 확인하고 공개키의 JWK SHA-256 지문(RFC 7638, jkt)을 scanner_device.credential_thumbprint(credential_type=DEVICE_KEY)에 넣는다. 코드 입력은 대소문자·하이픈·공백을 무시한다. 코드별로 실패를 셀 수 없어 출발지 IP당 실패 10분 10회 [가정]로 막는다(성공한 등록은 세지 않는다). 전체 실패가 10분 100회 [가정]를 넘어도 등록 경로는 닫지 않고 SEV3로 알린다(추천 적용 2026-10-28, 기술 검토 낮음-157)", parameters: [{ name: DPoP, in: header, required: true, description: "DPoP 증명(RFC 9449)", schema: { type: string } }], requestBody: { required: true, content: { application/json: { schema: { additionalProperties: false, type: object, required: [code], properties: { code: { type: string } } } } } }, responses: { '201': { description: "등록됨(기기 ID)" }, '400': { $ref: '#/components/responses/Problem', description: "코드 형식 오류·DPoP 증명 오류" }, '410': { $ref: '#/components/responses/Problem', description: "코드 만료·사용됨" }, '429': { $ref: '#/components/responses/TooManyRequests', description: "그 출발지 IP의 실패 시도 초과" } } }
  /v1/scanner/device-authorizations:
    post: { operationId: createScannerDeviceAuthorization, tags: [scanner], x-peaket-roles: [scanner_device], summary: 스캐너 로그인 시작(RFC 8628 방식 기기 승인 코드 발급), description: "FR-046, POL-031, SCR-036, ADR-0051. 등록되고 ACTIVE인 기기만. 확인 코드 8자, 5분, 기기당 시간당 10회 [가정]. 기기 인증만 요구하는 쓰기라 쿠키 경로처럼 위조 요청을 막는다(기본안의 DPoP 증명은 저절로 실리지 않지만 심층 방어로 두고, mTLS 선택지의 인증서는 브라우저가 알아서 싣는다): Content-Type: application/json만 받고(그 밖 415) 빈 객체도 JSON 본문으로 보내며, Origin이 스캐너 PWA 출처(https://scanner.peaket.example)가 아니거나 없으면 거절한다(추천 적용 2026-10-15, ADR-0065 결정 10)", security: [{ deviceDpop: [] }, { deviceMtls: [] }],requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, maxProperties: 0, description: "지금은 빈 객체 {}. 사전 요청 없는 양식 POST로 확인 코드를 발급시키지 못하게 JSON 본문을 요구한다" } } } }, responses: { '200': { description: 코드, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceAuthorization' } } } }, '403': { $ref: '#/components/responses/Problem', description: "미등록·폐기 기기, Origin이 스캐너 PWA 출처가 아니거나 없음" }, '415': { $ref: '#/components/responses/Problem', description: "application/json이 아님" }, '429': { $ref: '#/components/responses/TooManyRequests', description: 코드 발급 한도 }, '503': { $ref: '#/components/responses/ServiceUnavailable', description: "기기 원장(ticket-svc)이 답하지 않아 기기 상태를 확인하지 못했다. 기기 상태를 모른 채 로그인을 열지 않는다(identity-svc → ticket-svc GetScannerDeviceByCredential, docs/features/identity.md §6.1, 추천 적용 2026-10-30)" } } }
  /v1/scanner/token:
