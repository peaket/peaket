  /v1/partner/productions/{productionId}:
    get:
      operationId: getPartnerProduction
      tags: [partner]
      x-peaket-roles: [partner_admin, partner_member]
      summary: "공연 개요와 등록 정보(SCR-063 회차 허브, SCR-021 다시 열기)"
      description: "FR-022, FR-052, FR-055, SCR-063·021, docs/design/d5 §1.6 16번. 소속 파트너의 공연만 준다(다른 파트너 공연과 없는 공연은 같은 404, ADR-0198 결정 3, authz-matrix §3.5). 승인 이력이 있으면 등록 칸은 지금 고치는 내용(마지막 승인 내용에 변경분 production.pending_revision을 얹은 값)이고, 바뀐 항목 이름을 pendingRevisionFields로 알린다. 승인 뒤 더한 회차는 pending true로 함께 싣는다(ADR-0198 결정 3). 판매자 고지 미리보기는 GET /v1/partner/seller-profile을 쓴다. 공연 설명 글과 공연예술통합전산망 항목은 HOT-180이 등록 본문에 더할 때 여기에도 함께 더한다(ADR-0198 결정 1). ETag는 공연의 판이다(guidelines §12). [가정] production·event 표에 판 칸 version을 구현 때 더한다. Cache-Control: no-store"
      security:
        - partnerCookie: []
      parameters:
        - { $ref: '#/components/parameters/ProductionId' }
      responses:
        '200':
          description: 공연 개요와 회차 표
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartnerProductionDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Problem', description: "not-found: 없는 공연과 다른 파트너 공연(같은 응답)" }
    patch:
      operationId: updatePartnerProduction
      tags: [partner]
      x-peaket-roles: [partner_admin, partner_member]
      summary: "공연 등록 정보 임시저장·수정(SCR-021 1단계 칸)"
      description: "FR-022, POL-030, SCR-021, docs/design/d5 §1.6 16번. 보낸 칸만 바꾼다. 소속 파트너의 공연만 고친다(다른 파트너 공연은 404). 회차·재입장·이미지·좌석맵·판매 정책은 각자 경로로 저장한다(ADR-0198 결정 1). 공연명·장르·관람 연령·러닝타임·아티스트·다른 이름은 재승인 대상이 아니다(재승인 대상은 가격·회차·좌석 등급·좌석맵·판매 정책, FR-052, docs/planning/03 §2.14 T7). 판매 중지 중에는 409다(SCR-021 '편집 잠김'). [가정] 첫 저장은 POST /v1/partner/productions로 하고(공연명·장르·아티스트와 회차 1개 이상이 필요하다, ADR-0198 결정 1), 그 전의 입력은 서버에 두지 않고 화면이 브라우저에 둔다. [가정] 승인 이력이 있는 공연의 공연장은 바꿀 수 없다(같은 공연장·배치본, ADR-0093). 승인된 공연의 칸을 바꾸면 공연 상세 캐시와 검색 읽기 모델을 함께 고친다. 본문 판정 순서는 PartnerProductionCreate와 같다. 동시 수정은 If-Match다(guidelines §12)"
      security:
        - partnerCookie: []
      parameters:
        - { $ref: '#/components/parameters/ProductionId' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PartnerProductionUpdate' }
      responses:
        '200':
          description: 고친 공연
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartnerProductionDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Problem', description: "not-found: 없는 공연·다른 파트너 공연, 또는 placeId·artistId가 없는 공연장·아티스트" }
        '409': { $ref: '#/components/responses/Problem', description: "production-suspended: 판매 중지 중인 공연, sale-setting-locked: 승인 이력이 있는 공연의 공연장을 바꾸려 함" }
        '412': { $ref: '#/components/responses/Problem', description: "precondition-failed: 다른 사람이 먼저 고침" }
        '428': { $ref: '#/components/responses/Problem', description: "precondition-required: If-Match 없음" }
  /v1/partner/events/{eventId}:
    patch:
      operationId: updatePartnerEvent
      tags: [partner]
      x-peaket-roles: [partner_admin, partner_member]
      summary: "회차 일정·정렬·배정·1인 한도 임시저장·수정(SCR-021 2·4단계)"
      description: "FR-022, FR-052, POL-003·011·030·035·041, SCR-021, docs/design/d5 §1.6 16번. 보낸 칸만 바꾼다. 소속 파트너의 회차만 고친다(다른 파트너 회차는 404). 재입장은 PUT /v1/partner/events/{eventId}/entry-policy를 쓴다(구매자에게 불리한 변경 금지 규칙이 그 경로에 있다). 승인 이력이 없는 공연의 회차는 event 행을 바로 고친다. 승인 이력이 있는 공연의 회차는 재승인 대상이라 파트너 관리자만 고치고(docs/planning/03 §3 첫 행), event 행을 그대로 둔 채 production.pending_revision에 두며 응답 pending이 true다. APPROVED면 SUBMITTED로 바뀐다(§2.14 T7, 회차 더하기와 같은 규칙, ADR-0198 결정 3). 판정 순서와 오류는 PartnerEventCreate와 같다(바뀌는 값으로 다시 본다). 오픈 뒤에는 정렬 설정과 좌석 배정 방식을 바꾸지 못한다(SCR-021, POL-035 예외 열). [가정] 오픈 뒤의 오픈 시각·공연 시각 변경도 409이고, 연기는 POST /v1/partner/events/{eventId}/cancellation(kind POSTPONE)으로 한다. If-Match 값은 GET /v1/partner/productions/{productionId}의 그 회차 version이다. 세부(추천 적용 2026-11-10, BUILD_ORDER HOT-250, ADR-0261 결정 4): 판은 event.version(1부터, 고칠 때마다 +1, 변경분에 둘 때도 오른다)이고 응답 ETag다. 오픈 뒤(지금 ≥ 오픈 시각)에 lobbyShuffle·openBatch·seatAssignment·openAt·startsAt을 바꾸면 409 sale-setting-locked다. 승인 이력이 있으면 바뀐 칸을 production.pending_revision.eventChanges[회차 ID]에 합쳐 둔다. 1인 한도를 그 회차에 걸린 판매 정책 규칙의 limitPerPerson보다 작게 바꾸면 422 sale-policy-invalid다. 지금 값과 같은 칸은 바꾸기가 아니다: 같은 값만 보내면 아무것도 바꾸지 않고 판도 올리지 않으며(200, 지금 판), 변경분에는 바뀐 칸만 둔다(추천 적용, 2026-11-10, 리뷰, ADR-0261 결정 13)"
      security:
        - partnerCookie: []
      parameters:
        - { $ref: '#/components/parameters/EventId' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PartnerEventUpdate' }
      responses:
        '200':
          description: 고침(승인 이력이 있으면 변경분에 저장, pending true)
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartnerEventUpdated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem', description: "partner-admin-required: 승인 이력이 있는 공연의 회차를 파트너 실무자가 고침" }
        '404': { $ref: '#/components/responses/Problem', description: "not-found: 없는 회차와 다른 파트너 회차(같은 응답). 승인 뒤 더한 회차(변경분에만 있고 event 행이 없는 회차)도 같은 404다 [가정](판매 승인 뒤 event 행이 되면 고친다, 추천 적용, 2026-11-10, 리뷰, ADR-0261 결정 12)" }
        '409': { $ref: '#/components/responses/Problem', description: "open-too-close: 공개 중인 다른 공연과 오픈 5분 안(확장 칸 suggestedOpenAt), open-maintenance-window: 수요일 정비 창, production-suspended: 판매 중지 중인 공연, sale-setting-locked: 오픈 뒤에 바꿀 수 없는 칸을 바꾸려 함" }
        '412': { $ref: '#/components/responses/Problem', description: "precondition-failed: 다른 사람이 먼저 고침" }
        '422': { $ref: '#/components/responses/Problem', description: "event-schedule-invalid: 회차 일정 순서가 틀림, queue-order-invalid: lobbyShuffle과 openBatch를 둘 다 끔, sale-policy-invalid: 1인 한도를 고친 뒤 그 공연 회차에 걸린 판매 정책 규칙의 한도보다 작은 1인 한도가 있음(고친 뒤 상태 전체로 본다, 확장 칸 errors의 code LIMIT_ABOVE_EVENT, ADR-0261 결정 4·13, 추천 적용, 2026-11-10, 리뷰)" }
        '428': { $ref: '#/components/responses/Problem', description: "precondition-required: If-Match 없음" }
  /v1/partner/merch-order-stats:
    get:
      operationId: listPartnerMerchOrderStats
      tags: [partner]
      x-peaket-roles: [partner_admin, partner_member]
      summary: "굿즈 주문 현황 집계(SCR-023: 타일·상품별 표·일자별 주문, 개인정보 없음)"
      description: "FR-024, POL-016, SCR-023, docs/planning/03 §3 '굿즈·부가 상품 주문' 파트너 R(주문 현황), docs/design/d5 §1.6 16번. 소속 파트너의 주문(merch_order.promoter_id)만 센다. 개수만 내고 구매자 값은 없다. 반품은 판매자가 도착을 확인한 건(RETURN_RECEIVED와 그 뒤 상태)만 센다(SCR-023). items는 상품별 표이고 커서로 나눈다. totals·daily는 페이지마다 같은 값이다. [가정] 대상은 굿즈(ticket_linked 거짓)다(화면의 수령 방식이 택배·현장 수령 둘이다). [가정] from·to(KST 날짜)가 없으면 최근 30일이고 92일을 넘으면 400이다. 정렬은 주문 수 많은 순 [가정]. Cache-Control: no-store"
      security:
        - partnerCookie: []
      parameters:
        - { name: from, in: query, required: false, description: "주문 날짜(KST) 시작", schema: { type: string, format: date } }
        - { name: to, in: query, required: false, description: "주문 날짜(KST) 끝, 그날 포함", schema: { type: string, format: date } }
        - { name: linkedProductionId, in: query, required: false, description: "연결 공연", schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: 집계
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartnerMerchOrderStatsPage' }
        '400': { $ref: '#/components/responses/Problem', description: "from이 to보다 늦거나 기간이 92일을 넘음" }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/partner/merch-order-items:
    get:
      operationId: listPartnerMerchOrderItems
      tags: [partner]
      x-peaket-roles: [partner_admin, partner_member]
      summary: "배송·반품 처리 목록(SCR-023, 주문 항목 단위, 받는 분은 가린 값만)"
      description: "FR-024, POL-016·037, SCR-023, docs/planning/03 §2.13, docs/design/d5 §1.6 16번. 소속 파트너의 주문 항목만 준다(merch_order.promoter_id, authz-matrix §3.3). 상태 전이가 항목 단위라 한 줄이 항목 하나다(주문으로 묶는 값은 orderId). 택배 주문의 받는 분은 가린 이름·휴대폰만 싣고(김*민, 010-****-1234. docs/design/d5 SCR-027 명단과 같은 모양 [가정]) 주소는 싣지 않는다. 원문은 주문별 보기 GET /v1/partner/merch-orders/{orderId}/delivery다. 배송 완료 뒤 3개월이 지나면 recipient는 null이다(docs/planning/03 POL-023). 현장 수령·이용권 항목에는 받는 분 값이 없다(POL-016). 커서 페이징. Cache-Control: no-store"
      security:
        - partnerCookie: []
      parameters:
        - { name: status, in: query, required: false, style: form, explode: false, description: "항목 상태(쉼표로 여러 값)", schema: { type: array, items: { type: string, enum: [READY, SHIPPED, DELIVERED, PICKED_UP, LOCKED, RETURN_REQUESTED, RETURN_RECEIVED, DISPUTED, CANCELLED, REFUNDED] } } }
        - { name: fulfillment, in: query, required: false, description: "수령 방식", schema: { type: string, enum: [DELIVERY, PICKUP, WALLET] } }
        - { name: productId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: false, description: "주문 날짜(KST) 시작", schema: { type: string, format: date } }
        - { name: to, in: query, required: false, description: "주문 날짜(KST) 끝, 그날 포함", schema: { type: string, format: date } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: 주문 항목 한 페이지
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartnerMerchOrderItemPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/partner/merch-orders/{orderId}/delivery:
    get:
      operationId: getPartnerMerchOrderDelivery
      tags: [partner]
      x-peaket-roles: [partner_admin, partner_member]
      summary: "주문별 배송지 보기(받는 분 이름·연락처·주소, 제3자 제공 동의 범위)"
      description: "POL-016·023·037, FR-024, SCR-023, docs/planning/03 §3 '주문별 배송지는 동의 범위', docs/security/data-classification.md '파트너 제공 굿즈 배송 명단', docs/design/d5 §1.6 16번. 소속 파트너의 택배 주문만 준다. 동의 범위 항목(받는 분 이름·연락처·배송 주소)만 싣고 구매 계정·결제 값은 없다. 열람은 개인정보 접속기록에 남긴다(FR-064). 배송 완료 뒤 3개월(동의에 적은 보유 기간)이 지나면 410이다. [가정] 배송 완료 기록이 없으면 송장 등록일 + 14일을 배송 완료로 본다(settlement 정산 기준일과 같은 대체값). Cache-Control: no-store"
      security:
        - partnerCookie: []
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 배송지
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartnerMerchDeliveryAddress' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Problem', description: "not-found: 없는 주문·다른 파트너 주문·택배가 아닌 주문(같은 응답, 개인정보가 든 기록이라 있는지 알리지 않는다)" }
        '410': { $ref: '#/components/responses/Problem', description: "retention-ended: 배송 완료 뒤 3개월이 지남" }
  /v1/partner/merch-order-items/{itemId}/shipment:
    put:
      operationId: putPartnerMerchOrderItemShipment
      tags: [partner]
      x-peaket-roles: [partner_admin, partner_member]
      summary: "송장 등록·고치기(한 건)"
      description: "POL-016·037, SCR-023, docs/planning/03 §2.13 I3, docs/design/d5 §1.6 16번. 소속 파트너의 택배 항목만 받는다. READY면 SHIPPED로 바꾼다. 에스크로 주문의 송장 등록은 결제사 배송 정보 등록으로 이어진다(payment.md 에스크로). [가정] 잘못 넣은 송장은 SHIPPED에서 배송 완료 전까지 다시 보내 고친다(그래서 PUT이다). [가정] 결제사 배송 정보 등록은 커밋 뒤 작업으로 다시 시도하고, 그 실패로 이 응답을 실패시키지 않는다. [가정] 택배사 코드 목록은 택배 조회 연동 업체를 정할 때(wbs 7.1.1) 함께 정한다. docs/data.md tracking_no 한 칸에 택배사와 번호를 함께 담는다. 동시 수정은 If-Match이고 값은 목록의 version이다"
      security:
        - partnerCookie: []
      parameters:
        - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PartnerMerchShipmentInput' }
      responses:
        '200':
          description: 등록됨
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartnerMerchItemState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Problem', description: "not-found: 없는 항목과 다른 파트너 항목(같은 응답)" }
        '409': { $ref: '#/components/responses/Problem', description: "merch-item-state-conflict: 택배 항목이 아니거나 이미 배송 완료·취소된 항목" }
        '412': { $ref: '#/components/responses/Problem', description: "precondition-failed: 다른 사람이 먼저 고침" }
        '428': { $ref: '#/components/responses/Problem', description: "precondition-required: If-Match 없음" }
  /v1/partner/merch-shipment-imports:
    post:
      operationId: createPartnerMerchShipmentImport
      tags: [partner]
      x-peaket-roles: [partner_admin, partner_member]
      summary: "송장 CSV 묶음 등록(행별 결과)"
      description: "POL-016·037, SCR-023, docs/design/d5 §1.6 16번. 소속 파트너의 항목만 반영한다(다른 파트너 항목은 없는 항목과 같은 NOT_FOUND 행). 행마다 PUT …/shipment와 같은 규칙으로 본다. [가정] CSV는 UTF-8이고 머리 줄이 itemId,carrier,trackingNo다(itemId는 배송 명단에 함께 내는 항목 번호). [가정] 5MB·5,000행까지, 행마다 따로 반영해 실패 행만 돌려준다. 올린 파일은 저장하지 않는다. 파일 자체를 읽지 못하면 422이고 어느 이유인지는 Problem detail에 적는다"
      security:
        - partnerCookie: []
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: 행별 결과
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartnerMerchShipmentImportResult' }
        '400': { $ref: '#/components/responses/Problem', description: "본문 형식 오류, idempotency-key-invalid" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Problem', description: "idempotency-request-in-progress(같은 요청을 처리 중)" }
        '413': { $ref: '#/components/responses/Problem', description: "파일이 너무 큼" }
        '422': { $ref: '#/components/responses/Problem', description: "idempotency-key-reused, 머리 줄·인코딩이 맞지 않거나 행 수를 넘은 파일" }
  /v1/partner/merch-order-items/{itemId}/arrival-confirmation:
    post:
      operationId: createPartnerMerchOrderItemArrivalConfirmation
      tags: [partner]
