        '401': { $ref: '#/components/responses/Unauthorized', description: "액세스 토큰 없음·만료" }
        '403': { $ref: '#/components/responses/Problem', description: "허용 역할이 아님" }
        '404': { $ref: '#/components/responses/Problem', description: "없는 계정, 그 계정의 주문이 아닌 orderId(not-found)" }
        '410': { $ref: '#/components/responses/Problem', description: "retention-ended(탈퇴·보존 기간 끝으로 값을 지움)" }
        '422': { $ref: '#/components/responses/Problem', description: "사유 없음·너무 짧음, 주문에 없는 칸을 고름(EMAIL에 orderId)" }
        '429': { $ref: '#/components/responses/TooManyRequests', description: "하루 한도 초과" }
        '503': { $ref: '#/components/responses/ServiceUnavailable', description: "접속기록을 남기지 못함. 원문을 주지 않는다" }
