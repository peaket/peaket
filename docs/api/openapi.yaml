    post: { operationId: createIdentityMergeProposalConfirmation, tags: [identity], x-peaket-roles: [fan], x-peaket-trace-rare: true, summary: 병합 확인(재인증 토큰 필요). 흡수 계정 잠금·세션 종료 뒤 데이터 이동 시작, description: "FR-048, POL-034. 막는 사유가 있으면 409(type merge-blocked, 본문 blockers. 두 계정에 같은 종류의 다른 로그인 수단이 있어 막으면 본문 sameKindProviders도 준다, 소유자 결정 2026-11-05, OPEN[21] 추천 적용), 흡수 계정에 티켓·후기가 있으면 409(type merge-invariant-violated, SEV3). 세 서비스 확인이 답하지 않으면 503과 Retry-After. 되돌리기 없음, 두 계정에 알림(docs/features/identity.md §2.1 '계정 병합의 첫 구현', 추천 적용 2026-11-04)", security: [{ fanCookie: [] }], parameters: [{ name: proposalId, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/ReauthToken' }], responses: { '202': { description: 병합 시작 }, '404': { $ref: '#/components/responses/Problem', description: "없음·만료·제안한 계정이 아님(merge-proposal-not-found). 제안 뒤 본인확인으로 대표 계정이 바뀌었거나 추가하려던 로그인 수단이 다른 계정에서 떨어졌으면 제안을 지우고 404다(다시 추가하면 새 제안)" }, '503': { $ref: '#/components/responses/Problem', description: "purchase·ticket·core의 CheckAccountMerge가 답하지 않음(Retry-After)" }, '403': { $ref: '#/components/responses/Problem', description: "재인증 없음·만료·재사용(REAUTH_REQUIRED)" }, '409': { $ref: '#/components/responses/Problem', description: "막는 사유(진행 중 홀드·세션 ACTIVE_PURCHASE_SESSION·결제 PENDING_PAYMENT, 합산 한도 초과 QUOTA_EXCEEDED, 둘 다 본인확인 BOTH_VERIFIED, 흡수 계정의 탈퇴·대표 계정의 탈퇴 유예 WITHDRAWAL_IN_PROGRESS·이의 제기 계류 APPEAL_PENDING, 입장 시작~입장 기록 마감 사이 회차의 티켓 ENTRY_STARTED, ADR-0088, 두 계정에 같은 종류의 다른 로그인 수단 SAME_PROVIDER_KIND(소유자 결정 2026-11-05, OPEN[21] 추천 적용). 코드는 MergeProposal.blockers와 같다, 2026-10-30 적음)" } } }
  /v1/partner/auth/sessions:
    post: { operationId: createPartnerAuthSession, tags: [partner], x-peaket-roles: [public], security: [], summary: 파트너 로그인 1단계(이메일·비밀번호) → 2단계 TOTP. 실패 제한·사람 확인, description: "FR-021, POL-020, ADR-0119(추천 적용 2026-10-28). 파트너 콘솔 화면이 partner-api로 바로 부르고 gw-partner가 identity의 관리 계정 로그인으로 넘긴다(관제 /v1/ops/auth/sessions와 같은 모양, Auth.js Credentials 없음). TOTP까지 맞으면 gw-partner 응답이 파트너 액세스 토큰 쿠키(__Secure-peaket_partner_at)와 리프레시 토큰 쿠키(__Secure-peaket_partner_rt)를 준다. 본문에 토큰 없음. JSON 본문이라 다른 출처면 사전 요청이 생기고 gw-partner가 Origin(파트너 콘솔 출처)을 확인한다", requestBody: { required: true, content: { application/json: { schema: { oneOf: [{ $ref: '#/components/schemas/AdminLoginPasswordStep' }, { $ref: '#/components/schemas/AdminLoginSecondStep' }] } } } }, responses: { '200': { description: "TOTP 필요(1단계 통과, 본문 AdminLoginStep), 또는 로그인 완료(2단계 통과, 쿠키 둘)", headers: { Set-Cookie: { description: "2단계 통과 때만: 액세스·리프레시 토큰 쿠키 둘(docs/features/identity.md §3 쿠키 표)", schema: { type: string } } }, content: { application/json: { schema: { oneOf: [{ $ref: '#/components/schemas/AdminLoginStep' }, { $ref: '#/components/schemas/AdminLoginDone' }] } } } }, '400': { $ref: '#/components/responses/Problem', description: "본문 형식 오류" }, '401': { $ref: '#/components/responses/Problem', description: "admin-login-failed: 이메일이나 비밀번호가 맞지 않는다. remainingAttempts·humanCheckRequired를 싣는다. 없는 이메일도 같은 응답이다(auth-controls §2.2, 추천 적용 2026-11-05). 2단계: admin-login-step-invalid(loginStep이 없거나 썼거나 지났다, 처음부터 다시), admin-login-code-invalid(인증 앱 코드·복구 코드가 틀렸다, remainingAttempts, BOT-120)" }, '428': { $ref: '#/components/responses/Problem', description: "human-check-required: 사람 확인이 필요한데 토큰이 없거나 틀렸다. 실패로 세지 않는다(auth-controls §2.3)" }, '429': { $ref: '#/components/responses/TooManyRequests', description: "admin-login-busy: 같은 계정(없는 이메일도 같다)의 다른 로그인 시도가 처리 중이다. 세지 않는다. Retry-After 1초. 웹 ACL·게이트웨이 한도 초과도 429다(추천 적용 2026-11-05)" }, '503': { $ref: '#/components/responses/ServiceUnavailable', description: "human-check-unavailable(사람 확인 서비스에 닿지 못함, 사람 확인이 필요한 로그인만), admin-login-unavailable(실패 셈 저장소·페퍼 키 서비스·TOTP 시드 키 서비스에 닿지 못함, local·ci에서 TOTP 시드 키나 관리 토큰 키를 두지 않음). Retry-After" }, '423': { $ref: '#/components/responses/Problem', description: "잠김(admin-account-locked, lock·retryAfterSeconds). 시간 잠금(15분, 풀린 뒤 24시간 안에 다시면 1시간 [가정])이면 Retry-After와 함께 업무 이메일로 해제 링크를 보냈다고만 알리고, 보호 잠금이면 운영자 재초대를 안내한다. 같은 출발지 묶음의 잠금도 423이다(POL-020, 추천 적용 2026-10-28, 기술 검토 중간-052). 해제는 POST /v1/partner/auth/unlocks, 다시 받기는 POST /v1/partner/auth/unlock-links다. 없는 이메일도 같은 응답이다(추천 적용 2026-10-30, docs/security/auth-controls.md §2.2·§3.3)" } } }
  /v1/partner/auth/sessions/me:
    delete: { operationId: deleteMyPartnerAuthSession, tags: [partner], x-peaket-roles: [partner_admin, partner_member], summary: "파트너 로그아웃(지금 세션 끝내기)", description: "FR-021, POL-020, 추천 적용 2026-10-29, ADR-0145 결정 2. 로그인 POST /v1/partner/auth/sessions와 짝이고, me는 로그인한 사람의 지금 세션이다(guidelines §10). 파트너 콘솔 화면이 partner-api로 바로 부르고, 로그인·갱신처럼 gw-partner 응답이 쿠키를 다룬다(ADR-0119). identity-svc가 그 세션을 끝내고 세션 종료 사건(asyncapi control.sessions-terminated, reason LOGOUT)을 낸다. 응답은 이 앱의 쿠키 둘(__Secure-peaket_partner_at, __Secure-peaket_partner_rt)만 같은 이름·Domain·Path에 Max-Age=0을 단 Set-Cookie로 지운다. Clear-Site-Data는 보내지 않는다. 그 값은 같은 등록 도메인의 다른 앱 로그인까지 끊기 때문이다(docs/features/identity.md §3, docs/frontend.md §5.14.4, FE-T34). 쿠키로 인증하는 쓰기라 gw-partner가 Origin(파트너 콘솔 출처)을 확인한다(guidelines §9)", security: [{ partnerCookie: [] }], responses: { '204': { description: "로그아웃됨", headers: { Set-Cookie: { description: "__Secure-peaket_partner_at·__Secure-peaket_partner_rt를 같은 이름·Domain·Path, Max-Age=0으로", schema: { type: string } } } }, '401': { $ref: '#/components/responses/Unauthorized', description: "액세스 토큰 없음·만료" } } }
  /v1/partner/auth/access-tokens:
    post: { operationId: createPartnerAuthAccessToken, tags: [partner], x-peaket-roles: [partner_admin, partner_member], summary: "파트너 액세스 토큰 갱신(리프레시 토큰 쿠키, 회전·재사용 탐지)", description: "FR-021, POL-019, POL-020, ADR-0011(추천 적용 2026-10-15, ADR-0065 결정 11). 파트너 액세스 토큰(15분)을 유휴 만료(1시간)와 절대 만료(24시간) 안에서만 새로 준다. 지났으면 401이고 비밀번호와 TOTP로 다시 로그인한다. 재사용 탐지 시 패밀리 전체 폐기 + 세션 종료 이벤트(응답을 잃은 재시도의 30초 [가정] 유예는 팬 갱신과 같다, 기술 검토 중간-053). 본문이 없어 사전 요청이 생기지 않으므로 gw-partner가 Origin(파트너 콘솔 출처)을 확인한다", security: [{ partnerRefreshCookie: [] }], responses: { '204': { description: "새 쿠키(__Secure-peaket_partner_at, __Secure-peaket_partner_rt). 본문에 토큰 없음" }, '401': { $ref: '#/components/responses/Unauthorized', description: "재사용 탐지·유휴 또는 절대 만료·다른 콘솔의 쿠키(refresh-token-invalid). 이 콘솔의 쿠키 둘을 Max-Age=0으로 지운다" } } }
  /v1/partner/auth/unlocks:
    post: { operationId: createPartnerAuthUnlock, tags: [partner], x-peaket-roles: [public], x-peaket-trace-rare: true, security: [], summary: "파트너 계정 시간 잠금 본인 해제(업무 이메일 해제 링크 + 인증 앱 코드나 복구 코드)", description: "FR-021, POL-020. 정본은 docs/security/auth-controls.md §3.3이다. 코드가 맞으면 시간 잠금만 풀린다. 계정·출발지 묶음 잠금, 2단계 실패 수, 비밀번호 연속 실패 누계는 그대로이고, 그 뒤 비밀번호와 TOTP로 다시 로그인한다. 코드가 틀리면 2단계 실패 수에 세고, 한 링크는 3번 [가정] 틀리면 무효다. 2단계 실패 수가 5 [가정]에 닿으면 보호 잠금이 걸린다. 보호 잠금 중에는 해제 링크로 풀 수 없다(운영자 재초대). 화면은 파트너 콘솔 출처라 gw-partner가 Origin을 확인한다(추천 적용 2026-10-30, ADR-0157 결정 6)", requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminUnlockCreate' } } } }, responses: { '204': { description: "시간 잠금을 풀었다" }, '400': { $ref: '#/components/responses/Problem', description: "본문 형식 오류" }, '410': { $ref: '#/components/responses/Problem', description: "링크가 만료됐거나, 이미 썼거나, 코드를 3번 틀렸거나, 새 링크를 받아 무효가 됐다" }, '422': { $ref: '#/components/responses/Problem', description: "코드가 맞지 않는다(2단계 실패 수에 센다)" }, '423': { $ref: '#/components/responses/Problem', description: "보호 잠금이라 해제 링크로 풀 수 없다. 원인은 알리지 않고 운영자 재초대를 안내한다(docs/design/d5 SCR-028 '보호 잠금' 행)" }, '429': { $ref: '#/components/responses/TooManyRequests', description: "웹 ACL·게이트웨이 한도 초과, 또는 admin-login-busy(같은 계정의 다른 시도가 처리 중, 추천 적용 2026-11-05)" }, '503': { $ref: '#/components/responses/ServiceUnavailable', description: "admin-login-unavailable(실패 셈 저장소·페퍼·TOTP 시드 키 서비스에 닿지 못함). Retry-After" } } }
  /v1/partner/auth/unlock-links:
    post: { operationId: createPartnerAuthUnlockLink, tags: [partner], x-peaket-roles: [public], security: [], summary: "파트너 계정 해제 링크 다시 받기", description: "FR-021, POL-020, docs/security/auth-controls.md §3.3. 계정이 있는지, 잠겨 있는지와 상관없이 같은 202를 준다(계정 유무를 알리지 않는다, auth-controls §2.2). 시간 잠금 중인 계정에만 업무 이메일로 새 링크를 보내고, 새 링크를 보내면 옛 링크는 무효다. 보호 잠금 중이면 보내지 않는다. 다시 받기는 이메일마다 1시간에 3번 [가정]까지이고 없는 이메일도 같은 수로 센다(추천 적용 2026-10-30, ADR-0157 결정 5·6)", requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminUnlockLinkCreate' } } } }, responses: { '202': { description: "받았다(보냈는지는 알리지 않는다)" }, '400': { $ref: '#/components/responses/Problem', description: "본문 형식 오류" }, '429': { $ref: '#/components/responses/TooManyRequests', description: "그 이메일의 다시 받기가 1시간에 3번 [가정]을 넘었다(unlock-link-resend-limit). 메일은 나가지 않는다(AC-T5 ⑤)" }, '503': { $ref: '#/components/responses/ServiceUnavailable', description: "admin-login-unavailable(셈 저장소에 닿지 못함). Retry-After" } } }
  /v1/partner/auth/password-changes:
    post: { operationId: createPartnerAuthPasswordChange, tags: [partner], x-peaket-roles: [partner_admin, partner_member], x-peaket-trace-rare: true, summary: "파트너 계정 비밀번호 바꾸기", description: "FR-021, POL-020, docs/security/auth-controls.md §3.5·§4. 지금 비밀번호가 틀리면 로그인 실패와 같이 계정 실패 수와 비밀번호 연속 실패 누계에 센다(auth-controls §3.1 '비밀번호가 틀릴 때'). 바꾸면 이 세션은 이어지고 그 계정의 다른 세션을 모두 끝낸다(asyncapi control.sessions-terminated, reason PASSWORD_CHANGED). 비밀번호만 맞은 로그인이나 유출 목록 재확인 때문에 비밀번호 바꾸기와 로그아웃만 허용된 세션(scope 제한)이면, 응답이 제한을 푼 새 액세스 토큰 쿠키를 준다. 그 세션으로 다른 관리 경로를 부르면 403 password-change-required다(AC-T4). 쿠키로 인증하는 쓰기라 gw-partner가 Origin을 확인한다(추천 적용 2026-10-30, ADR-0157 결정 4)", security: [{ partnerCookie: [] }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminPasswordChangeCreate' } } } }, responses: { '204': { description: "바꿨다. scope 제한 세션이었으면 새 쿠키(__Secure-peaket_partner_at)를 준다" }, '400': { $ref: '#/components/responses/Problem', description: "본문 형식 오류(길이 밖)" }, '401': { $ref: '#/components/responses/Unauthorized', description: "액세스 토큰 없음·만료" }, '404': { $ref: '#/components/responses/Problem', description: "그 사이 관리 계정이 지워졌거나 쓸 수 없게 됐다(not-found)" }, '422': { $ref: '#/components/responses/Problem', description: "지금 비밀번호가 틀렸다(current-password-invalid), 또는 새 비밀번호가 지금 것과 같거나 흔한 비밀번호·맥락 말·유출 목록에 걸렸다(password-rejected: 걸린 이유 종류 reason과 안내 문구를 싣는다, AC-T6·AC-T7)" }, '423': { $ref: '#/components/responses/Problem', description: "잠김(admin-account-locked): 보호 잠금(운영자 재초대)이거나 시간 잠금·묶음 잠금(Retry-After). 잠긴 동안은 지금 비밀번호를 보지 않고 세지 않는다" }, '429': { $ref: '#/components/responses/Problem', description: "같은 계정의 로그인·비밀번호 바꾸기가 처리 중이다(admin-login-busy, Retry-After)" }, '503': { $ref: '#/components/responses/ServiceUnavailable', description: "유출 목록 조회에 닿지 못했다. 새 비밀번호를 저장하지 않는다(AC-T7 ②)" } } }
  /v1/partner/auth/reauthentications:
    post: { operationId: createPartnerAuthReauthentication, tags: [partner], x-peaket-roles: [partner_admin, partner_member], summary: "파트너 관리 계정 재인증(비밀번호·인증 앱 코드, 요청하면 패스키 확인까지) → 재인증 토큰", description: "FR-021, POL-020, ADR-0206(추천 적용 2026-11-05, BUILD_ORDER BOT-122). 정산 계좌 변경·명단 내려받기·내 패스키 등록과 지우기 직전에 부른다. 1단계(PartnerReauthPasswordStep)는 비밀번호와 인증 앱 코드(TOTP)를 확인하고, 틀리면 로그인 실패처럼 센다(docs/security/auth-controls.md §3.1). withPasskey가 거짓이면 바로 재인증 토큰을 준다(factors password·totp). 참이면 패스키 확인 옵션과 reauthStep을 주고, 2단계(AdminReauthPasskeyStep)에서 그 계정 패스키의 서명이 맞으면 factors password·totp·passkey 토큰을 준다. 서명은 사용자 확인 표시가 있어야 하고, RP ID는 partner.peaket.example, 출처는 파트너 콘솔 출처 하나다. 토큰(typ reauth+jwt, 5분 한 번, 그 세션 sid와 작업 묶음 act에 묶임)은 본문에 있고 화면이 X-Reauth-Token으로 보낸다(guidelines §7). 그 작업에 패스키가 필요한지는 받는 서비스가 본다(docs/security/authz-matrix.md §6). Cache-Control: no-store. 쿠키로 인증하는 쓰기라 gw-partner가 Origin을 확인한다. 정본은 docs/features/identity.md §6 '관리 계정 패스키의 첫 구현'", security: [{ partnerCookie: [] }], requestBody: { required: true, content: { application/json: { schema: { oneOf: [{ $ref: '#/components/schemas/PartnerReauthPasswordStep' }, { $ref: '#/components/schemas/AdminReauthPasskeyStep' }] } } } }, responses: { '200': { description: "패스키 확인이 필요함(AdminReauthPasskeyChallenge), 또는 재인증 토큰(AdminReauthDone)", content: { application/json: { schema: { oneOf: [{ $ref: '#/components/schemas/AdminReauthPasskeyChallenge' }, { $ref: '#/components/schemas/AdminReauthDone' }] } } } }, '400': { $ref: '#/components/responses/Problem', description: "본문 형식 오류(이 콘솔이 받지 않는 작업 묶음 포함)" }, '401': { $ref: '#/components/responses/Unauthorized', description: "액세스 토큰 없음·만료, 또는 그 사이 끝난 세션" }, '403': { $ref: '#/components/responses/Problem', description: "비밀번호 바꾸기 필요 세션(password-change-required)" }, '409': { $ref: '#/components/responses/Problem', description: "withPasskey인데 등록한 패스키가 없다(passkey-not-registered). 비밀번호를 보기 전에 답한다" }, '410': { $ref: '#/components/responses/Problem', description: "2단계: reauthStep이 없거나 썼거나 지났거나