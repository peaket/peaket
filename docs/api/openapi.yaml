  /v1/scanner/events/{eventId}/devices:
    get: { tags: [scanner], summary: "이 회차 같은 파트너 기기 목록과 준비 상태(현장 책임자)", description: "FR-066, SCR-052", security: [{ deviceMtls: [], staffToken: [] }], parameters: [{ $ref: '#/components/parameters/EventId' }], responses: { '200': { description: 기기, content: { application/json: { schema: { $ref: '#/components/schemas/GateStatus' } } } }, '403': { $ref: '#/components/responses/Problem', description: 책임자 아님 } } }
