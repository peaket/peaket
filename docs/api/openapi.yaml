      description: "FR-006, FR-039, POL-003. 공연 상세에서 미리 호출. 만료가 가까우면 조용히 갱신. 본문에 사람 확인 토큰과 행동 신호 요약을 함께 보내고 trust-svc가 위험 점수를 낸다(행동 신호 요약을 보내는 경로, 추천 적용 2026-10-15, ADR-0065 결정 9). 교차 출처 JSON이라 사전 요청이 붙는다"
      security: [{ fanCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/EventId' }, { $ref: '#/components/parameters/FirstVisitCookie' }]
      requestBody: { required: true, content: { application/json: { schema: { additionalProperties: false, type: object, properties: { humanCheckToken: { type: string, description: "Cloudflare Turnstile 응답 토큰(300초 1회용, trust-svc가 서버 검증)" }, deviceId: { type: string }, preverifyToken: { type: string, description: "갱신할 때 지금 가진 사전 검증 토큰. 서명이 맞고 회차·계정·기기가 같고 만료 전이면 최초 발급 시각과 여정 ID(jny)를 그대로 옮긴다. 없거나 맞지 않으면 새 여정(추천 적용 2026-11-03, queue-admission §3 '첫 구현의 세부')" }, behaviorSummary: { $ref: '#/components/schemas/BehaviorSummary' } } } } } }
      responses:
        '201': { content: { application/json: { schema: { $ref: '#/components/schemas/PreverifyResult' } } }, description: "preverifyToken. 위험 점수가 높으면 '추가 검증 필요' 표시를 서명해 넣고, 진입 때 번호를 발급하고 대기표의 verification: REQUIRED로 추가 검증에 보낸다(추천 적용 2026-10-14, ADR-0062. 303 대신 본문 필드, ADR-0079 결정 4). 요청에 최초 방문 쿠키가 없으면 대기열 API 엣지 함수가 이 응답에 __Host-peaket_fv를 싣는다(ADR-0065 결정 9)", headers: { Set-Cookie: { description: "__Host-peaket_fv(쿠키가 없던 브라우저에만)", schema: { type: string } } } }
        '400': { $ref: '#/components/responses/Problem', description: "본문 형식 오류(행동 신호 요약의 범위 밖 값 포함)" }
        '403': { $ref: '#/components/responses/Problem', description: "identity-verification-required: 본인확인 전(pid 없음, 추천 적용 2026-11-03). 구매 권한(ticket:buy)이 없는 토큰은 게이트웨이가 먼저 거절한다" }
        '404': { $ref: '#/components/responses/Problem', description: "queue-not-found: 이 회차의 대기열이 열리지 않았다(회차 일정 사본 q:{event:E}:cfg가 없음, 추천 적용 2026-11-03)" }
  /v1/queues/{eventId}/entries:
    post:
      operationId: createQueueEntry
      tags: [queue]
      x-peaket-roles: [fan]
      summary: 대기열 진입(오픈 후, 대기표 발급)
      description: "FR-006. 사전 검증 토큰 + 구매 권한 + pid 중복 확인 → INCR 순번. 오픈 직후 동시 도착 구간(2초 [가정])에 오픈 전 발급 토큰으로 도착하면 202 BATCHING + 결과 파일 경로(묶음 무작위, ADR-0041). T=0 피크 20만 RPS(NFR-001). PREQUEUE_SHUFFLE 공연(로비 셔플 켬·오픈 직후 묶음 끔, ADR-0118)도 오픈 뒤 진입을 받고 동시 도착 묶음 없이 로비 참가자 전원 뒤에 도착 순으로 번호를 준다(오픈 뒤 410 거절을 없앰, 소유자 결정 2026-10-14, ADR-0064). 202 BATCHING은 openBatch를 켠 회차에서만 나온다. 그 회차의 판매 종료(공연 시작 24시간 전) 뒤에는 모든 정렬 방식에서 410 sale-ended"
      security: [{ fanCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/EventId' }]
      requestBody: { description: "본문은 JSON이다. 브라우저는 CORS 사전 요청이 생기지 않도록 같은 JSON 문자열을 `Content-Type: text/plain;charset=UTF-8`로 보내고 safelisted가 아닌 헤더(추적 헤더 포함)를 붙이지 않는다. 서버는 이 경로에서 text/plain과 application/json만 받고(그 밖 415) 본문을 JSON으로 검사한다. 위조 방지는 본문의 사전 검증 토큰, 게이트웨이의 Origin 확인(guidelines §9), SameSite=Strict 쿠키가 맡는다(추천 적용 2026-10-15, ADR-0065 결정 6)", content: { application/json: { schema: { $ref: '#/components/schemas/QueueEntryRequest' } }, text/plain: { schema: { type: string, contentMediaType: application/json, contentSchema: { $ref: '#/components/schemas/QueueEntryRequest' } } } } }
      responses:
        '201': { description: "대기표. 추가 검증 필요 표시가 있으면 verification: REQUIRED(ADR-0079 결정 4)", content: { application/json: { schema: { $ref: '#/components/schemas/QueueTicket' } } } }
        '202': { description: "BATCHING(동시 도착 구간 묶음, ADR-0041). 받는 규칙은 셔플 결과와 같다(ADR-0058)", content: { application/json: { schema: { $ref: '#/components/schemas/BatchingResponse' } } } }
        '403': { $ref: '#/components/responses/Problem', description: "preverify-invalid: 본문의 사전 검증 토큰의 서명·회차·계정·기기·만료가 맞지 않음(대기표를 내지 않는다, 사전 검증을 다시 받는다. 토큰 칸이 아예 없으면 본문 형식 오류 400). identity-verification-required: 본인확인 전(pid 없음). 추천 적용 2026-11-03" }
        '404': { $ref: '#/components/responses/Problem', description: "queue-not-found: 이 회차의 대기열이 열리지 않았다(회차 일정 사본이 없음, 추천 적용 2026-11-03)" }
        '409': { $ref: '#/components/responses/Problem', description: "already-waiting: 이미 대기 중(1인 1순번). already-admitted: 이 회차에 이미 입장함(ALREADY_ADMITTED, 다시 줄 설 수 없음, ADR-0062. 선점과 번호 기록 사이에 입장한 경우도 같다). queue-not-open: 오픈 전(추천 적용 2026-11-03)" }
        '410': { description: "매진(엣지 정적 응답, Problem type sold-out, ADR-0081. 엣지 응답이 퍼지기 전에 원본에 온 진입도 queue-svc가 같은 sold-out으로 거절한다. 일시 매진(ALL_HELD)은 410이 아니고 번호를 발급한다, ADR-0122), 또는 그 회차의 판매 종료(공연 시작 24시간 전) 뒤 진입(Problem type sale-ended, 별칭 SALE_ENDED. 번호를 발급하지 않음, ADR-0064)", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '415': { $ref: '#/components/responses/Problem', description: "text/plain·application/json이 아닌 본문(ADR-0065)" }
        '429': { $ref: '#/components/responses/TooManyRequests', description: "기기당 로컬 한도 초과(게이트웨이 파드별 토큰 버킷, guidelines §6), 또는 queue-svc 파드의 자기 과부하(server-busy, 이상 파드 퇴출에 세어지지 않게 503 대신 429, docs/architecture.md §5)" }
        '503': { $ref: '#/components/responses/ServiceUnavailable', description: "차단기·Degraded(Retry-After). 오픈 직후 묶음 구간이 닫히기 전에 오픈 뒤 발급 토큰으로 온 진입도 503이고, Retry-After는 구간이 닫힐 때까지 남은 초의 올림이다(기술 검토 중간-028). 대기열 Redis가 잠시 안 되면 503 dependency-unavailable, Retry-After 1초 [가정]이다(추천 적용 2026-11-03). 묶음 참가자인데 결과 키를 장애 전환으로 잃었으면 503 batching, Retry-After 2초 [가정]이다(admission-ctrl이 같은 결과를 다시 쓴다). 대기열 Redis 장애 전환 뒤 RB-05가 건너뛸 번호를 적기 전이면 503 queue-recovering, Retry-After 1초 [가정]이다(번호를 내지 않고 선점을 푼다, 추천 적용 2026-11-03, ADR-0181)" }
  /v1/queues/{eventId}/entries/me:
