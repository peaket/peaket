      summary: "초대 수락 마치기(복구 코드 보관 확인, 계정 활성화)"
      description: "FR-021, POL-020, identity §6, I-T53 ①, docs/planning/03 §2.7 A2. 비밀번호와 TOTP가 끝났고 partner_admin이면 패스키가 하나 이상 있어야 활성화된다(없으면 409이고 활성화되지 않는다). 한 트랜잭션에서 상태를 ACTIVE로 하고 초대 토큰 해시와 단계 토큰을 지운다. 세션은 만들지 않고 화면은 로그인으로 보낸다(TOTP를 처음부터 다시 거치게) [가정]. displayName을 보내면 초대 때의 표시 이름을 바꾼다(AdminInvitationCreate.displayName). 권한 부여 내역을 3년 남긴다(고시 제5조 제3항). gw-partner가 Origin을 확인한다"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminInvitationCompletionCreate' }
      responses:
        '204':
          description: "활성화했다"
