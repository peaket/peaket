      x-peaket-roles: [public]
      summary: "초대 수락 시작(초대 링크 토큰 확인, 다음 단계 토큰 받기)"
      description: "FR-021, POL-020, identity §6 '계정 발급 절차'·§13, SCR-020 ④, ADR-0206. 초대 토큰은 링크의 URL 조각(#token=)에만 있고 화면이 읽자마자 주소에서 지운 뒤 이 본문으로 보낸다(guidelines §9). 토큰이 맞으면 수락 단계 토큰 acceptanceStep을 준다. 뒤 단계는 세션과 재인증 토큰이 없으므로 이 값이 자격이다. 단계 토큰은 SHA-256만 저장하고 수명은 30분 [가정], 수락마다 하나이며 단계마다 바뀌지 않는다 [가정]. 링크로 다시 시작하면 앞서 저장한 비밀번호·대기 시드·TOTP·복구 코드·패스키를 지우고 처음부터 한다(남이 링크로 넣어 둔 값을 이어 쓰지 않게) [가정]. 없는 토큰, 쓴 토큰, 지난 토큰, 새 재초대로 무효가 된 토큰, 다른 콘솔의 계정(이 경로는 파트너 역할만), 지운 계정, 이미 활성인 계정은 모두 같은 410이다. 초대 토큰은 완료 때 지운다. gw-partner가 Origin을 확인한다. 공개 작업이라 Idempotency-Key를 받지 않는다(guidelines §4 공용 멱등 모듈). Cache-Control: no-store"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminInvitationAcceptanceCreate' }
      responses:
        '201':
          description: "수락 단계 시작"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminInvitationAcceptance' }
        '400': { $ref: '#/components/responses/Problem', description: "본문 형식 오류" }
        '410': { $ref: '#/components/responses/Problem', description: "invitation-invalid" }
        '429': { $ref: '#/components/responses/TooManyRequests', description: "웹 ACL·게이트웨이 한도 초과, admin-login-busy" }
        '503': { $ref: '#/components/responses/ServiceUnavailable', description: "admin-login-unavailable. Retry-After" }
  /v1/partner/auth/invitation-passwords:
    post:
      operationId: createPartnerAuthInvitationPassword
      tags: [partner]
      x-peaket-roles: [public]
      x-peaket-trace-rare: true
      summary: "초대 수락: 비밀번호 만들기"
      description: "FR-021, POL-020, docs/security/auth-controls.md §4, SCR-020 ④. 15자 이상 256자 [가정] 이하이고 조합 규칙은 없다. 흔한 비밀번호·서비스 맥락 말·계정 맥락 말·유출 목록과 대조한다. 비밀번호는 응답에 싣지 않는다. 다음은 TOTP 등록이다. gw-partner가 Origin을 확인한다. Cache-Control: no-store"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminInvitationPasswordCreate' }
      responses:
        '200':
          description: "저장함"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminInvitationProgress' }
        '400': { $ref: '#/components/responses/Problem', description: "본문 형식 오류(길이 밖)" }
        '410': { $ref: '#/components/responses/Problem', description: "invitation-step-invalid(단계 토큰이 없거나 지남)" }
        '422': { $ref: '#/components/responses/Problem', description: "password-rejected(걸린 이유 종류 reason과 안내 문구를 싣는다)" }
        '429': { $ref: '#/components/responses/TooManyRequests', description: "admin-login-busy" }
        '503': { $ref: '#/components/responses/ServiceUnavailable', description: "유출 목록 조회에 닿지 못함(저장하지 않는다), admin-login-unavailable" }
  /v1/partner/auth/invitation-totp-enrollments:
    post:
      operationId: createPartnerAuthInvitationTotpEnrollment
      tags: [partner]
      x-peaket-roles: [public]
      summary: "초대 수락: 인증 앱 등록 시작(otpauth 주소)"
      description: "FR-021, POL-020, identity §6 '관리 계정 TOTP와 로그인 2단계의 첫 구현'(BeginTotpEnrollment), SCR-020 ④. 비밀번호 단계 뒤에만 받는다. 새 시드를 admin_account.totp_pending_enc에 암호화해 두고 otpauth 주소를 이 응답에서만 준다. 화면이 QR로 그리고 secret 값을 설정 키로 보인다. 등록을 확인한 뒤에는 어떤 경로로도 시드를 다시 내지 않는다. 다시 부르면 새 시드로 바뀌고 옛 대기 시드는 무효다. gw-partner가 Origin을 확인한다. Cache-Control: no-store TOTP 확인을 마친 초대에서 다시 부르면 새 시드와 복구 코드를 내지 않고 409다."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminInvitationStepBody' }
      responses:
        '201':
          description: "otpauth 주소"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminInvitationTotpEnrollment' }
        '400': { $ref: '#/components/responses/Problem', description: "본문 형식 오류" }
        '409': { $ref: '#/components/responses/Problem', description: "invitation-step-out-of-order(앞 단계가 안 끝났거나 TOTP 확인을 이미 마침)(비밀번호를 아직 만들지 않음)" }
        '410': { $ref: '#/components/responses/Problem', description: "invitation-step-invalid" }
        '429': { $ref: '#/components/responses/TooManyRequests', description: "admin-login-busy" }
        '503': { $ref: '#/components/responses/ServiceUnavailable', description: "admin-login-unavailable(시드 키 서비스에 닿지 못함)" }
  /v1/partner/auth/invitation-totp-confirmations:
    post:
      operationId: createPartnerAuthInvitationTotpConfirmation
      tags: [partner]
      x-peaket-roles: [public]
      x-peaket-trace-rare: true
      summary: "초대 수락: 인증 앱 코드 확인(복구 코드는 이 응답에서 한 번만)"
      description: "FR-021, POL-020, identity §6(ConfirmTotpEnrollment), SCR-020 ④. 코드가 맞으면 시드를 확정하고 복구 코드 10개 [가정]를 새로 만들어 이 응답에서 한 번만 준다. 서버는 PHC 해시만 두고 다시 내지 않는다. 화면은 메모리에 두었다가 패스키 단계 뒤에 보인다(d5의 순서: 비밀번호 → 인증 앱 → 패스키 → 복구 코드 보관 확인). 새로고침으로 잃으면 수락을 처음부터 다시 한다 [가정]. 틀린 코드는 5번 [가정]까지이고 넘으면 단계 토큰이 무효다. gw-partner가 Origin을 확인한다. Cache-Control: no-store"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminInvitationTotpConfirmationCreate' }
      responses:
        '200':
          description: "확인함, 복구 코드"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminInvitationTotpConfirmed' }
        '400': { $ref: '#/components/responses/Problem', description: "본문 형식 오류" }
        '409': { $ref: '#/components/responses/Problem', description: "invitation-step-out-of-order(등록을 시작하지 않음)" }
        '410': { $ref: '#/components/responses/Problem', description: "invitation-step-invalid(코드 시도 초과 포함)" }
        '422': { $ref: '#/components/responses/Problem', description: "reauth-code-invalid(remainingAttempts를 싣는다)" }
        '429': { $ref: '#/components/responses/TooManyRequests', description: "admin-login-busy" }
        '503': { $ref: '#/components/responses/ServiceUnavailable', description: "admin-login-unavailable" }
  /v1/partner/auth/invitation-passkey-registrations:
    post:
      operationId: createPartnerAuthInvitationPasskeyRegistration
