ption: "investigator-required" }, '404': { $ref: '#/components/responses/Problem', description: "없는 사건" }, '409': { $ref: '#/components/responses/Problem', description: "fraud-case-state(위 받는 상태가 아님, 소명 기한 전, 열린 승인 업무가 있음, 이의 기간이 지남, OBJECTED에서 LIFT_RESTRICTION 밖의 종류, 소명 요청을 받지 않았거나 판단 전(SUBMITTED)인 계정, 취소 대상에서 빠짐을 알린 표를 다시 넣음(fraud-case-state)(추천 적용 2026-10-31, ADR-0173)), cancel-deadline-passed" }, '422': { $ref: '#/components/responses/Problem', description: "사유 없음, 묶음 밖 계정·티켓, RESTRICT의 끝 시각 없음, restriction-too-long(RESTRICT의 끝이 요청 시각 + 1년 [가정] 넘음(추천 적용 2026-10-31, ADR-0173))" } } }
