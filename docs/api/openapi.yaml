webhooks:
  partnerEvent:
    post:
      tags: [partner]
      summary: "파트너 웹훅(PEAKET이 파트너가 등록한 주소로 보냄). 이벤트 8종, 엔드포인트마다 구독한 type만"
      description: "FR-025, ADR-0053, 추천 적용 2026-10-14, ADR-0062. 쓰임새: 매출·회계 시스템에 판매·환급 금액 반영(order.confirmed·order.cancelled), 사내 메신저에 매진·회차 취소·연기 알림(event.sold_out·event.cancelled·event.postponed), 자사 홈페이지·SNS 공지 갱신(같은 이벤트), 정산 통지·입금 확인(statement.notified·payout.completed·payout.failed). 파트너 서버가 PEAKET에 직접 물어볼 서버용 API는 없어 본문의 금액·수·ID만 쓰고 자세한 내용은 콘솔에서 본다(나중 Phase로 미룸, 추천 적용 2026-10-19, ADR-0066). Standard Webhooks 형식이다. 헤더는 webhook-id(사건 키, 재전송에도 같음), webhook-timestamp(시도 시각, 유닉스 초), webhook-signature(v1, 뒤에 base64 HMAC-SHA256(비밀, id.timestamp.본문))다. 등록은 POST /v1/partner/webhooks. 받는 쪽이 2xx로 답하지 않으면 지수 백오프로 다시 보내고 끝내 실패하면 DLQ에 둔다(guidelines §8)"
      parameters: [{ name: webhook-id, in: header, required: true, schema: { type: string } }, { name: webhook-timestamp, in: header, required: true, schema: { type: string } }, { name: webhook-signature, in: header, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PartnerWebhookEvent' } } } }
      responses: { '2XX': { description: "받음" } }
