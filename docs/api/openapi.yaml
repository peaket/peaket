  /v1/partner/productions/{productionId}/images:
    post: { operationId: createPartnerProductionImage, tags: [partner], x-peaket-roles: [partner_admin, partner_member], summary: "공연 이미지 올리기(포스터·상세 이미지, 한 장씩)", description: "FR-022, SCR-021 1단계 CMP-069, ADR-0062 결정 38(추천 적용 2026-10-14, ADR-0063). JPEG·PNG·WebP만, 한 장 10MB, 포스터 1장(가로 800·세로 1,000px 이상 세로형), 상세 0~10장(가로 800px 이상), 긴 변 20,000px·4,000만 화소 상한(수치는 [가정]). 서버가 확장자와 파일 앞부분(매직 바이트)을 함께 보고 디코딩해 화소 수를 확인한 뒤 다시 인코딩해 메타데이터(EXIF·GPS 등)를 지운 파생본만 S3 공개 정적 객체로 낸다. 원본은 공개하지 않는다. 원본 파일 이름은 버리고 서버가 만든 ID로 저장한다. 출연자 사진의 처리 근거는 docs/security/data-classification.md 법률 질문 23번(확인 필요)이다. 포스터를 다시 올리면 이전 포스터를 바꾼다. 판매 승인 뒤 바꿔도 재승인 대상이 아니다(재승인 대상은 가격·회차·좌석 등급·좌석맵·판매 정책, docs/planning/03 §2.14). 파트너 소속 공연만(공연 이미지는 공연에 딸린다, ADR-0093). 디코딩·다시 인코딩은 core-svc가 하지 않고 image-worker(ImageService.ProcessImage)에 맡기며, 처리가 끝난 뒤 응답한다(검사 차례·결과 다시 검사·파생본 게시는 ADR-0257 결정 1~3). 원본은 받지 않으면 바로 지운다", security: [{ partnerCookie: [] }], parameters: [{ $ref: '#/components/parameters/ProductionId' }, { name: X-Requested-With, in: header, required: true, schema: { type: string } }], requestBody: { required: true, content: { multipart/form-data: { schema: { additionalProperties: false, type: object, required: [file, kind, alt], properties: { file: { type: string, format: binary }, kind: { type: string, enum: [POSTER, DETAIL] }, alt: { type: string, minLength: 1, maxLength: 300 }, order: { type: integer, minimum: 0, maximum: 9 } } } } } }, responses: { '201': { description: "올림. ETag 머리가 version이다", content: { application/json: { schema: { $ref: '#/components/schemas/ProductionImage' } } } }, '403': { $ref: '#/components/responses/Problem', description: "파트너 관리자·실무자가 아닌 계정(역할 가드, x-peaket-roles). 다른 파트너 공연은 403이 아니라 없는 것과 같은 404다(ADR-0257 결정 2)" }, '404': { $ref: '#/components/responses/Problem', description: "없는 공연이거나 다른 파트너 공연(not-found, 없는 것과 같다. 회차 더하기와 같은 규칙, ADR-0257 결정 2)" }, '409': { $ref: '#/components/responses/Problem', description: "상세 이미지 10장 초과(image-limit-exceeded)" }, '413': { $ref: '#/components/responses/Problem', description: "10MB 초과(image-too-large)" }, '415': { $ref: '#/components/responses/Problem', description: "JPEG·PNG·WebP가 아니거나 파일 앞부분과 형식·확장자가 다름(image-type-unsupported)" }, '422': { $ref: '#/components/responses/Problem', description: "규격 미달·화소 상한 초과·악성 코드·대체 텍스트 길이(image-spec-invalid). 확장 필드 reason은 POSTER_SPEC(포스터 세로형·최소 크기), DETAIL_SPEC(상세 가로 800px), PIXEL_LIMIT(긴 변 20,000px·4,000만 화소), MALWARE, ALT_INVALID 가운데 하나다" }, '429': { $ref: '#/components/responses/TooManyRequests', description: "파드의 multipart 받기 칸막이(동시 4 [가정])가 찼다(server-busy, Retry-After, 본문을 읽지 않는다, ADR-0257 결정 2)" }, '503': { $ref: '#/components/responses/ServiceUnavailable', description: "이미지 처리 작업이 답하지 않았거나 악성 코드 검사 결과가 아직 없거나 처리 결과가 정한 모양이 아니다(image-processing-unavailable, Retry-After). 원본은 지웠으므로 파일을 다시 보낸다(ADR-0257 결정 1)" }, '504': { $ref: '#/components/responses/Problem', description: "본문을 받느라 남은 시간이 처리에 모자란다(deadline-exceeded, guidelines §5, ADR-0257 결정 2)" } } }
