        orderId: { type: string, description: "주면 그 주문의 예매자 성명·휴대폰 번호를 연다(EMAIL은 주문에 없어 422)" }
        reason: { type: string, minLength: 5, maxLength: 500, description: "열람 사유(접속기록에 남는다, 화면에 '열람 사유'로 되보인다). 개인정보를 적지 않는다" }
    OpsFanUnmasking:
