    get: { operationId: listOpsFraudCases, tags: [investigations], x-peaket-roles: [commander, cs_lead], summary: "사건 목록(SCR-070 ③, 상태·회차 거르기)", description: "FR-073. eventId·status로 거른다(status는 쉼표로 여럿, guidelines §11). 화면은 취소 마감까지 남은 시간(cancelDeadlineAt)을 보인다. 지정 확인과 기록은 태그 investigations 설명(추천 적용 2026-10-31, ADR-0171)", security: [{ opsCookie: [] }], parameters: [{ name: eventId, in: query, required: false, schema: { type: string } }, { name: status, in: query, required: false, style: form, explode: false, schema: { type: array, items: { $ref: '#/components/schemas/FraudCaseStatus' } } }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }], responses: { '200': { description: "사건 한 페이지", content: { application/json: { schema: { $ref: '#/components/schemas/FraudCasePage' } } } }, '400': { $ref: '#/components/responses/Problem', description: "모르는 상태 값, limit 100 초과" }, '403': { $ref: '#/components/responses/Problem', description: "investigator-required" } } }
  /v1/ops/fraud-cases/{caseId}:
    get: { operationId: getOpsFraudCase, tags: [investigations], x-peaket-roles: [commander, cs_lead], summary: "사건 상세(SCR-071)", description: "FR-073. 응답의 ETag는 사건 판(version)이다(guidelines §12). 지정 확인과 기록은 태그 investigations 설명(추천 적용 2026-10-31, ADR-0171)", security: [{ opsCookie: [] }], parameters: [{ name: caseId, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '200': { description: "사건", headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/FraudCaseDetail' } } } }, '403': { $ref: '#/components/responses/Problem', description: "investigator-required" }, '404': { $ref: '#/components/responses/Problem', description: "없는 사건" } } }
    patch: { operationId: updateOpsFraudCase, tags: [investigations], x-peaket-roles: [commander, cs_lead], summary: "사건 고치기(묶음 계정 빼기·더하기와 이유, 메모, 사유 범주, 조사관 의견, 소명 판단)", description: "FR-073, POL-046 ③·④. 여러 조사관이 함께 고칠 수 있어 If-Match가 필수다. 소명 판단으로 모든 계정이 인정되면 CLEARED로 닫고 양도 잠금을 풀며 정답 라벨(trust.proto LABEL_SOURCE_FRAUD_APPEAL_ACCEPTED)을 남긴다. 묶음 계정 빼기·더하기는 INVESTIGATING·APPEAL_PENDING에서만 받고(forensic-replay.md §6.7.4 C14), 그 밖의 상태면 409 fraud-case-state다. 뺀 계정의 잠금은 바로 풀고, 더한 계정에는 따로 소명 요청을 보낸다. 모든 변경은 사건 기록에 남는다(추천 적용 2026-10-31, ADR-0171)", security: [{ opsCookie: [] }], parameters: [{ $ref: '#/components/parameters/IfMatch' }, { name: caseId, in: path, required: true, schema: { type: string, format: uuid } }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FraudCasePatch' } } } }, responses: { '200': { description: "고친 사건", headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/FraudCaseDetail' } } } }, '400': { $ref: '#/components/responses/Problem', description: "본문 형식 오류" }, '403': { $ref: '#/components/responses/Problem', description: "investigator-required" }, '404': { $ref: '#/components/responses/Problem', description: "없는 사건" }, '409': { $ref: '#/components/responses/Problem', description: "fraud-case-state(지금 상태에서 할 수 없는 변경)" }, '412': { $ref: '#/components/responses/Problem', description: "판 불일치(precondition-failed, 다른 조사관이 먼저 고침)" }, '422': { $ref: '#/components/responses/Problem', description: "이유 없음, 묶음 밖 계정의 소명 판단" }, '428': { $ref: '#/components/responses/Problem', description: "If-Match 없음(precondition-required)" } } }
