      summary: "휴대폰 본인확인 시작(본인확인기관 창 값 발급). 별도 화면 없이 부르는 화면의 버튼이 기관 창을 연다"
      description: "FR-002, POL-001. 계정당 1회. 본인확인 흐름(소유자 결정 2026-10-14, ADR-0063): 부르는 화면(SCR-002·005·007·008·009·013·017·050 등)의 [휴대폰 본인확인] 버튼이 누른 동작 안에서 빈 창을 먼저 열고(팝업 차단을 피함) 이 응답의 양식을 그 창에 제출한다. 기관은 결과를 복귀 주소 `/verify/return`(서버가 고정한 같은 출처 주소, 클라이언트 입력을 받지 않음)으로 돌려주고, 복귀 화면이 결과 경로(POST …/{verificationId}/result)를 부른다. 팝업이면 복귀 화면이 같은 출처 BroadcastChannel로 결과 코드만 알리고 창을 닫는다. 기관이 페이지 이동으로 처리하면(모바일·일부 브라우저) 복귀 화면에 진행 표시만 보이고 결과를 받으면 next로 돌아가 그 화면이 결과 대화상자를 띄운다. next는 같은 출처 상대 경로만 받는다(추천 적용 2026-10-14, ADR-0063). 만 14세 확인·중복 연계정보는 결과 경로에서 판정한다"
      security: [{ fanCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { additionalProperties: false, type: object, required: [next], properties: { purpose: { type: string, enum: [FIRST, REVERIFY, MINOR_CONTRACT], default: FIRST, description: "목적 문구는 부르는 화면이 버튼 위 한 줄로 보인다. REVERIFY는 추가 검증(SCR-009)과, 로그인 판정이 CHALLENGE·UNKNOWN인 세션에서 재인증이 '요청만 함'인 양도 요청·환급·배상 계좌 입력(docs/features/identity.md §7 '로그인 판정의 처리', 추천 적용 2026-10-30), MINOR_CONTRACT는 미성년자 계약 취소 확인(목적 동의 뒤). 부스 대조는 POST /v1/identity/booth-reverifications로 시작한다" }, next: { type: string, pattern: '^(?!.*%(?:2[fF]%2[fF]|5[cC]))/(?!/)[^\\\u0000-\u001f\u007f]*$', maxLength: 512, description: "결과를 보인 뒤 돌아갈 같은 출처 상대 경로. docs/frontend.md §5.14.3 safeNext()와 같은 규칙이다: 512자 이하, /로 시작, //·/\\로 시작하지 않음, 제어 문자·백슬래시·%2f%2f·%5c(대소문자 무시) 없음(FE-T12). 서버도 이 규칙으로 거절한다(ASVS 3.7.2)" } } } } } }
      responses: { '201': { description: 기관 창 값(본인확인 건을 만든다), content: { application/json: { schema: { $ref: '#/components/schemas/VerificationStart' } } } }, '400': { $ref: '#/components/responses/Problem', description: "next가 같은 출처 상대 경로가 아님(next-invalid), 아직 받지 않는 목적(purpose-not-supported: MINOR_CONTRACT는 그 단계 전까지, 추천 적용 2026-11-03)" }, '409': { $ref: '#/components/responses/Problem', description: "already-verified: FIRST인데 이 계정은 이미 본인확인함" }, '503': { $ref: '#/components/responses/ServiceUnavailable', description: "provider-down: 본인확인기관을 쓸 수 없음(계약 전 운영 쪽 환경, 기관 장애). 이미 본인확인한 계정은 영향 없음(docs/features/identity.md §5·§10, 추천 적용 2026-11-03)" } }
