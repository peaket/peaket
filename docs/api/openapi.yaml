        '200': { description: 티켓, content: { application/json: { schema: { $ref: '#/components/schemas/Ticket' } } } }
        '401': { $ref: '#/components/responses/Unauthorized', description: "로그인 필요" }
        '404': { $ref: '#/components/responses/Problem', description: "없는 티켓이거나 지금 보유자가 아니다(같은 404, not-found)" }
