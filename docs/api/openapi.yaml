      x-peaket-roles: [fan]
      summary: 굿즈 주문(한정 재고 Redis 차감 → 승인 직전 PostgreSQL 확정, 수령 방식)
      description: "FR-015, POL-016. 계정당 수량 제한. 인기 MD 오픈은 대기열 입장 토큰 필요. 한 주문은 한 판매자·한 수령 방식의 상품만 담는다(다르면 422). 택배 주문은 에스크로를 켠 결제 상점으로 결제해 신용카드 외 결제에서 결제대금예치를 고를 수 있고, 현장 수령은 에스크로를 켜지 않은 상점으로 결제한다(POL-014, 추천 적용 2026-10-14, ADR-0062). 본문은 수령 방식(fulfillment)으로 갈리는 MerchOrderCreate다. 택배만 배송지와 배송 정보 판매자 제공 동의를 받고, 현장 수령은 수령 시간대만 받는다(FR-015 인수 조건, SCR-015 ④·⑨, docs/design/d5 §5.15). 금액은 본문으로 받지 않고 서버가 상품 가격·배송비로 계산한다. 본문 모양은 추천 적용 2026-10-30(ADR-0089 '남는 한계'). 인증은 두 가지 가운데 하나다. 보통 상품은 팬 쿠키만, 대기열을 거치는 인기 MD 오픈 상품은 팬 쿠키와 대기열 입장 토큰을 함께 받는다(security의 두 번째 묶음). 인기 MD 오픈 상품에 입장 토큰이 없거나 만료면 401이다. 인기 MD 대기열의 식별자는 상품 ID다(/v1/queues/{productId}/…, 상품 하나에 대기열 하나, 화면 주소 /shop/[productId]/queue와 같은 값) [가정]. 대기실 스크립트는 회차 대기실과 같이 주소에서 읽는다. 입장 토큰의 event 클레임이 그 상품 ID이고, core-svc shop 모듈이 토큰의 서명·만료·aud purchase, sub·sid가 요청 세션의 계정·세션과 같은지, event가 주문 항목의 queueRequired 상품과 같은지 본다(docs/features/seat-hold.md '입장 토큰 확인'과 같은 규칙). 다르면 401이다. 대기열 상품은 한 주문에 하나만 담는다(다르면 422) [가정]. 상품을 게시할 때 queue-svc 설정 사본(q:{event:E}:cfg)을 올린다: opensAtMs는 product.sale_starts_at, startsAtMs는 판매 종료 규칙(공연 시작 − 24시간)에 맞춰 product.sale_ends_at + 24시간 [가정]이다. 굿즈에는 구매 세션 사건이 없어, 입장 자리(q:{event:E}:slots)는 주문 생성 때 shop이 구매 세션 시작과 끝을 함께 알리거나 첫 사용 기한 5분 뒤에 풀린다 [가정, wbs 7.1.1]. security 표기는 추천 적용 2026-10-30(이 작업 설명의 '인기 MD 오픈은 대기열 입장 토큰 필요'를 security에 맞춤)"
      security: [{ fanCookie: [] }, { fanCookie: [], admissionToken: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MerchOrderCreate' } } } }
      responses:
        '201': { description: 주문, content: { application/json: { schema: { type: object, properties: { orderId: { type: string }, fulfillment: { type: string, enum: [DELIVERY, PICKUP] }, paymentStore: { type: string, enum: [STANDARD, ESCROW], description: "결제 상점(에스크로 여부). ESCROW(택배)면 결제창에서 결제대금예치를 고를 수 있고, 구매자가 골랐는지는 결제 승인 뒤 정해진다" }, stockReservedUntil: { type: string, format: date-time, description: "한정 재고 예약이 끝나는 시각(주문 + 15분 [가정], 결제 접수 때 승인 기한까지 늘어난다). 그때까지 결제가 끝나지 않으면 주문이 만료되고 재고가 돌아간다(추천 적용 2026-10-28, ADR-0107)" } } } } } }
        '400': { $ref: '#/components/responses/Problem', description: "본문 형식 오류: 깨진 JSON, 모르는 필드, 수령 방식에 맞지 않는 필드(현장 수령의 배송지·동의, 택배의 수령 시간대), 길이·형식 밖의 값" }
        '401': { $ref: '#/components/responses/Unauthorized', description: "로그인하지 않았거나, 인기 MD 오픈인데 입장 토큰이 없거나 만료됐다" }
        '409': { $ref: '#/components/responses/Problem', description: "품절, 탈퇴를 미루는 중인 계정(docs/planning/03 §1.5 ⑧)" }
        '415': { $ref: '#/components/responses/Problem', description: "application/json이 아닌 본문" }
        '422': { $ref: '#/components/responses/Problem', description: "업무 규칙에 어긋난 경우다(guidelines §12). ① 판매자나 수령 방식이 다른 상품이 섞였다. ② 택배인데 판매자 제공 동의가 없거나 true가 아니다(consent-required). ③ 동의한 고지 문안의 판이 지금 판이 아니다(consent-version-outdated. 화면이 지금 문안을 다시 보이고 다시 동의받는다). ④ 상품마다 정한 계정당 수량 한도를 넘었다(SCR-015 ⑦). ⑤ 옵션이 상품 유형 스키마에 맞지 않는다. ⑥ 없거나 판매 중이 아닌 상품, 그 수령 방식을 받지 않는 상품, 티켓 연동 부가 상품이다(티켓 연동 부가 상품은 POST /v1/tickets/{ticketId}/addons로 주문한다). ⑦ 그 상품의 수령 시간대가 아니거나 끝난 시간대, 또는 티켓 없이 고른 티켓 소지자 전용 시간대다(pickup-slot-unavailable, FR-015·POL-016)" }
    get:
      operationId: listShopOrders
      tags: [shop]
      x-peaket-roles: [fan]
      security: [{ fanCookie: [] }]
      summary: "내 굿즈·부가 상품 주문 목록(SCR-055 굿즈 탭)"
      description: "FR-014, FR-015, POL-016, docs/design/d5 §1.6 2번·§5.29. 세션 계정의 계정 묶음의 merch_order를 최근 순으로 커서로 준다. 결제를 끝내지 못하고 끝난 주문(status EXPIRED·FAILED)은 뺀다 [가정](과금이 없고 다시 주문하면 된다, 티켓 EXPIRED와 같은 규칙). Cache-Control: private, no-store"
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: 주문 한 페이지, content: { application/json: { schema: { $ref: '#/components/schemas/ShopOrderSummaryPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized', description: "로그인 필요" }
