        settlementDisputeEarliestDueAt: { type: [string, 'null'], format: date-time, description: "가장 이른 이의 기한" }
        openGateFlagCount: { type: [integer, 'null'], description: "처리 안 된 이상 표시 수" }
        pendingStaffInvitationCount: { type: [integer, 'null'], description: "수락 안 한 스태프 초대 수" }
    PartnerEventDetail:
