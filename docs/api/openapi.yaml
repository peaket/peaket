      responses: { '200': { description: 수신 }, '400': { $ref: '#/components/responses/Problem', description: 서명 오류 또는 JSON이 아닌 본문 }, '413': { $ref: '#/components/responses/Problem', description: "본문 64KB [가정] 초과. 해석하기 전에 막는다" }, '415': { $ref: '#/components/responses/Problem', description: JSON 밖의 형식 }, '503': { $ref: '#/components/responses/ServiceUnavailable', description: "수신 기록 저장 실패. 결제사가 다시 보낸다" } }
  /v1/ops/auth/sessions:
    post: { operationId: createOpsAuthSession, tags: [ops], x-peaket-roles: [public], security: [], summary: "운영자 로그인(이메일·비밀번호·다중 인증, 관제 배포의 허용 IP만)", description: "FR-028, POL-020. 허용 IP는 관제 배포 웹 ACL과 gw-ops가 두 번 본다(servers의 ops-api 설명, ADR-0144 결정 2). 잠금 규칙은 파트너 로그인과 같다(docs/security/auth-controls.md §3)", requestBody: { required: true, content: { application/json: { schema: { oneOf: [{ $ref: '#/components/schemas/AdminLoginPasswordStep' }, { $ref: '#/components/schemas/AdminLoginSecondStep' }] } } } }, responses: { '200': { description: "TOTP 필요(1단계 통과, 본문 AdminLoginStep), 또는 운영자 액세스 토큰 쿠키(__Host-peaket_ops_at)와 리프레시 토큰 쿠키(__Host-peaket_ops_rt)(2단계 통과). 본문에 토큰 없음", headers: { Set-Cookie: { description: "2단계 통과 때만: 액세스·리프레시 토큰 쿠키 둘(docs/features/identity.md §3 쿠키 표)", schema: { type: string } } }, content: { application/json: { schema: { oneOf: [{ $ref: '#/components/schemas/AdminLoginStep' }, { $ref: '#/components/schemas/AdminLoginDone' }] } } } }, '400': { $ref: '#/components/responses/Problem', description: "본문 형식 오류" }, '401': { $ref: '#/components/responses/Problem', description: "admin-login-failed(파트너 로그인과 같다, 추천 적용 2026-11-05)" }, '428': { $ref: '#/components/responses/Problem', description: "human-check-required(파트너 로그인과 같다)" }, '429': { $ref: '#/components/responses/TooManyRequests', description: "admin-login-busy(파트너 로그인과 같다)" }, '503': { $ref: '#/components/responses/ServiceUnavailable', description: "human-check-unavailable·admin-login-unavailable(파트너 로그인과 같다). Retry-After" }, '423': { $ref: '#/components/responses/Problem', description: "잠김(admin-account-locked, lock·retryAfterSeconds). 시간 잠금이면 Retry-After와 함께 업무 이메일로 해제 링크를 보냈다고만 알리고(POST /v1/ops/auth/unlocks), 보호 잠금이면 재초대를 안내한다. 같은 출발지 묶음의 잠금도 423이다. 없는 이메일도 같은 응답이다(auth-controls §2.2·§3.2, 추천 적용 2026-10-30)" } } }
  /v1/ops/auth/sessions/me:
    get: { operationId: getMyOpsAuthSession, tags: [ops], x-peaket-roles: [viewer, operator, commander, cs_agent, cs_lead], summary: "내 관리 세션 정보(역할과 살아 있는 지정, 콘솔 메뉴 그리기용)", description: "FR-028, ADR-0171 결정 7. 관제 콘솔이 지정이 있어야 보이는 메뉴(부정 거래 조사 /investigations, 연구 리플레이)를 보이거나 숨기려고 부른다. 지정은 토큰에 싣지 않으므로 ops-svc가 identity-svc GetAdminDesignations로 읽어 준다(캐시 5초 [가정]). 화면 표시용일 뿐이고, 지정이 필요한 작업은 서버가 요청마다 다시 확인한다. cs_lead는 관리 계정 목록(GET /v1/ops/admin-accounts)을 부르지 못해 이 경로를 따로 둔다(추천 적용 2026-10-31)", security: [{ opsCookie: [] }], responses: { '200': { description: "내 세션 정보", headers: { Cache-Control: { schema: { type: string, enum: [no-store] } } }, content: { application/json: { schema: { $ref: '#/components/schemas/AdminSessionSelf' } } } }, '401': { $ref: '#/components/responses/Unauthorized', description: "로그인 필요" } } }
    delete: { operationId: deleteMyOpsAuthSession, tags: [ops], x-peaket-roles: [viewer, operator, commander, cs_agent, cs_lead], summary: "운영자 로그아웃(지금 세션 끝내기)", description: "FR-028, POL-020, 추천 적용 2026-10-29, ADR-0145 결정 2. 로그인 POST /v1/ops/auth/sessions와 짝이고, me는 로그인한 사람의 지금 세션이다(guidelines §10). 관제 콘솔은 앱 서버가 없어 ops-api(gw-ops)가 응답한다. identity-svc가 그 세션을 끝내고 세션 종료 사건(asyncapi control.sessions-terminated, reason LOGOUT)을 낸다. 응답은 이 앱의 쿠키 둘(__Host-peaket_ops_at, __Host-peaket_ops_rt)만 같은 이름·Path=/에 Max-Age=0을 단 Set-Cookie로 지운다. Clear-Site-Data는 보내지 않는다(docs/features/identity.md §3, docs/frontend.md §5.14.4, FE-T34). 쿠키로 인증하는 쓰기라 gw-ops가 Origin(관제 콘솔 출처)을 확인한다(guidelines §9)", security: [{ opsCookie: [] }], responses: { '204': { description: "로그아웃됨", headers: { Set-Cookie: { description: "__Host-peaket_ops_at·__Host-peaket_ops_rt를 같은 이름·Path=/, Max-Age=0으로", schema: { type: string } } } }, '401': { $ref: '#/components/responses/Unauthorized', description: "액세스 토큰 없음·만료" } } }
  /v1/ops/auth/access-tokens:
    post: { operationId: createOpsAuthAccessToken, tags: [ops], x-peaket-roles: [viewer, operator, commander, cs_agent, cs_lead], summary: "운영자 액세스 토큰 갱신(리프레시 토큰 쿠키, 회전·재사용 탐지)", description: "FR-028, POL-019, POL-020, ADR-0011(추천 적용 2026-10-15, ADR-0065 결정 11). 운영자 액세스 토큰(15분)을 유휴 만료(1시간)와 절대 만료(24시간) 안에서만 새로 준다. 지났으면 401이고 비밀번호와 다중 인증으로 다시 로그인한다. 재사용 탐지 시 패밀리 전체 폐기 + 세션 종료 이벤트(응답을 잃은 재시도의 30초 [가정] 유예는 팬 갱신과 같다, 기술 검토 중간-053). 관제 배포의 허용 IP만(ADR-0144 결정 2). 본문이 없어 사전 요청이 생기지 않으므로 gw-ops가 Origin(관제 콘솔 출처)을 확인한다", security: [{ opsRefreshCookie: [] }], responses: { '204': { description: "새 쿠키(__Host-peaket_ops_at, __Host-peaket_ops_rt). 본문에 토큰 없음" }, '401': { $ref: '#/components/responses/Unauthorized', description: "재사용 탐지·유휴 또는 절대 만료·다른 콘솔의 쿠키(refresh-token-invalid). 이 콘솔의 쿠키 둘을 Max-Age=0으로 지운다" } } }
  /v1/ops/auth/unlocks:
    post: { operationId: createOpsAuthUnlock, tags: [ops], x-peaket-roles: [public], x-peaket-trace-rare: true, security: [], summary: "운영자·CS 계정 시간 잠금 본인 해제(업무 이메일 해제 링크 + 인증 앱 코드나 복구 코드)", description: "FR-028, POL-020. 파트너 본인 해제(POST /v1/partner/auth/unlocks)와 같은 규칙이고 정본은 docs/security/auth-controls.md §3.3이다. 관제 배포의 허용 IP에서만 받는다(ADR-0144 결정 2). gw-ops가 Origin(관제 콘솔 출처)을 확인한다(추천 적용 2026-10-30, ADR-0157 결정 6)", requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminUnlockCreate' } } } }, responses: { '204': { description: "시간 잠금을 풀었다" }, '400': { $ref: '#/components/responses/Problem', description: "본문 형식 오류" }, '410': { $ref: '#/components/responses/Problem', description: "링크가 만료됐거나, 이미 썼거나, 코드를 3번 틀렸거나, 새 링크를 받아 무효가 됐다" }, '422': { $ref: '#/components/responses/Problem', description: "코드가 맞지 않는다(2단계 실패 수에 센다)" }, '423': { $ref: '#/components/responses/Problem', description: "보호 잠금이라 해제 링크로 풀 수 없다(commander 재초대)" }, '429': { $ref: '#/components/responses/TooManyRequests', description: "웹 ACL·게이트웨이 한도 초과, 또는 admin-login-busy(같은 계정의 다른 시도가 처리 중, 추천 적용 2026-11-05)" }, '503': { $ref: '#/components/responses/ServiceUnavailable', description: "admin-login-unavailable(실패 셈 저장소·페퍼·TOTP 시드 키 서비스에 닿지 못함). Retry-After" } } }
  /v1/ops/auth/unlock-links:
    post: { operationId: createOpsAuthUnlockLink, tags: [ops], x-peaket-roles: [public], security: [], summary: "운영자·CS 계정 해제 링크 다시 받기", description: "FR-028, POL-020. 파트너 다시 받기(POST /v1/partner/auth/unlock-links)와 같은 규칙이다: 계정 유무와 상관없이 같은 202, 시간 잠금 중인 계정에만 새 링크, 이메일마다 1시간에 3번 [가정]. 관제 배포의 허용 IP에서만 받는다(추천 적용 2026-10-30, docs/security/auth-controls.md §2.2·§3.3)", requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminUnlockLinkCreate' } } } }, responses: { '202': { description: "받았다(보냈는지는 알리지 않는다)" }, '400': { $ref: '#/components/responses/Problem', description: "본문 형식 오류" }, '429': { $ref: '#/components/responses/TooManyRequests', description: "그 이메일의 다시 받기 한도를 넘었다(unlock-link-resend-limit). 메일은 나가지 않는다" }, '503': { $ref: '#/components/responses/ServiceUnavailable', description: "admin-login-unavailable(셈 저장소에 닿지 못함). Retry-After" } } }
  /v1/ops/auth/password-changes:
    post: { operationId: createOpsAuthPasswordChange, tags: [ops], x-peaket-roles: [viewer, operator, commander, cs_agent, cs_lead], x-peaket-trace-rare: true, summary: "운영자·CS 계정 비밀번호 바꾸기", description: "FR-028, POL-020. 파트너 비밀번호 바꾸기(POST /v1/partner/auth/password-changes)와 같은 규칙이다. 바꾸면 이 세션은 이어지고 다른 세션을 모두 끝낸다(reason PASSWORD_CHANGED). scope 제한 세션이면 제한을 푼 새 운영자 액세스 토큰 쿠키(__Host-peaket_ops_at)를 준다. gw-ops가 Origin을 확인한다(추천 적용 2026-10-30, docs/security/auth-controls.md §3.5·§4)", security: [{ opsCookie: [] }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminPasswordChangeCreate' } } } }, responses: { '204': { description: "바꿨다" }, '400': { $ref: '#/components/responses/Problem', description: "본문 형식 오류(길이 밖)" }, '401': { $ref: '#/components/responses/Unauthorized', description: "액세스 토큰 없음·만료" }, '404': { $ref: '#/components/responses/Problem', description: "그 사이 관리 계정이 지워졌거나 쓸 수 없게 됐다(not-found)" }, '422': { $ref: '#/components/responses/Problem', description: "지금 비밀번호가 틀렸다(current-password-invalid), 또는 새 비밀번호가 지금 것과 같거나 흔한 비밀번호·맥락 말·유출 목록에 걸렸다(password-rejected: 걸린 이유 종류 reason과 안내 문구를 싣는다)" }, '423': { $ref: '#/components/responses/Problem', description: "잠김(admin-account-locked): 보호 잠금(commander 재초대)이거나 시간 잠금·묶음 잠금(Retry-After). 잠긴 동안은 지금 비밀번호를 보지 않고 세지 않는다" }, '429': { $ref: '#/components/responses/Problem', description: "같은 계정의 로그인·비밀번호 바꾸기가 처리 중이다(admin-login-busy, Retry-After)" }, '503': { $ref: '#/components/responses/ServiceUnavailable', description: "유출 목록 조회에 닿지 못했다. 새 비밀번호를 저장하지 않는다" } } }
  /v1/ops/auth/reauthentications:
    post: { operationId: createOpsAuthReauthentication, tags: [ops], x-peaket-roles: [viewer, operator, commander, cs_agent, cs_lead], summary: "운영자·CS 관리 계정 재인증(비밀번호·인증 앱 코드, 요청하면 패스키 확인까지) → 재인증 토큰", description: "FR-028, POL-020, ADR-0206(추천 적용 2026-11-05, BUILD_ORDER BOT-122). 위험 운영 명령과 그 승인, 승인 업무, 권한·역할 변경, 수사기관 자료, 내 패스키 등록과 지우기 직전에 부른다. 파트너 재인증(POST /v1/partner/auth/reauthentications)과 같은 두 단계이고, 1단계 본문은 OpsReauthPasswordStep이다. 패스키 서명의 RP ID는 console.peaket.example, 출처는 관제 콘솔 출처 하나다. 그 작업에 패스키가 필요한지는 받는 서비스가 본다(commander가 하는 승인은 패스키까지, cs_lead는 비밀번호·인증 앱 코드까지, docs/security/authz-matrix.md §6). Cache-Control: no-store. gw-ops가 Origin을 확인한다. 정본은 docs/features/identity.md §6 '관리 계정 패스키의 첫 구현'", security: [{ opsCookie: [] }], requestBody: { required: true, content: { application/json: { schema: { oneOf: [{ $ref: '#/components/schemas/OpsReauthPasswordStep' }, { $ref: '#/components/schemas/AdminReauthPasskeyStep' }] } } } }, responses: { '200': { description: "패스키 확인이 필요함(AdminReauthPasskeyChallenge), 또는 재인증 토큰(AdminReauthDone)", content: { application/json: { schema: { oneOf: [{ $ref: '#/components/schemas/AdminReauthPasskeyChallenge' }, { $ref: '#/components/schemas/AdminReauthDone' }] } } } }, '400': { $ref: '#/components/responses/Problem', description: "본문 형식 오류(이 콘솔이 받지 않는 작업 묶음 포함)" }, '401': { $ref: '#/components/responses/Unauthorized', description: "액세스 토큰 없음·만료, 또는 그 사이 끝난 세션" }, '403': { $ref: '#/components/responses/Problem', description: "비밀번호 바꾸기 필요 세션(password-change-required)" }, '409': { $ref: '#/components/responses/Problem', description: "withPasskey인데 등록한 패스키가 없다(passkey-not-registered). 비밀번호를 보기 전에 답한다" }, '410': { $ref: '#/components/responses/Problem', description: "2단계: reauthStep이 없거나 썼거나 지났거나 다른 세션의 것이다(reauth-step-invalid, 1단계부터 다시)" }, '422': { $ref: '#/components/responses/Problem', description: "비밀번호가 틀렸다(current-password-invalid), 인증 앱 코드가 틀렸다(reauth-code-invalid, remainingAttempts), 패스키 서명을 받지 못했다(passkey-assertion-invalid: 남의 자격, 다른 출처, 다른 RP ID, 사용자 확인 없음, 서명 횟수 퇴행. 이유는 싣지 않는다, I-T53 ④)" }, '423': { $ref: '#/components/responses/Problem', description: "잠김(admin-account-locked). 보호 잠금이면 재인증 토큰을 주지 않는다(docs/security/auth-controls.md §3.2)" }, '429': { $ref: '#/components/responses/Problem', description: "같은 계정의 다른 로그인·재인증이 처리 중이다(admin-login-busy, Retry-After)" }, '503': { $ref: '#/components/responses/ServiceUnavailable', description: "admin-login-unavailable(실패 셈 저장소·페퍼·TOTP 시드 키·챌린지 저장소에 닿지 못함, 관리 토큰 키 없음). Retry-After" } } }
  /v1/ops/auth/passkey-registrations:
    post: { operationId: createOpsAuthPasskeyRegistration, tags: [ops], x-peaket-roles: [viewer, operator, commander, cs_agent, cs_lead], summary: "내 패스키 등록 시작(등록 옵션, 재인증 토큰 필요)", description: "FR-028, POL-020, ADR-0206(추천 적용 2026-11-05, BUILD_ORDER BOT-122). 파트너 등록 시작(POST /v1/partner/auth/passkey-registrations)과 같은 규칙이다. RP ID는 console.peaket.example이다. 결과는 POST /v1/ops/auth/passkeys로 보낸다. Cache-Control: no-store. gw-ops가 Origin을 확인한다", security: [{ opsCookie: [] }], parameters: [{ $ref: '#/components/parameters/ReauthToken' }], responses: { '201': { description: "등록 옵션", content: { application/json: { schema: { $ref: '#/components/schemas/AdminPasskeyRegistration' } } } }, '401': { $ref: '#/components/responses/Unauthorized', description: "액세스 토큰 없음·만료, 또는 그 사이 끝난 세션" }, '403': { $ref: '#/components/responses/Problem', description: "재인증 토큰이 없거나 만료·재사용이거나 세션·작업 묶음·요소가 맞지 않는다(reauth-required). 비밀번호 바꾸기 필요 세션(password-change-required)" }, '409': { $ref: '#/components/responses/Problem', description: "패스키가 이미 10개 [가정]다(passkey-limit)" }, '503': { $ref: '#/components/responses/ServiceUnavailable', description: "admin-login-unavailable(챌린지 저장소에 닿지 못함). Retry-After" } } }
