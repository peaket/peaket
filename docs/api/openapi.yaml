        '409': { $ref: '#/components/responses/Problem', description: "idempotency-request-in-progress(같은 요청을 처리 중), merch-item-state-conflict: 이미 수령했거나 취소된 주문" }
        '422': { $ref: '#/components/responses/Problem', description: "idempotency-key-reused" }
  /v1/partner/merch-delivery-exports:
    post:
      operationId: createPartnerMerchDeliveryExport
      tags: [partner]
      x-peaket-roles: [partner_admin]
      summary: "배송 명단 내려받기(사유 필수, 건수·사유 접속기록, 동의 범위 항목만, 스트리밍)"
      description: "POL-016·023·037, FR-064, SCR-023, docs/security/data-classification.md '파트너 제공 굿즈 배송 명단', docs/design/d5 §1.6 16번. 파트너 관리자만 부른다. 소속 파트너의 택배 항목만 담고, 칸은 받는 분 이름·연락처·배송 주소·주문번호·상품이다(가리지 않는다). 사유와 건수를 접속기록에 남긴다. 배송 완료 뒤 3개월이 지난 건은 빼고, CSV·XLSX는 수식으로 읽힐 첫 글자를 막는다(guidelines §9). 기록과 응답 형태는 예매자 명단 내려받기와 같아 파일을 다시 돌려줄 수 없으므로 멱등 키를 받지 않는다. [가정] 재인증: 정본은 관리자·사유만 정했지만 여러 사람의 주소가 함께 나가므로 예매자 명단과 같이 비밀번호·TOTP·패스키 재인증 토큰(act BOOKER_EXPORT)을 요구한다. [가정] 형식은 예매자 명단과 같은 세 가지이고, 송장 묶음 등록에 쓰도록 항목 번호(itemId)를 함께 싣는다(개인정보 아님)"
      security:
        - partnerCookie: []
      parameters:
        - { $ref: '#/components/parameters/ReauthToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PartnerMerchDeliveryExportCreate' }
      responses:
        '200': { description: 파일 스트림 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem', description: "partner-admin-required: 파트너 실무자가 부름, reauth-required: 재인증 없음·만료·패스키 요소 없음" }
