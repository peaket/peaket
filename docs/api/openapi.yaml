  /v1/booking-restrictions/me:
    get: { operationId: getMyBookingRestriction, tags: [support], x-peaket-roles: [fan], summary: "내 예매 제한 상태와 소명 기한(공연 상세·계정 설정·소명 화면)", description: "FR-061, POL-038(소유자 결정 2026-10-30 open-items 75번의 화면 쪽. 경로와 칸은 추천 적용 2026-10-30, docs/design/d5 §1.6 21번). 웹 서버 내부 경로가 아니라 공개 API다. 공연 상세(SCR-002)는 ISR 정적 셸이고 개인 영역은 화면 스크립트가 gw-fan으로 따로 읽기 때문이다(docs/frontend.md의 /events/[id] 행). gw-fan → core-svc support 모듈이 받는다. ops-svc는 팬 요청을 받지 않으므로(독립 제어 평면), 원본(ops DB booking_restriction)을 바꿀 때 ops-svc가 support 모듈에 화면용 사본을 보낸다(core.proto BookingRestrictionViewService, 판 번호, docs/data.md §3 sup:rst:{account}). 집행은 이 사본이 아니라 입장 확정(queue-svc)과 주문 생성(purchase-svc)이 각자의 사본으로 한다. 그래서 이 사본이 늦거나 비어도 집행은 그대로이고, 화면이 '제한 없음'을 보인 뒤 입장 확정에서 403 booking-restricted를 받을 수 있다(남는 한계, 화면 문구는 docs/design/d5 §9.2). restrictionId는 소명 제출(POST /v1/appeals, kind RESTRICTION)의 targetId다. 본인 것만 답하고, 제한이 없으면 200에 status NONE이다. Cache-Control: private, no-store", security: [{ fanCookie: [] }], responses: { '200': { description: 상태, content: { application/json: { schema: { $ref: '#/components/schemas/BookingRestrictionStatus' } } } }, '401': { $ref: '#/components/responses/Unauthorized', description: "로그인 필요" } } }
  /v1/fraud-appeal-requests:
    get: { operationId: listFraudAppealRequests, tags: [support], x-peaket-roles: [fan], summary: "내 부정 예매 소명 요청(사유 범주·기한·잠긴 표, 소명 화면 SCR-042)", description: "FR-073, POL-046 ③(추천 적용 2026-10-31, ADR-0171). 예매 제한 상태(GET /v1/booking-restrictions/me)와 같은 길이다. gw-fan → core-svc support 모듈이 세션·캐시 Redis의 화면용 사본(docs/data.md §3 sup:far:{account})으로 답한다. ops-svc는 팬 요청을 받지 않으므로, 소명 요청을 보내거나 결과가 바뀔 때 support 모듈에 사본을 보낸다(core.proto FraudAppealViewService, 판 번호). 열린 요청과 결정된 지 30일 [가정] 안의 요청만 준다. caseId는 소명 제출(POST /v1/appeals, kind FRAUD_CASE)의 targetId다. 사건의 다른 계정·점수·근거 신호는 싣지 않고 사유 범주만 준다(POL-046 ⑦). 사건 계정이 결제한 표를 양도로 받아 가진 사람에게도 party HOLDER인 요청이 보이고, 거기에는 사유 범주 없이 그 사람이 가진 표(heldTicketIds)와 기한만 있다(추천 적용 2026-10-31, ADR-0173). 없으면 200과 빈 items다. Cache-Control: private, no-store", security: [{ fanCookie: [] }], parameters: [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }], responses: { '200': { description: "내 소명 요청 한 페이지", content: { application/json: { schema: { $ref: '#/components/schemas/FraudAppealViewPage' } } } }, '401': { $ref: '#/components/responses/Unauthorized', description: "로그인 필요" } } }
  /v1/appeals:
    post: { operationId: createAppeal, tags: [support], x-peaket-roles: [fan], summary: "소명 제출(예매 제한·양도 회수 대상 본인, 기한 안)", description: "FR-059, FR-061, POL-038. 민감정보를 적지 않아도 된다고 안내. 받는 곳(추천 적용 2026-10-30): 고객 문의(POST /v1/inquiries, ADR-0066)와 같은 길이다. gw-fan → core-svc support 모듈이 받는다. ops-svc는 팬 요청을 받지 않는다(독립 제어 평면). support 모듈이 소명(core DB appeal, 본문 포함)을 저장하고, 같은 트랜잭션의 Outbox로 CS 처리함 건 요청(asyncapi support.cases-requested, kind APPEAL, sourceId = appealId, category = RESTRICTION·RECLAIM, 본문 없음)을 낸다. ops-svc가 그것으로 CS 처리함 건 APPEAL을 만들고, support 모듈 내부 API로 소명의 대상 ID·계정을 읽어 대상(ops DB booking_restriction, 양도 회수 승인 업무 approval_request)에 잇고 계정 병합을 막는 건 알림(SetAccountHold, kind APPEAL)을 보낸다. 대상이 이 계정의 것인지와 소명 기한은 원본을 가진 ops-svc가 건을 만들 때 본다. 맞지 않으면 그 소명을 '대상 아님·기한 경과'로 닫고 팬에게 알린다. kind RESTRICTION은 support가 가진 화면용 사본(docs/data.md §3 sup:rst:{account}, GET /v1/booking-restrictions/me와 같은 값)으로 기한이 지났는지 먼저 보고 409로 답한다. 처리는 cs_lead(예매 제한)와 양도 회수 승인 업무의 승인자(commander)가 CS 처리함·승인 업무 화면에서 본문을 support 모듈 내부 API로 읽어 하고, 결과(제한 해제·유지, 회수하지 않음·회수됨)는 ops-svc가 support 모듈 내부 API로 그 소명에 적고 팬에게 알린다(docs/design/d5 SCR-042 결과). 그 내부 호출은 docs/api/proto 초안에 아직 없다(wbs 0.2.3). 본문은 처리를 마치고 3년 뒤 파기한다(docs/data.md §6 '소명 본문')",security: [{ fanCookie: [] }], requestBody: { content: { application/json: { schema: { additionalProperties: false, type: object, required: [kind, targetId, body], properties: { kind: { type: string, enum: [RESTRICTION, RECLAIM, FRAUD_CASE], description: "FRAUD_CASE는 부정 예매 소명(POL-046 ③)이고 targetId는 사건 ID다(GET /v1/fraud-appeal-requests의 caseId). support 모듈은 FRAUD_CASE를 409로 미리 막지 않는다(정본 docs/features/transfer-refund.md §7.1 '부정 예매 사건의 소명'). 기한은 ops-svc가 건을 사건에 이을 때 본다. 조치 전의 소명은 소명 기한(dueAt)으로, 조치 뒤의 이의는 이의 창(결과 통지 + 30일 [가정], objectionDueAt)으로 보고, 맞지 않으면 '대상 아님·기한 경과'로 닫고 팬에게 알린다. 화면용 사본(sup:far)의 기한은 화면에 보이는 값일 뿐이다(추천 적용 2026-10-31, ADR-0171). 대상 계정·기한의 최종 확인과 처리는 그 사건의 조사관이 사건 작업대(SCR-071)에서 한다. CS 처리함 건 요청의 category도 FRAUD_CASE다(추천 적용 2026-10-31, ADR-0171). 사건 계정이 결제한 표를 받아 가진 사람(FraudAppealView party HOLDER)도 같은 kind·targetId로 낸다. ops-svc는 그 소명을 보유자 진술로 사건에 잇고, 조사관은 그것을 보고 그 사람이 가진 표마다 취소 대상에 넣을지 정해 조치 요청의 표 목록(ticketIds)에 적는다(추천 적용 2026-10-31, ADR-0173)" }, targetId: { type: string }, body: { type: string, maxLength: 2000 } } } } } }, responses: { '201': { description: "접수" }, '409': { $ref: '#/components/responses/Problem', description: "기한 경과(kind RESTRICTION만. FRAUD_CASE는 409 없이 받고 ops-svc가 닫고 알린다)" } } }
