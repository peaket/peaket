  consumeAnalyticsIngest: { action: receive, channel: { $ref: '#/channels/telemetry.purchase' }, summary: "analytics-ingest. trade.*, telemetry.queue(QueueEntryRecord), telemetry.trust-verdicts, control.settings도 같은 잡이 브론즈로 적재(ADR-0052). PipelinePulse는 건너뛴다(ADR-0071)" }
  publishQueueTelemetry: { action: send, channel: { $ref: '#/channels/telemetry.queue' }, summary: "queue-svc(1초 집계 QueueAggregate, 대기가 끝날 때 사람별 대기 기록 QueueEntryRecord, queue-admission §3·§4)", messages: [{ $ref: '#/channels/telemetry.queue/messages/QueueAggregate' }, { $ref: '#/channels/telemetry.queue/messages/QueueEntryRecord' }] }
  consumeOpsRt: { action: receive, channel: { $ref: '#/channels/telemetry.queue' }, summary: "ops-rt(관제 실시간 원시 적재 작업자). trade.orders·payments·seats·tickets, telemetry.queue(QueueAggregate·PipelinePulse)·telemetry.purchase·telemetry.trust-verdicts를 읽어 rt 원시 표에 싣는다. 누적과 1초 칸은 ops-svc가 읽을 때 센다(docs/streaming.md §4, ADR-0071·0099)" }
  publishPipelinePulse: { action: send, channel: { $ref: '#/channels/telemetry.queue' }, summary: "rt-pulse. 1초마다 telemetry.queue·telemetry.purchase·telemetry.trust-verdicts의 모든 파티션에 파티션을 지정해 보낸다(ADR-0071)", messages: [{ $ref: '#/channels/telemetry.queue/messages/PipelinePulse' }] }
  publishBehaviorSignal: { action: send, channel: { $ref: '#/channels/telemetry.behavior' }, summary: "trust-svc(로비 입장·사전 검증 때 기기 식별값을 탐지 가명으로 바꿔 발행, ADR-0071. 로비 입장은 추천 적용 2026-10-30, docs/features/bot-defense.md §4.1)" }
  consumeBehaviorSignal: { action: receive, channel: { $ref: '#/channels/telemetry.behavior' }, summary: "trust-reassess(대기 중 재평가, 행동 신호 원시 적재, ADR-0071)" }
  publishTrustCandidate: { action: send, channel: { $ref: '#/channels/telemetry.trust-candidates' }, summary: trust-reassess }
  consumeTrustCandidate: { action: receive, channel: { $ref: '#/channels/telemetry.trust-candidates' }, summary: "trust-svc(재평가 모드·격리 상한, 적용이면 queue-svc IsolateWaiting gRPC, ADR-0071)" }
components:
  messages:
    OrderEvent:
      payload:
        type: object
        required: [eventId, orderId, accountId, type, amount, seatIds, items, seatAssignment, occurredAt, eventKey]
        properties:
          eventId: { type: string }
          orderId: { type: string }
          accountId: { type: string }
          type: { type: string, enum: [CREATED, ACCEPTED, RESERVED, AWAITING_DEPOSIT, APPROVED, CONFIRMED, DEPOSIT_REVERSED, FAILED, COMPENSATED, PARTIALLY_REFUNDED, REFUNDED, EVENT_CANCELLATION_CONFIRMED, COMPENSATION_PAID, EXPIRED, ISSUE_DELAYED], description: "EVENT_CANCELLATION_CONFIRMED·COMPENSATION_PAID는 회차 취소 확정과 배상 지급(ADR-0046). AWAITING_DEPOSIT은 가상계좌 발급(입금 대기), DEPOSIT_REVERSED는 입금 오류로 결제사가 입금을 되돌려 확정된 주문이 입금 대기로 돌아감(planning/03 §2.4, 추천 적용 2026-10-14, ADR-0062). EXPIRED는 결제를 접수하지 않고 끝난 주문(과금 없음, ADR-0107). ISSUE_DELAYED는 승인 뒤 발권이 60초 [가정] 넘게 끝나지 않아 다시 발권하는 중인 주문으로, core-svc 알림이 '결제 완료, 티켓 발급 중'을 보낸다(ADR-0106). 두 값은 2026-10-28에 더했고 소비자를 먼저 배포한다(BACKWARD_TRANSITIVE)" }
          amount: { type: integer, description: "주문 금액(원). 서버가 계산한 purchase_order.amount이고 사건 종류와 상관없이 같은 값이다. 환급액은 이 칸이 아니다(ADR-0150)" }
          seatIds: { type: array, items: { type: string } }
          purchaseSessionId: { x-present-when: [{ type: [CREATED] }], type: string, description: "구매 세션 ID(분석 연결 키, ADR-0052). CREATED에만 싣는다. 주문 표에 저장하지 않는 값이라 뒤의 사건은 주문 ID로 잇는다(ADR-0150)" }
          items: { type: array, description: "좌석별 등급·구역·가격(ADR-0052)", items: { type: object, required: [seatId, tierId, sectionId, price], properties: { seatId: { type: string }, tierId: { type: string }, sectionId: { type: string }, price: { type: integer } } } }
          seatAssignment: { type: string, enum: [PICK, AUTO] }
          firstInStage: { type: boolean, default: false, description: "이 주문이 이 단계(ACCEPTED·APPROVED·CONFIRMED)에 처음 들어올 때 true. 입금 되돌림 뒤 다시 확정되면 false. 관제 실시간 표가 퍼널을 주문마다 한 번 센다(ADR-0099)" }
          occurredAt: { type: string, format: date-time }
          eventKey: { type: string, format: uuid, description: "중복 제거 키(ADR-0052). 같은 사건을 다시 보내면 같은 값" }
    PaymentEvent:
      payload:
        type: object
        required: [eventId, orderId, pg, type, amount, attemptNo, occurredAt, eventSeq, eventKey]
        properties:
          eventId: { type: string }
          orderId: { type: string }
          pg: { type: string, enum: [TOSS, PORTONE, SIMULATOR], description: "결제 접수에서 고정된 결제사(ADR-0044). 결제사 결제 참조(토스 paymentKey, 포트원 paymentId)는 싣지 않고 주문 ID로 잇는다(ADR-0053)" }
          type: { type: string, enum: [AWAITING_DEPOSIT, APPROVED, DEPOSIT_REVERSED, FAILED, UNKNOWN, RESOLVED, PARTIAL_CANCELED, CANCELED], description: "AWAITING_DEPOSIT은 가상계좌 발급, APPROVED는 가상계좌면 입금 확인, DEPOSIT_REVERSED는 입금 오류로 결제사가 입금을 되돌림(조회로 확인, payment §6, 추천 적용 2026-10-14, ADR-0062). RESOLVED는 UNKNOWN 해소 기록이고 해소 결과는 result에 싣는다. 결과가 승인이면 APPROVED, 가상계좌 발급이면 AWAITING_DEPOSIT, 미승인이면 FAILED 사건을 따로 낸다(추천 적용 2026-10-20, ADR-0073)" }
          amount: { type: integer, description: "결제 금액(원, payment.amount, ADR-0052). 취소·부분 취소 사건도 결제 금액이고, 취소한 금액은 이 칸이 아니다(ADR-0150)" }
          payMethodCategory: { type: string, enum: [CARD, EASY_PAY, TRANSFER, OTHER] }
          result: { type: string, enum: [APPROVED, ALREADY_APPROVED, IN_PROGRESS, DECLINED, WAITING_FOR_DEPOSIT, UNKNOWN], description: "payment §2.1 정규화 결과. WAITING_FOR_DEPOSIT은 가상계좌 발급(RESOLVED의 결과로도 온다, ADR-0073)" }
          failureCategory: { x-present-when: [{ type: [FAILED] }], type: string, enum: [CARD_DECLINED, USER_ABORTED, VALIDATION, EXPIRED, PG_ERROR, THROTTLED], description: "실패일 때만. 결제 어댑터가 정한다(payment §2.1)" }
          attemptNo: { type: integer, description: 같은 주문의 결제 시도 순번 }
          latencyMs: { type: integer, description: 결제사 승인 응답 시간 }
          occurredAt: { type: string, format: date-time }
          eventSeq: { type: integer, format: int64, description: "결제 하나 안에서 늘어나기만 하는 사건 순번(payment_event 행의 순번). 결과 당기기로 받은 결과와 같은 사건인지 가린다(ADR-0140)" }
          eventKey: { type: string, format: uuid, description: "중복 제거 키(ADR-0052). 같은 사건을 다시 보내면 같은 값" }
    SeatEvent:
      payload:
        type: object
        required: [eventId, seatId, tierId, sectionId, type, occurredAt, eventKey]
        properties:
          eventId: { type: string }
          seatId: { type: string }
          tierId: { type: string, description: "좌석 등급. 관제 실시간 표의 등급별 판매 좌석(ADR-0072)" }
          sectionId: { type: string, description: "좌석 구역. 관제 실시간 표의 구역별 판매 좌석(ADR-0072)" }
          type: { type: string, enum: [HELD, RELEASED, EXPIRED, PENDING, SOLD, AVAILABLE, RETURNED], description: "HELD·RELEASED·EXPIRED는 홀드(좌석 Redis Stream 릴레이), PENDING·SOLD·AVAILABLE·RETURNED는 판매 행 seat_sale의 Outbox다. AVAILABLE은 판매 예약(PENDING) 행을 지워 좌석을 다시 팔 수 있게 됨(승인 실패·승인 기한 만료, 가상계좌 입금 기한 경과·입금 전 회차 취소), RETURNED는 SOLD 좌석이 예매 취소·회차 취소로 반환됨(seat_sale RETURNED. 취소표로 다시 팔 수 있고, 판매 종료 뒤 반환은 다시 팔지 않는다, ADR-0064). seat-hold §4·§6, planning/03 §2.4" }
          fencingToken: { x-present-when: [{ type: [HELD, RELEASED, EXPIRED] }], type: integer }
          sectionVersion: { x-present-when: [{ type: [HELD, RELEASED, EXPIRED] }], type: integer, description: "구역별 일련번호. 같은 seatEpoch 안에서만 비교한다(기술 검토 중간-040)" }
          seatEpoch: { x-present-when: [{ type: [HELD, RELEASED, EXPIRED] }], type: integer, description: "회차 세대. 좌석 Redis 장애 조치·다시 만들기 때 오른다(ADR-0121, 기술 검토 중간-040)" }
          holdId: { x-present-when: [{ type: [HELD, RELEASED, EXPIRED] }], type: string, description: "홀드와 판매·만료를 잇는 키(ADR-0052). 홀드 사건에는 늘 있다. 판매 사건은 Saga가 그 좌석의 홀드를 알 때만 싣는다(seat_sale에는 홀드 칸이 없다, ADR-0150)" }
          purchaseSessionId: { x-present-when: [{ type: [HELD, RELEASED, EXPIRED] }], type: string, description: "구매 세션 ID. holdId와 같은 규칙이다(ADR-0150)" }
          occurredAt: { type: string, format: date-time }
          eventKey: { type: string, format: uuid, description: "중복 제거 키(ADR-0052). 같은 사건을 다시 보내면 같은 값" }
    EventSaleChanged:
      payload:
        type: object
        description: "회차 판매 상태가 바뀜(planning/03 §2.15, 추천 적용 2026-10-28, ADR-0122). purchase-svc가 event_sale을 바꾸는 트랜잭션의 Outbox로 trade.seats에 낸다(키 eventId라 그 회차의 SeatEvent와 같은 파티션에 온다. 판매 사건(seat_sale Outbox)과는 같은 릴레이의 seq 순서로 오지만, 홀드 사건(Redis Stream 릴레이)과의 순서는 보장하지 않으므로 받는 쪽은 version으로 거른다, 기술 검토 낮음-025). 판정: 가용 0이 5초 [가정] 이어지면 ALL_HELD, 가용·홀드·결제 중이 0인 판정이 두 번 이어지면 SOLD_OUT, 매진 뒤 판매 종료 전에 좌석이 돌아오면 ON_SALE(매진 풀림). 입금 대기·결과 모름의 판매 예약은 팔린 쪽으로 센다"
        required: [eventId, status, available, held, paying, version, changedAt, eventKey]
        properties:
          eventId: { type: string }
          status: { type: string, enum: [UPCOMING, ON_SALE, ALL_HELD, SOLD_OUT, ENDED], description: "바뀐 뒤 상태. ALL_HELD는 일시 매진(가용 0, 홀드나 결제 중 남음, 대기는 이어지고 입장만 멈춤)" }
          previousStatus: { type: string, enum: [UPCOMING, ON_SALE, ALL_HELD, SOLD_OUT, ENDED], description: "바뀌기 전 상태. SOLD_OUT → ON_SALE이 매진 풀림이다(취소표 알림)" }
          available: { type: integer, description: "판정 때 가용 좌석(비트맵에서 비어 있는 판매 대상 좌석)" }
          held: { type: integer, description: "판정 때 홀드 수" }
          paying: { type: integer, description: "판정 때 결제 중인 판매 예약(승인 결과를 기다리는 PENDING) 수" }
          version: { type: integer, description: "판 번호. 회차마다 늘어나기만 하고, 받는 쪽은 지금 값보다 클 때만 적용한다" }
          changedAt: { type: string, format: date-time }
          eventKey: { type: string, format: uuid, description: "중복 제거 키(ADR-0052). 같은 사건을 다시 보내면 같은 값" }
    PurchaseSessionStarted:
      payload:
        type: object
        required: [eventId, purchaseSessionId, admissionJti, startedAt, maxStayUntil, eventKey]
        properties:
          eventId: { type: string }
          purchaseSessionId: { type: string, description: "구매 세션 ID(OrderEvent·SeatEvent·HoldAttempt의 purchaseSessionId와 같은 값)" }
          admissionJti: { type: string, description: 입장 토큰 jti → 입장 자리 식별 }
          startedAt: { type: string, format: date-time }
          maxStayUntil: { type: string, format: date-time, description: 최대 체류 시각으로 점수 갱신 }
          eventKey: { type: string, format: uuid, description: "중복 제거 키(ADR-0052). 같은 사건을 다시 보내면 같은 값" }
    PurchaseSessionEnded:
      payload:
        type: object
        required: [eventId, purchaseSessionId, admissionJti, reason, endedAt, eventKey]
        properties:
          eventId: { type: string }
          purchaseSessionId: { type: string, description: "구매 세션 ID(OrderEvent·SeatEvent·HoldAttempt의 purchaseSessionId와 같은 값)" }
          admissionJti: { type: string }
          reason: { type: string, enum: [COMPLETED, LEFT, IDLE, MAX_STAY], description: "과금 없는 결제 실패는 구매 세션을 끝내지 않고 좌석맵으로 돌아간다(planning/03 §2.2 Paying → Active, POL-009, 2026-10-13 전수 점검)" }
          endedAt: { type: string, format: date-time }
          eventKey: { type: string, format: uuid, description: "중복 제거 키(ADR-0052). 같은 사건을 다시 보내면 같은 값" }
    TicketEvent:
      payload:
        type: object
        required: [ticketId, eventId, orderId, accountId, type, occurredAt, eventKey]
        properties:
          ticketId: { type: string }
          eventId: { type: string, description: 회차 ID(ADR-0052) }
          orderId: { type: string }
          accountId: { type: string, description: 보유자 계정 ID. 분석 저장소는 적재 때 가명 처리 }
          type: { type: string, enum: [ISSUED, KEY_REGISTERED, KEY_REVOKED, TRANSFER_OFFERED, TRANSFER_ACCEPTED, TRANSFER_REJECTED, TRANSFER_WITHDRAWN, TRANSFER_EXPIRED, TRANSFERRED, TICKET_RETURNED, TICKET_RECLAIMED, CANCEL_REQUESTED, REFUNDED, VOIDED, ENTRY_SCANNED, SCAN_FLAGGED, SCAN_FLAG_RESOLVED, ENTRY_CLOSED], description: "양도 요청 수명주기와 돌려주기·회수(POL-017, ADR-0046). VOIDED는 주문의 가상계좌 입금 오류로 티켓 무효(키 폐기, 재입금하면 새로 발권, 추천 적용 2026-10-14, ADR-0062). 계정 ID만 싣고 연락처는 싣지 않는다" }
          scanId: { x-present-when: [{ type: [ENTRY_SCANNED] }], type: string, description: "ENTRY_SCANNED일 때 단말이 만든 스캔 ID(중복 제거 키)" }
          scanResult: { x-present-when: [{ type: [ENTRY_SCANNED] }], type: string, enum: [PASS, REJECT, CHECK], description: ENTRY_SCANNED일 때 }
          reason: { x-present-when: [{ type: [ENTRY_SCANNED], scanResult: [REJECT] }], type: string, description: "ENTRY_SCANNED의 거부 사유 코드(offline-gate §6.5)" }
          gateZone: { x-present-when: [{ type: [ENTRY_SCANNED] }], type: string }
          direction: { x-present-when: [{ type: [ENTRY_SCANNED] }], type: string, enum: [IN, OUT] }
          scannedAt: { x-present-when: [{ type: [ENTRY_SCANNED] }], type: string, format: date-time, description: 보정한 스캔 시각 }
          occurredAt: { type: string, format: date-time }
          eventKey: { type: string, format: uuid, description: "중복 제거 키(ADR-0052). 같은 사건을 다시 보내면 같은 값" }
    SettlementEvent:
      payload:
        type: object
        required: [promoterId, statementId, kind, pg, type, occurredAt, eventKey]
        properties:
          promoterId: { type: string }
          statementId: { type: string }
          kind: { type: string, enum: [EVENT, PRODUCT], description: "EVENT는 티켓 회차 정산서, PRODUCT는 굿즈·티켓 연동 부가 상품 상품 정산서(R3 대조 대상 아님, POL-039 ②, 추천 적용 2026-10-14, ADR-0062)" }
          eventId: { x-present-when: [{ kind: [EVENT] }], type: [string, 'null'], description: "회차. 상품 정산서는 null(ADR-0086)" }
          pg: { type: string, enum: [TOSS, PORTONE] }
          pgStore: { x-present-when: [{ pg: [TOSS] }], type: string, enum: [STANDARD, ESCROW], description: "토스페이먼츠 결제 상점(토스페이먼츠만)" }
          periodStart: { x-present-when: [{ kind: [PRODUCT] }], type: string, format: date, description: "상품 정산서의 주 시작(KST)" }
          periodEnd: { x-present-when: [{ kind: [PRODUCT] }], type: string, format: date, description: "상품 정산서의 주 끝(KST)" }
          amount: { x-present-when: [{ type: [PAYOUT_SCHEDULED, PAYOUT_COMPLETED, PAYOUT_FAILED, PAYOUT_HELD, RECEIVABLE_OPENED, RECEIVABLE_CLOSED] }], type: integer, description: 지급액이나 미수금 금액(원) }
          salesAmount: { x-present-when: [{ type: [STATEMENT_NOTIFIED] }], type: integer, description: "STATEMENT_NOTIFIED 때 판매 대금(원, ADR-0052)" }
          refundAmount: { x-present-when: [{ type: [STATEMENT_NOTIFIED] }], type: integer, description: STATEMENT_NOTIFIED 때 환급(원) }
          feeAmount: { x-present-when: [{ type: [STATEMENT_NOTIFIED] }], type: integer, description: STATEMENT_NOTIFIED 때 중개수수료(원) }
          revision: { x-present-when: [{ type: [STATEMENT_NOTIFIED] }], type: integer, description: "STATEMENT_NOTIFIED 때 정산서 판본. 다시 계산해 새로 알린 판이면 2 이상이다(settlement §4.1, 추천 적용 2026-10-29)" }
          supersedesId: { type: [string, 'null'], description: "STATEMENT_NOTIFIED 때 이 판이 대신한 옛 판의 statementId(첫 판은 null). 새 판의 통지가 옛 판을 대신한다는 것을 이 값으로 알리므로 옛 판이 SUPERSEDED가 되는 사건 종류는 따로 두지 않는다(추천 적용 2026-10-29)" }
          type: { type: string, enum: [STATEMENT_NOTIFIED, STATEMENT_DISPUTED, STATEMENT_CONFIRMED, STATEMENT_CARRIED_OVER, PAYOUT_SCHEDULED, PAYOUT_COMPLETED, PAYOUT_FAILED, PAYOUT_HELD, RECEIVABLE_OPENED, RECEIVABLE_CLOSED] }
          occurredAt: { type: string, format: date-time }
          eventKey: { type: string, format: uuid, description: "중복 제거 키(ADR-0052). 같은 사건을 다시 보내면 같은 값" }
    SettingChanged:
      payload:
        type: object
        required: [commandId, key, scope, value, actor, occurredAt, eventKey]
        properties:
          commandId: { type: string }
          key: { type: string, enum: [BOT_LEVEL, LOG_LEVEL, FEATURE_FLAG, DEGRADED_MODE, LOBBY_BANNER, PG_ASSIGNMENT, AUTOMATION_STOP], description: "FEATURE_FLAG는 비핵심 기능 끄기(명령 9), AUTOMATION_STOP은 입장 제어 자동화 긴급 정지(명령 11, admission-ctrl은 제어 gRPC로도 받음, ADR-0102). PG_ASSIGNMENT는 회차 결제사 지정(명령 12). 결제사 전환은 DEGRADED_MODE의 PAYMENT_PG_FALLBACK 값(ADR-0044)" }
          scope: { type: string, description: "PLATFORM 또는 회차 ID. 결제사 지정·전환은 회차 단위(결제사 지정은 회차 칸, ADR-0093 결정 2)" }
          value:
            description: "키마다 정한 값의 레코드(Avro 유니온, 추천 적용 2026-10-28, 기술 검토 낮음-026. 문자열 JSON이던 것을 바꿔 호환 검사가 값 모양 변화를 잡게 했다). 어느 갈래인지는 key가 정한다. 대상(기능 플래그 이름, 로그 레벨을 바꿀 서비스, Degraded 모드 이름)은 메시지 키에 있다. 재평가 모드는 강도와 따로 고르는 명령 5의 별도 매개변수이고, ENFORCE로 바꾸는 것은 commander만 한다(추천 적용 2026-10-20, ADR-0073)"
            anyOf:
              - { title: BotLevelValue, type: object, description: BOT_LEVEL(명령 5), required: [level, reassessMode], properties: { level: { type: string, enum: [RELAXED, STANDARD, AGGRESSIVE] }, reassessMode: { type: string, enum: ['OFF', SHADOW, ENFORCE] } } }
              - { title: LogLevelValue, type: object, description: "LOG_LEVEL(명령 8). 30분 뒤 기본 INFO로 돌아간다(expiresAt)", required: [level], properties: { level: { type: string, enum: [INFO, DEBUG, TRACE] } } }
              - { title: FeatureFlagValue, type: object, description: FEATURE_FLAG(명령 9), required: [enabled], properties: { enabled: { type: boolean } } }
              - { title: DegradedModeValue, type: object, description: "DEGRADED_MODE(명령 6). 결제사 전환은 대상 PAYMENT_PG_FALLBACK", required: [enabled], properties: { enabled: { type: boolean } } }
              - { title: LobbyBannerValue, type: object, description: "LOBBY_BANNER(명령 7). 미리 승인한 문구 템플릿만", required: [templateId], properties: { templateId: { type: string } } }
              - { title: PgAssignmentValue, type: object, description: "PG_ASSIGNMENT(명령 12). 회차의 기본 결제사와 대체 결제사", required: [primaryPg], properties: { primaryPg: { type: string, enum: [TOSS, PORTONE] }, fallbackPg: { type: [string, 'null'], enum: [TOSS, PORTONE, null] } } }
              - { title: AutomationStopValue, type: object, description: AUTOMATION_STOP(명령 11), required: [stopped], properties: { stopped: { type: boolean } } }
          expiresAt: { x-present-when: [{ key: [LOG_LEVEL] }], type: string, format: date-time, description: 로그 레벨 30분 자동 복귀 등 }
          actor: { type: string, format: uuid, description: "명령 기록의 가명 참조 actor_ref(UUIDv4, ADR-0149). 관리 계정 ID를 싣지 않는다. 압축 토픽이라 키마다 마지막 사건이 오래 남는다(ADR-0150)" }
          occurredAt: { type: string, format: date-time }
          eventKey: { type: string, format: uuid, description: "중복 제거 키(ADR-0052). 같은 사건을 다시 보내면 같은 값" }
    SessionTerminated:
      payload:
        type: object
        required: [accountId, sessionId, reason, terminatedAt]
        properties:
          accountId: { type: string }
          sessionId: { type: string, description: "로그인 세션 ID(액세스 토큰의 sid). 구매 세션이 아니다" }
          reason: { type: string, enum: [LOGOUT, DELETE, ADMIN_FORCE, REFRESH_REUSE, STAFF_REVOKED, MERGED, DEVICE_LIMIT, ACCOUNT_LOCKED, ROLE_CHANGED, PASSWORD_CHANGED], description: "LOGOUT은 로그아웃이다. DELETE는 계정이 없어져 끝낸 것이다: 팬의 회원 탈퇴(DELETE /v1/identity/account)와 관리 계정 삭제(POST /v1/ops/admin-accounts/{adminAccountId}/removal, 상태 REMOVED)를 함께 뜻한다(docs/features/identity.md §3 '세션 즉시 무효화 전파'의 회원 탈퇴, 관리 계정 삭제는 2026-10-30 추천 적용). REFRESH_REUSE는 리프레시 토큰 재사용 감지다. DEVICE_LIMIT는 동시 세션 한도(팬 기기 5대, 파트너·운영자 2개) 초과로 가장 오래 쓰지 않은 세션 종료(POL-019), ACCOUNT_LOCKED는 관리 계정 연속 실패 잠금(docs/features/identity.md §4). ADMIN_FORCE는 관제 콘솔의 관리 계정 세션 강제 종료(identity.proto AdminSessionService)다. ROLE_CHANGED는 관리 계정의 역할을 바꾸거나 거두거나 파트너 계정의 테넌트가 바뀌어 그 계정의 모든 세션을 끝낸 것이다(docs/security/authz-matrix.md §5.4, ADR-0157 결정 11). PASSWORD_CHANGED는 관리 계정이 비밀번호를 바꿔 그 계정의 다른 세션을 끝낸 것이다(docs/security/auth-controls.md §3.5)(두 값은 추천 적용 2026-10-30)" }
          terminatedAt: { type: string, format: date-time }
    AccountMerged:
      payload:
        type: object
        required: [mergeId, primaryAccountId, mergedAccountId, confirmedAt]
        properties:
          mergeId: { type: string }
          primaryAccountId: { type: string }
          mergedAccountId: { type: string }
          confirmedAt: { type: string, format: date-time }
    CaseRequested:
      payload:
        type: object
        required: [eventKey, kind, sourceId, category, createdAt]
        properties:
          eventKey: { type: string, format: uuid, description: "중복 제거 키. 같은 사건을 다시 보내면 같은 값" }
          kind: { type: string, enum: [INQUIRY, DISPUTE, MINOR_CONTRACT_CANCEL, CONTENT_REPORT, RIGHTS_REQUEST, VERIFICATION_APPEAL, APPEAL], description: "CsCase 종류(data.md cs_case). VERIFICATION_APPEAL은 queue-svc가 내는 봇 판정 이의 제기(설명 요구·재검토 신청)다(추천 적용 2026-10-30, docs/features/bot-defense.md §12). APPEAL은 core-svc support 모듈이 내는 소명(예매 제한·양도 회수 대상 팬의 사정 설명, openapi POST /v1/appeals)이다(추천 적용 2026-10-30, docs/features/transfer-refund.md §7.1)" }
          sourceId: { type: string, description: "문의 ID(inquiryId), 신고 대상 후기 ID(reviewId), 이의 ID(appealId, queue-svc가 접수 때 만든다), 또는 소명 ID(core DB appeal.id, support 모듈이 만든다)" }
          category: { type: string, description: "문의 유형 코드, 신고 사유 코드(SCALPING·MACRO·ABUSE·RIGHTS·ILLEGAL_FILMING·SPAM·OFF_TOPIC·OTHER), 이의 제기면 격리 때 이용자에게 보인 사유 범주(trust.proto ReasonCategory 이름, 예 REASON_CATEGORY_DEVICE_HISTORY), 또는 소명이면 대상 종류(RESTRICTION·RECLAIM). 소명의 대상 ID·계정·본문은 싣지 않고 ops-svc가 support 모듈 내부 API로 읽는다(문의와 같다)" }
          followUp: { type: boolean, default: false, description: "추가 문의면 true(기존 건을 다시 처리 중으로)" }
          hold: { type: boolean, default: false, description: "불법 촬영물 신고로 후기를 바로 가렸으면 true(FILMING_HOLD, POL-044)" }
          createdAt: { type: string, format: date-time }
    QueueAggregate:
      payload:
        type: object
        required: [eventId, second, entries, removed, admissions, soonResponses, eventKey]
        properties:
          eventId: { type: string }
          second: { type: string, format: date-time }
          entries: { type: integer }
          removed: { type: integer }
          admissions: { type: integer }
          soonResponses: { type: integer }
          eventKey: { type: string, format: uuid, description: "중복 제거 키(ADR-0052). 같은 사건을 다시 보내면 같은 값" }
    QueueEntryRecord:
      payload:
        type: object
        required: [eventId, queueEntryId, pid, entryMode, enteredAt, verifyRoute, eventKey]
        description: "사람별 대기 기록. 대기가 입장 확정·빠진 번호·로비 참가 취소·그 회차의 판매 종료나 매진으로 끝날 때 한 건(ADR-0052. 매진은 ADR-0122. 판매가 온세일 윈도우로 끝나지 않는 것은 ADR-0063 결정 11, 판매 종료 = 공연 시작 24시간 전은 ADR-0064)"
        properties:
          eventId: { type: string }
          queueEntryId: { type: string }
          pid: { type: string, description: 분석 저장소는 적재 때 회차별 가명으로 바꾼다 }
          number: { type: integer }
          entryMode: { type: string, enum: [LOBBY, AFTER_OPEN] }
          enteredAt: { type: string, format: date-time }
          firstEtaSec: { type: integer, description: 처음 보인 예상 대기(초) }
          turnAt: { type: string, format: date-time, description: 차례가 온 시각 }
          admittedAt: { type: string, format: date-time }
          admissionJti: { type: string }
          removedAt: { type: string, format: date-time }
          removeReason: { type: string, enum: [NO_CONFIRM, LEFT, BLOCKED, SALE_END, DUPLICATE, SOLD_OUT], description: "NO_CONFIRM 차례 뒤 15분 안에 입장 확정 없음, LEFT 대기 취소·로비 참가 취소, BLOCKED 추가 검증 실패·이의 기각, SALE_END 차례 전(또는 차례 뒤 입장 확정 전)에 그 회차의 판매 종료(공연 시작 24시간 전 = starts_at − 24시간, 소유자 결정 2026-10-14, ADR-0064. 온세일 윈도우 종료가 아님, ADR-0063 결정 11. 예전 이름 WINDOW_END), DUPLICATE 1인 1순번 위반 무효(입장 확정 때 다른 대기표로 이미 입장, ADR-0056), SOLD_OUT 차례 전(또는 차례 뒤 입장 확정 전)에 그 회차가 매진(회차 판매 상태 SOLD_OUT, ADR-0122. 일시 매진 ALL_HELD에는 끝나지 않음. 판매 종료와 가르려고 따로 둔다, 기술 검토 낮음-130)" }
          verifyRoute: { type: string, enum: [DIRECT, CHALLENGE_PASSED, CHALLENGE_FAILED, BLOCKED] }
          eventKey: { type: string, format: uuid, description: "중복 제거 키(ADR-0052). 같은 사건을 다시 보내면 같은 값" }
    HoldAttempt:
      payload:
        type: object
        required: [eventId, purchaseSessionId, mode, tierId, result, retryNo, latencyMs, occurredAt, eventKey]
        description: "홀드 요청 결과. 409 경합도 낸다(ADR-0052)"
        properties:
          eventId: { type: string }
          purchaseSessionId: { type: string }
          mode: { type: string, enum: [PICK, AUTO] }
          tierId: { type: string }
          sectionId: { type: string }
          result: { type: string, enum: [HELD, CONFLICT, LIMIT, ERROR] }
          autoResult: { x-present-when: [{ mode: [AUTO] }], type: string, enum: [FIRST, FIRST_SPLIT, SECOND, SECOND_SPLIT, MANUAL_REQUIRED] }
          firstHeldInSession: { type: boolean, default: false, description: "그 구매 세션의 첫 HELD일 때 true. 관제 실시간 표의 첫 홀드 퍼널(ADR-0099)" }
          retryNo: { type: integer }
          latencyMs: { type: integer }
          occurredAt: { type: string, format: date-time }
          eventKey: { type: string, format: uuid, description: "중복 제거 키(ADR-0052). 같은 사건을 다시 보내면 같은 값" }
    TrustVerdict:
      payload:
        type: object
        required: [eventId, category, action, source, occurredAt, eventKey]
        description: "봇 판정과 사후 라벨(ADR-0052). 점수 원값·규칙 가중치는 싣지 않는다"
        properties:
          eventId: { type: string }
          queueEntryId: { type: string }
          pid: { x-present-when: [{ source: [REASSESS] }], type: string, description: "사람 식별값(선택). source REASSESS 판정에만 싣는다. 재평가 후보(TrustCandidate)는 pid만 있고 그림자 모드는 IsolateWaiting을 부르지 않아 queueEntryId로 대기 기록과 이을 수 없으므로, 이 값으로 대기 기록(QueueEntryRecord)과 잇는다. 분석 저장소는 적재 때 회차별 가명으로 바꾼다(추천 적용 2026-10-20, ADR-0073)" }
          category: { type: string, enum: [PASS, CHALLENGE_PASSED, CHALLENGE_FAILED, BLOCKED, HONEYPOT, LABELED_BOT, LABELED_HUMAN] }
          action: { type: string, enum: [ALLOW, CHALLENGE, BLOCK, NONE] }
          source: { type: string, enum: [REALTIME, HONEYPOT, SAMPLE_REVIEW, POST_LABEL, REASSESS], description: "REASSESS는 대기 중 재평가(ADR-0071)" }
          shadow: { type: boolean, default: false, description: "그림자 실행 결과면 true(집행 없음, action NONE). 분석의 봇 지표는 false만 센다(ADR-0071)" }
          occurredAt: { type: string, format: date-time }
          eventKey: { type: string, format: uuid, description: "중복 제거 키(ADR-0052). 같은 사건을 다시 보내면 같은 값" }
    BehaviorSignal:
      payload:
        type: object
        required: [pid, eventId, netClass, ts, eventKey]
        properties:
          pid: { type: string }
          deviceRef: { type: string, description: "HMAC-SHA256(탐지 가명 키, 기기 식별값). trust-svc가 Kafka에 넣기 전에 바꾼다(ADR-0053)" }
          eventId: { type: string, description: "로비 입장·사전 검증을 판정한 회차(ADR-0071. 로비 입장은 추천 적용 2026-10-30, docs/features/bot-defense.md §4.1)" }
          netClass: { type: string, enum: [HOSTING, PROXY, OTHER], description: "요청 IP의 네트워크 유형(ADR-0071)" }
          asn: { x-present-when: [{ netClass: [HOSTING, PROXY] }], type: integer, description: "netClass가 HOSTING·PROXY일 때만 싣는다(ADR-0071)" }
          features: { type: object, description: "브라우저가 낸 행동 신호 요약값(openapi BehaviorSummary와 같은 필드: 포인터 이동 수·엔트로피, 입력 간격 평균·표준편차, 스크롤, ADR-0065 결정 9). 헤더 순서 같은 서버 쪽 특징은 싣지 않는다(재평가 패턴이 쓰지 않음, docs/streaming.md §5.3, 추천 적용 2026-10-22). 로비 입장에는 행동 요약이 없어 비운다(추천 적용 2026-10-30, docs/features/bot-defense.md §4.1)" }
          ts: { type: string, format: date-time }
          eventKey: { type: string, format: uuid, description: "중복 제거 키(ADR-0052). 같은 사건을 다시 보내면 같은 값" }
    PipelinePulse:
      payload:
        type: object
        required: [kind, topic, partition, producedAt]
        description: "관제 실시간 표의 심장 박동(rt-pulse가 1초마다 각 파티션에 보냄). ops-rt는 실시간 원시 표 `rt.pulse`에 싣고 그 밖 소비자는 건너뛴다. 신선도 SLI의 기준(ADR-0071·0099, docs/streaming.md §3·§4.5)"
        properties:
          kind: { type: string, enum: [PULSE] }
          topic: { type: string }
          partition: { type: integer }
          producedAt: { type: string, format: date-time }
    TrustCandidate:
      payload:
        type: object
        required: [eventId, pid, pattern, evidenceCount, windowStart, detectedAt, eventKey]
        description: "대기 중 재평가 후보(ADR-0071). 행동 요약값 원문·기기 가명은 싣지 않는다"
        properties:
          eventId: { type: string }
          pid: { type: string }
          pattern: { type: string, enum: [DEVICE_SHARE, BEHAVIOR_REPLAY] }
          evidenceCount: { type: integer, description: "10분 안 같은 기기·같은 지문의 서로 다른 pid 수" }
          windowStart: { type: string, format: date-time }
          detectedAt: { type: string, format: date-time }
          eventKey: { type: string, format: uuid, description: "SHA-256(\"PEAKET-reassess-v1\" ‖ 회차 ID ‖ pid ‖ 패턴 ‖ 10분 칸 시작)으로 만든 UUIDv8(RFC 9562 §5.8). 같은 후보를 다시 내도 같다(docs/streaming.md §5.4)" }
    RumSample:
      contentType: application/json
      payload:
        type: object
        description: "브라우저 지표 묶음 판 2(추천 적용 2026-10-21, ADR-0079 결정 15, docs/frontend.md §5.16). 사용자 식별값과 실제 주소·쿼리·조각은 싣지 않는다. 판 1의 page는 route로 바뀌었다"
        required: [schemaVersion, eventKey, app, route]
        properties:
          schemaVersion: { type: integer, enum: [2] }
          eventKey: { type: string, format: uuid, description: "중복 제거 키(ADR-0052). 같은 사건을 다시 보내면 같은 값" }
          app: { type: string, enum: [web, queue-room, partner, console, scanner] }
          route: { type: string, description: "경로 템플릿(예: /events/[id])" }
          deviceClass: { type: string, enum: [mobile, tablet, desktop] }
          navType: { type: string, enum: [navigate, reload, back_forward, prerender, soft] }
          dpl: { type: string, description: "배포 식별자(커밋 SHA)" }
          sampleRate: { type: number }
          metrics: { type: object, properties: { lcp: { type: number }, inp: { type: number }, cls: { type: number }, fcp: { type: number }, ttfb: { type: number } } }
          longTasks: { type: object, properties: { count: { type: integer }, totalMs: { type: number } } }
          errors: { type: object, properties: { count: { type: integer } } }
          apiFail: { type: object, properties: { network: { type: integer }, http4xx: { type: integer }, http5xx: { type: integer }, timeout: { type: integer } } }
          marks: { type: object, properties: { queue_reflect_ms: { type: number, description: "차례 반영 지연(NFR-002): 차례를 그린 시각(보정 시계) − serving이 내 번호를 넘은 전진 시각(QueueState.servingSteps). 보이는 탭에서 사람마다 한 번 재고, 대기실 표본과 상관없이 보낸다(ADR-0110)" }, seat_delta_e2e_ms: { type: number, description: "좌석 전파 종단 지연(NFR-004): 그린 시각(WebSocket 왕복으로 맞춘 시계) − (serverTimeMs − maxWaitMs)(ADR-0110)" }, seatmap_ready_ms: { type: number }, payment_confirm_ms: { type: number }, ws_reconnects: { type: integer }, scan_judge_ms: { type: number } } }
          attribution: { type: object, description: "INP·LCP·CLS의 원인 요소(선택자 수준, observability §11, docs/frontend.md §5.16)" }
    SubscribeSections:
      contentType: application/octet-stream
      payload: { type: string, description: "바이너리(리틀 엔디언). u8 version 1, u8 type 16, u16 count, count × u16 sectionIndex. 매번 지금 구독할 전체 집합이다(증분 아님). 좌석이 보이는 구역만 담고 축소해 좌석이 구역 색으로 합쳐지면 뺀다(ADR-0063). 프레임 길이는 4 + 2 × count 바이트여야 한다. count는 16 [가정] 이하이고, 구역 색인은 그 회차 좌석맵 판의 구역 수 미만이며 서로 겹치지 않아야 한다. 범위 밖·겹침은 4403, 16개 초과·초당 2번 [가정]을 넘는 바꾸기는 4429로 닫는다(추천 적용 2026-10-30, docs/features/seat-hold.md §7). 초안 [가정, wbs 2.6.4], docs/frontend.md §4.4" }
    SeatDeltaBatch:
      contentType: application/octet-stream
      payload: { type: string, description: '바이너리(리틀 엔디언). u8 version 1, u8 type 1, u64 serverTimeMs, u16 maxWaitMs(묶음 안에서 가장 먼저 바뀐 변경이 보내질 때까지 기다린 시간. 종단 지연은 그린 시각 − (serverTimeMs − maxWaitMs), ADR-0110), u32 seatEpoch(회차 세대. 커지면 구독 구역을 모두 스냅샷으로 다시 맞춘다. 한 묶음에 한 세대, 기술 검토 중간-040), u16 sectionCount, 구역마다 u16 sectionIndex, u32 sectionVersion, u16 count, count × (u16 seatOffset, u8 state). state 0 가능, 1 다른 분 선택(홀드·결제 예약), 2 판매(스냅샷은 가용·점유 1비트, seat-hold §2). type 2는 하트비트(u64 serverTimeMs, u64 echoClientTimeMs. TimeSync에 답할 때 받은 clientTimeMs, 그 밖에는 0), type 3은 묶음 간격 변경(u16 intervalMs). 100ms 배치(바뀐 것이 있을 때만, Degraded 1초), 약 200B 이하. 초안 [가정, wbs 2.6.1·2.6.4], docs/frontend.md §4.4' }
    Heartbeat:
      contentType: application/octet-stream
      payload: { type: string, description: '바이너리(리틀 엔디언). u8 version 1, u8 type 2, u64 serverTimeMs, u64 echoClientTimeMs. 서버가 15초 [가정]마다 보내고, TimeSync를 받으면 바로 보내며 받은 clientTimeMs를 echoClientTimeMs에 싣는다(그 밖에는 0, ADR-0110). 초안 [가정, wbs 2.6.4], docs/frontend.md §4.4.1' }
    BatchInterval:
      contentType: application/octet-stream
      payload: { type: string, description: '바이너리(리틀 엔디언). u8 version 1, u8 type 3, u16 intervalMs(100 또는 Degraded 1000). 묶음 간격이 바뀔 때만 보낸다. 초안 [가정, wbs 2.6.4], docs/frontend.md §4.4.1' }
    TimeSync:
      contentType: application/octet-stream
      payload: { type: string, description: '바이너리(리틀 엔디언). u8 version 1, u8 type 18, u64 clientTimeMs(보낼 때의 단조 시계 값). 클라이언트가 연결 직후와 60초 [가정]마다 보내고, 서버는 바로 하트비트(type 2)의 echoClientTimeMs로 돌려준다. 클라이언트는 왕복으로 서버 시각 차를 잰다(추천 적용 2026-10-28, ADR-0110). 초안 [가정, wbs 2.6.4], docs/frontend.md §4.4' }
    CommandAck:
      contentType: application/json
      payload:
        type: object
        properties:
          commandId: { type: string }
          target: { type: string }
          ackedAt: { type: string, format: date-time }
          state: { type: string, description: "명령 상태(planning/03 §2.6의 상태 이름). SSE command 사건은 상태가 바뀔 때마다 온다(ADR-0100)" }
          appliedVersion: { type: integer, description: "받는 쪽이 적용한 제어 상태의 판 번호. ACKED는 집행하는 모든 곳이 이 판 이상을 적용했다는 뜻이다(ADR-0103)" }
    OpsApproval:
      contentType: application/json
      description: "SSE approval 사건(내 승인 대기). 이름과 뜻만 정했고 본문 모양은 wbs 0.2.3에서 정한다(docs/frontend.md §4.4.4)"
      payload: { type: object }
    OpsControl:
      contentType: application/json
      description: "SSE control 사건(자동 제어 다섯 값). 이름과 뜻만 정했고 본문 모양은 wbs 0.2.3에서 정한다(docs/frontend.md §4.4.4)"
      payload: { type: object }
    OpsAutoAction:
      contentType: application/json
      description: "SSE autoAction 사건(걸린 자동 조치와 풀림). 이름과 뜻만 정했고 본문 모양은 wbs 0.2.3에서 정한다(docs/frontend.md §4.4.4)"
      payload: { type: object }
    OpsReset:
      contentType: application/json
      description: "SSE reset 사건. 다시 붙을 때 Last-Event-ID가 알림 표에 남은 1시간 [가정]보다 오래되면 보낸다. 화면은 명령·경보·승인 대기를 REST로 다시 읽는다(docs/frontend.md §4.4.4)"
      payload: { type: object }
    OpsPresence:
      contentType: application/json
      payload:
        type: object
        description: "고른 회차의 접속 운영자. 흐름을 든 ops-svc 파드가 15초 [가정]마다 ops_presence에 쓰고, 45초 [가정] 안의 행을 5초 [가정]마다 모아 보낸다(ADR-0100)"
        properties:
          eventId: { type: string }
          operators: { type: array, items: { type: object, properties: { accountRef: { type: string, description: 로그 가명 참조값 }, role: { type: string }, screen: { type: string } } } }
    OpsWidgetValue:
      contentType: application/json
      payload:
        type: object
        description: "위젯 흐름의 widget 사건. 위젯 키마다 그 위젯의 전체 값이다. 값의 모양은 위젯 키마다 openapi의 위젯 조회 응답과 같다(wbs 0.2.3, ADR-0100)"
        properties:
          widgetKey: { type: string }
          at: { type: string, format: date-time, description: 값을 계산한 시각 }
          value: { type: object }
    OpsAlert:
      contentType: application/json
      payload:
        type: object
        description: "ops-svc가 클러스터 안 Alertmanager 웹훅(메시 신원 alertmanager만 허용)으로 받아 바꾼 경보다. 억제 상태(foldedUnder)는 Alertmanager 경보 목록 API를 30초 [가정]마다 읽어 채운다. 받은 경보는 ops DB 경보 기록 표에 13개월 [가정] 둔다(추천 적용 2026-10-29, ADR-0145 결정 9, ADR-0146 결정 5, docs/features/control-tower.md §13)"
        properties:
          alertId: { type: string, description: "Alertmanager 경보 지문(fingerprint). 같은 경보의 발생과 해제를 잇는다(추천 적용 2026-10-20, ADR-0073)" }
          status: { type: string, enum: [firing, resolved] }
          startsAt: { type: string, format: date-time }
          endsAt: { type: string, format: date-time, description: "해제 때(status resolved)" }
          severity: { type: string, enum: [SEV1, SEV2, SEV3] }
          title: { type: string }
          runbookUrl: { type: string }
          dashboardUrl: { type: string }
          kind: { type: string, enum: [slo, cause, invariant, control, hygiene, legal, field, change, security, flow], description: "경보 종류. 콘솔 경보 패널의 묶음과 억제에 쓴다(ADR-0069). flow는 처리량 급감(오류 없는 장애, ADR-0070)" }
          eventId: { type: string, description: "온세일·회차 경보의 회차 ID. '이 회차 판단' 묶음에 쓴다(ADR-0069)" }
          journey: { type: string, enum: [detail, queue_entry, queue_state, hold, seat_status, payment_accept, payment_confirm], description: "여정 일곱의 경보 라벨 값: 공연 상세 detail, 대기열 진입 queue_entry, 대기 상태 전파 queue_state, 좌석 홀드 hold, 좌석 상태 전파 seat_status, 결제 접수 payment_accept, 결제 확정 payment_confirm(앞 셋은 [가정], wbs 4.2.1에서 이름 확정). 억제 규칙(같은 event_id·journey)과 admission-ctrl의 여정 필터가 같은 값을 읽는다(ADR-0069·0126, 추천 적용 2026-10-29, ADR-0145 결정 8)" }
          dependency: { type: string, description: "원인 경보의 의존성(있으면). 외부 제공자(결제사·본인확인 등)와 내부 의존(outbox-relay, kafka-trade 같은 클러스터 이름 등)을 함께 쓴다. 같은 의존성의 원인 경보를 묶는다(docs/observability.md §5, ADR-0069, 추천 적용 2026-10-29, ADR-0145 결정 8)" }
          exploreUrl: { type: string, description: "같은 시간 창과 그 SLI의 실패 조건으로 미리 채운 조회 링크. SLO 경보는 필수(ADR-0069)" }
          foldedUnder: { type: string, description: "억제되어 접힌 경보면 위 경보의 alertId. 알림은 보내지 않았고 콘솔에 접힌 줄로 보인다(ADR-0069, 추천 적용 2026-10-20, ADR-0073)" }
          context: { type: object, description: "현장 입장 경보 맥락(ADR-0051). 개인정보 없음", properties: { eventId: { type: string }, gateZone: { type: string }, kind: { type: string, enum: [DUPLICATE_SURGE, SCANNER_STALE, SCANNER_REVOKED_ACCESS] }, count: { type: integer }, deviceName: { type: string } } }
