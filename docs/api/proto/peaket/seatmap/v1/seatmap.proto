// seatmap-worker가 제공하는 좌석맵 가져오기 해석 계약. 초안(소유자 결정 2026-10-30 open-items 70번 ②, 계약 모양은 추천 적용 2026-10-30), 안내는 docs/api/proto/README.md.
// 정본: docs/features/seat-hold.md §10('좌석맵 가져오기 파일 처리'와 '별도 작업 seatmap-worker'),
// docs/security/asvs/seat-hold.md 1.3.4·1.5.1·5.2.2·15.2.5, docs/architecture.md §3.1·§3.2,
// openapi POST /v1/partner/productions/{productionId}/seatmap-imports(SeatMapImportResult), ADR-0087 결정 23.
syntax = "proto3";

package peaket.seatmap.v1;

// 부르는 쪽: core-svc catalog 모듈만. core-svc는 파트너가 올린 파일을 해석하지 않고 그대로 이 호출에 싣는다.
// seatmap-worker는 DB·Kafka·Redis 자격 증명과 AWS 권한이 없고, 나가는 통신이 막혀 있다. 입력·출력 저장소를 두지 않는다
// (원본 파일을 저장하지 않는 규칙이고, 결과는 응답으로 바로 돌려준다). image-worker와 같은 방식의 별도 배포다.
// 요청 메시지 상한 12MiB [가정], 응답 상한 8MiB [가정]이다. @grpc/grpc-js의 기본 받기 상한(4MiB)을 이 서비스의 양쪽만 늘린다.
// core-svc가 거는 데드라인은 10초 [가정], 해석 CPU 시간 상한은 5초 [가정], 파드마다 동시 처리 1이다.
// 상태를 바꾸지 않는 해석이라 멱등 키가 없다(같은 파일과 형식은 같은 결과).
// 데드라인 안에 답이 없거나 UNAVAILABLE이면 core-svc는 503과 Retry-After로 답한다.
service SeatmapImportService {
  // 파일 하나를 정한 형식으로 해석해 배치(SeatMapLayout 모양의 JSON)와 오류·무시한 요소를 돌려준다.
  // SVG는 DTD·외부 엔터티·엔터티 확장을 끈 파서로 읽고 <!DOCTYPE이 있으면 거절한다. 정한 도형 요소와 id·data-* 속성만 읽는다.
  // 업무 경고(휠체어석 W1~W3, 좌석 겹침)는 여기서 내지 않는다. core-svc가 받은 배치를 다시 검사하며 낸다.
  rpc ParseSeatmapImport(ParseSeatmapImportRequest) returns (ParseSeatmapImportResponse);
}

// 요청의 format(openapi seatmap-imports의 format과 같은 값). 파일 이름과 확장자는 보내지 않는다.
enum SeatmapFormat {
  SEATMAP_FORMAT_UNSPECIFIED = 0;
  SEATMAP_FORMAT_SVG = 1;
  SEATMAP_FORMAT_JSON = 2;
  SEATMAP_FORMAT_CSV = 3;
}

message ParseSeatmapImportRequest {
  // 올린 파일 그대로. 10MB [가정] 이하이고 압축 파일이 아닌지는 core-svc가 먼저 본다(넘으면 413, 이 호출을 하지 않는다).
  bytes file = 1;
  SeatmapFormat format = 2;
}

enum ParseStatus {
  PARSE_STATUS_UNSPECIFIED = 0;
  // 해석했다. layout_json이 있다. errors가 있으면 core-svc는 반영하지 않는 결과(ok false)로 돌려준다.
  PARSE_STATUS_PARSED = 1;
  // 해석하지 않았다. 형식과 내용이 다르거나, DOCTYPE이 있거나, 개수 상한(좌석 5만·구역 500·꼭짓점 1,000 [가정])이나
  // CPU 시간 상한을 넘었다. errors에 이유가 있고 core-svc는 422로 답한다.
  PARSE_STATUS_REJECTED = 2;
}

// 행별 오류(openapi SeatMapImportResult.errors와 같은 칸).
message ParseIssue {
  // 파일의 줄 번호(모르면 0)
  int32 line = 1;
  // 문제가 된 칸이나 요소 이름
  string field = 2;
  // 오류 코드(예: FORMAT_MISMATCH, DOCTYPE_PRESENT, TOO_MANY_SEATS, CPU_LIMIT)
  string code = 3;
}

message ParseSeatmapImportResponse {
  ParseStatus status = 1;
  // PARSED일 때만. SeatMapLayout 스키마 모양의 JSON(UTF-8). core-svc는 이것을 그대로 믿지 않고 스키마·개수 상한·업무 경고로 다시 본다.
  bytes layout_json = 2;
  repeated ParseIssue errors = 3;
  // 읽지 않고 넘긴 요소·속성 이름(script·foreignObject·image·use·style·바깥 href 등). 검증 결과의 경고로 나간다.
  repeated string ignored = 4;
}
