// purchase-svc가 제공하는 계정 병합 사전 확인 계약. 초안(추천 적용 2026-10-29, ADR-0148), 안내는 docs/api/proto/README.md.
// 정본: docs/features/identity.md §2.1(병합 차단 사유와 확정 흐름), docs/planning/03-policies-glossary.md POL-034·계정 연결 전이 표 T9,
// docs/data.md §4 경계 9(계정 병합 오케스트레이션), ADR-0038·0148(결정 3·4·6).
// 2026-10-30에 예매 제한 반영 계약(BookingRestrictionService)을 더했다(초안, 소유자 결정 2026-10-30 open-items 75번).
syntax = "proto3";

package peaket.purchase.v1;

import "google/protobuf/timestamp.proto";

// 부르는 쪽: identity-svc만. 계정 병합 제안을 만들 때(막는 사유를 화면에 보이려고)와 확정 트랜잭션 바로 앞에 부른다.
// ticket-svc·core-svc의 같은 이름 서비스와 모양이 같다. 읽기라 멱등 키가 없다. 데드라인은 1초 [가정]이다.
// 답이 없거나 기한을 넘기면 identity-svc는 확정하지 않고 503과 Retry-After로 미룬다(모르면 막는 쪽으로 닫는다, ADR-0148 결정 4).
// 확정 직전 확인과 확정 트랜잭션 사이에 대표 계정으로 새 홀드·주문이 생길 수 있다. 병합 뒤 1인 한도 검사는
// 대응표 merged_account로 계정 묶음을 함께 세어, 그 틈에서 생긴 주문도 다음 주문부터 한도에 든다(ADR-0148 결정 6).
service AccountMergeCheckService {
  // purchase-svc 데이터로 본 막는 사유를 모두 돌려준다. 막는 것이 없으면 빈 목록이다.
  rpc CheckAccountMerge(CheckAccountMergeRequest) returns (CheckAccountMergeResponse);
}

message CheckAccountMergeRequest {
  // 대표 계정(병합 뒤 남는 계정, POL-034)
  string primary_account_id = 1;
  // 흡수 계정(병합 뒤 MERGED로 잠기는 계정)
  string absorbed_account_id = 2;
}

// 계정 병합을 막는 사유 가운데 purchase-svc 데이터로 보는 것(POL-034). 두 계정 어느 쪽이든 본다.
enum MergeBlockReason {
  MERGE_BLOCK_REASON_UNSPECIFIED = 0;
  // 진행 중인 좌석 홀드가 있다(결제하는 동안 좌석을 잠시 잡아 둔 것)
  MERGE_BLOCK_REASON_SEAT_HOLD = 1;
  // 활성 구매 세션이 있다
  MERGE_BLOCK_REASON_PURCHASE_SESSION = 2;
  // 결제 승인을 기다리는 주문이 있다
  MERGE_BLOCK_REASON_PAYMENT_PENDING_ORDER = 3;
}

message MergeBlock {
  MergeBlockReason reason = 1;
  // 그 사유가 걸린 계정(primary_account_id나 absorbed_account_id)
  string account_id = 2;
  // 참조 ID. SEAT_HOLD·PURCHASE_SESSION이면 회차 ID, PAYMENT_PENDING_ORDER면 주문 ID다.
  string ref_id = 3;
}

message CheckAccountMergeResponse {
  repeated MergeBlock blocks = 1;
}

// 부르는 쪽: ops-svc만(승인 업무 '예매 제한'의 실행 T14와 소명 인정으로 푸는 때, 작업 워커의 다시 보내기).
// 초안(소유자 결정 2026-10-30, open-items 75번. 계약 모양은 추천 적용 2026-10-30), 정본은 docs/features/queue-admission.md §6 '예매 제한 확인'과
// docs/features/payment.md §2 '예매 제한 확인'. queue-svc의 같은 이름 서비스(queue/v1/queue.proto)와 모양이 같다.
// purchase-svc는 좌석 Redis s:rst:{account}에 사본을 두고, 주문 생성 때 ACTIVE이고 끝 시각 전이면 403 booking-restricted로 거절하고
// 그 구매 세션의 홀드를 푼다. 판 번호가 저장한 판보다 클 때만 반영한다. 데드라인은 1초 [가정]이다.
service BookingRestrictionService {
  rpc SetBookingRestriction(SetBookingRestrictionRequest) returns (SetBookingRestrictionResponse);
}

// 예매 제한 사본의 상태(docs/data.md booking_restriction.status의 ACTIVE·LIFTED).
enum BookingRestrictionState {
  BOOKING_RESTRICTION_STATE_UNSPECIFIED = 0;
  // 제한 중
  BOOKING_RESTRICTION_STATE_ACTIVE = 1;
  // 소명 인정 등으로 풀렸다
  BOOKING_RESTRICTION_STATE_LIFTED = 2;
}

message SetBookingRestrictionRequest {
  // 제한한 계정
  string account_id = 1;
  // ops DB booking_restriction.id. 멱등 키다.
  string restriction_id = 2;
  BookingRestrictionState state = 3;
  // 제한이 끝나는 시각(booking_restriction.ends_at). 끝이 정해지지 않았으면 비운다.
  google.protobuf.Timestamp ends_at = 4;
  // ops 제한 기록의 판 번호(booking_restriction.version). 사본이 계정마다 하나라 판도 계정마다 늘어나기만 한다. 새 제한의 판은 그 계정의 앞선 제한보다 크다(추천 적용 2026-10-30).
  int64 version = 5;
}

message SetBookingRestrictionResponse {
  // 이번 호출로 반영했으면 true, 판이 같거나 작아 바꾸지 않았으면 false.
  bool changed = 1;
}

// 부르는 쪽: ops-svc만(부정 예매 표 취소의 이의를 인정한 계정의 되돌림 단계, POL-046 ⑦. 초안, 추천 적용 2026-10-31, ADR-0171).
// 그 사건에 그 계정의 이용 제한이 있었으면 풀기(LIFT_RESTRICTION)가 끝난(Done) 뒤에 부른다. 48시간은 그때부터라, 열 때 제한 검사와 부딪치지 않는다.
// 권리는 결제 완료 때 USED가 되고, 결제가 실패하면 권리 기한 안에서 다시 시도할 수 있다(priority_grant.active_order_id로 진행 중 주문은 하나).
// 정본은 docs/features/transfer-refund.md §7.4와 docs/features/seat-hold.md §5 '우선 구매 보류'.
// 취소한 표 하나마다 부른다. purchase-svc가 ① 그 좌석이 아직 다시 팔리지 않았으면(비트가 꺼져 있고 활성 판매 행이 없음) 그 좌석을,
// ② 팔렸으면 같은 등급의 남은 좌석 하나를(자동 배정 후보 목록, 매수 1) 우선 구매 보류(seat_hold kind PRIORITY, 48시간 [가정]과 입장 시작 가운데 이른 때까지)로 잡고
// priority_grant를 만든다. 판매 종료 뒤에도 잡는다(판매 종료 규칙의 예외). ③ 둘 다 없으면 아무것도 잡지 않고 NO_SEAT로 답하고, ops-svc가 CS 처리함 건
// FRAUD_OBJECTION_COMPENSATION(부정 예매 이의 보상)을 만든다. 입장 시작 뒤에는 ENTRY_STARTED로 답한다(그때도 보상 건으로 간다).
// cancelled_ticket_id로 멱등하다. 같은 표로 다시 오면 처음 결과를 돌려준다. 표를 무상으로 되살리지 않는다. 팬은 원래 가격·취소 수수료 없이 다시 산다.
service PriorityPurchaseService {
  rpc GrantPriorityPurchase(GrantPriorityPurchaseRequest) returns (GrantPriorityPurchaseResponse);
}

message GrantPriorityPurchaseRequest {
  // 되돌림을 정한 부정 예매 사건(ops DB fraud_case.id)
  string fraud_case_id = 1;
  string event_id = 2;
  // 원래 결제자
  string account_id = 3;
  // 취소한 표(order_cancellation reason FRAUD의 ticket_id)
  string cancelled_ticket_id = 4;
  // 처리한 관리 계정 ID(감사 기록용)
  string acted_by = 5;
}

enum PriorityGrantResult {
  PRIORITY_GRANT_RESULT_UNSPECIFIED = 0;
  // 같은 좌석을 잡았다
  PRIORITY_GRANT_RESULT_SAME_SEAT = 1;
  // 같은 등급의 남은 좌석을 잡았다
  PRIORITY_GRANT_RESULT_SAME_TIER = 2;
  // 잡을 좌석이 없다(보상 건으로 간다)
  PRIORITY_GRANT_RESULT_NO_SEAT = 3;
  // 입장 시작 뒤다
  PRIORITY_GRANT_RESULT_ENTRY_STARTED = 4;
}

message GrantPriorityPurchaseResponse {
  PriorityGrantResult result = 1;
  // SAME_SEAT·SAME_TIER일 때
  string grant_id = 2;
  string seat_id = 3;
  int64 price = 4;
  google.protobuf.Timestamp expires_at = 5;
}
