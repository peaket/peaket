// ticket-svc가 제공하는 내부 티켓 계약. 초안(추천 적용 2026-10-22), 안내는 docs/api/proto/README.md.
// 정본: docs/features/payment.md §2(발권)·§4.1(예매 취소), docs/features/offline-gate.md §2(발권과 기기 키),
// docs/features/transfer-refund.md §3.1(예매 취소 조건), planning/03-policies-glossary.md §2.5(티켓 상태),
// docs/data.md(관람 후기 작성 자격), docs/architecture.md §3.1·§3.2.
syntax = "proto3";

package peaket.ticket.v1;

// 부르는 쪽: purchase-svc(발권·예매 취소), core-svc(review 작성 자격, shop 보유 확인).
service TicketService {
  // 발권(결제 승인 뒤 주문 Saga). 주문 ID로 멱등하다. 같은 주문을 다시 보내도 티켓은 한 번만 만든다.
  // 기기 키는 여기서 만들지 않는다. 팬이 월렛에서 '입장용으로 등록'을 누를 때 등록한다.
  rpc IssueTickets(IssueTicketsRequest) returns (IssueTicketsResponse);

  // 예매 취소 Saga의 '티켓 키 폐기(즉시)' 단계(docs/features/payment.md §4.1).
  // 키를 바로 폐기하고(스캐너에는 1분 변경분으로 간다) 티켓 상태를 바꾼다.
  // 조건(요청자 = 결제자 = 보유자, 진행 중인 양도 요청 없음, 공연 시작 전)은 ticket-svc 데이터라 여기서 확인한다.
  // 같은 티켓의 취소·양도·스캔이 겹치면 ticket-svc 행 잠금으로 하나만 성공한다. cancellation_id로 멱등하다.
  rpc CancelTickets(CancelTicketsRequest) returns (CancelTicketsResponse);

  // 관람 후기 작성 자격. core-svc review가 쓸 때마다 부른다(논리 DB 사이 조인을 하지 않는다).
  rpc CheckReviewEligibility(CheckReviewEligibilityRequest) returns (CheckReviewEligibilityResponse);

  // 계정이 그 회차의 유효한 티켓을 가지고 있는지. core-svc shop이 티켓 연동 부가 상품에 쓴다.
  rpc ListHeldTickets(ListHeldTicketsRequest) returns (ListHeldTicketsResponse);
}

message IssueTicketsRequest {
  string order_id = 1;
  string event_id = 2;
  // 결제자 계정. 처음에는 결제자가 보유자다.
  string payer_account_id = 3;
  // 판매 확정(SOLD)된 좌석. 게이트 구역은 ticket-svc가 좌석 배치로 정한다.
  repeated string seat_ids = 4;
}

// 티켓 상태(planning/03-policies-glossary.md §2.5). 이 계약이 돌려주는 값만 둔다.
enum TicketStatus {
  TICKET_STATUS_UNSPECIFIED = 0;
  TICKET_STATUS_ISSUED = 1;
  TICKET_STATUS_ACTIVE = 2;
  TICKET_STATUS_TRANSFER_PENDING = 3;
  TICKET_STATUS_CANCEL_REQUESTED = 4;
  TICKET_STATUS_REFUNDED = 5;
  TICKET_STATUS_VOIDED = 6;
}

message IssuedTicket {
  string ticket_id = 1;
  string seat_id = 2;
  TicketStatus status = 3;
}

message IssueTicketsResponse {
  repeated IssuedTicket tickets = 1;
}

message CancelTicketsRequest {
  string order_id = 1;
  repeated string ticket_ids = 2;
  string requested_by_account_id = 3;
  string cancellation_id = 4;
}

enum CancelTicketResult {
  CANCEL_TICKET_RESULT_UNSPECIFIED = 0;
  // 입장 시작 전 취소. 티켓은 환급 상태로 간다.
  CANCEL_TICKET_RESULT_REFUND_NOW = 1;
  // 입장 시작 뒤 취소. 티켓은 바로 폐기하고 환급은 입장 기록 마감 뒤 입장 기록이 없을 때 한다.
  CANCEL_TICKET_RESULT_REFUND_AFTER_CLOSE = 2;
  // 거부: 요청자가 결제자이자 보유자가 아니다.
  CANCEL_TICKET_RESULT_NOT_PAYER_HOLDER = 3;
  // 거부: 진행 중인 양도 요청이 있다.
  CANCEL_TICKET_RESULT_TRANSFER_PENDING = 4;
  // 거부: 공연이 시작됐다.
  CANCEL_TICKET_RESULT_EVENT_STARTED = 5;
}

message CancelTicketOutcome {
  string ticket_id = 1;
  CancelTicketResult result = 2;
}

message CancelTicketsResponse {
  repeated CancelTicketOutcome outcomes = 1;
}

message CheckReviewEligibilityRequest {
  string account_id = 1;
  string event_id = 2;
}

enum ReviewIneligibleReason {
  REVIEW_INELIGIBLE_REASON_UNSPECIFIED = 0;
  // 회차의 끝나는 시각(event.ends_at)이 아직 지나지 않았다.
  REVIEW_INELIGIBLE_REASON_NOT_ENDED = 1;
  // 그 회차 티켓의 결제자가 아니다(양도받은 보유자는 쓰지 않는다).
  REVIEW_INELIGIBLE_REASON_NOT_PAYER = 2;
  // 취소·환불·무효가 아닌 티켓이 남아 있지 않다.
  REVIEW_INELIGIBLE_REASON_NO_VALID_TICKET = 3;
  // 회차가 취소됐다.
  REVIEW_INELIGIBLE_REASON_EVENT_CANCELLED = 4;
}

message CheckReviewEligibilityResponse {
  bool eligible = 1;
  // 자격의 근거가 된 결제자 주문. core-svc가 `review.basis_order_id`로 남긴다.
  string basis_order_id = 2;
  ReviewIneligibleReason reason = 3;
}

message ListHeldTicketsRequest {
  string account_id = 1;
  string event_id = 2;
}

message HeldTicket {
  string ticket_id = 1;
  TicketStatus status = 2;
}

message ListHeldTicketsResponse {
  repeated HeldTicket tickets = 1;
}
