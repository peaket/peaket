// image-worker가 제공하는 이미지 처리 계약. 초안(추천 적용 2026-10-29, ADR-0148), 안내는 docs/api/proto/README.md.
// 정본: docs/security/asvs/catalog-review.md 5.2.1·5.4.3·15.2.5(이미지 처리 격리와 악성 코드 검사, D-T35),
// docs/data.md §1 공개 정적 객체(파생본 규격)·후기 사진(`review_image`), docs/architecture.md §3.1·§3.2,
// ADR-0062 결정 38(공연 이미지 기준), ADR-0063(홈 배너), ADR-0066(후기 사진), ADR-0130(기술 검토 중간-068), ADR-0148 결정 8.
syntax = "proto3";

package peaket.image.v1;

// 부르는 쪽: core-svc 작업 워커만. core-svc는 받은 원본을 디코딩하지 않고 비공개 격리 버킷에 넣은 뒤 core DB 작업 표에 이미지 작업을 적고,
// 작업 워커가 그것을 집어 이 호출로 맡긴다. 결과를 core DB에 반영하는 것도 작업 워커다.
// image-worker는 DB·Kafka·Redis 자격 증명이 없고, AWS 권한은 격리 버킷 읽기와 파생본 쓰기뿐이다(ADR-0130, D-T35).
// 데드라인은 30초 [가정]이다. 넘으면 작업 워커가 작업 원장에서 다시 맡긴다.
service ImageService {
  // 원본 하나를 확인하고(확장자·매직 바이트·디코딩·화소·악성 코드 검사 결과), 다시 인코딩해 메타데이터를 지운 파생본을 쓴다.
  // 악성 코드 검사 결과 태그가 '위협 없음'일 때만 디코딩한다(운영은 GuardDuty S3 악성코드 보호, 포트폴리오는 모의 검사기).
  // 검사 결과가 아직 붙지 않았으면 처리하지 않고 SCAN_PENDING으로 답하고, 위협으로 나왔으면 REJECTED(MALWARE)로 답한다.
  // 원본 객체 키로 멱등하다. 같은 원본을 다시 맡기면 같은 최종 결과(ACCEPTED·REJECTED)를 돌려준다.
  rpc ProcessImage(ProcessImageRequest) returns (ProcessImageResponse);
}

// 이미지 종류. 종류마다 크기 기준과 파생본 규격이 다르다.
enum ImageKind {
  IMAGE_KIND_UNSPECIFIED = 0;
  // 공연 포스터·상세 이미지(ADR-0062 결정 38). 파생본은 폭 320·640·960·1,280px [가정] × AVIF·WebP
  IMAGE_KIND_PRODUCTION = 1;
  // 홈 배너(가로형 1240×400 이상 [가정], ADR-0063). 파생본 규격은 공연 이미지와 같다
  IMAGE_KIND_HOME_BANNER = 2;
  // 후기 사진(짧은 변 320px 이상 [가정], ADR-0066). 파생본은 목록 240px·보기 긴 변 1,280px [가정] × WebP
  IMAGE_KIND_REVIEW_PHOTO = 3;
}

message ProcessImageRequest {
  // 격리 버킷의 원본 객체 키. 멱등 키다.
  string source_key = 1;
  ImageKind kind = 2;
}

// 처리 결과.
enum ImageStatus {
  IMAGE_STATUS_UNSPECIFIED = 0;
  // 받았다. 파생본을 썼다.
  IMAGE_STATUS_ACCEPTED = 1;
  // 받지 않았다. reject_reason에 이유가 있다. 파생본은 쓰지 않는다.
  IMAGE_STATUS_REJECTED = 2;
  // 악성 코드 검사 결과가 아직 없다. 최종 결과가 아니고, 작업 워커가 1분 [가정] 뒤 다시 맡긴다(ADR-0148 결정 8).
  IMAGE_STATUS_SCAN_PENDING = 3;
}

// 거절 사유(openapi 후기 사진 올리기 422의 reason과 같은 값).
enum ImageRejectReason {
  IMAGE_REJECT_REASON_UNSPECIFIED = 0;
  // JPEG·PNG·WebP가 아니거나 내용과 확장자가 다르다
  IMAGE_REJECT_REASON_UNSUPPORTED_TYPE = 1;
  // 10MB·화소 상한(긴 변 20,000px·4,000만 화소)을 넘는다
  IMAGE_REJECT_REASON_TOO_LARGE = 2;
  // 종류별 최소 크기에 못 미친다(후기 사진 짧은 변 320px [가정], 홈 배너 가로형 규격 [가정])
  IMAGE_REJECT_REASON_TOO_SMALL = 3;
  // 악성 코드 검사에 걸렸다(검사 결과 태그 THREATS_FOUND)
  IMAGE_REJECT_REASON_MALWARE = 4;
}

message ProcessImageResponse {
  ImageStatus status = 1;
  // ACCEPTED면 image-worker가 비공개 준비 위치에 쓴 파생본 객체 키.
  // core-svc는 종류별로 정한 접두사 안인지 확인한 뒤 공개 정적 객체로 게시한다(docs/data.md §1).
  repeated string derivative_keys = 2;
  // ACCEPTED면 디코딩한 원본의 폭·높이(px). core-svc가 종류별 범위 안인지 다시 확인한다(catalog-review 5.4.3).
  int32 width = 3;
  int32 height = 4;
  // REJECTED일 때만 채운다.
  ImageRejectReason reject_reason = 5;
}
