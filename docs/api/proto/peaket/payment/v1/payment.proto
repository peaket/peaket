// payment-svc가 제공하는 내부 결제 계약. 초안(추천 적용 2026-10-22), 안내는 docs/api/proto/README.md.
// 정본: docs/features/payment.md §2(흐름)·§2.1(결제 포트와 결과 정규화)·§2.2(결제사 선택)·§9(새 결제 일시 정지, ADR-0085),
// docs/features/settlement.md(판매자 등록·지급 묶음), docs/features/transfer-refund.md §5(일괄 환불),
// docs/architecture.md §3.2(통신 표), docs/api/guidelines.md §4(멱등)·§5(데드라인), docs/data.md(payment 표).
syntax = "proto3";

package peaket.payment.v1;

import "google/protobuf/timestamp.proto";
import "peaket/common/v1/common.proto";

// 부르는 쪽: purchase-svc(booking 모듈), core-svc(shop 모듈과 판매 승인), ops-svc(지급 묶음 승인).
service PaymentService {
  // 결제창 준비. 결제사를 고르고(결제사 전환 → 공연 지정 → 플랫폼 기본) 결제사 SDK에 넘길 값을 돌려준다.
  // 결제 시도(READY) 기록은 부르는 쪽이 자기 DB에 한다. 데드라인 300ms [가정]. 결제사를 부르지 않는다.
  // 쓰기는 시험 재개에서 받은 주문을 payment_entry_trial에 적는 것뿐이고(PRF-202), 그 밖에는 읽기만 한다(추천 적용 2026-11-09, BUILD_ORDER PRF-201).
  // 고른 결제사를 쓸 수 없으면 UNAVAILABLE이고 글은 pg-unavailable이다(다른 결제사로 넘기지 않는다, 추천 적용 2026-11-09, BUILD_ORDER PRF-190).
  // 고른 결제사가 새 결제 일시 정지거나 채널이 없거나 비활성이면 FAILED_PRECONDITION이고 글은 new-payment-paused다. 이미 받은 시험 재개 주문의 재호출은 다시 통과하고,
  // 멱등 재생(pinned_pg)은 정지를 보지 않는다(추천 적용 2026-11-09, BUILD_ORDER PRF-201).
  rpc PrepareCheckout(PrepareCheckoutRequest) returns (PrepareCheckoutResponse);

  // 승인 명령. 결제 시도에 기록된 결제사로만 승인 API를 부른다. 같은 주문의 결제사 멱등키는 confirm-{order_id}다.
  // payment-svc는 승인 명령을 받아 적은 뒤 바로 답한다(부르는 쪽 데드라인 200ms [가정]). 결과는 trade.payments로 알린다.
  // 결제사 호출은 끊지 않고 읽기 시간 초과 60초 [가정, 계약 때 확인]까지 기다리고, 채널별 동시 승인 호출 상한 안에서 보낸다.
  // 2초는 '임박' 경보와 측정의 기준일 뿐이다(docs/features/payment.md §2, 2026-10-28 기술 검토 높음-16).
  // 같은 order_id로 다시 보내면 이미 받은 명령으로 보고 같은 답을 돌려준다.
  // 결과 사건(trade.payments)이 5초 [가정] 안에 오지 않으면 부르는 쪽이 BatchGetPayments로 묻는다(당기기, ADR-0140).
  rpc ConfirmPayment(ConfirmPaymentRequest) returns (ConfirmPaymentResponse);

  // 결제 결과 당기기(docs/features/payment.md §2, 추천 적용 2026-10-29, ADR-0140).
  // purchase-svc의 '결과 늦음 점검'이 1초 [가정]마다, 승인 요청이 접수된 지 5초 [가정]가 지나도 결과를 반영하지 못한 주문을 모아 묻는다.
  // 같은 주문은 5초 [가정]에 한 번만 묻는다. 데드라인 500ms [가정], purchase-svc 파드마다 동시 요청 4개 [가정].
  // payment-svc는 payment DB 쓰기 인스턴스의 payment.order_id 유일 색인으로 읽는다(읽기 복제본은 쓰지 않는다). 결제사는 부르지 않는다.
  // 부르는 쪽은 사건으로 받은 것과 같은 처리기로 반영하고, 이미 반영한 event_seq 이하는 건너뛴다. 읽기만 하므로 멱등 키가 없다.
  rpc BatchGetPayments(BatchGetPaymentsRequest) returns (BatchGetPaymentsResponse);

  // 결제 상태 조회. 결과를 모르는 건의 정리와 대사가 쓰고, 입금 대기의 결제 상태 응답이 은행·계좌번호·입금 기한을 읽는다(추천 적용 2026-11-09, BUILD_ORDER HOT-151).
  // 원장이 없으면 NOT_FOUND다. 결제사는 부르지 않는다.
  rpc GetPayment(GetPaymentRequest) returns (GetPaymentResponse);

  // 취소(전액·부분). 결제사 멱등키는 cancel-{cancellation_id}다.
  // 예매 취소, 회차 취소 일괄 환불, 발권 불가 보상(회차 취소 확정·CS 확인 뒤, ADR-0106)이 쓴다. 실패 건의 재시도는 payment-svc 워커가 맡는다.
  // 첫 구현은 입금 대기 결제의 입금 전 취소만이고 그 밖의 상태는 FAILED_PRECONDITION이다(추천 적용 2026-11-09, BUILD_ORDER HOT-152).
  rpc CancelPayment(CancelPaymentRequest) returns (CancelPaymentResponse);

  // 지급대행 판매자 등록(판매 승인 때 core-svc가 부른다).
  // 계좌번호는 이 호출 안에서만 쓰고 저장하지 않는다. 예금주가 판매자 상호·대표자와 다르면 거부한다.
  rpc RegisterPayoutSeller(RegisterPayoutSellerRequest) returns (RegisterPayoutSellerResponse);

  // 지급 묶음 승인 알림(operator 확인과 commander 승인 뒤 ops-svc가 부른다).
  // payment-svc가 결제사 지급 요청을 시작하고, 요청 오류는 CS 처리함 건으로 알린다. batch_id로 멱등하다.
  rpc ApprovePayoutBatch(ApprovePayoutBatchRequest) returns (ApprovePayoutBatchResponse);

  // 새 결제 일시 정지 조회(payment §9, ADR-0085). purchase-svc의 홀드 만료 작업이 1초마다 자기가 맡은 회차를 묻는다.
  // 회차의 결제사는 결제사 선택(결제사 전환 → 공연 지정 → 플랫폼 기본)으로 정하고, 일시 정지 중인 회차만 돌려준다.
  // 정지 판정자가 payment DB payment_entry_pause에 쓴 상태를 모든 파드가 1초마다 읽어 답한다(ADR-0105).
  // 확인 호출 단계와 시험 재개 단계는 모두 일시 정지로 돌려준다. 모두 열거나 commander가 명령 6 해제로 열면 빠진다.
  // 읽기만 한다. 회차 1~200개 [가정], 틀리면 INVALID_ARGUMENT. 부르는 쪽 데드라인 500ms [가정](추천 적용 2026-11-09, BUILD_ORDER PRF-201).
  rpc GetNewPaymentPause(GetNewPaymentPauseRequest) returns (GetNewPaymentPauseResponse);
}

// 주문 종류.
enum OrderKind {
  ORDER_KIND_UNSPECIFIED = 0;
  // 공연 예매(purchase-svc)
  ORDER_KIND_TICKET = 1;
  // 굿즈·티켓 연동 부가 상품(core-svc shop)
  ORDER_KIND_MERCH = 2;
}

message PrepareCheckoutRequest {
  OrderKind order_kind = 1;
  string order_id = 2;
  // 회차 ID. '공연 지정' 결제사를 찾는 데 쓴다. 결제사 지정은 회차 칸이라(ADR-0093 결정 2) 판매 승인과 달리 회차 단위 그대로다.
  // 공연과 무관한 굿즈 주문이면 비운다.
  string event_id = 3;
  // 서버가 계산한 금액. 클라이언트가 보낸 값을 쓰지 않는다.
  peaket.common.v1.Money amount = 4;
  // 결제수단. openapi 결제 시도 본문의 `payMethod`와 같은 문자열이다(포트원 채널 선택에 쓴다).
  string pay_method = 5;
  string order_name = 6;
  // 결제 채널이 요구할 때만 채운다(처리방침에 수탁자로 공개, ADR-0044 결정 10).
  BuyerContact buyer = 7;
  // 부르는 쪽이 만든 결제 시도 ID(추천 적용 2026-11-09, BUILD_ORDER PRF-190).
  string attempt_id = 8;
  // 토스 구매자 키. 비우면 payment-svc가 CSPRNG 값을 만든다. 계정 ID를 쓰지 않는다.
  string customer_key = 9;
  // 이 회차에 가상계좌를 내도 되는가(POL-014). 칸이 없으면 참이다.
  optional bool virtual_account_allowed = 10;
  // 회차의 입장 시작 시각. 있으면 입금 기한이 입장 시작 24시간 전을 넘지 않는다.
  google.protobuf.Timestamp entry_opens_at = 11;
  // 멱등 재생에서 그 시도의 결제사로 고정한다. 값이 있으면 전환·지정을 보지 않고 이 결제사로 값을 만들고, 쓸 수 없으면 UNAVAILABLE이다.
  // 비우면(UNSPECIFIED) 평소처럼 고른다(추천 적용 2026-11-09, BUILD_ORDER PRF-191).
  peaket.common.v1.PgProvider pinned_pg = 12;
}

message BuyerContact {
  string email = 1;
  string phone = 2;
}

message PrepareCheckoutResponse {
  peaket.common.v1.PgProvider pg = 1;
  // 결제사 전환(감내 모드)으로 대체 결제사가 골라졌으면 true. 화면이 안내 문구를 띄운다.
  bool switched = 2;
  // 결제사 SDK에 넘길 값. 결제사마다 메시지를 따로 두어 키 이름 실수를 컴파일과 buf가 잡게 한다(openapi `PaymentAttempt.checkout`과 같은 칸).
  // 2026-10-28에 map<string, string>에서 바꿨다. 계약 검사(wbs 0.2.2)를 붙이기 전 초안이라 번호 3을 다시 썼다(README §2 '버전', 기술 검토 낮음-028).
  oneof checkout {
    TossCheckout toss = 3;
    PortoneCheckout portone = 4;
    // 결제사 시뮬레이터는 토스와 같은 값을 쓴다(부하·시험 환경 전용).
    TossCheckout simulator = 5;
  }
  // 화면에 내도 되는 결제수단(pay_method와 같은 값, 추천 적용 2026-11-09, BUILD_ORDER PRF-190).
  repeated string allowed_pay_methods = 6;
  // 입금 기한. 가상계좌를 낼 수 있을 때만 채운다.
  google.protobuf.Timestamp deposit_due_at = 7;
}

// 토스페이먼츠 결제창 값.
message TossCheckout {
  string client_key = 1;
  string customer_key = 2;
  string order_id = 3;
  string order_name = 4;
  peaket.common.v1.Money amount = 5;
  string success_url = 6;
  string fail_url = 7;
}

// 포트원 V2 결제창 값.
message PortoneCheckout {
  string store_id = 1;
  string channel_key = 2;
  // pay-{order_id}
  string payment_id = 3;
  string order_name = 4;
  peaket.common.v1.Money total_amount = 5;
  // 결제 통화. SDK에 넘기는 값의 표기는 연동 때 포트원 문서로 확인한다.
  string currency = 6;
  string redirect_url = 7;
  // 채널이 요구할 때만 채운다(처리방침에 수탁자로 공개, ADR-0044 결정 10).
  BuyerContact customer = 8;
  // 결제사가 그대로 돌려주는 값. 대사의 주문 대조(ORDER_MISMATCH)가 읽는다(추천 적용 2026-11-09, BUILD_ORDER PRF-190).
  PortoneCustomData custom_data = 9;
}

message PortoneCustomData {
  string order_id = 1;
}

message ConfirmPaymentRequest {
  string order_id = 1;
  string attempt_id = 2;
  peaket.common.v1.PgProvider pg = 3;
  // 결제창 복귀 값.
  oneof payment_ref {
    TossPaymentRef toss = 4;
    PortonePaymentRef portone = 5;
  }
  // 서버 금액. 토스는 복귀 금액과 대조하고, 포트원은 승인 API의 totalAmount로 넘겨 포트원이 대조한다.
  peaket.common.v1.Money amount = 6;
  // 회차 ID. 결제 원장 payment.event_id와 결제 사건의 eventId가 이 값이다(추천 적용 2026-11-09, BUILD_ORDER PRF-180).
  string event_id = 7;
  // 결제창 인증 시각(결제 시도의 authenticated_at). 승인 기한(인증 + 10분)의 기준이다.
  google.protobuf.Timestamp authenticated_at = 8;
  // 같은 주문의 결제 시도 순번(1부터). 결제 사건의 필수 칸 attemptNo가 이 값이다.
  int32 attempt_no = 9;
  // 회차의 입장 시작 시각(선택). 입금 오류 되돌림의 새 기한을 입장 시작 24시간 전으로 자른다(추천 적용 2026-11-09, BUILD_ORDER PRF-190).
  google.protobuf.Timestamp entry_opens_at = 10;
}

message TossPaymentRef {
  string payment_key = 1;
}

message PortonePaymentRef {
  // pay-{order_id}
  string payment_id = 1;
  string tx_id = 2;
  // 수동 승인 채널의 결제 토큰. 결과가 확정되면 지운다.
  string payment_token = 3;
}

// 결제사 응답을 정규화한 승인 결과(docs/features/payment.md §2.1 '공통 결과 코드 정규화').
enum ConfirmResult {
  CONFIRM_RESULT_UNSPECIFIED = 0;
  CONFIRM_RESULT_APPROVED = 1;
  // 이미 승인된 건. 조회로 금액이 맞으면 APPROVED와 같게 처리한다.
  CONFIRM_RESULT_ALREADY_APPROVED = 2;
  // 승인 명령을 받았고 결과는 아직이다(ConfirmPayment가 보통 돌려주는 값). 결제사가 처리 중이면 payment-svc가
  // 승인 기한 안에서 같은 멱등키로 다시 보낸다. 결과는 trade.payments와 GetPayment로 알린다.
  CONFIRM_RESULT_IN_PROGRESS = 3;
  // 거절. 좌석 PENDING을 지우고 과금 없이 실패 처리한다.
  CONFIRM_RESULT_DECLINED = 4;
  // 가상계좌 입금 대기(가상계좌를 허용한 공연만, POL-014).
  CONFIRM_RESULT_WAITING_FOR_DEPOSIT = 5;
  // 시간 초과·결제사 5xx. payment-svc가 조회로 확정한다.
  CONFIRM_RESULT_UNKNOWN = 6;
}

// 분석용 실패 범주(ADR-0052). trade.payments 사건의 failureCategory와 같은 값이다.
enum FailureCategory {
  FAILURE_CATEGORY_UNSPECIFIED = 0;
  FAILURE_CATEGORY_CARD_DECLINED = 1;
  FAILURE_CATEGORY_USER_ABORTED = 2;
  FAILURE_CATEGORY_VALIDATION = 3;
  FAILURE_CATEGORY_EXPIRED = 4;
  FAILURE_CATEGORY_PG_ERROR = 5;
  FAILURE_CATEGORY_THROTTLED = 6;
  // 입금 대기 결제의 입금 전 취소(추천 적용 2026-11-09, BUILD_ORDER HOT-152).
  FAILURE_CATEGORY_DEPOSIT_CANCELED = 7;
}

message ConfirmPaymentResponse {
  ConfirmResult result = 1;
  string payment_id = 2;
  google.protobuf.Timestamp approved_at = 3;
  // 실패일 때만 채운다.
  FailureCategory failure_category = 4;
}

message GetPaymentRequest {
  oneof key {
    string payment_id = 1;
    string order_id = 2;
  }
}

// 결제 원장 `payment.status`와 같은 값이다(docs/data.md).
enum PaymentStatus {
  PAYMENT_STATUS_UNSPECIFIED = 0;
  PAYMENT_STATUS_ACCEPTED = 1;
  PAYMENT_STATUS_AWAITING_DEPOSIT = 2;
  PAYMENT_STATUS_APPROVED = 3;
  PAYMENT_STATUS_UNKNOWN = 4;
  PAYMENT_STATUS_FAILED = 5;
  PAYMENT_STATUS_PARTIAL_CANCELED = 6;
  PAYMENT_STATUS_CANCELED = 7;
}

message GetPaymentResponse {
  string payment_id = 1;
  string order_id = 2;
  peaket.common.v1.PgProvider pg = 3;
  PaymentStatus status = 4;
  peaket.common.v1.Money amount = 5;
  // 취소한 금액의 합. 취소를 만드는 단계 전에는 0원이다(추천 적용 2026-11-09, BUILD_ORDER HOT-151).
  peaket.common.v1.Money cancelled_amount = 6;
  google.protobuf.Timestamp approved_at = 7;
  // 입금 대기일 때만 채운다. 입금이 확정되거나 입금 기한이 지나면 칸이 없다(추천 적용 2026-11-09, BUILD_ORDER HOT-151).
  VirtualAccountInfo virtual_account = 8;
}

// 가상계좌 입금 안내(docs/features/payment.md §6). 입금처 번호라 구매자의 계좌가 아니다.
message VirtualAccountInfo {
  string bank = 1;
  // 평문. 저장소에는 필드 암호화로만 있고, 복호하지 못했거나 저장하지 않았으면 비어 있다. 로그에 싣지 않는다.
  string account_number = 2;
  // 입금 기한. 결제사가 주지 않았으면 비어 있다.
  google.protobuf.Timestamp due_at = 3;
}

message BatchGetPaymentsRequest {
  // 주문 ID. 한 번에 최대 100개 [가정]이고, 넘으면 INVALID_ARGUMENT다.
  repeated string order_ids = 1;
}

message BatchGetPaymentsResponse {
  // 결제 기록이 있는 주문만 담는다. 없는 주문(승인 명령이 아직 적히지 않음)은 빠지고, 부르는 쪽이 다음 점검에서 다시 묻는다.
  repeated OrderPaymentState payments = 1;
}

// 주문 하나의 결제 원장 상태와 마지막 결제 사건(ADR-0140 결정 2).
message OrderPaymentState {
  string order_id = 1;
  string payment_id = 2;
  peaket.common.v1.PgProvider pg = 3;
  // 결제 원장의 지금 상태. ACCEPTED면 승인 중이라 다음 점검에서 다시 묻는다. UNKNOWN은 지금처럼 결제사 단독 조회 규칙이 맡는다.
  PaymentStatus status = 4;
  peaket.common.v1.Money amount = 5;
  google.protobuf.Timestamp approved_at = 6;
  // 실패일 때만 채운다. trade.payments 사건의 failureCategory와 같은 값이다.
  FailureCategory failure_category = 7;
  // 마지막 수출 사건(payment_event 행 가운데 exported = true이고 RESOLVED가 아닌 것의 순번 최대)의 eventKey. 같은 사건이 trade.payments로 늦게 와도 이 값으로 거른다.
  // 수출 사건이 없으면(아직 ACCEPTED) event_key와 event_seq를 비운다(추천 적용 2026-11-09, BUILD_ORDER PRF-180).
  string event_key = 8;
  // 마지막 결제 사건의 순번(주문마다 늘어나기만 한다). 부르는 쪽은 이미 반영한 순번 이하를 건너뛴다.
  int64 event_seq = 9;
  // 입금 대기일 때만 채운다(결제 사건의 depositDueAt과 같은 값, 추천 적용 2026-11-09, BUILD_ORDER HOT-151).
  google.protobuf.Timestamp deposit_due_at = 10;
}

message CancelPaymentRequest {
  string payment_id = 1;
  // 취소 건마다 하나. 결제사 멱등키 cancel-{cancellation_id}의 재료다.
  string cancellation_id = 2;
  // 비우면 전액 취소다.
  peaket.common.v1.Money amount = 3;
  string reason = 4;
}

// 정규화한 취소 결과(docs/features/payment.md §2.1 '결제 취소 API' 행).
enum CancelResult {
  CANCEL_RESULT_UNSPECIFIED = 0;
  CANCEL_RESULT_CANCELLED = 1;
  // 결제사가 비동기로 처리 중(포트원 REQUESTED 등).
  CANCEL_RESULT_CANCEL_PENDING = 2;
  CANCEL_RESULT_REJECTED = 3;
  CANCEL_RESULT_UNKNOWN = 4;
}

message CancelPaymentResponse {
  CancelResult result = 1;
  peaket.common.v1.Money cancelled_amount = 2;
  // 결제사가 알려 주면 채운다(포트원 남은 취소 가능 금액).
  peaket.common.v1.Money remaining_cancellable = 3;
}

// 사업자 종류. 토스페이먼츠 셀러 등록의 처음 상태가 다르다(개인사업자 APPROVAL_REQUIRED, 법인 PARTIALLY_APPROVED).
enum BusinessType {
  BUSINESS_TYPE_UNSPECIFIED = 0;
  BUSINESS_TYPE_INDIVIDUAL = 1;
  BUSINESS_TYPE_CORPORATION = 2;
}

message RegisterPayoutSellerRequest {
  string partner_id = 1;
  // 판매자 상호
  string seller_name = 2;
  // 대표자 이름
  string representative_name = 3;
  BusinessType business_type = 4;
  string bank_code = 5;
  // 저장하지 않는다. 예금주 조회와 결제사 등록에만 쓰고 메모리에서 지운다.
  string account_number = 6;
}

enum RegisterResult {
  REGISTER_RESULT_UNSPECIFIED = 0;
  REGISTER_RESULT_REGISTERED = 1;
  // 예금주가 판매자 상호·대표자와 다르다. 계좌를 폐기한다.
  REGISTER_RESULT_HOLDER_MISMATCH = 2;
  REGISTER_RESULT_PG_ERROR = 3;
}

// 토스페이먼츠 셀러 상태(docs/features/settlement.md).
enum SellerStatus {
  SELLER_STATUS_UNSPECIFIED = 0;
  SELLER_STATUS_APPROVAL_REQUIRED = 1;
  SELLER_STATUS_PARTIALLY_APPROVED = 2;
  SELLER_STATUS_KYC_REQUIRED = 3;
  SELLER_STATUS_APPROVED = 4;
}

message RegisterPayoutSellerResponse {
  RegisterResult result = 1;
  string bank_code = 2;
  // 계좌번호 끝 4자리만 돌려준다.
  string account_last4 = 3;
  string toss_seller_id = 4;
  string portone_partner_id = 5;
  SellerStatus seller_status = 6;
}

message ApprovePayoutBatchRequest {
  string batch_id = 1;
  // 확인한 operator와 승인한 commander. 두 사람은 달라야 한다.
  string confirmed_by = 2;
  string approved_by = 3;
  google.protobuf.Timestamp approved_at = 4;
}

message ApprovePayoutBatchResponse {
  // 지급 요청을 시작했으면 true. 결과는 지급 건 상태와 웹훅으로 이어진다.
  bool accepted = 1;
}

message GetNewPaymentPauseRequest {
  // 만료 작업이 맡은 회차들
  repeated string event_ids = 1;
}

message GetNewPaymentPauseResponse {
  // 일시 정지 중인 회차만 담는다. 다시 열린 회차는 빠진다.
  repeated EventPaymentPause pauses = 1;
}

message EventPaymentPause {
  string event_id = 1;
  // 이번 일시 정지가 시작된 시각. 채널이 없거나 비활성이라 멈춘 회차는 0이다(시작 시각이 정해지지 않았다, 추천 적용 2026-11-09, BUILD_ORDER PRF-201)
  google.protobuf.Timestamp paused_since = 2;
}
