// payment-svc가 제공하는 내부 결제 계약. 초안(추천 적용 2026-10-22), 안내는 docs/api/proto/README.md.
// 정본: docs/features/payment.md §2(흐름)·§2.1(결제 포트와 결과 정규화)·§2.2(결제사 선택)·§9(새 결제 일시 정지, ADR-0085),
// docs/features/settlement.md(판매자 등록·지급 묶음), docs/features/transfer-refund.md §5(일괄 환불),
// docs/architecture.md §3.2(통신 표), docs/api/guidelines.md §4(멱등)·§5(데드라인), docs/data.md(payment 표).
syntax = "proto3";

package peaket.payment.v1;

import "google/protobuf/timestamp.proto";
import "peaket/common/v1/common.proto";

// 부르는 쪽: purchase-svc(booking 모듈), core-svc(shop 모듈과 판매 승인), ops-svc(지급 묶음 승인).
service PaymentService {
  // 결제창 준비. 결제사를 고르고(결제사 전환 → 공연 지정 → 플랫폼 기본) 결제사 SDK에 넘길 값을 돌려준다.
  // 결제 시도(READY) 기록은 부르는 쪽이 자기 DB에 한다.
  rpc PrepareCheckout(PrepareCheckoutRequest) returns (PrepareCheckoutResponse);

  // 승인. 결제 시도에 기록된 결제사로만 승인 API를 부른다.
  // 결제사 호출의 데드라인은 2초다. 같은 주문의 결제사 멱등키는 confirm-{order_id}다.
  // 결과가 정해지지 않으면 UNKNOWN을 돌려주고, payment-svc가 조회로 확정한 뒤 trade.payments로 알린다.
  rpc ConfirmPayment(ConfirmPaymentRequest) returns (ConfirmPaymentResponse);

  // 결제 상태 조회. 결과를 모르는 건의 정리와 대사가 쓴다.
  rpc GetPayment(GetPaymentRequest) returns (GetPaymentResponse);

  // 취소(전액·부분). 결제사 멱등키는 cancel-{cancellation_id}다.
  // 예매 취소, 회차 취소 일괄 환불, 발권 실패 보상이 쓴다. 실패 건의 재시도는 payment-svc 워커가 맡는다.
  rpc CancelPayment(CancelPaymentRequest) returns (CancelPaymentResponse);

  // 지급대행 판매자 등록(판매 승인 때 core-svc가 부른다).
  // 계좌번호는 이 호출 안에서만 쓰고 저장하지 않는다. 예금주가 판매자 상호·대표자와 다르면 거부한다.
  rpc RegisterPayoutSeller(RegisterPayoutSellerRequest) returns (RegisterPayoutSellerResponse);

  // 지급 묶음 승인 알림(operator 확인과 commander 승인 뒤 ops-svc가 부른다).
  // payment-svc가 결제사 지급 요청을 시작하고, 요청 오류는 CS 처리함 건으로 알린다. batch_id로 멱등하다.
  rpc ApprovePayoutBatch(ApprovePayoutBatchRequest) returns (ApprovePayoutBatchResponse);

  // 새 결제 일시 정지 조회(payment §9, ADR-0085). purchase-svc의 홀드 만료 작업이 1초마다 자기가 맡은 회차를 묻는다.
  // 회차의 결제사는 결제사 선택(결제사 전환 → 공연 지정 → 플랫폼 기본)으로 정하고, 일시 정지 중인 회차만 돌려준다.
  rpc GetNewPaymentPause(GetNewPaymentPauseRequest) returns (GetNewPaymentPauseResponse);
}

// 주문 종류.
enum OrderKind {
  ORDER_KIND_UNSPECIFIED = 0;
  // 공연 예매(purchase-svc)
  ORDER_KIND_TICKET = 1;
  // 굿즈·티켓 연동 부가 상품(core-svc shop)
  ORDER_KIND_MERCH = 2;
}

message PrepareCheckoutRequest {
  OrderKind order_kind = 1;
  string order_id = 2;
  // 공연 지정 결제사를 찾는 데 쓴다. 공연과 무관한 굿즈 주문이면 비운다.
  string event_id = 3;
  // 서버가 계산한 금액. 클라이언트가 보낸 값을 쓰지 않는다.
  peaket.common.v1.Money amount = 4;
  // 결제수단. openapi 결제 시도 본문의 `payMethod`와 같은 문자열이다(포트원 채널 선택에 쓴다).
  string pay_method = 5;
  string order_name = 6;
  // 결제 채널이 요구할 때만 채운다(처리방침에 수탁자로 공개, ADR-0044 결정 10).
  BuyerContact buyer = 7;
}

message BuyerContact {
  string email = 1;
  string phone = 2;
}

message PrepareCheckoutResponse {
  peaket.common.v1.PgProvider pg = 1;
  // 결제사 전환(감내 모드)으로 대체 결제사가 골라졌으면 true. 화면이 안내 문구를 띄운다.
  bool switched = 2;
  // 결제사 SDK에 넘길 값. 키 이름은 openapi `PaymentAttempt.checkout` 설명을 따른다.
  map<string, string> checkout = 3;
}

message ConfirmPaymentRequest {
  string order_id = 1;
  string attempt_id = 2;
  peaket.common.v1.PgProvider pg = 3;
  // 결제창 복귀 값.
  oneof payment_ref {
    TossPaymentRef toss = 4;
    PortonePaymentRef portone = 5;
  }
  // 서버 금액. 토스는 복귀 금액과 대조하고, 포트원은 승인 API의 totalAmount로 넘겨 포트원이 대조한다.
  peaket.common.v1.Money amount = 6;
}

message TossPaymentRef {
  string payment_key = 1;
}

message PortonePaymentRef {
  // pay-{order_id}
  string payment_id = 1;
  string tx_id = 2;
  // 수동 승인 채널의 결제 토큰. 결과가 확정되면 지운다.
  string payment_token = 3;
}

// 결제사 응답을 정규화한 승인 결과(docs/features/payment.md §2.1 '공통 결과 코드 정규화').
enum ConfirmResult {
  CONFIRM_RESULT_UNSPECIFIED = 0;
  CONFIRM_RESULT_APPROVED = 1;
  // 이미 승인된 건. 조회로 금액이 맞으면 APPROVED와 같게 처리한다.
  CONFIRM_RESULT_ALREADY_APPROVED = 2;
  // 결제사가 처리 중. 승인 기한 안에서 같은 멱등키로 다시 부른다.
  CONFIRM_RESULT_IN_PROGRESS = 3;
  // 거절. 좌석 PENDING을 지우고 과금 없이 실패 처리한다.
  CONFIRM_RESULT_DECLINED = 4;
  // 가상계좌 입금 대기(가상계좌를 허용한 공연만, POL-014).
  CONFIRM_RESULT_WAITING_FOR_DEPOSIT = 5;
  // 시간 초과·결제사 5xx. payment-svc가 조회로 확정한다.
  CONFIRM_RESULT_UNKNOWN = 6;
}

// 분석용 실패 범주(ADR-0052). trade.payments 사건의 failureCategory와 같은 값이다.
enum FailureCategory {
  FAILURE_CATEGORY_UNSPECIFIED = 0;
  FAILURE_CATEGORY_CARD_DECLINED = 1;
  FAILURE_CATEGORY_USER_ABORTED = 2;
  FAILURE_CATEGORY_VALIDATION = 3;
  FAILURE_CATEGORY_EXPIRED = 4;
  FAILURE_CATEGORY_PG_ERROR = 5;
  FAILURE_CATEGORY_THROTTLED = 6;
}

message ConfirmPaymentResponse {
  ConfirmResult result = 1;
  string payment_id = 2;
  google.protobuf.Timestamp approved_at = 3;
  // 실패일 때만 채운다.
  FailureCategory failure_category = 4;
}

message GetPaymentRequest {
  oneof key {
    string payment_id = 1;
    string order_id = 2;
  }
}

// 결제 원장 `payment.status`와 같은 값이다(docs/data.md).
enum PaymentStatus {
  PAYMENT_STATUS_UNSPECIFIED = 0;
  PAYMENT_STATUS_ACCEPTED = 1;
  PAYMENT_STATUS_AWAITING_DEPOSIT = 2;
  PAYMENT_STATUS_APPROVED = 3;
  PAYMENT_STATUS_UNKNOWN = 4;
  PAYMENT_STATUS_FAILED = 5;
  PAYMENT_STATUS_PARTIAL_CANCELED = 6;
  PAYMENT_STATUS_CANCELED = 7;
}

message GetPaymentResponse {
  string payment_id = 1;
  string order_id = 2;
  peaket.common.v1.PgProvider pg = 3;
  PaymentStatus status = 4;
  peaket.common.v1.Money amount = 5;
  peaket.common.v1.Money cancelled_amount = 6;
  google.protobuf.Timestamp approved_at = 7;
}

message CancelPaymentRequest {
  string payment_id = 1;
  // 취소 건마다 하나. 결제사 멱등키 cancel-{cancellation_id}의 재료다.
  string cancellation_id = 2;
  // 비우면 전액 취소다.
  peaket.common.v1.Money amount = 3;
  string reason = 4;
}

// 정규화한 취소 결과(docs/features/payment.md §2.1 '결제 취소 API' 행).
enum CancelResult {
  CANCEL_RESULT_UNSPECIFIED = 0;
  CANCEL_RESULT_CANCELLED = 1;
  // 결제사가 비동기로 처리 중(포트원 REQUESTED 등).
  CANCEL_RESULT_CANCEL_PENDING = 2;
  CANCEL_RESULT_REJECTED = 3;
  CANCEL_RESULT_UNKNOWN = 4;
}

message CancelPaymentResponse {
  CancelResult result = 1;
  peaket.common.v1.Money cancelled_amount = 2;
  // 결제사가 알려 주면 채운다(포트원 남은 취소 가능 금액).
  peaket.common.v1.Money remaining_cancellable = 3;
}

// 사업자 종류. 토스페이먼츠 셀러 등록의 처음 상태가 다르다(개인사업자 APPROVAL_REQUIRED, 법인 PARTIALLY_APPROVED).
enum BusinessType {
  BUSINESS_TYPE_UNSPECIFIED = 0;
  BUSINESS_TYPE_INDIVIDUAL = 1;
  BUSINESS_TYPE_CORPORATION = 2;
}

message RegisterPayoutSellerRequest {
  string partner_id = 1;
  // 판매자 상호
  string seller_name = 2;
  // 대표자 이름
  string representative_name = 3;
  BusinessType business_type = 4;
  string bank_code = 5;
  // 저장하지 않는다. 예금주 조회와 결제사 등록에만 쓰고 메모리에서 지운다.
  string account_number = 6;
}

enum RegisterResult {
  REGISTER_RESULT_UNSPECIFIED = 0;
  REGISTER_RESULT_REGISTERED = 1;
  // 예금주가 판매자 상호·대표자와 다르다. 계좌를 폐기한다.
  REGISTER_RESULT_HOLDER_MISMATCH = 2;
  REGISTER_RESULT_PG_ERROR = 3;
}

// 토스페이먼츠 셀러 상태(docs/features/settlement.md).
enum SellerStatus {
  SELLER_STATUS_UNSPECIFIED = 0;
  SELLER_STATUS_APPROVAL_REQUIRED = 1;
  SELLER_STATUS_PARTIALLY_APPROVED = 2;
  SELLER_STATUS_KYC_REQUIRED = 3;
  SELLER_STATUS_APPROVED = 4;
}

message RegisterPayoutSellerResponse {
  RegisterResult result = 1;
  string bank_code = 2;
  // 계좌번호 끝 4자리만 돌려준다.
  string account_last4 = 3;
  string toss_seller_id = 4;
  string portone_partner_id = 5;
  SellerStatus seller_status = 6;
}

message ApprovePayoutBatchRequest {
  string batch_id = 1;
  // 확인한 operator와 승인한 commander. 두 사람은 달라야 한다.
  string confirmed_by = 2;
  string approved_by = 3;
  google.protobuf.Timestamp approved_at = 4;
}

message ApprovePayoutBatchResponse {
  // 지급 요청을 시작했으면 true. 결과는 지급 건 상태와 웹훅으로 이어진다.
  bool accepted = 1;
}

message GetNewPaymentPauseRequest {
  // 만료 작업이 맡은 회차들
  repeated string event_ids = 1;
}

message GetNewPaymentPauseResponse {
  // 일시 정지 중인 회차만 담는다. 다시 열린 회차는 빠진다.
  repeated EventPaymentPause pauses = 1;
}

message EventPaymentPause {
  string event_id = 1;
  // 이번 일시 정지가 시작된 시각
  google.protobuf.Timestamp paused_since = 2;
}
