// queue-svc가 제공하는 내부 대기열 계약. 초안(추천 적용 2026-10-22), 안내는 docs/api/proto/README.md.
// 정본: docs/streaming.md §5.3(패턴)·§5.4(후보와 eventKey)·§5.5(trust-svc의 처리),
// docs/features/queue-admission.md §7(격리 기록과 복귀), docs/features/bot-defense.md §8(격리 상한)·§12(이의 제기), ADR-0071·0156.
// 2026-10-30에 격리 '상한 도달' 결과와 이의 제기 처리 계약(VerificationAppealService)을 더했다
// (초안, 추천 적용 2026-10-30, docs/features/bot-defense.md §20, ADR-0156 결정 10·14).
syntax = "proto3";

package peaket.queue.v1;

import "google/protobuf/timestamp.proto";

// 부르는 쪽: trust-svc(대기 중 재평가가 '적용' 모드일 때).
service QueueService {
  // 아직 기다리는 사람을 추가 검증 큐로 옮긴다. 후보의 event_key로 멱등하다.
  // queue-svc는 1인 1순번 중복 확인 키로 그 사람의 대기표(로비 참가자는 참가 토큰)를 찾아 빠진 번호와 VERIFYING을 쓴다.
  // 격리를 쓰는 같은 Lua에서 그 회차의 10분 칸 재평가 격리 수와 지금 대기 인원(발급 번호 − serving − 빠진 번호)을 함께 보고,
  // 격리 수가 상한(대기 인원의 0.5% [가정])에 닿았으면 격리하지 않고 CAP_REACHED로 답한다. 대기 인원이 줄면 같은 칸의 상한도 그때 인원으로 센다
  // (추천 적용 2026-10-30, docs/features/bot-defense.md §8, ADR-0156 결정 10).
  // 격리한 사람의 사유 범주는 패턴에서 정한다(R1 RAPID_REQUESTS, R2 SHARED_PATTERN, trust.proto ReasonCategory). 추가 검증 화면과 이의 건에 쓴다.
  // 격리는 차단이 아니다. 추가 검증, 이의 제기, 설명 요구는 그대로다.
  rpc IsolateWaiting(IsolateWaitingRequest) returns (IsolateWaitingResponse);
}

// 대기 중 재평가 패턴(docs/streaming.md §5.3).
enum ReassessPattern {
  REASSESS_PATTERN_UNSPECIFIED = 0;
  // R1 기기 공유 소급
  REASSESS_PATTERN_DEVICE_SHARE = 1;
  // R2 행동 요약값 복제
  REASSESS_PATTERN_BEHAVIOR_REPLAY = 2;
}

message IsolateWaitingRequest {
  string event_id = 1;
  string pid = 2;
  // 후보 키. SHA-256("PEAKET-reassess-v1" ‖ 회차 ID ‖ pid ‖ 패턴 ‖ 10분 칸 시작)으로 만든 UUIDv8 문자열이다.
  string event_key = 3;
  ReassessPattern pattern = 4;
}

enum IsolateResult {
  ISOLATE_RESULT_UNSPECIFIED = 0;
  ISOLATE_RESULT_ISOLATED = 1;
  // 이미 입장했거나 대기가 끝났다. trust-svc는 라벨만 남긴다.
  ISOLATE_RESULT_NOT_WAITING = 2;
  ISOLATE_RESULT_ALREADY_ISOLATED = 3;
  // 그 회차의 10분 칸 재평가 격리 수가 상한에 닿아 격리하지 않았다. trust-svc는 그 후보를 그림자로 남기고 SEV3을 낸다
  // (추천 적용 2026-10-30, docs/features/bot-defense.md §8·§18).
  ISOLATE_RESULT_CAP_REACHED = 4;
}

message IsolateWaitingResponse {
  IsolateResult result = 1;
}

// 부르는 쪽: ops-svc만. 추가 검증 화면(SCR-009)에서 받은 봇 판정 이의 제기(설명 요구·재검토 신청)를 CS 처리함으로 옮기고 결과를 반영한다.
// queue-svc는 DB가 없어 이의 내용을 대기열 Redis에 판매 종료 + 7일 [가정] 동안 두고, support.cases-requested에 VERIFICATION_APPEAL 건 요청을 낸다
// (sourceId = appeal_id, category = 사유 범주 코드). ops-svc는 건을 만든 뒤 GetVerificationAppeal로 내용을 읽어 ops DB(verification_case)에 옮긴다.
// ops-svc는 업무 gRPC를 받지 않으므로 결과도 ops-svc가 먼저 알린다. 결과 호출이 실패하면 ops-svc 작업 워커가 성공할 때까지 다시 보낸다
// (초안, 추천 적용 2026-10-30, docs/features/bot-defense.md §12, ADR-0156 결정 14).
service VerificationAppealService {
  // 이의 내용 읽기. 읽기라 멱등 키가 없다. 보관 기간이 지나 내용이 없으면 NOT_FOUND다.
  rpc GetVerificationAppeal(GetVerificationAppealRequest) returns (GetVerificationAppealResponse);

  // 이의 결과 반영. case_id(CS 처리함 건 ID)와 case_version(판 번호)으로 멱등하다.
  // 저장한 판보다 클 때만 반영하고, 같거나 작으면 아무것도 바꾸지 않는다. 같은 case_id에 다른 appeal_id가 오면 ALREADY_EXISTS다.
  // 한 번 PASSED나 BLOCKED로 바꾼 대기 참여는 다시 바꾸지 않는다(NOT_ISOLATED).
  // 인정(ACCEPTED): PASSED와 통과 시각을 쓴다. 차례 전이면 원래 순번의 차례에, 차례가 지났으면 바로 다음 빈자리로 들어간다(queue-admission §6·§7, FR-020).
  //   trust-svc의 라벨 반영(TrustLabelService.ApplyLabel, LABEL_SOURCE_APPEAL_ACCEPTED)은 ops-svc가 따로 부른다.
  // 기각(REJECTED): 그 대기 참여를 끝낸다(빠진 사유 BLOCKED). 계정 제재는 아니다(SCR-009 '기각', POL-006).
  rpc ResolveVerificationAppeal(ResolveVerificationAppealRequest) returns (ResolveVerificationAppealResponse);
}

message GetVerificationAppealRequest {
  // 이의 ID. queue-svc가 접수할 때 만들고 CaseRequested.sourceId에 싣는다.
  string appeal_id = 1;
}

message GetVerificationAppealResponse {
  string appeal_id = 1;
  string event_id = 2;
  string account_id = 3;
  // 사람 식별값. ops-svc는 trust-svc 라벨 반영(ApplyLabel)에 싣는다.
  string pid = 4;
  // 이의 글. NFC 정규화 뒤 0~1,000자(grapheme)다. 비었으면 설명 요구만, 있으면 설명과 재검토 신청이다.
  string text = 5;
  // 격리했을 때 이용자에게 보인 사유 범주(trust.proto ReasonCategory의 이름. 예: REASON_CATEGORY_DEVICE_HISTORY)
  string reason_category = 6;
  google.protobuf.Timestamp received_at = 7;
  // 그 대기 참여의 지금 상태
  AppealEntryState entry_state = 8;
}

enum AppealEntryState {
  APPEAL_ENTRY_STATE_UNSPECIFIED = 0;
  // 추가 검증 큐에 있다(VERIFYING)
  APPEAL_ENTRY_STATE_VERIFYING = 1;
  // 이의 결과를 기다리는 사이 추가 검증(챌린지 + 본인확인 재통과)을 통과했다(PASSED)
  APPEAL_ENTRY_STATE_PASSED = 2;
  // 대기가 끝났다(판매 종료, 기각, 스스로 나감)
  APPEAL_ENTRY_STATE_ENDED = 3;
}

enum AppealOutcome {
  APPEAL_OUTCOME_UNSPECIFIED = 0;
  // 인정
  APPEAL_OUTCOME_ACCEPTED = 1;
  // 기각(판정을 유지함)
  APPEAL_OUTCOME_REJECTED = 2;
}

message ResolveVerificationAppealRequest {
  string appeal_id = 1;
  // CS 처리함 건 ID. 멱등 키다.
  string case_id = 2;
  // 건 상태의 판 번호. 같은 건에서 늘어나기만 한다.
  int64 case_version = 3;
  AppealOutcome outcome = 4;
}

enum ResolveAppealResult {
  RESOLVE_APPEAL_RESULT_UNSPECIFIED = 0;
  // 이번 호출로 반영했다
  RESOLVE_APPEAL_RESULT_APPLIED = 1;
  // 같은 건·판으로 이미 반영했거나 판이 작아 바꾸지 않았다
  RESOLVE_APPEAL_RESULT_UNCHANGED = 2;
  // 그 대기 참여가 이미 PASSED이거나 끝나 바꿀 것이 없다. 인정이면 trust-svc 라벨 반영은 그대로 한다
  RESOLVE_APPEAL_RESULT_NOT_ISOLATED = 3;
}

message ResolveVerificationAppealResponse {
  ResolveAppealResult result = 1;
}
